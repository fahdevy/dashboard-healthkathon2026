knya: verifikasi lebih terarah, penjelasan risiko lebih transparan dan dapat ditelusuri, serta pengelolaan dana JKN lebih akuntabel, sejalan dengan SDG 3, 9, dan 16. Pada prototype data sintetis, 100 kasus teratas didominasi kasus bermasalah (±93-95%); pengukuran waktu telusur dan false positive rate akan dilakukan bersama auditor pada tahap berikutnya."],"r":[{"n":"Djaka Santosa","s":[3,3,2,2,2,2]},{"n":"I Made Karistiawan","s":[3,2,2,1,1,2]},{"n":"Agung Waluyo","s":[3,3,2,2,2,3]}]},{"id":"2607","tim":"Cah ora waras","inov":"Masalah & Urgensi","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2607_Panduan Pembuatan Proposal Peserta Healthkathon 2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Buktikan bahwa masalah yang Anda angkat nyata, mendesak, dan berdampak besar terhadap keberlangsungan Program JKN. Gunakan data kredibel untuk\nmemperkuat argumen Anda.\nSpesifisitas Masalah\nFokus pada satu kategori challenge yang tajam. Sub-kategori boleh beragam","selama masih dalam satu kategori yang dipilih dan saling berkaitan.\nDukungan Data\nGunakan data kredibel dengan sumber yang jelas. Quantifikasi besaran\nmasalah — angka kerugian, frekuensi kejadian, atau populasi yang\nter","Bebas memilih metode: storytelling, studi kasus, atau analogi. Visualkan data\ndengan gaya Anda — grafik, ikon, atau ilustrasi yang mudah dipahami","masalah — angka kerugian, frekuensi kejadian, atau populasi yang\nYang buruk"],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2640","tim":"IT Special Force","inov":"GARDA (Generative AI Risk Detection & Anallytic) Klaim JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2640_GARDA JKN.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["Fraud pada Program JKN tidak selalu tampak sebagai klaim yang aneh. Banyak kasus terlihat wajar jika diperiksa satu per satu, sementara polanya baru terlihat saat dokumentasi klinis, bukti pelayanan, kronologi, dan hubungan antar-kasus dianalisis bersama. GARDA JKN hadir untuk membantu membuktikan realitas klinis di balik klaim, menemukan pola berulang, dan memprioritaskan kasus yang perlu ditinjau lebih lanjut.","Mengembangkan GARDA JKN sebagai sistem pendukung investigasi fraud yang membantu verifikator menemukan kasus prioritas secara lebih cepat dan berbasis bukti. GARDA menggabungkan kemiripan semantik, kesesuaian bukti klinis, kronologi, dan jejaring antar-kasus untuk menghasilkan alasan tinjauan yang jelas, sementara keputusan akhir tetap berada pada manusia.","GARDA JKN (Generative AI Risk Detection & Analytics) adalah platform forensik klinis digital yang dirancang untuk menemukan pola risiko fraud yang sulit terlihat jika klaim diperiksa satu per satu. GARDA tidak sekadar mencari klaim yang aneh, tetapi memeriksa apakah realitas klinis di balik klaim dapat dibuktikan. Sistem menghubungkan dokumentasi klinis, bukti pelayanan, kronologi, data klaim, dan hubungan antar-entitas melalui empat mesin utama: kloning semantik, kesesuaian bukti klinis, forensik waktu, dan analitik graf. Hasilnya bukan vonis fraud, melainkan prioritas tinjauan yang disertai alasan dan bukti yang dapat ditelusuri. Dengan pendekatan ini, verifikator, auditor, dan investigator dapat fokus pada kasus yang paling perlu diperiksa tanpa menghilangkan peran manusia dalam pengambilan keputusan. Prototipe GARDA telah memiliki dashboard, investigation queue, case forensic view, evidence mapper, timeline, fraud graph, explainability, human review, dan audit trail.","GARDA JKN diharapkan membantu verifikator, auditor, dan investigator memusatkan perhatian pada kasus yang paling perlu ditinjau dengan dukungan bukti yang lebih terstruktur. Bagi fasilitas kesehatan, GARDA dapat membantu menemukan masalah dokumentasi dan klaim lebih dini. Dalam jangka panjang, solusi ini berpotensi meningkatkan efisiensi verifikasi, memperkuat transparansi, mengurangi risiko pembayaran yang tidak semestinya, dan mendukung keberlanjutan Program JKN."],"r":[{"n":"Agung Waluyo","s":[4,4,4,3,4,4]},{"n":"Paul Donald P","s":[3,3,2,2,3,3]},{"n":"Tria Sofa Purnama","s":[4,4,3,3,3,3]}]},{"id":"2010","tim":"3Y","inov":"Healthkathon2026_EfisiensiRisiko_Tim3Y_Proposal","kat":"Efisiensi Risiko pada Peserta JKN","f":"2010_Healthkathon2026_EfisiensiRisiko_Tim3Y_Proposal.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Prevalensi asma di Indonesia mencapai 4,5% (>12 juta penderita). Pada JKN, serangan asma akut (eksaserbasi) memicu pembengkakan klaim UGD dan rawat inap. Hal ini dipicu 2 masalah utama: 1) Rendahnya kepatuhan penggunaan inhaler pengontrol (30–70%), dan 2) Ketiadaan data objektif pemantauan risiko lingkungan (PM2.5, suhu, kelembaban). Dampaknya, timbul klaim pelayanan berulang yang tidak perlu (unnecessary services) serta risiko manipulasi klaim resep obat/alkes inhaler tanpa verifikasi dosing.","1. Memitigasi risiko serangan asma berulang melalui deteksi dini kualitas udara lokal dan dose-tracking inhaler real-time.\n2. Menurunkan klaim pelayanan yang tidak perlu (unnecessary services) di UGD dan rawat inap faskes rujukan hingga 35–45%.\n3. Menyediakan sistem verifikasi data telemetri objektif (Proof of Adherence & Environmental Exposure) sebagai Decision Support System (DSS) bagi BPJS Kesehatan untuk menjamin integritas klaim resep obat/alkes secara efisien dan akuntabel.","AEROVA adalah ekosistem smart inhaler companion berbasis AIoT untuk efisiensi pelayanan JKN. Solusi ini terdiri dari 3 pilar:\n1. Smart Attachment (Hardware): Casing pintas portabel (11x4,5x3 cm) pada inhaler MDI standar berbasis ESP32, dilengkapi sensor AHT10 (suhu/kelembaban), DFR SEN0460 (PM2.5), dan modul SIM7600G (LTE+GPS mandiri).\n2. Edge AI Engine: Permodelan Random Forest yang mengklasifikasikan tingkat risiko lingkungan & kepatuhan ke dalam status Rendah, Sedang, atau Tinggi. Jika risiko tinggi, sistem mengaktifkan peringatan dini visual (LED) dan audio (buzzer) lokal serta notifikasi aplikasi.\n3. Dashboard Verifikasi JKN: Telemetri dikirimkan secara cloud untuk menyajikan Proof of Adherence dan Proof of Exposure bagi verifikator BPJS Kesehatan.\nSaat ini kematangan purwarupa mencapai 50–60% dengan hardware teruji, data pipeline real-time (<1 dtk), dan desain 3D enclosure presisi. Seluruh pengembangan mematuhi UU PDP No. 27/2022 menggunakan data simulasi dan enkripsi end-to-end.","1. Mengubah perawatan reaktif mahal menjadi preventif, menekan klaim UGD dan rawat inap eksaserbasi asma hingga 35–45%.\n2. Menghilangkan potensi klaim fiktif/resep inhaler berulang melalui verifikasi data fisik dosing real-time.\n3. Meningkatkan kepatuhan obat dan mencegah serangan parah via peringatan dini lingkungan.\nSkalabilitas Nasional: Hardware modular low-cost dan data geospatial risk mapping mendukung kebijakan promotif-preventif"],"r":[{"n":"Paul Donald P","s":[3,4,3,2,3,2]},{"n":"Tria Sofa Purnama","s":[3,4,3,2,2,2]},{"n":"Ikhlasul Amalia","s":[3,3,2,2,3,2]}]},{"id":"2256","tim":"Sentinel-JKN","inov":"SENTINEL-JKN: Otorisasi Cerdas Prospektif untuk Mencegah Inefisiensi Biaya Prosedur Katastropik JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2256_SENTINEL-JKN_Proposal.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Penyakit katastropik menyerap dana JKN lebih dari Rp50,28 T per tahun, dengan klaim penyakit jantung mencapai Rp17,35 T (layanan cathlab/PCI menyerap lebih dari Rp3,5 T dari 138 ribu+ kasus). Sistem verifikasi klaim retrospektif saat ini memiliki keterbatasan: beban audit manual pasca-tindakan memicu dispute klaim, membebani arus kas faskes, serta gagal memproteksi pasien dari risiko tindakan invasif yang berpotensi tidak memenuhi indikasi medis secara tepat.","Menggeser titik kendali verifikasi dari audit retrospektif (pasca-klaim) menjadi otorisasi prospektif sebelum tindakan berbiaya tinggi dilakukan.   \nMenyediakan kepastian penjaminan instan (<3 detik) bagi faskes dan DPJP berbasis rule klinis PPK/PNPK yang transparan dan dapat diaudit.   \nMemitigasi potensi kebocoran dana akibat upcoding, unbundling, dan unnecessary services melalui pengawasan pola pengajuan secara berkala.","SENTINEL-JKN adalah platform pre-authorization klinis cerdas yang mengevaluasi kelayakan tindakan medis berbiaya tinggi secara prospektif. Sistem mengintegrasikan data terstruktur (form DPJP/mock FHIR SatuSehat) ke dalam arsitektur dua lapis:   \nTier-1 (Rule Engine): Menguji kepatuhan indikasi medis berbasis PPK/PNPK secara deterministik untuk memberikan keputusan Auto-Approved (<3 detik) atau eskalasi.   \nTier-2 (Human-in-the-loop): Dashboard verifikator medis untuk menelaah kasus Pending Review/Flagged, dibantu AI Narrative Explainer dan Narrative Consistency Cross-Check.   \nDilengkapi Submission Pattern Monitor guna mendeteksi anomali pola pengajuan jangka panjang faskes/DPJP serta jalur banding resmi. Seluruh rule bersifat auditable dan transparan untuk mencegah bias penolakan sepihak.","BPJS Kesehatan: Mencegah kebocoran anggaran secara riil sebelum dana keluar, menekan rasio klaim dispute, serta mengoptimalkan alokasi pembiayaan katastropik.   \nFasilitas Kesehatan: Memperoleh kepastian pembayaran (payment assurance) di muka, mengurangi risiko finansial/gagal klaim, dan memperlancar arus kas.   \nPeserta JKN: Mendapatkan perlindungan langsung dari prosedur invasif yang tidak perlu dan kepastian terapi berbasis bukti medis yang valid."],"r":[{"n":"Tria Sofa Purnama","s":[4,4,2,2,2,2]},{"n":"Ikhlasul Amalia","s":[4,3,2,2,2,2]},{"n":"Husnun Nashir","s":null}]},{"id":"2324","tim":"NEX.AI","inov":"JEIH: JKN Employer Intelligence Hub","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2324_Proposal.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN telah berkembang menjadi ekosistem perlindungan kesehatan terbesar di Indonesia. Namun, peningkatan cakupan perlu diikuti kemampuan mendeteksi risiko kepatuhan pemberi kerja secara lebih proaktif. Ketidaksesuaian antara data administratif dan kondisi tenaga kerja aktual dapat menyebabkan pekerja belum terlindungi optimal. JEIH hadir sebagai platform intelligence berbasis AI untuk mengidentifikasi protection gap, memprediksi risiko, dan memperkuat keberlanjutan Program JKN.","Mengembangkan JEIH (JKN Employer Intelligence Hub) sebagai platform intelligence berbasis AI yang mampu mendeteksi dini risiko pemberi kerja, mengidentifikasi potensi kesenjangan perlindungan pekerja, serta memberikan rekomendasi tindakan berbasis data. Solusi ini bertujuan membantu BPJS Kesehatan meningkatkan efektivitas monitoring, memperkuat kepatuhan pemberi kerja, memperluas perlindungan pekerja, dan mendukung keberlanjutan Program JKN.","JEIH (JKN Employer Intelligence Hub) merupakan platform AI-powered workforce protection intelligence yang dirancang untuk membantu BPJS Kesehatan mendeteksi dan mengelola risiko pemberi kerja secara lebih proaktif. JEIH berfungsi sebagai intelligence layer yang melengkapi sistem digital JKN yang telah ada dengan mengubah data administratif menjadi informasi risiko yang dapat ditindaklanjuti. Melalui analisis data kepesertaan, pola perubahan data, karakteristik industri, dan benchmark sektor usaha, JEIH menghasilkan indikator seperti Employer Protection Index, Protection Gap Score, dan penjelasan faktor risiko (risk driver explanation). Sistem ini membantu mengidentifikasi potensi pekerja yang belum terlindungi, ketidaksesuaian pelaporan, serta risiko kepatuhan pemberi kerja secara lebih dini. JEIH bukan menggantikan sistem BPJS Kesehatan, melainkan memperkuat kemampuan monitoring dari pendekatan reaktif menuju prediktif. Dengan dukungan explainable AI, rekomendasi berbasis data, dan","Implementasi JEIH memberikan dampak strategis bagi keberlanjutan Program JKN melalui peningkatan kemampuan deteksi dini risiko pemberi kerja, pengurangan potensi kesenjangan perlindungan pekerja, serta optimalisasi monitoring berbasis data. BPJS Kesehatan dapat melakukan intervensi lebih tepat sasaran, pemberi kerja terdorong meningkatkan kepatuhan, dan lebih banyak pekerja memperoleh perlindungan JKN secara berkelanjutan."],"r":[{"n":"Ikhlasul Amalia","s":[4,4,3,3,3,3]},{"n":"Husnun Nashir","s":null},{"n":"Arman Annas Putra","s":[4,3,3,3,3,3]}]},{"id":"2340","tim":"My Hzays","inov":"BPJS Fraud Detector Engine","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2340_Healthkathon_2026_Fraud_Detector_Proposal.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["JKN melindungi lebih dari 270 juta peserta, namun kerugian akibat fraud klaim mencapai triliunan rupiah per tahun (Kemenkes RI, 2023). Verifikasi manual BPJS Kesehatan sulit menjangkau volume klaim yang sangat besar. Analisis 9.043 klaim RS Setia Mitra (Juli 2025) menemukan 11,2% klaim terindikasi fraud, didominasi satu pola: fragmentasi klaim multipoli tanpa DPJP utama, yang menyumbang 85,4% dari seluruh fraud RJTL yang terdeteksi","Membangun engine deteksi fraud klaim berbasis machine learning (Decision Tree C4.5 + SMOTE) yang mampu mendeteksi pola fragmentasi klaim secara real-time, transparan, dan dapat diaudit. Engine ini bertujuan mengubah verifikasi klaim dari proses reaktif pasca-klaim menjadi pencegahan proaktif sejak klaim dibuat di rumah sakit, sekaligus menjadi lapisan verifikasi berbasis risiko bagi BPJS Kesehatan.","Fraud Detector Engine adalah sistem deteksi kecurangan klaim kesehatan berbasis machine learning (Decision Tree C4.5 + SMOTE) yang mengubah verifikasi klaim dari proses reaktif pasca-klaim menjadi pencegahan proaktif sejak klaim dibuat. Model menghasilkan 24 aturan IF-THEN transparan dan dapat diaudit (akurasi 94,14%, Recall 81,86%, AUC-ROC 0,893), klaim multipoli tanpa DPJP utama merupakan pola fraud paling dominan pada data uji. Engine memiliki 7 fitur (Update Dataset, Dashboard, Pola Fraud, Evaluasi Model, Prediksi Klaim, Periode Analisa, Formulasi & Metode) dan telah terintegrasi sebagai modul pilot di SIMRS RS Setia Mitra. Alur kerja: casemix menekan \"Prediksi Klaim\" sebelum kirim ke E-Klaim; jika FRAUD, klaim otomatis ditahan hingga dilampirkan klarifikasi dan bukti dukung; manajemen memantau klaim berisiko, estimasi rupiah tak tertagih, dan analisis naratif otomatis AI lewat dashboard. Keputusan akhir tetap di tangan verifikator manusia (human-in-the-loop).","Recall deteksi fraud meningkat dari 37,25% menjadi 81,86% (+44,61 poin), menambah 91 kasus fraud terdeteksi (76 menjadi 167), dengan estimasi nilai terlindungi ± Rp511 juta/tahun untuk satu RS setara RS Setia Mitra. Bagi RS: klaim lebih cepat cair dan patuh regulasi. Bagi BPJS: verifikasi lebih efisien dan dashboard monitoring lintas RS. Bagi JKN: keberlanjutan pembiayaan kesehatan nasional yang lebih terjaga"],"r":[{"n":"Husnun Nashir","s":null},{"n":"Arman Annas Putra","s":[4,3,3,3,2,2]},{"n":"Djaka Santosa","s":[4,2,3,3,3,2]}]},{"id":"2405","tim":"Polkesraya Press","inov":"KlaimGuard AI: Verifikator Kelengkapan & Konsistensi Klaim Lintas Faskes","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2405_KlaimGuard AI - Proposal Healthkathon 2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim JKN tahun 2025 mencapai Rp201 triliun dengan rasio klaim di atas 100% dan defisit Rp14,61 triliun. Sebagian risiko berasal dari fraud (phantom billing, upcoding, unbundling), namun sebagian lain dari dokumentasi klaim tidak lengkap/konsisten, seperti dugaan klaim fisioterapi tanpa bukti pendukung yang pernah disorot KPK. Verifikasi saat ini reaktif dan bergantung sampling acak; klaim ganda lintas faskes sulit terdeteksi karena secara statistik terlihat normal per klaim.","Membangun sistem verifikasi 3 lapis (kelengkapan dokumentasi, skor anomali rule-based + Isolation Forest, dan korelasi entitas pasien lintas faskes) yang membantu faskes dan verifikator BPJS Kesehatan memastikan klaim lengkap, konsisten, dan bebas duplikasi sebelum diproses — membantu faskes lolos verifikasi lebih cepat, bukan sekadar mengejar sanksi, sekaligus melindungi keberlangsungan dana JKN.","KlaimGuard AI adalah sistem verifikasi klaim JKN 3 lapis. Layer 1 (rule-based) mendeteksi signature phantom billing, upcoding, dan unbundling. Layer 2 (Isolation Forest) menghasilkan skor anomali statistik per kelompok diagnosis. Layer 3 (baru) mengorelasikan identitas pasien, diagnosis, dan tanggal layanan lintas faskes untuk menangkap klaim ganda/berulang yang lolos dari scoring anomali per-klaim. Sistem menghasilkan dua keluaran untuk verifikator: antrian risiko terurut (Track A) dan daftar duplikasi lintas faskes (Track B) — bukan satu skor gabungan, karena sifat kedua masalah berbeda. Prototipe end-to-end diuji pada 5.044 klaim sintetis (data JKN riil tidak digunakan, sesuai batasan kompetisi): gabungan Track A+B mencapai recall 100% dan precision 70,5% dengan hanya meninjau 6,9% klaim. Manusia tetap memutuskan — sistem tidak pernah menyetujui/menolak klaim otomatis.","Meninjau ~6,9% volume klaim (bukan sampling acak) menjangkau ~100% klaim berpola fraud/tidak lengkap pada data uji sintetis — estimasi awal, perlu divalidasi pada data riil. Manfaat: BPJS Kesehatan (verifikasi lebih efisien & terarah), faskes (lolos verifikasi lebih cepat, beban revisi dokumen berkurang), peserta JKN (keberlangsungan dana lebih terjaga)."],"r":[{"n":"Arman Annas Putra","s":[4,3,3,3,2,2]},{"n":"Djaka Santosa","s":[4,3,3,3,2,2]},{"n":"I Made Karistiawan","s":null}]},{"id":"2703","tim":"Yolo Aje","inov":"Radar Kepatuhan: Penentu Sasaran Pemeriksaan Kepatuhan Pemberi Kerja Berbasis Rekonsiliasi Data","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2703_Proposal_Radar_Kepatuhan_Yolo_Aje_Healthkathon2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Rasio klaim JKN mencapai 108,72% per April 2026 dan aset DJS hanya cukup membayar klaim 1,48 bulan, sehingga setiap rupiah iuran menentukan keberlanjutan program. Di sisi pemberi kerja, pendaftaran pekerja sebagian dan pelaporan upah lebih rendah tidak pernah tercatat sebagai tunggakan karena iurannya tidak pernah ditagihkan. Pemeriksaan kepatuhan masih bertumpu pada tunggakan tercatat, pengaduan per tiket, dan data yang disiapkan pihak yang diperiksa.","Membantu petugas BPJS Kesehatan menentukan badan usaha yang paling layak diperiksa lebih dulu secara berbasis data. Sistem memadankan upah dan kepesertaan tiap pekerja lintas sumber, menemukan iuran yang tidak pernah ditagihkan, dan menyusun antrean pemeriksaan menurut nilai yang paling mungkin dipulihkan, lengkap dengan alasan yang dapat diperiksa, sambil melindungi data pribadi dan pekerja yang melapor.","Radar Kepatuhan adalah sistem penentu sasaran pemeriksaan kepatuhan pemberi kerja untuk lima modus: PDUK, upah dilaporkan lebih rendah, penggelapan atau penundaan setoran, misklasifikasi status kerja, dan manipulasi data mutasi. Sistem bekerja dalam tiga langkah. Padankan: upah dan status kepesertaan tiap pekerja dicocokkan dari data PPU, BPJS Ketenagakerjaan, PPh 21, WLKP, dan laporan pekerja dengan NIK terpseudonim. Nilai: 12 aturan deteksi, model anomali Isolation Forest, dan pembanding kelompok sejenis menghasilkan skor risiko 0 sampai 100 beserta alasannya. Prioritaskan: antrean diurutkan menurut nilai harapan pemulihan, yaitu skor dikali estimasi iuran hilang, sesuai kapasitas pemeriksa. Keluarannya berupa dasbor petugas dan modul transparansi iuran bagi pekerja yang dapat disematkan di Mobile JKN. Petugas tetap memutuskan; sistem hanya mengurutkan. Prototipe dibangun dengan Go, Python, PostgreSQL, dan SvelteKit, lalu diuji dengan data sintetis berlabel.","Pemeriksaan diarahkan ke badan usaha dengan potensi koreksi iuran terbesar, sehingga kapasitas petugas yang terbatas menghasilkan pemulihan lebih tinggi. Iuran yang sebelumnya tidak terlihat dapat diestimasi dalam rupiah, pekerja mendapat manfaat sesuai upah sebenarnya, dan badan usaha yang patuh terlindungi dari persaingan tidak adil. Dampak diukur per pemeriksaan: hit rate, nilai koreksi, waktu deteksi, dan precision."],"r":[{"n":"Djaka Santosa","s":[4,3,3,2,2,3]},{"n":"I Made Karistiawan","s":null},{"n":"Agung Waluyo","s":[4,4,4,3,3,4]}]},{"id":"2708","tim":"ErsyaTech","inov":"JEJAK JKN — Jejak Episode & Jaringan Anomali Klaim","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2708_PROPOSAL_JEJAK_JKN.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["JKN menaungi 284,3 juta peserta (BPJS, data 31 Jul 2026), sehingga sinyal anomali kecil berdampak besar secara agregat. Kemenkes/BPKP menemukan dugaan phantom billing pada 3 RS swasta (Jul 2024), menunjukkan pola ini bukan skenario teoritis. Permenkes No.16/2019 memberi mandat deteksi fraud memakai data klaim, riwayat pelayanan, dan pengaduan. Namun verifikasi klaim saat ini membaca klaim satu per satu, sehingga pola pengulangan dan kemiripan struktur klaim antar-klaim sulit terlihat.","Membangun mesin risk-intelligence yang memetakan hubungan antar-klaim untuk mendeteksi pola phantom/repeat billing dan claim cloning di fasilitas kesehatan. Sistem mengubah klaim menjadi episode dan jaringan relasi, menghasilkan risk score yang dapat dijelaskan (reason codes) beserta evidence packet, sehingga reviewer dapat memprioritaskan kasus berbasis bukti. Tujuannya menambah lapisan verifikasi yang sudah ada, bukan menggantikannya.","JEJAK JKN merangkai claim row menjadi episode fingerprint (diagnosis, prosedur, LOS, drug set, cost bucket, time gap), lalu menjadi claim graph yang menghubungkan pasien-fasilitas-prosedur-obat antar-klaim. Deteksi memakai empat layer: (1) integrity rules untuk duplikasi/replay yang deterministik dan mudah diaudit; (2) claim fingerprint + ANN (MinHash/LSH) untuk pencarian near-clone tanpa kompleksitas O(n²); (3) temporal episode model untuk pola inter-visit gap dan repeat cadence; (4) heterogeneous temporal graph (opsional, shadow-mode) untuk relasi kompleks lintas entitas. Skor risiko digabung lewat calibrated ensemble dengan uncertainty gate (PRIORITY/ABSTAIN), disajikan sebagai evidence packet berisi reason codes, timeline episode, dan graph neighborhood dalam satu layar. LLM (opsional) hanya merangkai reason codes menjadi bahasa manusia, tidak mengubah skor. Sistem tidak menyediakan tombol auto-reject; keputusan akhir tetap di tangan reviewer manusia.","JEJAK menggeser fokus dari volume alert menjadi risk concentration: lebih sedikit kasus, lebih kaya bukti. Target pilot: recall =90% terhadap anomaly injection, precision@Top-100 =70%, 100% alert disertai evidence, dan calibration coverage =90%. Reviewer mendapat kasus yang sudah terhubung lintas klaim, mengurangi waktu merakit konteks manual. Dampak finansial/operasional tidak di-overclaim di tahap prototipe dan baru diukur lewat hasil pilot nyata."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Agung Waluyo","s":[4,4,4,3,3,4]},{"n":"Paul Donald P","s":[4,4,4,3,3,3]}]},{"id":"1985","tim":"Yaksa Guard","inov":"NADI JKN - Navigasi Analitik Deteksi dan Intervensi Risiko JKN","kat":"Efisiensi Risiko pada Peserta JKN","f":"1985_NADI JKN - Navigasi Analitik Deteksi dan Intervensi Risiko JKN.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN menghadapi risiko peningkatan utilisasi dan biaya yang sering didahului sinyal longitudinal seperti rawat inap berulang, kunjungan emergensi, penyakit kronis, penggunaan obat, dan kenaikan biaya. NADI JKN memanfaatkan pola tersebut untuk mendeteksi peserta yang bergerak menuju utilisasi dan biaya yang berpotensi dapat dicegah, sehingga intervensi dapat dilakukan lebih dini.","NADI JKN bertujuan mengidentifikasi peserta yang berisiko mengalami peningkatan utilisasi dan episode biaya tinggi dalam rentang periode 6 - 12 bulan, mengukur risk trajectory dan risk momentum, serta memprioritaskan intervensi berdasarkan faktor klinis, pola layanan, dan expected financial exposure agar potensi avoidable utilization dapat ditekan lebih dini.","NADI JKN adalah platform population risk intelligence berbasis AI dan analitik longitudinal yang membaca perjalanan risiko peserta dari waktu ke waktu. Sistem menggabungkan diagnosis kronis, komorbiditas, rawat inap, kunjungan emergensi, penggunaan obat, pola utilisasi, dan histori biaya untuk menghasilkan Risk Score, Risk Momentum, dan Expected Financial Exposure. Model memprediksi risiko peningkatan utilisasi atau episode high-cost dalam periode waktu 6 - 12 bulan, lalu menampilkan peserta prioritas beserta faktor risiko dominan dan pola perubahan risikonya. NADI JKN tidak menentukan bahwa suatu tindakan medis tidak perlu, melainkan menjadi decision-support untuk mendeteksi pola yang mengindikasikan potensi avoidable utilization atau cost escalation agar peserta dapat direview dan diintervensi lebih dini.","NADI JKN membantu BPJS Kesehatan memprioritaskan peserta yang membutuhkan monitoring dan intervensi lebih dini. Dampaknya mencakup peluang menekan preventable readmission, repeated emergency utilization, dan eskalasi biaya, sekaligus meningkatkan efektivitas pengelolaan populasi berbasis risiko. Dampak finansial dapat diukur melalui perubahan biaya peserta berisiko dan estimasi avoided cost setelah intervensi."],"r":[{"n":"Agung Waluyo","s":[4,4,4,3,3,4]},{"n":"Paul Donald P","s":[4,3,2,2,2,2]},{"n":"Tria Sofa Purnama","s":[4,3,3,2,2,2]}]},{"id":"2024","tim":"E-JAK","inov":"AEGIS-Health: Agentic Risk Engine & Intelligent Surveillance for Healthcare","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2024_PROPOSAL_Tim EJAK_AEGIS-Health.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["BPJS Kesehatan membayar klaim hampir Rp 200 triliun per tahun untuk 280 juta peserta, dengan verifier terbatas. Diduga Rp 6 triliun per tahun bocor karena kecurangan klaim. Masalahnya: kecurangan seperti menaikkan tingkat keparahan penyakit, memecah satu paket perawatan jadi beberapa klaim, atau menyalin klaim lama hanya terlihat kalau klaim dibandingkan satu sama lain, bukan saat berkas dibaca satu-satu. Verifier butuh bantuan agar waktu terbatasnya fokus ke klaim yang paling patut dicurigai.","Membuat antrian prioritas: klaim paling berisiko naik ke atas plus alasannya. Urutan dihitung mesin tetap, AI penulis bahasa, tidak dapat mengubahnya. Tiap klaim diperiksa tiga sisi: diagnosis dan tindakan masuk akal, biaya tak melampaui pembanding sejenis, dan pola tidak mirip klaim mencurigakan lain. AEGIS tidak menuduh seseorang curang dan tidak menggantikan verifier tetapi keputusan tetap manusia. Target: pemeriksaan awal lebih cepat, alasan mudah dilacak, potensi kebocoran terlihat dini.","AEGIS-Health membantu verifier memilih klaim yang diperiksa dulu. Klaim dari faskes diperiksa otomatis (data lengkap, tanggal masuk akal, bukan duplikat), lalu tiga pemeriksa mesin berjalan bersamaan: sisi medis (tingkat keparahan, diagnosis, dan tindakan cocok dengan tarif paket BPJS), sisi biaya (membandingkan biaya dengan klaim sejenis, jika melonjak, sistem tunjukkan faktornya), sisi pola (mencari klaim nyaris identik (penyalinan) atau perawatan sama ditagih ulang dalam waktu dekat). Hasilnya satu skor risiko tetap, AI hanya menulis penjelasan Bahasa Indonesia, angkanya tak diubah AI. Verifier melihat daftar terurut, bukti siap kutip, contoh klaim serupa, dan mencatat keputusannya dengan aman. Semua sudah berjalan, bisa didemokan tanpa internet, cukup satu laptop GPU. Pada uji 25 kecurangan di 78 klaim, semua 25 masuk ke 50 teratas, satu klaim A ±1 detik. Data latihan pakai data buatan berlabel agar patuh aturan data peserta, validasi lanjutan pakai Data Sampel resmi BPJS.","Sebelum: semua klaim diperiksa sama rata, klaim berisiko bisa terlewat. Sesudah: verifier fokus ke klaim paling berisiko plus alasannya, bukti lengkap satu halaman, potensi kebocoran terlihat dini. Penerima manfaat: verifier, tim investigasi, faskes jujur, dan peserta JKN. Hasil uji: semua kecurangan uji masuk 50 teratas. Nilai finansial tetap ditentukan keputusan verifier, potensi kerugian yang perlu diperiksa, bukan penghematan pasti."],"r":[{"n":"Yanuar Milad","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2081","tim":"Tracer6","inov":"AI JKN Claim Integrity (JCI)","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2081_AI-JKN-Claim-Integrity_Healthkathon2026_Tracer6.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN menghadapi tantangan meningkatnya volume dan kompleksitas klaim, sementara kapasitas reviewer terbatas. Proses verifikasi manual menyulitkan deteksi dini pola ketidakwajaran, seperti klaim duplikat, upcoding, dan tagihan tidak wajar. AI JKN Claim Integrity hadir sebagai sistem intelijen risiko berbasis AI untuk mendeteksi anomali, memprioritaskan pemeriksaan, dan menyajikan bukti secara transparan. Sistem ini meningkatkan efisiensi & integritas klaim dgn tetap menempatkan keputusan","Membangun sistem intelijen risiko klaim JKN berbasis AI utk meningkatkan ketepatan & kecepatan proses verifikasi. Solusi ini bertujuan mendeteksi dini pola ketidakwajaran pada 6 domain risiko, memprioritaskan klaim berdasarkan tingkat risiko, serta menyajikan bukti & penjelasan yang mudah dipahami. Dengan menjaga kualitas data, transparansi, dan jejak audit, sistem mendukung efisiensi pengelolaan klaim, melindungi keberlanjutan JKN, serta memastikan keputusan akhir tetap berada pada investigator","AI JKN Claim Integrity (JCI) adalah sistem intelijen risiko klaim JKN berbasis AI yang dirancang untuk membantu reviewer, auditor, dan pengelola fasilitas kesehatan mendeteksi dini pola ketidakwajaran klaim. Sistem ini mengintegrasikan 44 detector berbasis aturan, statistik, kemiripan, pola, temporal, peer, dan relasi ke dalam enam domain risiko, yaitu klaim fiktif dan duplikat, upcoding, tagihan tidak wajar, lama rawat dan readmisi, rujukan, serta obat dan alat kesehatan. Melalui Risk Fusion, sistem menggabungkan berbagai sinyal menjadi skor risiko dan prioritas pemeriksaan. Fitur Investigation Workspace dan AI Investigator berbasis RAG menyajikan ringkasan, bukti, perbandingan klaim, serta rekomendasi langkah verifikasi yang mudah dipahami. Didukung manajemen kualitas data, kontrol akses, masking identitas, dan audit trail, JCI menerapkan prinsip human-in-the-loop. AI berperan sebagai asisten investigasi, bukan penentu fraud, sehingga keputusan akhir tetap berada pada investigator","AI JKN Claim Integrity meningkatkan efisiensi verifikasi melalui deteksi dini ketidakwajaran klaim. Sistem membantu mengurangi potensi kebocoran dana JKN, menjaga transparansi, serta melindungi hak peserta dan menjaga keadilan bagi fasilitas kesehatan. Peringatan disertai skor risiko dan bukti agar reviewer dapat menelaah klaim secara terarah. Kontrol akses dan audit trail mendukung proses yang aman dan akuntabel. AI memberi sinyal, bukan vonis; keputusan akhir tetap pada investigator berwenang"],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2096","tim":"Healthection","inov":"WageFraud Intelligence","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2096_Proposal.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program Jaminan Kesehatan Nasional (JKN) telah mencakup ratusan juta jiwa, namun dihadapkan pada tantangan rasio klaim yang melampaui pendapatan dan defisit operasional berjalan. Selain kecurangan faskes, kebocoran dana masif terjadi akibat employer fraud seperti pelaporan upah lebih rendah (under-reporting wage) dan pendaftaran sebagian pekerja oleh badan usaha. Ribuan perusahaan terbukti memanipulasi data gaji untuk menekan iuran, menggerus arus kas masuk DJS Kesehatan.","Inovasi WageFraud bertujuan membangun sistem kepatuhan prediktif (predictive compliance) untuk mendeteksi anomali pelaporan upah dan potensi tunggakan korporasi secara proaktif. Sistem ini bertujuan mengintegrasikan pembersihan data entitas melalui teknologi fuzzy matching guna mengatasi inkonsistensi administrasi, serta menerapkan AI Risk Scoring berbasis machine learning untuk mengklasifikasikan tingkat risiko kepatuhan badan usaha secara otomatis bagi pengawas.","WageFraud adalah platform dasbor kepatuhan prediktif berbasis kecerdasan artifisial untuk mendeteksi dan memitigasi employer fraud, khususnya under-reporting wage dan pendaftaran sebagian pekerja yang menggerus iuran JKN. Platform ini mengintegrasikan dua pilar teknologi utama: pertama, Fuzzy Matching Engine untuk mengatasi inkonsistensi administrasi data badan usaha secara akurat lintas sumber eksternal; kedua, AI Risk Scoring Model berbasis Tree-based Machine Learning (XGBoost/Random Forest) yang mengevaluasi profil industri dan rasio upah untuk menghasilkan skor risiko serta tanda Red Flag secara otomatis. Sesuai UU PDP, pengembangan ini 100% menggunakan data simulasi (dummy data). Menerapkan tata kelola Human-in-the-Loop, sistem ini beroperasi murni sebagai Decision Support System bagi Tim Pengawasan BPJS Kesehatan untuk memprioritaskan audit faktual lapangan secara terarah.","Penerapan WageFraud memberikan dampak nyata berupa pengamanan potensi penerimaan iuran (revenue assurance) secara signifikan bagi BPJS Kesehatan melalui pencegahan dini terhadap korporasi yang berniat menggelapkan iuran. Dari sisi pekerja, inovasi ini menjamin perlindungan jaminan sosial dihitung berdasarkan take-home pay yang adil dan sebenarnya, serta meningkatkan efektivitas penindakan hukum berbasis intelijen data yang terarah."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2143","tim":"Pixels","inov":"JKN-ClaimDNA","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2143_JKN ClaimDNA_20261002_222630_0000.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Sistem klaim JKN rentan terhadap phantom billing (klaim atas layanan yang tidak pernah diberikan) dan repeat billing (klaim diajukan berulang untuk kasus yang sama). Metode pengecekan duplikat konvensional mudah dikelabui hanya dengan mengubah sedikit detail klaim seperti tanggal atau jumlah, sehingga pola kecurangan sering lolos tanpa terdeteksi dan berpotensi merugikan keberlangsungan dana JKN.","Membangun sistem yang mampu mendeteksi potensi phantom billing dan repeat billing secara lebih akurat dengan membandingkan pola \"DNA\" setiap klaim, bukan hanya mencocokkan data yang identik. Tujuannya adalah membantu petugas BPJS Kesehatan mengidentifikasi klaim mencurigakan lebih cepat, disertai penjelasan transparan, sehingga keputusan akhir tetap berada di tangan manusia.","JKN-ClaimDNA menciptakan sidik jari unik (\"DNA\") untuk setiap klaim berdasarkan fasilitas, diagnosis, prosedur, tanggal, kuantitas, dan jumlah biaya. Sistem membandingkan DNA antar klaim menggunakan exact matching, fuzzy matching, deteksi pola, dan facility benchmarking. Setiap klaim yang terdeteksi mirip ditandai sebagai \"potensi kejanggalan\" lengkap dengan penjelasan Explainable AI, lalu dikirim ke dashboard petugas BPJS untuk verifikasi manual.","ClaimDNA berpotensi mempercepat deteksi klaim anomali dan mengurangi jumlah klaim bermasalah yang lolos tanpa peninjauan. Bagi BPJS Kesehatan, ini berarti efisiensi dana JKN yang lebih besar; bagi fasilitas kesehatan jujur, ini adalah verifikasi yang adil dan berbasis bukti; dan bagi peserta JKN, ini menjaga keberlangsungan jangka panjang program yang mereka andalkan. Dampak ini masih bersifat estimasi awal yang perlu diuji lebih lanjut."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Juliana","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2161","tim":"Cimol","inov":"MEDIGRAPH - AI-Powered Healthcare Claim Risk Intelligence","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2161_MEDIGRAPH_AI-Powered Healthcare Claim Risk Intelligence.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN mengelola jutaan hubungan antara pasien, dokter, fasilitas kesehatan, diagnosis, tindakan, dan klaim. Pola fraud seperti cloning, repeat billing, dan services unbundling sering sulit terlihat jika klaim diperiksa satu per satu. Dibutuhkan pendekatan yang mampu membaca keterhubungan antar-klaim agar indikasi risiko dapat ditemukan lebih dini, verifikasi lebih tepat sasaran, dan potensi pembayaran yang tidak semestinya dapat ditekan.","Mengembangkan sistem Healthcare Claim Risk Intelligence berbasis Graph Neural Network (GNN) untuk: 1) mendeteksi pola cloning, repeat billing, dan services unbundling melalui keterhubungan data; 2) menghasilkan risk score dan reason code untuk memprioritaskan klaim berisiko; 3) mendukung verifikator dengan early warning yang explainable. Sistem tidak memvonis fraud; keputusan akhir tetap dilakukan pihak berwenang.","MEDIGRAPH adalah AI-Powered Healthcare Claim Risk Intelligence berbasis Graph Neural Network (GNN). Sistem merepresentasikan pasien, dokter, fasilitas kesehatan, diagnosis, tindakan, dan klaim sebagai graph untuk menemukan pola yang sulit terlihat pada pemeriksaan individual. Fokus awal mencakup: 1) cloning, dengan mendeteksi kemiripan pola klaim yang tidak wajar; 2) repeat billing, dengan menemukan penagihan berulang pada kasus atau episode yang sama; 3) services unbundling/fragmentation, dengan mengidentifikasi pemecahan layanan yang seharusnya menjadi satu kesatuan. Hasil analisis berupa risk score, risk level, reason code, dan visualisasi relasi untuk membantu prioritas verifikasi. MEDIGRAPH menerapkan Human-in-the-Loop: High Risk ? Fraud. AI berfungsi sebagai early warning dan decision-support, sedangkan keputusan akhir tetap berada pada verifikator.","MEDIGRAPH diharapkan memberi dampak pada tiga area utama: 1) efisiensi pembiayaan, dengan membantu menemukan potensi improper payment lebih dini; 2) efektivitas verifikasi, dengan memprioritaskan klaim berisiko tinggi agar sumber daya pemeriksaan lebih tepat sasaran; 3) pengawasan yang lebih proaktif, melalui pembelajaran pola relasi dan umpan balik hasil verifikasi. Dampak dapat diukur melalui Potential Improper Payment Identified, Precision@Top-K, Mean Time to Detection, dan pengurangan manual"],"r":[{"n":"Susi Lusiani","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2168","tim":"RAEVA","inov":"Perisai JKN: Deteksi Dini Kecurangan Klaim JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2168_BPJS_Perisai JKN.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["BPJS Kesehatan membayarkan lebih dari Rp201 triliun klaim JKN setiap tahun, namun sistem saat ini kesulitan membedakan klaim jujur dari yang tidak. Akibatnya, kerugian kecurangan diperkirakan mencapai Rp6 triliun, dan Rp5,92 triliun klaim ikut tertahan karena verifikasi manual yang lambat, termasuk klaim yang sebenarnya bersih.","Perisai JKN dibangun untuk mempercepat pencairan klaim yang jujur, sekaligus menutup celah kecurangan yang selama ini sulit dideteksi lewat audit dokumen biasa. Tujuannya sederhana: mengurangi beban verifikasi manual bagi BPJS Kesehatan, mempercepat pencairan dana bagi fasilitas kesehatan yang jujur, dan melibatkan peserta JKN sebagai saksi independen tanpa membebani mereka dengan proses tambahan.","Perisai JKN adalah fitur tambahan di dalam Mobile JKN yang mencocokkan tiga bukti independen dari setiap kunjungan berobat: kehadiran pasien, konfirmasi pasien, dan klaim dari fasilitas kesehatan. Ketiga bukti ini digabungkan menjadi satu skor risiko. Klaim berisiko rendah cair otomatis dalam hitungan detik, sementara klaim berisiko tinggi diteruskan ke verifikator BPJS lengkap dengan penjelasan berbahasa manusia, sehingga keputusan akhir tetap di tangan manusia.","Dengan Perisai JKN, klaim yang jujur berpotensi cair jauh lebih cepat tanpa ikut antre panjang bersama klaim yang benar-benar berisiko. Fasilitas kesehatan yang jujur diuntungkan karena arus kasnya tidak lagi tersandera proses verifikasi yang sama untuk semua klaim, sementara verifikator BPJS bisa fokus memeriksa klaim yang benar-benar mencurigakan. Pendekatan ini berpotensi membantu menekan sebagian dari potensi kerugian kecurangan yang selama ini diperkirakan mencapai Rp6 triliun."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2252","tim":"FYP (For Your Pasien)","inov":"SENTINEL JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2252_SENTINEL JKN Terintegrasi SPBE (terbaru).pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pengawasan klaim JKN saat ini bersifat reaktif (post-claim audit), yang membebani verifikator BPJS. Bukti empiris: KPK (Juli 2024) menemukan phantom billing Rp35 Miliar dari 3 RS, serta anomali 1 dokter menagih 45 operasi katarak dalam 6 jam. Terlebih, penghapusan VIP akibat KRIS 2026 berisiko memicu faskes melakukan upcoding. SENTINEL JKN hadir sebagai prospective surveillance AI proaktif pada V-Klaim untuk mencegah kebocoran dana sejak awal.","Tujuan utama SENTINEL JKN adalah menggeser pengawasan dari reaktif menjadi prospective surveillance proaktif untuk mencegah kebocoran Dana Jaminan Sosial (DJS) sebelum dana dicairkan. Inovasi ini bertujuan menghentikan phantom billing secara tepat sasaran dan memitigasi kerugian pasca-KRIS. Selain mengamankan uang negara, sistem ini menjadi alat preventif yang melindungi Rumah Sakit dari sanksi pidana tanpa memicu kebangkrutan faskes.","SENTINEL JKN adalah sistem Prospective Surveillance berbasis Agentic AI di backend V-Klaim BPJS. Memadukan analitik ganda (Rule-Engine & AI probabilistik) yang divalidasi silang dengan rekam medis SatuSehat, sistem mendeteksi phantom billing dan upcoding sebelum dana cair. Inovasi ini didukung RAG anti-halusinasi, terintegrasi SPBE Nasional, dan merekomendasikan penangguhan proporsional dengan wewenang final pada verifikator manusia.","Dampak SENTINEL JKN mencakup efisiensi 1,5-3% Dana Jaminan Sosial (DJS) dari pencegahan klaim fiktif, dengan proyeksi ROI di bawah 1 tahun. Sistem ini mengurangi beban verifikator BPJS melalui targeted audit yang menggantikan blind-sampling. Selain menyelamatkan uang negara, skema penangguhan proporsional memastikan likuiditas rumah sakit tetap aman dan tidak bangkrut, menjaga keberlanjutan ekosistem JKN secara adil"],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Djaka Santosa","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2289","tim":"CODECURE","inov":"P-SAFE (PhantomSafe): Verifikasi Klaim BPJS Kesehatan Berbasis Risiko dengan Konfirmasi Pasien via W","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2289_PROPOSAL P-SAFE BY CODECURE.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Phantom billing bukan risiko teoretis. KPK, Kemenkes, BPJS Kesehatan, dan BPKP menemukan klaim fiktif senilai Rp34 miliar di 3 RS (Jateng dan Sumut); 3.269 dari 4.341 klaim fisioterapi diduga fiktif dan hanya 1.071 yang memiliki catatan rekam medis. Verifikasi manual memperlakukan semua klaim dengan usaha yang sama sehingga lambat, rentan human error, dan tanpa validasi independen dari penerima layanan. Risiko kebocoran dana JKN perlu dideteksi sedini mungkin.","Membangun P-SAFE, solusi yang membantu BPJS Kesehatan memprioritaskan verifikasi klaim berisiko sedang/tinggi melalui skor risiko otomatis, melibatkan pasien sebagai validator independen lewat WhatsApp resmi BPJS Kesehatan, serta menyediakan dashboard monitoring dan jalur pengaduan (/lapor). Tujuannya mempercepat investigasi, menekan false positive, dan melindungi dana JKN, dengan keputusan akhir tetap di tangan verifikator.","P-SAFE (PhantomSafe) adalah sistem verifikasi klaim berbasis risiko untuk BPJS Kesehatan dengan fokus pada phantom dan repeat billing. Alur kerja: (1) faskes mengirim klaim ke sistem BPJS Kesehatan; (2) AI menilai indikator risiko dari data klaim dan riwayat historis dengan model Gradient Boosting/XGBoost yang dikombinasikan aturan threshold, menghasilkan skor risiko rendah/sedang/tinggi; (3) klaim berisiko sedang/tinggi dikonfirmasi ke pasien lewat WhatsApp resmi BPJS Kesehatan dengan balasan Ya/Tidak dan kartu Ringkasan Pelayanan (bukan rekam medis lengkap); (4) verifikator memutuskan klaim dilanjutkan atau diinvestigasi. Fitur lain: chatbot menu informasi, dashboard monitoring real-time berisi skor dan alasan penandaan, serta pengaduan /lapor sebagai jalur banding untuk mitigasi false positive. Status: mockup interaktif (data dummy); model dan integrasi WhatsApp API sandbox dibangun saat hackathon.","Peserta JKN: identitas dan hak layanan terlindungi dari penyalahgunaan. Faskes jujur: proses klaim tetap lancar tanpa pemeriksaan berlebihan. BPJS Kesehatan: verifikasi lebih efisien dan keuangan program lebih sehat. Target evaluasi prototipe (acuan benchmark, bukan hasil yang sudah dicapai): waktu investigasi klaim prioritas turun 80%+ dan false positive <10%."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2291","tim":"Digitalloka","inov":"Klarity - Sistem Prioritas Audit Klaim FKRTL Berbasis Pembanding Antar-Faskes","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2291_DigitalLoka - Proposal Klarity.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kapasitas tim audit sangat terbatas dibanding jutaan klaim FKRTL per tahun. Dua pola yang paling menggerus dana JKN, yaitu upcoding dan prolonged stay, lolos dari pemeriksaan manual karena secara administrasi sah: kode benar, tarif sesuai, dokumen lengkap. Keanehannya baru terlihat saat klaim dibandingkan lintas pasien dan lintas rumah sakit. Data untuk mendeteksinya (INA-CBG, ICD-10, tanggal, tarif) sudah dimiliki BPJS; yang belum ada hanya sistem pengolahnya menjadi daftar prioritas.","1. Menghasilkan daftar prioritas audit bulanan, agar tim audit terbatas memeriksa faskes paling berisiko lebih dulu.\n2. Mendeteksi prolonged stay dan upcoding dengan membandingkan tiap klaim terhadap pembanding setara: INA-CBG, usia, komorbiditas, kelas dan region rumah sakit.\n3. Menyediakan bukti klaim yang dapat ditelusuri hingga baris asalnya. Keputusan tetap di auditor; sistem menghasilkan bukti, bukan vonis.\n4. Mengukur nilai klaim di atas pembanding sebagai dasar estimasi penghematan.","Klarity membaca seluruh klaim FKRTL, menghitung sinyal risiko per klaim, lalu meratakannya per rumah sakit menjadi satu skor 0-1, satu peringkat, dan daftar bukti klaim.\n\nCara kerja: (1) baca klaim rawat inap/jalan plus data pasien; (2) hitung sinyal per klaim: kelebihan hari rawat, perubahan diagnosis awal vs akhir, jumlah kode diagnosis, dan rasio nilai klaim, semuanya dibanding pembanding setara yang sadar region dan kelas RS, sehingga RS tersier yang memang merawat lebih lama tidak salah dibaca anomali; (3) rata-rata persentil menjadi skor transparan; (4) auditor membuka bukti di dashboard dan menentukan tindak lanjut.\n\nKebutuhan data: empat tabel yang sudah dimiliki BPJS, tanpa integrasi pihak ketiga, tanpa perubahan alur klaim.\n\nPrototipe live: 37 juta klaim sintetis berformat JKN dari 3.284 rumah sakit, API dan dashboard lengkap (bpjs-audit-dashboard.onrender.com). Satu siklus ±15 menit di server 2 GB. Validasi: seluruh 100 faskes teratas terbukti berisiko, AUC 0,93.","1. Efisiensi audit: seluruh 100 faskes teratas terbukti berisiko, sehingga tim audit terbatas fokus pada kasus terkuat.\n2. Potensi penghematan: nilai klaim di atas pembanding Rp 6,7 triliun per tahun pada data sintetis; nilai yang perlu ditelusuri, bukan kerugian pasti.\n3. Setiap skor dapat ditelusuri hingga klaim asal dan dihitung ulang: aman dari salah tuduh.\n4. Pembanding per region/kelas mencegah RS tersier dan daerah terpencil salah masuk daftar."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Juliana","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2297","tim":"Tiga is Three","inov":"JKN Guard","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2297_HealthKathon 2026, Detect Smarter, Protect JKN.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN memiliki ekosistem kepesertaan yang sangat besar, sehingga pengelolaan dan pengawasan kepatuhan pemberi kerja menjadi semakin kompleks. Risiko seperti ketidaksesuaian data pekerja, kepesertaan, upah, iuran, dan mutasi sering kali tidak terlihat sebagai pelanggaran secara langsung, tetapi dapat tercermin melalui pola data yang tidak wajar.","Mengubah data menjadi early warning yang dapat ditindaklanjuti untuk mendukung penguatan kepatuhan pemberi kerja, mencegah potensi kerugian, dan menjaga keberlanjutan Program JKN.","JKN Guard hadir sebagai AI-powered early warning system yang mendeteksi pola tersebut, memberikan risk score, dan membantu memprioritaskan pemberi kerja yang perlu ditinjau lebih lanjut. AI menemukan pola, manusia menentukan tindak lanjut.","JKN Guard sebagai pendeteksi risiko lebih dini sebelum berkembang menjadi potensi kerugian.\nJKN Guard sebagai pengawas yang lebih efisien melalui prioritas berbasis risiko.\nJKN Guard sebagai alat untuk meningkatkan kepatuhan pemberi kerja dalam Program JKN.\nJKN Guard sebagai alat pendukung keberlanjutan dan perlindungan dana JKN."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2298","tim":"apa aja boleh","inov":"Tupiksa","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2298_Tupiksa_Efisiensi Risiko Pada Pemberi Kerja.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Ketidakhadiran karyawan akibat sakit memengaruhi produktivitas perusahaan. Surat sakit sah sering disalahgunakan, terbukti dari temuan Kemenkes RI terkait maraknya penjualan surat fiktif dan pemalsuan identitas dokter. Pendekatan HRD saat ini masih konvensional, yakni memverifikasi dokumen secara individual ke faskes. Metode tersebut memiliki kelemahan karena tidak mampu membaca pola risiko kolusi lintas pekerja, waktu, serta dokumen secara menyeluruh.","TUPIKSA bertujuan menjadi decision-support layer bagi HRD untuk mengidentifikasi pola risiko administrasi ketidakhadiran, khususnya pada dokumen surat sakit. Sistem ini membantu memprioritaskan investigasi dengan menentukan kasus yang layak diperiksa, tanpa otomatis menetapkan status palsu. Tujuannya memberikan dukungan keputusan yang lebih cepat, presisi, dan aman bagi perusahaan guna menekan risiko kolusi tanpa menggantikan peran manusia.","TUPIKSA (Corporate HR Healthcare Fraud Intelligence) adalah platform investigasi AI untuk menganalisis risiko klaim medis di lingkungan perusahaan. Mengusung Privacy By Design, sistem ini murni memakai data administratif sah tanpa memproses detail diagnosis rekam medis. Platform ini memetakan relasi 5 entitas data utama: pekerja, ketidakhadiran, waktu, dokumen, dan fasilitas kesehatan. Sistem memadukan deteksi anomali klinis dengan analisis ekosistem guna mengidentifikasi pola berulang dan konsentrasi faskes. Menggunakan prinsip Human in the Loop, hasil pemrosesan disajikan dalam Executive Dashboard sebagai Explainable Risk Alert, yakni peringatan risiko dengan indikator pemicu yang transparan. TUPIKSA tidak menolak dokumen secara otomatis; otoritas verifikasi dan keputusan akhir mutlak di tangan HRD.","1. Transformasi Proses: Mengubah verifikasi dokumen individual menjadi prioritisasi terarah berbasis pola risiko.\n2. Efisiensi Waktu: Penurunan signifikan pada durasi screening dokumen administrasi.\n3. Peningkatan Presisi: Akurasi tinggi dalam mengidentifikasi anomali kasus yang wajib diverifikasi.\n4. Fokus SDM: HRD dapat memusatkan sumber daya pada kasus dengan tingkat urgensi tertinggi."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Yanuar Milad","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2308","tim":"Hilang Titik Koma Langsung Koma","inov":"AEGIS-JKN: Adaptive Evidence-Grounded Integrity System for JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2308_AEGIS-JKN.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Tarif INA-CBG mengikuti kode diagnosis dan tindakan, tetapi dasar kode itu tersebar di resume medis, catatan tindakan, hasil penunjang, dan riwayat episode. Volume transaksi BPJS terus naik sementara SDM terbatas (T&C Healthkathon 2026). Pada 2024 Tim PK-JKN memeriksa 3 RS swasta dan menemukan 4.341 klaim fisioterapi, tetapi hanya 1.071 yang punya rekam medis; 3.269 diduga fiktif (Kemenkes RI, Juli 2024). Skor risiko tidak memberi tahu verifikator bagian dokumen mana yang bermasalah.","AEGIS-JKN membantu verifikator BPJS memilih klaim FKRTL yang perlu ditinjau lebih dulu, lengkap dengan alasan yang bisa diperiksa. Setiap temuan harus membawa kutipan dokumen, lokasi halaman, fakta pembanding, dan rujukan aturan; temuan tanpa bukti yang bisa dirujuk dibuang. Status temuan adalah perlu ditinjau. Sistem tidak menolak klaim dan tidak menuduh faskes curang. Verifikator yang memutuskan, dan keputusannya tercatat di audit trail.","AEGIS-JKN adalah prototype pendamping verifikasi klaim FKRTL. Sistem menerima bundel klaim (tagihan, resume medis, catatan tindakan), menyamarkan data pribadi, lalu membaca teks cetak per halaman. Enam detektor mencari ketidaksesuaian: D1 upcoding, D2 phantom billing, D3 cloning, D4 unbundling, D5 readmisi, dan D6 prolonged length of stay. Laporan semua detektor memakai format yang sama: modus, skor prioritas, kutipan bukti, rujukan aturan, dan batasan. Adjudicator menyusun ulang fakta dari dokumen sumber dan membuang temuan yang buktinya tidak bisa dirujuk. Bila dokumen hilang atau hasil OCR buruk, statusnya bukti tidak cukup. Verifikator membaca dokumen asli di samping temuan, lalu memutuskan, meminta dokumen, atau meneruskan ke ketua tim. Pada uji fungsional dengan data sintetis, tiap detektor lolos 18/18 skenario dan 108/108 upaya manipulasi bukti ditolak. Akurasi pada klaim nyata belum diukur.","Dampak berikut masih berupa target dan akan diukur saat pilot. Verifikator langsung melihat halaman dan kutipan yang mendasari temuan, sehingga waktu mencari bukti berkurang. Faskes menerima alasan yang jelas ketika diminta melengkapi dokumen. Sistem mengutamakan sedikit temuan yang kuat daripada banyak false positive, dengan precision diukur per modus dan per kelompok faskes. Penghematan biaya belum dihitung karena memerlukan pilot dengan data berizin."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2360","tim":"Harapan Orang Tua","inov":"Agentic AI untuk Rekonsiliasi Upah, Kepesertaan, dan Iuran Pemberi Kerja","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2360_Doa Ibu_Proposal.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Integritas JKN bergantung pada ketepatan pendaftaran pekerja, pelaporan upah, dan penyetoran iuran. Pada 2019, pemberitaan mengutip BPJS Kesehatan mengenai 2.348 perusahaan yang memanipulasi data karyawan; angka historis ini bukan prevalensi terkini.[2] Kewajiban pemberi kerja diatur dalam UU 24/2011.[3] JKN WageGuard diusulkan untuk membantu petugas menelusuri ketidaksesuaian lintas dokumen dengan bukti yang dapat diperiksa, tanpa langsung menyimpulkan fraud.","Mengembangkan prototipe Agentic AI untuk membantu petugas pemeriksa BPJS Kesehatan merekonsiliasi upah, kepesertaan, dan setoran iuran pemberi kerja. Sistem akan memprioritaskan kasus, memeriksa pengecualian, menghitung estimasi selisih, serta menyusun ringkasan bukti dan draf klarifikasi bersitasi. Uji sintetis menargetkan precision minimal 90% dan pengurangan median waktu telaah minimal 30%; keduanya target, bukan hasil. Keputusan tetap pada petugas berwenang.","JKN WageGuard diusulkan pada kategori Efisiensi Risiko Pemberi Kerja, dengan fokus Under-reporting Upah, Pendaftaran Pekerja Sebagian, dan indikasi Penggelapan Iuran.[1] Satu orkestrator AI memilih langkah pemeriksaan melalui fungsi baca-saja: mencocokkan ID pekerja dan periode, mencari bukti, mengambil aturan JKN sesuai masa berlaku, serta meminta perhitungan kepada mesin aturan.[4-6] Generative AI merangkum bukti dan menyusun draf klarifikasi; angka tidak dihitung oleh LLM. Bukti kurang atau bertentangan memicu pemeriksaan manusia. Keluaran berupa daftar prioritas dan berkas kasus berisi sumber, aturan, estimasi selisih, serta jejak tindakan. MVP direncanakan memakai 20 perusahaan dan 2.000 pekerja sintetis selama 6 bulan, tanpa data peserta riil. Skenario mencakup ketidaksesuaian dan kasus sah seperti perbedaan komponen upah atau jeda pencatatan. Status saat ini konsep; implementasi dan uji belum dilakukan. Pengiriman klarifikasi memerlukan persetujuan petugas.","Dampak yang diharapkan ialah telaah kepatuhan lebih cepat, bukti lebih tertelusur, dan identifikasi pekerja yang perlu ditindaklanjuti pendaftarannya. Evaluasi membandingkan pemeriksaan manual, aturan saja, dan aturan dengan agen AI pada kasus yang sama. Ukuran meliputi precision, recall, waktu telaah, kelengkapan sitasi, dan kesalahan perhitungan. Selisih iuran hanya estimasi untuk diverifikasi, bukan penerimaan yang dipulihkan. Tidak ada penonaktifan peserta atau sanksi otomatis."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2373","tim":"Black Panther","inov":"CEK OBAT: Verifikasi dua sisi","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2373_CEK OBAT_Verifikasi Dua Sisi_.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Komponen obat dan alat kesehatan (alkes) dalam Program JKN rentan terhadap kebocoran dana, terutama pada tiga titik: saat peresepan, saat penyerahan obat, dan saat klaim ke BPJS. Oleh karena itu diperlukan sistem interoperabilitas yang memungkinkan pasien melakukan verifikasi kelengkapan obat sehingga pelayanan lebih transparan dan fraud dapat dicegah sejak dini.","1. Menjadikan pasien sebagai verifikator kedua yang sah\n2. Mengintegrasikan data resep SIRS fasyankes dengan JKN mobile\n3. Mendeteksi anomali secara dini\n4. Menurunkan kasus fraud dan klaim obat lebih transparan\n5. Menjamin hak peserta JKN untuk menerima obat sesuai dengan yang diresepkan","CEK OBAT adalah inovasi layanan pada aplikasi JKN Mobile yang memungkinkan peserta JKN memverifikasi sendiri kelengkapan obat & alkes yang diterima dari farmasi. Alur kerja CEKOBAT yaitu Dokter mengirim data resep elektronik dari SIRS fasyankes (jenis, dosis, jumlah, & aturan pakai obat) lalu diperiksa oleh farmasi. Setelah diverifikasi oleh apoteker, data obat dikirim melalui interoperabilitas ke JKN Mobile dan tampil sebagai notifikasi real-time di akun peserta bahwa obat dapat diambil. Sebelum meninggalkan farmasi, pasien mencocokkan obat yang diterima dengan data di aplikasi, lalu menekan tombol \"Lengkap\".  Konfirmasi pasien dan data fasyankes menjadi satu paket bukti yang melekat pada setiap klaim dan menjadi salah satu syarat pencairan klaim obat/alkes. Jika pasien menemukan ketidaksesuaian pemberian obat maka terdapat fitur untuk melaporkan bahwa obat \"Tidak Lengkap\". Ketidaksesuaian akan ditandai sebagai anomali oleh sistem pemantauan fraud BPJS untuk ditinjau oleh petugas","Bagi BPJS Kesehatan, klaim yang dibayarkan lebih sesuai dengan layanan nyata sehingga risiko overclaim dan klaim fiktif menurun dan biaya obat menjadi lebih transparan. Bagi fasyankes yang jujur, persaingan menjadi lebih adil. Dalam jangka panjang, kebocoran dana pada komponen obat/alkes dapat ditekan dan keberlangsungan Dana Jaminan Sosial lebih terjaga."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2380","tim":"KNIME Community ID","inov":"KLAIM-SIGAP: Prioritisasi Audit Risiko Manipulasi Klaim Nonkapitasi","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2380_KLAIM-SIGAP Healthkathon 2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Penelaahan klaim nonkapitasi perlu memusatkan perhatian pada provider yang paling memerlukan verifikasi. Volume transaksi dan variasi pola klaim membuat pemeriksaan manual sulit diprioritaskan secara konsisten. KLAIM-SIGAP mengolah indikator level provider untuk mengenali pola menyimpang. Solusi ini tidak menetapkan fraud atau sanksi otomatis, melainkan memberi prioritas telaah bagi verifikator.","Menyediakan alat bantu prioritisasi audit bagi verifikator untuk mengidentifikasi provider dengan pola klaim nonkapitasi yang anomali, menyajikan indikator pendukung, dan membantu alokasi kapasitas telaah secara lebih fokus. KLAIM-SIGAP merupakan decision support; keputusan verifikasi dan tindak lanjut tetap dilakukan oleh petugas berwenang.","KLAIM-SIGAP adalah workflow KNIME end-to-end untuk memprioritaskan provider yang perlu ditelaah pada risiko manipulasi klaim nonkapitasi. Data benchmark publik klaim inpatient, outpatient, beneficiary, dan label historis diolah menjadi 10 fitur agregat level provider, antara lain jumlah klaim, nilai reimbursement, jumlah beneficiary, proporsi klaim rawat inap, serta lama rawat. H2O Isolation Forest mempelajari pola provider normal dan menghasilkan Anomaly Score, Mean Path Length, Audit Priority, serta Model Alert. Hasil model kemudian digabungkan kembali dengan identitas provider agar dapat ditelusuri oleh verifikator. Evaluasi pada 2.174 provider benchmark menghasilkan akurasi 85,00%, recall label historis fraud 71,74%, dan specificity 89,03%. Metrik ini merupakan bukti teknis pada benchmark publik, bukan klaim performa pada data JKN produksi.","KLAIM-SIGAP membantu mengarahkan perhatian audit ke provider dengan pola klaim paling menyimpang sehingga proses telaah dapat lebih terstruktur dan berbasis data. Verifikator tetap memegang kendali untuk meninjau bukti, memvalidasi konteks klinis dan administratif, serta menentukan tindak lanjut. Pada tahap implementasi, ambang prioritas dapat dikalibrasi menggunakan data JKN yang berizin dan kapasitas audit yang tersedia."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2389","tim":"CERDIK-JKN","inov":"CERDIK-JKN: Cerdas Deteksi Indikasi Kecurangan Klaim JKN. Solusi yang difokuskan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2389_Proposal_CERDIK-JKN_Healthkathon2026_041026_sign.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Proses klaim JKN mengandung kombinasi data administratif, klinis, tarif, waktu layanan, dan bukti pelayanan. Risiko muncul ketika kombinasi tersebut tidak konsisten: layanan tidak pernah diberikan tetapi diklaim (phantom billing), kode diagnosis/prosedur dinaikkan (upcoding), tagihan atau rekam medis disalin/digelembungkan, episode layanan dipecah, atau lama rawat dan readmisi tidak wajar. Pemeriksaan manual satu per satu sulit mempertahankan kedalaman dan konsistensi yang sama pada volume klaim","CERDIK-JKN menghubungkan proses pengajuan dari rumah sakit dengan proses verifikasi BPJS dalam satu siklus. Pada Portal Faskes, petugas dapat mengisi klaim baru, menyimpan draft, atau mengunggah data massal CSV/XLSX. Setelah diajukan, klaim masuk ke pipeline penilaian risiko dan muncul pada Portal Verifikator BPJS untuk diprioritaskan, dijelaskan, diperiksa buktinya, dan diputuskan.","CERDIK-JKN menghubungkan proses pengajuan dari rumah sakit dengan proses verifikasi BPJS dalam satu siklus. Pada Portal Faskes, petugas dapat mengisi klaim baru, menyimpan draft, atau mengunggah data massal CSV/XLSX. Setelah diajukan, klaim masuk ke pipeline penilaian risiko dan muncul pada Portal Verifikator BPJS untuk diprioritaskan, dijelaskan, diperiksa buktinya, dan diputuskan.\n\n\n•\tCERDIK-JKN dirancang untuk membantu proses pengawasan klaim JKN dengan menggabungkan berbagai informasi yang saling berkaitan, seperti tarif, diagnosis, layanan, lama rawat, riwayat klaim, profil faskes, dan bukti pendukung.\n•\tSistem tidak hanya memberikan skor risiko, tetapi juga menunjukkan faktor dan bukti yang menjadi dasar munculnya risiko sehingga dapat ditelusuri oleh verifikator.\n•\tDalam penggunaannya, AI berperan sebagai alat bantu untuk menyaring dan merangkum informasi. Keputusan akhir tetap dilakukan oleh verifikator berdasarkan hasil pemeriksaan dan bukti yang tersedia.","•\tBagi BPJS Kesehatan: risiko pembayaran tidak semestinya, beban verifikasi, serta kebutuhan penelusuran bukti dan akuntabilitas.\n•\tBagi fasilitas kesehatan: proses klaim dapat melambat bila semua klaim diperlakukan sama tanpa prioritas risiko yang jelas.\n•\tBagi peserta JKN: integritas data layanan dan keberlanjutan dana program dapat terpengaruh oleh klaim yang tidak tepat."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2408","tim":"kata bu lia harus ikut","inov":"JKN-SecOps","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2408_JKN-SecOps.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN menghadapi titik kritis dengan defisit kas operasional Rp 2,5 Triliun per bulan dan rasio klaim 108,72%. Hal ini diperparah oleh modus kecurangan fasilitas kesehatan yang terus berevolusi. Saat ini, sistem mitigasi masih bertumpu pada audit manual pasca-klaim sehingga dana sering terlanjur cair. Terdapat sisa kebocoran dana akibat fraud yang diestimasi mencapai Rp 6 Triliun per tahun yang harus segera dihentikan.","Inovasi JKN-SecOps bertujuan untuk menghentikan sisa kebocoran dana fraud sebesar Rp 6 Triliun secara proaktif sebelum klaim diproses oleh sistem utama BPJS. Platform ini bertindak sebagai instrumen pencegahan kecurangan finansial era modern secara seketika (real-time). Tujuan utamanya adalah untuk menyelamatkan likuiditas JKN, menjamin integritas data, dan memastikan keadilan pelayanan medis bagi seluruh peserta.","JKN-SecOps adalah platform pengamanan infrastruktur dan analitik AI prediktif dengan arsitektur hibrida berlapis. Lapis pertama menggunakan sensor keamanan tingkat sistem operasi (Kernel-Level eBPF) untuk mencegat dan memblokir injeksi skrip otomatis (Phantom Billing) secara absolut tanpa latensi. Lapis kedua memanfaatkan model AI TCN-Attention yang cerdas menganalisis urutan kronologis tindakan medis (time-series) untuk menangkap anomali klinis seperti Upcoding dan Prolonged Stay dengan target akurasi di atas 85%. Sistem ini memisahkan keputusan teknis dan medis, mengedepankan prinsip Human-in-the-Loop di mana keputusan akhir tetap di tangan Verifikator BPJS melalui Command Dashboard. JKN-SecOps diimplementasikan secara terpusat sebagai Security Middleware (Zero-Touch Deployment) di API Gateway BPJS, sehingga tidak memerlukan instalasi di server rumah sakit.","Sistem ini memproyeksikan pencegahan kebocoran hingga 15-20% dari sisa defisit, dengan estimasi penyelamatan kas negara sekitar Rp 1 Triliun per tahun melalui pemblokiran otomatis di level Gateway. Menyelamatkan arus kas JKN secara langsung mencegah fasilitas kesehatan dari kebangkrutan. Hal ini akan berdampak sistemik pada pencegahan penurunan standar mutu layanan medis (Service Downgrading) bagi masyarakat, khususnya kelas menengah ke bawah."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2415","tim":"SALAM SEJAHTERA","inov":"CARE-SHIELD (Comprehensive Analytics & Risk Evaluation Shield)","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2415_Proposal Healthkathon Final.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program Jaminan Kesehatan Nasional (JKN) merupakan pilar utama perlindungan kesehatan masyarakat Indonesia. Namun, efisiensi program ini terus terancam oleh praktik kecurangan pada klaim fasilitas kesehatan, khususnya upcoding, unbundling, dan readmisi. Verifikator BPJS Kesehatan dihadapkan pada ribuan berkas klaim harian dengan waktu telaah hanya 2–3 menit per berkas, sehingga klaim tidak wajar berisiko lolos audit. Kerugian akibat fraud kesehatan mencapai 6% dari total belanja kesehatan dunia,","Pengembangan CARE-SHIELD bertujuan untuk menghadirkan platform analitik cerdas yang membantu verifikator BPJS Kesehatan mendeteksi potensi anomali klaim secara cepat, akurat, dan transparan. Secara spesifik, CARE-SHIELD dirancang untuk: (1) merancang antarmuka dasbor interaktif yang memudahkan verifikator memprioritaskan klaim berisiko tinggi; (2) memetakan indikator PEMDI ke dalam metode analitik statistik untuk mendeteksi upcoding, unbundling, dan readmisi; serta (3) mengukur potensi nilai pub","CARE-SHIELD (Comprehensive Analytics & Risk Evaluation Shield) adalah platform verifikasi klaim berbasis web yang berfungsi sebagai co-pilot bagi verifikator BPJS Kesehatan. Platform ini mengintegrasikan tiga komponen utama: Smart Anomaly Engine untuk mendeteksi upcoding dan unbundling melalui outlier analytics dan machine learning; Episode Tracker untuk memantau readmisi dan repeat billing melalui rule-based sequence tracking; serta Risk Scoring & Interactive Verifier Dashboard yang menyajikan daftar klaim berdasarkan tingkat risiko dengan explainable metrics. CARE-SHIELD dirancang dengan prinsip Human-in-the-Loop, sehingga keputusan akhir tetap berada di tangan verifikator manusia, dan arsitekturnya diselaraskan dengan kerangka tata kelola digital PEMDI (PermenPANRB 8/2026).","CARE-SHIELD berpotensi memberikan dampak berjenjang bagi seluruh ekosistem JKN. Dari sisi perlindungan finansial, sistem ini diproyeksikan mampu menekan pembayaran klaim tidak wajar hingga 5–12% dari total klaim terindikasi. Dari sisi efisiensi operasional, waktu verifikasi berkas klaim ditargetkan turun hingga 50%, sehingga pencairan klaim resmi faskes yang jujur menjadi lebih cepat. Dari sisi akurasi audit, keberadaan explainable metrics dapat menurunkan tingkat false positive pada pemanggilan"],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2424","tim":"Last Dance","inov":"JKN Integrity Trace sebagai Sistem Pendukung Keputusan untuk Deteksi Dini Potensi Phantom","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2424_Last Dance_JKN Integrity Trace sebagai Sistem Pendukung Keputusan untuk Deteksi Dini Potensi Phantom Billing pada Klaim JKN.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program Jaminan Kesehatan Nasional (JKN) memiliki cakupan peserta dan transaksi klaim yang besar, sehingga risiko fraud perlu dideteksi sejak dini. Salah satu bentuknya adalah phantom billing, yaitu pengajuan klaim atas layanan yang sebenarnya tidak diberikan. Kondisi ini dapat menimbulkan kebocoran dana, beban verifikasi, dan risiko tuduhan yang tidak tepat. Karena itu, diperlukan sistem pendukung keputusan yang menghubungkan data klaim dengan bukti pelayanan secara transparan.","Tujuan dari proposal ini adalah mengembangkan JKN Integrity Trace sebagai decision-support system untuk mendeteksi potensi phantom billing melalui rekonsiliasi bukti klaim dan pelayanan, klasifikasi status evidence, perhitungan evidence gap dan risk signal, penyusunan kasus pemeriksaan berbasis risiko, penerapan audit trail, serta penyediaan dashboard interaktif untuk mendukung proses verifikasi yang transparan dan dapat ditelusuri.","JKN Integrity Trace merupakan decision-support system berbasis web yang membantu mendeteksi potensi phantom billing pada klaim JKN. Sistem menghubungkan claim item dengan rekam medis, prosedur, dan billing melalui evidence reconciliation, kemudian menghasilkan risk signal, prioritas pemeriksaan, evidence chain, serta audit trail. Keputusan akhir tetap dilakukan oleh reviewer melalui mekanisme human-in-the-loop.","JKN Integrity Trace berpotensi meningkatkan efisiensi verifikasi klaim melalui prioritas pemeriksaan berbasis risiko dan penyajian evidence chain yang lebih jelas. Sistem membantu mengurangi risiko false accusation dengan membedakan data yang tidak tersedia dari bukti yang tidak mendukung klaim, sekaligus memperkuat audit trail. Dampaknya mencakup perlindungan dana JKN, pengurangan beban reviewer, perlindungan fasilitas kesehatan, serta peningkatan tata kelola program JKN."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Susi Lusiani","s":null},{"n":"Juliana","s":null}]},{"id":"2436","tim":"DMD Sentrix","inov":"FraudGuard AI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2436_PROPOSAL INOVASI DIGITAL BPJS KESEHATAN HEALTHKATHON 2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Peningkatan volume klaim JKN harian dari Faskes menciptakan keterbatasan verifikasi manual BPJS Kesehatan. Hal ini membuka potensi risiko terjadinya klaim fiktif (phantom billing), penjiplakan rekam medis (cloning), dan manipulasi diagnosis (upcoding). Praktik ini berisiko memicu kebocoran Dana Jaminan Sosial (DJS) Kesehatan dan memperlambat alur pembayaran klaim sah bagi Faskes yang patuh.","?Mendeteksi anomali upcoding dengan memvalidasi teks resume medis dokter secara otomatis.\n  \n?Mencegah phantom billing & cloning melalui pemetaan hubungan antar-entitas berbasis Graph Analytics.\n  \n?Membantu verifikator BPJS menyaring klaim berisiko tinggi secara real-time untuk menjaga integritas DJS.","?FraudGuard AI adalah platform Real-Time Fraud Screening terintegrasi yang mengevaluasi klaim kesehatan secara preskriptif sebelum dana dicairkan. Solusi ini menggunakan 3 modul utama:\n  \n?Automated Clinical Text Validation (NLP BioBERT): Mengekstrak dan membandingkan narasi resume medis dokter dengan koding ICD-10 untuk mendeteksi upcoding.\n  \n?Graph Network Anomaly Detector (Neo4j): Memetakan hubungan Pasien-Dokter-Faskes guna mendeteksi penjiplakan rekam medis (cloning) dan klaim berulang.\n  \n?Verificator Smart Dashboard: Menghasilkan skor risiko (Low, Medium, High Risk) secara otomatis guna membantu verifikator manusia fokus mengaudit berkas berisiko tinggi.\n  \n?Seluruh pengujian dikembangkan menggunakan dummy dataset guna menjamin kepatuhan terhadap UU Perlindungan Data Pribadi (PDP).","Efisiensi Anggaran: Berpotensi menekan angka kebocoran dana DJS Kesehatan hingga 15–20% secara preventif.\n?Peningkatan Produktivitas: Memotong waktu pemeriksaan klaim rutin secara otomatis hingga 65%.\n?Manfaat Ekosistem: Mempercepat proses pencairan klaim yang sah bagi Faskes jujur serta menjaga keberlanjutan jaminan layanan bagi peserta JKN."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Juliana","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2460","tim":"Perawat Center","inov":"Pasien Pintar: JKN Smart Risk – Solusi Preventif & Efisiensi Risiko Layanan Berulang","kat":"Efisiensi Risiko pada Peserta JKN","f":"2460_Pasien Pintar JKN Smart Risk â€“ Solusi Preventif & Efisiensi Risiko Layanan Berulang.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Beban pemanfaatan layanan JKN mencapai 725,3 juta kunjungan dengan biaya manfaat Rp191,3 triliun. Penyakit kronis seperti hipertensi (30,8%) dan diabetes (11,7%) kerap berujung komplikasi karena rendahnya kepatuhan minum obat di rumah dan kebingungan pasien mengenali tanda bahaya. Akibatnya, terjadi kunjungan berulang, polifarmasi, dan pelayanan yang tidak perlu di faskes yang sebenarnya dapat dicegah sejak dini dari sisi peserta.","1. Mencegah komplikasi fatal peserta kronis lewat pengingat obat harian dan pelibatan Pengawas Minum Obat (PMO) keluarga.\n\n2. Mencegah klaim pelayanan yang tidak perlu melalui checklist pra-pelayanan mandiri yang transparan.\n\n3. Mengendalikan risiko terapi berlebih dan interaksi obat secara mandiri.\n\n4. Memberdayakan peserta dengan data kesehatan pribadi yang aman di perangkat sendiri (local-first) tanpa risiko kebocoran data.","Pasien Pintar: JKN Smart Risk adalah aplikasi pendamping peserta berbasis mobile (sudah terbit di Google Play Store) yang dirancang untuk mengendalikan risiko pembiayaan JKN dari hulu.\n\nAplikasi mengintegrasikan 4 modul inovasi utama:\n\n1. Mesin Skor Risiko Mandiri: Algoritma transparan berbasis aturan klinis (skor 0–100) untuk memetakan kepatuhan terapi dan stabilitas tanda vital.\n\n2. Checklist Pra-Pelayanan: Memandu peserta memeriksa kelayakan kondisi sebelum ke faskes guna meminimalkan rujukan dan kunjungan berulang yang tidak perlu.\n\n3. Rencana Pencegahan Personal: Panduan harian kepatuhan obat kronis, diet, dan pemantauan tensi/gula darah.\n\n4.Ringkasan Klinis untuk Dokter: Laporan ringkas riwayat obat dan vital untuk faskes guna mencegah duplikasi terapi.\n\nSistem menganut prinsip Privacy by Design & UU PDP No. 27/2022: data tersimpan lokal di ponsel pasien tanpa server perantara, menjamin privasi medis aman.","1. Peserta: Kepatuhan minum obat meningkat hingga >85% dan komplikasi terdeteksi lebih dini.\n\n2. BPJS Kesehatan & Faskes: Menekan angka kunjungan rawat jalan dan IGD yang tidak perlu sebesar 15–25% pada kohort pasien kronis, berpotensi menghemat miliaran rupiah beban klaim kuratif katastropik.\n\n3. Kesiapan Implementasi: Aplikasi berstatus Produk/MVP Matang di Play Store yang siap diujicobakan bersama fasilitas kesehatan."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Susi Lusiani","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2501","tim":"Lina Z","inov":"STABIL PRB","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2501_STABIL PRB ( healthkathon ) dr. Lina Z.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pasien Program Rujuk Balik (PRB) memerlukan kontrol dan terapi berkesinambungan di FKTP. Dalam praktik, pasien yang tidak kembali sesuai jadwal belum selalu terdeteksi secara proaktif. Keterlambatan baru diketahui setelah obat berisiko habis, terapi terputus, atau kondisi memburuk. Diperlukan sistem yang dapat mencocokkan jadwal kontrol dengan data kunjungan, menandai keterlambatan, dan membantu petugas menentukan pasien yang perlu segera ditindaklanjuti","Mengembangkan sistem deteksi dini untuk mengidentifikasi pasien PRB yang melewati jadwal kontrol, mengurutkan prioritas tindak lanjut berdasarkan tingkat keterlambatan dan faktor risiko, serta mendukung pencatatan hasil tindak lanjut di FKTP. Solusi ditujukan untuk memperkuat kesinambungan pelayanan, mempercepat respons petugas, mengurangi risiko putus terapi, dan menyediakan dasar evaluasi yang terukur untuk pengembangan layanan PRB","STABIL PRB adalah sistem pendukung tindak lanjut pasien Program Rujuk Balik di FKTP. Sistem mencocokkan jadwal kontrol dengan data kunjungan dan data terkait yang tersedia, kemudian mengelompokkan pasien ke dalam status hijau, kuning, atau merah berdasarkan aturan yang dapat dibaca dan divalidasi. Pasien yang melewati jadwal diberi skor prioritas berdasarkan lama keterlambatan, jenis terapi, riwayat tidak hadir, komorbid terpilih, dan hambatan akses. Dashboard menampilkan daftar pasien yang perlu ditindaklanjuti beserta alasan penandaan, sehingga petugas dapat memverifikasi, menghubungi pasien melalui pengingat, telepon, atau kunjungan rumah sesuai SOP, lalu mencatat hasil tindak lanjut. Tahap awal menggunakan data simulasi dan mesin aturan sederhana. Setelah tervalidasi, sistem dapat diintegrasikan dengan sumber data resmi dan dikembangkan menuju model prediksi untuk mengidentifikasi risiko ketidakhadiran lebih awal. Sistem tidak menggantikan keputusan klinis dokter.","STABIL PRB diharapkan meningkatkan persentase pasien yang kembali kontrol, mempercepat waktu dari keterlambatan terdeteksi hingga pasien dihubungi, serta meningkatkan proporsi pasien terlambat yang berhasil ditindaklanjuti. Sistem juga diharapkan menurunkan risiko putus terapi, mengurangi waktu petugas dalam menyusun daftar prioritas secara manual, dan menyediakan riwayat tindak lanjut yang dapat digunakan untuk evaluasi serta perbaikan layanan PRB secara berkelanjutan."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Djaka Santosa","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2505","tim":"Goyang Sehat","inov":"Deteksi Perusahaaan Tidak Patuh dengan Conformal Selection Berbatas False Discovery Rate (FDR) pada","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2505_SEPADAN - Proposal Healthkathon 2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["BPJS Kesehatan menanggung defisit sekitar Rp2 triliun per bulan dengan rasio klaim 108,72% (Juni 2026). Sisi klaim sudah dijaga analitik AI, sedangkan sisi iuran belum. Sebagian pemberi kerja hanya mendaftarkan sebagian pekerja atau melaporkan upah di bawah yang sebenarnya. Hal itu sulit terlihat karena pekerja yang disembunyikan tidak ada di laporan perusahaan. Pemeriksaan kepatuhan juga belum punya batas tertulis atas berapa banyak perusahaan patuh yang ikut diperiksa.","Membangun mesin seleksi pemeriksaan kepatuhan pemberi kerja yang dipasang di dalam BPJS Kesehatan dan dipanggil lewat API tanpa migrasi sistem. Mesin ini membant
