uaian baru dapat diketahui","1. Mengembangkan Seeklaim sebagai solusi berbasis AI untuk mendeteksi dini klaim berisiko, khususnya *phantom billing* dan *repeat billing* pada fasilitas kesehatan.\n\n2. Membantu verifikator BPJS Kesehatan memprioritaskan klaim yang berisiko tinggi melalui pemberian skor risiko dan alasan yang dapat ditelusuri.\n\n3. Meningkatkan efisiensi proses verifikasi klaim dengan mengarahkan pemeriksaan manusia pada klaim yang paling membutuhkan perhatian.\n\n4. Mendukung perlindungan dana JKN dengan mencegah","Seeklaim merupakan solusi berbasis AI yang dirancang untuk membantu mendeteksi dini klaim berisiko pada fasilitas kesehatan, dengan fokus pada phantom billing dan repeat billing. Seeklaim menganalisis setiap klaim melalui tiga lapis deteksi, yaitu pemeriksaan duplikasi klaim, pencocokan klaim dengan jejak layanan seperti kunjungan, resep, obat, dan pemeriksaan penunjang, serta deteksi pola anomali menggunakan AI.\n\nHasil analisis kemudian menghasilkan skor risiko 0–100 beserta alasan yang menjelaskan faktor penyebabnya. Klaim dengan risiko tinggi akan diprioritaskan dalam dashboard sehingga verifikator BPJS Kesehatan dapat memfokuskan pemeriksaan pada klaim yang paling membutuhkan perhatian. Keputusan akhir tetap berada pada verifikator, sementara umpan balik hasil verifikasi dapat digunakan untuk meningkatkan sistem.\n\nDengan pendekatan tersebut, Seeklaim bertujuan meningkatkan efisiensi verifikasi, memberikan peringatan dini sebelum klaim dibayarkan, serta membantu melindungi dana JKN","Implementasi Seeklaim diharapkan memberikan dampak pada efisiensi dan integritas proses verifikasi klaim JKN. Dengan memberikan skor risiko dan memprioritaskan klaim yang berpotensi bermasalah, verifikator dapat lebih fokus memeriksa klaim berisiko tinggi dibandingkan memeriksa seluruh klaim secara merata.\n\nBagi BPJS Kesehatan, Seeklaim berpotensi mempercepat proses verifikasi dan memberikan peringatan dini sebelum klaim dibayarkan. Bagi fasilitas kesehatan yang jujur, sistem dapat membantu meng"],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Juliana","s":null}]},{"id":"2855","tim":"Kanjuruhan 4","inov":"Rekonsiliasi Kepesertaan Pekerja dalam Program Jaminan Kesehatan Nasional","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2855_Proposal_PekerjaTerjaga_Healthkathon_2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Perbedaan antara daftar pekerja aktif dan catatan kepesertaan JKN dapat menyulitkan pemeriksaan pendaftaran serta mutasi pekerja. Diperlukan alat bantu untuk menemukan selisih dan menelusuri penyebabnya.","Merancang PekerjaTerjaga untuk membantu petugas mencocokkan data pekerja dan kepesertaan, menjelaskan selisih, serta mencatat klarifikasi dan tindak lanjut.","PekerjaTerjaga dirancang untuk menghasilkan tiga status: sesuai pada data tersedia, perlu klarifikasi, dan belum dapat dinilai. Setiap temuan disertai alasan untuk diperiksa petugas. Solusi saat ini berupa rancangan dan mockup, dengan pengembangan prototipe menggunakan data sintetis.","Solusi diharapkan mempercepat pemeriksaan, mempermudah koreksi data kepesertaan, dan mendukung kepatuhan pemberi kerja. Dampaknya akan diuji melalui waktu pemeriksaan, ketepatan temuan, dan penyelesaian klarifikasi."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2856","tim":"Kelompok Dua Tranformasi Pemerintahan","inov":"SIPEKA: Sistem Informasi Pekerja, Kepesertaan, dan Aduan","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2856_Proposal_SIPEKA_Healthkathon_2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Dalam kepesertaan JKN pekerja penerima upah, perusahaan bertanggung jawab mendaftarkan pekerja, melaporkan upah, dan membayar iuran. Namun, pekerja sulit mencocokkan slip gaji dan hubungan kerjanya dengan data JKN. Akibatnya, pekerja yang belum terdaftar, selisih upah atau iuran, serta keterlambatan pembaruan data dapat terlambat diketahui dan sulit ditindaklanjuti. Diperlukan mekanisme pemeriksaan dan klarifikasi tanpa langsung menyimpulkan adanya pelanggaran.","SIPEKA bertujuan membantu pekerja memantau kesesuaian data kepesertaan JKN dengan kondisi kerjanya, mendeteksi potensi ketidaksesuaian lebih dini, serta mengajukan laporan berbukti. Sistem ini juga menyediakan alur klarifikasi bagi perusahaan dan peninjauan bagi petugas BPJS Kesehatan, dengan status tiket yang dapat dipantau hingga selesai.","SIPEKA (Sistem Informasi Pekerja, Kepesertaan, dan Aduan) adalah prototipe platform digital untuk menghubungkan pekerja, perusahaan, dan petugas BPJS Kesehatan dalam penanganan ketidaksesuaian administrasi JKN. Pekerja memilih periode, melihat status kepesertaan, dan membandingkan data kerja, upah, potongan, serta catatan iuran. Jika ada perbedaan, pekerja dapat mengirim tiket beserta bukti dan memantau tindak lanjutnya. Perusahaan memeriksa data terkait dan memberikan klarifikasi; petugas BPJS meninjau bukti, meminta informasi tambahan bila perlu, lalu mencatat hasil dan mengubah status tiket. Pencocokan data menghasilkan sinyal yang disertai alasan, bukan vonis pelanggaran otomatis. Prototipe saat ini menggunakan data sintetis dan belum terhubung dengan sistem resmi BPJS Kesehatan.","SIPEKA diharapkan meningkatkan transparansi bagi pekerja, membantu perusahaan menemukan dan mengklarifikasi perbedaan data lebih cepat, serta memberi petugas BPJS Kesehatan kasus yang lebih terstruktur untuk diprioritaskan. Jejak bukti, komunikasi, dan status tiket yang terdokumentasi dapat mengurangi laporan berulang dan mendukung penanganan risiko kepesertaan JKN secara lebih efisien."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2864","tim":"Tim Hebat","inov":"Healthkathon","kat":"Efisiensi Risiko pada Peserta JKN","f":"2864_PTTD_Propo HealthKathon.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN memiliki cakupan peserta dan fasilitas kesehatan yang sangat besar, sehingga pemantauan pola pemanfaatan layanan, obat, dan alat kesehatan menjadi tantangan. Risiko seperti penggunaan layanan berulang yang tidak sesuai kebutuhan serta penggunaan obat atau alat kesehatan yang perlu ditinjau dapat menyebabkan pemborosan sumber daya. Saat ini, riwayat pemanfaatan belum selalu mudah dianalisis secara menyeluruh karena data dapat tersebar di berbagai sumber. Oleh karena itu, dibutuhkan so","Mengembangkan CareSync sebagai sistem early warning yang mengintegrasikan riwayat pemanfaatan layanan, obat, dan alat kesehatan peserta JKN untuk membantu fasilitas kesehatan mengenali pola yang perlu diverifikasi lebih awal. Sistem ini bertujuan meningkatkan efektivitas proses verifikasi, membantu petugas memprioritaskan kasus berisiko, serta mendorong pemanfaatan layanan kesehatan yang lebih tepat dan efisien.","CareSync merupakan JKN Utilization Early Warning System yang mengintegrasikan data riwayat layanan, obat, dan alat kesehatan dari JKN serta rumah sakit mitra. Data tersebut diproses untuk mengenali pola berdasarkan frekuensi pemanfaatan, interval waktu, pola penggunaan obat, serta kombinasi layanan dan obat. Hasil analisis ditampilkan sebagai peringatan dini yang dilengkapi pola dan riwayat pendukung agar petugas dapat melakukan verifikasi secara lebih terarah. CareSync tidak secara otomatis menetapkan suatu kasus sebagai fraud atau menolak pelayanan, karena keputusan akhir tetap berada pada petugas melalui proses verifikasi dan human-in-the-loop","CareSync memberikan dampak dengan mengubah proses pemantauan dari yang sebelumnya bersifat reaktif menjadi lebih preventif melalui deteksi pola secara dini. Bagi fasilitas kesehatan, sistem membantu mengurangi penelusuran data secara manual dan meningkatkan efektivitas verifikasi. Bagi BPJS Kesehatan, kasus yang memerlukan perhatian dapat diprioritaskan sehingga sumber daya verifikator digunakan lebih terarah. Bagi peserta JKN, pemanfaatan layanan dapat menjadi lebih terkontrol tanpa menghilangk"],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Susi Lusiani","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"1993","tim":"AyikTech","inov":"CLAIMGUARD AI – Evidence-Based Claim Risk Detection","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"1993_CLAIMGUARD_AI_Healthkathon_2026_Final.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN membutuhkan pengelolaan klaim yang akurat, efisien, dan berintegritas. Salah satu risikonya adalah phantom dan repeat billing, yaitu klaim atas layanan yang tidak diberikan atau diajukan berulang. Kompleksitas data pelayanan membuat pemeriksaan dokumen secara terpisah kurang optimal. CLAIMGUARD AI menghubungkan data klaim dengan bukti pelayanan untuk mendeteksi anomali lebih dini dan memprioritaskan klaim yang perlu diverifikasi.","CLAIMGUARD AI bertujuan membangun sistem early-warning berbasis AI untuk mendeteksi risiko phantom dan repeat billing pada klaim JKN dengan menghubungkan data klaim dan bukti pelayanan. Sistem membantu memprioritaskan klaim yang perlu diverifikasi, memberikan penjelasan faktor risiko, mempercepat screening, dan mendukung reviewer mengambil keputusan berbasis evidence melalui mekanisme human-in-the-loop.","CLAIMGUARD AI merupakan sistem AI-powered Claim Integrity & Early Warning untuk membantu mendeteksi risiko phantom dan repeat billing pada klaim JKN. Sistem menghubungkan data klaim dengan bukti pelayanan seperti rekam medis, encounter, diagnosis, tindakan, data provider, jadwal pelayanan, dan riwayat klaim. Data dianalisis melalui rule-based validation, anomaly detection, similarity detection, dan risk scoring untuk menghasilkan Claim Risk Score 0–100. Fitur Evidence Graph menampilkan hubungan klaim dengan evidence serta alasan munculnya risiko. Klaim dikategorikan Low, Medium, atau High Risk untuk membantu reviewer memprioritaskan verifikasi. CLAIMGUARD AI bersifat decision-support: AI memberikan early warning, sedangkan keputusan akhir tetap dilakukan oleh manusia.","CLAIMGUARD AI diharapkan meningkatkan efisiensi dan integritas proses klaim dengan mempercepat screening, memprioritaskan klaim berisiko, serta membantu menemukan indikasi phantom dan repeat billing lebih dini. Dampak diukur melalui precision/recall, false positive rate, waktu screening dan investigasi, kelengkapan evidence chain, serta potensi nilai klaim berisiko yang teridentifikasi."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2076","tim":"REIIIXX","inov":"MedTrack","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2076_MedTrack (1).pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Latar belakang MedTrack mencakup tiga masalah utama: kelangkaan informasi rujukan alkes antar-rumah sakit secara manual, ketidaksinkronan pencatatan logistik yang memicu inflated bills, serta risiko integritas JKN akibat potensi klaim ganda atau fiktif. Masalah ini diperparah oleh potensi fraud kesehatan yang masif dan tingginya selisih antara klaim dengan rekam medis, sehingga dibutuhkan validasi klaim otomatis secara real-time.","Mencegah Kebocoran Dana JKN: Mengalihkan pendekatan pengawasan dari audit reaktif (post-hoc audit) menjadi validasi preventif (pre-claim validation) guna menutup celah kecurangan atau klaim fiktif pada alat kesehatan.\nMempercepat Rujukan & Transparansi: Menyediakan akses informasi ketersediaan alat kesehatan secara real-time antar-rumah sakit untuk memangkas proses rujukan manual yang lambat.\nEfisiensi Pengelolaan Faskes: Membantu fasilitas kesehatan dan verifikator BPJS dalam mengontrol inventa","MedTrack adalah platform digital terpusat yang dirancang untuk menghadirkan transparansi stok alat kesehatan (real-time) serta otomatisasi audit klaim Jaminan Kesehatan Nasional (JKN).\n\nSistem ini mengintegrasikan tiga komponen utama:\n\nDashboard Monitoring & Logistik: Menyajikan data ketersediaan alkes antar-rumah sakit dan pencatatan transaksi penggunaan berbasis timestamp.\n\nModel Machine Learning & Aturan Inventaris: Memanfaatkan algoritma seperti XGBoost/LightGBM untuk mendeteksi anomali/potensi klaim ganda (cloning), Prophet untuk memproyeksikan tren kebutuhan stok, serta rumus Reorder Point (ROP) untuk peringatan restock otomatis.\n\nValidasi Pra-Klaim (Pre-Claim Validation): Mencocokkan data klaim biaya dengan pemakaian fisik riil sebelum diajukan ke BPJS Kesehatan, sehingga verifikasi menjadi lebih akurat tanpa mengabaikan keputusan akhir yang tetap berada di tangan verifikator manusia (human-in-the-loop).","MedTrack adalah platform transparansi stok alat kesehatan (alkes) real-time dan validasi pra-klaim JKN. Latar belakangnya didasari kelangkaan informasi rujukan alkes antar-RS, ketidaksinkronan pencatatan yang memicu inflated bills, serta tingginya potensi fraud JKN. Tujuannya mencegah kebocoran dana JKN secara preventif, mempercepat rujukan, dan mengotomatisasi audit. Dampaknya, pasien mendapat rujukan lebih cepat, faskes efisien mengelola stok, dan BPJS mampu menekan klaim fiktif."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Juliana","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2189","tim":"Alamak","inov":"KlaimGuard: Deteksi Dini Fraud Upcoding & Unbundling Klaim JKN Berbasis Machine Learning","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2189_Healthkaton2026_Tim_Alamak.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Manipulasi diagnosis (Upcoding) dan pemecahan prosedur (Unbundling) di rumah sakit rujukan berpotensi menguras kas Dana Jaminan Sosial Rp6 triliun per tahun (KPK). Pelanggaran regulasi Permenkes No. 36/2015 ini belum teratasi akibat proses verifikasi yang masih mengandalkan pemeriksaan manual berurutan tanpa pembobotan risiko, serta audit yang terlambat karena baru dilakukan setelah pembayaran selesai dan menimbulkan konflik penagihan kembali.","Proposal ini bertujuan menghentikan kebocoran Dana Jaminan Sosial melalui penapisan otomatis pra-pencairan yang bekerja instan tanpa menghambat likuiditas rumah sakit. Selain itu, sistem dirancang meningkatkan efisiensi verifikator medis dengan memusatkan telaah manual hanya pada 35% berkas berisiko anomali, serta mempercepat penyelesaian sengketa klaim faskes secara adil berlandaskan regulasi resmi Kemenkes.","KlaimGuard adalah sistem verifikasi klaim otomatis yang memeriksa tagihan rumah sakit sebelum pembayaran dicairkan melalui penapisan terpadu: menolak pemecahan paket tindakan operasi yang dilarang dipisah (Unbundling) sesuai Permenkes No. 76/2016, memvalidasi keabsahan diagnosis penyakit berat terhadap bukti riil hasil lab dan terapi dokter guna mencegah penulisan kode berlebihan (Upcoding), memeringkat antrean berkas paling mencurigakan berdasarkan kewajaran rasio biaya dan lama rawat inap, serta membuat draf surat sanggahan resmi lengkap dengan rujukan pasal Kementerian Kesehatan. Pemrosesan instan 1 detik per berkas menjamin pengawasan kas jaminan sosial berjalan ketat tanpa mengganggu arus kas rumah sakit, menempatkan verifikator medis sebagai penentu keputusan final, dan menjaga privasi data peserta sesuai UU Perlindungan Data Pribadi.","Inovasi ini berpotensi menyelamatkan dana jaminan sosial Rp600–900 miliar per tahun melalui reduksi kebocoran klaim 10%–15%. Selain itu, sistem meringankan beban verifikator dengan memusatkan telaah pada 35% berkas berisiko, mempercepat pencairan dana bagi rumah sakit atas klaim yang layak bayar, serta melindungi hak pasien dengan mencegah manipulasi rawat inap fiktif agar ketersediaan tempat tidur rumah sakit tetap terjaga."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2278","tim":"Unlimited","inov":"ARAH JKN: Asisten Rute Akses Kesehatan Berbasis AI untuk Efisiensi Pelayanan JKN","kat":"Efisiensi Risiko pada Peserta JKN","f":"2278_Proposal Healthackathon_Unlimited.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Peserta JKN masih dapat menghadapi ketidakpastian dalam menentukan jalur pelayanan ketika mengalami keluhan kesehatan seperti apakah perlu ke IGD, FKTP, atau membutuhkan rujukan. Di sisi lain, informasi JKN sudah tersedia melalui berbagai kanal, tetapi peserta tetap perlu memahami informasi mana yang relevan dengan kondisi yang dialami. Ketidakpastian dalam menentukan jalur pelayanan dapat meningkatkan risiko pemanfaatan pelayanan yang tidak perlu.","Mengembangkan ARAH JKN sebagai asisten navigasi berbasis AI yang membantu peserta memahami dan menentukan jalur pelayanan JKN sebelum berobat. ARAH JKN menerjemahkan keluhan dan konteks peserta menjadi panduan jalur pelayanan, informasi fasilitas yang relevan, serta langkah berikutnya secara aman, transparan, dan sesuai aturan yang berlaku.","ARAH JKN (AI-Powered JKN Care Pathway Navigator) adalah platform navigasi pelayanan JKN berbasis percakapan melalui WhatsApp. Peserta dapat menceritakan keluhan dan menjawab pertanyaan kontekstual yang relevan. Sistem kemudian memanfaatkan Large Language Model (LLM), Retrieval-Augmented Generation (RAG), knowledge JKN yang tervalidasi, serta aturan keselamatan dan jalur pelayanan untuk menghasilkan panduan yang dapat ditelusuri. ARAH JKN membantu peserta memahami jalur pelayanan yang relevan, memberikan alasan dan langkah berikutnya, serta menawarkan pilihan fasilitas sesuai kebutuhan. ARAH JKN tidak mendiagnosis, memberikan resep, atau menggantikan keputusan tenaga kesehatan. Pengembangan dilakukan secara bertahap melalui prototype, validasi bersama tenaga kesehatan, dan pilot terbatas sebelum integrasi lebih lanjut dengan ekosistem JKN.","ARAH JKN diharapkan meningkatkan pemahaman peserta terhadap jalur pelayanan dan membantu mereka mengambil langkah yang lebih tepat sebelum berobat. Dengan navigasi yang lebih jelas, solusi ini berpotensi mengurangi risiko pemanfaatan pelayanan yang tidak perlu, memperbaiki pengalaman perjalanan layanan peserta, serta mendukung efisiensi pemanfaatan sumber daya JKN. Dampak akan divalidasi melalui indikator navigasi, keselamatan, pemahaman pengguna, dan utilisasi layanan pada tahap pilot."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2312","tim":"Walet","inov":"HealthVision","kat":"Efisiensi Risiko pada Peserta JKN","f":"2312_HealthVision_v3.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kepanikan peserta BPJS saat melihat perubahan fisik sering memicu keputusan yang kurang tepat. Hal ini membuat mereka mencari pelayanan medis yang belum diperlukan, atau sebaliknya, menunda pemeriksaan kondisi yang berisiko. Mobile JKN memang telah memiliki layanan AI seperti Tara AI, namun kapabilitas analisis visual langsung lewat kamera belum tersedia. Health Vision hadir untuk melengkapi informasi awal dengan bukti visual sebelum peserta menentukan langkah selanjutnya.","Health Vision bertujuan untuk memberikan informasi awal kesehatan berbasis bukti visual yang akurat, aman, dan kontekstual sebelum peserta menentukan langkah perawatan. Sistem ini dirancang untuk mengarahkan peserta apakah kondisinya cukup dipantau mandiri (Monitor) atau memerlukan konsultasi ke fasilitas kesehatan (Follow-Up). Dengan demikian, inovasi ini membantu mencegah penggunaan layanan medis yang tidak perlu tanpa membatasi hak akses peserta maupun menggantikan peran tenaga kesehatan.","Health Vision merupakan modul visual AI pre-screening yang dirancang untuk melengkapi ekosistem Mobile JKN. Peserta memilih area pemeriksaan mata, mulut, atau kulit/wajah kemudian mengambil foto. Sistem terlebih dahulu memeriksa kualitas gambar, lalu Specialist Vision Model menganalisis pola visual pada area tersebut. Jika masih diperlukan informasi tambahan, Medical Multimodal AI membantu menentukan konteks yang perlu ditanyakan kepada peserta, sebelum Policy Engine menghasilkan rekomendasi Monitor atau Follow-Up secara terstruktur. Seluruh proses dirancang sebagai stateless service, sehingga foto peserta tidak disimpan secara permanen. Selain itu, Health Vision menggunakan dataset-ready architecture, sehingga pada tahap pengembangan berikutnya model spesialis dapat diperbarui menggunakan dataset klinis yang tervalidasi tanpa harus mengubah keseluruhan arsitektur maupun menggunakan foto langsung peserta sebagai data pelatihan untuk melindungi privasi data.","Bagi peserta, Health Vision memberikan edukasi dan kejelasan informasi awal agar dapat mengambil keputusan kesehatan secara percaya diri. Bagi fasilitas kesehatan, modul ini mendukung triase yang efektif dan mengurangi kunjungan pasien yang belum memerlukan penanganan langsung. Dalam jangka panjang, sistem ini berdampak positif pada efisiensi pembiayaan program JKN melalui pengurangan beban biaya yang tidak perlu, sekaligus memperkuat upaya pencegahan penyakit dan literasi masyarakat."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2531","tim":"Lunaris Venya","inov":"LUMINA -Layanan Utama Monitoring Integritas Klaim & Deteksi Anomali Fasilitas Kesehatan JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2531_Lumina - Efisiensi Risiko Fasilitas Kesehatan (Healthkathon 2026) - Final.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN menaungi 3.221 rumah sakit rujukan dengan 725 juta kunjungan layanan pada 2025. Audit KPK-Kemenkes-BPJS 2024 menemukan 3 dari 6 rumah sakit sampel (50%) terbukti phantom billing, dari 4.341 tagihan fisioterapi, hanya 1.070 didukung catatan medis, berpotensi rugi Rp29,4 miliar dari satu RS (total Rp35 miliar). Klaim fiktif sulit terlihat sendiri, namun menonjol saat dibandingkan dengan pola sejawatnya, sementara audit manual hanya menjangkau sedikit faskes.","LUMINA bertujuan mendeteksi anomali klaim secara proaktif sebelum dana cair, menyisir seluruh klaim faskes secara sistematis, bukan sekadar sampel, tetapi menyediakan bukti objektif berbasis perbandingan statistik antar-faskes, serta meringankan beban tim investigasi BPJS Kesehatan dengan berkas kasus yang siap ditindaklanjuti dan dapat dipertanggungjawabkan secara transparan kepada seluruh pemangku kepentingan program JKN.","LUMINA adalah sistem deteksi risiko klaim berbasis analisis anomali statistik antar kelompok sebanding (peer-based anomaly detection), yang membandingkan pola klaim satu faskes dengan kelompok sebandingnya (faskes dan pasien berdemografi serta riwayat berobat serupa dari Sistem JKN). Alurnya mencakup deteksi sinyal, pembentukan peer-based, penyusunan profil dan skor risiko yang explainable, hingga tinjauan akhir oleh tim manusia. Seluruh pengembangan memakai data sintetis dengan identitas yang ditokenisasi.","LUMINA mengubah investigasi fraud JKN dari reaktif-manual menjadi proaktif-terbantu AI, sehingga dana JKN lebih terjaga untuk peserta jujur, faskes jujur terlindungi dari kecurigaan salah sasaran karena pembanding kontekstual, beban investigasi manual tim anti-fraud BPJS berkurang signifikan, dan alokasi dana JKN menjadi lebih tepat sasaran bagi keberlangsungan program secara keseluruhan."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Yanuar Milad","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2602","tim":"Mill Lane","inov":"KlaimSiaga: Asisten Triase Klaim JKN Berbasis Machine Learning dan Explainable AI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2602_Proposal_Healthkathon2026_KlaimSiaga_Faskes.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Timbunan ribuan berkas klaim rawat inap JKN harian menjadi tantangan utama verifikator BPJS Kesehatan. Berdasarkan regulasi dan temuan KPK, praktik upcoding dan unbundling berpotensi merugikan negara hingga ratusan miliar rupiah. Metode verifikasi manual maupun aturan kaku saat ini cenderung lambat dan minim penjelasan (black-box), sehingga memicu kelelahan pemeriksaan (alert fatigue) serta meningkatkan risiko ketidakadilan penilaian terhadap faskes rujukan.","Mengembangkan KlaimSiaga sebagai asisten triase berbasis AI guna membantu verifikator BPJS Kesehatan memprioritaskan peninjauan klaim rawat inap. Solusi ini bertujuan meningkatkan efisiensi pemeriksaan, menyajikan transparansi Explainable AI (XAI) di setiap indikasi anomali, serta menekan risiko kebocoran anggaran JKN dari praktik upcoding dan unbundling melalui pendekatan akuntabel berbasis kendali manusia (human-in-the-loop).","KlaimSiaga adalah platform triase digital berbasis machine learning untuk efisiensi risiko faskes pada klaim JKN rawat inap. Sistem ini mengombinasikan empat mekanisme deteksi tanpa label: prediksi severity klinis (usia, diagnosis sekunder, lama rawat), benchmark residual sekelas RS (z-score), pengenalan anomali Isolation Forest, dan aturan pencocokan unbundling. KlaimSiaga tidak memberikan vonis otomatis, melainkan mengurutkan klaim ke dalam antrean berperingkat risiko (skor 0-100) disertai penjelas Explainable AI (XAI) atas indikasi anomali. Verifikator memegang penuh kendali (human-in-the-loop) untuk menentukan keputusan: disetujui, klaim klarifikasi, atau eskalasi ke tim anti-fraud. Antarmuka berbasis Streamlit dan mematuhi UU PDP menggunakan data sintetis.","KlaimSiaga memangkas durasi verifikasi klaim berisiko tinggi dan mengurangi intensitas audit acak pada faskes yang patuh. Penggunaan pembanding sekelas RS mencegah bias sistemik terhadap rumah sakit rujukan dengan kompleksitas kasus tinggi. Lewat penjelasan XAI, keputusan verifikasi menjadi lebih transparan, objektif, meminimalisir alert fatigue, serta melindungi integritas dana JKN dari potensi kecurangan."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2739","tim":"CollsCode","inov":"Deteksi Fraud Identitas Peserta JKN Menggunakan Validasi Kemustahilan Spasial-Temporal","kat":"Efisiensi Risiko pada Peserta JKN","f":"2739_Nexus-ID_JKN___Healthkathon_2026_20261008021158.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Dengan 280 juta peserta JKN di seluruh Indonesia, penyalahgunaan identitas (sewa kartu dan kunjungan fiktif) merupakan fraud yang sangat sulit dideteksi. Namun, bukti kemustahilan ada pada data log kunjungan, jika satu ID berobat di Jakarta pukul 08:00 dan di Bali pukul 09:30 pada hari yang sama, klaim itu pasti fiktif. Secara fisika, tidak mungkin berpindah sejauh 1.090 km hanya dalam 1,5 jam. Data DJSN Tabel 4.6 & 5.6 bisa jadi baseline kalibrasi regional lewat variasi intensitas kunjungannya.","Membangun sistem deteksi penyalahgunaan identitas JKN yang mampu: (1) Menghitung jarak geografis antar-faskes pada ID pasien yang sama via formula Haversine; (2) Mengkalkulasi kecepatan mobilitas dari selisih jarak & waktu; (3) Mendeteksi kemustahilan spasial-temporal (kecepatan >300 km/h antar-provinsi atau >900 km/h) sebagai anomali. kritis; (4) Menghasilkan flag anomali matematis untuk bukti investigasi. (Data: Statistik JKN 2016–2021, diterbitkan oleh DJSN bersama BPJS Kesehatan 2022).","Nexus-ID JKN adalah sistem analitik spasial-temporal berbasis web MVP fungsional. Sistem menerima log kunjungan pasien dalam format CSV (ID Pasien, Faskes, Koordinat, Tanggal, Jam) dan menjalankan Haversine Distance Engine untuk menghitung jarak great-circle antar pasangan kunjungan berurutan per ID. Kecepatan implisit dihitung dengan formula v = d/t, di mana d adalah jarak Haversine dan t adalah selisih waktu. Threshold berlapis diterapkan: > 900 km/h dikategorikan MUSTAHIL FISIK (eskalasi langsung), 300–900 km/h SANGAT MENCURIGAKAN (verifikasi lanjutan), dan < 300 km/h lintas provinsi dalam < 4 jam MENCURIGAKAN (monitor). Kalibrasi regional menggunakan data intensitas kunjungan RJTP per provinsi dari DJSN untuk menyesuaikan threshold berdasarkan pola mobilitas normal daerah tersebut. Visualisasi utama adalah peta mobilitas Indonesia interaktif (D3.js SVG) dengan arc berwarna yang menampilkan setiap pergerakan ID — arc merah berputus-putus menandai kemustahilan fisika yang terdeteksi.","Nexus-ID JKN memanfaatkan hukum fisika sebagai validator mutlak yang bebas dari rekayasa administratif—tidak ada yang bisa hadir di dua lokasi bersamaan. Anomali terdeteksi merupakan bukti matematis pasti, bukan sekadar indikasi probabilistik. Sistem ini berpotensi mengidentifikasi ribuan penyalahgunaan aktif yang tidak terpantau, sekaligus menyelamatkan dana JKN dari klaim fiktif. Sebagai byproduct, sistem menghasilkan peta mobilitas kesehatan nasional sebagai dasar kebijakan distribusi faskes."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Juliana","s":null}]},{"id":"2742","tim":"SMILE","inov":"RADAR : Risk-base Alert for Detecting Anomalous Reporting","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2742_RADAR â€“ Proposal Healthkathon 2026 (1) (1).pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Iuran 38,3 juta peserta PPU badan usaha bergantung sepenuhnya pada laporan pemberi kerja. DJSN mencatat masih ada badan usaha yang tidak mendaftarkan seluruh pekerjanya atau melaporkan upah di bawah ketentuan, di tengah turunnya aset neto Dana JKN sebesar Rp11,8 triliun pada 2025. Pemeriksaan yang masih acak dan reaktif membuat ketidakpatuhan lolos, iuran hilang, dan pekerja baru tahu tidak terlindungi saat sakit.","Mendeteksi dini empat modus ketidakpatuhan pelaporan: pendaftaran pekerja sebagian (PDUK), pelaporan upah lebih rendah, misklasifikasi hubungan kerja, dan manipulasi data mutasi.\nMengubah pemilihan target pemeriksaan dari acak menjadi berbasis risiko yang dapat dijelaskan.\nMendukung petugas dari penentuan prioritas hingga tindak lanjut yang terdokumentasi.\nMeningkatkan iuran yang tertagih dan memastikan lebih banyak pekerja terlindungi sejak awal bekerja.","RADAR (Risk-based Alert for Detecting Anomalous Reporting) adalah sistem skor risiko kepatuhan pemberi kerja berbasis AI. RADAR menyilangkan data kepesertaan, upah, mutasi, dan iuran dengan data pembanding, lalu menilai setiap badan usaha terhadap usaha sejenis. Kombinasi 8 aturan regulasi dan machine learning (Isolation Forest) menghasilkan skor 0–100, tiga level risiko, dan tiga alasan untuk petugas. Dasbor radar membantu petugas menentukan prioritas, membuat action plan, dan mencatat log harian. Keputusan tetap di tangan petugas. Prototype sudah berfungsi dengan data sintetis.","Uji prototype pada data sintetis menunjukkan 92% dari 200 badan usaha berskor tertinggi memang berpola tidak patuh, jauh di atas 18% bila dipilih acak. Dengan jumlah pemeriksaan yang sama, selisih iuran yang ditemukan 4,9 kali lebih besar, dan hanya 2,2% badan usaha patuh yang salah tertandai. Hasilnya, pekerja terlindungi sejak awal bekerja, pemeriksaan BPJS Kesehatan lebih tepat sasaran, dan iuran JKN lebih banyak tertagih. Dampak nyata akan diukur saat pilot."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2820","tim":"Smart Triage Alkhairaat","inov":"Smart Triase JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2820_PROPOSAL INOVASI HEALTHKATHON 2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Transformasi JKN saat ini juga mengarah pada sistem rujukan yang lebih berorientasi pada kompetensi fasilitas dan kebutuhan medis pasien. \nDalam praktik pelayanan, terdapat dua risiko yang berlawanan.\nA. Over-referral\nPasien yang sebenarnya masih dapat ditangani di FKTP dirujuk ke rumah sakit.\nUnder-referral/delayed referral\nPasien dengan kondisi yang membutuhkan pelayanan lanjutan tidak segera dikenali atau dirujuk.","Mengembangkan sistem digital clinical risk stratification untuk membantu meningkatkan ketepatan alur pelayanan dan rujukan peserta JKN berdasarkan kebutuhan medis.","SMART-TRIAGE JKN dirancang untuk beberapa pengguna.\n1. Peserta JKN\nMenggunakan aplikasi untuk:\n•\tmelakukan pre-screening;\n•\tmemasukkan keluhan;\n•\tmendapatkan arahan awal;\n•\tmemperoleh QR Code hasil screening.\n2. FKTP\nDokter/tenaga kesehatan dapat:\n•\tmelihat hasil screening;\n•\tmelakukan verifikasi;\n•\tmelakukan pemeriksaan klinis;\n•\tmenetapkan keputusan akhir;\n•\tmeneruskan informasi pasien.\n3. Fasilitas Kesehatan Rujukan\nRumah sakit dapat menerima:\n•\tQR Code;\n•\tringkasan keluhan;\n•\tparameter klinis;\n•\thasil stratifikasi;\n•\talasan rujukan.\n4. Pengelola JKN\nPada tahap pengembangan lebih lanjut dapat memperoleh dashboard agregat untuk melihat pola risiko dan rujukan.","Jangka pendek\n•\tmemperbaiki proses triase;\n•\tmeningkatkan awareness red flags;\n•\tmembantu keputusan pelayanan;\n•\tmenghasilkan digital clinical summary.\nJangka menengah\n•\tmenurunkan inappropriate referral;\n•\tmeningkatkan ketepatan rujukan;\n•\tmengurangi waktu pelayanan.\nJangka panjang\n•\tmendukung sistem rujukan berbasis kompetensi;\n•\tmeningkatkan efisiensi JKN;\n•\tmenghasilkan data untuk population risk management."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Juliana","s":null}]},{"id":"2862","tim":"Power Ranger Merah","inov":"BuktiLayan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2862_BuktiLayan â€” Proposal Healthkathon 2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Temuan Itjen Kemenkes (2024) di 3 RS mencatat 3.269 dari 4.341 klaim fisioterapi diduga fiktif (Rp501,27 juta) karena ketiadaan rekam medis. Bukti kunjungan, tindakan, dan jadwal petugas kerap tersimpan terpisah dalam beragam format. Verifikator harus mencocokkan dokumen manual, memicu beban kerja dan risiko kekeliruan. Diperlukan alat bantu penelusuran bukti dalam ekosistem verifikasi klaim.","Membantu verifikator dan tim anti-fraud merekonsiliasi bukti sesi fisioterapi secara terarah; menghadirkan ketertelusuran per sesi dengan kutipan sumber dokumen asli; mendeteksi ketidaksesuaian bukti lebih dini sebelum eskalasi klaim; serta menjaga integritas dana JKN dan hak peserta melalui pengawasan akuntabel tanpa penolakan otomatis (human-in-the-loop).","BuktiLayan adalah aplikasi web asisten verifikasi yang mencocokkan rincian klaim fisioterapi dengan bukti kunjungan, tindakan, dan jadwal petugas. Sistem menggunakan AI lokal untuk mengekstrak data terstruktur dari catatan naratif, dipadukan aturan rekonsiliasi yang transparan dan tersimpan per versi. Kasus ambigu masuk ke antrean klarifikasi untuk diputuskan oleh verifikator.","Mempercepat waktu pemeriksaan klaim (target median turun =30%), mencapai akurasi tinggi (precision =85%, recall =80%), dan menjamin 100% penandaan memiliki alasan serta jejak sumber. Faskes dapat memperbaiki berkas lebih dini, BPJS Kesehatan lebih mudah menelusuri bukti, serta integritas dana JKN terlindungi tanpa merugikan peserta."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2878","tim":"PTTD 666","inov":"JejakLayan - Berkas boleh lengkap, tapi apakah layanannya benar-benar terjadi?","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2878_Proposal Healthkathon 2026_JejakLayan_PTTD 666.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Dalam program JKN, kerap terjadi masalah phantom dan repeat billing di mana layanan fiktif tetap diajukan sebagai klaim. Kasus nyata pada tahun 2024 menunjukkan temuan tagihan fiktif senilai Rp34 miliar. Manipulasi semacam ini sangat sulit dideteksi secara manual karena dokumen administratif yang diajukan telah direkayasa agar terlihat lengkap dan wajar.","Tujuan utama sistem ini adalah membantu verifikator menyeleksi dan menemukan klaim anomali yang perlu diperiksa lebih lanjut. Sistem tidak berupaya menggantikan proses verifikasi atau memberikan tuduhan otomatis, melainkan bertindak sebagai lapisan pemeriksaan pelengkap. Hal ini bertujuan agar proses investigasi klaim menjadi jauh lebih terarah dan efisien dengan alasan pemeriksaan yang konkret.","JejakLayan merupakan sistem analisis berbasis kecerdasan buatan (AI) yang memeriksa jejak keabsahan layanan di balik sebuah dokumen. Sistem memproses lima indikator: pola waktu dan wilayah, catatan kehadiran peserta, rasionalitas tenaga medis, duplikasi klaim, dan hubungan janggal antar pihak. Jika terdeteksi penyimpangan dari kondisi normal, sistem tidak langsung menolak klaim, melainkan memberikan tingkat risiko beserta alasan spesifik. Purwarupa pada sisi antarmuka dasbor dikembangkan secara khusus agar verifikator dapat membaca dan memprioritaskan indikasi risiko dengan mudah sebelum mengambil keputusan final.","Penerapan sistem ini secara langsung mencegah kerugian besar dan melindungi keberlanjutan pembiayaan program JKN. Klaim bermasalah dapat diidentifikasi lebih awal, memungkinkan alokasi waktu verifikator dialihkan pada klaim berisiko tinggi. Sistem juga memastikan fasilitas kesehatan yang jujur tetap terlindungi berkat metode penandaan yang menuntut validasi manusia pada tahap akhir."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Susi Lusiani","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2882","tim":"PUSAKO","inov":"PRISMA-JKN: Triase Klaim Berbasis Aturan, Machine Learning, dan Agen AI untuk Efisiensi Risiko Pelay","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2882_Proposal Healthkathon 2026 Prisma JKN (Tim Pusako).pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Verifikasi klaim INA-CBG masih bertumpu pada pemeriksaan manual atas sampel terbatas dan sebagian besar post-payment, sehingga ketidaksesuaian baru ditemukan setelah dana dibayarkan. Dengan kepesertaan menuju 98% penduduk, selisih antara volume klaim dan kapasitas verifikator melebar tiap tahun. Persoalannya bukan ketiadaan aturan, karena Permenkes 16/2019 sudah mendefinisikan modus kecurangan, melainkan ketiadaan cara tertib menentukan klaim mana yang diperiksa dahulu dan atas dasar apa.","Membangun sistem triase klaim yang mengurutkan prioritas pemeriksaan bagi verifikator BPJS Kesehatan, dengan tiga sasaran: (1) meningkatkan tingkat temuan per satuan beban pemeriksaan, sehingga jumlah klaim yang sama menghasilkan temuan berkali lipat; (2) memastikan tiap penandaan disertai alasan terbaca manusia agar dapat dipakai sebagai dasar konfirmasi ke faskes; (3) menggeser sebagian pemeriksaan dari post-payment ke pra-pembayaran agar ketidaksesuaian dicegat sebelum dana keluar.","PRISMA-JKN adalah lapisan pra-verifikasi yang memberi skor risiko pada tiap klaim masuk, mengurutkannya menjadi antrean prioritas audit, dan menampilkan alasan di balik setiap penandaan. Sistem bekerja tiga lapis. Lapis aturan menyaring anomali yang pasti secara deterministik seperti readmisi, pemecahan episode, dan unbundling, disusun dari Permenkes 16/2019 serta divalidasi koder INA-CBG dalam tim. Lapis machine learning menangani pola samar seperti upcoding, cloning, dan phantom billing memakai XGBoost pada fitur turunan klaim. Lapis agen menyusun draf nota konfirmasi untuk ditinjau verifikator. Di atasnya, SHAP menampilkan faktor pendorong skor per klaim, dan Simple Additive Weighting menggabungkan skor risiko, nilai klaim, serta riwayat temuan faskes menjadi satu peringkat kerja. Keputusan verifikator dicatat dan menjadi label pelatihan ulang. Prototipe sudah berjalan, diuji pada 8.000 klaim simulasi; seluruh pengembangan memakai data simulasi tanpa data peserta JKN riil.","Pada pengujian data simulasi, 100 klaim teratas antrean prioritas menangkap sekitar 82% kasus bermasalah, dibanding sekitar 5% bila diperiksa acak, atau sekitar 16 kali lipat pada beban yang sama. Dampaknya: efisiensi kerja verifikator, pergeseran temuan ke tahap pra-pembayaran, keadilan bagi faskes tertib karena audit terarah pada anomali terukur, dan akuntabilitas karena tiap penandaan punya jejak alasan. Angka ini dari data simulasi dan perlu divalidasi ulang pada data resmi."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Susi Lusiani","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2884","tim":"SaiWork","inov":"SMARTPROTEK","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2884_smart_protek.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Risiko Tersembunyi di Dalam Pola :\n- Program Jaminan Kesehatan Nasional (JKN) yang melayani lebih dari 98% penduduk Indonesia, BPJS Kesehatan mengelola data klaim dalam volume masif. \n- Pendekatan konvensional yang berfokus pada pencocokan aturan (Rule Match / No Match) seringkali gagal menangkap sinyal kecurangan yang tersembunyi.\n- Risiko klaim tidak selalu muncul sebagai duplikasi yang identik seratus persen.","Tujuan utama sistem meningkatkan efektivitas upaya pemeriksaan (review) klaim terutama pada area di mana bukti menunjukkan risiko tertinggi.","SmartProtek JKN adalah sistem intelijen risiko klaim berbasis AI yang mendeteksi anomali Cloning, Phantom Billing, dan Upcoding di fasilitas kesehatan. Sistem ini menganalisis pola tersembunyi untuk menghasilkan skor risiko dan \"Paket Bukti\" komprehensif, bukan sekadar peringatan kaku. Berprinsip \"AI Mendeteksi, Bukti Menjelaskan, Manusia Memutuskan\", SmartProtect bertindak sebagai sistem pendukung untuk memfokuskan investigasi auditor BPJS Kesehatan","SmartProtek JKN memberikan dampak efisiensi dengan memfokuskan investigasi auditor pada prioritas risiko tertinggi, bukan sekadar menambah jumlah peringatan. Kinerja diukur melalui peningkatan Presisi, pemangkasan waktu pemeriksaan, dan kelengkapan bukti. Secara finansial, sistem ini mencegah kebocoran dana JKN dengan mengidentifikasi Potential Preventable Exposure (estimasi nilai klaim berisiko) sebelum keputusan pembayaran dilakukan"],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2886","tim":"Kumar","inov":"SIDIK: Sistem Investigasi & Deteksi Integritas Klaim","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2886_SIDIK_TimKumar_Healthkathon2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["JKN melayani 725,3 juta pemanfaatan layanan pada 2025 (±1,9 juta per hari), sementara BPJS Kesehatan memiliki 1.793 pemeriksa kecurangan dan defisit DJS 2025 mencapai Rp17,13 triliun. Audit yang dipimpin KPK (2024) menemukan indikasi phantom billing di 3 dari 6 RS sampel. Sejak Agustus 2026 klaim RS beralih ke RME berbasis NIK via SATUSEHAT, sehingga bukti klinis kini digital, tetapi volumenya mustahil dibaca manusia satu per satu.","Membantu verifikator BPJS Kesehatan mendeteksi dan memitigasi kecurangan klaim di fasilitas kesehatan (phantom billing, upcoding, unbundling, LOS panjang, readmisi, tindakan/obat fiktif, pengurangan jumlah obat) secara lebih cepat, tepat, dan dapat diaudit, dengan agentic AI yang menyiapkan bukti dan manusia yang memutuskan, sehingga klaim jujur lolos cepat dan dana JKN terlindungi.","SIDIK (Sistem Investigasi & Deteksi Integritas Klaim), \"Setiap Klaim Punya Saksi\", adalah lapisan integritas klaim berbasis agentic AI di atas RME SATUSEHAT, melengkapi VEDIKA dan FRISTA. Saksi 1, Rekam Medis: pra-skor ML memilih ±10% klaim berisiko; orkestrator Google ADK menjalankan agen spesialis (koherensi klinis, koding INA-CBG, episode, lab) dan agen pembukti berbasis RAG Permenkes 16/2019 & 3/2023. Hasilnya dossier berisi petunjuk, kutipan RME, aturan, dan selisih tarif; tanpa kutipan, tanpa flag. Saksi 2, \"Benarkah Ini Anda?\": agen percakapan di Mobile JKN menanyakan pasien layanan/obat yang benar diterima, lalu merekonsiliasi dengan klaim. Verifikator selalu memutuskan dan setiap aksi tercatat di log audit. Fase 2: Saksi Jaringan (graf deteksi cincin kolusi). Status: mockup interaktif 5 layar, data simulasi.","Estimasi berbasis asumsi rancangan (akan divalidasi pada prototipe & pilot): waktu review ±70-80% lebih cepat, ±90% klaim lolos otomatis, kapasitas pemeriksaan ±3-4x dengan jumlah pemeriksa yang sama, dan dossier bukti siap <1 menit. Manfaat: verifikator fokus pada kasus berisiko, faskes jujur dibayar lebih cepat, potensi kerugian dana JKN tercegah lebih dini, dan peserta terlindungi melalui verifikasi layanan."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2895","tim":"AxiomJKN","inov":"Pembongkaran Services Unbundling JKN Melalui Association Rule Mining dan Deteksi Temporal","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2895_Axiom-Unbundle_JKN___Healthkathon_2026_20261008010530.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Unbundling memecah prosedur satu episode menjadi beberapa kunjungan terpisah agar tagihan lebih banyak. Fisioterapi (9339, 9334, 9335) mencatat 6,4 juta kunjungan/tahun—1% pemisahan menghasilkan 64.000 kunjungan fiktif. Setiap tagihan individual tampak sah dengan kode prosedur valid; tidak ada sistem yang melihat hubungan antar-tagihan lintas kunjungan. Audit konvensional buta terhadap modus ini.","Menemukan pasangan prosedur yang secara historis selalu muncul bersamaan dalam satu episode (confidence >90%), mendeteksi split billing jika pasangan tersebut ditagihkan di hari berbeda oleh faskes yang sama untuk pasien yang sama, menghitung Split Frequency Score per faskes, dan menghasilkan estimasi kerugian Rupiah per kasus unbundling tanpa memerlukan data berlabel fraud.","Axiom-Unbundle JKN menerapkan FP-Growth pada data transaksi klaim harian untuk menemukan frequent itemset prosedur. Rule dengan Confidence >90% dan Lift >2.0 dikategorikan \"prosedur yang seharusnya satu paket.\" Split Billing Detector kemudian menjalankan temporal gap check: jika dua prosedur dari pasangan asosiasi kuat ditagih di hari berbeda untuk pasien dan faskes yang sama ? anomali split billing terkonfirmasi. Hasilnya divisualisasikan sebagai network graf interaktif (D3.js) dengan edge merah menandai jalur unbundling. Sistem sepenuhnya unsupervised tidak butuh data berlabel untuk beroperasi. Baseline dari Tabel 8.25 Statistik JKN 2020 (100 Prosedur Terbanyak RJTL). Upload CSV transaksi baru ? mining FP-Growth dan deteksi diperbarui instan.","Mendeteksi fraud yang lolos seluruh sistem audit berbasis aturan statis karena setiap tagihan individual tampak sah. Potensi kerugian unbundling fisioterapi saja: Rp 20–104 miliar/tahun. Sepenuhnya unsupervised menemukan pola fraud baru yang belum pernah diidentifikasi sebelumnya, termasuk kombinasi prosedur yang belum masuk daftar hitam manapun."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"1990","tim":"Fithrah Insani Hebat","inov":"Aegis JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN memproses jutaan klaim layanan kesehatan, sementara kapasitas verifikasi manusia terbatas. Akibatnya, anomali seperti upcoding, phantom billing, unbundling, dan kolusi rujukan sulit dideteksi, terlebih saat pelaku menyamarkan hubungan antardokter dan fasilitas kesehatan. Diperlukan sistem yang dapat menganalisis pola klaim serta relasi lintas entitas secara transparan dan aman, tanpa mengambil alih keputusan akhir verifikator.","Mengembangkan AEGIS-JKN sebagai sistem pendukung keputusan bagi verifikator BPJS Kesehatan untuk mendeteksi anomali dan indikasi sindikat kecurangan klaim JKN. Sistem menggabungkan aturan deterministik, XGBoost, dan Multi-Hop Graph Structure Learning (MHGSL) untuk menganalisis relasi topologi, kemiripan fitur klinis-finansial, dan semantik rujukan. Hasil analisis dijelaskan melalui Explainable AI agar dapat ditinjau manusia.","AEGIS-JKN adalah platform Fraud Intelligence dan Clinical Decision Support System (CDSS) dengan tiga tahap: penyaringan berbasis aturan, klasifikasi XGBoost, dan deteksi relasional Tri-Channel MHGSL. Sistem memetakan hubungan pasien, dokter, fasilitas kesehatan, diagnosis, dan prosedur untuk menemukan pola upcoding, phantom billing, unbundling, serta sindikat rujukan tersamarkan. Hasil deteksi dilengkapi penjelasan SHAP dan visualisasi graf agar dapat ditelusuri. Purwarupa menggunakan dataset sintetis dan data terbuka terdeidentifikasi. AEGIS-JKN hanya memberi rekomendasi; keputusan akhir tetap pada verifikator manusia, dengan perlindungan privasi sesuai prinsip UU PDP.","AEGIS-JKN ditargetkan membantu verifikator memprioritaskan klaim berisiko dan mengurangi waktu telaah awal 30–50%. Dalam evaluasi sampel 300 klaim yang dilaporkan pada proposal, sistem mengidentifikasi 60 klaim anomali dengan estimasi potensi pencegahan kebocoran Rp507,37 juta. Angka ini merupakan hasil evaluasi sampel, bukan jaminan dampak nasional. Inovasi diharapkan meningkatkan transparansi verifikasi dan menjaga Dana Jaminan Sosial Kesehatan."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Juliana","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"1997","tim":"BillBuster","inov":"VeriKlaim: Penyaringan Klaim Top-Up Obat dan Alat Kesehatan pada E-Klaim INA-CBG","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pada 2025, beban jaminan JKN mencapai Rp192,7 triliun, sedangkan iuran hanya Rp176,7 triliun (rasio klaim 109,05%, DJSN). Dalam kondisi seperti ini, klaim yang dibayar tanpa dasar langsung menekan keberlanjutan dana. KPK telah mengungkap kerugian Rp34 miliar akibat phantom billing di tiga rumah sakit. Klaim top-up obat dan alat kesehatan berada di luar tarif paket INA-CBG dan bernilai besar, tetapi sulit diperiksa satu per satu pada volume klaim nasional.","Veriklaim bertujuan membantu verifikator BPJS Kesehatan menentukan klaim top-up obat dan alkes mana yang perlu diperiksa lebih dahulu. Kami menyasar dua pola, yaitu top-up yang tidak didukung nilai tagihan rumah sakit, dan top-up berulang pada kartu peserta yang sama dengan masa rawat inap yang sangat singkat. Setiap klaim dalam antrean disertai alasan dan dokumen yang perlu diminta, sehingga keputusan tetap berada pada verifikator dan dapat dijelaskan kepada rumah sakit.","VeriKlaim membaca berkas TXT E-Klaim INA-CBG dan hanya memproses klaim top-up Special Prosthesis dan Special Drug. Pemeriksaan berjalan dalam dua lapis. Lapis pertama membandingkan TARIF_RS dengan harga acuan item, dan klaim yang tagihannya berada di bawah harga acuan langsung ditandai. Lapis kedua memakai Isolation Forest untuk menangkap klaim yang tidak lazim berdasarkan empat sinyal, yaitu rasio tagihan terhadap harga acuan, lama rawat dibanding INA-CBG sejenis, frekuensi top-up pada kartu yang sama dalam 90 hari, dan volume top-up dibanding rumah sakit sejawat. Skor setiap klaim dijelaskan dengan nilai Shapley, sehingga verifikator melihat faktor penentunya dan dokumen yang perlu diminta. Panjang antrean menyesuaikan kapasitas verifikator, dan setiap keputusan tercatat dalam jejak audit. Aplikasi hanya membaca 21 dari 59 kolom; nama pasien, nomor rekam medis, dan tanggal lahir tidak dibaca. Prototype dapat dicoba di veriklaim.onrender.com (tombol “Coba sebagai juri”, tanpa akun).","Pada 80 klaim sintetis, antrean 16 klaim memuat 13 dari 14 pola bermasalah yang disisipkan. Aturan tagihan saja menangkap 7, dan pemeriksaan acak dengan beban sama rata-rata hanya 2,8. Pada simulasi 2.000 klaim yang menyertakan pengulang sah, presisi antrean pada beban 5% mencapai 4,5 hingga 20 kali pemeriksaan acak. Seluruh angka ini berasal dari data sintetis, sehingga kami mengusulkan uji terbatas bersama BPJS Kesehatan untuk mengukur dampaknya pada klaim riil."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"1999","tim":"Seryu Labs","inov":"JKN Sentinel: Evidence-First Claim Triage","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Data kohort memuat 1.699.219 klaim FKRTL, dengan 45.637 klaim berkategori HIGH (skor = 70,0). Volume klaim rumah sakit ini terlalu besar untuk diperiksa manual satu per satu oleh verifikator BPJS, sehingga sulit menentukan urutan telaah yang efisien. Masalah utamanya bukan sekadar memberi label atau vonis fraud otomatis, melainkan menentukan klaim mana yang perlu dibuka lebih dulu beserta alasan pemeriksaan yang dapat dijelaskan.","Solusinya adalah mengubah klaim terdeidentifikasi menjadi antrean verifikasi terprioritas berdasarkan tingkat risiko (explainable triage queue). Pendekatannya evidence-first: sistem menyajikan data pemicu, perbandingan konteks, dan aturan yang dirujuk tanpa memutuskan fraud secara otomatis. Prinsip human-in-the-loop tetap dijaga: mesin menyaring dan mengurutkan data sebagai alat penunjang keputusan, sedangkan disposisi akhir tetap di tangan verifikator manusia.","JKN Sentinel adalah prototipe fungsional claim triage berbasis bukti yang menghubungkan Prioritas, Alasan, Aturan, dan Tindakan. Sinyal risikonya: anomali biaya terhadap kelompok INA-CBG sejenis, tagihan berulang = 3 hari pada peserta yang sama, restriksi Fornas, dan integritas rujukan PPK. Alur auditnya: Triage, Compare, Brief, Decision. Arsitekturnya: Ingest & Baseline LOO Engine, Parquet Store, FastAPI Backend, dan React Audit Workstation, dengan privacy boundary (demo redacted mode).","JKN Sentinel memangkas ruang pencarian audit sebesar 93,66%, dari 20.000 klaim sintetis menjadi 1.268 klaim prioritas pada ambang. Bagi verifikator, audit awal lebih cepat berkat kartu bukti dan daftar dokumen pendukung yang perlu diminta dari faskes. Bagi pimpinan risiko wilayah, tersedia gambaran pola risiko agregat yang privacy-safe untuk memetakan prioritas pengawasan. Bagi Program JKN, jejak keputusan audit yang terstruktur meningkatkan transparansi dan akuntabilitas."],"r":[{"n":"Juliana","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2001","tim":"Binary","inov":"GARDA - Proactive Agentic Claim Forensics for JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN melayani 284,51 juta peserta (Agustus 2026), sehingga pengelolaan klaim harus akurat. Namun, risiko repeat billing, pemecahan klaim, dan penagihan layanan tanpa bukti masih menjadi tantangan. Dalam pemeriksaan 4.341 klaim fisioterapi, 3.269 klaim diduga fiktif. Deteksi anomali saja tidak cukup; perlu penelusuran kronologi dan bukti. GARDA memadukan analisis deterministik dan AI Agent untuk menyusun kasus investigasi berbasis bukti, sementara keputusan akhir tetap pada manusia.","GARDA bertujuan meningkatkan efisiensi investigasi risiko klaim JKN melalui analisis deterministik dan AI Agent. Sistem ini membantu mendeteksi anomali, menelusuri bukti pendukung, merekonstruksi kronologi pelayanan, serta menghubungkan klaim terkait. Hasil investigasi disusun menjadi Investigation Case yang terstruktur, transparan, dan dapat diverifikasi, sehingga mendukung pengambilan keputusan berbasis bukti tanpa menggantikan kewenangan investigator manusia.","GARDA (Proactive Agentic Claim Forensics for JKN) adalah platform investigasi risiko klaim JKN yang menjembatani deteksi anomali dengan pemeriksaan berbasis bukti. Berfokus pada Repeat Billing, Episode Fragmentation, dan Unsupported Service, GARDA menggabungkan analitik deterministik dan AI Agent untuk menelusuri bukti, merekonstruksi kronologi dan perubahan klaim, menghubungkan klaim terkait, serta menguji hipotesis alternatif. Hasilnya berupa Investigation Case dengan referensi sumber, bukti yang belum tersedia, dan konteks bagi investigato. Prototipe telah berjalan dengan data sintetis, dashboard investigasi, akses AI read-only, dan keputusan akhir oleh manusia. Pada pengujian internal 15 skenario sintetis berlabel, pipeline deterministik mencatat rata-rata waktu persiapan kasus 72,8 ms (tidak termasuk AI Agent). GARDA dirancang untuk mendukung investigasi yang lebih efisien, terlacak, dan akuntabel dengan manusia sebagai pengambil keputusan akhir.","GARDA diharapkan mempercepat investigasi awal klaim JKN dengan menyatukan bukti, kronologi, dan hubungan antarklaim dalam satu kasus terstruktur. Investigator dapat memprioritaskan klaim berisiko, menemukan kekurangan bukti, dan mengurangi pemeriksaan manual. Dampaknya, investigasi menjadi lebih tepat sasaran, transparan, dan akuntabel, sekaligus membantu mencegah potensi kerugian dana JKN akibat klaim tidak sesuai. Keputusan akhir tetap berada pada investigator manusia."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Juliana","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2003","tim":"Weighted Sample","inov":"CLAIRx-Claim Anomaly Intelligence & Risk eXamination-Tim Weighted Sample","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Dengan volume klaim JKN mencapai ~725,3 juta layanan per tahun, verifikasi manual menghadapi kendala keterbatasan waktu dan tingginya beban kerja coder/verifikator. Potensi kecurangan seperti upcoding, unbundling, dan phantom billing berisiko menggerus Dana Jaminan Sosial (DJS) Kesehatan. Sehingga, diperlukan sistem otomatisasi deteksi anomali berbasis kecerdasan artifisial (AI) yang presisi, obyektif, dan transparan guna mendukung pengawasan klaim faskes tanpa mengganggu kelancaran operasional.","1.Mengembangkan CLAIRx, platform AI terpadu untuk mendeteksi anomali klaim faskes secara real-time.\n2.Meminimalisir kebocoran DJS akibat upcoding, unbundling, phantom/repeat billing, dan prolonged stay. \n3.Mengoptimalkan efisiensi kerja verifikator BPJS melalui prioritisasi klaim berisiko tinggi berbasis Risk Score dan Explainable AI (XAI).\n4.Memastikan kepatuhan tata kelola data (GRC) dan UU PDP dengan pemanfaatan Data Sampel Reguler BPJS Kesehatan Edisi 2025 secara aman via Pakta Integritas","CLAIRx (Claim Anomaly Intelligence & Risk eXamination) adalah sistem deteksi anomali klaim FKRTL berbasis AI yang mengombinasikan Rule-Based Validation Engine dan Hybrid Machine Learning (Supervised XGBoost untuk pola terlabel dan Unsupervised Autoencoder/Isolation Forest untuk modus baru). Memanfaatkan Data Sampel Reguler BPJS Kesehatan Edisi 2025 via Portal Data JKN (memenuhi Pakta Integritas), CLAIRx menguji 6 indikator, mencakup: Upcoding, Unbundling, Phantom Billing, Repeat Billing, Prolonged LOS, dan Readmisi. Melalui pipeline pemrosesan data otomatis, CLAIRx menyajikan interaktif dashboard verifikator berfitur Risk Score, akumulasi pemicu anomali, serta rekomendasi penindakan berbasis Explainable AI (SHAP/XAI). Menerapkan prinsip Human-in-the-Loop (HITL), CLAIRx berfungsi sebagai Decision Support System yang menjaga wewenang keputusan di verifikator manusia, sehingga mewujudkan audit klaim JKN yang presisi, efisien, scalable, dan patuh pada UU PDP serta prinsip GRC.","1. Efisiensi Operasional: Mereduksi waktu penelaahan klaim dengan memfokuskan verifikator pada klaim berisiko tinggi.\n2. ?Perlindungan Finansial: Memitigasi risiko overpayment dan potensi fraud hingga miliaran rupiah guna menjaga ketahanan DJS Kesehatan.\n3. ?Transparansi & Kepatuhan: Mendorong faskes mampu meningkatkan akurasi koding rekam medis serta memberikan kepastian pembayaran klaim wajar (clean claims) lebih cepat, demi mendukung keberlanjutan pelayanan JKN secara akuntabel."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Djaka Santosa","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2018","tim":"Besok aku mau jadi pendiem deh mas","inov":"ClaimGuard Evidence, Co-pilot Integritas Klaim Berbasis Jejak Layanan.","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Besarnya skala JKN membuat verifikasi manual seluruh klaim tidak efisien. Analitik klaim dapat menemukan anomali, tetapi sering belum menunjukkan apakah pelayanan benar-benar terjadi dan bukti apa yang hilang. Akibatnya, pembayaran tidak tepat dapat terlambat ditemukan, sedangkan klaim yang sah berisiko ikut tertunda. Diperlukan pemeriksaan berbasis jejak layanan yang transparan, cepat, dan tetap menempatkan verifikator sebagai pengambil keputusan.","Membangun co-pilot integritas klaim yang mencocokkan klaim dengan encounter, tindakan, hasil penunjang, dispensing, kapabilitas faskes, konteks peer, dan konfirmasi peserta secara selektif. Sistem bertujuan memprioritaskan pemeriksaan, menjelaskan setiap indikasi, mengarahkan permintaan bukti, dan mendukung keputusan Clear, Minta Bukti, atau Eskalasi tanpa melakukan penolakan maupun penetapan fraud otomatis.","ClaimGuard Evidence adalah prototype web evidence-first untuk mendeteksi dan memitigasi phantom billing, upcoding, dan cloning sebelum keputusan pembayaran final. Evidence engine mencocokkan pasien pseudonim, faskes, waktu, kode tindakan, encounter, hasil LIS/RIS, dispensing, serta profil kapabilitas. Rule transparan digabungkan dengan peer anomaly dan fingerprint similarity untuk menghasilkan status matched, missing, conflict, atau late, risk priority, reason code, provenance, dan rekomendasi aksi. Konfirmasi peserta hanya dipicu pada kasus yang relevan dan dipakai sebagai sinyal pendukung, bukan bukti tunggal. Verifikator tetap memilih Clear, Minta Bukti, atau Eskalasi; semua tindakan disimpan pada audit trail. Prototype memakai 100% data sintetis, memiliki delapan skenario klaim dan lima unit test. Arsitektur produksi dirancang modular untuk integrasi API/batch, FHIR, pseudonimisasi, case management, akses berbasis peran, serta versioning data, aturan, dan model.","ClaimGuard ditargetkan mengurangi waktu pencarian bukti, meningkatkan precision antrean risiko tinggi, mencegah pembayaran tidak tepat sebelum final, dan menekan false positive. Pilot enam bulan mengukur median review time, verified avoided payment bersih, resolution time, overturn rate, payment-delay incident, dan kelengkapan audit snapshot. Target awal: precision high-risk minimal 2× baseline dan waktu review turun minimal 30%, divalidasi melalui shadow mode dan kelompok kontrol."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2027","tim":"Juara Satu","inov":"Healthkathon2026_JuaraSatu_Waswasita_PitchDeck","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Dengan 282,46 juta peserta terdaftar per Oktober 2025, JKN rentan terhadap penyalahgunaan identitas, yaitu kartu peserta dipinjamkan, disewakan, atau diperjualbelikan. Modus ini sulit dikenali karena setiap kunjungan tampak wajar jika dilihat sendiri. Kejanggalan baru terlihat saat beberapa kunjungan disandingkan, misalnya satu peserta tercatat di dua faskes berjauhan dalam waktu yang tidak masuk akal. Petugas butuh cara cepat untuk melihat gambaran utuh ini.","Membantu petugas BPJS Kesehatan menentukan kasus identitas yang paling perlu diperiksa lebih dulu. Waswasita membaca kejanggalan waktu dan lokasi pada rangkaian layanan peserta, lalu menyajikannya sebagai sinyal yang dilengkapi alasan dan bukti. Analisis dilakukan tanpa membuka identitas asli peserta, dan keputusan akhir tetap berada di tangan petugas.","Waswasita adalah sistem analisis rangkaian layanan peserta JKN untuk mendeteksi kejanggalan pemakaian identitas. Data layanan diterima dengan ID samaran, sehingga nama, NIK, biometrik, dan diagnosis rinci tidak ikut diolah. Sistem membersihkan data, menyusun kunjungan menjadi rangkaian layanan, lalu membaca empat sisi: pola waktu, pola lokasi, rangkaian pengobatan dan rujukan, serta jenis layanan tatap muka atau jarak jauh. Contohnya, jika jarak 60 km tercatat ditempuh dalam 18 menit, sistem menandainya untuk diperiksa. Versi awal memakai aturan yang dapat diaudit, tanpa machine learning, agar setiap sinyal punya alasan yang bisa ditelusuri. Jika data kurang lengkap, sistem menahan kesimpulan. Hasilnya berupa paket bukti dan tingkat prioritas di ruang kerja petugas, yang kemudian memilih tindak lanjut: menutup kasus, mengoreksi data, meminta bukti tambahan, atau eskalasi sesuai SOP.","Petugas dapat memusatkan waktu pada kasus yang paling berisiko, bukan menelusuri data satu per satu. Kami menargetkan waktu penyaringan turun minimal 30%, ketepatan temuan minimal 90%, dan salah tandai maksimal 5% pada data uji. Identitas peserta tetap terlindungi, setiap sinyal dapat diaudit, dan peserta yang wajar tidak dirugikan karena tidak ada keputusan otomatis. Dalam jangka panjang, layanan JKN menjadi lebih tepat sasaran."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2038","tim":"Prakasa","inov":"Verifikasi Multipihak sebagai Pencegahan Kolusi Fasilitas Kesehatan pada BPJS Ketenagakerjaan","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Perusahaan bebas memilih faskes untuk MCU dan penanganan kecelakaan kerja, sehingga membuka celah kolusi seperti surat sakit fiktif dan rekayasa klaim, yang baru terdeteksi setelah dana cair tanpa melibatkan peserta. HadirIn menutup celah ini lewat pengacakan faskes berbasis radius jarak, verifikasi langsung oleh peserta melalui Klik & Klaim sehingga kecurangan dicegah sejak awal.","Untuk mengenalkan inovasi HadirIn yang bertujuan mencegah kolusi perusahaan dan fasilitas kesehatan dalam layanan MCU dan klaim kecelakaan kerja. Tujuan tersebut dicapai lewat satu sistem verifikasi berlapis yang menggabungkan bukti kehadiran nyata dengan konfirmasi berbagai pihak sebelum dana dicairkan.","HadirIn merupakan platform digital pencegahan kolusi yang kemungkinan dilakukan oleh pihak eksternal BPJS Ketenagakerjaan, khususnya kerja sama tidak sah antara oknum perusahaan dan faskes, seperti klaim asuransi akibat kecelakaan kerja fiktif dan rekayasa pendanaan MCU fiktif. Saat perusahaan mengajukan MCU, sistem mengacak faskes dalam radius jarak yang ditentukan tanpa pilihan manual. Setelahnya Undangan Sehat berisi QR sekali pakai dikirim ke JKN Mobile karyawan, lalu dipindai faskes sebagai bukti kehadiran nyata. Hadir.In mengelola hasil acakan pada laman fitur Daftar Pengaju dan E-Calendar yang dipegang oleh Faskes. Untuk kecelakaan kerja, pengajuan klaim harus melewati fitur tambahan Klik & Klaim yang meminta karyawan mengonfirmasi tindakan medis yang ditagihkan sebelum dana dicairkan. Data yang dipakai hanya data minimum milik BPJS dan petugas BPJS tetap meninjau klaim. Dengan tujuan utamanya adalah memastikan tagihan yang ada murni tanpa dimark-up.","HadirIn diharapkan mengubah pengawasan klaim BPJS Ketenagakerjaan dari audit setelah dana cair menjadi pencegahan sebelum dana cair. Dari sisi finansial, dana yang selama ini berisiko hilang akibat klaim fiktif dapat ditekan dan dialihkan untuk program kesejahteraan karyawan, sementara biaya operasional turun melalui verifikasi otomatis. Dari sisi non-finansial, pengacakan faskes berbasis radius memutus hubungan tidak wajar antara perusahaan dan faskes."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Djaka Santosa","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2042","tim":"700rb per kg","inov":"Digitalisasi Deteksi Vena Pada Pasien DIVA (Difficult Intravenous Access)","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Prosedur venepunktur sering terkendala kondisi Difficult Venous Access (DiVA) dengan tingkat kegagalan tusukan pertama mencapai 30–50%, terutama pada pasien anak dan obesitas (Stewart, 2020). Kondisi ini memaksa tenaga medis melakukan blind puncture yang berisiko merusak jaringan saraf (Maray dkk., 2022) dan memboroskan alat medis. Sementara itu, alat vein finder impor yang ada saat ini berharga sangat mahal bagi Puskesmas.","Mengembangkan AVIS, perangkat wearable/handheld medical smartwatch berbasis computer vision (CLAHE) dan non-invasive optical screening (IR 850nm & MAX30102). Bertujuan mendigitalisasi pemetaan vena secara real-time untuk mengatasi kasus DIVA, menekan angka kegagalan tusukan pertama (42,5%), mencegah trauma pasien, serta mengefisiensikan biaya faskes JKN.","AVIS adalah solusi deteksi vena ultra low-cost berbentuk jam tangan medis (smartwatch) atau handle fleksibel. Mengintegrasikan ESP32-S3 (edge processing), kamera NoIR, LED IR 850nm, sensor optik MAX30102, serta visualisasi Dioda Laser Hijau. Pemrosesan citra memakai CLAHE OpenCV secara lokal (Zero-Storage Privacy) sesuai UU PDP. Menargetkan 3.270+ RS dan 10.000+ Puskesmas dengan harga 10x lebih terjangkau dari produk impor.","- Menyelamatkan pasien dari trauma medis dan rasa sakit akibat kegagalan tusukan berulang pada kasus DIVA.\n- Menghilangkan biaya tersembunyi akibat pemborosan alat medis habis pakai dan mengoptimalkan waktu tenaga medis.\n- Mengurangi ketergantungan alat kesehatan impor (88%) lewat teknologi lokal berkualitas tinggi yang terjangkau untuk pemerataan faskes."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Yanuar Milad","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2057","tim":"RiskaraLabs","inov":"IuranRadar: AI Co-Pilot Kepatuhan Pemberi Kerja untuk JKN yang Berkelanjutan","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Keberlanjutan Program JKN membutuhkan data kepesertaan dan iuran yang akurat. Namun, risiko ketidaksesuaian data pemberi kerja seperti Pendaftaran Pekerja Sebagian (PDUK), pelaporan upah lebih rendah, misklasifikasi hubungan kerja, dan manipulasi data mutasi karyawan dapat memengaruhi akurasi basis iuran. IuranRadar hadir sebagai AI Co-Pilot untuk membantu petugas Wasrik mendeteksi pola risiko secara cepat, terarah, dan transparan tanpa menggunakan data pribadi peserta JKN.","Tujuan IuranRadar adalah membangun sistem berbasis AI yang membantu petugas Wasrik dalam mengidentifikasi dan memprioritaskan risiko ketidakpatuhan pemberi kerja pada Program JKN. Sistem ini bertujuan meningkatkan efektivitas pemeriksaan melalui analisis pola risiko yang transparan, dapat dijelaskan, dan berbasis data, sehingga mendukung akurasi basis iuran serta keberlanjutan pembiayaan JKN tanpa mengakses data pribadi peserta.","IuranRadar merupakan AI Co-Pilot yang membantu meningkatkan kepatuhan pemberi kerja dalam Program JKN melalui deteksi dini risiko administratif berbasis data. Sistem ini berfokus pada identifikasi potensi ketidaksesuaian seperti Pendaftaran Pekerja Sebagian (PDUK), pelaporan upah lebih rendah (under-reporting wage), misklasifikasi status hubungan kerja, dan manipulasi data mutasi karyawan.\nIuranRadar menggunakan Risk Signal Engine untuk menganalisis pola risiko dan menghasilkan rekomendasi prioritas pemeriksaan yang dapat dijelaskan oleh petugas Wasrik. Sistem ini membantu mempercepat proses identifikasi risiko tanpa menggantikan keputusan manusia. Dengan memanfaatkan dataset sintetis dan data agregat, IuranRadar dirancang tetap menjaga keamanan serta privasi tanpa mengakses data pribadi peserta JKN.","IuranRadar memberikan dampak berupa peningkatan efektivitas pemeriksaan kepatuhan pemberi kerja melalui proses identifikasi risiko yang lebih cepat dan terarah. Sistem ini membantu petugas Wasrik memprioritaskan pemeriksaan berdasarkan pola risiko, mendukung akurasi basis iuran JKN, serta memperkuat keberlanjutan pembiayaan Program JKN. Selain itu, solusi ini menciptakan proses pengawasan yang lebih transparan dengan tetap menjaga prinsip keamanan dan privasi data."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Djaka Santosa","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2059","tim":"NadiNusa","inov":"PROPOSAL Reksakarya","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["REKSAKARYA AI dirancang untuk mengatasi kebocoran finansial (revenue leakage) iuran JKN akibat maraknya manipulasi pelaporan upah (Flat UMP) dan defisit pendaftaran pekerja oleh badan usaha, di tengah keterbatasan jumlah auditor Wasrik BPJS Kesehatan yang masih bergantung pada metode pemeriksaan manual. Melalui penerapan arsitektur bertingkat (Tri-Layer AI), sistem ini mengintegrasikan model prediktif berbasis kepatuhan, transparansi atribusi variabel pelanggaran melalui Explainable AI (SHAP) ya","Mendeteksi Modus Pelanggaran Iuran JKN: Mengidentifikasi secara dini manipulasi pelaporan upah di bawah standar pasar (Flat UMP) dan defisit pendaftaran jumlah pekerja aktif vs data WLTK (Pekerja Tidak Didaftarkan).\nMengoptimalkan Triase Pemeriksaan Wasrik: Mengotomatiskan pemeringkatan risiko entitas badan usaha ke dalam tingkat urgensi (Tinggi, Sedang, Rendah) agar jadwal audit lapangan petugas Wasrik lebih tepat sasaran dan efisien.\nMencegah Kebocoran Finansial (Revenue Leakage): Menghitung e","REKSAKARYA AI adalah platform sistem triase dan audit kepatuhan berbasis kecerdasan buatan (Explainable AI) yang dirancang untuk mendukung operasional Pengawasan dan Pemeriksaan (Wasrik) BPJS Kesehatan. Sistem ini berfungsi mendeteksi, menganalisis, dan memprioritaskan pemeriksaan terhadap entitas badan usaha yang terindikasi melakukan manipulasi kepatuhan jaminan sosial seperti pelaporan gaji di bawah standar pasar (Flat UMP) dan ketidaksesuaian jumlah tenaga kerja terdaftar (headcount deficit) dibanding data Wajib Lapor Ketenagakerjaan (WLTK).","Penyelamatan Keuangan Dana Jaminan Sosial (DJS): Meminimalkan kebocoran penerimaan iuran (revenue leakage) melalui deteksi dini manipulasi upah (Flat UMP) dan defisit pendaftaran pekerja, sehingga klaim manfaat kesehatan peserta tetap berkelanjutan.\nEfisiensi dan Ketepatan Operasional Wasrik: Mengubah sistem audit yang semula manual dan reaktif menjadi proaktif berbasis triase risiko (prioritas pemeriksaan 7 hari), menghemat waktu serta sumber daya personel di lapangan."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2068","tim":"Apaa Yak","inov":"SELARAS: Verifikasi Bukti & Pembelajaran Risiko untuk Phantom dan Repeat Billing","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Bukti pelayanan dapat tersebar di catatan layanan, informasi provider, waktu kejadian, dan referensi tagihan. Ketika jejak tersebut tidak saling terhubung, reviewer harus merekonstruksi konteks secara manual. Celah dan inkonsistensi lebih sulit ditelusuri, sementara temuan satu kasus belum tentu membantu pemeriksaan berikutnya","Mengembangkan SELARAS sebagai platform evidence-first yang menghubungkan bukti pelayanan dengan klaim untuk mengidentifikasi celah dan inkonsistensi. SELARAS juga membantu reviewer menelusuri riwayat peristiwa dan memanfaatkan pola risiko yang telah divalidasi untuk mendukung pemeriksaan kasus berikutnya. Sistem memberikan sinyal risiko sebagai bahan evaluasi, sedangkan keputusan akhir tetap berada pada reviewer manusia.","SELARAS merupakan platform evidence-first untuk membantu pemeriksaan risiko klaim JKN melalui keterhubungan bukti pelayanan, penelusuran klaim, dan pembelajaran pola risiko. Proof Engine memeriksa kelengkapan, konsistensi, keterhubungan, dan urutan bukti pelayanan terhadap klaim. Status PASS, GAP, CONFLICT, atau UNKNOWN menunjukkan kondisi bukti, bukan menetapkan fraud. Integrity Mesh membantu reviewer menggunakan kembali pola risiko yang telah ditinjau dan divalidasi manusia sebagai referensi pemeriksaan kasus berikutnya. Claim Trace & Replay mendukung penelusuran hubungan klaim, layanan, bukti, dan urutan peristiwa yang tercatat. Prototipe SELARAS telah berfungsi untuk demonstrasi internal menggunakan data sintetis dan telah menjalani pengujian internal. Prototipe belum terintegrasi dengan sistem produksi BPJS Kesehatan atau SATUSEHAT dan belum diuji menggunakan data operasional JKN. Sinyal risiko tidak menjadi dasar penolakan klaim otomatis, tindak lanjut tetap ditentukan reviewer.","SELARAS diharapkan membantu reviewer menemukan celah bukti dan indikasi inkonsistensi pada klaim Phantom & Repeat Billing secara lebih terstruktur. Dampak akan dievaluasi melalui waktu penelusuran bukti, jumlah celah yang terdeteksi, dan kesesuaian hasil pemeriksaan reviewer. Efektivitasnya perlu divalidasi melalui pengujian terkontrol"],"r":[{"n":"Susi Lusiani","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2084","tim":"JJJ Labs","inov":"Tilik - Sistem Integritas Bukti Pelayanan JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Fraud klaim JKN diperkirakan menggerus sekitar Rp20 triliun per tahun (KPK, 2024), sementara Dana Jaminan Sosial Kesehatan sudah defisit. Tiap hari ~650 ribu klaim diverifikasi, namun bukti satu pelayanan tersebar di banyak sistem: klaim, rekam medis, dan jejak operasional. Verifikator kehabisan waktu menghimpun bukti, sehingga pelayanan yang sah ikut tertuduh dan klaim fiktif lolos. Deteksi anomali saja belum cukup; akar masalahnya adalah bukti pelayanan yang sulit dibuktikan dengan cepat.","Membantu verifikator membuktikan apakah bukti suatu pelayanan konsisten dengan klaim secara cepat, terarah, dan akuntabel. Tilik menautkan klaim, rekam medis, jejak operasional, dan klarifikasi peserta menjadi satu berkas pemeriksaan; memprioritaskan kasus phantom billing, cloning, dan repeat billing; serta membedakan ketidaksesuaian nyata dari data terlambat atau kesalahan administrasi. Sasarannya memangkas waktu telaah dan salah penandaan, tanpa menggantikan keputusan manusia.","Tilik adalah lapisan integritas bukti pelayanan JKN untuk verifikator dan tim anti-fraud. Sistem menerima salinan data berizin melalui adaptor, memvalidasinya di batas kepercayaan, lalu menjalankan tiga detektor yang dapat dijelaskan: repeat billing (klaim berulang), cloning (kemiripan narasi via TF-IDF), dan pertentangan bukti (klaim aktif vs bukti operasional/klinis). Setiap detektor memiliki pengecualian wajib agar koreksi, revisi, dan pelayanan berulang yang sah tidak salah ditandai. Keluarannya adalah prioritas pemeriksaan dan paket bukti bertelusur: sumber, waktu, versi, dan bukti yang kurang, bukan vonis fraud. Konfirmasi ke peserta bersifat selektif dan disetujui petugas; nonrespons tidak menaikkan dugaan. Arsitektur ramping (Next.js, NestJS, PostgreSQL, Python) dengan RBAC, tokenisasi, dan audit, serta tanpa data peserta riil pada purwarupa. Keputusan pembayaran dan penanganan fraud tetap pada kewenangan resmi; AI mendukung, bukan menggantikan, manusia.","Pemeriksaan jadi lebih cepat dan terarah: target waktu telaah turun minimal 30% pada tugas setara, dengan jejak alasan yang utuh. Faskes menerima permintaan klarifikasi yang spesifik dan koreksi yang terlacak; peserta dapat mengoreksi fakta tanpa memahami kode medis. Bagi BPJS, setiap 1% perbaikan deteksi fraud bernilai ratusan miliar rupiah; benchmark anti-fraud global mengembalikan ~US$4 per US$1. Hasil tetap perlu diukur bersama mitra, sehingga angka ini adalah target, bukan klaim."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Juliana","s":null}]},{"id":"2093","tim":"Samita","inov":"LARIK JKN - Layanan Analisis Risiko dan Integritas Klaim Jaminan Kesehatan Nasional","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Jutaan klaim bulanan di BPJS Kesehatan membebani verifikasi manual di tengah risiko klaim kompleks seperti upcoding, unbundling, dan rujukan berulang. Ketiadaan data relasional menyulitkan audit. LARIK-JKN hadir sebagai mesin penyaring risiko untuk memprioritaskan telaah klaim pra-pembayaran. Memadukan deteksi multi-tipologi, pemetaan jejaring rujukan, statistik faskes, dan asisten AI regulasi, sistem ini menjaga efisiensi serta akuntabilitas dana amanah JKN.","Platform LARIK-JKN bertujuan menyediakan sistem penyaring risiko dan pemilah prioritas (triage) klaim pra-pembayaran BPJS Kesehatan secara otomatis dan objektif. Melalui deteksi multi-tipologi anomali, pemetaan jejaring rujukan faskes, standardisasi statistik deviasi biaya, serta asistensi audit klinis berbasis regulasi resmi, platform ini bertujuan mempercepat verifikasi berkas, meningkatkan transparansi telaah, dan mencegah kebocoran anggaran demi keberlanjutan Dana JKN.","LARIK-JKN adalah platform intelijen analitik terintegrasi untuk pengawasan, deteksi dini, dan mitigasi Fraud, Waste, and Abuse (FWA) dalam tata kelola klaim BPJS Kesehatan. Memadukan audit berbasis aturan dan Explainable AI, platform ini menjaga keberlanjutan Dana JKN secara akuntabel tanpa mengorbankan mutu pelaya
