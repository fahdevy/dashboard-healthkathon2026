ifikasi antara faskes dan verifikator","Medsure bertujuan membantu fasilitas kesehatan menyiapkan klaim JKN yang lengkap, konsisten, dan didukung bukti yang dapat ditelusuri sebelum pengajuan. Sistem ini dirancang untuk mendeteksi kekurangan dokumen, ketidaksesuaian informasi, serta indikasi repeat billing atau cloning dengan tetap mempertimbangkan pengajuan ulang yang sah. Medisure juga membantu verifikator memprioritaskan pemeriksaan secara transparan, mengurangi pengerjaan ulang, dan mempertahankan keputusan akhir pada manusia.","Medisure merupakan sistem validasi klaim berbasis bukti yang dirancang untuk tim klaim fasilitas kesehatan (faskes) dan verifikator BPJS. Pada sisi faskes, sistem memeriksa data klaim dan dokumen pendukung sebelum pengajuan, serta menunjukkan kekurangan, ketidaksesuaian, dan bukti yang perlu dilengkapi atau diklarifikasi. Pada sisi verifikator, sistem menyajikan ringkasan temuan, perbandingan klaim, dan riwayat klarifikasi untuk mendukung pemeriksaan secara transparan. Jika informasi belum memadai, sistem memberikan status “belum dapat dinilai”. Keputusan akhir tetap berada pada manusia, bukan sistem otomatis. Prototipe awal menggunakan data sintetis untuk menguji kelengkapan, konsistensi, dan indikasi duplikasi klaim. Pemeriksaan upcoding dan unbundling direncanakan sebagai pengembangan lanjutan setelah tersedia aturan dan validasi ahli yang memadai.","MedSure diharapkan membantu rumah sakit mengurangi waktu pencarian dokumen, kesalahan pengajuan, dan perbaikan berulang, serta memudahkan verifikator menelaah klaim melalui bukti dan alasan yang jelas. Jika terbukti efektif, solusi ini berpotensi mengurangi hambatan proses klaim yang berdampak pada operasional rumah sakit."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Susi Lusiani","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2962","tim":"mama aku mau ikut healthkathon","inov":"DETEKS: AI untuk Deteksi Anomali Perolehan Obat dan Alkes Lintas Fasilitas","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Di balik 282,7 juta peserta JKN dan rasio klaim 108,72% (April 2026), ada pola yang sulit terlihat: obat atau alkes yang sama diambil ulang sebelum suplai habis, atau di beberapa faskes dalam waktu berdekatan. Riwayat tersebar per fasilitas dan verifikasi pasca-klaim kerap bergantung pada sampling, sehingga pola lintas faskes mudah luput. Wawancara awal dengan apoteker dan staf BPJS RS menguatkan kebutuhan penelaahan yang lebih terarah, terukur, dan transparan.","DETEKS adalah dashboard pendukung keputusan bagi verifikator BPJS Kesehatan untuk mendeteksi dini dan memprioritaskan pola perolehan obat dan alkes yang tidak lazim lintas faskes. DETEKS menunjukkan kasus mana yang perlu ditelaah lebih dulu dan mengapa, serta menekan alarm tidak relevan lewat kombinasi aturan kebijakan dan machine learning. Dengan prinsip human-in-the-loop, keputusan akhir tetap di tangan verifikator.","DETEKS bekerja pasca-klaim dengan data terpseudonim. Data dibersihkan dan distandarkan (deduplikasi, koreksi klaim, pemetaan terminologi obat/alkes). Rule engine memeriksa pola berbasis kebijakan, seperti pengambilan ulang sebelum suplai habis dan perolehan item serupa lintas faskes. Isolation Forest, model anomali tanpa label, menangkap pola tak lazim yang tidak terjangkau aturan. Keduanya digabung menjadi skor prioritas 0-100 dengan kode alasan dan linimasa perolehan, sehingga setiap penandaan dapat ditelusuri. Verifikator memilih: perlu ditelaah, clear, atau data kurang. Prototipe dashboard dan evaluasi model hybrid pada data sintetis telah berjalan sebagai bukti konsep; backend (FastAPI, scikit-learn) dan uji pada data klaim nyata menjadi langkah berikutnya. Privasi dijaga lewat pseudonimisasi, akses berbasis peran, dan audit log sesuai pelindungan data pribadi.","Verifikator mendapat daftar kasus terurut prioritas beserta alasannya, sehingga penelaahan lebih terarah. Deteksi dini pola lintas faskes mendukung efisiensi verifikasi dan integritas dana JKN, sementara human-in-the-loop memastikan indikasi tidak otomatis menjadi penolakan klaim atau sanksi bagi peserta. Efektivitas diukur lewat precision, recall, false alert, dan waktu penelaahan per kasus, lalu divalidasi pada data resmi bersama pihak terkait."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2963","tim":"BazmaJuara","inov":"ADDALERT & APPLE","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Aplikasi E-Dabu rentan menjadi kelemahan utama JKN akibat manipulasi perusahaan yang menghindari iuran 4%. Kecurangan ini meliputi pendaftaran sebagian, pelaporan upah rendah, misklasifikasi status, hingga manipulasi mutasi. Dibutuhkan pendekatan teori psikologi untuk menyadarkan perusahaan bahwa berbuat kebaikan jauh lebih menguntungkan daripada melakukan kecurangan.","Membuat sistem tambahan (ADDALERT) pada E-Dabu guna memberi peringatan otomatis di setiap kesalahan keputusan. Selain itu, menciptakan sistem perlombaan (APPLE) guna mengevaluasi kejujuran perusahaan. Sistem ini akan mencari bukti detail pelanggaran, sekaligus memberikan gelar \"Golden Employer\" beserta hadiah bagi perusahaan yang jujur dan berkinerja baik.","ADDALERT KATHON menggabungkan dua sistem kokoh. Pertama, peningkatan E-Dabu menggunakan Absolute Rule-Based with Agentic AI. AI ini bekerja pada Limited System Memory mendeteksi kecurangan tanpa mengganggu aturan utama. Kedua, sistem Golden Apple, perlombaan berbasis Level Up System yang mengevaluasi kejujuran dan performa perusahaan secara berkelanjutan.","Sistem ini berhasil mengubah cara pandang perusahaan dalam menentukan pilihan yang lebih baik. Menghasilkan pelaporan terstruktur sempurna dari aturan sistem utama, sehingga E-Dabu tidak lagi menjadi pusat permasalahan JKN. Inovasi ini secara efektif menekan kecurangan pendaftaran sebagian, manipulasi upah, misklasifikasi pekerja, dan penundaan mutasi karyawan."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2968","tim":"KAPASITAS GUARD","inov":"Validasi Kemustahilan Fisik Klaim Tindakan Fiktif JKN Melalui Pemodelan Kapasitas Operasional Faskes","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Phantom billing volume — menagihkan lebih banyak tindakan dari yang secara fisik bisa dilakukan — adalah fraud yang paling sulit dibantah secara hukum karena satu-satunya buktinya adalah batas kapasitas alat dan tempat tidur. Tidak ada sistem yang secara otomatis menyandingkan volume klaim harian dengan kapasitas fisik faskes. Data Tabel 3.9 & 3.11 DJSN menyimpan angka ini — namun belum pernah dijadikan instrumen audit.","Membangun model kapasitas operasional maksimal harian per faskes dari data tempat tidur DJSN; menghitung utilisasi aktual dari CSV klaim harian; mendeteksi kemustahilan fisika saat utilisasi melampaui 100%; menghasilkan gauge visual per faskes yang langsung terbaca siapapun; dan menyediakan AI Chatbot Gemini untuk query spesifik faskes dalam bahasa Indonesia natural tanpa menyusun query teknis.","Kapasitas-Guard JKN menggunakan satu prinsip yang tidak bisa dinegosiasikan: ruang fisik memiliki kapasitas terbatas. Dari Tabel 3.9 (RS Pemerintah) dan 3.11 (RS Swasta) DJSN, setiap faskes mendapatkan profil kapasitas digitalnya. Engine utilisasi menghitung Utilisasi(%) = Total_Klaim / Kapasitas_Maks × 100. Utilisasi > 100% adalah kemustahilan fisika absolut — bukan indikasi probabilistik. Setiap klaim di atas 100% adalah phantom billing terkonfirmasi. Gauge SVG animasi per faskes: jarum merah berkedip saat overcapacity, hijau saat normal. Pattern Score mengakumulasi hari anomali — faskes dengan pola berulang diprioritaskan. AI Chatbot aktif untuk query bahasa natural.","Pertama dalam sejarah audit JKN: bukti kemustahilan eksakta yang tidak memerlukan interpretasi ahli statistik. Estimasi kerugian phantom billing Rp 5,25 miliar/bulan dari 10% FKRTL. Bukti deterministik 100% siap persidangan. Coverage audit meningkat dari sampling ke 100% faskes nasional dengan biaya operasional mendekati nol per klaim."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2972","tim":"Aqila Digital","inov":"VeriKlaim: Sistem Asistensi Audit Pra-Bayar untuk Mitigasi Upcoding, Unbundling, dan Phantom Billing","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN melayani lebih dari 260 juta jiwa di ribuan RS mitra, namun menghadapi risiko kebocoran klaim. Temuan Tim Bersama PK-JKN (KPK, Kemenkes, BPJS, BPKP) pada Juli 2024 mengungkap kerugian Rp35 Miliar di 3 RS akibat klaim fiktif dan upcoding, dengan potensi risiko nasional mencapai Rp6 Triliun (Permenkes 16/2019). Audit retrospektif pasca-bayar sulit memulihkan kerugian, sehingga dibutuhkan sistem asistensi audit pra-bayar otomatis yang objektif dan cepat sebelum dana dicairkan.","1. Mengembangkan sistem asistensi audit pra-bayar untuk menapis anomali klaim faskes (upcoding, unbundling, phantom billing) secara otomatis dalam waktu di bawah 3 detik.\n2. Memberikan bukti penalaran klinis yang objektif bagi petugas verifikator BPJS melalui pendekatan Explainable AI.\n3. Mewujudkan efisiensi risiko pembiayaan jaminan kesehatan, mencegah kebocoran anggaran negara, dan mempercepat pencairan klaim bagi faskes yang tertib melalui jalur fast-track.","VeriKlaim adalah sistem asistensi audit pra-bayar yang dirancang terintegrasi dengan alur penyerapan berkas V-Claim BPJS Kesehatan. Sistem ini memadukan tiga modul analisis teknis: (1) Modul Semantic NLP Klinis untuk mencocokkan kelayakan narasi resume medis dokter dan data laboratorium terhadap kriteria diagnostik ICD-10 guna mencegah upcoding; (2) Modul Matriks Regulasi Unbundling untuk mendeteksi pemecahan paket tindakan sesuai aturan tarif INA-CBGs Kemenkes; dan (3) Modul Analisis Graf Transaksi untuk memetakan anomali frekuensi penagihan faskes dan dokter DPJP demi mengungkap phantom billing.\n\nSetiap berkas klaim yang masuk dipindai otomatis dan dikelompokkan ke dalam Risk Score (Hijau, Kuning, Merah). Berkas klaim valid langsung diteruskan ke pembayaran cepat, sedangkan berkas anomali disajikan ke dasbor verifikator lengkap dengan bukti klinis. Dirancang patuh UU PDP No. 27/2022 dengan enkripsi AES-256 dan protokol REST API terisolasi.","1. Efisiensi Pembiayaan: Mengurangi potensi kebocoran dana jaminan pelayanan kesehatan sebesar 2% hingga 3% bernilai ratusan miliar rupiah per tahun.\n2. Produktivitas Kerja: Memangkas waktu telaah dokumen manual petugas verifikator BPJS hingga 60% melalui ringkasan bukti klinis terstruktur.\n3. Arus Kas Faskes: Mempercepat kepastian pembayaran klaim bagi lebih dari 80% faskes yang patuh serta menjaga kesinambungan finansial program JKN jangka panjang."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Juliana","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2974","tim":"USFORDATA","inov":"JAGA-KERJA: Sistem Deteksi dan Koreksi Dini Ketidaksesuaian Kepesertaan JKN Berbasis AI","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Perbedaan antara data hubungan kerja dan kepesertaan JKN dapat menyebabkan pekerja aktif belum didaftarkan sebagai PPU, masih tercatat pada segmen yang tidak sesuai, atau terlambat dimutasi. Pengawasan yang bergantung pada laporan dan pemeriksaan manual berisiko terlambat menemukan masalah, sedangkan perusahaan yang tidak patuh belum tentu mengunggah roster. Diperlukan deteksi proaktif yang dapat memprioritaskan temuan sekaligus membuka jalur koreksi sebelum masalah membesar.","JAGA-KERJA bertujuan mendeteksi lebih dini gap perlindungan pekerja, memprioritaskan pemeriksaan berdasarkan risiko dan dampak, serta mempercepat koreksi oleh perusahaan. Sistem juga memberi pekerja akses Bukti Lindung untuk memeriksa dan mengonfirmasi statusnya, sementara keputusan akhir tetap berada pada petugas BPJS Kesehatan.","JAGA-KERJA adalah sistem pengawasan dan koreksi dini dengan dua jalur deteksi. Jalur perusahaan mencocokkan roster yang diunggah dengan snapshot kepesertaan JKN, sedangkan jalur proaktif BPJS membentuk temuan dari sinyal ketenagakerjaan dan data badan usaha yang diizinkan tanpa menunggu unggahan perusahaan. Mesin aturan berjenjang mendeteksi PDUK, misklasifikasi segmen, dan keterlambatan mutasi tanpa temuan ganda. Model AI kemudian mengenali pola anomali perusahaan sejenis dan membantu menyusun skor prioritas dari risiko, estimasi dampak iuran, tingkat keyakinan, dan usaha penanganan. Kasus diteruskan melalui alur klarifikasi, koreksi, keberatan, verifikasi, dan audit yang tercatat. Portal dipisahkan untuk petugas BPJS, perusahaan, dan pekerja. Bukti Lindung memungkinkan pekerja memberi konfirmasi dengan data minimum. AI hanya memberikan indikasi dan rekomendasi; keputusan tetap pada petugas. Demo menggunakan data sintetis dan token pekerja yang dipseudonimisasi.","JAGA-KERJA membantu BPJS Kesehatan memusatkan pemeriksaan pada perusahaan dan pekerja berisiko tinggi, mengurangi pemeriksaan manual yang tidak terarah, serta mempercepat penyelesaian melalui koreksi mandiri. Perusahaan memperoleh alur tindak lanjut yang jelas, sedangkan pekerja mendapat visibilitas atas perlindungannya. Dampak demo diukur melalui jumlah pekerja yang kembali terlindungi, waktu penyelesaian kasus, false positive, kasus yang berhasil dikoreksi, dan estimasi eksposur iuran."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Aries Kurniwan","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2977","tim":"KlaimLab","inov":"JKN ClaimGuard - Screening Potensi Klaim Duplikat","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Panduan Healthkathon menempatkan repeat billing dalam kategori Phantom & Repeat Billing. Kemenkes pada 2024 melaporkan dugaan phantom billing di tiga rumah sakit: 3.269 dari 4.341 tagihan fisioterapi yang ditelaah diduga fiktif karena tidak memiliki catatan rekam medis, dengan nilai Rp501,27 juta. Temuan ini bukan statistik nasional atau angka khusus klaim duplikat. ClaimGuard berfokus pada screening awal pasangan record yang mirip untuk ditinjau petugas.","Membangun prototype dashboard yang menerima data klaim CSV, memvalidasi kolom, membandingkan atribut terpilih, menghitung similarity score, menjelaskan faktor kecocokan, dan mengurutkan pasangan berkemiripan tinggi untuk human review. Prototype diuji awal dengan data sintetis, lalu akan disesuaikan dan dievaluasi kembali jika dataset challenge tersedia.","JKN ClaimGuard adalah prototype web berbasis Streamlit untuk membantu screening awal potensi klaim duplikat. Pengguna mengunggah CSV, lalu sistem membandingkan atribut seperti Patient ID, Hospital ID, tanggal, procedure, dan nominal menggunakan weighted rule-based similarity. Dashboard menampilkan similarity score, faktor yang cocok, status kandidat, serta rekomendasi human review.\n\nPada uji awal dengan 50 record sintetis, dashboard menampilkan 10 pasangan Potential Duplicate dan 1 pasangan Need Review pada konfigurasi yang digunakan. Hasil tersebut merupakan keluaran awal prototype, bukan ukuran akurasi pada data nyata. Bobot dan threshold perlu dievaluasi dengan data uji berlabel. Sistem tidak menetapkan fraud; keputusan tetap pada petugas.","ClaimGuard ditujukan untuk membantu petugas menyaring pasangan klaim berkemiripan tinggi, memahami alasan penandaan, dan memprioritaskan review. Dampak akan dievaluasi melalui waktu screening, jumlah pasangan uji yang berhasil ditemukan, false positive, dan false negative pada dataset berlabel. Pengujian saat ini baru menggunakan data sintetis; penghematan waktu maupun dana belum diklaim."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2978","tim":"Split Push","inov":"Sistem deteksi dini pendaftaran pekerja sebagian (PDUK) dan pelaporan upah lebih rendah pada peserta","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Iuran PPU 5% upah menopang likuiditas Dana JKN (Perpres 64/2020). Namun, marak modus PDUK dan under-reporting upah demi menekan beban 4% pemberi kerja. Keterbatasan verifikator membuat audit lapangan secara manual memakan biaya tinggi serta sulit menyasar entitas yang memiliki risiko tinggi. JagaPPU hadir menjawab celah ini melalui dynamic peer grouping dan machine learning untuk menyaring anomali ke dalam antrean prioritas pemeriksaan berbasis risiko secara objektif, efisien, dan tepat sasaran.","Mengembangkan sistem deteksi dini berbasis kecerdasan buatan (dynamic peer grouping dan ensemble machine learning) untuk mengidentifikasi anomali kepatuhan pemberi kerja secara presisi, guna mewujudkan pemeriksaan kepatuhan berbasis risiko, yang efisien dan tepat sasaran bagi BPJS Kesehatan.","JagaPPU: Sistem deteksi dini pendaftaran pekerja sebagian (PDUK) dan pelaporan upah hadir mentransformasi pengawasan kepatuhan melalui sistem deteksi dini berbasis dynamic peer grouping. Badan usaha dinilai secara kontekstual terhadap entitas setara dalam klaster sektor KBLI, wilayah upah, dan skala payroll yang homogen. Sistem ini memadukan robust statistics yang kebal data pencilan dengan empat algoritma unsupervised machine learning untuk menangkap deviasi pola anomali secara komprehensif.","JagaPPU meningkatkan efisiensi verifikasi kepatuhan BPJS Kesehatan dengan memangkas waktu pemilahan data badan usah melalui antrean prioritas Top-K berbasis risiko. Pendekatan ini meningkatkan akurasi temuan audit lapangan pada modus PDUK dan pelaporan upah rendah secara signifikan tanpa perlu memeriksa perusahaan satu per satu. Dampaknya, potensi kebocoran iuran dapat dicegah, hak jaminan sosial pekerja terlindungi, dan tercipta cost benefit yang tinggi bagi BPJS Kesehatan."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2981","tim":"Tahu Bulat","inov":"Claim Trace","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Proses pengajuan klaim layanan kesehatan membutuhkan kesesuaian data antara Rekam Medis Elektronik (RME), Sistem Informasi Manajemen Rumah Sakit (SIMRS), dan data klaim BPJS. Perbedaan informasi, seperti jumlah obat atau alat kesehatan yang tercatat, dapat menyebabkan ketidaksesuaian klaim dan menambah beban verifikasi. Diperlukan solusi yang membantu memeriksa konsistensi data sebelum klaim diajukan.","ClaimTrace bertujuan mengembangkan konsep sistem validasi dan rekonsiliasi data klaim kesehatan yang membantu mengidentifikasi ketidaksesuaian antara catatan klinis pada RME, data farmasi dan penagihan pada SIMRS, serta informasi klaim BPJS. Sistem dirancang untuk memberikan penanda perbedaan agar petugas dapat melakukan verifikasi dan koreksi sebelum pengajuan klaim, sehingga mendukung akurasi dan transparansi proses klaim.","ClaimTrace merupakan konsep sistem validasi klaim kesehatan yang menghubungkan informasi dari Rekam Medis Elektronik (RME), Sistem Informasi Manajemen Rumah Sakit (SIMRS), dan data klaim BPJS untuk membantu memeriksa konsistensi data sebelum pengajuan klaim. Sistem membandingkan informasi yang relevan, seperti tindakan medis, obat, dan alat kesehatan yang tercatat dalam dokumen klinis dengan data farmasi, penagihan, serta klaim. Jika ditemukan perbedaan, ClaimTrace memberikan penanda atau notifikasi agar petugas dapat meninjau dan memverifikasi ketidaksesuaian tersebut. Hasil validasi berfungsi sebagai alat bantu pengambilan keputusan, bukan penentu otomatis adanya kesalahan atau kecurangan. Pada tahap awal, solusi dirancang sebagai konsep yang akan dikembangkan dan dievaluasi melalui prototipe serta skenario pengujian. Implementasi integrasi dengan sistem rumah sakit dan BPJS akan disesuaikan dengan ketersediaan akses, standar data, dan ketentuan yang berlaku.","ClaimTrace diharapkan membantu meningkatkan konsistensi dan akurasi data klaim, mempercepat proses pemeriksaan ketidaksesuaian, serta mengurangi beban verifikasi manual. Penanda perbedaan yang lebih terstruktur juga diharapkan mendukung transparansi, akuntabilitas, dan pengambilan keputusan oleh petugas. Dampak akan dievaluasi melalui pengujian prototipe menggunakan skenario data, dengan mengukur kesesuaian data, kemampuan mendeteksi perbedaan, dan waktu verifikasi."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2984","tim":"Easy peasy lemon squeezy","inov":"Employer Contribution Risk Score","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pemeriksaan kepatuhan iuran BPJS Kesehatan masih dilakukan secara manual dan bergantung pada aduan email. Kapasitas pemeriksaan manusia sangat terbatas (<5% badan usaha terperiksa per tahun), menyebabkan sekitar 95% risiko kebocoran iuran lolos tanpa terdeteksi. Selain itu, penggunaan ambang batas UMR secara adil/flat berisiko tinggi memicu salah tuduh (false positive) pada UMKM jujur.","Menciptakan sistem radar pengawasan cerdas (risk engine) berbasis AI untuk mendeteksi kecurangan dan kebocoran iuran secara otomatis, presisi, dan proporsional. Sistem ini bertujuan mengubah proses acak/manual menjadi worklist pemeriksaan terprioritas, serta mencegah salah tuduh pada UMKM dengan analisis kelompok sejenis (peer-group).","Employer Contribution Risk Score (ECRS) adalah engine otomatis berbasis AI/ML yang mengolah data payroll dan setoran badan usaha menjadi indikator serta tingkat risiko siap tindak. ECRS memiliki tiga modul utama: \n\n- Modul A (Volatilitas Karyawan): Melacak indikasi PDUK (Pekerja Tidak Terdaftar/Di-PHK) via analisis Z-Score pada penurunan jumlah karyawan tanpa catatan resign \n- Modul B (Kesetaraan Upah Kohort): Membandingkan kesetaraan pelaporan upah berdasarkan cohort-based filtering per sektor, wilayah, dan skala usaha untuk mencegah false positive. \n- Modul C (Rekonsiliasi Setoran): Mengodekan data setoran dengan realisasi untuk mendeteksi defisit setoran lebih cepat \n\nECRS dilengkapi dengan Explainable AI (XAI) berbasis Gemini AI untuk memberikan rincian bukti/alasan logis, fitur auto-rescore (±10 detik), dan auto-retrain. Pendekatan ini menerapkan prinsip Human-in-the-Loop, di mana AI memberikan navigasi radar dan keputusan mutlak tetap di tangan verifikator.","ECRS berhasil menangkap 100% anomali kecurangan (recall sempurna) dengan tingkat false alarm sangat rendah (1,1%). Peringatan dini defisit setoran dapat terdeteksi hingga 1 bulan lebih awal. Sistem ini meningkatkan efisiensi verifikator secara drastis melalui worklist berbasis prioritas, menjamin kepatuhan UU PDP dengan 100% data sintetis, serta melindungi kesinambungan dana JKN."],"r":[{"n":"Juliana","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2985","tim":"GeoSDSLab","inov":"SIGARA: Sistem Informasi Geografis Berbasis Agentik GeoAI untuk Pemeriksaan Kewajaran Rujukan JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Keluhan pengarahan rujukan ke rumah sakit tertentu di Kupang menunjukkan perlunya pemeriksaan kewajaran rujukan JKN. Penilaian perlu mempertimbangkan kebutuhan medis, kemampuan layanan, akses, dan alasan pemilihan tujuan. SIGARA dirancang dengan Agentic GeoAI untuk menganalisis rujukan secara otomatis dan berkala serta menghasilkan laporan prioritas berbasis bukti. Petugas kemudian meninjau kasus prioritas untuk menentukan tindak lanjut.","Mengembangkan SIGARA untuk mengurangi beban pemeriksaan manual dan membantu petugas memeriksa kewajaran rujukan JKN berdasarkan akses geografis, kelayakan layanan, dan alasan rujukan. Agentic GeoAI dirancang melakukan analisis otomatis berkala serta menghasilkan laporan prioritas dan bukti yang dapat ditelusuri. Keputusan tindak lanjut tetap berada pada petugas. Pilot berizin akan mengukur ketepatan prioritas, kesalahan penandaan, kelengkapan bukti, dan waktu pemeriksaan.","SIGARA merupakan sistem pemeriksaan kewajaran rujukan JKN yang memadukan GIS dan Agentic GeoAI. Data asal dan tujuan, kebutuhan layanan, kapasitas fasilitas, jaringan jalan, dan alasan rujukan digunakan untuk membandingkan tujuan dengan alternatif yang layak. Agentic GeoAI dirancang menjalankan analisis otomatis berkala, mengoordinasikan enam agen spesialis, lalu menyusun laporan prioritas beserta rute, estimasi waktu, dan sumber bukti. Petugas meninjau kasus prioritas dan menentukan tindak lanjut. Chatbot membantu menjelaskan satu kasus. Prototype web Kupang menampilkan peta, rute, bukti kasus, dan simulasi agen pada 1.080 kasus sintetis. Uji internal dalam proposal memakai dataset berbeda berisi 1.800 rujukan sintetis. Pengembangan berikutnya mencakup analisis berkala, RAG, dan pilot satu layanan dengan data berizin. Evaluasi mengukur ketepatan prioritas, kesalahan penandaan, kelengkapan bukti, dan waktu pemeriksaan. Rencana pilot mencakup minimisasi data dan akses berbasis peran.","SIGARA diharapkan mempercepat pemeriksaan kewajaran rujukan JKN melalui GIS dan Agentic GeoAI yang membandingkan akses, kemampuan layanan, dan alasan rujukan. Pada simulasi 1.800 rujukan, 111 kasus diprioritaskan untuk pemeriksaan dan 152 memerlukan pelengkapan data. Dampak pilot akan diukur melalui ketepatan prioritas, kesalahan penandaan, waktu pemeriksaan, dan kelengkapan bukti. Penghematan waktu dan peningkatan akuntabilitas masih perlu dibuktikan pada pilot berizin."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2986","tim":"Anti-Ghosting Rujukan","inov":"PETA-JKN : Sistem Pendukung Keputusan Rujukan Berbasis Kesesuaian Layanan, Transparansi Data","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Aturan rujukan JKN sedang bergeser dari berjenjang ke berbasis kompetensi, sehingga dokter FKTP punya lebih banyak pilihan tujuan. Pilihan yang banyak membuka peluang rujukan salah sasaran: layanan yang dibutuhkan tidak ada, kapasitas sudah berubah, atau tujuan dipilih karena kebiasaan. Alasan memilih tujuan juga sulit dilihat kembali. Jumlah rujukan naik 22,19% antara Juni 2023 dan Juni 2024 (DJSN). Berapa yang bermasalah belum diketahui, dan itu yang ingin kami ukur.","Membantu dokter FKTP memilih tujuan rujukan lewat peringkat FKRTL yang bisa dijelaskan, dengan data kapasitas yang jelas sumber dan umurnya. Alasan memilih tujuan dicatat dengan satu klik, lalu lima sinyal berbasis aturan yang terbuka menandai rujukan yang perlu ditinjau. Harapannya rujukan salah sasaran terlihat lebih dini, sebelum menjadi klaim, tanpa mengambil alih keputusan klinis dokter.","PETA-JKN adalah aplikasi web sebagai alat bantu telaah sebelum rujukan dikirim. Ia berjalan di samping SISRUTE dan SatuSehat Rujukan, bukan menggantikannya. Petugas FKTP dan dokter DPJP memilih layanan yang dibutuhkan, lalu sistem memeringkat FKRTL kandidat dengan rincian waktu tempuh, kuota poli, dan keterisian tempat tidur (BOR). FKRTL dengan BOR 85% ke atas dikunci dari rekomendasi supaya pasien tidak ditolak. Dokter memilih alasan memilih tujuan dengan satu klik, dan lima sinyal (R1-R5) hanya berstatus perlu ditinjau atau informasi, tidak pernah menyatakan kecurangan. Pengelola program melihatnya di dashboard data teragregasi. Prototipe di petajkn.com sudah berjalan dengan data simulasi Kudus: peta, peringkat, tiket QR, kiosk admisi, monitoring BOR, dan asisten helpdesk. Layar alasan, sinyal, dan dashboard masih rancangan, dan integrasi SIRANAP butuh akses resmi.","Dampak yang diharapkan: dokter FKTP lebih cepat membandingkan tujuan dengan data kapasitas yang jelas sumber dan umurnya, pasien lebih kecil kemungkinannya bolak-balik, dan pengelola program punya jejak alasan serta sinyal dini untuk ditinjau. Besarnya dihitung dengan rumus terbuka N × (p0 - p1) × C. Per 100.000 rujukan, turun 1 poin persen berarti 1.000 rujukan, sekitar Rp374 juta sampai Rp5,41 miliar (DJSN Juni 2024). Ini skenario, bukan hasil; proporsi awal belum diketahui."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Yanuar Milad","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2990","tim":"Nexora","inov":"NEXORA-JKN: Deteksi Kecurangan Klaim Faskes Berbasis Bukti","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Biaya pelayanan JKN 2025 mencapai Rp191,3 triliun dengan ±1,9 juta layanan per hari, sementara aset neto DJS hanya cukup untuk ±1,88 bulan klaim. Pada 2024, audit sampel KPK, Kemenkes, BPKP, dan BPJS Kesehatan menemukan 3 RS yang mengklaim 4.341 kasus padahal catatan medis hanya memuat ±1.000 kasus, senilai ±Rp35 miliar. Pola ini sebenarnya terlihat di data, tetapi baru terungkap lewat audit sampel, dan tindak lanjutnya membutuhkan bukti yang rapi.","Membantu verifikator BPJS Kesehatan menemukan klaim faskes yang janggal lebih awal, untuk seluruh klaim dan bukan hanya sampel. Memprioritaskan pemeriksaan pada kasus paling berisiko agar faskes yang patuh tidak terbebani audit yang luas. Menyediakan bukti yang jelas dan bisa diperiksa ulang untuk setiap indikasi, sehingga klarifikasi ke faskes dan tindak lanjut Tim PK-JKN lebih cepat dan dapat dipertanggungjawabkan.","NEXORA-JKN adalah aplikasi web untuk verifikator klaim dan Tim PK-JKN yang dipasang di lingkungan BPJS Kesehatan. Setiap hari, sistem mencocokkan klaim dengan data kunjungan dan layanan, lalu menandai pola janggal untuk phantom billing, repeat billing, upcoding, dan cloning dengan membandingkan setiap faskes terhadap faskes sejenis. Indikasi masuk ke antrean yang diurutkan menurut tingkat kejanggalan dan nilai klaim. Setiap angka dilengkapi Jejak Bukti: sumber data, cara hitung, langkah proses, hasil pemeriksaan, dan riwayat, serta dapat dijalankan ulang dengan hasil yang sama. Asisten AI membantu verifikator bertanya dalam bahasa sehari-hari dan menyusun dugaan, tetapi tidak menghitung angka, tidak melihat data pribadi, dan tidak memutus kasus. Keputusan tetap di tangan verifikator, dan satu klik menghasilkan paket bukti untuk klarifikasi ke faskes. Prototype hackathon memakai data sintetis.","Indikasi kecurangan terdeteksi setiap hari, tidak menunggu siklus audit. Pemeriksaan terfokus pada kasus paling janggal sehingga faskes yang patuh tidak ikut terbebani. Seluruh angka memiliki bukti yang bisa diperiksa ulang, dan waktu menyusun berkas bukti untuk klarifikasi berkurang. Dana JKN lebih terjaga untuk layanan yang benar-benar diberikan kepada peserta. Besaran penghematan akan diukur saat pilot, bukan diklaim di awal."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2992","tim":"Dokter Kecil","inov":"SIGAP JKN","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Ketidakpatuhan pemberi kerja dalam Program JKN, seperti pendaftaran pekerja sebagian (PDUK), pelaporan upah lebih rendah, misklasifikasi status hubungan kerja, dan manipulasi data mutasi karyawan, dapat mengurangi perlindungan pekerja dan penerimaan iuran. Pemadanan data lintas sumber menghasilkan banyak selisih yang tidak semuanya merupakan pelanggaran. Oleh karena itu, diperlukan sistem analitik risiko untuk menentukan prioritas pemeriksaan secara tepat dan efisien.","Mengembangkan SIGAP JKN sebagai sistem pendukung keputusan untuk membantu BPJS Kesehatan menentukan prioritas pemeriksaan kepatuhan pemberi kerja melalui pemadanan data lintas sumber, indikator risiko terukur, deteksi anomali, dan machine learning. Sistem ini bertujuan meningkatkan ketepatan sasaran pemeriksaan, memperhitungkan potensi pemulihan iuran, serta menyediakan penjelasan yang transparan dan dapat dipertanggungjawabkan.","SIGAP JKN (Sistem Prioritas Pemeriksaan Kepatuhan Pemberi Kerja Berbasis Pemadanan Data Lintas Sumber dan Analitik Risiko) merupakan sistem pendukung keputusan berbasis web untuk membantu petugas BPJS Kesehatan menentukan badan usaha yang perlu diprioritaskan dalam pemeriksaan kepatuhan. Sistem memadankan data kepesertaan JKN dengan data BPJS Ketenagakerjaan, perpajakan, dan perizinan. Selanjutnya, SIGAP menghitung indikator risiko untuk mendeteksi PDUK, pelaporan upah lebih rendah, misklasifikasi status hubungan kerja, dan manipulasi data mutasi karyawan. Skor risiko menggabungkan aturan pakar, deteksi anomali, dan model terawasi sesuai ketersediaan data hasil pemeriksaan. Sistem menyediakan dasbor prioritas, penjelasan skor, profil risiko badan usaha, serta ruang kerja pemeriksaan dan klarifikasi. Hasil pemeriksaan digunakan sebagai umpan balik untuk meningkatkan kinerja model. Pada tahap Healthkathon, prototipe dikembangkan dan dievaluasi menggunakan data sintetis tanpa data nyata.","SIGAP JKN diharapkan meningkatkan efisiensi dan ketepatan sasaran pemeriksaan, sehingga kapasitas petugas dapat difokuskan pada badan usaha dengan risiko ketidakpatuhan dan potensi pemulihan iuran yang lebih tinggi. Sistem ini juga berpotensi membantu melindungi hak pekerja, mengurangi beban pemeriksaan bagi pemberi kerja yang patuh, mendorong persaingan usaha yang adil, serta memperkuat tata kelola Program JKN melalui keputusan yang transparan dan dapat diaudit."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2993","tim":"ubur-ubur","inov":"BPJS Smart Shield: Pemeriksaan Klaim JKN Tiga Lapis Sebelum Pembayaran","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["JKN melayani sekitar 1,9 juta layanan per hari. Biaya pelayanan 2025 mencapai Rp191,3 triliun, melampaui iuran Rp176,72 triliun (rasio klaim 108,27%). BPJS Kesehatan menemukan kecurangan klaim Rp6,8 triliun pada Januari-Oktober 2025, dan audit Tim PK-JKN mendapati 75,3% klaim fisioterapi di tiga rumah sakit tanpa rekam medis. Verifikasi manual tidak mampu menjangkau jutaan klaim, sehingga phantom billing dan upcoding sering baru terlihat setelah klaim dibayar.","Membangun prototype BPJS Smart Shield, pemeriksa klaim JKN tiga lapis yang bekerja sebelum klaim dibayar: (1) memeriksa kehadiran pasien dan kesesuaian resume medis dengan kode ICD-10/INA-CBG, (2) memberi skor risiko 0-100 beserta alasannya, (3) menganalisis jaringan dokter, apotek, dan peserta. Sistem hanya memprioritaskan klaim untuk ditinjau verifikator, tanpa penolakan otomatis. Prototype diuji pada data sintetis.","BPJS Smart Shield memeriksa setiap klaim yang masuk dari faskes. Lapis 1 (gatekeeper pra-bayar) mencocokkan bukti kehadiran pasien saat masuk dan selesai layanan serta kesesuaian resume medis dengan kode ICD-10 dan INA-CBG. Lapis 2 memakai gradient boosting dan deteksi anomali untuk menghasilkan skor risiko 0-100 dengan alasan yang bisa dibaca: 0-39 diproses normal, 40-69 desk audit verifikator, 70-100 diteruskan ke Lapis 3. Lapis 3 menganalisis graf hubungan dokter, apotek, dan peserta untuk menemukan kelompok mencurigakan. Setiap penolakan diputuskan verifikator dan dilaporkan ke Tim PK-JKN. Prototype dilatih dan diuji pada 60.000 klaim sintetis (50.000 latih, 10.000 uji) dengan 4% pola kecurangan, tanpa data JKN asli.","Skala masalah besar: 1% dari biaya pelayanan Rp191,3 triliun setara Rp1,9 triliun (gambaran skala, penghematan belum teruji). Target pada data sintetis: 100% klaim terperiksa, kurang dari 3 detik per klaim, precision minimal 70% pada 200 klaim skor tertinggi (acak: 4%), recall minimal 60% pada skor 40 ke atas. Penerima manfaat: peserta (dana JKN terjaga), faskes jujur (klaim sah tidak tertahan), BPJS Kesehatan (verifikator fokus pada klaim berisiko)."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2994","tim":"Nayas","inov":"Team Nayas - ProposalKlaimLensJKNHealthkathon2026","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim JKN rumah sakit sering tertunda (pending) karena kejadian readmisi dan fragmentasi episode yang tidak teridentifikasi sebelum klaim dikirim. Pemeriksaan masih manual dan baru dilakukan setelah verifikasi, sehingga tim casemix sulit memprioritaskan kasus dan kasus wajar berisiko ikut ditandai. KlaimLens JKN adalah dashboard berbasis aturan yang menandai readmisi, fragmentasi, dan KNS lebih awal, disertai alasan, data biaya, dan tautan berkas bukti per SEP, sehingga rumah sakit dapat menelaa","Tujuan umum\n\nMengembangkan KlaimLens JKN, dashboard analitik berbasis aturan yang membantu rumah sakit mengidentifikasi readmisi, fragmentasi episode, dan kasus non spesifik (KNS) sebelum klaim JKN dikirim, sehingga risiko klaim tertunda (pending) berkurang dan dana JKN terjaga. Keputusan akhir tetap berada pada tim casemix dan verifikator.\n\nTujuan khusus\n\nMendeteksi lebih awal. Menandai kasus readmisi (rawat inap, diagnosa utama sama, 30 hari atau kurang) dan fragmentasi (rawat jalan, diagnosa","KlaimLens JKN adalah produk digital berupa dashboard analitik klaim yang membantu rumah sakit melihat pola klaim sebelum menjadi temuan. Fokusnya pada tiga hal: fragmentasi episode, readmisi, dan kasus non spesifik (KNS). Dashboard dibangun dengan Power BI dan bekerja berdasarkan aturan yang transparan, sehingga setiap penandaan dapat dijelaskan dan diaudit. Sistem hanya menandai pola yang perlu ditelaah. Keputusan akhir tetap berada pada tim casemix dan verifikator.","Telaah acak atau manual diganti telaah terprioritas, dan temuan pasca-verifikasi diganti telaah pra-submit. Dampak diukur pada pilot melalui presisi penandaan setelah telaah, waktu telaah per kasus, dan nilai klaim yang terkoreksi atau tercegah; seluruh angka dampak saat ini masih estimasi. Penerima manfaat adalah peserta JKN (dana terjaga), rumah sakit (risiko pending dan koreksi menurun), dan BPJS Kesehatan (kualitas klaim meningkat dan verifikasi lebih efisien)."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Aries Kurniwan","s":null},{"n":"I Made Karistiawan","s":null}]}];

<script>
"use strict";
const W=[.20,.15,.20,.20,.15,.10];
const LVL=["Kurang","Cukup","Baik","Sangat baik"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const raw=s=>s.reduce((a,v,k)=>a+(v!=null?W[k]*v:0),0);
const sc10=s=>raw(s)/4*10;
const fmt=n=>n==null?"-":n.toFixed(2).replace(".",",");
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const ini=n=>n.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const EMPTY=()=>[null,null,null,null,null,null];
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ---------- state ---------- */
const TB=Object.fromEntries(TEAMS.map(t=>[t.id,t]));
const key=(id,n)=>id+"|"+n;
let SV={};                       // nilai dari server: key -> {s,t}
let LOCKED=new Set(TEAMS.filter(t=>t.lk).map(t=>t.id));
let CONN="load";                 // load | ok | local | err
let lastSync=null, DRAW=null;    // DRAW: {id,n,s,dirty}
const LOCAL=!CFG.api;
if(LOCAL){ const L=lsGet("nilai_local")||{}; SV=L; }

const eff=(t,r)=>{ const v=SV[key(t.id,r.n)]; return v?v.s:(r.s||EMPTY()); };
const nFill=s=>s.filter(v=>v!=null).length;
function info(t){
  const rs=t.r.map(r=>{const s=eff(t,r);return {n:r.n,s,f:nFill(s),raw:raw(s)}});
  const N=rs.length, done=rs.filter(r=>r.f===6).length, started=rs.filter(r=>r.f>0).length;
  const total=N?rs.reduce((a,r)=>a+r.raw,0)/(4*N)*10:null;
  return {rs,N,done,started,total,complete:N>0&&done===N};
}
const isLocked=t=>LOCKED.has(t.id);
function teamState(t){            // status global tim
  const i=info(t);
  if(isLocked(t)) return {k:"lock",label:"Terkunci",cls:"s-lock",i};
  if(i.complete) return {k:"done",label:"Selesai",cls:"s-done",i};
  if(i.started) return {k:"draft",label:`Dalam proses ${i.done}/${i.N}`,cls:"s-draft",i};
  return {k:"todo",label:"Belum dinilai",cls:"s-todo",i};
}
function myState(t,name){         // status untuk satu penilai
  const r=t.r.find(x=>x.n===name), s=eff(t,r), f=nFill(s);
  if(isLocked(t)) return {k:"lock",f,s};
  return {k:f===6?"done":f>0?"draft":"todo",f,s};
}
const decLabel=t=>t.dec==="L"?"Lulus":t.dec==="T"?"Tidak lulus":"";

/* ---------- koneksi ---------- */
function setConn(c){ CONN=c; const el=$("#sync"); el.className="pill btn "+({ok:"ok",local:"warn",err:"err",load:""}[c]);
  const tm=lastSync?lastSync.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}):"";
  $("#syncT").textContent={load:"Memuat...",ok:"Tersambung"+(tm?" · "+tm:""),local:"Mode uji (belum tersambung)",err:"Gagal terhubung · ketuk untuk coba lagi"}[c]; }
async function apiGet(){ const r=await fetch(CFG.api+(CFG.api.includes("?")?"&":"?")+"action=all&_="+Date.now()); if(!r.ok) throw new Error("http "+r.status); return r.json(); }
async function apiPost(b){ const r=await fetch(CFG.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)}); if(!r.ok) throw new Error("http "+r.status); return r.json(); }

async function load(silent){
  if(LOCAL){ setConn("local"); render(); return; }
  if(!silent) setConn("load");
  try{
    const d=await apiGet();
    SV={}; (d.rows||[]).forEach(r=>{SV[key(r.id,r.n)]={s:r.s,t:r.t}});
    (d.locked||[]).forEach(i=>LOCKED.add(String(i)));
    lastSync=new Date(); setConn("ok");
    syncSeed(d);                 // lengkapi server dengan nilai awal & kunci (idempoten)
  }catch(e){ console.warn(e); setConn("err"); }
  if(!DRAW) render();
}
async function syncSeed(d){
  const have=new Set((d.rows||[]).map(r=>key(r.id,r.n)));
  const rows=[]; TEAMS.forEach(t=>t.r.forEach(r=>{ if(r.s&&!have.has(key(t.id,r.n))) rows.push({id:t.id,n:r.n,s:r.s}); }));
  const srvLocked=new Set((d.locked||[]).map(String));
  const lock=TEAMS.filter(t=>t.lk&&!srvLocked.has(t.id)).map(t=>t.id);
  if(!rows.length&&!lock.length) return;
  try{ const r=await apiPost({action:"seed",rows,lock});
    if(r.ok){ rows.forEach(x=>{ if(!SV[key(x.id,x.n)]) SV[key(x.id,x.n)]={s:x.s,t:r.t}; }); if(!DRAW) render(); } }catch(e){ console.warn("seed",e); }
}
async function saveRow(id,n,s){
  if(LOCAL){ SV[key(id,n)]={s,t:new Date().toISOString()}; lsSet("nilai_local",SV); return; }
  const r=await apiPost({action:"save",id,n,s});
  if(!r.ok){ if(r.err==="locked") LOCKED.add(id); throw new Error(r.err||"gagal"); }
  SV[key(id,n)]={s:r.row.s,t:r.row.t}; lastSync=new Date(); setConn("ok");
}

/* ---------- toast ---------- */
let tt; function toast(m,err){ const e=$("#toast"); e.textContent=m; e.className="on"+(err?" err":""); clearTimeout(tt); tt=setTimeout(()=>e.className="",err?4500:2400); }

/* ---------- router ---------- */
let F={filter:"todo",q:""}, SUM={st:"all",q:""};
function route(){ const h=location.hash.replace(/^#\/?/,""); const p=h.split("/");
  if(p[0]==="p"&&POOL.concat(otherNames()).find(n=>slug(n)===p[1])) return {v:"me",name:POOL.concat(otherNames()).find(n=>slug(n)===p[1])};
  if(p[0]==="ringkasan") return {v:"sum"};
  return {v:"home"}; }
const otherNames=()=>[...new Set(TEAMS.flatMap(t=>t.r.map(r=>r.n)))].filter(n=>!POOL.includes(n)).sort();
function render(){
  const R=route();
  $("#nHome").removeAttribute("aria-current"); $("#nSum").removeAttribute("aria-current");
  if(R.v==="sum") $("#nSum").setAttribute("aria-current","page"); else $("#nHome").setAttribute("aria-current","page");
  let h=banners();
  h+= R.v==="me"?viewMe(R.name): R.v==="sum"?viewSum(): viewHome();
  $("#app").innerHTML=h; bind(R);
}
function banners(){
  let h="";
  if(LOCAL) h+=`<div class="banner warn" role="alert"><div><b>Mode uji.</b> Penyimpanan bersama belum disambungkan, nilai yang Anda simpan hanya tersimpan di browser ini dan tidak terlihat penilai lain.</div></div>`;
  if(CONN==="err") h+=`<div class="banner err" role="alert"><div><b>Gagal terhubung ke penyimpanan.</b> Data yang tampil bisa belum terbaru dan nilai belum bisa disimpan.</div><button type="button" data-act="retry">Coba lagi</button></div>`;
  return h;
}
window.addEventListener("hashchange",()=>{ closeSheet(true); render(); window.scrollTo(0,0); });

/* ---------- beranda ---------- */
function viewHome(){
  const S={todo:0,draft:0,done:0,lock:0}; let slots=0,fill=0;
  TEAMS.forEach(t=>{ S[teamState(t).k]++; if(!isLocked(t)) t.r.forEach(r=>{slots++; if(nFill(eff(t,r))===6) fill++;}); });
  const open=slots-fill;
  const card=n=>{ const mine=TEAMS.filter(t=>t.r.some(r=>r.n===n)); const open=mine.filter(t=>!isLocked(t));
    const w=workload(n), done=w.done, lock=w.lock;
    const pct=w.all?Math.round(done/w.all*100):100;
    return `<button class="person" data-go="${slug(n)}"><div class="top"><div class="av">${esc(ini(n))}</div><div><b>${esc(n)}</b><small>${mine.length} tim ditugaskan</small></div></div>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="meta"><span>${done} dari ${w.all} sudah dinilai</span><span>${w.all-done} sisa</span></div></button>`; };
  const oth=otherNames();
  return `<div class="kpis">
    <div class="card kpi"><b>${TEAMS.length}</b><span>Total tim</span></div>
    <div class="card kpi"><b>${S.done+S.lock}</b><span>Penilaian lengkap</span></div>
    <div class="card kpi"><b>${S.draft}</b><span>Dalam proses</span></div>
    <div class="card kpi"><b>${S.todo}</b><span>Belum dinilai</span></div>
    <div class="card kpi"><b>${open}</b><span>Penilaian individu tersisa</span></div></div>
  <div class="sec-h"><h2>Siapa Anda?</h2><span class="muted">Pilih nama untuk melihat tim yang perlu Anda nilai</span></div>
  <div class="people">${POOL.map(card).join("")}</div>
  ${oth.length?`<div class="sec-h"><h2>Penilai lainnya</h2><span class="muted">Penilai yang tercatat di Kertas Kerja tahap awal</span></div><div class="people">${oth.map(card).join("")}</div>`:""}`;
}

/* ---------- daftar tim milik penilai ---------- */
function viewMe(name){
  const mine=TEAMS.filter(t=>t.r.some(r=>r.n===name));
  const cnt={todo:0,done:0,lock:0,all:mine.length};
  mine.forEach(t=>{ const k=myState(t,name).k; if(k==="done")cnt.done++; else if(k==="lock")cnt.lock++; else cnt.todo++; });
  let list=mine.filter(t=>{ const k=myState(t,name).k;
    if(F.filter==="todo"&&!(k==="todo"||k==="draft")) return false;
    if(F.filter==="done"&&k!=="done") return false;
    if(F.filter==="lock"&&k!=="lock") return false;
    if(F.q){ const q=F.q.toLowerCase(); if(!(t.tim+" "+t.inov+" "+t.id).toLowerCase().includes(q)) return false; }
    return true; });
  const W_=workload(name), pct=W_.all?Math.round(W_.done/W_.all*100):100;
  const ch=(k,l,n)=>`<button class="chip" data-f="${k}" aria-pressed="${F.filter===k}">${l}<small>${n}</small></button>`;
  return `<div class="card me-head"><div class="av">${esc(ini(name))}</div><div class="grow"><h2>${esc(name)}</h2>
    <div class="muted">${W_.done} dari ${W_.all} tim sudah dinilai${W_.lock?` (${W_.lock} di tim terkunci)`:""} · ${W_.all-W_.done} sisa</div>
    <div class="bar" style="max-width:360px"><i style="width:${pct}%"></i></div></div>
    <a class="linkbtn" href="#/">Bukan Anda? Ganti nama</a></div>
  <div class="tools"><div class="chips" role="group" aria-label="Filter">${ch("todo","Perlu dinilai",cnt.todo)}${ch("done","Selesai",cnt.done)}${cnt.lock?ch("lock","Terkunci",cnt.lock):""}${ch("all","Semua",cnt.all)}</div>
    <input class="search" id="q" type="search" placeholder="Cari nama tim, judul, atau ID" value="${esc(F.q)}" aria-label="Cari tim"></div>
  <div class="list">${list.length?list.map(t=>teamRow(t,name)).join(""):`<div class="card empty">${F.filter==="todo"&&!F.q?"Semua tim Anda sudah dinilai. Terima kasih!":"Tidak ada tim yang cocok."}</div>`}</div>`;
}
function teamRow(t,name){
  const m=myState(t,name), lock=m.k==="lock";
  const st=lock?`<span class="st s-lock">&#128274; Terkunci${t.dec?" · "+decLabel(t):""}</span>`
    :m.k==="done"?`<span class="st s-done">&#10003; Selesai · ${fmt(sc10(m.s))}</span>`
    :m.k==="draft"?`<span class="st s-draft">Draft ${m.f}/6</span>`:`<span class="st s-todo">Belum dinilai</span>`;
  const btn=lock?"Lihat":m.k==="done"?"Ubah":m.k==="draft"?"Lanjutkan":"Nilai";
  return `<button class="team" data-open="${t.id}" data-n="${esc(name)}"><div><div class="t1"><span class="num">#${t.id}</span><span>${esc(t.kat.replace("Efisiensi Risiko pada ",""))}</span>${t.rv?`<span class="st s-rev">Hasil revisi</span>`:""}</div>
    <h3>${esc(t.tim)}</h3><div class="j">${esc(t.inov)}</div></div>
    <div class="act">${st}<span class="btn ${m.k==="todo"||m.k==="draft"?"btn-p":"btn-o"}">${btn}</span></div></button>`;
}

/* ---------- ringkasan ---------- */
function viewSum(){
  const rows=TEAMS.map(t=>({t,s:teamState(t)}));
  const tot={all:rows.length}; rows.forEach(r=>tot[r.s.k]=(tot[r.s.k]||0)+1);
  const list=rows.filter(r=>(SUM.st==="all"||r.s.k===SUM.st)&&(!SUM.q||(r.t.tim+" "+r.t.inov+" "+r.t.id).toLowerCase().includes(SUM.q.toLowerCase())));
  const opt=(k,l)=>`<option value="${k}"${SUM.st===k?" selected":""}>${l} (${tot[k]||0})</option>`;
  const PN=[...POOL,...otherNames()], LD=PN.map(n=>workload(n));
  const sum=k=>LD.reduce((a,x)=>a+x[k],0);
  const load=LD.map((x,i)=>`<tr><td>${esc(PN[i])}</td><td class="num">${x.all}</td><td class="num">${x.done}${x.lock?` <span class="muted" style="font-size:12px">(${x.lock} terkunci)</span>`:""}</td><td class="num">${x.prog}</td><td class="num">${x.none}</td></tr>`).join("")
    +`<tr style="font-weight:700"><td>Total</td><td class="num">${sum("all")}</td><td class="num">${sum("done")}</td><td class="num">${sum("prog")}</td><td class="num">${sum("none")}</td></tr>`;
  return `<div class="tools"><select class="search" id="sst" aria-label="Filter status">${opt("all","Semua tim")}${opt("todo","Belum dinilai")}${opt("draft","Dalam proses")}${opt("done","Selesai")}${opt("lock","Terkunci")}</select>
    <input class="search" id="sq" type="search" placeholder="Cari nama tim, judul, atau ID" value="${esc(SUM.q)}" aria-label="Cari tim"></div>
  <div class="card tablewrap"><table class="rtab"><thead><tr><th>ID</th><th>Tim</th><th>Status</th><th>Penilai</th><th>Skor akhir</th></tr></thead><tbody>
  ${list.map(({t,s})=>`<tr><td class="num idc">${t.id}</td><td><b>#${t.id} ${esc(t.tim)}</b>${t.rv?` <span class="st s-rev">Hasil revisi</span>`:""}<div class="muted" style="font-size:13px;max-width:46ch">${esc(t.inov)}</div></td>
   <td data-l="Status"><span class="st ${s.cls}">${s.k==="lock"?"&#128274; ":""}${s.label}</span>${t.lk&&t.dec?`<div class="muted" style="font-size:12.5px;margin-top:4px">${decLabel(t)} · flag ${esc(t.fd)}</div>`:""}</td>
   <td data-l="Penilai">${s.i.rs.map(r=>`<span class="rv ${r.f===6?"d":r.f>0?"p":""}" title="${r.f}/6 kriteria terisi">${r.f===6?"&#10003;":r.f>0?"&#9684;":"&#9675;"} ${esc(r.n)}</span>`).join("")||'<span class="muted">-</span>'}</td>
   <td class="num" data-l="Skor akhir">${s.i.complete||t.lk?fmt(s.i.total):'<span class="muted">-</span>'}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">Tidak ada tim yang cocok.</td></tr>`}
  </tbody></table></div>
  <div class="sec-h"><h2>Beban per penilai</h2><span class="muted">Ditugaskan = Sudah dinilai + Dalam proses + Belum dinilai</span></div>
  <div class="card tablewrap"><table><thead><tr><th>Penilai</th><th>Ditugaskan</th><th>Sudah dinilai</th><th>Dalam proses</th><th>Belum dinilai</th></tr></thead><tbody>${load}</tbody></table></div>
  <p class="muted" style="font-size:13px;margin:12px 4px">"Sudah dinilai" mencakup nilai dari Kertas Kerja dan nilai yang diisi lewat form ini; "terkunci" = tim sudah diflag di sistem. Tim revisi dinilai ulang oleh penilai baru. Skor akhir tampil setelah semua penilai tim mengisi lengkap. Nilai per penilai tidak ditampilkan agar penilaian tetap independen.</p>`;
}

function workload(n){   // satu penilai: tim terkunci memakai nilai dari Kertas Kerja dan dihitung sebagai sudah dinilai
  const mine=TEAMS.filter(t=>t.r.some(r=>r.n===n)); let done=0,lock=0,prog=0;
  mine.forEach(t=>{ const m=myState(t,n); if(m.f===6){ done++; if(isLocked(t)) lock++; } else if(!isLocked(t)&&m.f>0) prog++; });
  return {all:mine.length,done,lock,prog,none:mine.length-done-prog};
}
function bind(R){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ F={filter:"todo",q:""}; lsSet("nilai_me",b.dataset.go); location.hash="#/p/"+b.dataset.go; });
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ F.filter=b.dataset.f; render(); });
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openSheet(b.dataset.open,b.dataset.n));
  document.querySelectorAll("[data-act=retry]").forEach(b=>b.onclick=()=>load());
  const q=$("#q"); if(q) q.oninput=e=>{ F.q=e.target.value; const p=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(p,p); };
  const sq=$("#sq"); if(sq) sq.oninput=e=>{ SUM.q=e.target.value; const p=e.target.selectionStart; render(); const n=$("#sq"); n.focus(); n.setSelectionRange(p,p); };
  const ss=$("#sst"); if(ss) ss.onchange=e=>{ SUM.st=e.target.value; render(); };
}
$("#sync").onclick=()=>{ if(!LOCAL) load(); };

/* ---------- panel penilaian ---------- */
function nextTodo(from,name){ const mine=TEAMS.filter(t=>t.r.some(r=>r.n===name)&&!isLocked(t)&&myState(t,name).k!=="done");
  const i=mine.findIndex(t=>t.id===from); return mine.find((t,j)=>t.id!==from&&j>i)||mine.find(t=>t.id!==from)||null; }
function openSheet(id,name){
  const t=TB[id], r=t.r.find(x=>x.n===name), lock=isLocked(t);
  DRAW={id,n:name,s:eff(t,r).slice(),orig:eff(t,r).slice(),dirty:false,lock,busy:false};
  drawSheet(); $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); document.body.style.overflow="hidden";
  $("#sheet .x").focus();
}
function closeSheet(force){
  if(!DRAW) return true;
  if(!force&&DRAW.dirty&&!confirm("Ada perubahan yang belum disimpan. Tutup tanpa menyimpan?")) return false;
  DRAW=null; $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); document.body.style.overflow=""; return true;
}
$("#scrim").onclick=()=>{ if(closeSheet()) render(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&DRAW){ if(closeSheet()) render(); } });
window.addEventListener("beforeunload",e=>{ if(DRAW&&DRAW.dirty){ e.preventDefault(); e.returnValue=""; } });

function drawSheet(){
  const D=DRAW, t=TB[D.id], i=info(t), lock=D.lock;
  const filled=nFill(D.s), full=filled===6, my=full?sc10(D.s):null;
  const row=SV[key(D.id,D.n)];
  const fileInfo=t.f?`<div class="line"><span class="muted">Berkas proposal:</span><span class="file">${esc(t.f.replace(/^revisi\//,""))}</span></div>`:"";
  const nxt=nextTodo(D.id,D.n);
  $("#sheet").innerHTML=`
  <div class="sh-head"><div class="row"><div><div class="eyebrow">#${esc(t.id)} · ${esc(t.kat)}</div><h2 id="shT">${esc(t.tim)}</h2><p>${esc(t.inov)}</p></div>
    <button class="x" type="button" aria-label="Tutup" data-x>&times;</button></div></div>
  <div class="sh-body"><div class="split"><div class="pane" id="paneA">
    ${lock?`<div class="banner lock"><div>&#128274; <b>Penilaian dikunci.</b> Tim ini sudah diflag di sistem${t.fd?` (${esc(t.fd)})`:""}${t.dec?` dengan keputusan <b>${decLabel(t)}</b>`:""}, sehingga nilai tidak dapat diubah.</div></div>`:""}
    ${t.fw?`<div class="banner err"><div><b>Perhatian:</b> ${esc(t.fw)}</div></div>`:""}
    <div class="card info">
      ${t.rv?`<div class="line"><span class="st s-rev">Hasil revisi</span><span class="muted">${esc(t.rv)}</span></div>`:""}
      ${fileInfo}
      <div class="line" style="margin-top:6px">${(t.rv?(CFG.spRev||CFG.sp):CFG.sp)?`<a class="btn btn-o" href="${esc(t.rv?(CFG.spRev||CFG.sp):CFG.sp)}" target="_blank" rel="noopener">${t.rv?"Buka folder proposal revisi (SharePoint)":"Buka folder proposal (SharePoint)"}</a>`:""}</div>
      <div class="line" style="margin-top:8px"><span class="muted">Penilai tim ini:</span>${i.rs.map(r=>`<span class="rv ${r.f===6?"d":r.f>0?"p":""}${r.n===D.n?" me":""}">${r.f===6?"&#10003;":r.f>0?"&#9684;":"&#9675;"} ${esc(r.n)}${r.n===D.n?" (Anda)":""}</span>`).join("")}</div>
    </div>
    ${submHtml(t)}
    </div><div class="pane" id="paneB">
    ${CRIT.map((c,k)=>critHtml(c,k,D.s[k],lock)).join("")}
  </div></div></div>
  <div class="sh-foot"><div class="score"><b class="num">${my!=null?fmt(my):"-"}</b><small>${full?"Skor Anda (skala 10)":`Terisi ${filled} dari 6 kriteria`}</small>
      <div class="dots">${D.s.map(v=>`<i class="${v!=null?"on":""}"></i>`).join("")}</div>
      ${row&&row.t?`<small>Tersimpan ${new Date(row.t).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</small>`:""}</div>
    <div class="btns">${lock?`<button class="btn btn-o" data-x type="button">Tutup</button>`:
      `<button class="btn btn-o" data-save="close" type="button" ${D.dirty&&!D.busy?"":"disabled"}>Simpan</button>
       ${nxt?`<button class="btn btn-p" data-save="next" type="button" ${D.dirty&&!D.busy?"":"disabled"}>Simpan &amp; berikutnya</button>`:`<button class="btn btn-p" data-save="close" type="button" ${D.dirty&&!D.busy?"":"disabled"}>${D.busy?"Menyimpan...":"Simpan"}</button>`}`}</div></div>`;
  // ikat event
  const sh=$("#sheet");
  sh.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ if(closeSheet()) render(); });
  sh.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ if(D.lock) return; const k=+b.dataset.k, v=+b.dataset.v;
    D.s[k]=v; D.dirty=D.s.some((x,j)=>x!==D.orig[j]); const tops=["#paneA","#paneB",".sh-body"].map(q=>{const e=sh.querySelector(q);return e?e.scrollTop:0}); drawSheet(); ["#paneA","#paneB",".sh-body"].forEach((q,i)=>{const e=sh.querySelector(q); if(e) e.scrollTop=tops[i];});
    const nb=sh.querySelector(`.seg[data-k="${k}"] button[data-v="${v}"]`); if(nb) nb.focus({preventScroll:true}); });
  sh.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>doSave(b.dataset.save));
}
const SUBL=["Latar Belakang","Tujuan","Deskripsi Solusi","Dampak"];
function submHtml(t){
  if(!t.sub||!t.sub.length) return `<div class="banner warn"><div>Data submisi tim ini tidak tersedia.</div></div>`;
  return `<details class="card subm" open><summary>Data Submisi Peserta</summary>
    <div class="sec"><h4>Judul inovasi</h4><p>${esc(t.inov)}</p></div>
    ${t.sub.map((x,j)=>`<div class="sec"><h4>${SUBL[j]}</h4><p>${esc(x)}</p></div>`).join("")}</details>`;
}
function critHtml(c,k,val,lock){
  return `<div class="card crit"><div class="crit-h"><div class="kn">${k+1}</div><div><b>${esc(c.n)}</b><small>Bobot ${Math.round(c.w*100)}%</small></div></div>
  <p class="ket">${esc(c.ket)}</p>
  <div class="seg" role="radiogroup" aria-label="${esc(c.n)}" data-k="${k}">${[1,2,3,4].map(v=>`<button type="button" role="radio" aria-checked="${val===v}" data-k="${k}" data-v="${v}" ${lock?"disabled":""}><b>${v}</b><span>${LVL[v-1]}</span></button>`).join("")}</div>
  <div class="ind ${val==null?"none":""}">${val==null?"Pilih nilai 1-4 untuk melihat indikatornya.":`<b>Nilai ${val}:</b> ${esc(c.ind[val-1])}`}</div>
  <details class="all"><summary>Lihat semua indikator</summary>${c.ind.map((x,j)=>`<div><b>${j+1}</b><span>${esc(x)}</span></div>`).join("")}</details></div>`;
}
async function doSave(mode){
  const D=DRAW; if(!D||D.busy||!D.dirty) return;
  D.busy=true; drawSheet();
  const id=D.id,n=D.n,s=D.s.slice(); const nxt=nextTodo(id,n);
  try{
    await saveRow(id,n,s);
    toast(nFill(s)===6?"Nilai tersimpan":"Draft tersimpan ("+nFill(s)+"/6 kriteria)");
    D.orig=s.slice(); D.dirty=false; D.busy=false;
    if(mode==="next"&&nxt){ DRAW=null; openSheet(nxt.id,n); render(); }
    else { closeSheet(true); render(); }
  }catch(e){
    D.busy=false; drawSheet();
    toast(String(e.message)==="locked"?"Tim ini sudah terkunci, nilai tidak dapat diubah.":"Gagal menyimpan. Periksa koneksi lalu coba lagi.",true);
  }
}

/* ---------- mulai ---------- */
(function init(){
  if(!location.hash){ const me=lsGet("nilai_me"); if(me&&POOL.concat(otherNames()).some(n=>slug(n)===me)) location.replace("#/p/"+me); }
  render(); load();
  setInterval(()=>{ if(!document.hidden&&!DRAW) load(true); },60000);
})();
</script>
</body>
</html>
