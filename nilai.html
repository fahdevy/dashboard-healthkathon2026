kasi lebih cepat lewat prioritisasi klaim berisiko; (2) koreksi berbasis bukti yang transparan dan dapat diaudit; (3) pencegahan overpayment sebelum pembayaran terjadi; (4) beban dispute berkurang. Dengan memindahkan pemeriksaan ke pra-bayar, dana JKN terlindungi tanpa menghambat klaim yang sah."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2782","tim":"JHSoft","inov":"RUJUKGUARD","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Beban klaim JKN 2025 mencapai Rp191,33 T, melampaui iuran Rp176,72 T (rasio klaim 108,27%), dengan 725 juta layanan per tahun. Saat FKTP tidak mampu menangani pasien, tujuan rujukan masih bergantung pada kebiasaan atau preferensi, sehingga muncul rujukan tidak sesuai dan self-referral: pasien tiba di faskes tanpa dokter atau alat yang cocok, lalu dirujuk lagi. Akibatnya waktu terbuang dan biaya berlipat bagi pasien dan JKN.","Memilihkan faskes tujuan rujukan yang paling cocok bagi setiap pasien secara otomatis, berdasarkan kompetensi, alat, dokter, kapasitas, dan jarak. Tujuan khusus: (1) mengurangi rujukan tidak sesuai dan rujukan berulang; (2) membatasi self-referral dengan mewajibkan alasan tercatat bila tujuan diganti; (3) memberi BPJS dan Dinkes pemantauan pola penggantian tujuan; (4) mempercepat pasien sampai ke tindakan yang tepat.","RujukGuard adalah platform AI untuk memilih faskes tujuan rujukan JKN. Dokter FKTP menetapkan pasien perlu dirujuk dan mengisi diagnosis serta kebutuhan tindakan/alat. Rujuk Assist menyaring faskes yang layak (kompetensi, kelas, alat), lalu mengurutkannya menurut kapasitas tempat tidur dan jarak; hasil teratas menjadi tujuan default beserta alasannya di surat rujukan. Rujuk Shield membuat RS penerima mengonfirmasi kesiapan. Bila dokter atau pasien mengganti tujuan, alasan wajib diisi, dan Rujuk Radar menampilkan pola penggantian kepada BPJS dan Dinkes. Gawat darurat tetap ke IGD terdekat dan keputusan medis tetap pada dokter. Prototipe awal berjalan pada data sintetis dan akan diuji lewat pilot di satu kabupaten/kota.","Bagi pasien: tiba di faskes yang bisa menangani dalam sekali jalan, tanpa rujukan berulang. Bagi FKTP dan RS: rujukan lebih tepat, pengalihan pasien berkurang. Bagi BPJS dan Dinkes: penggantian tujuan terlihat sebagai data, bukan dugaan. Bagi JKN: biaya ganda berkurang; setiap penghematan 1% dari total klaim 2025 setara sekitar Rp1,9 T. Target pilot (asumsi, belum terbukti): rujukan tidak sesuai kompetensi turun 20%, saran AI diterima dokter minimal 85%, penggantian tujuan tanpa alasan maksimal"],"r":[{"n":"Juliana","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2783","tim":"Alif Sehat","inov":"AMANAH JKN: Konfirmasi Penggunaan Identitas pada Kunjungan JKN","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Penyalahgunaan identitas dapat mendukung klaim layanan fiktif. Pada Juli 2024, KPK mengungkap dugaan penggunaan dokumen identitas warga untuk klaim fiktif di tiga rumah sakit (ANTARA, 24 Juli 2024). AMANAH JKN mengusulkan konfirmasi peserta yang terhubung dengan catatan kunjungan petugas agar ketidaksesuaian dapat diklarifikasi. Kasus tersebut menjadi konteks risiko, bukan ukuran prevalensi kecurangan peserta.","Mengembangkan dan menguji prototipe konfirmasi penggunaan identitas pada kunjungan JKN. Solusi menghubungkan respons peserta dan catatan petugas melalui referensi kunjungan yang sama, menyediakan jalur klarifikasi, serta menjaga riwayat koreksi. Pengujian mencakup validasi token, ketepatan status, waktu konfirmasi, dan kemudahan penggunaan dengan data sintetis.","AMANAH JKN merupakan rancangan aplikasi konfirmasi kunjungan bagi peserta, petugas fasilitas kesehatan, dan peninjau berwenang. Petugas mencatat kunjungan; sistem menerbitkan QR sekali pakai yang terikat pada transaksi dan peserta. Peserta melakukan autentikasi, membaca rincian, lalu memilih mengenali, tidak mengenali, atau belum yakin. Server memeriksa token dan mencatat respons. Ketidaksesuaian masuk antrean klarifikasi, sedangkan belum merespons tetap berstatus tertunda. Data pribadi disimpan terlindungi dengan akses sesuai peran; koreksi dicatat sebagai peristiwa baru yang terhubung. Log terpusat bertanda tangan digital akan dibandingkan dengan ledger permissioned untuk mengevaluasi bukti integritas. Saat ini solusi berupa konsep dan mockup. Prototipe direncanakan menggunakan data sintetis; integrasi BPJS memerlukan akses resmi. Konfirmasi kunjungan tidak membuktikan seluruh layanan diberikan dan tidak otomatis menetapkan fraud.","Manfaat yang diharapkan ialah peserta lebih mudah menyampaikan kunjungan yang tidak dikenali, petugas lebih mudah menelusuri perbedaan informasi, dan peninjau memperoleh konteks tambahan untuk klarifikasi. Evaluasi mengukur keberhasilan alur valid, penolakan QR ulang/kedaluwarsa, kesalahan penandaan, waktu konfirmasi, serta kemudahan penelusuran. Hasil belum tersedia; dampak terhadap fraud dan biaya JKN memerlukan pilot berizin dengan pembanding."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Yanuar Milad","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2789","tim":"Parallax","inov":"JAGA KLAIM: Sistem Pengawasan Integritas Klaim JKN & Validasi Pasien Berbasis Ekosistem SATUSEHAT","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Merujuk investigasi Tim Gabungan KPK, Kemenkes, dan BPJS Kesehatan (24 Juli 2024), fraud klaim JKN di 3 faskes merugikan Rp34 miliar, dengan 75% tindakan terbukti fiktif (phantom billing). Celah timbul karena verifikasi saat ini masih manual dan reaktif pasca-bayar tanpa melibatkan pasien sebagai saksi layanan riil. Lemahnya validasi berkas terhadap rekam medis digital memicu tingginya sengketa klaim (dispute) serta kebocoran anggaran publik jaminan kesehatan.","Membangun platform validasi pra-klaim terintegrasi yang menyaring anomali tagihan secara proaktif di faskes sebelum berkas dikirim ke BPJS Kesehatan. Sistem bertujuan mengeliminasi klaim fiktif melalui pencocokan bukti rekam medis otomatis, memfasilitasi atestasi langsung oleh pasien pasca-rawat secara aman (UU PDP No. 27/2022), serta mempercepat proses persetujuan verifikator BPJS lewat verifikasi integritas hash digital (Fast-Track Approval).","JAGA KLAIM adalah platform tata kelola integritas klaim JKN berbasis ekosistem SATUSEHAT yang mengintegrasikan tiga pilar: Faskes, Pasien, dan BPJS Kesehatan. Sistem bekerja dengan arsitektur pre-submission audit melalui delapan rule engine deterministik yang memverifikasi kepatuhan tarif INA-CBG/iDRG, durasi rawat inap, kewajaran farmasi, dan ketersediaan bukti klinis digital di SIMRS. Dilengkapi guardrail etika Clinical Documentation Improvement (CDI), sistem memfasilitasi klarifikasi dokter DPJP tanpa rekayasa diagnosis. Setelah pasien keluar RS, sistem mengirimkan tautan verifikasi mandiri terenkripsi (challenge DOB) agar peserta memvalidasi layanan yang dialami sebagai saksi riil. BPJS Kesehatan menerima berkas berstempel hash SHA-256 yang menjamin keaslian bukti tanpa kebocoran data rekam medis mentah (zero document leakage), memungkinkan persetujuan instan (Fast-Track) bagi klaim bersih dan peringatan dini bagi berkas berisiko.","Berdasarkan mandat Permenkes 16/2019 dan pedoman anti-fraud BPJS Kesehatan, sistem ini mencegah kebocoran dana jaminan nasional akibat klaim fiktif secara preventif, sekaligus memangkas rasio sengketa (dispute) guna memperlancar arus kas faskes. Mengurangi beban verifikator BPJS melalui otomatisasi berkas berintegritas tinggi, serta memberikan perlindungan penuh hak peserta JKN tanpa iur biaya liar dengan jaminan kedaulatan data medis sesuai amanat UU PDP No. 27/2022."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2790","tim":"Health queue","inov":"JKN SmartTriage: Tele-Triase AI untuk Mitigasi Unnecessary Service","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Berdasarkan Kompas.com pada tahun 2026 dan 2025, melaporkan bahwa seorang pasien JKN menunggu delapan jam untuk ruang perawatan serta sebanyak 27.038 peserta JKN mengeluhkan pelayanan, terutama antrean panjang. Antrean bukan hanya soal volume, melainkan alokasi prioritas yang keliru: perawatan tidak perlu ditaksir merugikan BPJS hingga 10 triliun per tahun (Tempo, 2020). Pendaftaran JKN masih berbasis urutan kedatangan tanpa memperhitungan urgensi medis, sehingga pasien kritis berisiko tertunda.","Merancang fitur tele-triase berbasis AI pada aplikasi JKN untuk memilah dan memprioritaskan peserta berdasarkan urgensi medis sejak pendaftaran, sehingga pasien gawat darurat tidak tertunda, kapasitas layanan prioritas lebih tepat sasaran (mitigasi unnecessary services), status prioritas transparan bagi peserta, dan perubahan manual hasil pra-skrining dapat dipantau lewat deteksi anomali.","Fitur tele-triase berbasis AI pada aplikasi JKN yang menilai urgensi medis peserta lewat kuesioner singkat saat mendaftar. Skor tinggi, sedang, atau rendah menentukan urutan antrean, yang disortir ulang secara berkala. Peserta menerima status prioritas dan saran fasilitas kesehatan BPJS lain bila menunggu lama. AI hanya pendukung keputusan, triase klinis tetap oleh tenaga medis. Perubahan manual dicatat dan dipantau lewat deteksi anomali. Kategori: Efisiensi Risiko pada Peserta (unnecessary services).","Bagi peserta: pasien gawat darurat lebih cepat teridentifikasi dan mendapat kejelasan status serta alternatif faskes BPJS lain. Bagi faskes: kapasitas prioritas lebih tepat sasaran, triase klinis tetap berjalan. Bagi BPJS Kesehatan: mitigasi unnecessary services (Tempo, 2020), pemantauan penyalahgunaan sistem lewat audit trail, dan implementasi di aplikasi JKN yang sudah ada tanpa platform baru."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2791","tim":"Plus","inov":"PayRay: Rontgen Kepatuhan Pemberi Kerja untuk JKN","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Iuran PPU dihitung 5% dari upah yang dilaporkan pemberi kerja. Upah yang dilaporkan setara UMK padahal lebih tinggi, pekerja yang tidak didaftarkan, atau pekerja yang dipindah ke PBPU langsung mengurangi iuran. BPK (IHPS II 2025) mencatat pendapatan iuran PPU Rp31,61 T tidak didukung data memadai. Dengan 47 juta peserta PPU Badan Usaha dan kapasitas pemeriksaan terbatas, petugas butuh cara memilih badan usaha yang paling berisiko untuk diperiksa lebih dulu.","Membantu petugas BPJS Kesehatan menyusun prioritas pemeriksaan kepatuhan pemberi kerja berbasis data: (1) memberi skor risiko ke seluruh badan usaha setiap periode; (2) menyertakan alasan yang bisa diverifikasi dan estimasi potensi iuran tak tertagih dalam rupiah; (3) melindungi UMKM dan usaha patuh dari salah tandai; (4) terus belajar dari hasil pemeriksaan petugas.","PayRay memindai data kepesertaan dan upah PPU dengan tiga modul. Scan Upah mendeteksi bunching di UMK, upah beku saat UMK naik, dan upah jauh di bawah sektor sejenis. Scan Headcount membandingkan pekerja terdaftar dengan rencana tenaga kerja di OSS. Scan Status mendeteksi klaster pekerja yang keluar PPU lalu cepat terdaftar PBPU. Mesin menggabungkan 7 aturan transparan dengan Isolation Forest, lalu menghasilkan skor 0–100, tingkat keyakinan, tiga alasan utama, dan estimasi iuran tak tertagih. Petugas menerima antrean prioritas dan lembar hasil scan. Keputusan tetap di petugas, dan hasil pemeriksaan menjadi label baru agar urutan makin tajam. Prototype memakai 100% data sintetis (5.000 badan usaha, pelanggaran disisipkan secara blind, upah dikalibrasi ke data BPS) dan data publik. Stack: Python, FastAPI, PostgreSQL, scikit-learn.","Pada data simulasi yang belum pernah dilihat mesin, 10% skor tertinggi PayRay memuat 68,4% pelanggar (4,6× pemilihan acak) dan menangkap iuran Rp7,7 M/tahun per 100 pemeriksaan (14,6× acak). Salah tandai UMKM patuh hanya 2,7%. Daftar target tersusun dalam hitungan detik, bukan hari. BPJS Kesehatan mendapat pemeriksaan tepat sasaran, pekerja terdaftar sesuai upah sebenarnya, dan pemberi kerja patuh tidak diperiksa tanpa alasan."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2800","tim":"Johannes Kepler","inov":"TEPAT: Pemeriksaan Kepatuhan Tepat Sasaran","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kepatuhan pemberi kerja menentukan kelengkapan pendaftaran pekerja, ketepatan upah, dan penyetoran iuran JKN. Perbedaan data antarlembaga serta keterbatasan jam pemeriksaan menyulitkan penentuan sasaran. TEPAT membantu BPJS Kesehatan mengolah data kepesertaan, pembayaran, dan data pembanding menjadi daftar tindak lanjut berprioritas. Indikasi tetap perlu diverifikasi agar kesalahan administrasi atau kesulitan pembayaran tidak langsung dianggap sebagai pelanggaran.","Meningkatkan ketepatan sasaran pemeriksaan kepatuhan pemberi kerja dengan anggaran jam yang tersedia. TEPAT membantu menemukan pekerja yang belum didaftarkan, ketidaksesuaian upah, keterlambatan iuran, dan mutasi yang perlu diklarifikasi. Setiap kasus dilengkapi alasan serta saran tindak lanjut. Keputusan tetap pada pemeriksa, dengan kesempatan koreksi bagi perusahaan dan perlindungan data pekerja.","TEPAT adalah prototipe pendukung keputusan bagi tim kepatuhan BPJS Kesehatan. Aturan dan regresi logistik menggabungkan sinyal dari kepesertaan, upah, pembayaran, riwayat mutasi, serta data pembanding BPJS Ketenagakerjaan dan OSS yang disimulasikan. Prioritas dihitung dari peluang pelanggaran dan perkiraan nilai ketidaksesuaian per jam pemeriksaan. Kasus memuat alasan, dasar hukum, dokumen yang perlu diminta, serta saran klarifikasi, kunjungan, atau penelaahan pembayaran. Aplikasi menyediakan daftar prioritas, halaman kasus, benchmark, pemantauan keadilan, dan cek kepesertaan pekerja. Modul badan usaha belum terdaftar menghasilkan daftar terpisah, tetapi belum tampil di aplikasi. Seluruh data sintetis; belum ada integrasi atau uji operasional dengan BPJS. Sistem tidak menjatuhkan sanksi atau menolak pelayanan kesehatan.","Dalam pengujian sintetis lima pengacakan dengan anggaran jam setara, TEPAT mencapai presisi 95% dan potensi pemulihan per jam sekitar 2,3 kali pembanding aturan saja. Proporsi perusahaan jujur yang ikut terpilih turun dari 4,0% menjadi 0,4%. Manfaat yang dituju adalah pemeriksaan lebih tepat dan kepesertaan pekerja lebih tertib. Hasil ini bukan pemulihan uang nyata atau proyeksi nasional; manfaat operasional belum diuji."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Juliana","s":null}]},{"id":"2802","tim":"AIforGood","inov":"JKN Reality Graph","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program Jaminan Kesehatan Nasional (JKN) membutuhkan sistem pengawasan yang mampu mendeteksi potensi risiko dalam pelayanan dan pengajuan klaim kesehatan.\n\nSaat ini, data pelayanan tersebar di berbagai sistem, seperti pendaftaran, rekam medis, rujukan, farmasi, dan klaim. Jika diperiksa secara terpisah, hubungan antarperistiwa dan ketidaksesuaian data dapat sulit ditemukan.","Menghubungkan data pelayanan kesehatan dari berbagai sistem.\nMendeteksi indikasi ketidaksesuaian waktu, klaim berulang, dan transaksi yang mencurigakan.\nMenggunakan AI untuk membantu analisis dan menjelaskan temuan berdasarkan bukti.\nMembantu petugas memprioritaskan kasus yang perlu diperiksa.\nMengembangkan prototipe yang dapat diuji menggunakan data sintetis.","JKN Reality Graph adalah platform AI yang menganalisis hubungan antarperistiwa pelayanan kesehatan untuk menemukan potensi risiko yang sulit dideteksi melalui pemeriksaan transaksi secara terpisah.\n\nPlatform ini memiliki empat fitur utama:\nA. Temporal Healthcare Event Graph\nMenghubungkan data pasien, kunjungan, tindakan medis, obat, dan klaim berdasarkan identitas terenkode, waktu, serta hubungan transaksi.\n\nB. Risk Detection\nMendeteksi indikasi klaim berulang, ketidaksesuaian transaksi, benturan waktu, dan layanan yang membutuhkan verifikasi lebih lanjut.\n\nC. AI Investigator\nMenggunakan AI untuk menganalisis temuan, menyusun kronologi, mencari kemungkinan penyebab, dan memberikan penjelasan berdasarkan bukti yang tersedia.\n\nD. Risk Dashboard\nMenampilkan tingkat risiko, kronologi kejadian, hubungan antarperistiwa, bukti pendukung, dan rekomendasi pemeriksaan bagi petugas.","Deteksi dini: menemukan indikasi risiko dari hubungan antarperistiwa.\nEfisiensi pemeriksaan: membantu petugas menentukan prioritas kasus.\nTransparansi: menyediakan bukti dan kronologi yang dapat ditelusuri.\nAkurasi analisis: membantu mengurangi kesalahan deteksi melalui pemeriksaan konteks dan kemungkinan penjelasan lain.\nKualitas data: mengidentifikasi data yang tidak lengkap atau tidak konsisten.\nKeberlanjutan JKN: mendukung pengawasan pembiayaan kesehatan yang lebih efektif."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Yanuar Milad","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2804","tim":"RADAR-BU-BKN","inov":"Radar Resiko Pemberi Kerja untuk Efesiensi Iuran JKN","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Dana JKN tertekan dengan rasio klaim 108,72% dan defisit sekitar Rp2 triliun per bulan. Di sisi pendapatan, sebagian pemberi kerja hanya mendaftarkan sebagian pekerja, melaporkan upah lebih rendah, atau memindahkan pekerja ke segmen mandiri. Di Tulungagung, sekitar 29% badan usaha yang diperiksa belum patuh, sementara kapasitas pemeriksa terbatas. Data dari BPJS Ketenagakerjaan kini tersedia, tetapi pola ketidakpatuhan sulit dikenali secara manual. Karena itu dibutuhkan RADAR-BU.","RADAR-BU bertujuan membantu BPJS Kesehatan menemukan badan usaha yang paling mungkin tidak patuh, menjelaskan alasannya, dan memastikan tindak lanjutnya tercatat. Dengan memadukan data kepesertaan, upah, iuran, dan mutasi, RADAR-BU memprioritaskan pemeriksaan sesuai risiko dan potensi iuran, menekan biaya lewat koreksi mandiri, serta terus belajar dari hasil pemeriksaan. Hasilnya, iuran JKN dipulihkan dan pekerja terlindungi sesuai haknya.","RADAR-BU adalah aplikasi web berbasis analitik data dan kecerdasan buatan yang membantu BPJS Kesehatan menemukan badan usaha yang paling mungkin tidak patuh, menjelaskan alasannya, dan memastikan tindak lanjutnya tercatat. Solusi ini masuk kategori Efisiensi Risiko pada Pemberi Kerja, dengan fokus pada pendaftaran pekerja sebagian, pelaporan upah lebih rendah, dan misklasifikasi status kerja. RADAR-BU memadukan data kepesertaan, upah, iuran, mutasi, dan data BPJS Ketenagakerjaan, lalu menilai setiap badan usaha melalui empat lapis deteksi: aturan pakar, anomali dibanding usaha sejenis, analisis graf, dan model LightGBM. Hasilnya berupa skor risiko 0 sampai 100, alasan yang mudah dibaca, serta perkiraan potensi iuran yang dapat dipulihkan. Petugas kemudian memilih tindakan bertingkat, mulai dari koreksi mandiri hingga pemeriksaan lapangan, dan setiap hasilnya dipakai untuk melatih ulang model. Prototipe sudah berfungsi dengan data sintetis.","RADAR-BU membuat pemeriksaan badan usaha lebih tepat sasaran. Pada uji internal dengan data sintetis, 20 badan usaha teratas seluruhnya tidak patuh, dibanding 5% jika dipilih acak. Pada uji coba, temuan ketidakpatuhan ditargetkan naik dari sekitar 29% menjadi minimal 50%. Iuran yang hilang dapat dipulihkan, biaya pengawasan turun lewat koreksi mandiri, dan persiapan kasus lebih cepat. Pekerja terlindungi sesuai haknya, pemberi kerja patuh bersaing lebih adil, dan keuangan JKN lebih kuat."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2810","tim":"Becusnt","inov":"JEJAK: Jejaring Analisis Klaim JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["BPJS Kesehatan telah menjalankan verifikasi dan pengendalian fraud. Namun, klaim yang tampak wajar saat diperiksa sendiri dapat menunjukkan pola berisiko ketika dikaitkan dengan riwayat pasien dan bukti layanan. JEJAK diusulkan sebagai dukungan tambahan untuk mengenali dugaan layanan fiktif dan penagihan ulang layanan yang sudah dibayar, tanpa menganggap kunjungan berulang sebagai fraud.","Mengembangkan JEJAK untuk membantu pemeriksa BPJS menemukan klaim berisiko lebih awal melalui pengaitan riwayat, pencocokan bukti layanan, dan penentuan prioritas pemeriksaan. Uji coba akan menilai apakah JEJAK meningkatkan temuan yang layak ditindaklanjuti pada kapasitas pemeriksaan yang sama, mempercepat penelaahan, serta menjaga kelancaran klaim yang sah. Keputusan klaim dan penetapan fraud tetap berada pada pihak berwenang.","JEJAK adalah rancangan sistem intelijen klaim berbasis AI yang menghubungkan data klaim, riwayat pasien, dan bukti layanan. Sistem memeriksa kelengkapan data dan aturan klaim, mengaitkan layanan dengan riwayat sebelumnya, lalu mencocokkan bukti seperti rekam medis, log layanan, farmasi, serta konfirmasi peserta terpilih. AI mengenali pola yang tidak biasa dengan mempertimbangkan fasilitas kesehatan pembanding. Hasilnya berupa urutan prioritas pemeriksaan, alasan risiko, dan bukti pendukung. Data yang belum tersedia dibedakan dari bukti yang bertentangan. Hasil pemeriksaan digunakan untuk memperbarui aturan dan model setelah dievaluasi. Prototipe awal telah dijalankan pada 1.200 klaim sintetis. Pengaitan riwayat dan pencocokan bukti masih dalam tahap rancangan dan perlu diuji menggunakan data berizin. Akses data dibatasi sesuai peran, dengan enkripsi dan pencatatan aktivitas.","JEJAK diharapkan membantu BPJS memusatkan pemeriksaan pada klaim berisiko, mempercepat klarifikasi bukti, dan menemukan pembayaran tidak tepat sebelum dibayarkan. Klaim yang sah diharapkan tetap diproses tepat waktu, sementara fasilitas kesehatan menerima permintaan klarifikasi yang lebih terarah. Dampak akan diukur melalui ketepatan prioritas, waktu pemeriksaan, kelancaran klaim sah, dan nilai koreksi pembayaran yang terverifikasi."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2813","tim":"BSMI","inov":"TEFITI (Trusted Employment Facts & Insurance Truth Infrastructure)","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Banyak pekerja dirugikan akibat manipulasi data status kerja oleh perusahaan, seperti mengubah PHK sepihak menjadi pengunduran diri palsu (forced resignation) demi menghindari kewajiban pesangon dan iuran. Tanpa adanya mekanisme verifikasi bersama terjadi posisi yang asimetrik sehingga sering kali pekerja tidak mendapatkan akses ke kesahatan yang mereka bayar dari gaji mereka tiap bulannya.","Membangun platform verifikasi ketenagakerjaan terdesentralisasi yang transparan dan dapat diaudit guna melindungi hak jaminan sosial pekerja.","TEFITI (Trusted Employment Facts & Insurance Truth Infrastructure) adalah platform verifikasi status kerja terdesentralisasi berbasis standar W3C Verifiable Credentials (VC), Decentralized Identifiers (DID), dan on-chain attestation via EAS. Solusi ini menjadi single source of truth tepercaya yang menghubungkan perusahaan, pekerja, dan BPJS Kesehatan secara transparan.\nPekerja memegang kendali penuh untuk menyetujui (confirm) atau menyanggah (dispute) mutasi kerja langsung dari portal. Jika timbul anomali data, Risk Engine otomatis memicu notifikasi risiko agar tim reviewer BPJS dapat menyelesaikan sengketa secara objektif berbasis bukti (human-in-the-loop).","TEFITI memberikan perlindungan nyata bagi hak kesehatan pekerja dengan mencegah penonaktifan kepesertaan sepihak (denial of care) lewat mekanisme konfirmasi dan sanggahan mandiri, sekaligus menyelamatkan keuangan negara dari potensi kebocoran penerimaan iuran (revenue leakage) di BPJS Kesehatan akibat manipulasi status kerja. Dengan integrasi audit otomatis berbasis data kekal (immutable), platform ini memangkas waktu rekonsiliasi verifikasi lebih efisien dan dapat dipercaya."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2821","tim":"Me, Myself & I","inov":"JKN-TRACE","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Fraud yang merugikan","Membantu Auditor BPJS","-","-"],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2822","tim":"Sugar","inov":"MEIS","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Modus fraud klaim JKN berevolusi menjadi manipulasi digital tingkat tinggi (seperti pengeditan angka kuitansi via Photoshop). Perubahan piksel ini mustahil dideteksi mata telanjang. Akibatnya, verifikasi manual pada ratusan ribu klaim per hari memicu kelelahan ekstrem (burnout) pada petugas, memperbesar celah lolosnya klaim fiktif (Inflated Bills), dan mengancam keberlanjutan finansial JKN.","Mengembangkan MEIS (Medical Evidence Integrity System), sebuah Forensic AI Co-Pilot untuk mengotomatisasi skrining dokumen klaim. Tujuannya mendeteksi jejak manipulasi piksel dan duplikasi citra secara real-time. MEIS dirancang menggunakan Explainable AI (XAI) untuk memberi alasan matematis transparan kepada verifikator, bertindak sebagai asisten cerdas (Human-in-the-Loop) yang mempercepat proses tanpa mengambil alih wewenang medis.","MEIS adalah sistem verifikasi berarsitektur Two-Stream AI. Berbeda dengan Deep Learning biasa yang kerap menghapus noise editan, MEIS memadukan Forensic Computer Vision dan Machine Learning. Sistem mengekstrak 76 fitur forensik: Error Level Analysis (deteksi kompresi JPEG), Local Binary Pattern (anomali tekstur kertas/tip-ex digital), dan Canny Edge (patahan garis copy-paste). Algoritma Random Forest mengklasifikasikannya hanya dalam 0.4 detik/dokumen.\nMEIS telah berstatus Minimum Viable Product (MVP) dengan Akurasi 86% dan Presisi Fraud 89%. Dibangun dengan FastAPI dan React, MEIS memiliki \"Triage Dashboard\" yang menyortir antrean berdasarkan skor risiko. Dengan fitur Explainable AI (XAI), skor matematis diterjemahkan ke bahasa awam (misal: \"Terdeteksi pola kompresi tidak wajar\"), memungkinkan verifikator BPJS melakukan validasi akhir (Human-in-the-Loop) secara cepat dan terukur.","Efisiensi Waktu: Memangkas waktu skrining awal dari 2-3 menit (manual) menjadi 0.4 detik per dokumen. Petugas hanya perlu fokus menginspeksi 20% dokumen di antrean \"Risiko Tinggi\".\nFinansial: Mencegah kebocoran dana JKN miliaran rupiah dengan memblokir dokumen klaim yang nominalnya direkayasa (Inflated Bills).\nEkosistem JKN: Membebaskan verifikator dari kelelahan (burnout) dan mempercepat pencairan dana bagi Fasilitas Kesehatan yang jujur dan patuh."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2829","tim":"SantriAbahAli","inov":"JagaMed: Sistem Edge-Cloud AI Deteksi Real-Time Fraud Layanan JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Potensi kebocoran dana JKN akibat fraud mencapai Rp7,5–22,5 triliun per tahun. Audit konvensional saat ini 100% bertumpu pada berkas klaim manual pasca-layanan, di mana 91,3% ketidaksesuaian memicu penggelembungan tarif. Tanpa pemantauan fisik real-time, praktik phantom billing, joki identitas, dan manipulasi obat gagal dicegah sebelum klaim cair. Keterbatasan verifikator menuntut sistem pengawasan otomatis tanpa menambah beban operasional faskes.","Mengembangkan sistem verifikasi visual pasif berbasis Edge-Cloud AI untuk mendeteksi potensi fraud secara real-time di faskes JKN. Solusi ini bertujuan memvalidasi kehadiran fisik pasien (anti-joki), menghitung jumlah penyerahan obat secara otomatis (anti-manipulasi), serta memblokir klaim fiktif (phantom billing) sebelum dana dicairkan, sekaligus mempercepat proses audit melalui mekanisme penyortiran anomali human-in-the-loop.","JagaMed beroperasi dengan prinsip Zero Extra Hardware dan Zero Extra Burden, memanfaatkan stream RTSP kamera CCTV eksisting faskes. Pemrosesan video dilakukan secara lokal menggunakan Edge Server RS untuk mengeksekusi model Face Recognition (pencocokan foto peserta JKN di loket) dan YOLOv8 (penghitungan obat di meja farmasi).\nMenjunjung prinsip Privacy-by-Design sesuai UU PDP No. 27/2022, rekaman video dan wajah tidak pernah diunggah ke internet; Edge Server hanya mengirimkan metadata teks JSON anonim ke cloud JKN untuk dicocokkan otomatis dengan klaim. Jika ditemukan ketidaksesuaian kuantitas obat atau data pasien, web dasbor pengawas BPJS menampilkan alert anomali secara real-time. Sistem dirancang human-in-the-loop, di mana AI hanya memberi label anomali dan keputusan penolakan klaim tetap berada di tangan auditor BPJS guna mengeliminasi machine error.","Finansial: Menyelamatkan dana JKN dengan memblokir pencairan klaim phantom billing dan klaim obat fiktif secara preventif sebelum dana keluar. Operasional: Menghemat waktu kerja verifikator BPJS karena pemeriksaan terfokus pada klaim berlabel anomali visual merah.\nKepatuhan: Menjamin kerahasiaan rekam medis lewat komputasi Edge lokal sesuai UU PDP serta mendorong budaya kepatuhan faskes tanpa mengubah alur pelayanan klinis."],"r":[{"n":"Juliana","s":null},{"n":"Djaka Santosa","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2830","tim":"Good Morning Wake Up","inov":"SIGAP Iuran: Sistem Intelijen Kepatuhan Iuran Pemberi Kerja Berbasis AI","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Biaya manfaat JKN kini melampaui pendapatan iuran sekitar Rp14 triliun dan ditutup suntikan APBN Rp20 triliun. Pemanfaatan AI BPJS Kesehatan selama ini berfokus pada sisi klaim. Di sisi pemasukan, BPK menemukan iuran PPU senilai Rp31,61 triliun tidak didukung data memadai. Pengawasan pemberi kerja masih manual, sementara pekerja aktif masih ditemukan terdaftar sebagai PBI atau peserta mandiri dan upah dilaporkan lebih rendah dari kenyataan.","Membantu BPJS Kesehatan menemukan pemberi kerja yang membayar iuran lebih kecil dari seharusnya secara cepat, adil, dan terukur. Secara khusus, SIGAP Iuran bertujuan menemukan pekerja yang salah status (PBI atau mandiri), menilai risiko pelaporan upah dan jumlah pekerja yang janggal, serta menentukan penanganan paling hemat biaya, sehingga pemasukan JKN meningkat dan subsidi PBI lebih tepat sasaran.","SIGAP Iuran (Sistem Intelijen Kepatuhan Iuran Pemberi Kerja) adalah sistem berbasis AI untuk kantor cabang BPJS Kesehatan yang terdiri atas tiga modul. Modul Status memadankan data kepesertaan, badan usaha, dan BPJS Ketenagakerjaan untuk menemukan peserta PBI atau mandiri yang sebenarnya karyawan aktif. Modul Upah menghitung skor risiko perusahaan dari pola laporan upah dan jumlah pekerja dibanding perusahaan sejenis. Modul Tindak menerjemahkan skor menjadi penanganan bertingkat: surat perbandingan untuk risiko rendah, teguran resmi untuk risiko sedang, dan pemeriksaan lapangan hanya untuk risiko tinggi, meniru praktik kantor pajak Australia (ATO). Setiap skor disertai alasan yang mudah dibaca petugas, dan seluruh keputusan tetap di tangan petugas. Prototipe akan dibangun dengan data sintetis sesuai UU Pelindungan Data Pribadi.","Pemeriksaan lapangan diarahkan ke kasus berpotensi iuran terbesar, sementara sebagian besar perusahaan cukup ditangani melalui surat. Setiap koreksi menambah iuran setiap bulan; sebagai ilustrasi, setiap 1% upah yang tidak dilaporkan setara sekitar Rp1 triliun iuran per tahun. Kuota PBI kembali kepada warga yang membutuhkan, pekerja tidak lagi membayar iuran mandiri, perusahaan patuh bersaing lebih adil, dan JKN bergerak menuju kemandirian keuangan."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2834","tim":"EpiCare+","inov":"EpiCare+_Proposal_Healthkathon2026","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Epilepsi memerlukan pemantauan rutin, namun sekitar 58% pasien rawat jalan di RSUP Prof. Dr. R. D. Kandou Manado belum memiliki kepatuhan obat kategori tinggi. Keterbatasan pencatatan harian di luar rumah sakit menyulitkan evaluasi pemicu kejang dan efektivitas terapi. EpiCare+ dikembangkan sebagai sistem pemantauan digital untuk mendokumentasikan kondisi pasien secara terstruktur dan mendukung tindak lanjut serta efisiensi pelayanan JKN.","EpiCare+ bertujuan mengembangkan aplikasi pemantauan epilepsi bagi pasien, caregiver, dan tenaga kesehatan untuk:\n\n1. Mendukung kepatuhan terapi melalui jadwal, pengingat, dan riwayat minum obat.\n2. Mendokumentasikan kejang, pemicu, pola tidur, dan pemulihan.\n3. Memberi arahan tindak lanjut pasca-kejang (rumah, FKTP, IGD) berbasis aturan sebagai alat bantu.\n4. Menyediakan riwayat untuk evaluasi dokter dan kesinambungan pelayanan, serta berpotensi mengurangi kunjungan darurat yang dapat dicegah.","EpiCare+ merupakan platform pemantauan terapi dan dukungan tindak lanjut bagi pasien epilepsi yang bertujuan membantu meningkatkan kepatuhan pengobatan, mengidentifikasi kondisi yang memerlukan perhatian lebih dini, serta menyediakan informasi kesehatan yang terstruktur bagi pasien, keluarga, dan tenaga kesehatan. Melalui pendekatan Clinical Decision Support System (CDSS), EpiCare+ mendukung pemantauan kondisi pasien secara berkelanjutan dan menyediakan informasi untuk membantu menentukan tindak lanjut yang sesuai dengan kondisi pasien. Dengan demikian, EpiCare+ diharapkan dapat mendukung pengelolaan terapi yang lebih terarah dan berpotensi meningkatkan efisiensi pelayanan kesehatan dalam Program JKN.","Pasien dan caregiver: terapi lebih konsisten, pemicu kejang lebih mudah dikenali, dan ada arahan jelas pasca-kejang.\nDokter: riwayat harian terstruktur mempercepat evaluasi saat kontrol.\nJKN: berpotensi mengurangi kunjungan darurat dan rawat inap yang dapat dicegah. Dampak diukur melalui kepatuhan obat, frekuensi kejang, dan kunjungan IGD terkait kejang; saat ini masih estimasi dan akan diuji pada tahap uji coba."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Aries Kurniwan","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2835","tim":"MELATI BIRU","inov":"Deteksi Sindikat Rujukan Semu dan Klaim Fiktif JKN Berbasis Topologi Jaringan Faskes","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Fraud rujukan JKN tidak terlihat dari satu klaim—ia tersembunyi dalam pola jaringan antar-faskes. Audit manual tak mampu mendeteksi sindikat kolusi lintas FKTP–FKRTL. Anomali statistik DJSN 2021 mencatat disparitas kunjungan RJTL Kelas 1 (6.420/10k peserta) vs Kelas 3 (2.350/10k) yang mengindikasikan manipulasi sistematis. Diperlukan pendekatan topologi relasional.","Mengidentifikasi pola sindikat rujukan semu secara otomatis melalui pemodelan graf jaringan FKTP–FKRTL, menghitung anomalous routing cost berbasis STPL terhadap Minimum Spanning Tree, menghasilkan risk score per faskes beserta estimasi kerugian Rupiah, dan menyajikan bukti audit visual berupa network graph yang dapat dipertanggungjawabkan secara hukum.","Topo-Guard JKN mengubah seluruh ekosistem rujukan JKN menjadi graf terarah yang dapat dilihat, dijelajahi, dan diaudit. Setiap faskes menjadi simpul; setiap rujukan pasien menjadi sisi berbobot. Engine STPL (Sum of Total Path Lengths) menghitung rasio lintasan aktual terhadap Minimum Spanning Tree—rasio di atas 1.80× mengindikasikan kolusi rujukan. Lima lapis analitik berjalan paralel: Rule Engine (20+ aturan bisnis INA-CBGs), Statistical Z-score baseline, STPL Anomaly Engine, Graph Community Detection, dan XAI Layer (narasi auditabel). Dataset baseline dari 9 tabel resmi Statistik JKN 2016–2021 (DJSN). Upload CSV transaksi baru ? model diperbarui instan. Antarmuka web responsif; auditor dapat langsung menelusuri hub abnormal dan mengunduh laporan PDF anomali.","Potensi penyelamatan Rp 1–7,5 triliun/tahun dari sindikat phantom billing. Waktu deteksi turun dari minggu ke < 3 detik. Cakupan meningkat dari sampling 5% ke 100% faskes nasional. Auditor mendapat bukti graf visual yang dapat dibawa ke proses investigasi hukum—sesuatu yang tidak bisa dihasilkan audit konvensional."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Susi Lusiani","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2836","tim":"Array Squad","inov":"Pembuktian Phantom Billing dan Upcoding Kelas Rawat Inap JKN via Digital Twin dan Augmented Reality","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Audit klaim RITL selama ini hanya membandingkan dokumen digital—yang mudah dimanipulasi bersama. Tidak ada yang memverifikasi: apakah bangsal benar-benar berisi pasien sebanyak yang diklaim? Apakah kelas ruangan sesuai dengan yang ditagihkan? Data DJSN 2021: Kelas 1 mencatat hari rawat 1.317/10k vs Kelas 3 hanya 508/10k—gap 2,6× yang terus melebar setiap tahun.","Memvalidasi klaim rawat inap secara spasial melalui model Digital Twin bangsal RS; mendeteksi overcapacity (pasien diklaim > kapasitas TT fisik) dan upcoding kelas (kelas fisik ? kelas diklaim); mendeteksi Prolonged LOS terhadap benchmark distribusi nasional; menyediakan WebAR berbasis browser agar auditor lapangan dapat membuktikan anomali secara visual langsung di bangsal nyata tanpa instalasi apapun.","Twin-Sentinel JKN membangun Digital Twin setiap bangsal RS: profil kelas fisik, kapasitas TT, dan lokasi lantai dikunci dari data akreditasi RS (pihak ketiga—tidak bisa diubah unilateral). Tiga engine validasi berjalan paralel: Overcapacity Engine (Utilisasi = Pasien_Diklaim/Kapasitas_TT; >100% ? Phantom Billing), Upcoding Detector (Kelas_Fisik ? Kelas_Diklaim), dan Prolonged LOS Engine (LOS_Aktual vs P95 distribusi nasional per kelas dan diagnosis dari Tabel 5.26 DJSN). WebAR berbasis A-Frame + AR.js memungkinkan auditor membuka URL di browser tablet, mengarahkan kamera ke bangsal, dan melihat overlay hologram data klaim BPJS melayang di atas ruang fisik—merah = fiktif, kuning = upcoding. Tidak perlu install apapun. AI Chatbot Gemini aktif untuk analisis kontekstual per bangsal.","Mengakhiri perdebatan administratif dengan bukti visual fisik yang tidak bisa dipalsukan—tempat tidur yang terlihat kamera tidak bisa berbohong. Estimasi kerugian phantom billing: Rp 5,25 miliar/bulan dari 10% FKRTL. Satu-satunya solusi Healthkathon yang membawa audit dari layar komputer ke lantai RS secara langsung."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2838","tim":"raket nyamuk","inov":"SmarterShield JKN: deteksi jaringan yang membantu BPJS menahan klaim janggal sebelum dibayar","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Ekosistem Jaminan Kesehatan Nasional (JKN) saat ini menghadapi ancaman serius dari praktik kecurangan (fraud) terorganisir, seperti manipulasi klaim sistematis dan phantom billing melalui modus pengumpulan KTP berkedok bakti sosial yang telah merugikan negara hingga puluhan miliar rupiah di berbagai rumah sakit. Sistem audit konvensional yang ada saat ini mayoritas bersifat manual, berbasis aturan statis, dan dilakukan pasca-klaim, sehingga kerap gagal mendeteksi kolusi kompleks yang melibatkan","Tujuan utama proyek \"SmarterShield JKN\" adalah membangun sistem imun artifisial yang mampu mendeteksi dan memblokir potensi anomali kecurangan—khususnya klaim palsu (phantom billing), manipulasi diagnosis (upcoding), dan klaim berulang (repeat billing)—secara real-time tanpa mengganggu alur pelayanan medis yang sah. Proyek ini juga bertujuan untuk mengimplementasikan tata kelola perlindungan data yang mematuhi Undang-Undang Perlindungan Data Pribadi (UU PDP) secara absolut tanpa memindahkan data","SmarterShield JKN adalah mesin pendeteksi anomali proaktif yang diintegrasikan secara tak kasat mata pada komunikasi Application Programming Interface (API) vClaim dan aplikasi e-Klaim INA-CBG di fasilitas kesehatan. Sistem ini mengubah data transaksi tabular menjadi peta jaringan sosial (graph) berskala besar, lalu menganalisisnya menggunakan algoritma Heterogeneous Temporal Graph Neural Network (HTGNN) untuk mengenali klaster aktivitas kolusi fiktif pada sepersekian detik saat petugas rumah sakit meminta penerbitan Surat Eligibilitas Peserta (SEP). Untuk menjaga kerahasiaan medis, sistem menggunakan arsitektur Federated Learning (FL) di mana AI dilatih secara lokal di server rumah sakit, dan hanya mengirimkan pembaruan parameter matematis yang terenkripsi ke server pusat BPJS Kesehatan.","Implementasi SmarterShield JKN menjanjikan perbaikan fiskal yang terukur dengan menghentikan kebocoran Dana Jaminan Sosial secara drastis sebelum uang negara sempat dibayarkan. Berdasarkan implementasi global, model kecerdasan buatan berbasis graf terbukti mampu mendongkrak ketepatan deteksi hingga 28% dan memangkas angka alarm palsu (false positive) sebesar 40%. Keberhasilan intersep otomatis ini tidak hanya akan menyelamatkan puluhan miliar hingga triliunan rupiah kerugian akibat fraud, tetapi"],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Juliana","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2854","tim":"hackjogja","inov":"SIGAP : AI Agent untuk Deteksi Dini Phantom Billing dan Manipulasi Diagnosis","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Tanpa dukungan sistem analitik yang terintegrasi, anomali klaim berpotensi tidak teridentifikasi secara tepat waktu, sementara sumber daya pemeriksa harus dialokasikan di tengah volume pekerjaan yang terus meningkat. Akibatnya, pengawasan berisiko tertinggal dari kompleksitas transaksi yang seharusnya dikendalikan.\n\nOleh karena itu, penguatan pengawasan Dana JKN perlu diposisikan sebagai kebutuhan strategis yang mendesak, bukan sekadar agenda modernisasi sistem.","1 Mendeteksi indikasi klaim tidak wajar secara dini 2 Meningkatkan efisiensi proses verifikasi klaim.  3 Memperkuat pengambilan keputusan berbasis data 4 Mengurangi risiko pembayaran klaim yang tidak semestinya.","SIGAP JKN dirancang sebagai sistem pendukung keputusan bagi verifikator dan auditor untuk mengidentifikasi, memetakan, serta memprioritaskan klaim berisiko tinggi sebelum atau selama proses verifikasi. Sistem ini tidak menggantikan kewenangan pemeriksa, melainkan membantu mengarahkan perhatian pada transaksi yang membutuhkan pemeriksaan lebih mendalam.\nDengan demikian, keberhasilan SIGAP JKN tidak hanya diukur dari kemampuannya mendeteksi anomali, tetapi juga dari peningkatan efisiensi pemeriksaan, ketepatan identifikasi risiko, dan kontribusinya terhadap pencegahan pembayaran klaim yang tidak semestinya.","1. Mempercepat identifikasi indikasi phantom billing. 2 Meningkatkan ketepatan pemeriksaan indikasi manipulasi diagnosis.  3. Membuat pemeriksaan lebih terarah dan efisien. Mendukung pencegahan pembayaran klaim yang tidak semestinya. Memperkuat transparansi dan akuntabilitas verifikasi."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2861","tim":"TRACE","inov":"TRACE - ClaimCheck JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Sistem klaim JKN saat ini rentan terhadap manipulasi data,  mulai dari phantom billing dan inkonsistensi data pra-submit, hingga ketiadaan bukti fisik pasien dan terbatasnya kapasitas verifikator manual, sehingga BPJS Kesehatan kehilangan visibilitas dan kontrol atas keabsahan klaim yang diajukan","Proposal ini disusun untuk memperkenalkan TRACE–ClaimCheck JKN, solusi deteksi dan validasi klaim berbasis data, sebagai jawaban atas kerentanan sistem klaim JKN terhadap manipulasi seperti phantom billing, billing error, dan prolonged length of stay, sekaligus mengembalikan visibilitas dan kontrol BPJS Kesehatan atas keabsahan setiap klaim yang diajukan","Proposal ini akan menjelaskan latar belakang TRACE - ClaimCheck JKN hadir,  cara kerja (workflow, dashboard, dan AI risk score), aktor ekosistem yang terlibat, roadmap implementasi skala nasional, nilai tambah bagi ekosistem JKN, hingga profil tim pengembang","Reduksi hingga 90% waktu verifikasi klaim, dan memperkecil resiko berbagai rekayasa klaim fiktif dan rekayasa lainnya. Sehingga diharapkan dapat menekan cost allocation untuk klaim, serta peserta BPJS pun dapat mendapat transparansi lebih atas"],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Susi Lusiani","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2869","tim":"Larp larp sahoor","inov":"CLAIMGRAPH-X: Platform Kecerdasan Risiko Klaim Berbasis Graf yang Dapat Dijelaskan untuk Deteksi Din","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["JKN mencakup 282,7 juta jiwa dengan 725,3 juta pemanfaatan layanan pada 2025 (±1,9 juta per hari), sementara rasio klaim mencapai 108,72% pada April 2026. Dalam kondisi ini, ketidakwajaran klaim fasilitas kesehatan seperti klaim fiktif, klaim berulang, upcoding, cloning, dan anomali rujukan menekan keberlanjutan dana. Pola tersebut sulit terlihat karena tersebar pada banyak klaim, entitas, dan periode waktu, sehingga pemeriksaan klaim satu per satu tidak memadai.","Membangun sistem kecerdasan risiko klaim hibrida (rule engine, deteksi anomali, dan analitik graf) untuk lima pola risiko fasilitas kesehatan; menyediakan skor risiko dan peringatan yang dapat dijelaskan beserta bukti dan langkah verifikasi; menyusun antrean investigasi berdasarkan skor, eksposur finansial, kekuatan bukti, dan signifikansi jaringan; serta membangun data sintetis selaras FHIR dengan privasi, jejak audit, dan human-in-the-loop sebagai rancangan inti.","CLAIMGRAPH-X adalah platform kecerdasan risiko klaim yang membantu investigator menentukan klaim dan jaringan mana yang perlu diperiksa lebih dahulu. Sistem menggabungkan tiga lapisan analisis: aturan deterministik (rule engine), deteksi anomali dengan Isolation Forest dan XGBoost, serta analitik graf yang menghubungkan peserta, kunjungan, diagnosis, tindakan, tenaga kesehatan, fasilitas, rujukan, dan klaim. Sinyal digabung menjadi skor risiko yang disertai alasan, bukti, entitas terkait, dan rekomendasi verifikasi, lalu diurutkan dalam antrean investigasi. Sistem menyasar lima pola: phantom billing, repeat billing, upcoding, cloning, dan self-referral/anomali rujukan. Sistem tidak menyatakan kecurangan terbukti; keputusan tetap pada investigator (human-in-the-loop) dan setiap tindakan tercatat dalam jejak audit. Prototipe dibangun dan dievaluasi pada data sintetis selaras HL7 FHIR/SATUSEHAT, tanpa data peserta JKN riil.","Bagi investigator dan BPJS Kesehatan: pemeriksaan beralih dari klaim satu per satu ke antrean prioritas dengan bukti dan hubungan antar-entitas, sehingga pola tersebar atau terkoordinasi terlihat lebih awal. Bagi fasilitas yang patuh: perbandingan kelompok sebaya menekan risiko penandaan keliru. Bagi peserta dan keberlanjutan JKN: dana layanan sah terlindungi dan identitas terjaga. Dampak berupa estimasi dan akan diukur dengan metrik terdefinisi pada evaluasi sintetis serta uji coba terkendali."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Juliana","s":null}]},{"id":"2879","tim":"Nurhayati-ISTN","inov":"KAWAL JKN: Konfirmasi Layanan oleh Peserta untuk Deteksi Manipulasi Obat dan Alkes","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pada 2025 beban klaim JKN mencapai Rp191,33 triliun, melampaui iuran Rp176,72 triliun, sehingga terjadi defisit Rp14,61 triliun. Di saat yang sama, KPK dan Tim PK-JKN menemukan 3 rumah sakit curang dengan kerugian sekitar Rp35 miliar, termasuk 22.550 klaim fiktif dan penambahan jumlah obat dalam klaim. Verifikasi selama ini bertumpu pada dokumen dari faskes, sementara pasien, saksi utama atas apa yang benar-benar ia terima, belum dilibatkan secara sistematis.","KAWAL JKN bertujuan: 1) menjadikan pasien sumber bukti independen atas obat, alkes, dan tindakan yang ditagih; 2) mendeteksi manipulasi obat dan alkes, klaim fiktif, serta tagihan yang digelembungkan atau berulang; 3) membantu verifikator mendahulukan faskes yang polanya menyimpang dari faskes sekelas; 4) memberi peserta transparansi atas tagihan atas namanya; dan 5) menjaga privasi sesuai UU PDP serta keadilan bagi faskes yang jujur.","KAWAL JKN (Klaim Aman, Wajar, Akurat, dan Legal) memberi pasien suara dalam verifikasi klaim. Beberapa hari setelah berobat, peserta terpilih menerima pertanyaan di Mobile JKN, misalnya: \"Anda tercatat menerima amlodipin 30 tablet dan 1 kali EKG. Apakah sesuai?\" Jawabannya cukup satu ketukan: Sesuai, Jumlah berbeda, Tidak menerima, atau Tidak ingat. Peserta tanpa aplikasi dapat membalas lewat WhatsApp resmi tanpa tautan. AI bekerja di tiga titik: Isolation Forest dan sampel acak memilih klaim yang layak ditanyakan; kamus dan templat terkunci mengubah kode medis menjadi bahasa sehari-hari; model Bayesian membaca pola jawaban per faskes dengan memperhitungkan peserta yang lupa. Faskes yang menyimpang dari rekan sekelas tampil di dashboard verifikator. Tidak ada sanksi otomatis, identitas penjawab tidak dibuka ke faskes, dan prototype memakai data sintetis.","Peserta tahu apa yang ditagihkan atas namanya dan ikut menjaga dana JKN. Faskes jujur memperoleh bukti independen atas kepatuhannya. BPJS Kesehatan mendapat sinyal verifikasi baru yang cepat dan murah untuk menemukan obat, alkes, atau layanan yang ditagih tetapi tidak diterima. Keberhasilan diukur dari ketepatan deteksi faskes bermasalah, waktu sampai terdeteksi, tingkat respons peserta, dan nilai tagihan tidak wajar yang tercegah, diuji dulu lewat simulasi."],"r":[{"n":"Yanuar Milad","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2883","tim":"Apakah menang","inov":"Sahril Kamarey","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Menjaga keberlanjutan finansial JKN dari kebocoran dana akibat klaim tidak wajar, di tengah kondisi rasio klaim 2025 yang sudah membengkak hingga 108,27%.\nSecara singkat, ada tiga masalah utama yang melandasinya:\n1. Celah Deteksi Sistem Saat Ini: Pemeriksaan klaim yang berjalan masih berbasis per berkas terpisah, sehingga gagal melihat pola kecurangan lintas berkas seperti phantom billing berjejaring dan cloning narasi medis.\n2. Beban Verifikasi yang Masif: Volume klaim yang sangat besar memicu","Mengembangkan prototipe GraphClaim Sentinel sebagai co-pilot analitik klaim untuk mendeteksi fraud sistemik di faskes (cloning rekam medis, phantom billing, dan upcoding) yang lolos dari pemeriksaan konvensional per berkas. Sistem ini bertujuan melindungi keberlanjutan finansial JKN, menjaga integritas data pelayanan peserta, serta mempercepat proses verifikasi klaim faskes jujur melalui antrean pemeriksaan berbasis skala prioritas risiko tanpa menghilangkan peran verifikator manusia.","GraphClaim Sentinel adalah solusi analitik prediktif berbasis AI yang melengkapi verifikasi klaim BPJS Kesehatan saat ini. Berbeda dengan pendekatan berbasis aturan statis per berkas, inovasi ini menggunakan tiga pilar analitik utama: (1) Graph Engine berbasis HeteroGNN/R-GCN untuk memetakan hubungan lintas berkas dan mendeteksi pola phantom billing berjejaring, (2) EHR Text Scanner memanfaatkan Sentence-BERT untuk mendeteksi klaster kemiripan makna/cloning narasi SOAP antar-pasien, dan (3) Baseline Klinis menggunakan model survival Cox untuk memprediksi lama rawat wajar guna mendeteksi upcoding. Sinyal dari ketiga pilar digabungkan oleh meta-model Gradient Boosting menjadi satu skor risiko terkalibrasi (0-100). Inovasi ini mengusung pendekatan Human-in-the-Loop, di mana AI berfungsi sebagai asisten yang menyajikan antrean prioritas lengkap dengan kartu bukti penjelasan (XAI SHAP), sedangkan keputusan akhir tetap sepenuhnya berada di tangan verifikator manusia tanpa adanya penolakan ot","Inovasi ini ditargetkan menurunkan angka false positive hingga 40% dan mempercepat waktu telaah verifikator sebesar 60% melalui otomatisasi antrean prioritas berbasis risiko. Secara finansial, setiap 0,1% kebocoran dana klaim tidak wajar yang berhasil dicegah setara dengan melindungi dana jaminan JKN sebesar ~Rp191 miliar (berdasarkan biaya pelayanan 2025). Dampak sosialnya adalah terjaganya integritas data rekam medis peserta JKN serta terwujudnya jalur cepat (reguler) bagi faskes yang jujur."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Juliana","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2885","tim":"HIDUP BPJS","inov":"JAGA KURSI: Deteksi Misklasifikasi Pekerja Badan Usaha yang Tercatat PBI","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Survei Kesehatan Indonesia 2023 mengindikasikan 35% penerima bantuan iuran JKN seharusnya masuk segmen Pekerja Penerima Upah. Pekerja badan usaha yang masih tercatat PBI membuat negara menanggung iuran yang wajib dibayar perusahaan, sementara kuota PBI terbatas. Saringan saat ini berbasis tingkat kemiskinan dan hanya mencoret pekerja bergaji setara UMR ke atas, sehingga pekerja bergaji rendah lolos dan pemeriksaan kepatuhan masih manual.","Menemukan badan usaha yang pekerjanya masih tercatat PBI melalui pencocokan data ketenagakerjaan dan skor risiko berbasis AI, lalu mendorong perusahaan mengambil alih iuran secara bertahap sesuai PP 86/2013. Status jaminan pekerja dijaga agar tidak pernah putus, iuran dipantau 3-6 bulan setelah pindah segmen, dan kursi PBI yang kosong direkomendasikan kembali ke Kemensos dan Pemda untuk warga miskin yang berhak.","JAGA KURSI adalah sistem untuk petugas pengawasan BPJS Kesehatan yang menemukan badan usaha dengan pekerja masih tercatat PBI. Komponen 1, Dashboard Petugas: mencocokkan NIK peserta PBI dengan data WLKP Kemnaker, kepesertaan BPJS Ketenagakerjaan berapa pun upahnya, dan pola mutasi kepesertaan. AI menyatukan identitas perusahaan yang ejaannya berbeda antarlembaga, lalu memeringkat perusahaan berdasarkan skor risiko dan tingkat keyakinan. Petugas memverifikasi bukti, kemudian sistem mengirim surat imbauan dan menyiapkan teguran bertahap sesuai PP 86/2013. Komponen 2, Penjaga Iuran (WhatsApp dan Mobile JKN): pekerja mendapat kabar perubahan status, peringatan saat perusahaan menunggak iuran, serta kanal laporan anonim. Status PBI baru dilepas setelah iuran pertama perusahaan terbayar. Prototype dibangun dengan data sintetis tanpa data medis.","Nilai utama JAGA KURSI adalah kepatuhan pemberi kerja dan ketepatan subsidi, bukan penghematan APBN. Target dampak: nol pekerja kehilangan jaminan selama proses perpindahan; perusahaan yang disurati memindahkan pekerjanya ke segmen pekerja penerima upah (acuan Spanyol, sekitar 15% patuh setelah surat); iuran terbayar minimal 3 bulan berturut-turut; dan kursi PBI kembali untuk warga miskin. Untuk segmen PBPU Pemda, setiap keluarga 4 orang yang pindah menghemat APBD sekitar Rp2 juta per tahun."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Yanuar Milad","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2889","tim":"NAGA CIPUTAT","inov":"TELISIK","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Verifikator BPJS memeriksa ~200 berkas/hari dengan waktu 2–3 menit per klaim (berisi ~36 halaman teks medis). Akibatnya, verifikasi hanya menyentuh kelengkapan administratif. Padahal, kebocoran dana JKN (upcoding, inflated bills alkes, dan duplikasi rekam medis) tersembunyi di narasi klinis. Sistem analitik eksisting berbasis tabular memberi skor risiko tanpa menunjuk bukti teks, sehingga ketidaksesuaian baru terungkap pasca-bayar saat audit, ketika dana triliunan rupiah telah dibayarkan.","- Mendeteksi anomali klaim (upcoding, unbundling, inflated bills alkes, note cloning) secara pra-bayar sebelum dana JKN keluar.\n- Menghasilkan Evidence Dossier berbasis bukti verbatim 100% yang dapat ditelusuri langsung ke dokumen asli tanpa halusinasi AI.\n- Mengubah antrean acak menjadi antrean prioritas berbasis risiko klinis dan potensi rupiah.\n- Memangkas waktu telaah verifikator hingga 60% serta menerbitkan draf klarifikasi resmi dengan prinsip human-in-the-loop.","TELISIK adalah asisten investigator bukti klinis berbasis Agentic AI untuk verifikasi klaim RS pra-bayar. Sistem bekerja lewat 3 tahap: (1) Saring Cepat deterministik aturan INA-CBG, (2) Agen Penyelidik multi-alat yang menguji kriteria PNPK, mencocokkan alkes kuitansi vs laporan operasi, dan mendeteksi kloning SOAP, serta (3) Verifikasi Verbatim string 100% anti-halusinasi. Verifikator menelaah via antarmuka Dual-Pane: satu klik pada temuan langsung menyorot bukti asli di dokumen rekam medis.","- Finansial: Menjaga ketahanan dana DJS Kesehatan pra-bayar; setiap 0,1% klaim FKRTL yang terkoreksi setara penghematan ±Rp140 Miliar.\n- Operasional: Memangkas waktu telaah verifikator hingga 60%, menggeser kerja acak menjadi fokus kasus berisiko tinggi dengan argumentasi berbasis pasal.\n- Akuntabilitas & Kemitraan: Menghilangkan sengketa subjektif dengan RS melalui bukti kutipan transparan, melindungi faskes jujur, serta mematuhi UU PDP No. 27/2022 tanpa retensi data riil."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Juliana","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2890","tim":"Trifid","inov":"Caliper: Ukur Kewajaran Klaim, Prioritaskan Audit JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Dalam 10 bulan (Jan–Okt 2025), BPJS Kesehatan menemukan fraud klaim senilai Rp 6,8 triliun. Modusnya terus berganti: dari phantom billing (2023) ke manipulasi prosedur ventilator (59% pada 2025). Sementara itu ±650 ribu berkas klaim masuk setiap hari, jauh melampaui kapasitas pemeriksaan manual. Tantangannya bukan memeriksa lebih banyak klaim, melainkan memeriksa klaim yang tepat lebih dulu, dengan alasan yang jelas dan adil bagi faskes yang patuh.","- Membantu verifikator BPJS menentukan faskes dan klaim yang diperiksa lebih dulu, sesuai kapasitas audit.\n- Menilai kewajaran tiap klaim dibanding klaim sejenis, dan menjelaskan alasan setiap penandaan.\n- Melindungi faskes yang patuh: sistem boleh menjawab 'belum cukup yakin' bila data kurang, tanpa penolakan klaim otomatis.\n- Membuktikan metode pada data open, lalu menguji dengan data berizin resmi BPJS pada tahap lanjutan.","Caliper ibarat jangka sorong untuk klaim JKN: mengukur apakah sebuah klaim masih wajar, lalu menunjukkan mana yang perlu diperiksa dulu. Fokusnya upcoding (kode dinaikkan) dan unbundling (paket dipecah), dengan sinyal pendukung klaim ganda dan klaim salinan.\n\nCara kerja:\n1. Nilai faskes: skor risiko dari pola klaim dan hubungan dokter, pasien, serta kode diagnosis.\n2. Cek kewajaran: klaim dibandingkan dengan klaim sejenis (diagnosis, usia, penyakit penyerta); yang jauh di atas batas wajar ditandai.\n3. Susun daftar periksa: urutan kasus sesuai kapasitas verifikator, lengkap dengan alasan dan pembanding.\n\nPembeda: setiap penandaan bisa dijelaskan, batas wajar berbeda per kasus, dan skor berani menjawab 'belum cukup yakin' agar faskes kecil dan daerah tidak mudah salah tandai. Keputusan akhir tetap di verifikator.\n\nTahap awal memakai data open, bukan data peserta JKN riil. Status: rancangan matang, prototype dibangun setelah lolos.","Dampak yang bisa didapatkan: \n- audit lebih tepat sasaran, diukur dari jumlah kasus berisiko yang tertangkap di 5–10% teratas daftar\n- verifikator lebih efisien, diukur dari nilai klaim tertangani per jam\n- faskes patuh lebih jarang diaudit acak, dengan kinerja adil bagi faskes kecil maupun besar\n- dana JKN lebih terjaga. \n\nSeluruh angka masih estimasi dan akan diuji pada data open sebelum uji coba dengan data resmi; belum ada klaim penghematan rupiah."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Djaka Santosa","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2893","tim":"true Pointer","inov":"Sadar-JKN","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Ekosistem JKN kerap terhambat oknum badan usaha yang menghindari kewajiban demi efisiensi cash flow. Pelanggaran utamanya: Pendaftaran Pekerja Sebagian (PDUK) untuk hindari iuran 4%, dan penggelapan/penundaan setoran 1% yang dipotong dari gaji pekerja. Tanpa penanganan sistemik, BPJS terus mengalami kebocoran finansial ganda (hilangnya peserta & dana tertahan), dan pekerja berisiko mendadak kehilangan akses layanan kesehatannya.","Membangun prototipe sistem analitik (SADAR-JKN) berbasis web yang mampu mendeteksi indikasi PDUK dan penggelapan iuran secara otomatis. Sistem ini akan mengotomatisasi klasifikasi risiko badan usaha menjadi tingkat Tinggi, Sedang, dan Rendah. Hal ini bertujuan untuk mempercepat waktu respons, efisiensi, dan akurasi tim kepatuhan (auditor) BPJS Kesehatan saat menindaklanjuti perusahaan bermasalah secara tepat sasaran.","SADAR-JKN (Sistem Analitik Deteksi Anomali & Risiko JKN) adalah dashboard analitik hibrida yang bekerja secara prediktif untuk memitigasi pelanggaran badan usaha. Inovasi ini menggunakan dua mesin utama:\n?Pertama, Machine Learning (AI) yang memprofilkan probabilitas anomali jumlah karyawan (mendeteksi PDUK) dengan membandingkan data pelaporan perusahaan terhadap tren rasio pekerja di skala industri sejenis. \nKedua, Rule-Based System (logika IF-THEN) yang melacak anomali jeda waktu antara pemotongan upah (payroll) dengan tanggal setoran ke kas BPJS (mendeteksi penggelapan dana).\n?Seluruh hasil analisis mesin ini divisualisasikan dalam dashboard terpusat yang interaktif. Auditor BPJS akan menerima peringatan dini berupa indikator warna risiko (Merah/Kuning/Hijau) secara real-time, memungkinkan mereka melakukan tindakan preventif sebelum kebocoran dana membesar.","Bagi BPJS Kesehatan, sistem ini menyelamatkan potensi kebocoran dana JKN dan meningkatkan efisiensi audit kepatuhan drastis tanpa inspeksi acak. \n\nBagi pekerja, hak jaminan kesehatan lebih terlindungi sehingga kartu tidak mendadak non-aktif akibat kelalaian HRD perusahaan. \n\nBagi badan usaha, pengawasan prediktif ini akan memaksa dan mendorong terbentuknya budaya kepatuhan administratif serta transparansi data yang sistemik"],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Yanuar Milad","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2894","tim":"AegisMed","inov":"AegisMed: Unified Healthcare Traceability & Sovereign Activity Ledger","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Inefisiensi dan kebocoran klaim farmasi JKN diperkirakan merugikan DJS hingga Rp1,4 Triliun per tahun akibat silo data antar-faskes dan apotek. Celah ini memicu kejahatan ganda: phantom billing, repeat billing via fotokopi resep, hingga pemotongan obat fisik untuk dijual ke pasar gelap dengan marjin 400%–800% serta praktik doctor shopping sindikat OOT. Audit manual pasca-klaim (14–30 hari) terbukti reaktif dan terlambat mencegah pembobolan dana jaminan sosial.","1. Menghentikan 100% kebocoran obat subsidi dan OOT ke pasar gelap via buku besar konsorsium yang kebal manipulasi.\n2. Menyatukan 5 siklus layanan JKN (SEP, rujukan, resep, dispensing, klaim) dalam verifikasi pra-klaim instan (<3 detik).\n3. Mencegah repeat billing dan resep fiktif secara deterministik lewat atomic burn dan state-splitting.\n4. Menjamin kerahasiaan data medis (Zero-PII) 100% patuh UU PDP No. 27/2022 menggunakan zk-SNARK.","AegisMed adalah infrastruktur Consortium Blockchain (Hyperledger Besu/QBFT) berizin tanpa gas fee yang mengintegrasikan 5 siklus layanan JKN: SEP, rujukan, resep, dispensing, dan settlement ke dalam smart contract terpadu. Mengusung konsep Hybrid Zero-Burden, pasien (termasuk lansia) tetap menerima lembar resep fisik ber-Secure QR tanpa perlu ponsel pintar atau dompet kripto. Keamanannya dilindungi enkripsi Zero-Knowledge Proofs (zk-SNARK Groth16) dan Poseidon Hash berstandar militer sehingga 100% bebas data pribadi di blockchain (Zero-PII) sesuai UU PDP. Saat obat diserahkan di apotek, sistem melakukan verifikasi instan (<3 detik) dan membakar token unik (atomic burn). Jika obat diserahkan sebagian, protokol State-Splitting menerbitkan token sisa yang sah agar klaim tidak dimanipulasi. Seluruh klaim divalidasi lewat Triple-Match Pre-Settlement otomatis sebelum pencairan dana, didukung AI Graf CakraSentinel untuk mendeteksi sindikat doctor shopping.","1. Efisiensi Finansial: Menghemat potensi kebocoran dana DJS sebesar Rp94,8 Miliar/tahun pada jejaring percontohan (potensi nasional >Rp1,4 Triliun/tahun).\n2. Mitigasi Fraud Mutlak: 100% menggagalkan klaim resep fotokopi/berulang dan manipulasi kuantitas obat fisik secara deterministik.\n3. Transformasi Audit: Mengubah verifikasi reaktif (14–30 hari) menjadi pencegahan instan pra-klaim (<3 detik).\n4. Dampak Sosial: Menutup pasokan obat subsidi ke pasar gelap dan menjamin hak mutu obat pasien."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Yanuar Milad","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2897","tim":"MediTech","inov":"Proposal Healthkathon 2026 Tim MediTech - Claimguard","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Banyak klaim rawat jalan BPJS mengalami pending dan bahkan hangus total akibat kunjungan berulang tanpa indikasi medis yang jelas, yang baru terdeteksi secara manual berminggu-minggu setelah pelayanan.","Mencegah klaim pending dan berkas hangus sejak dini melalui sistem peringatan awal berbasis AI agar arus kas rumah sakit lebih lancar.","Early Warning System berbasis hybrid (mesin aturan + AI Gemini) yang terintegrasi dengan SIMRS untuk mendeteksi risiko ketidaksesuaian klaim sebelum berkas diajukan ke BPJS.","Mempercepat arus kas rumah sakit, mengurangi beban verifikasi BPJS Kesehatan, dan memastikan jadwal kontrol peserta JKN sesuai indikasi medis."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2899","tim":"BluesandAI","inov":"BluesandAI: Platform AI Terintegrasi untuk Deteksi dan Investigasi Fraud Klaim JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Besarnya volume klaim JKN dan beragamnya sumber data membuat deteksi kecurangan menjadi tantangan. Pemeriksaan manual memiliki keterbatasan dalam menemukan pola klaim tidak wajar, seperti upcoding, klaim berulang, dan ketidaksesuaian tindakan medis. Dibutuhkan solusi berbasis AI yang mampu mengintegrasikan data, mengidentifikasi anomali, dan membantu auditor melakukan investigasi secara transparan.","Mengembangkan platform AI terintegrasi untuk membantu mendeteksi indikasi fraud klaim JKN, khususnya manipulasi diagnosis dan tindakan medis. Platform ini bertujuan meningkatkan akurasi pemeriksaan, mempercepat proses audit, memberikan penjelasan atas temuan anomali, serta mendukung pengambilan keputusan auditor berdasarkan data yang dapat ditelusuri.","BluesandAI merupakan platform audit berbasis AI yang mengintegrasikan data klaim, pasien, diagnosis, tindakan medis, dokter, dan fasilitas kesehatan. Data diproses melalui pipeline untuk pembersihan, standardisasi, dan integrasi sebelum dianalisis menggunakan Unsupervised Anomaly Detection guna menemukan pola klaim yang tidak wajar.\n\nSetiap indikasi anomali dilengkapi skor risiko dan penjelasan faktor penyebab menggunakan metode Explainable AI (SHAP). Knowledge Graph membantu menghubungkan informasi antarentitas untuk menelusuri pola yang mencurigakan. Hasil analisis disajikan dalam ruang kerja audit yang mendukung prioritas kasus, penelusuran data, dan dokumentasi investigasi. AI berfungsi sebagai alat bantu, sedangkan keputusan akhir tetap berada pada auditor.","BluesandAI diharapkan membantu auditor menemukan indikasi kecurangan lebih cepat, mengurangi ketergantungan pada pemeriksaan manual, dan meningkatkan efisiensi audit klaim JKN. Penjelasan hasil analisis dan penelusuran asal-usul data mendukung proses investigasi yang lebih transparan dan akuntabel. Solusi ini juga berpotensi membantu menekan pembayaran klaim yang tidak semestinya serta memperkuat pengawasan penggunaan dana JKN."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2901","tim":"Go go Power Rangers","inov":"Radar Iuran","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Iuran JKN pekerja formal (5% upah) dihitung dari jumlah pekerja dan upah yang dilaporkan pemberi kerja. Jika dilaporkan lebih kecil, iuran ikut kecil. Audit 2019 menemukan 2.348 badan usaha melaporkan upah tidak sesuai dan 528.120 pekerja belum didaftarkan. Dengan 46,8 juta peserta PPU swasta dan pemeriksa terbatas, sulit menentukan badan usaha yang diperiksa lebih dulu. Radar Iuran mengisi celah itu dengan antrean prioritas, tanpa mengganti proses BPJS yang ada.","Membantu BPJS Kesehatan memeriksa pemberi kerja lebih terarah agar potensi iuran yang hilang dapat dipulihkan efisien. Secara khusus: (1) menyusun skor kepatuhan 0-100 dan antrean Merah/Kuning/Hijau, (2) menghitung estimasi potensi iuran dalam rupiah, (3) mendeteksi pendaftaran pekerja sebagian, upah lebih rendah, dan manipulasi mutasi, (4) memberi alasan yang bisa dijelaskan, (5) menghemat waktu pemeriksa dengan keputusan tetap pada manusia.","Radar Iuran adalah papan pemantau (dashboard) yang mengubah data BPJS yang sudah ada (kepesertaan, upah, iuran, mutasi) menjadi daftar prioritas pemeriksaan pemberi kerja beserta estimasi potensi iuran dalam rupiah. Setiap perusahaan dibandingkan dengan perusahaan sejenis (sektor, skala, wilayah), diberi skor kepatuhan 0-100, lalu masuk antrean Merah/Kuning/Hijau lengkap dengan alasannya. Fokusnya: pendaftaran pekerja sebagian, upah dilaporkan lebih rendah, dan manipulasi data mutasi. Teknologi tiga lapis: (1) aturan dan statistik yang cepat dan mudah diperiksa, (2) AI pencari pola yang berbeda dari kebiasaan disertai penjelasan, (3) asisten AI peringkas kasus pada tahap lanjut. Hasil pemeriksaan kembali ke sistem sebagai umpan balik. Keputusan tetap pada petugas, tanpa sanksi otomatis. Data aman: identitas disamarkan, akses sesuai peran, data tetap di BPJS. Tahap saat ini adalah ide matang; pengujian awal memakai data simulasi, lalu uji coba atas izin BPJS.","Dampak dinyatakan dalam rupiah dan dapat diuji. Contoh hipotetis (bukan data riil): perusahaan mendaftarkan 200 dari 250 pekerja dan melaporkan upah Rp4 juta dari semestinya Rp6 juta, berpotensi kehilangan iuran Rp35 juta/bulan (Rp420 juta/tahun). Manfaat: pemeriksaan lebih tepat sasaran, iuran lebih terpulihkan, waktu pemeriksa hemat, kepesertaan terjaga, dan pemberi kerja patuh diperlakukan lebih adil. Diuji terhadap pemilihan acak."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Juliana","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2905","tim":"Axa","inov":"Assitant Medixa - Dokumentasi klinis yang dapat dibuktikan sejak ruang konsultasi","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Tujuan umum: menekan risiko fraud klaim JKN di fasilitas kesehatan melalui dokumentasi klinis yang dapat dibuktikan, dengan data tetap berada di server rumah sakit.","Tujuan umum: menekan risiko fraud klaim JKN di fasilitas kesehatan melalui dokumentasi klinis yang dapat dibuktikan, dengan data tetap berada di server rumah sakit.\nTujuan khusus: Memberi setiap diagnosis dan tindakan yang diklaim jejak bukti klinis yang bertaut ke percakapan konsultasi dan memberikan dukungan keputusan atau rekomendasi dalam menentukan kodifikasi diagnosis dan tindakan","AssistanMedixa adalah AI Medical Assistant berbasis web yang berjalan sepenuhnya di server rumah sakit (on-premise). Dokter merekam atau mengunggah percakapan konsultasi, lalu sistem mentranskripsikannya dalam Bahasa Indonesia dan menyusun resume medis dalam format S/O/A/P yang bertaut ke transkrip. Dokter meninjau dan mengoreksi hasilnya, lalu dapat menanyakan rekomendasi tindakan dan obat sebagai dukungan keputusan klinis. Modul Claim Integrity Check kemudian memeriksa kesesuaian diagnosis, tindakan, dan obat dengan bukti klinis sebelum klaim diajukan.","- Pada Dokumentasi, jika sebelumnya ditulis manual setelah konsultasi selesai, maka setelahnya draft S/O/A/P otomatis, tinggal dilakukan peninjauan oleh dokter.\n- Bukti klinis, jika sebelumnya tidak selalu konsisten,  maka setelahnya dilengkapi resume bertaut ke transkrip yand ditulis verbatim dan kronologis serta bisa diaudit\n- Deteksi masalah saat verifikasi atau audit klaim bisa langsung dilakukan pra-klaim, dengan bukti catatan resume transkripsi."],"r":[{"n":"Juliana","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2906","tim":"kanonik","inov":"Prediksi Kohort Penunggak Iuran dan Adverse Selection Peserta Mandiri JKN Berbasis K-Means","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Defisit JKN bukan hanya dari klaim yang dipalsukan — tapi dari iuran yang sistematis tidak pernah dibayar. Peserta PBPU mendaftar dan membayar hanya saat sakit kritis, klaim besar, lalu menghilang. Data DJSN 2021: 30,9 juta peserta PBPU dengan iuran Rp 31.298/bulan; penurunan tajam 4,1 juta jiwa BP di 2020 adalah bukti statistik adverse selection massal yang tercatat resmi namun belum ada sistem untuk menangkupnya.","Mengklasterisasi perilaku 30,9 juta peserta PBPU menggunakan K-Means (k=3) berdasarkan rasio penunggakan dan total klaim; mengidentifikasi klaster adverse selection (klaim tinggi + rasio nunggak tinggi); mengestimasi kerugian Dana Jaminan Sosial per peserta secara otomatis; menghasilkan daftar target intervensi penagihan terurut prioritas; dan menyediakan AI Chatbot Gemini untuk laporan kohort dalam bahasa Indonesia natural tanpa query teknis.","Mandiri-Shield JKN membangun profil perilaku aktuaria setiap peserta PBPU dari dua variabel: Rasio_Nunggak = Bulan_Nunggak / (Bulan_Aktif + Bulan_Nunggak) dan Total_Klaim_Normalized. K-Means k=3 memisahkan tiga klaster: Merah (adverse selection), Kuning (waspada), Hijau (patuh). Kerugian DJS dihitung per peserta: max(0, Total_Klaim - Bulan_Aktif × Rp31.298). Break-even PBPU-005: 1.438 bulan = 120 tahun — kemustahilan aktuaria yang terkonfirmasi matematis. Scatter plot D3.js interaktif menampilkan zona merah kanan atas secara langsung terbaca. Output: daftar intervensi terurut prioritas kerugian terbesar. AI Chatbot Gemini menjawab pertanyaan per peserta spesifik dalam bahasa Indonesia. Upload CSV baru ? model diperbarui instan.","Satu-satunya solusi di Healthkathon yang melindungi JKN dari sisi penerimaan iuran. Potensi Rp 3,09 triliun/tahun diselamatkan (1% adverse selector × Rp 10 juta). Efisiensi penagihan meningkat 10× — hanya Klaster Merah yang menjadi prioritas, bukan 30,9 juta peserta semua. Biaya operasional penagihan turun 85%."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2907","tim":"Ambathon","inov":"Clarivia","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pengajuan klaim kesehatan dalam jumlah besar menghadirkan tantangan dalam mengidentifikasi pola yang tidak wajar secara cepat dan konsisten. Pemeriksaan manual dan aturan statis berpotensi kesulitan mengenali kombinasi penyimpangan yang kompleks, baik pada tingkat klaim maupun perilaku historis fasilitas kesehatan. Oleh karena itu, diperlukan pendekatan berbasis data untuk membantu memprioritaskan klaim yang perlu ditinjau lebih lanjut.","Tujuan CLARIVIA adalah mengembangkan sistem peringatan dini berbasis machine learning dan analisis statistik untuk mengidentifikasi pola anomali pada klaim kesehatan. Sistem ini bertujuan menghasilkan skor anomali, membandingkan pola klaim antarpenyedia layanan, mendeteksi perubahan tren, serta menyajikan indikator yang menjelaskan temuan. Dengan informasi tersebut, petugas dapat memprioritaskan klaim yang memerlukan pemeriksaan lebih lanjut secara efisien dan terarah.","CLARIVIA Healthcare Claims Anomaly Early Warning System adalah solusi berbasis machine learning dan analisis statistik untuk membantu mengidentifikasi pola tidak wajar pada klaim kesehatan. Sistem ini dirancang untuk menghasilkan skor anomali, membandingkan pola klaim antarpenyedia layanan, memantau perubahan tren, serta menampilkan indikator yang mendukung interpretasi hasil. Informasi disajikan melalui dashboard interaktif agar petugas dapat memprioritaskan klaim yang perlu ditinjau lebih lanjut. CLARIVIA berfungsi sebagai alat bantu pengawasan dan pengambilan keputusan berbasis data, bukan sebagai penentu otomatis kecurangan.","CLARIVIA berpotensi meningkatkan efisiensi pengawasan klaim kesehatan melalui identifikasi pSola anomali dan penentuan prioritas pemeriksaan berbasis data. Sistem ini dapat membantu petugas mengurangi ketergantungan pada penyaringan manual, mengenali perubahan pola klaim lebih awal, serta memusatkan sumber daya pada temuan yang memerlukan perhatian. Penyajian skor anomali, tren, dan indikator pendukung juga diharapkan meningkatkan transparansi proses peninjauan dan konsistensi evaluasi."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Djaka Santosa","s":null},{"n":"Juliana","s":null}]},{"id":"2908","tim":"ISTN Audit Trail JKN","inov":"Otomatisasi Rekonstruksi Episode Medis Terpecah","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim JKN yang diperiksa secara terpisah berisiko menyembunyikan pola pemecahan layanan medis (services unbundling), yakni rangkaian kunjungan atau tindakan yang perlu ditinjau sebagai satu episode perawatan. Pemeriksaan manual terhadap riwayat kunjungan membutuhkan waktu dan menyulitkan identifikasi pola berulang. Diperlukan audit berbasis data yang menghubungkan waktu kunjungan, diagnosis, tindakan, dan nilai klaim untuk menandai anomali secara dini tanpa langsung menyimpulkan kecurangan.","Mengembangkan Audit-Trail JKN untuk mendeteksi indikasi pemecahan episode pelayanan medis secara otomatis melalui analisis frekuensi dan jarak waktu kunjungan, pola tagihan, serta rekonstruksi episode. Solusi ini bertujuan membantu auditor BPJS Kesehatan memprioritaskan klaim berisiko, menelusuri dasar peringatan secara transparan, dan melakukan verifikasi klinis sebelum menetapkan tindak lanjut, sehingga pengawasan klaim lebih efisien, akuntabel, dan adil bagi fasilitas kesehatan.","Audit-Trail JKN adalah prototipe aplikasi web untuk mengidentifikasi indikasi services unbundling dengan mengadaptasi konsep pemantauan pola transaksi anti-money laundering (AML) ke analisis klaim JKN. Data kunjungan diunggah melalui CSV berisi ID pasien tersamarkan, fasilitas kesehatan, tanggal, diagnosis, tindakan, dan nilai tagihan. Velocity Detector menghitung frekuensi kunjungan dalam jendela waktu; Structuring Check menandai pola tagihan di bawah ambang yang ditetapkan; dan Re-bundling Engine mengelompokkan kunjungan terkait untuk ditinjau sebagai satu episode medis. Parameter awal simulasi mencakup minimal tiga kunjungan dalam 10 hari dan ambang Rp300.000, yang perlu dikalibrasi menurut skema pembayaran dan konteks klinis. Hasil disajikan melalui dashboard, timeline, peringatan, serta ringkasan audit dengan dukungan chatbot AI. Uji awa
