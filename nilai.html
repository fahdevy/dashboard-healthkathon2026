nan peserta.\n\nFitur utama LARIK-JKN meliputi:\n1.\tMulti-Typology FWA Engine: Deteksi otomatis anomali upcoding keparahan, unbundling prosedur, klaim fiktif, serta churning readmisi.\n2.\tPeer Benchmarking: Analisis komparasi tarif dan length of stay (LOS) faskes sekelas berbasis deviasi z-score.\n3.\tNetwork Graph: Pemetaan visual konsentrasi rujukan antar-faskes dan tenaga medis guna mendeteksi anomali jejaring.\n4.\tSmart Risk Sampling: Penarikan sampel audit terarah berbasis stratifikasi skor risiko.\n5.\tKertas Kerja Investigasi (KKI): Digitalisasi audit trail, telaah bukti forensik, serta rekomendasi kepatuhan.","Implementasi LARIK-JKN memberikan dampak nyata bagi ekosistem kesehatan:\n1.\tPenyelamatan Dana JKN: Menutup celah kebocoran anggaran akibat fraud, upcoding, dan klaim fiktif.\n2.\tEfisiensi Audit: Mempercepat proses telaah dan investigasi klaim faskes hingga 60% melalui smart risk sampling.\n3.\tTransparansi Faskes: Mewujudkan tata kelola rujukan dan klaim yang adil berbasis peer benchmarking.\n4.\tPerlindungan Pasien: Memastikan mutu layanan medis dan hak peserta JKN terlindungi dari risiko moral haza"],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2098","tim":"KITA AKAN LAWAN!","inov":"CLAIMORA: AI Investigation Agent for JKN Claim Integrity","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Besarnya volume klaim JKN membuat proses verifikasi semakin menantang, terutama dalam mendeteksi potensi kecurangan. Pemeriksaan data secara terpisah dapat melewatkan ketidaksesuaian antara diagnosis, hasil laboratorium, tindakan medis, dan obat. CLAIMORA hadir untuk membantu mendeteksi anomali tersebut menggunakan AI dan analisis keterkaitan data klinis.","CLAIMORA bertujuan membantu verifikator BPJS mendeteksi potensi anomali klaim JKN, menentukan tingkat risiko klaim, dan memprioritaskan klaim yang perlu diperiksa lebih lanjut agar proses verifikasi lebih terarah dan efisien.","CLAIMORA adalah sistem pendukung investigasi klaim JKN berbasis AI yang menganalisis hubungan antara diagnosis, hasil laboratorium, tindakan medis, dan obat. Sistem menghasilkan skor risiko 0–100 serta visualisasi anomali untuk membantu verifikator menemukan klaim yang perlu ditinjau. CLAIMORA dirancang sebagai alat bantu pengambilan keputusan, bukan pengganti verifikator.","CLAIMORA diharapkan membantu mempercepat identifikasi klaim berisiko, meningkatkan efisiensi verifikasi, dan mendukung pencegahan potensi penyalahgunaan dana JKN. Dengan informasi risiko yang lebih terarah, verifikator dapat memfokuskan pemeriksaan pada klaim yang paling membutuhkan perhatian."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2107","tim":"Doa Ibu","inov":"Jejak","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Iuran PPU JKN bergantung pada kejujuran pemberi kerja melaporkan pekerja dan upahnya. Wawancara kami dengan petugas BPJS Kesehatan Bulukumba menunjukkan pemeriksaan masih manual: badan usaha dipanggil tiap minggu membawa dokumen, UMKM didatangi satu per satu. Ada gaji riil Rp8 juta yang dilaporkan setara UMP. Cara ini tidak bisa menjangkau skala nasional, semua badan usaha diperiksa sama rata, dan grup usaha yang memecah pekerjanya tidak terlihat.","Membantu BPJS Kesehatan mengarahkan pemeriksaan kepatuhan ke badan usaha paling berisiko dengan: mendeteksi otomatis pekerja yang tidak didaftarkan dan upah yang dilaporkan rendah, menemukan grup usaha yang memecah pekerjanya, menyiapkan berkas kasus berisi bukti, pasal, dan estimasi iuran, serta memisahkan UMKM yang belum paham aturan dari yang sengaja menghindar. Keputusan tetap di tangan petugas.","JEJAK adalah sistem multi-agent yang membantu BPJS Kesehatan menemukan pemberi kerja yang tidak mendaftarkan seluruh pekerjanya atau melaporkan upah lebih rendah dari kenyataan. Sistem ini mencocokkan data kepesertaan JKN dengan SPT/F2A dan registrasi badan usaha, lalu menautkan badan usaha yang sama walaupun nama dan alamatnya ditulis berbeda. Skor risiko dihitung dengan aturan yang dapat diaudit dari empat sinyal: selisih jumlah pekerja, selisih upah, penurunan peserta antarperiode, dan keterhubungan antarbadan usaha lewat direksi, alamat, atau perpindahan pekerja. LLM menulis narasi kasus yang merujuk pasal, dan setiap angka serta pasalnya diperiksa validator. Hasilnya antrean kasus berpita prioritas, medium, dan edukasi, yang disetujui verifikator lalu ditugaskan supervisor lain ke petugas lapangan, dengan jejak audit lengkap. Prototype dengan LLM aktif mencapai presisi 0,93 pada data uji sintetis, tanpa data peserta riil.","Pemeriksaan berubah dari jadwal bergiliran menjadi antrean berbasis risiko, sehingga waktu petugas dipakai untuk kasus bernilai. Pekerja terdaftar dengan upah benar dan kelas rawat sesuai hak. Iuran tertagih naik, pemberi kerja patuh jarang diperiksa tanpa alasan, dan UMKM dibina dulu. Tiga kasus contoh di data uji mewakili estimasi iuran tertunggak sekitar Rp223 juta per tahun. Dampak nyata diukur saat pilot."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2109","tim":"Lapis","inov":"NEXUS-JKN Explainable Hybrid AI Co-Pilot for Detecting Hidden Fraud Risk in JKN Claims","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Tingginya volume klaim JKN membuat proses audit semakin kompleks dan berisiko mengalami kecurangan, seperti phantom billing dan upcoding. Pemeriksaan manual memiliki keterbatasan dalam mendeteksi pola fraud yang tersembunyi. Oleh karena itu, NEXUS-JKN hadir sebagai solusi berbasis AI untuk membantu mendeteksi risiko kecurangan secara lebih cepat, akurat, dan transparan.","Mengembangkan sistem berbasis Hybrid AI untuk mendeteksi potensi fraud pada klaim JKN, memberikan skor risiko, menentukan prioritas investigasi, serta membantu auditor mengambil keputusan berdasarkan analisis yang dapat dijelaskan.","NEXUS-JKN merupakan platform AI Co-Pilot yang menggabungkan Rule-Based Detection, Isolation Forest, XGBoost, dan Explainable AI (SHAP). Sistem menganalisis data klaim, diagnosis, tindakan medis, biaya, dan bukti pelayanan untuk menghasilkan Fraud Risk Score, kategori risiko, serta rekomendasi investigasi melalui dashboard interaktif. Keputusan akhir tetap berada pada auditor.","NEXUS-JKN diharapkan dapat meningkatkan efisiensi audit, mempercepat identifikasi klaim berisiko, mengurangi potensi kerugian dana JKN, serta memperkuat transparansi dan akuntabilitas pengawasan klaim kesehatan. Dampak tersebut akan diuji pada tahap validasi dan implementasi terbatas."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2162","tim":"ROTPADA","inov":"JKN Cyber Digital Twin","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim JKN melayani 280+ juta jiwa dengan nilai Rp 140+ T/tahun. Potensi inefisiensi fraud (estimasi WHO 3%) mencapai Rp 4,2 T/tahun via upcoding, phantom billing, hingga sindikat rujukan. Pengawasan saat ini masih bertumpu pada aturan statis dan audit acak yang buta terhadap jejaring fraud antar-faskes, serta gagal mengukur titik buta dan durasi fraud sebelum terdeteksi. Akibatnya, alokasi anggaran audit belum optimal dan kebocoran dana jaminan kesehatan terus berulang.","Mengembangkan sistem pendukung keputusan (Decision Support System) JKN Cyber Digital Twin yang mengintegrasikan kecerdasan buatan (Machine Learning & Multi-Agen), analisis jejaring graf (Graph Intelligence), dan simulasi kembaran digital (Digital Twin) untuk mendeteksi kecurangan klaim faskes terorganisir serta mengukur titik buta deteksi secara terukur demi mewujudkan efisiensi risiko dan keberlanjutan pembiayaan program JKN.","JKN Cyber Digital Twin adalah platform pendukung keputusan (Decision Support System) investigasi klaim JKN yang mengintegrasikan deteksi anomali klaim (Machine Learning PU-Bagging), analisis jejaring provider (Graph Intelligence), dan investigasi multi-agen AI dengan simulasi kembaran digital (Digital Twin). Berbeda dari sistem konvensional yang hanya menyaring klaim individual, Telisik mampu memetakan sindikat kecurangan terorganisir (fraud ring) lintas faskes sekaligus mengukur titik buta (blind spot) deteksi dan estimasi lead-time sebelum fraud membesar. Beroperasi dengan prinsip Human-in-the-Loop, sistem ini menyajikan antrean audit berprioritas tinggi dan paket bukti investigasi otomatis, memastikan efisiensi anggaran pengawasan tanpa menggeser wewenang keputusan verifikator BPJS Kesehatan.","Telisik berpotensi memitigasi inefisiensi klaim hingga Rp 4,2 T/tahun (estimasi WHO 3%) dan mencegah 51,7% eksposur kerugian. Di sisi operasional, ketepatan audit melonjak 30,1x lipat (Precision@1% 89,9%) serta mengungkap 88,1% sindikat fraud ring dengan waktu deteksi 2–4 bulan. Sistem ini mengukur titik buta deteksi untuk optimalisasi anggaran pengawasan, melindungi faskes jujur, dan menjaga dana jaminan kesehatan bagi 280+ juta peserta tanpa menggunakan data riil pasien (UU PDP)."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2206","tim":"WiBu eManG BAu","inov":"VeriMed AI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Fraud pada klaim JKN masih menjadi tantangan yang dapat mengurangi efisiensi dan integritas pembiayaan kesehatan. Modus seperti upcoding, manipulasi diagnosis, phantom billing, dan pemecahan tagihan berpotensi merugikan dana JKN. Di sisi lain, verifikator harus menelaah banyak klaim sehingga proses dapat memakan waktu dan hasil verifikasi berpotensi berbeda antarverifikator.     Panduan Pembuatan Proposal Pese…\nTujuan","VeriMed AI bertujuan membantu verifikator BPJS melakukan pemeriksaan klaim secara lebih cepat, konsisten, dan dapat diaudit. Sistem menyegel data klaim sejak diajukan, kemudian menggunakan AI dan rule engine untuk menyorot ketidaksesuaian klinis serta indikasi upcoding dan unbundling tanpa menggantikan keputusan manusia.","VeriMed AI adalah platform web untuk mendukung proses verifikasi klaim JKN. Setiap data dan berkas klaim disegel menggunakan hash dan Merkle root untuk menjaga integritas serta mencatat perubahan. Sistem kemudian mengekstrak informasi diagnosis, komorbid, dan tindakan dari dokumen medis menggunakan NLP, lalu melakukan cross-check terhadap data laboratorium, obat, tindakan, dan aturan klinis. Untuk mendeteksi unbundling, sistem membandingkan aturan paket, hubungan episode, dan pola klaim. Output yang diberikan berupa badge integritas, skor risiko, sorotan bagian yang mencurigakan, alasan, serta rujukan aturan. AI hanya berfungsi sebagai alat bantu; keputusan akhir tetap berada pada verifikator. Prototype menggunakan data sintetis dan dirancang dengan enkripsi, pseudonimisasi, akses berbasis peran, serta audit log.","VeriMed AI diharapkan mengurangi waktu telaah klaim, membantu verifikator fokus pada bagian yang berisiko, serta meningkatkan konsistensi dan jejak audit. Target pilot adalah penurunan waktu telaah minimal 50%, precision minimal 85%, false positive maksimal 10%, dan tidak meningkatkan pending klaim yang wajar. Manfaatnya ditujukan bagi BPJS, faskes yang jujur, dan peserta JKN."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Juliana","s":null}]},{"id":"2207","tim":"MoedaTrace","inov":"Sistem Deteksi Anomali Klaim JKN sebagai Quality Gate Internal pada Fasilitas Kesehatan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim JKN yang tidak sesuai berpotensi menyebabkan pemborosan anggaran dan beban audit yang tinggi. Casemix Officer saat ini mendeteksi anomali secara manual setelah klaim diajukan, sehingga koreksi terlambat dan rework meningkat. Tidak ada alat bantu yang memberikan sinyal risiko sebelum klaim dikirim ke BPJS.","Membangun prototipe alat deteksi anomali klaim JKN pra-pengajuan yang membantu Casemix Officer mengidentifikasi pola phantom billing, repeat billing, kemiripan dokumentasi, dan fragmentasi episode sebelum klaim dikirim, sehingga mengurangi penolakan dan mempercepat proses review.","TilikKlaim adalah prototipe berbasis web yang memungkinkan Casemix Officer menelusuri bukti anomali klaim secara mandiri sebelum pengajuan ke BPJS. Sistem membaca berkas klaim dalam format JSON (CanonicalBundle), menjalankan empat detektor deterministik, seperti phantom billing, repeat billing, kemiripan dokumentasi, dan fragmentasi episode kemudian menyajikan hasil deteksi dalam antarmuka Evidence Workspace. Setiap sinyal disertai sumber bukti dan penjelasan yang dapat diperiksa ulang. Asisten Bukti berbasis LLM tersedia untuk pertanyaan kontekstual, namun tidak terlibat dalam penentuan skor risiko. Evaluasi offline pada 228 bundle sintetik menunjukkan Precision@23 sebesar 0,826.","Mengurangi penolakan klaim akibat anomali yang tidak terdeteksi, mempercepat waktu review Casemix Officer, dan meningkatkan kualitas dokumentasi klaim sebelum pengajuan. Pilot direncanakan di lingkungan faskes yang disetujui untuk mengukur pengurangan rework dan false positive secara nyata."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Susi Lusiani","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2245","tim":"Larphaton","inov":"JKN Digital Twin","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Layanan JKN yang besar dan tersebar membuat satu transaksi dapat terlihat normal ketika diperiksa terpisah. Risiko dapat muncul dari hubungan antar-event, seperti perubahan pola pemanfaatan, perpindahan fasilitas, konflik waktu, atau pengulangan obat/alkes. Tanpa konteks historis peserta, sinyal sulit dibedakan dari pola yang wajar. Diperlukan pendekatan yang memahami pola pemanfaatan individual untuk mendukung pemeriksaan risiko secara kontekstual dan terukur.","Membangun JKN Digital Twin sebagai behavioral identity protection yang membentuk baseline perilaku peserta dari riwayat layanan dan membandingkan aktivitas baru terhadap baseline tersebut. Solusi ini bertujuan mendeteksi sinyal risiko pada penyalahgunaan identitas serta penyalahgunaan obat/alkes, memprioritaskan kasus yang perlu diperiksa, dan menyajikan evidence yang dapat ditelusuri. AI mendukung deteksi pola, sedangkan keputusan akhir tetap berada pada reviewer berwenang.","JKN Digital Twin mengubah event transaksi yang terpisah menjadi konteks perilaku peserta. Prototype membangun snapshot historis sebagai baseline dengan parameter seperti jumlah transaksi, sebaran fasilitas/wilayah, jeda antarkunjungan, jenis layanan, obat, dan alkes. Setiap transaksi baru dibandingkan dengan baseline tersebut. Rule Engine menangkap sinyal eksplisit seperti konflik waktu, multi facility, pengulangan item, interval tidak lazim, dan durable device repetition. Isolation Forest digunakan untuk menemukan kombinasi pola, perubahan pola individu, serta anomali multidimensi yang sulit dirumuskan secara eksplisit. Hasil deteksi digabungkan menjadi risk signal beserta kategori dan evidence. Evidence mencakup sinyal, kronologi, konteks, dan alasan sehingga reviewer dapat menentukan terima, tolak, atau klarifikasi. Prototype saat ini menggunakan data sintetis dan skenario uji; data JKN riil memerlukan dasar akses dan izin resmi.","Dampak diukur melalui perbandingan sebelum-sesudah pada deteksi, efisiensi review, transparansi, dan pengawasan. Metrik: precision, recall, false-positive rate, detection coverage, PR-AUC, time-to-detect, time-to-understand, kelengkapan evidence, dan explainability. Nilai yang diharapkan: proses peserta transparan, klarifikasi faskes terarah, prioritas pemeriksaan BPJS tepat, serta pengawasan JKN lebih konsisten. Dampak masih berupa hipotesis dan perlu divalidasi melalui uji terkontrol."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Susi Lusiani","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2258","tim":"Erudize","inov":"CITE: Platform Investigasi Klaim JKN Berbasis Context Graph dan Controlled AI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Verifikasi digital (VEDIKA) dan algoritma deteksi risiko sudah berjalan, tetapi sengketa klaim masih tinggi: pada Januari 2021 tercatat 440.749 kasus dispute klaim FKRTL senilai Rp873,11 miliar dalam satu bulan. Penyebab utamanya adalah readmisi, disparitas koding, dan perbedaan persepsi antar-verifikator. Hambatannya ada setelah sinyal risiko muncul: penyusunan konteks klinis, pengujian bukti, dan penentuan tindak lanjut masih manual, sementara volume sinyal melampaui kapasitas verifikator.","Membangun CITE, platform investigasi yang mengubah sinyal risiko menjadi berkas kasus yang siap ditelaah. Tujuannya: (1) mempercepat proses dari sinyal hingga berkas siap ditelaah, (2) menyeragamkan logika pembuktian antar-verifikator, (3) menyajikan bukti pendukung dan pembantah secara setara agar faskes diperlakukan adil, dan (4) memastikan keputusan tetap di tangan verifikator dengan jejak audit yang dapat ditelusuri.","CITE melengkapi VEDIKA dan modul deteksi, bukan menggantikannya. Sinyal diterima melalui kontrak data formal, lalu CITE menyusun Temporal Claim Investigation Graph yang memuat klaim, episode perawatan, dan relasi antar-faskes, dengan waktu layanan dan waktu pencatatan dipisahkan. Enam pola integritas (upcoding, fragmentasi episode, unbundling, repeat billing, lama rawat berkepanjangan, dan readmisi) dievaluasi dengan aturan deterministik yang dipetakan ke Permenkes 16/2019 dan 26/2021. Setiap kasus menampilkan bukti pendukung, bukti pembantah, dan data yang belum tersedia berdampingan, beserta hipotesis utama, penjelasan alternatif faskes, dan rekomendasi langkah berikutnya. AI hanya bekerja pada tingkat kasus sebagai asisten forensik (sintesis kronologi, panduan wawancara DPJP, draf berita acara) dengan sitasi wajib dan fail-safe anti-halusinasi. Keputusan tetap di tangan verifikator. Saat ini CITE berada pada tahap mockup; prototype sedang dikembangkan dengan data sintetis.","Bagi BPJS Kesehatan: waktu telaah lebih singkat (target =50%, estimasi), konsistensi antar-verifikator meningkat, dan keputusan dapat diaudit. Bagi faskes: penjelasan teknis dan bukti pembantah dipertimbangkan secara adil sebelum keputusan. Bagi dana jaminan sosial: tagihan ganda, fragmentasi layanan, dan sengketa berkurang; studi rujukan mencatat penurunan dispute 80,43% setelah standardisasi telaah klinis (Gultom dkk., 2025). Bagi ekosistem: keputusan klaim lebih transparan dan dipercaya."],"r":[{"n":"Juliana","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2265","tim":"Kata Moren Nama Timnya Terserah Kowe","inov":"JAGA: Jaringan Analitik Guard Anti-fraud","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN melayani 240+ juta peserta dengan anggaran ~Rp150 triliun/tahun. Potensi kerugian akibat Fraud, Waste, Abuse (FWA) diperkirakan Rp4,5–15 triliun/tahun (WHO/NHCAA 3–10%). Deteksi konvensional berbasis transaction-level memiliki false positive tinggi (10–30%), reaktif, dan gagal mendeteksi fraud terkoordinasi (kartel dokter, phantom patient, referral ring). Diperlukan pendekatan network-level untuk membongkar pola relasi jaringan fraud secara proaktif.","1. Mengubah paradigma deteksi FWA dari transaction-level menjadi network-level berbasis graph analytics.\n2. Membongkar skema fraud terkoordinasi (cloning, upcoding, referral concentration, phantom billing).\n3. Menghemat waktu investigasi dari 4–6 jam menjadi 1,5–2 jam/kasus (efisiensi 60–67%).\n4. Menyediakan Explainable AI (XAI) Bahasa Indonesia dengan mekanisme Human-in-the-Loop demi transparansi dan kepatuhan UU PDP.","JAGA (Jaringan Analitik Guard Anti-fraud) adalah platform intelijen risiko yang membentuk heterogeneous graph menghubungkan Peserta, Dokter, Faskes, dan Klaim. JAGA mengombinasikan 4 lapis analitik: Rule Engine, Statistical Anomaly Detection (Isolation Forest/LOF), Graph Analytics (Centrality/Motifs), dan ML (LightGBM) untuk menghasilkan Unified Risk Score (0–100). Dilengkapi Priority Queue, visualisasi graf interaktif (Cytoscape.js), serta keamanan enkripsi AES-256 dan kepatuhan UU PDP.","1. Efisiensi Waktu: Memangkas durasi investigasi dari 5 jam menjadi 1,5 jam/kasus (hemat 60–67%).\n2. Kapasitas: Meningkatkan produktivitas investigator 2x lipat (4–6 kasus/hari).\n3. Akurasi: Meningkatkan precision rate konfirmasi fraud menjadi 70–80% dan menekan false positive (20%).\n4. Finansial: Potensi nilai dampak Rp3,2–6,2 Miliar/tahun (skenario moderat Rp4,5 Miliar/tahun) melalui pemulihan dana klaim, efisiensi operasional FTE, dan deterrence effect."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Septian Firmansyah","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2275","tim":"Hyperchain Project","inov":"VERA (Validasi Episode & Recovery Anomaly) - Membaca Kurva Biologis, Membongkar Waktu Fiktif","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Defisit JKN 2025 mencapai Rp17,13T (rasio klaim 117%). Biaya rawat inap menyerap >60% klaim. Manipulasi Prolonged Stay — dokter cukup tulis \"pasien masih lemah\" untuk perpanjang rawat fiktif. Sistem BPJS validasi kode ICD, bukan kesesuaian waktu vs kondisi biologis. KPK Juli 2026 sorot celah fraud faskes.","VERA adalah AI Clinical Temporal Analyzer yang beralih dari Validasi Kode Administrasi ke Validasi Jejak Klinis Berbasis Waktu. VERA ekstrak parameter lab harian dari EMR via LLM, petakan ke Kurva Pemulihan Time-Series, dan deteksi anomali: lab normal di H3 tapi klaim sampai H7 = Red Flag. Reviewer BPJS tinggal lihat skor + grafik bukti ilmiah.","VERA pakai stack serverless AI: Vercel + Next.js 16 + Neon PostgreSQL + LLM via OpenRouter/Xyrus. Pipeline: (1) Data Stripping PHI di Edge sebelum LLM (UU PDP), (2) LLM ekstrak lab dari teks EMR tidak terstruktur dengan JSON Schema validation ketat + retry (anti-hallucination 1.89%), (3) Time-Series deviation score bandingkan kurva pasien vs standar IDSA/ATS, (4) Red Flag jika lab normal tapi klaim dipanjangkan. Dashboard reviewer BPJS: 600 Red Flag, 2.000 cases (Pneumonia+Stroke), audit trail lengkap, Human-in-the-Loop override. Live di vera-smoky-rho.vercel.app.","Waktu audit turun 80% (45 menit ? 9 menit per kasus). Estimasi penghematan Rp300M/tahun (asumsi konservatif: 200k kasus × Rp1.5M × 0.5 hari fiktif dipotong). Penerima manfaat: BPJS (selamat dari defisit), RS jujur (persaingan adil), peserta JKN (tidak over-treatment). 100% anomaly detection, 0% hallucination rate pada data sintetis."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Juliana","s":null}]},{"id":"2276","tim":"HealthGO","inov":"Real-time Multi Modus Fraud Risk Detection dan Adaptive Participant Questioning untuk Prioritas JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["JKN mencatat 606,7 juta pelayanan pada 2023, tersebar di lebih dari 3.000 unit FKRTL, sehingga verifikasi mendalam pada seluruh klaim sulit dilakukan. Beban verifikasi bukan hanya soal jumlah klaim, tapi juga kedalaman pemeriksaan riwayat, diagnosis, prosedur, dan episode layanan. Fraud klaim JKN juga bersifat multi modus (upcoding, prolonged LOS, episode splitting, readmission, repeat billing), sehingga satu jenis deteksi saja tidak cukup menggambarkan risiko klaim secara utuh.","Mengembangkan platform yang: (1) mendeteksi risiko fraud klaim JKN secara multi modus (upcoding, prolonged LOS, episode splitting, readmission, repeat billing) secara real-time; (2) menggabungkan skor risiko per modus, konteks provider/peer, dan financial loss menjadi satu prioritas verifikasi (UAPS) agar kapasitas verifikator terarah pada klaim paling berisiko; dan (3) menghasilkan adaptive participant questioning untuk mengonfirmasi fakta layanan ke peserta sebagai evidence tambahan.","SiVerA (Sistem Verifikasi & Analitik Klaim JKN Berbasis AI) mengintegrasikan tiga fungsi. Pertama, Claim Multi Modus Fraud Risk Engine menilai risiko enam jenis fraud (upcoding, episode splitting, fragmentation, repeat billing, prolonged LOS, readmission) dari dokumentasi, coding klinis, serta pola temporal episode klaim real-time. Model upcoding memakai CatBoost Regression memprediksi biaya wajar dari kondisi awal pasien dan riwayat kunjungan, dibandingkan biaya yang diklaim (expected loss), lalu dikonversi jadi risk score berbasis persentil distribusi referensi. Kedua, Risk Prioritization menggabungkan skor tiap modus, analisis provider (nearest-peer, peer percentile), dan financial loss jadi Unified Audit Priority Score (UAPS), plus Explainable AI. Ketiga, Adaptive Participant Questioning menyusun pertanyaan konfirmasi minimal dan adaptif ke peserta via Mobile JKN, khusus klaim prioritas tinggi yang masih ambigu. Keputusan akhir tetap di tangan verifikator (human-in-the-loop).","SiVerA mengarahkan kapasitas verifikator BPJS Kesehatan pada klaim paling berisiko, membuat audit lebih efisien dan tepat sasaran di tengah skala JKN yang besar. Deteksi multi modus real-time mempercepat identifikasi fraud dan menekan financial loss. Adaptive participant questioning memperkaya evidence verifikasi tanpa membebani seluruh peserta, sambil menjaga asas praduga tak bersalah. Solusi ini mengubah fraud detection dari menemukan anomali menjadi verifikasi klaim JKN yang terarah."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2285","tim":"NAIA Indonesia","inov":"NAIA-CLARITY: AI Point-of-Care Pencegah Klaim Pending dan Dispute Gigi FKRTL BPJS Kesehatan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pada Januari 2021, BPJS Kesehatan mencatat 440.749 kasus dispute klaim FKRTL senilai Rp873,1 miliar, terutama akibat inkonsistensi pengodean medis. Saat BPJS membentuk Tim Ahli Pengodean Klinis, dispute turun 80,4% hingga April 2023, membuktikan masalah ini sebagian besar dapat dicegah. Penyebabnya, anamnesis, odontogram, dan radiograf gigi tersimpan terpisah, baru diperiksa silang saat verifikasi BPJS, berbulan-bulan kemudian. Dokter gigi menanggung dampaknya lewat jasa medis tertunda.","Membangun NAIA-CLARITY, sistem AI point-of-care yang mengintegrasikan data multimodal berupa SOAP, odontogram digital, dan citra radiografi melalui interoperabilitas FHIR-SIMRS. Sistem ini mendeteksi proaktif ketidaksesuaian antara temuan klinis, diagnosis, prosedur, dan kode klaim sebelum klaim gigi FKRTL disubmit. Tujuannya menurunkan klaim pending, dispute, dan upcoding/unbundling dengan memindahkan koreksi dari claim office ke titik layanan, tanpa mengambil alih keputusan klinis dokter.","NAIA-CLARITY adalah layanan AI latar yang terintegrasi dengan SIMRS FKRTL melalui FHIR, bekerja saat dokter gigi masih bersama pasien. Arsitekturnya Neuro-Symbolic AI dengan tiga komponen. Vision Integrity Processor (VIP) memakai YOLOv8-Medical dan U-Net untuk membaca radiografi. Clinical NLP Engine (CNLP) memakai LLM lokal terenkripsi (Llama-3-Medical-7B) dengan RAG dari PPK Kemenkes dan aturan BPJS, menstrukturkan catatan SOAP. Cross-Check Decision Core adalah rule engine deterministik yang mencocokkan odontogram, anamnesis, dan radiograf. Jika sinkron, sistem menerbitkan Clarity Validation Token beserta rekomendasi kode ICD-10/ICD-9-CM dan notifikasi pra-klaim. Data pasien dipseudonimkan dan dienkripsi AES-256, disimpan on-premise/private cloud sesuai UU PDP No. 27/2022. Penerapannya bertahap: shadow mode, assisted mode, pre-claim gate, untuk MVP 10 tindakan berisiko tinggi di 1-2 FKRTL pilot. Prinsipnya, AI memberi rekomendasi, dokter memvalidasi, institusi mengatur tata kelola.","Target MVP meliputi kenaikan clean claim rate 15-25%, penurunan pending rate 20-30%, dan penurunan dispute rate 15-25%. Dokter gigi FKRTL menerima jasa medis lebih tepat waktu tanpa delayed salary akibat dispute. BPJS Kesehatan mengurangi beban verifikasi manual, sementara pasien JKN memperoleh layanan dengan waktu tunggu dan kualitas dokumentasi lebih baik. Sistem ini menggeser dari reaktif-kuratif menjadi proaktif-preventif, memperkuat transparansi dan keberlanjutan finansial JKN."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Yanuar Milad","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2299","tim":"Dark Tech","inov":"NIKITA: Identity Continuity Risk Score","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Fraud dan penyalahgunaan identitas peserta JKN menyebabkan kerugian finansial besar. Data menunjukkan fraud JKN mencapai Rp 6,8 triliun pada 2025. Deteksi saat ini hanya berbasis biometrik yang cakupannya tidak merata, sehingga diperlukan solusi yang lebih komprehensif.","Mengembangkan sistem deteksi penyalahgunaan identitas peserta berbasis machine learning yang menganalisis pola kunjungan secara longitudinal, mengidentifikasi anomali spasial-temporal, dan menghasilkan skor risiko yang dapat diaudit untuk membantu BPJS Kesehatan dalam pencegahan fraud.","NIKITA adalah sistem berbasis machine learning yang menganalisis pola kunjungan peserta secara longitudinal dan lintas fasilitas kesehatan. Sistem ini mengidentifikasi tiga sinyal utama: konsensus spasial-temporal, cloak biometrik, dan inkonsistensi profil. Dengan pendekatan ini, NIKITA menghasilkan skor risiko 0-1 yang dapat digunakan untuk memprioritaskan verifikasi, bukan menolak layanan secara otomatis. Prinsip human-in-the-loop memastikan keputusan akhir tetap di tangan analisis.","Sistem ini berpotensi mengurangi fraud JKN secara signifikan dengan deteksi yang lebih dini dan akurat. Skor risiko yang dihasilkan membantu BPJS Kesehatan mengalokasikan sumber daya verifikasi secara lebih efisien. Peserta yang sah terlindungi, dan kepercayaan publik terhadap program JKN meningkat."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Yanuar Milad","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2304","tim":"Ini aja","inov":"JKN PREVIA","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN mencakup 284 juta peserta per Juli 2026, sehingga ketepatan pelayanan dan efisiensi pembiayaan penting. Ketidaksesuaian tindakan dengan indikasi medis berpotensi meningkatkan risiko pasien dan biaya. JKN PREVIA dikembangkan untuk memprediksi risiko dan menyimulasikan alternatif pelayanan agar tenaga medis dapat membandingkan outcome, lama perawatan, readmisi, dan estimasi biaya sebelum keputusan ditetapkan. PREVIA merupakan alat bantu analisis, bukan pengganti keputusan klinis.","tujuannya adalah membantu fasilitas kesehatan memprediksi risiko pelayanan berdasarkan kondisi dan riwayat pasien, serta menyimulasikan alternatif skenario sebelum keputusan ditetapkan. Sistem membandingkan estimasi risiko, kemungkinan readmisi, lama perawatan, dan biaya untuk membantu mengidentifikasi skenario yang berpotensi lebih rendah risiko dan lebih efisien. PREVIA diharapkan mendukung ketepatan pelayanan dan efisiensi pembiayaan JKN tanpa menggantikan keputusan klinis tenaga medis.","JKN PREVIA (Predictive Risk Simulation) adalah aplikasi web untuk membantu fasilitas kesehatan menganalisis risiko pelayanan JKN, khususnya tindakan yang berpotensi tidak sesuai indikasi medis. Sistem menggunakan kondisi dan riwayat pasien serta rencana pelayanan untuk memprediksi risiko, kemungkinan readmisi, lama perawatan, dan estimasi biaya. Melalui pendekatan Predict–Simulate–Compare–Prevent, pengguna dapat menguji beberapa skenario dan membandingkan hasil estimasinya sebelum keputusan ditetapkan. PREVIA menggabungkan machine learning untuk perhitungan kuantitatif dan AI generatif untuk menjelaskan hasil dalam bahasa yang mudah dipahami. Prediksi dan simulasi merupakan estimasi berbasis data, bukan kepastian sebab-akibat atau pengganti keputusan klinis. Tenaga medis tetap memegang kewenangan atas keputusan pengobatan. Pengembangan lebih lanjut memerlukan validasi dengan data representatif, keterlibatan tenaga ahli, serta perlindungan keamanan dan privasi data pasien.","membantu fasilitas kesehatan mengidentifikasi potensi risiko pelayanan melalui prediksi dan simulasi alternatif skenario sebelum keputusan ditetapkan. Sistem ini memungkinkan perbandingan estimasi risiko, kemungkinan readmisi, lama perawatan, dan biaya sehingga mendukung evaluasi pelayanan yang lebih tepat. Bagi Program JKN, PREVIA berpotensi mendukung efisiensi pembiayaan dan penggunaan sumber daya tanpa mengabaikan keselamatan pasien serta kesesuaian tindakan dengan indikasi medis."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2309","tim":"Kata bang falih gass","inov":"Sistem Verifikasi Rujukan Berbasis Data untuk Deteksi Rujukan Semu pada Program Jaminan Kesehatan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["FKTP adalah pintu pertama bagi 284,3 juta peserta JKN. Ada 144 diagnosis yang seharusnya selesai di FKTP, tapi di lapangan masih ada yang dirujuk ke rumah sakit. Ada juga rujukan dengan alasan alat atau tenaga terbatas, padahal SISRUTE mencatat fasilitasnya tersedia. Data DJSN 2015 mencatat 9,6% rujukan FKTP bersifat nonspesialistik. Masalahnya, pemeriksaan saat ini banyak berhenti di kelengkapan berkas dan audit sampling, jadi kejanggalan baru ketahuan setelah klaim dibayar.","Membantu verifikator BPJS menentukan rujukan mana yang perlu diperiksa lebih dulu. Caranya dengan memberi skor risiko pada setiap rujukan sejak rujukan itu terbit, lengkap dengan alasannya. Dengan begitu rujukan semu bisa ditangani sebelum klaim dibayar, dan keputusan akhirnya tetap ada di tangan manusia.","SIRUJUK menilai setiap rujukan lewat empat lapis pemeriksaan. Pertama, alasan alat atau tenaga terbatas dicocokkan dengan data ketersediaan SISRUTE hari itu. Kedua, porsi rujukan diagnosis 144 dibandingkan dengan dokter sejenis. Ketiga, dilihat apakah rujukan menumpuk di satu RS yang bukan terdekat. Keempat, narasi klinis dicek apakah nyambung dengan diagnosis atau cuma template. Keempat sinyal ini digabung dengan regresi logistik jadi satu skor 0 sampai 100. Hijau jalan terus, kuning masuk antrean verifikator, merah klaimnya ditahan sampai diputus TKMKB. Yang ditahan hanya klaim, pasien tetap dilayani dan rujukan darurat selalu lolos. Prototipe sudah jalan dari ujung ke ujung untuk empat peran, yaitu verifikator, TKMKB, Dinkes, dan dokter FKTP. Uji pada sekitar 40 ribu rujukan sintetis menghasilkan precision merah 77,7% dan recall 90,9%, dengan waktu skoring di bawah 0,3 detik per rujukan.","Dengan jumlah verifikator yang sama, pemeriksaan bisa lebih tepat sasaran. Di data sintetis, kalau verifikator cuma sanggup mengecek 10% rujukan, urutan dari SIRUJUK menemukan sekitar 82% kasus, sedangkan pilihan acak hanya sekitar 10%. Kejanggalan juga bisa ditangkap sebelum klaim dibayar, bukan berbulan-bulan kemudian. Dokter pun tahu bagian rujukan mana yang dipersoalkan. Angka ini masih dari data sintetis, jadi dampak nyatanya tetap perlu dibuktikan lewat pilot."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Yanuar Milad","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2325","tim":"Tim 999","inov":"SIGAP-Fraud: Agen AI Lokal untuk Prioritisasi dan Investigasi Awal Klaim Fasilitas Kesehatan JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Fraud klaim fasilitas kesehatan mengancam keberlanjutan JKN. KPK memperkirakan kerugiannya sekitar Rp20 triliun (estimasi resmi, bukan audit kami), sementara 3.194 FKRTL melayani sekitar 161,4 juta kunjungan per tahun sehingga verifikasi manual mendalam mustahil. Skor tanpa penjelasan juga sulit ditindaklanjuti petugas. SIGAP-Fraud adalah agen AI lokal yang menilai risiko provider, menjelaskannya dengan SHAP, dan menyusun narasi serta draf tindak lanjut, dengan keputusan akhir pada auditor.","Tujuan SIGAP-Fraud ada tiga: (1) membangun penilaian risiko fraud per provider yang terukur dan dapat dijelaskan dengan SHAP; (2) menyediakan agen yang mengubah skor menjadi narasi investigasi berbahasa Indonesia dan draf tindak lanjut awal, dengan otonomi terbatas dan validasi auditor; (3) merancang arsitektur yang jujur soal keterbatasan data proxy namun siap dimigrasikan ke data klaim JKN asli.","SIGAP-Fraud adalah agen AI lokal dengan empat lapis: rekayasa fitur per provider, scoring engine XGBoost/LightGBM dengan SHAP, agen investigasi Hermes via Ollama yang menyusun narasi, langkah, label urgensi, dan draf tindak lanjut, serta pengayaan konteks SatuSehat sandbox (opsional). Dashboard menampilkan provider terurut risiko. Fokus: upcoding, unbundling, phantom dan repeat billing. Setiap draf wajib divalidasi auditor. Purwarupa dilatih pada dataset proxy Kaggle.","Hipotesis yang akan diuji: investigasi awal per provider selesai dalam hitungan detik, bukan manual; auditor memulai dari provider berisiko tertinggi; narasi dan draf tindak lanjut lebih konsisten antar-petugas; tanpa biaya API karena berjalan lokal. Provider jujur terlindungi oleh verifikasi manusia wajib. Dampak pada dana JKN perlu dibuktikan pada tahap pilot dengan data resmi, bukan diklaim dari dataset proxy."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Juliana","s":null}]},{"id":"2327","tim":"cookusan","inov":"EPISIGHT: Evidence-First Investigation Copilot untuk Efisiensi Risiko Klaim JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Dalam program JKN, beberapa pola pelayanan seperti pasien kembali dirawat dalam waktu dekat atau kunjungan yang terpisah-pisah perlu diperiksa lebih lanjut. Saat ini reviewer masih harus mencari riwayat pelayanan, membaca catatan klinis, dan mencocokkan aturan dari berbagai sumber. Proses ini memakan waktu dan berisiko kehilangan konteks. EPISIGHT membantu menyatukan bukti tersebut agar review lebih cepat, jelas, dan dapat ditelusuri.","Tujuan EPISIGHT adalah membantu reviewer memahami kasus readmisi dan fragmentasi dengan lebih cepat tanpa kehilangan konteks penting. Sistem menyatukan riwayat pelayanan, catatan klinis, kebijakan, serta bukti yang relevan dalam satu alur investigasi yang dapat ditelusuri. Dengan begitu, reviewer dapat lebih fokus pada penilaian dan tetap menjadi pihak yang menentukan keputusan akhir.","EPISIGHT adalah investigation copilot yang membantu reviewer menelusuri kasus readmisi dan fragmentasi secara lebih terstruktur. Sistem menggabungkan riwayat episode pelayanan, catatan klinis, kebijakan, dan bukti terkait dalam satu alur review. EPISIGHT dapat menunjukkan bukti yang mendukung suatu temuan, konteks yang menjelaskan kondisi pasien, informasi yang masih kurang, serta sumber yang saling bertentangan. Setiap bukti dapat ditelusuri kembali ke sumber asalnya. Prototype saat ini telah berjalan menggunakan data sintetis, dengan screening berbasis aturan, rekonstruksi episode, pencarian bukti, dan reviewer brief. EPISIGHT tidak menentukan fraud atau keputusan klaim; keputusan akhir tetap berada pada reviewer manusia.","EPISIGHT diharapkan mengurangi waktu dan beban pencarian informasi dalam proses review, sehingga reviewer dapat lebih fokus pada verifikasi bukti dan penilaian kasus. Dampaknya ditargetkan berupa proses review yang lebih cepat, lebih konsisten, lebih mudah diaudit, serta tetap mempertahankan konteks klinis dan keputusan manusia sebagai kendali akhir."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Djaka Santosa","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2334","tim":"Lah Lolos","inov":"SAKSI-JKN: Sistem Analitik Konsistensi dan Sinkronisasi Informasi JKN untuk Verifikasi Klaim dan Pri","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pada 2023, JKN mencatat 606,7 juta pemanfaatan layanan. Besarnya volume pelayanan meningkatkan risiko ketidaksesuaian antara klaim, catatan medis, dan layanan yang diterima peserta. SAKSI-JKN mengintegrasikan analisis graf dan bukti peserta untuk mendeteksi indikasi phantom billing serta memprioritaskan audit.","Mengembangkan SAKSI-JKN untuk mendeteksi pola klaim berisiko, memverifikasi kesesuaian layanan melalui bukti peserta, serta memprioritaskan audit berdasarkan risiko dan ketidakpastian. Sistem mendukung pengambilan keputusan tanpa menggantikan auditor manusia.","SAKSI-JKN mengintegrasikan Graph Expert untuk menganalisis pola klaim dan Evidence Expert untuk memperbarui risiko berdasarkan bukti peserta melalui pendekatan Bayesian. Sistem menghasilkan skor risiko, alasan pemeriksaan, dan antrean audit. Prototipe dikembangkan menggunakan data sintetis.","SAKSI-JKN berpotensi meningkatkan efisiensi, transparansi, dan ketepatan prioritas audit. Pada pengujian sintetis, Recall@10% mencapai 28,4%, dibandingkan 15,8% pada XGBoost. Hasil ini menunjukkan potensi peningkatan deteksi klaim berisiko, tetapi masih memerlukan validasi pada data nyata."],"r":[{"n":"Juliana","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2338","tim":"Vireon","inov":"VIREON: Sistem Deteksi Risiko Cloning dan Repeat Billing Berbasis AI untuk Mendukung Verifikasi Klai","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN menangani volume klaim yang sangat besar dan kompleks. Indikasi Cloning dan Repeat Billing tidak selalu terlihat dari satu atribut klaim karena dapat melibatkan kemiripan dokumen klinis, episode pelayanan, serta riwayat pembayaran. Kondisi ini menuntut sistem verifikasi yang mampu memprioritaskan klaim berisiko secara cepat, transparan, dan tetap mendukung keputusan manusia.","Mengembangkan VIREON sebagai sistem pendukung verifikasi berbasis AI untuk mendeteksi indikasi Cloning dan Repeat Billing sebelum pembayaran. VIREON dirancang untuk memprioritaskan klaim berisiko, menyajikan bukti yang dapat ditelusuri, dan membantu verifikator mengambil keputusan secara human-in-the-loop tanpa melakukan penolakan atau persetujuan klaim secara otomatis.","VIREON adalah prototipe sistem deteksi risiko klaim yang menggabungkan dua mesin spesialis: Anti-Cloning dan Anti-Repeat Billing. Alurnya mencakup input serta harmonisasi data, candidate generation, analisis spesialis, hybrid risk scoring, explainability, human-in-the-loop review, dan audit log. Anti-Cloning menganalisis kemiripan narasi klinis, template, dan temuan spesifik antarpasien, sedangkan Anti-Repeat Billing memeriksa kesamaan episode, kronologi, serta status pembayaran. Prototipe menggunakan 300 klaim sintetis dengan 80 pasangan uji berlabel dan mendukung input JSON/JSONL serta simulasi PDF/OCR. Hasil sistem berupa prioritas risiko dan bukti pendukung, bukan vonis fraud otomatis.","VIREON diharapkan meningkatkan efisiensi verifikasi dengan membantu verifikator memprioritaskan klaim berisiko dan meninjau bukti secara lebih terarah. Sistem juga berpotensi mengurangi risiko pembayaran klaim tidak wajar, memperkuat audit trail, meningkatkan transparansi bagi fasilitas kesehatan, serta mendukung keberlanjutan dana JKN tanpa menggantikan keputusan akhir manusia"],"r":[{"n":"Aries Kurniwan","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2343","tim":"BeRare Biom","inov":"JKN GUARD: Sistem Cerdas Perlindungan Identitas Peserta dan Deteksi Fraud pada Layanan Kesehatan","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Penyalahgunaan identitas JKN, seperti peminjaman kartu dan pemalsuan identitas, berisiko merugikan peserta, fasilitas kesehatan, dan BPJS Kesehatan. Verifikasi konvensional belum sepenuhnya memastikan kehadiran pemilik sah identitas. JKN Guard diusulkan sebagai solusi berbasis biometrik dan kecerdasan buatan untuk memperkuat perlindungan identitas dan mendeteksi indikasi fraud.","JKN Guard bertujuan melindungi identitas peserta melalui verifikasi biometrik, mendeteksi indikasi fraud, dan memberikan notifikasi penggunaan identitas. Sistem ini juga dirancang untuk meningkatkan efisiensi verifikasi serta menjaga privasi peserta.","JKN Guard mengintegrasikan aplikasi peserta, Verification Gateway di fasilitas kesehatan, dan backend analitik. Sistem menggunakan verifikasi wajah dan teknologi rPPG untuk memeriksa kehadiran pemilik identitas, kemudian menerbitkan Dynamic JKN Pass berupa QR code sekali pakai yang berlaku selama 60 detik.\n\nBackend menganalisis anomali penggunaan identitas lintas fasilitas kesehatan dan mengirimkan notifikasi kepada peserta. Jika ditemukan aktivitas mencurigakan, laporan ditindaklanjuti oleh petugas. Sistem juga dirancang untuk melindungi data biometrik dan menyediakan verifikasi manual sebagai alternatif.","JKN Guard diharapkan mengurangi risiko penyalahgunaan identitas, menjaga keakuratan riwayat medis, dan mempercepat verifikasi di fasilitas kesehatan. Bagi BPJS Kesehatan, sistem ini berpotensi mendukung deteksi fraud dan menjaga integritas pembiayaan JKN. Efektivitasnya perlu divalidasi melalui pengujian lebih lanjut."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2346","tim":"Kata Rehan Besok Ajah","inov":"JAGA-JKN: Sistem Cerdas Pencegahan Fraud Identitas Berbasis AI dan Partisipasi Aktif Peserta JKN","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Latar belakang permasalahan ini adalah maraknya penyalahgunaan identitas peserta JKN, seperti peminjaman kartu atau penggunaan NIK orang yang telah meninggal dunia. Akar masalahnya terletak pada celah verifikasi di fasilitas kesehatan yang masih mengandalkan pencocokan visual fisik semata tanpa adanya otentikasi berlapis. Kondisi ini memicu risiko klaim fiktif, rekam medis yang tidak akurat, serta membebani verifikator dengan proses pemeriksaan manual.","Tujuan proposal ini adalah menciptakan JAGA-JKN sebagai lapisan proteksi untuk mencegah fraud identitas peserta JKN. Sistem ini bertujuan mengubah peserta menjadi pengawas aktif melalui notifikasi layanan real-time. Lebih lanjut, solusi ini dirancang demi efisiensi verifikasi faskes, menjaga akurasi rekam medis, serta mempermudah verifikator mendeteksi anomali risiko secara otomatis menggunakan AI.","Proposal JAGA-JKN menghadirkan solusi komprehensif untuk mengatasi fraud identitas di ekosistem BPJS Kesehatan. Sistem ini mengubah peserta menjadi pengawas aktif melalui tiga pilar teknologi utama. Pertama, Smart Check-In Biometric yang memanfaatkan liveness detection guna memvalidasi kehadiran fisik peserta di faskes secara akurat. Kedua, Claim E-Approval, sistem notifikasi ponsel real-time yang meminta konfirmasi langsung tiap kali faskes mengajukan tindakan medis. Ketiga, Behavioral Identity Guard Engine, mesin analitik AI yang mengidentifikasi anomali profil atau lokasi guna menghasilkan skor risiko otomatis bagi verifikator.\n\nDibangun dengan arsitektur modern yang mematuhi UU PDP, JAGA-JKN menghadirkan antarmuka inklusif yang ramah untuk segala usia. Solusi ini efektif melindungi data peserta, mengurangi beban kerja manual verifikator, serta mewujudkan layanan jaminan kesehatan yang lebih transparan, efisien, dan aman.","Dampak utama JAGA-JKN adalah menutup celah klaim fiktif (phantom billing) dan penyalahgunaan identitas peserta secara instan. Peserta JKN juga diberdayakan untuk menjadi pengawas aktif atas data medisnya. Selain itu, sistem ini mempercepat pelayanan fasilitas kesehatan melalui validasi data yang akurat, serta membantu BPJS Kesehatan mendeteksi pola anomali lebih dini menggunakan analitik data untuk pengambilan keputusan yang lebih efektif."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2354","tim":"Autonamic","inov":"LangkahCare_JKN","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Penyaluran obat Program Rujuk Balik (PRB) untuk pasien Diabetes Melitus Tipe 2 masih rentan terhadap penyalahgunaan identitas kepesertaan dan klaim obat fiktif di apotek jejaring karena verifikasi fisik belum terintegrasi secara ketat. Di sisi lain, kepatuhan terapi mandiri pasien kerap terganggu oleh informasi keliru di ruang publik tanpa kurasi medis, yang memicu pasien berhenti minum obat atau lalai menjaga pola makan, sehingga memicu komplikasi dan beban biaya layanan rujukan","1. Menutup celah pemalsuan identitas dan kebocoran klaim obat PRB melalui verifikasi ganda (biometrik wajah lokal dan otorisasi wali sah terdaftar) di apotek jejaring.\n\n2. Membantu pasien DM Tipe 2 mengontrol penyakit secara mandiri lewat estimasi nutrisi kamera langsung dan pelacak kebugaran harian.\n\n3. Membangun ruang berbagi sesama pasien yang aman dari konten provokatif, asusila, dan anjuran sesat anti-medis demi menjaga kepatuhan minum obat serta anjuran dokter faskes.","LangkahCare JKN (https://langkahcare.prototype.web.id/) adalah platform tata kelola terpadu peserta PRB DM Tipe 2 dengan tiga modul fungsional:\n\n1) Verifikasi Pengambilan Obat Anti-Fraud: Sistem validasi penyerahan obat di apotek jejaring berbasis pencocokan biometrik wajah lokalserta validasi NIK wali terdaftar bagi pasien berhalangan hadir dimana setiap transaksi mengunci log audit resmi guna mencegah klaim ganda maupun jual beli obat PRB.\n\n3. Pemantau Nutrisi & Kebugaran Mandiri dimana mapu menjadi saranan evaluasi asupan makan melalui kamera langsung dengan filter penolak objek non pangan, serta integrasi pemantau langkah harian terukur untuk menjaga kestabilan glukosa darah.\n\n4. Dapat menjadi semacam ruang berbagi yang modern seperti komunitas pasien untuk saling menguatkan kepatuhan kontrol, dilengkapi penyaring otomatis (guardrail) berlapis yang menolak postingan bermuatan SARA, asusila, agresi terhadap nakes, maupun ajakan menghentikan terapi obat dokter.","1) Pengendalian Biaya Obat karena mamp mencegah kerugian dana jaminan sosial akibat penyalahgunaan identitas kepesertaan dan peredaran obat PRB di luar peruntukan resmi. 2) Monitoring nutrisi dan kepatuhan obat yang terpantau menurunkan risiko readmisi rumah sakit dan komplikasi kronis seperti neuropati. 3 Menghadirkan rekam jejak digital penyerahan obat yang transparan bagi faskes dan BPJS Kesehatan, sekaligus menjaga motivasi pemulihan pasien."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2362","tim":"bpjs is the best","inov":"TAKAR - JKN","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pemanfaatan layanan JKN melonjak dari 362,69 juta (2020) menjadi 673,9 juta (2024), dengan 27,9 juta peserta hipertensi dan diabetes. Verifikasi klaim obat di Apotek Online BPJS masih per-transaksi, tanpa membandingkan riwayat peserta lintas waktu dan lintas apotek. Akibatnya, anomali baru terdeteksi lewat audit pasca-klaim. Pada 2023, inefisiensi yang ditemukan mencapai Rp866,8 M dan Rp397,9 M. Deteksi masih bergantung pada SDM manual, dan belum ada mekanisme otomatis untuk excessive usage.","Membangun sistem scoring anomali yang mendeteksi pola klaim obat tidak wajar di level peserta secara lintas waktu dan lintas apotek/faskes. Sistem bertujuan menandai anomali sebelum klaim dibayarkan sehingga bersifat preventif, mengisi celah monitoring pada program rawan seperti PRB, serta memberi verifikator BPJS skor risiko beserta alasan yang mudah dipahami. Semua itu dilakukan tanpa mengganggu pelayanan obat kepada peserta dan tanpa menggantikan keputusan manusia.","TAKAR-JKN (Telaah Akumulasi Obat & Kunjungan Abnormal Peserta) adalah penghitung skor anomali yang bekerja di atas data Apotek Online BPJS, dilengkapi data P-Care, VClaim, kepesertaan, dan acuan dosis Fornas. Sistem menarik data secara read-only setelah obat diserahkan, lalu menyusun riwayat pengambilan obat per peserta. Dari riwayat itu, sistem menghitung metrik seperti interval refill dibanding jadwal terapi (MPR), jumlah apotek berbeda untuk obat yang sama, dan volume obat dibanding kebutuhan klinis. Deteksi memakai tiga lapis: aturan berbasis literatur farmakoepidemiologi (misal MPR > 1,2 atau lebih dari 4 apotek dalam 90 hari), Isolation Forest yang membandingkan peserta dengan kelompok sebaya, dan ke depan Gradient Boosting dengan SHAP yang belajar dari keputusan verifikator. Hasilnya berupa skor risiko beralasan di dashboard verifikator, sementara keputusan tetap di tangan manusia. Prototipe memakai data sintetis dan ID peserta dipseudonimkan.","TAKAR-JKN memungkinkan klaim obat bermasalah ditandai sebelum dibayarkan, bukan lewat audit pasca-klaim. Metrik utamanya adalah nilai klaim (Rupiah) yang berhasil ditandai. BPJS Kesehatan memperoleh deteksi dini yang scalable untuk jutaan transaksi. Faskes dan apotek terlindungi dari keterlibatan tidak sengaja dalam pola mencurigakan, dan peserta JKN mendapat jaminan keberlanjutan anggaran. Prinsip human-in-the-loop dan pseudonimisasi menjaga asas praduga tak bersalah serta kepatuhan UU PDP."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2366","tim":"dr. Raion, Sp.AI","inov":"SAPA-JKN: Verifikasi Klaim Pra-Bayar Berbasis Pasien dan AI NLP","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Verifikasi klaim BPJS saat ini berfokus pada kelengkapan administrasi pasca-bayar, sehingga klaim fiktif tetap lolos jika berkas lengkap. Verifikator menangani 10.000-15.000 berkas per bulan dengan waktu kurang dari 2 menit per lembar tanpa saksi independen. Temuan KPK (2024) mencatat 75% klaim fisioterapi fiktif di satu RS dan defisit DJS mencapai Rp17,13 T. BPJS membutuhkan konfirmasi faktual langsung dari pasien sebelum klaim dibayarkan.","Solusi ini bertujuan menyediakan kanal konfirmasi faktual ke pasien via WhatsApp resmi sebelum klaim dibayarkan, menggunakan AI NLP lokal untuk menerjemahkan istilah medis ke bahasa awam secara aman sesuai UU PDP, serta mengotomatisasi penahanan klaim berisiko dan draf BAP digital di dashboard verifikator saat terdeteksi ketidaksesuaian tindakan.","SAPA-JKN adalah platform verifikasi klaim pra-bayar partisipatif yang menghubungkan kesaksian pasien dengan BPJS Kesehatan. Sistem mengintegrasikan data tagihan vClaim, rekam medis SatuSehat, dan kontak terverifikasi NIK Dukcapil. Pasien menerima notifikasi WhatsApp resmi berisi pertanyaan tindakan dengan tombol respon satu sentuhan yang disederhanakan oleh AI NLP lokal tanpa kebocoran data keluar. Jika pasien menyanggah tindakan medis yang ditagihkan faskes, sistem otomatis memicu status penahanan klaim di vClaim dan membuat draf BAP digital seketika. Verifikator kemudian menelaah bukti komparasi berdampingan tagihan dan jawaban pasien pada dashboard React Vite untuk mengambil keputusan akhir secara objektif.","Inovasi ini memangkas 60% waktu penelusuran manual verifikator dan mencapai target respons pasien di atas 70% dalam 2 jam via WhatsApp resmi tanpa aplikasi baru. Secara finansial, solusi ini mengunci potensi kebocoran dana JKN puluhan hingga ratusan miliar rupiah per tahun sebelum dana dicairkan, dengan jaminan kepatuhan penuh terhadap UU PDP No. 27/2022 dan kendali akhir di tangan verifikator manusia."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Yanuar Milad","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2374","tim":"Bisa","inov":"SaksiKlaim: Pasien sebagai Saksi Klaim, AI sebagai Detektor","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Tahun 2025, biaya layanan JKN mencapai Rp191,33 triliun, sementara iuran yang masuk hanya Rp176,72 triliun, sehingga defisit Rp14,61 triliun. Di tahun yang sama, BPJS menemukan kecurangan senilai Rp6,8 triliun (Januari–Oktober), paling banyak berupa phantom billing dan manipulasi dokumen. Pada 2024, KPK menemukan tiga rumah sakit menagih 4.341 kasus, padahal rekam medisnya hanya mencatat sekitar 1.000. Pasien bisa melihat riwayat pelayanan di Mobile JKN, tetapi tidak bisa membantahnya.","Kami ingin pasien ikut menjadi saksi atas klaim yang diajukan atas namanya. Dengan begitu, klaim untuk layanan yang tidak pernah diberikan bisa ketahuan sebelum dibayar. Verifikator BPJS juga terbantu karena bisa langsung memeriksa klaim dan faskes yang paling berisiko, bukan memeriksa semuanya satu per satu.","SaksiKlaim punya tiga bagian. Yang pertama adalah fitur untuk pasien, yang kami rancang sebagai menu di Mobile JKN. Setiap ada klaim atas namanya, pasien menerima ringkasan layanannya lalu cukup menekan \"Benar\" atau \"Tidak sesuai\" dan memilih alasannya. Yang kedua adalah mesin skor risiko. Mesin ini menggabungkan laporan pasien dengan pola klaim yang tidak wajar dibandingkan faskes sejenis, misalnya lama rawat yang jauh lebih panjang atau pasien yang keluar-masuk berulang. Setiap klaim dan faskes mendapat skor 0–100 beserta alasannya. Yang ketiga adalah dashboard untuk verifikator, yang mengurutkan klaim dari yang paling berisiko. Keputusan akhir tetap ada di tangan petugas BPJS, bukan AI. Ide pasien memeriksa tagihannya sendiri sudah dipakai Medicare di Amerika Serikat. Untuk pengembangan, kami memakai data dummy dan Data Sampel BPJS Kesehatan yang aksesnya sudah disetujui, tanpa data peserta asli, sesuai UU PDP.","Klaim yang mencurigakan bisa ditandai sebelum dibayar, sehingga pemeriksaan BPJS lebih tepat sasaran. Kalau kebocoran yang tercegah hanya 0,1% dari biaya layanan 2025, nilainya sudah sekitar Rp191 miliar per tahun. Pasien jadi tahu apa yang ditagihkan atas namanya, dan faskes yang jujur tidak ikut dicurigai. Karena berjalan sebagai menu di Mobile JKN dan sistem verifikasi yang sudah ada, SaksiKlaim bisa dikelola tim TI BPJS tanpa aplikasi baru."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Juliana","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2394","tim":"Elfar","inov":"CLAIMGUARD JKN \"Prevent Before Pending\"","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Proses klaim JKN telah didukung ekosistem digital seperti RME, SATUSEHAT, dan sistem klaim. Namun, risiko klaim masih dapat muncul sebelum submission, seperti ketidaklengkapan dokumen, ketidaksesuaian diagnosis, tindakan, coding, RME, billing, serta pola klaim yang tidak wajar. CLAIMGUARD JKN hadir sebagai lapisan pre-submission claim integrity untuk membantu fasilitas kesehatan menemukan dan memperbaiki risiko lebih awal sebelum klaim diajukan","CLAIMGUARD JKN bertujuan membantu fasilitas kesehatan mengidentifikasi, menjelaskan, dan memprioritaskan risiko klaim sebelum submission. Sistem mengintegrasikan data RME, diagnosis, tindakan, coding, billing, dokumen pendukung, dan historical claims untuk menghasilkan CLAIM INTEGRITY SCORE™, risk explanation, risk priority, dan recommended action. Keputusan akhir tetap dilakukan oleh human reviewer","CLAIMGUARD JKN adalah Pre-Submission Claim Integrity & Risk Intelligence yang menggunakan hybrid intelligence untuk menganalisis kualitas data, konsistensi antar-data, dan pola antar-klaim. Sistem menggabungkan Rule Engine, Consistency Engine, Similarity Engine, Anomaly Detection, dan Risk Scoring. Hasilnya berupa CLAIM INTEGRITY SCORE™ dan rekomendasi pemeriksaan, sehingga reviewer dapat melihat, memahami, dan memperbaiki risiko sebelum submission","CLAIMGUARD membantu fasilitas kesehatan menemukan risiko klaim lebih awal, memprioritaskan klaim yang perlu ditinjau, dan memperbaiki ketidaksesuaian sebelum submission. Dampaknya diharapkan berupa peningkatan kualitas klaim, efisiensi proses review, dan pengurangan pekerjaan korektif. Dalam jangka panjang, CLAIMGUARD mendukung pergeseran dari digital submission menuju intelligent submission dengan tetap mempertahankan human-in-the-loop"],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2397","tim":"ciuyyyy","inov":"SILANG","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["SILANG merupakan inovasi berbasis AI untuk mendeteksi indikasi phantom billing pada klaim fisioterapi JKN melalui integrasi data klaim, rekam medis, jadwal terapis, kehadiran pasien, dan kapasitas fasilitas. Dengan machine learning, cross-reference multi-tabel, analisis graf, serta LLM berbasis RAG, SILANG membantu menyajikan temuan berbasis bukti untuk mendukung verifikasi klaim yang lebih efektif dan transparan.","Tujuan inovasi SILANG adalah mengembangkan sistem berbasis AI untuk mendeteksi indikasi phantom billing pada klaim fisioterapi JKN melalui integrasi dan analisis lintas data, sehingga membantu meningkatkan efektivitas, transparansi, dan akurasi proses verifikasi klaim serta mendukung investigasi berbasis bukti.","SILANG mengintegrasikan machine learning, cross-reference multi-tabel, graph analytics, serta LLM berbasis RAG untuk mengidentifikasi anomali dan menghubungkan bukti pendukung klaim fisioterapi JKN. Hasil analisis disajikan melalui dashboard dan ringkasan investigasi sebagai bahan pemeriksaan oleh petugas berwenang. Prototipe saat ini menggunakan data sintetis dan memerlukan validasi lebih lanjut sebelum diterapkan pada data nyata.","SILANG berpotensi meningkatkan efektivitas verifikasi klaim, mempermudah penelusuran bukti pelayanan, dan membantu memprioritaskan klaim yang memerlukan pemeriksaan lebih lanjut. Inovasi ini diharapkan mendukung transparansi investigasi, mengurangi risiko pembayaran klaim yang tidak sesuai, serta memperkuat akuntabilitas pembiayaan JKN."],"r":[{"n":"Juliana","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2398","tim":"isikan dulu le","inov":"JAGA IURAN","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kepatuhan iuran JKN menghadapi tantangan berupa pendaftaran pekerja yang tidak menyeluruh (PDUK) dan pelaporan upah di bawah kondisi sebenarnya (under-reporting). Di sisi lain, keterbatasan petugas pemeriksa dan keandalan data iuran menyulitkan penentuan sasaran pemeriksaan. Dibutuhkan pendekatan berbasis data untuk mendeteksi indikasi risiko dan memprioritaskan pemeriksaan secara lebih tepat sasaran.","Mengembangkan rancangan sistem JAGA IURAN untuk membantu BPJS Kesehatan memprioritaskan pemeriksaan kepatuhan iuran badan usaha berdasarkan indikasi PDUK dan under-reporting upah. Sistem menggabungkan analisis kelompok sebaya, Isolation Forest, dan penjelasan berbasis LLM agar petugas dapat memahami indikasi risiko serta menentukan data yang perlu diverifikasi tanpa menjadikan skor sebagai vonis pelanggaran.","JAGA IURAN adalah sistem analitik risiko untuk memprioritaskan pemeriksaan kepatuhan iuran badan usaha melalui deteksi indikasi PDUK dan under-reporting upah. Sistem menggabungkan analisis kelompok sebaya, Isolation Forest, dan LLM untuk menghasilkan skor risiko, penjelasan indikasi, serta daftar verifikasi bagi petugas. Prototipe dirancang menggunakan data sintetis, dengan keputusan akhir tetap berada pada petugas pemeriksa.","JAGA IURAN diharapkan meningkatkan efisiensi pemeriksaan, membantu mendeteksi ketidakwajaran pelaporan pekerja dan upah, serta menjaga hak pekerja atas perlindungan JKN. Sistem juga mendukung integritas data iuran melalui prioritas pemeriksaan yang lebih tepat sasaran. Dampak nyata akan divalidasi melalui uji coba terbatas."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Juliana","s":null}]},{"id":"2402","tim":"varsa","inov":"PRO-CLAIM Sentinel: Deteksi Fraud Klaim FKRTL Tiga Lapis (Rule-Based, Machine Learning, dan LLM Loka","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kecurangan klaim (pahmtom billing dll) di fasilitas rujukan menggerus dana JKN. Pada data sampel FKRTL 2024 (1.699.219 klaim), kami menemukan 41.951 klaim anomali administratif senilai ±Rp 42,3 miliar dan 10.910 klaim (1,04%) tanpa rujukan FKTP sah, terkonsentrasi di segelintir RS (73% RS bersih). ML sendirian menandai 23,8% klaim: terlalu luas dan rawan salah-tuduh. AI cloud berisiko bagi kerahasiaan data pasien (UU PDP) dan mahal bila dipakai untuk semua klaim.","Menyaring seluruh klaim FKRTL sebelum dibayar dengan temuan yang dapat dijelaskan dan dihitung rupiahnya. 2) Memisahkan fakta pasti (rule-based) dari skor risiko (ML) agar tunda bayar punya dasar kuat. 3) Membaca resume medis hanya pada klaim berisiko tinggi memakai LLM lokal di infrastruktur BPJS, tanpa cloud. 4) Menjaga keputusan akhir di tangan verifikator BPJS.","PRO-CLAIM Sentinel adalah platform sisi BPJS berbentuk corong tiga lapis. Lapis 1 (rule-based): 13 aturan deterministik dan validasi rujukan FKRTL–FKTP 90 hari, misalnya pasien meninggal masih berobat, berobat di dua kab/kota sehari, diagnosis tak sesuai gender; menjadi dasar tunda bayar. Lapis 2 (ML): belasan detektor (Isolation Forest, XGBoost, MinHash LSH, Markov) mengurutkan risiko klaim, pasien, dan faskes sebagai prioritas, bukan vonis. Lapis 3 (LLM lokal + RAG PNPK/SOP): hanya klaim berisiko tinggi dibaca narasi klinisnya; selisih tarif INA-CBG dihitung Python, bukan model. Nilai lebih: (1) seluruh proses, termasuk LLM, berjalan lokal tanpa cloud, selaras UU PDP; (2) tiga lapis menekan biaya karena AI mahal hanya untuk sebagian kecil klaim; (3) temuan Lapis 1 bisa dibela; (4) verifikator memutuskan. Status: prototype, 28 detektor berjalan pada 1,7 juta klaim sampel.","Pemeriksaan bergeser dari sampling ke penyaringan seluruh klaim sebelum dibayar; verifikator menerima klaim berisiko beserta bukti dan selisih rupiah. RS jujur (73% sampel bersih) tidak terganggu, pasien kronis tidak salah-tuduh. Biaya komputasi rendah karena LLM hanya menangani bagian kecil klaim (target =10%, rancangan). Rp 42,3 miliar adalah potensi pada sampel; nilai terkonfirmasi diukur lewat pilot."],"r":[{"n":"Juliana","s":null},{"n":"Yanuar Milad","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2404","tim":"TINEERENSE (Tech Innovators & Next-gen E-health Engineers Resilient Defense)","inov":"ClaimTrace: Sistem Pendukung Keputusan Verifikator Klaim JKN Berbasis Triase Multi-Sinyal Independen","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Dengan 1,9 juta pemanfaatan layanan JKN per hari, verifikator BPJS Kesehatan menghadapi volume klaim masif dalam tenggat penerbitan berita acara 10 hari (Perpres 82/2018). Audit Kemenkes & KPK (Juli 2024) mengungkap potensi fraud Rp34 Miliar, termasuk temuan fisioterapi 75,3% di 3 RS khusus. Modus phantom billing dan repeat billing sulit dicegah jika verifikasi hanya bertumpu pada berkas klaim tunggal tanpa rekonsiliasi lintas episode, status kredensial nakes, dan konfirmasi kehadiran peserta.","Mengembangkan Decision Support System (DSS) pra-bayar guna membantu verifikator memprioritaskan penelaahan klaim JKN melalui triase tiga jalur (Hijau, Kuning, Merah). Solusi ini menggabungkan tiga sinyal independen: rekonsiliasi fingerprint klinis lintas episode, pemeriksaan status kredensial tenaga medis (simulasi SATUSEHAT SDMK), dan konfirmasi kehadiran peserta (simulasi Mobile JKN) untuk mendeteksi indikasi phantom billing (#6) dan repeat billing (#11) secara objektif dan transparan.","ClaimTrace bekerja sebagai penapisan pra-bayar komplementer bagi Vedika dan FRISTA melalui tiga lapis independen:\n\n1. Lapis 1 (Fingerprint Klinis): Memetakan hash invariant (peserta, tanggal, prosedur) vs administratif guna mendeteksi penagihan ulang (repeat billing) dan mutasi episode ID dari klaim yang telah dibayar.\n2. Lapis 2 (Kredensial Tenaga Medis): Memvalidasi keaktifan izin nakes (simulasi SATUSEHAT SDMK) guna mencegah pencatutan nama dokter inaktif.\n3. Lapis 3 (Konfirmasi Peserta): Memvalidasi kehadiran via Mobile JKN serta evaluasi kronologis tanggal layanan vs tanggal kematian (Dukcapil).\n\nEngine Triase memadukan skor tertimbang S = 0,5(S1) + 0,3(S2) + 0,2(S3), dilengkapi Single-Layer Guardrail (S1 >= 70) dan hard triggers. Output berupa rekomendasi terukur: Jalur Hijau (pemrosesan cepat), Jalur Kuning (klarifikasi verifikator), dan Jalur Merah (pencegahan pra-bayar & audit lapangan) dengan jejak audit alasan lengkap.","Pada benchmark holdout 3.002 data sintetis, 85,91% klaim diarahkan ke Jalur Hijau (setara 95,17% klaim sah sintetis), memusatkan telaah verifikator pada 14,09% antrean dengan rasio anomali sintetis 69,03%. Jalur Merah mencapai Precision 100% dan FPR 0% (tanpa klaim sah terblokir). Solusi ini berpotensi mengoptimalkan fokus verifikasi pra-bayar, melindungi dana amanah DJS dari kebocoran klaim fiktif, serta melindungi identitas peserta dari penyalahgunaan."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2406","tim":"Nama Tim Wajib Diisi","inov":"PILAR-JKN by Nama Tim Wajib Diisi","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Perusahaan yang sudah terdaftar di BPJS Kesehatan belum tentu mendaftarkan seluruh pekerjanya. Di Kota Padang (Okt 2025), 255 perusahaan belum mendaftarkan 3.386 pekerja. Pemeriksaan BPK 2021-2023 mencatat 222.064 pekerja belum ditindaklanjuti dengan potensi iuran Rp352,38 miliar. Masalahnya, data lintas sumber tidak sinkron dan hasil pemadanan hanya berupa daftar selisih tanpa prioritas, sehingga petugas harus mengecek manual satu per satu.","Membantu petugas BPJS Kesehatan mengubah daftar selisih data kepesertaan menjadi kasus yang siap diverifikasi. Secara khusus: mencocokkan identitas pekerja lintas sumber data, memprioritaskan badan usaha berdasarkan risiko dan kekuatan bukti, serta menyajikan ringkasan kasus agar telaah awal lebih cepat. Tujuan akhirnya melindungi akses pekerja ke layanan JKN dan menjaga integritas iuran.","PILAR-JKN adalah sistem pendukung keputusan berbasis web untuk petugas BPJS Kesehatan. Sistem memadankan data pekerja lintas sumber, memeriksa aturan kepesertaan, lalu memakai Isolation Forest untuk mendeteksi pola janggal dan menyusun antrean prioritas. Tiap kasus tampil dalam satu halaman beserta alasan skornya. Model hanya memberi indikasi, keputusan tetap di petugas. Saat ini berupa mockup Streamlit dengan data sintetis.","Bagi petugas: telaah awal lebih cepat, bukti lebih jelas, prioritas terarah. Bagi pekerja: peluang lebih besar terdeteksi bila belum terdaftar, sehingga akses JKN terjaga. Bagi pemberi kerja: pendekatan berbasis bukti, bukan tuduhan. Bagi sistem JKN: integritas iuran dan tindak lanjut membaik. Target uji pada data sintetis (belum tercapai): presisi identitas =98%, top-20 =75%, waktu telaah turun =25%."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2407","tim":"Logical Gateway","inov":"ClaimEcho: Dengar Gema Klaim FKRTL yang Tidak Wajar","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim fiktif dan berulang di FKRTL itu nyata: penelusuran 9 faskes oleh KPK, BPJS Kesehatan, Kemenkes, dan BPKP (2024) menemukan 3 rumah sakit terbukti fraud dengan taksiran kerugian Rp35 miliar, dan KPK mengidentifikasi 175.774 potensi fraud klaim FKRTL. Pola lintas klaim dan lintas faskes masih ditelusuri sendiri-sendiri, jadi waktu verifikator susah terarah ke klaim paling janggal. Padahal JKN dibiayai iuran bersama, jadi tiap klaim yang nggak sesuai ikut menggerus dana layanan nyata.","Bantu verifikator BPJS Kesehatan dan tim PK-JKN menyaring klaim FKRTL lebih awal: menandai klaim yang berulang, tumpang tindih, atau nggak ada jejak pendukungnya, lalu mengurutkannya jadi antrean tinjau berprioritas lengkap dengan alasan tertulis yang bisa dicek. Fokusnya efisiensi dan integritas, bukan nuduh. Penanda cuma berarti klaim perlu ditinjau; yang memutuskan tetap verifikator.","ClaimEcho adalah dasbor web buat verifikator. Data klaim FKRTL (sekitar 15 kolom, ID peserta pseudonim, tanpa nama dan NIK) dinilai dua lapis. Lapis 1 berisi lima gema berbasis aturan terbuka: Ulang (layanan sama diklaim lagi sebelum jeda minimum), Ganda (rawat inap tumpang tindih di dua faskes), Kembar (4 berkas atau lebih berpola klinis sama persis di satu faskes dalam 90 hari), Volume (kasus per DPJP atau per wilayah kebanyakan), dan Sunyi (nggak ada rujukan/IGD dan catatan penunjang). Layanan terjadwal seperti dialisis punya ambang sendiri. Lapis 2 memberi skor anomali faskes (robust z-score) supaya klaim dari faskes yang mencolok naik prioritasnya. Hasilnya antrean tinjau berisi kartu kasus beralasan; verifikator tinggal pilih perlu verifikasi, wajar, atau eskalasi. Saat ini kami di tahap mockup dengan rancangan aturan yang siap dibangun; pengujian awal direncanakan di data sintetis, tanpa data JKN riil.","Sekarang pola lintas klaim ditelusuri sendiri-sendiri. Dengan ClaimEcho, verifikator dapat satu antrean berprioritas lengkap dengan alasan tertulis, jadi waktu mereka lebih terarah ke klaim paling janggal. Dampak ini masih target dan belum terbukti. Saat pilot berizin kami ukur: precision di K kasus teratas oleh verifikator, waktu tinjau per kasus, alarm keliru per periode, dan nilai klaim terkoreksi (Rp). Manfaatnya: dana iuran lebih terjaga dan faskes jujur ditinjau lebih tertarget."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Yanuar Milad","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2412","tim":"podjok","inov":"CareGap Detective","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Verifikasi klaim obat dan alat kesehatan dalam program JKN memerlukan pencocokan resep, catatan penyerahan obat, dan dokumen klaim. Data yang tersebar dapat menyulitkan pemeriksaan dan memperlambat identifikasi ketidaksesuaian. Melalui CareGap Detective, tim Podjok mengusulkan sistem berbantuan AI untuk mencocokkan data, menampilkan bukti, dan menandai kasus yang memerlukan klarifikasi. Sistem ini mendukung efisiensi verifikasi tanpa menetapkan kecurangan secara otomatis.","Membantu proses pemeriksaan klaim layanan obat dengan mencocokkan resep, catatan penyerahan obat, dan dokumen pendukung untuk mengidentifikasi selisih yang memerlukan klarifikasi. Solusi ini bertujuan meningkatkan keterlacakan bukti, membantu reviewer memprioritaskan pemeriksaan, serta mengurangi risiko ketidaksesuaian dokumentasi tanpa secara otomatis menyimpulkan terjadinya kecurangan.","CareGap Detective adalah prototipe sistem pendukung verifikasi klaim obat yang dirancang untuk membantu petugas mencocokkan resep, catatan penyerahan obat, dan dokumen klaim dalam satu episode pelayanan. Sistem menggunakan ekstraksi informasi berbantuan AI untuk mengenali nama obat, kekuatan, bentuk sediaan, dan jumlah, kemudian mencocokkannya menggunakan aturan yang mempertimbangkan perbedaan data, perubahan resep, penyerahan bertahap, pengembalian obat, dan kelengkapan bukti. Jika ditemukan ketidaksesuaian, sistem menampilkan perbandingan data, sumber bukti, serta pertanyaan klarifikasi yang dapat ditindaklanjuti petugas. Perbedaan tidak langsung dianggap sebagai kecurangan; kasus dengan bukti yang belum memadai ditandai sebagai “data tidak cukup” atau “perlu klarifikasi”. Keputusan akhir tetap berada pada petugas berwenang. Pada tahap awal, prototipe diuji menggunakan data sintetis untuk mengevaluasi ketepatan pencocokan dan potensi pengurangan waktu pemeriksaan.","CareGap Detective diharapkan dapat membantu meningkatkan efisiensi verifikasi klaim obat melalui pencocokan data yang lebih terstruktur, sehingga petugas dapat lebih cepat mengidentifikasi ketidaksesuaian dan memprioritaskan kasus yang memerlukan pemeriksaan lanjutan. Bagi fasilitas kesehatan, sistem ini dapat membantu meningkatkan keterlacakan dokumen dan mempermudah proses klarifikasi. Bagi BPJS Kesehatan, sistem berpotensi mendukung identifikasi risiko klaim melalui bukti yang lebih terorgani"],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Juliana","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2426","tim":"ClaimGuard","inov":"CONTINUOUS CROSS-VERIFICATION ENGINE (CCVE)","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN mengelola klaim faskes Rp150+ T/tahun. Verifikasi retrospektif pasca-bayar (pay-and-chase) memiliki kelemahan fatal: penarikan kembali dana (clawback) sulit dengan keberhasilan hanya 30-50%, memicu kebocoran permanen DJS Kesehatan. Selain itu, audit manual per-klaim sering gagal menangkap pola fraud berulang antar-klaim dan faskes. Diperlukan sistem verifikasi pra-bayar berbasis risk intelligence yang transparan dan explainable untuk memetakan 20 modus risiko Permenkes 16/2019.","1. Mengembangkan CCVE sebagai augmented intelligence layer pra-bayar yang melengkapi vClaim/PCare untuk memprioritaskan klaim berisiko tinggi sebelum dibayar.\n2. Menyederhanakan 20 subkategori risiko faskes ke 4 keluarga risiko (Value, Episode, Existence, Fund Flow) via hybrid ML/AI.\n3. Menyediakan skor risiko kumulatif faskes & explainable AI (Case Dossier) bagi verifikator.\n4. Menjaga keadilan faskes jujur via presisi tinggi, peer-group comparison, & portal sanggahan.","Continuous Cross-Verification Engine (CCVE) adalah solusi pre-payment risk intelligence 3 lapis:\n\n1. Lapis 1 (Contextual Claim Verification): Screening real-time (<200ms) klaim vs acuan tarif INA-CBG di titik pengajuan tanpa mengganggu produksi.\n2. Lapis 2 (Unified Risk Scoring): Menganalisis klaim via 4 modul (Value, Episode, Existence, Fund Flow) memakai rule-based, Stacking Ensemble (GB, RF, LR), & Isolation Forest untuk skor klaim & akumulasi risiko faskes longitudinal.\n3. Lapis 3 (Explainable Support): Menyajikan Case Dossier berbasis Explainable AI (reason code & kontribusi fitur) untuk memandu keputusan verifikator (human-in-the-loop).\n\nSistem memakai strategi decoupling (sinkron <200ms & asinkron batch), enkripsi AES-256, hashing NIK, dan WORM Audit Ledger. Prototipe fungsional teruji pada 12.000 klaim sintetis dari 30 faskes.","1. Pre-Payment Protection: Mengubah verifikasi ke pra-bayar, mencegah kebocoran kas DJS sebelum dana keluar (simulasi moderat: hemat ~Rp2,7 T/tahun, ROI 28,8:1).\n2. Efisiensi Verifikator: Memangkas waktu review berkas dari ~19,5 ke ~3,5 menit/berkas (82%) berkat Case Dossier terstruktur.\n3. Prioritas Review: Prioritisasi audit presisi berbasis facility risk index & priority queue.\n4. Keadilan Faskes: Presisi tinggi (99,02%), peer-group comparison, & Portal Sanggahan melindungi faskes jujur."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Djaka Santosa","s":null},{"n":"Juliana","s":null}]},{"id":"2431","tim":"JKNova","inov":"Verifymed AI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Phantom billing dapat disebabkan karena kurangnya akurasi pengkodean, adanya kesempatan, adanya rasionalisasi atau adanya kemampuan untuk melakukan fraud.\nKasus: 3 RS Swasta di Jawa Tengah dan Sumatera Utara\nPada 2024, Kemenkes/KPK mengungkap dugaan fraud pada layanan JKN di beberapa rumah sakit.\nUntuk layanan fisioterapi:\n•\t4.341 kasus diklaim \n•\thanya 1.071–1.072 kasus yang memiliki rekam medis \n•\tsekitar 3.269 kasus (75,3%) diduga fiktif \n•\tnilai klaim yang dipersoalkan sekitar Rp 34 Milyar.","- Mendeteksi pola anomali klaim JKN \n- Mengidentifikasi klaim, fasilitas, dan wilayah dengan indikasi risiko tinggi\n- Menggabungkan berbagai indikator menj
