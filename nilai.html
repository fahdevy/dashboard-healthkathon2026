im palsu) dan *repeat billing* (klaim berulang), dapat mengurangi efisiensi pengelolaan dana dan berpotensi membebani proses verifikasi.\n\nVolume klaim yang besar membuat pemeriksaan manual terhadap seluruh klaim menjadi tidak efisien. Pada beberapa kasus, ketidaksesuaian baru dapat diketahui","1. Mengembangkan Seeklaim sebagai solusi berbasis AI untuk mendeteksi dini klaim berisiko, khususnya *phantom billing* dan *repeat billing* pada fasilitas kesehatan.\n\n2. Membantu verifikator BPJS Kesehatan memprioritaskan klaim yang berisiko tinggi melalui pemberian skor risiko dan alasan yang dapat ditelusuri.\n\n3. Meningkatkan efisiensi proses verifikasi klaim dengan mengarahkan pemeriksaan manusia pada klaim yang paling membutuhkan perhatian.\n\n4. Mendukung perlindungan dana JKN dengan mencegah","Seeklaim merupakan solusi berbasis AI yang dirancang untuk membantu mendeteksi dini klaim berisiko pada fasilitas kesehatan, dengan fokus pada phantom billing dan repeat billing. Seeklaim menganalisis setiap klaim melalui tiga lapis deteksi, yaitu pemeriksaan duplikasi klaim, pencocokan klaim dengan jejak layanan seperti kunjungan, resep, obat, dan pemeriksaan penunjang, serta deteksi pola anomali menggunakan AI.\n\nHasil analisis kemudian menghasilkan skor risiko 0–100 beserta alasan yang menjelaskan faktor penyebabnya. Klaim dengan risiko tinggi akan diprioritaskan dalam dashboard sehingga verifikator BPJS Kesehatan dapat memfokuskan pemeriksaan pada klaim yang paling membutuhkan perhatian. Keputusan akhir tetap berada pada verifikator, sementara umpan balik hasil verifikasi dapat digunakan untuk meningkatkan sistem.\n\nDengan pendekatan tersebut, Seeklaim bertujuan meningkatkan efisiensi verifikasi, memberikan peringatan dini sebelum klaim dibayarkan, serta membantu melindungi dana JKN","Implementasi Seeklaim diharapkan memberikan dampak pada efisiensi dan integritas proses verifikasi klaim JKN. Dengan memberikan skor risiko dan memprioritaskan klaim yang berpotensi bermasalah, verifikator dapat lebih fokus memeriksa klaim berisiko tinggi dibandingkan memeriksa seluruh klaim secara merata.\n\nBagi BPJS Kesehatan, Seeklaim berpotensi mempercepat proses verifikasi dan memberikan peringatan dini sebelum klaim dibayarkan. Bagi fasilitas kesehatan yang jujur, sistem dapat membantu meng"],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Juliana","s":null}]},{"id":"2855","tim":"Kanjuruhan 4","inov":"Rekonsiliasi Kepesertaan Pekerja dalam Program Jaminan Kesehatan Nasional","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2855_Proposal_PekerjaTerjaga_Healthkathon_2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Perbedaan antara daftar pekerja aktif dan catatan kepesertaan JKN dapat menyulitkan pemeriksaan pendaftaran serta mutasi pekerja. Diperlukan alat bantu untuk menemukan selisih dan menelusuri penyebabnya.","Merancang PekerjaTerjaga untuk membantu petugas mencocokkan data pekerja dan kepesertaan, menjelaskan selisih, serta mencatat klarifikasi dan tindak lanjut.","PekerjaTerjaga dirancang untuk menghasilkan tiga status: sesuai pada data tersedia, perlu klarifikasi, dan belum dapat dinilai. Setiap temuan disertai alasan untuk diperiksa petugas. Solusi saat ini berupa rancangan dan mockup, dengan pengembangan prototipe menggunakan data sintetis.","Solusi diharapkan mempercepat pemeriksaan, mempermudah koreksi data kepesertaan, dan mendukung kepatuhan pemberi kerja. Dampaknya akan diuji melalui waktu pemeriksaan, ketepatan temuan, dan penyelesaian klarifikasi."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2856","tim":"Kelompok Dua Tranformasi Pemerintahan","inov":"SIPEKA: Sistem Informasi Pekerja, Kepesertaan, dan Aduan","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2856_Proposal_SIPEKA_Healthkathon_2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Dalam kepesertaan JKN pekerja penerima upah, perusahaan bertanggung jawab mendaftarkan pekerja, melaporkan upah, dan membayar iuran. Namun, pekerja sulit mencocokkan slip gaji dan hubungan kerjanya dengan data JKN. Akibatnya, pekerja yang belum terdaftar, selisih upah atau iuran, serta keterlambatan pembaruan data dapat terlambat diketahui dan sulit ditindaklanjuti. Diperlukan mekanisme pemeriksaan dan klarifikasi tanpa langsung menyimpulkan adanya pelanggaran.","SIPEKA bertujuan membantu pekerja memantau kesesuaian data kepesertaan JKN dengan kondisi kerjanya, mendeteksi potensi ketidaksesuaian lebih dini, serta mengajukan laporan berbukti. Sistem ini juga menyediakan alur klarifikasi bagi perusahaan dan peninjauan bagi petugas BPJS Kesehatan, dengan status tiket yang dapat dipantau hingga selesai.","SIPEKA (Sistem Informasi Pekerja, Kepesertaan, dan Aduan) adalah prototipe platform digital untuk menghubungkan pekerja, perusahaan, dan petugas BPJS Kesehatan dalam penanganan ketidaksesuaian administrasi JKN. Pekerja memilih periode, melihat status kepesertaan, dan membandingkan data kerja, upah, potongan, serta catatan iuran. Jika ada perbedaan, pekerja dapat mengirim tiket beserta bukti dan memantau tindak lanjutnya. Perusahaan memeriksa data terkait dan memberikan klarifikasi; petugas BPJS meninjau bukti, meminta informasi tambahan bila perlu, lalu mencatat hasil dan mengubah status tiket. Pencocokan data menghasilkan sinyal yang disertai alasan, bukan vonis pelanggaran otomatis. Prototipe saat ini menggunakan data sintetis dan belum terhubung dengan sistem resmi BPJS Kesehatan.","SIPEKA diharapkan meningkatkan transparansi bagi pekerja, membantu perusahaan menemukan dan mengklarifikasi perbedaan data lebih cepat, serta memberi petugas BPJS Kesehatan kasus yang lebih terstruktur untuk diprioritaskan. Jejak bukti, komunikasi, dan status tiket yang terdokumentasi dapat mengurangi laporan berulang dan mendukung penanganan risiko kepesertaan JKN secara lebih efisien."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2864","tim":"Tim Hebat","inov":"Healthkathon","kat":"Efisiensi Risiko pada Peserta JKN","f":"2864_PTTD_Propo HealthKathon.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN memiliki cakupan peserta dan fasilitas kesehatan yang sangat besar, sehingga pemantauan pola pemanfaatan layanan, obat, dan alat kesehatan menjadi tantangan. Risiko seperti penggunaan layanan berulang yang tidak sesuai kebutuhan serta penggunaan obat atau alat kesehatan yang perlu ditinjau dapat menyebabkan pemborosan sumber daya. Saat ini, riwayat pemanfaatan belum selalu mudah dianalisis secara menyeluruh karena data dapat tersebar di berbagai sumber. Oleh karena itu, dibutuhkan so","Mengembangkan CareSync sebagai sistem early warning yang mengintegrasikan riwayat pemanfaatan layanan, obat, dan alat kesehatan peserta JKN untuk membantu fasilitas kesehatan mengenali pola yang perlu diverifikasi lebih awal. Sistem ini bertujuan meningkatkan efektivitas proses verifikasi, membantu petugas memprioritaskan kasus berisiko, serta mendorong pemanfaatan layanan kesehatan yang lebih tepat dan efisien.","CareSync merupakan JKN Utilization Early Warning System yang mengintegrasikan data riwayat layanan, obat, dan alat kesehatan dari JKN serta rumah sakit mitra. Data tersebut diproses untuk mengenali pola berdasarkan frekuensi pemanfaatan, interval waktu, pola penggunaan obat, serta kombinasi layanan dan obat. Hasil analisis ditampilkan sebagai peringatan dini yang dilengkapi pola dan riwayat pendukung agar petugas dapat melakukan verifikasi secara lebih terarah. CareSync tidak secara otomatis menetapkan suatu kasus sebagai fraud atau menolak pelayanan, karena keputusan akhir tetap berada pada petugas melalui proses verifikasi dan human-in-the-loop","CareSync memberikan dampak dengan mengubah proses pemantauan dari yang sebelumnya bersifat reaktif menjadi lebih preventif melalui deteksi pola secara dini. Bagi fasilitas kesehatan, sistem membantu mengurangi penelusuran data secara manual dan meningkatkan efektivitas verifikasi. Bagi BPJS Kesehatan, kasus yang memerlukan perhatian dapat diprioritaskan sehingga sumber daya verifikator digunakan lebih terarah. Bagi peserta JKN, pemanfaatan layanan dapat menjadi lebih terkontrol tanpa menghilangk"],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Susi Lusiani","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"1993","tim":"AyikTech","inov":"CLAIMGUARD AI – Evidence-Based Claim Risk Detection","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"1993_CLAIMGUARD_AI_Healthkathon_2026_Final.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN membutuhkan pengelolaan klaim yang akurat, efisien, dan berintegritas. Salah satu risikonya adalah phantom dan repeat billing, yaitu klaim atas layanan yang tidak diberikan atau diajukan berulang. Kompleksitas data pelayanan membuat pemeriksaan dokumen secara terpisah kurang optimal. CLAIMGUARD AI menghubungkan data klaim dengan bukti pelayanan untuk mendeteksi anomali lebih dini dan memprioritaskan klaim yang perlu diverifikasi.","CLAIMGUARD AI bertujuan membangun sistem early-warning berbasis AI untuk mendeteksi risiko phantom dan repeat billing pada klaim JKN dengan menghubungkan data klaim dan bukti pelayanan. Sistem membantu memprioritaskan klaim yang perlu diverifikasi, memberikan penjelasan faktor risiko, mempercepat screening, dan mendukung reviewer mengambil keputusan berbasis evidence melalui mekanisme human-in-the-loop.","CLAIMGUARD AI merupakan sistem AI-powered Claim Integrity & Early Warning untuk membantu mendeteksi risiko phantom dan repeat billing pada klaim JKN. Sistem menghubungkan data klaim dengan bukti pelayanan seperti rekam medis, encounter, diagnosis, tindakan, data provider, jadwal pelayanan, dan riwayat klaim. Data dianalisis melalui rule-based validation, anomaly detection, similarity detection, dan risk scoring untuk menghasilkan Claim Risk Score 0–100. Fitur Evidence Graph menampilkan hubungan klaim dengan evidence serta alasan munculnya risiko. Klaim dikategorikan Low, Medium, atau High Risk untuk membantu reviewer memprioritaskan verifikasi. CLAIMGUARD AI bersifat decision-support: AI memberikan early warning, sedangkan keputusan akhir tetap dilakukan oleh manusia.","CLAIMGUARD AI diharapkan meningkatkan efisiensi dan integritas proses klaim dengan mempercepat screening, memprioritaskan klaim berisiko, serta membantu menemukan indikasi phantom dan repeat billing lebih dini. Dampak diukur melalui precision/recall, false positive rate, waktu screening dan investigasi, kelengkapan evidence chain, serta potensi nilai klaim berisiko yang teridentifikasi."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2076","tim":"REIIIXX","inov":"MedTrack","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2076_MedTrack (1).pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Latar belakang MedTrack mencakup tiga masalah utama: kelangkaan informasi rujukan alkes antar-rumah sakit secara manual, ketidaksinkronan pencatatan logistik yang memicu inflated bills, serta risiko integritas JKN akibat potensi klaim ganda atau fiktif. Masalah ini diperparah oleh potensi fraud kesehatan yang masif dan tingginya selisih antara klaim dengan rekam medis, sehingga dibutuhkan validasi klaim otomatis secara real-time.","Mencegah Kebocoran Dana JKN: Mengalihkan pendekatan pengawasan dari audit reaktif (post-hoc audit) menjadi validasi preventif (pre-claim validation) guna menutup celah kecurangan atau klaim fiktif pada alat kesehatan.\nMempercepat Rujukan & Transparansi: Menyediakan akses informasi ketersediaan alat kesehatan secara real-time antar-rumah sakit untuk memangkas proses rujukan manual yang lambat.\nEfisiensi Pengelolaan Faskes: Membantu fasilitas kesehatan dan verifikator BPJS dalam mengontrol inventa","MedTrack adalah platform digital terpusat yang dirancang untuk menghadirkan transparansi stok alat kesehatan (real-time) serta otomatisasi audit klaim Jaminan Kesehatan Nasional (JKN).\n\nSistem ini mengintegrasikan tiga komponen utama:\n\nDashboard Monitoring & Logistik: Menyajikan data ketersediaan alkes antar-rumah sakit dan pencatatan transaksi penggunaan berbasis timestamp.\n\nModel Machine Learning & Aturan Inventaris: Memanfaatkan algoritma seperti XGBoost/LightGBM untuk mendeteksi anomali/potensi klaim ganda (cloning), Prophet untuk memproyeksikan tren kebutuhan stok, serta rumus Reorder Point (ROP) untuk peringatan restock otomatis.\n\nValidasi Pra-Klaim (Pre-Claim Validation): Mencocokkan data klaim biaya dengan pemakaian fisik riil sebelum diajukan ke BPJS Kesehatan, sehingga verifikasi menjadi lebih akurat tanpa mengabaikan keputusan akhir yang tetap berada di tangan verifikator manusia (human-in-the-loop).","MedTrack adalah platform transparansi stok alat kesehatan (alkes) real-time dan validasi pra-klaim JKN. Latar belakangnya didasari kelangkaan informasi rujukan alkes antar-RS, ketidaksinkronan pencatatan yang memicu inflated bills, serta tingginya potensi fraud JKN. Tujuannya mencegah kebocoran dana JKN secara preventif, mempercepat rujukan, dan mengotomatisasi audit. Dampaknya, pasien mendapat rujukan lebih cepat, faskes efisien mengelola stok, dan BPJS mampu menekan klaim fiktif."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Juliana","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2189","tim":"Alamak","inov":"KlaimGuard: Deteksi Dini Fraud Upcoding & Unbundling Klaim JKN Berbasis Machine Learning","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2189_Healthkaton2026_Tim_Alamak.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Manipulasi diagnosis (Upcoding) dan pemecahan prosedur (Unbundling) di rumah sakit rujukan berpotensi menguras kas Dana Jaminan Sosial Rp6 triliun per tahun (KPK). Pelanggaran regulasi Permenkes No. 36/2015 ini belum teratasi akibat proses verifikasi yang masih mengandalkan pemeriksaan manual berurutan tanpa pembobotan risiko, serta audit yang terlambat karena baru dilakukan setelah pembayaran selesai dan menimbulkan konflik penagihan kembali.","Proposal ini bertujuan menghentikan kebocoran Dana Jaminan Sosial melalui penapisan otomatis pra-pencairan yang bekerja instan tanpa menghambat likuiditas rumah sakit. Selain itu, sistem dirancang meningkatkan efisiensi verifikator medis dengan memusatkan telaah manual hanya pada 35% berkas berisiko anomali, serta mempercepat penyelesaian sengketa klaim faskes secara adil berlandaskan regulasi resmi Kemenkes.","KlaimGuard adalah sistem verifikasi klaim otomatis yang memeriksa tagihan rumah sakit sebelum pembayaran dicairkan melalui penapisan terpadu: menolak pemecahan paket tindakan operasi yang dilarang dipisah (Unbundling) sesuai Permenkes No. 76/2016, memvalidasi keabsahan diagnosis penyakit berat terhadap bukti riil hasil lab dan terapi dokter guna mencegah penulisan kode berlebihan (Upcoding), memeringkat antrean berkas paling mencurigakan berdasarkan kewajaran rasio biaya dan lama rawat inap, serta membuat draf surat sanggahan resmi lengkap dengan rujukan pasal Kementerian Kesehatan. Pemrosesan instan 1 detik per berkas menjamin pengawasan kas jaminan sosial berjalan ketat tanpa mengganggu arus kas rumah sakit, menempatkan verifikator medis sebagai penentu keputusan final, dan menjaga privasi data peserta sesuai UU Perlindungan Data Pribadi.","Inovasi ini berpotensi menyelamatkan dana jaminan sosial Rp600–900 miliar per tahun melalui reduksi kebocoran klaim 10%–15%. Selain itu, sistem meringankan beban verifikator dengan memusatkan telaah pada 35% berkas berisiko, mempercepat pencairan dana bagi rumah sakit atas klaim yang layak bayar, serta melindungi hak pasien dengan mencegah manipulasi rawat inap fiktif agar ketersediaan tempat tidur rumah sakit tetap terjaga."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2278","tim":"Unlimited","inov":"ARAH JKN: Asisten Rute Akses Kesehatan Berbasis AI untuk Efisiensi Pelayanan JKN","kat":"Efisiensi Risiko pada Peserta JKN","f":"2278_Proposal Healthackathon_Unlimited.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Peserta JKN masih dapat menghadapi ketidakpastian dalam menentukan jalur pelayanan ketika mengalami keluhan kesehatan seperti apakah perlu ke IGD, FKTP, atau membutuhkan rujukan. Di sisi lain, informasi JKN sudah tersedia melalui berbagai kanal, tetapi peserta tetap perlu memahami informasi mana yang relevan dengan kondisi yang dialami. Ketidakpastian dalam menentukan jalur pelayanan dapat meningkatkan risiko pemanfaatan pelayanan yang tidak perlu.","Mengembangkan ARAH JKN sebagai asisten navigasi berbasis AI yang membantu peserta memahami dan menentukan jalur pelayanan JKN sebelum berobat. ARAH JKN menerjemahkan keluhan dan konteks peserta menjadi panduan jalur pelayanan, informasi fasilitas yang relevan, serta langkah berikutnya secara aman, transparan, dan sesuai aturan yang berlaku.","ARAH JKN (AI-Powered JKN Care Pathway Navigator) adalah platform navigasi pelayanan JKN berbasis percakapan melalui WhatsApp. Peserta dapat menceritakan keluhan dan menjawab pertanyaan kontekstual yang relevan. Sistem kemudian memanfaatkan Large Language Model (LLM), Retrieval-Augmented Generation (RAG), knowledge JKN yang tervalidasi, serta aturan keselamatan dan jalur pelayanan untuk menghasilkan panduan yang dapat ditelusuri. ARAH JKN membantu peserta memahami jalur pelayanan yang relevan, memberikan alasan dan langkah berikutnya, serta menawarkan pilihan fasilitas sesuai kebutuhan. ARAH JKN tidak mendiagnosis, memberikan resep, atau menggantikan keputusan tenaga kesehatan. Pengembangan dilakukan secara bertahap melalui prototype, validasi bersama tenaga kesehatan, dan pilot terbatas sebelum integrasi lebih lanjut dengan ekosistem JKN.","ARAH JKN diharapkan meningkatkan pemahaman peserta terhadap jalur pelayanan dan membantu mereka mengambil langkah yang lebih tepat sebelum berobat. Dengan navigasi yang lebih jelas, solusi ini berpotensi mengurangi risiko pemanfaatan pelayanan yang tidak perlu, memperbaiki pengalaman perjalanan layanan peserta, serta mendukung efisiensi pemanfaatan sumber daya JKN. Dampak akan divalidasi melalui indikator navigasi, keselamatan, pemahaman pengguna, dan utilisasi layanan pada tahap pilot."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2312","tim":"Walet","inov":"HealthVision","kat":"Efisiensi Risiko pada Peserta JKN","f":"2312_HealthVision_v3.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kepanikan peserta BPJS saat melihat perubahan fisik sering memicu keputusan yang kurang tepat. Hal ini membuat mereka mencari pelayanan medis yang belum diperlukan, atau sebaliknya, menunda pemeriksaan kondisi yang berisiko. Mobile JKN memang telah memiliki layanan AI seperti Tara AI, namun kapabilitas analisis visual langsung lewat kamera belum tersedia. Health Vision hadir untuk melengkapi informasi awal dengan bukti visual sebelum peserta menentukan langkah selanjutnya.","Health Vision bertujuan untuk memberikan informasi awal kesehatan berbasis bukti visual yang akurat, aman, dan kontekstual sebelum peserta menentukan langkah perawatan. Sistem ini dirancang untuk mengarahkan peserta apakah kondisinya cukup dipantau mandiri (Monitor) atau memerlukan konsultasi ke fasilitas kesehatan (Follow-Up). Dengan demikian, inovasi ini membantu mencegah penggunaan layanan medis yang tidak perlu tanpa membatasi hak akses peserta maupun menggantikan peran tenaga kesehatan.","Health Vision merupakan modul visual AI pre-screening yang dirancang untuk melengkapi ekosistem Mobile JKN. Peserta memilih area pemeriksaan mata, mulut, atau kulit/wajah kemudian mengambil foto. Sistem terlebih dahulu memeriksa kualitas gambar, lalu Specialist Vision Model menganalisis pola visual pada area tersebut. Jika masih diperlukan informasi tambahan, Medical Multimodal AI membantu menentukan konteks yang perlu ditanyakan kepada peserta, sebelum Policy Engine menghasilkan rekomendasi Monitor atau Follow-Up secara terstruktur. Seluruh proses dirancang sebagai stateless service, sehingga foto peserta tidak disimpan secara permanen. Selain itu, Health Vision menggunakan dataset-ready architecture, sehingga pada tahap pengembangan berikutnya model spesialis dapat diperbarui menggunakan dataset klinis yang tervalidasi tanpa harus mengubah keseluruhan arsitektur maupun menggunakan foto langsung peserta sebagai data pelatihan untuk melindungi privasi data.","Bagi peserta, Health Vision memberikan edukasi dan kejelasan informasi awal agar dapat mengambil keputusan kesehatan secara percaya diri. Bagi fasilitas kesehatan, modul ini mendukung triase yang efektif dan mengurangi kunjungan pasien yang belum memerlukan penanganan langsung. Dalam jangka panjang, sistem ini berdampak positif pada efisiensi pembiayaan program JKN melalui pengurangan beban biaya yang tidak perlu, sekaligus memperkuat upaya pencegahan penyakit dan literasi masyarakat."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2531","tim":"Lunaris Venya","inov":"LUMINA -Layanan Utama Monitoring Integritas Klaim & Deteksi Anomali Fasilitas Kesehatan JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2531_Lumina - Efisiensi Risiko Fasilitas Kesehatan (Healthkathon 2026) - Final.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN menaungi 3.221 rumah sakit rujukan dengan 725 juta kunjungan layanan pada 2025. Audit KPK-Kemenkes-BPJS 2024 menemukan 3 dari 6 rumah sakit sampel (50%) terbukti phantom billing, dari 4.341 tagihan fisioterapi, hanya 1.070 didukung catatan medis, berpotensi rugi Rp29,4 miliar dari satu RS (total Rp35 miliar). Klaim fiktif sulit terlihat sendiri, namun menonjol saat dibandingkan dengan pola sejawatnya, sementara audit manual hanya menjangkau sedikit faskes.","LUMINA bertujuan mendeteksi anomali klaim secara proaktif sebelum dana cair, menyisir seluruh klaim faskes secara sistematis, bukan sekadar sampel, tetapi menyediakan bukti objektif berbasis perbandingan statistik antar-faskes, serta meringankan beban tim investigasi BPJS Kesehatan dengan berkas kasus yang siap ditindaklanjuti dan dapat dipertanggungjawabkan secara transparan kepada seluruh pemangku kepentingan program JKN.","LUMINA adalah sistem deteksi risiko klaim berbasis analisis anomali statistik antar kelompok sebanding (peer-based anomaly detection), yang membandingkan pola klaim satu faskes dengan kelompok sebandingnya (faskes dan pasien berdemografi serta riwayat berobat serupa dari Sistem JKN). Alurnya mencakup deteksi sinyal, pembentukan peer-based, penyusunan profil dan skor risiko yang explainable, hingga tinjauan akhir oleh tim manusia. Seluruh pengembangan memakai data sintetis dengan identitas yang ditokenisasi.","LUMINA mengubah investigasi fraud JKN dari reaktif-manual menjadi proaktif-terbantu AI, sehingga dana JKN lebih terjaga untuk peserta jujur, faskes jujur terlindungi dari kecurigaan salah sasaran karena pembanding kontekstual, beban investigasi manual tim anti-fraud BPJS berkurang signifikan, dan alokasi dana JKN menjadi lebih tepat sasaran bagi keberlangsungan program secara keseluruhan."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Yanuar Milad","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2602","tim":"Mill Lane","inov":"KlaimSiaga: Asisten Triase Klaim JKN Berbasis Machine Learning dan Explainable AI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2602_Proposal_Healthkathon2026_KlaimSiaga_Faskes.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Timbunan ribuan berkas klaim rawat inap JKN harian menjadi tantangan utama verifikator BPJS Kesehatan. Berdasarkan regulasi dan temuan KPK, praktik upcoding dan unbundling berpotensi merugikan negara hingga ratusan miliar rupiah. Metode verifikasi manual maupun aturan kaku saat ini cenderung lambat dan minim penjelasan (black-box), sehingga memicu kelelahan pemeriksaan (alert fatigue) serta meningkatkan risiko ketidakadilan penilaian terhadap faskes rujukan.","Mengembangkan KlaimSiaga sebagai asisten triase berbasis AI guna membantu verifikator BPJS Kesehatan memprioritaskan peninjauan klaim rawat inap. Solusi ini bertujuan meningkatkan efisiensi pemeriksaan, menyajikan transparansi Explainable AI (XAI) di setiap indikasi anomali, serta menekan risiko kebocoran anggaran JKN dari praktik upcoding dan unbundling melalui pendekatan akuntabel berbasis kendali manusia (human-in-the-loop).","KlaimSiaga adalah platform triase digital berbasis machine learning untuk efisiensi risiko faskes pada klaim JKN rawat inap. Sistem ini mengombinasikan empat mekanisme deteksi tanpa label: prediksi severity klinis (usia, diagnosis sekunder, lama rawat), benchmark residual sekelas RS (z-score), pengenalan anomali Isolation Forest, dan aturan pencocokan unbundling. KlaimSiaga tidak memberikan vonis otomatis, melainkan mengurutkan klaim ke dalam antrean berperingkat risiko (skor 0-100) disertai penjelas Explainable AI (XAI) atas indikasi anomali. Verifikator memegang penuh kendali (human-in-the-loop) untuk menentukan keputusan: disetujui, klaim klarifikasi, atau eskalasi ke tim anti-fraud. Antarmuka berbasis Streamlit dan mematuhi UU PDP menggunakan data sintetis.","KlaimSiaga memangkas durasi verifikasi klaim berisiko tinggi dan mengurangi intensitas audit acak pada faskes yang patuh. Penggunaan pembanding sekelas RS mencegah bias sistemik terhadap rumah sakit rujukan dengan kompleksitas kasus tinggi. Lewat penjelasan XAI, keputusan verifikasi menjadi lebih transparan, objektif, meminimalisir alert fatigue, serta melindungi integritas dana JKN dari potensi kecurangan."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2739","tim":"CollsCode","inov":"Deteksi Fraud Identitas Peserta JKN Menggunakan Validasi Kemustahilan Spasial-Temporal","kat":"Efisiensi Risiko pada Peserta JKN","f":"2739_Nexus-ID_JKN___Healthkathon_2026_20261008021158.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Dengan 280 juta peserta JKN di seluruh Indonesia, penyalahgunaan identitas (sewa kartu dan kunjungan fiktif) merupakan fraud yang sangat sulit dideteksi. Namun, bukti kemustahilan ada pada data log kunjungan, jika satu ID berobat di Jakarta pukul 08:00 dan di Bali pukul 09:30 pada hari yang sama, klaim itu pasti fiktif. Secara fisika, tidak mungkin berpindah sejauh 1.090 km hanya dalam 1,5 jam. Data DJSN Tabel 4.6 & 5.6 bisa jadi baseline kalibrasi regional lewat variasi intensitas kunjungannya.","Membangun sistem deteksi penyalahgunaan identitas JKN yang mampu: (1) Menghitung jarak geografis antar-faskes pada ID pasien yang sama via formula Haversine; (2) Mengkalkulasi kecepatan mobilitas dari selisih jarak & waktu; (3) Mendeteksi kemustahilan spasial-temporal (kecepatan >300 km/h antar-provinsi atau >900 km/h) sebagai anomali. kritis; (4) Menghasilkan flag anomali matematis untuk bukti investigasi. (Data: Statistik JKN 2016–2021, diterbitkan oleh DJSN bersama BPJS Kesehatan 2022).","Nexus-ID JKN adalah sistem analitik spasial-temporal berbasis web MVP fungsional. Sistem menerima log kunjungan pasien dalam format CSV (ID Pasien, Faskes, Koordinat, Tanggal, Jam) dan menjalankan Haversine Distance Engine untuk menghitung jarak great-circle antar pasangan kunjungan berurutan per ID. Kecepatan implisit dihitung dengan formula v = d/t, di mana d adalah jarak Haversine dan t adalah selisih waktu. Threshold berlapis diterapkan: > 900 km/h dikategorikan MUSTAHIL FISIK (eskalasi langsung), 300–900 km/h SANGAT MENCURIGAKAN (verifikasi lanjutan), dan < 300 km/h lintas provinsi dalam < 4 jam MENCURIGAKAN (monitor). Kalibrasi regional menggunakan data intensitas kunjungan RJTP per provinsi dari DJSN untuk menyesuaikan threshold berdasarkan pola mobilitas normal daerah tersebut. Visualisasi utama adalah peta mobilitas Indonesia interaktif (D3.js SVG) dengan arc berwarna yang menampilkan setiap pergerakan ID — arc merah berputus-putus menandai kemustahilan fisika yang terdeteksi.","Nexus-ID JKN memanfaatkan hukum fisika sebagai validator mutlak yang bebas dari rekayasa administratif—tidak ada yang bisa hadir di dua lokasi bersamaan. Anomali terdeteksi merupakan bukti matematis pasti, bukan sekadar indikasi probabilistik. Sistem ini berpotensi mengidentifikasi ribuan penyalahgunaan aktif yang tidak terpantau, sekaligus menyelamatkan dana JKN dari klaim fiktif. Sebagai byproduct, sistem menghasilkan peta mobilitas kesehatan nasional sebagai dasar kebijakan distribusi faskes."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Juliana","s":null}]},{"id":"2742","tim":"SMILE","inov":"RADAR : Risk-base Alert for Detecting Anomalous Reporting","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2742_RADAR â€“ Proposal Healthkathon 2026 (1) (1).pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Iuran 38,3 juta peserta PPU badan usaha bergantung sepenuhnya pada laporan pemberi kerja. DJSN mencatat masih ada badan usaha yang tidak mendaftarkan seluruh pekerjanya atau melaporkan upah di bawah ketentuan, di tengah turunnya aset neto Dana JKN sebesar Rp11,8 triliun pada 2025. Pemeriksaan yang masih acak dan reaktif membuat ketidakpatuhan lolos, iuran hilang, dan pekerja baru tahu tidak terlindungi saat sakit.","Mendeteksi dini empat modus ketidakpatuhan pelaporan: pendaftaran pekerja sebagian (PDUK), pelaporan upah lebih rendah, misklasifikasi hubungan kerja, dan manipulasi data mutasi.\nMengubah pemilihan target pemeriksaan dari acak menjadi berbasis risiko yang dapat dijelaskan.\nMendukung petugas dari penentuan prioritas hingga tindak lanjut yang terdokumentasi.\nMeningkatkan iuran yang tertagih dan memastikan lebih banyak pekerja terlindungi sejak awal bekerja.","RADAR (Risk-based Alert for Detecting Anomalous Reporting) adalah sistem skor risiko kepatuhan pemberi kerja berbasis AI. RADAR menyilangkan data kepesertaan, upah, mutasi, dan iuran dengan data pembanding, lalu menilai setiap badan usaha terhadap usaha sejenis. Kombinasi 8 aturan regulasi dan machine learning (Isolation Forest) menghasilkan skor 0–100, tiga level risiko, dan tiga alasan untuk petugas. Dasbor radar membantu petugas menentukan prioritas, membuat action plan, dan mencatat log harian. Keputusan tetap di tangan petugas. Prototype sudah berfungsi dengan data sintetis.","Uji prototype pada data sintetis menunjukkan 92% dari 200 badan usaha berskor tertinggi memang berpola tidak patuh, jauh di atas 18% bila dipilih acak. Dengan jumlah pemeriksaan yang sama, selisih iuran yang ditemukan 4,9 kali lebih besar, dan hanya 2,2% badan usaha patuh yang salah tertandai. Hasilnya, pekerja terlindungi sejak awal bekerja, pemeriksaan BPJS Kesehatan lebih tepat sasaran, dan iuran JKN lebih banyak tertagih. Dampak nyata akan diukur saat pilot."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2820","tim":"Smart Triage Alkhairaat","inov":"Smart Triase JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2820_PROPOSAL INOVASI HEALTHKATHON 2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Transformasi JKN saat ini juga mengarah pada sistem rujukan yang lebih berorientasi pada kompetensi fasilitas dan kebutuhan medis pasien. \nDalam praktik pelayanan, terdapat dua risiko yang berlawanan.\nA. Over-referral\nPasien yang sebenarnya masih dapat ditangani di FKTP dirujuk ke rumah sakit.\nUnder-referral/delayed referral\nPasien dengan kondisi yang membutuhkan pelayanan lanjutan tidak segera dikenali atau dirujuk.","Mengembangkan sistem digital clinical risk stratification untuk membantu meningkatkan ketepatan alur pelayanan dan rujukan peserta JKN berdasarkan kebutuhan medis.","SMART-TRIAGE JKN dirancang untuk beberapa pengguna.\n1. Peserta JKN\nMenggunakan aplikasi untuk:\n•\tmelakukan pre-screening;\n•\tmemasukkan keluhan;\n•\tmendapatkan arahan awal;\n•\tmemperoleh QR Code hasil screening.\n2. FKTP\nDokter/tenaga kesehatan dapat:\n•\tmelihat hasil screening;\n•\tmelakukan verifikasi;\n•\tmelakukan pemeriksaan klinis;\n•\tmenetapkan keputusan akhir;\n•\tmeneruskan informasi pasien.\n3. Fasilitas Kesehatan Rujukan\nRumah sakit dapat menerima:\n•\tQR Code;\n•\tringkasan keluhan;\n•\tparameter klinis;\n•\thasil stratifikasi;\n•\talasan rujukan.\n4. Pengelola JKN\nPada tahap pengembangan lebih lanjut dapat memperoleh dashboard agregat untuk melihat pola risiko dan rujukan.","Jangka pendek\n•\tmemperbaiki proses triase;\n•\tmeningkatkan awareness red flags;\n•\tmembantu keputusan pelayanan;\n•\tmenghasilkan digital clinical summary.\nJangka menengah\n•\tmenurunkan inappropriate referral;\n•\tmeningkatkan ketepatan rujukan;\n•\tmengurangi waktu pelayanan.\nJangka panjang\n•\tmendukung sistem rujukan berbasis kompetensi;\n•\tmeningkatkan efisiensi JKN;\n•\tmenghasilkan data untuk population risk management."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Juliana","s":null}]},{"id":"2862","tim":"Power Ranger Merah","inov":"BuktiLayan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2862_BuktiLayan â€” Proposal Healthkathon 2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Temuan Itjen Kemenkes (2024) di 3 RS mencatat 3.269 dari 4.341 klaim fisioterapi diduga fiktif (Rp501,27 juta) karena ketiadaan rekam medis. Bukti kunjungan, tindakan, dan jadwal petugas kerap tersimpan terpisah dalam beragam format. Verifikator harus mencocokkan dokumen manual, memicu beban kerja dan risiko kekeliruan. Diperlukan alat bantu penelusuran bukti dalam ekosistem verifikasi klaim.","Membantu verifikator dan tim anti-fraud merekonsiliasi bukti sesi fisioterapi secara terarah; menghadirkan ketertelusuran per sesi dengan kutipan sumber dokumen asli; mendeteksi ketidaksesuaian bukti lebih dini sebelum eskalasi klaim; serta menjaga integritas dana JKN dan hak peserta melalui pengawasan akuntabel tanpa penolakan otomatis (human-in-the-loop).","BuktiLayan adalah aplikasi web asisten verifikasi yang mencocokkan rincian klaim fisioterapi dengan bukti kunjungan, tindakan, dan jadwal petugas. Sistem menggunakan AI lokal untuk mengekstrak data terstruktur dari catatan naratif, dipadukan aturan rekonsiliasi yang transparan dan tersimpan per versi. Kasus ambigu masuk ke antrean klarifikasi untuk diputuskan oleh verifikator.","Mempercepat waktu pemeriksaan klaim (target median turun =30%), mencapai akurasi tinggi (precision =85%, recall =80%), dan menjamin 100% penandaan memiliki alasan serta jejak sumber. Faskes dapat memperbaiki berkas lebih dini, BPJS Kesehatan lebih mudah menelusuri bukti, serta integritas dana JKN terlindungi tanpa merugikan peserta."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2878","tim":"PTTD 666","inov":"JejakLayan - Berkas boleh lengkap, tapi apakah layanannya benar-benar terjadi?","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2878_Proposal Healthkathon 2026_JejakLayan_PTTD 666.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Dalam program JKN, kerap terjadi masalah phantom dan repeat billing di mana layanan fiktif tetap diajukan sebagai klaim. Kasus nyata pada tahun 2024 menunjukkan temuan tagihan fiktif senilai Rp34 miliar. Manipulasi semacam ini sangat sulit dideteksi secara manual karena dokumen administratif yang diajukan telah direkayasa agar terlihat lengkap dan wajar.","Tujuan utama sistem ini adalah membantu verifikator menyeleksi dan menemukan klaim anomali yang perlu diperiksa lebih lanjut. Sistem tidak berupaya menggantikan proses verifikasi atau memberikan tuduhan otomatis, melainkan bertindak sebagai lapisan pemeriksaan pelengkap. Hal ini bertujuan agar proses investigasi klaim menjadi jauh lebih terarah dan efisien dengan alasan pemeriksaan yang konkret.","JejakLayan merupakan sistem analisis berbasis kecerdasan buatan (AI) yang memeriksa jejak keabsahan layanan di balik sebuah dokumen. Sistem memproses lima indikator: pola waktu dan wilayah, catatan kehadiran peserta, rasionalitas tenaga medis, duplikasi klaim, dan hubungan janggal antar pihak. Jika terdeteksi penyimpangan dari kondisi normal, sistem tidak langsung menolak klaim, melainkan memberikan tingkat risiko beserta alasan spesifik. Purwarupa pada sisi antarmuka dasbor dikembangkan secara khusus agar verifikator dapat membaca dan memprioritaskan indikasi risiko dengan mudah sebelum mengambil keputusan final.","Penerapan sistem ini secara langsung mencegah kerugian besar dan melindungi keberlanjutan pembiayaan program JKN. Klaim bermasalah dapat diidentifikasi lebih awal, memungkinkan alokasi waktu verifikator dialihkan pada klaim berisiko tinggi. Sistem juga memastikan fasilitas kesehatan yang jujur tetap terlindungi berkat metode penandaan yang menuntut validasi manusia pada tahap akhir."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Susi Lusiani","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2882","tim":"PUSAKO","inov":"PRISMA-JKN: Triase Klaim Berbasis Aturan, Machine Learning, dan Agen AI untuk Efisiensi Risiko Pelay","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2882_Proposal Healthkathon 2026 Prisma JKN (Tim Pusako).pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Verifikasi klaim INA-CBG masih bertumpu pada pemeriksaan manual atas sampel terbatas dan sebagian besar post-payment, sehingga ketidaksesuaian baru ditemukan setelah dana dibayarkan. Dengan kepesertaan menuju 98% penduduk, selisih antara volume klaim dan kapasitas verifikator melebar tiap tahun. Persoalannya bukan ketiadaan aturan, karena Permenkes 16/2019 sudah mendefinisikan modus kecurangan, melainkan ketiadaan cara tertib menentukan klaim mana yang diperiksa dahulu dan atas dasar apa.","Membangun sistem triase klaim yang mengurutkan prioritas pemeriksaan bagi verifikator BPJS Kesehatan, dengan tiga sasaran: (1) meningkatkan tingkat temuan per satuan beban pemeriksaan, sehingga jumlah klaim yang sama menghasilkan temuan berkali lipat; (2) memastikan tiap penandaan disertai alasan terbaca manusia agar dapat dipakai sebagai dasar konfirmasi ke faskes; (3) menggeser sebagian pemeriksaan dari post-payment ke pra-pembayaran agar ketidaksesuaian dicegat sebelum dana keluar.","PRISMA-JKN adalah lapisan pra-verifikasi yang memberi skor risiko pada tiap klaim masuk, mengurutkannya menjadi antrean prioritas audit, dan menampilkan alasan di balik setiap penandaan. Sistem bekerja tiga lapis. Lapis aturan menyaring anomali yang pasti secara deterministik seperti readmisi, pemecahan episode, dan unbundling, disusun dari Permenkes 16/2019 serta divalidasi koder INA-CBG dalam tim. Lapis machine learning menangani pola samar seperti upcoding, cloning, dan phantom billing memakai XGBoost pada fitur turunan klaim. Lapis agen menyusun draf nota konfirmasi untuk ditinjau verifikator. Di atasnya, SHAP menampilkan faktor pendorong skor per klaim, dan Simple Additive Weighting menggabungkan skor risiko, nilai klaim, serta riwayat temuan faskes menjadi satu peringkat kerja. Keputusan verifikator dicatat dan menjadi label pelatihan ulang. Prototipe sudah berjalan, diuji pada 8.000 klaim simulasi; seluruh pengembangan memakai data simulasi tanpa data peserta JKN riil.","Pada pengujian data simulasi, 100 klaim teratas antrean prioritas menangkap sekitar 82% kasus bermasalah, dibanding sekitar 5% bila diperiksa acak, atau sekitar 16 kali lipat pada beban yang sama. Dampaknya: efisiensi kerja verifikator, pergeseran temuan ke tahap pra-pembayaran, keadilan bagi faskes tertib karena audit terarah pada anomali terukur, dan akuntabilitas karena tiap penandaan punya jejak alasan. Angka ini dari data simulasi dan perlu divalidasi ulang pada data resmi."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Susi Lusiani","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2884","tim":"SaiWork","inov":"SMARTPROTEK","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2884_smart_protek.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Risiko Tersembunyi di Dalam Pola :\n- Program Jaminan Kesehatan Nasional (JKN) yang melayani lebih dari 98% penduduk Indonesia, BPJS Kesehatan mengelola data klaim dalam volume masif. \n- Pendekatan konvensional yang berfokus pada pencocokan aturan (Rule Match / No Match) seringkali gagal menangkap sinyal kecurangan yang tersembunyi.\n- Risiko klaim tidak selalu muncul sebagai duplikasi yang identik seratus persen.","Tujuan utama sistem meningkatkan efektivitas upaya pemeriksaan (review) klaim terutama pada area di mana bukti menunjukkan risiko tertinggi.","SmartProtek JKN adalah sistem intelijen risiko klaim berbasis AI yang mendeteksi anomali Cloning, Phantom Billing, dan Upcoding di fasilitas kesehatan. Sistem ini menganalisis pola tersembunyi untuk menghasilkan skor risiko dan \"Paket Bukti\" komprehensif, bukan sekadar peringatan kaku. Berprinsip \"AI Mendeteksi, Bukti Menjelaskan, Manusia Memutuskan\", SmartProtect bertindak sebagai sistem pendukung untuk memfokuskan investigasi auditor BPJS Kesehatan","SmartProtek JKN memberikan dampak efisiensi dengan memfokuskan investigasi auditor pada prioritas risiko tertinggi, bukan sekadar menambah jumlah peringatan. Kinerja diukur melalui peningkatan Presisi, pemangkasan waktu pemeriksaan, dan kelengkapan bukti. Secara finansial, sistem ini mencegah kebocoran dana JKN dengan mengidentifikasi Potential Preventable Exposure (estimasi nilai klaim berisiko) sebelum keputusan pembayaran dilakukan"],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2886","tim":"Kumar","inov":"SIDIK: Sistem Investigasi & Deteksi Integritas Klaim","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2886_SIDIK_TimKumar_Healthkathon2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["JKN melayani 725,3 juta pemanfaatan layanan pada 2025 (±1,9 juta per hari), sementara BPJS Kesehatan memiliki 1.793 pemeriksa kecurangan dan defisit DJS 2025 mencapai Rp17,13 triliun. Audit yang dipimpin KPK (2024) menemukan indikasi phantom billing di 3 dari 6 RS sampel. Sejak Agustus 2026 klaim RS beralih ke RME berbasis NIK via SATUSEHAT, sehingga bukti klinis kini digital, tetapi volumenya mustahil dibaca manusia satu per satu.","Membantu verifikator BPJS Kesehatan mendeteksi dan memitigasi kecurangan klaim di fasilitas kesehatan (phantom billing, upcoding, unbundling, LOS panjang, readmisi, tindakan/obat fiktif, pengurangan jumlah obat) secara lebih cepat, tepat, dan dapat diaudit, dengan agentic AI yang menyiapkan bukti dan manusia yang memutuskan, sehingga klaim jujur lolos cepat dan dana JKN terlindungi.","SIDIK (Sistem Investigasi & Deteksi Integritas Klaim), \"Setiap Klaim Punya Saksi\", adalah lapisan integritas klaim berbasis agentic AI di atas RME SATUSEHAT, melengkapi VEDIKA dan FRISTA. Saksi 1, Rekam Medis: pra-skor ML memilih ±10% klaim berisiko; orkestrator Google ADK menjalankan agen spesialis (koherensi klinis, koding INA-CBG, episode, lab) dan agen pembukti berbasis RAG Permenkes 16/2019 & 3/2023. Hasilnya dossier berisi petunjuk, kutipan RME, aturan, dan selisih tarif; tanpa kutipan, tanpa flag. Saksi 2, \"Benarkah Ini Anda?\": agen percakapan di Mobile JKN menanyakan pasien layanan/obat yang benar diterima, lalu merekonsiliasi dengan klaim. Verifikator selalu memutuskan dan setiap aksi tercatat di log audit. Fase 2: Saksi Jaringan (graf deteksi cincin kolusi). Status: mockup interaktif 5 layar, data simulasi.","Estimasi berbasis asumsi rancangan (akan divalidasi pada prototipe & pilot): waktu review ±70-80% lebih cepat, ±90% klaim lolos otomatis, kapasitas pemeriksaan ±3-4x dengan jumlah pemeriksa yang sama, dan dossier bukti siap <1 menit. Manfaat: verifikator fokus pada kasus berisiko, faskes jujur dibayar lebih cepat, potensi kerugian dana JKN tercegah lebih dini, dan peserta terlindungi melalui verifikasi layanan."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2895","tim":"AxiomJKN","inov":"Pembongkaran Services Unbundling JKN Melalui Association Rule Mining dan Deteksi Temporal","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2895_Axiom-Unbundle_JKN___Healthkathon_2026_20261008010530.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Unbundling memecah prosedur satu episode menjadi beberapa kunjungan terpisah agar tagihan lebih banyak. Fisioterapi (9339, 9334, 9335) mencatat 6,4 juta kunjungan/tahun—1% pemisahan menghasilkan 64.000 kunjungan fiktif. Setiap tagihan individual tampak sah dengan kode prosedur valid; tidak ada sistem yang melihat hubungan antar-tagihan lintas kunjungan. Audit konvensional buta terhadap modus ini.","Menemukan pasangan prosedur yang secara historis selalu muncul bersamaan dalam satu episode (confidence >90%), mendeteksi split billing jika pasangan tersebut ditagihkan di hari berbeda oleh faskes yang sama untuk pasien yang sama, menghitung Split Frequency Score per faskes, dan menghasilkan estimasi kerugian Rupiah per kasus unbundling tanpa memerlukan data berlabel fraud.","Axiom-Unbundle JKN menerapkan FP-Growth pada data transaksi klaim harian untuk menemukan frequent itemset prosedur. Rule dengan Confidence >90% dan Lift >2.0 dikategorikan \"prosedur yang seharusnya satu paket.\" Split Billing Detector kemudian menjalankan temporal gap check: jika dua prosedur dari pasangan asosiasi kuat ditagih di hari berbeda untuk pasien dan faskes yang sama ? anomali split billing terkonfirmasi. Hasilnya divisualisasikan sebagai network graf interaktif (D3.js) dengan edge merah menandai jalur unbundling. Sistem sepenuhnya unsupervised tidak butuh data berlabel untuk beroperasi. Baseline dari Tabel 8.25 Statistik JKN 2020 (100 Prosedur Terbanyak RJTL). Upload CSV transaksi baru ? mining FP-Growth dan deteksi diperbarui instan.","Mendeteksi fraud yang lolos seluruh sistem audit berbasis aturan statis karena setiap tagihan individual tampak sah. Potensi kerugian unbundling fisioterapi saja: Rp 20–104 miliar/tahun. Sepenuhnya unsupervised menemukan pola fraud baru yang belum pernah diidentifikasi sebelumnya, termasuk kombinasi prosedur yang belum masuk daftar hitam manapun."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Djaka Santosa","s":null}]}];
/*DATA_END*/
</script>
<script>
"use strict";
const W=[.20,.15,.20,.20,.15,.10];
const LVL=["Kurang","Cukup","Baik","Sangat baik"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const raw=s=>s.reduce((a,v,k)=>a+(v!=null?W[k]*v:0),0);
const sc10=s=>raw(s)/4*10;
const fmt=n=>n==null?"-":n.toFixed(2).replace(".",",");
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const ini=n=>n.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const EMPTY=()=>[null,null,null,null,null,null];
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ---------- state ---------- */
const TB=Object.fromEntries(TEAMS.map(t=>[t.id,t]));
const key=(id,n)=>id+"|"+n;
let SV={};                       // nilai dari server: key -> {s,t}
let LOCKED=new Set(TEAMS.filter(t=>t.lk).map(t=>t.id));
let CONN="load";                 // load | ok | local | err
let lastSync=null, DRAW=null;    // DRAW: {id,n,s,dirty}
const LOCAL=!CFG.api;
if(LOCAL){ const L=lsGet("nilai_local")||{}; SV=L; }

const eff=(t,r)=>{ const v=SV[key(t.id,r.n)]; return v?v.s:(r.s||EMPTY()); };
const nFill=s=>s.filter(v=>v!=null).length;
function info(t){
  const rs=t.r.map(r=>{const s=eff(t,r);return {n:r.n,s,f:nFill(s),raw:raw(s)}});
  const N=rs.length, done=rs.filter(r=>r.f===6).length, started=rs.filter(r=>r.f>0).length;
  const total=N?rs.reduce((a,r)=>a+r.raw,0)/(4*N)*10:null;
  return {rs,N,done,started,total,complete:N>0&&done===N};
}
const isLocked=t=>LOCKED.has(t.id);
function teamState(t){            // status global tim
  const i=info(t);
  if(isLocked(t)) return {k:"lock",label:"Terkunci",cls:"s-lock",i};
  if(i.complete) return {k:"done",label:"Selesai",cls:"s-done",i};
  if(i.started) return {k:"draft",label:`Dalam proses ${i.done}/${i.N}`,cls:"s-draft",i};
  return {k:"todo",label:"Belum dinilai",cls:"s-todo",i};
}
function myState(t,name){         // status untuk satu penilai
  const r=t.r.find(x=>x.n===name), s=eff(t,r), f=nFill(s);
  if(isLocked(t)) return {k:"lock",f,s};
  return {k:f===6?"done":f>0?"draft":"todo",f,s};
}
const decLabel=t=>t.dec==="L"?"Lulus":t.dec==="T"?"Tidak lulus":"";

/* ---------- koneksi ---------- */
function setConn(c){ CONN=c; const el=$("#sync"); el.className="pill btn "+({ok:"ok",local:"warn",err:"err",load:""}[c]);
  const tm=lastSync?lastSync.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}):"";
  $("#syncT").textContent={load:"Memuat...",ok:"Tersambung"+(tm?" · "+tm:""),local:"Mode uji (belum tersambung)",err:"Gagal terhubung · ketuk untuk coba lagi"}[c]; }
async function apiGet(){ const r=await fetch(CFG.api+(CFG.api.includes("?")?"&":"?")+"action=all&_="+Date.now()); if(!r.ok) throw new Error("http "+r.status); return r.json(); }
async function apiPost(b){ const r=await fetch(CFG.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)}); if(!r.ok) throw new Error("http "+r.status); return r.json(); }

async function load(silent){
  if(LOCAL){ setConn("local"); render(); return; }
  if(!silent) setConn("load");
  try{
    const d=await apiGet();
    SV={}; (d.rows||[]).forEach(r=>{SV[key(r.id,r.n)]={s:r.s,t:r.t}});
    (d.locked||[]).forEach(i=>LOCKED.add(String(i)));
    lastSync=new Date(); setConn("ok");
    syncSeed(d);                 // lengkapi server dengan nilai awal & kunci (idempoten)
  }catch(e){ console.warn(e); setConn("err"); }
  if(!DRAW) render();
}
async function syncSeed(d){
  const have=new Set((d.rows||[]).map(r=>key(r.id,r.n)));
  const rows=[]; TEAMS.forEach(t=>t.r.forEach(r=>{ if(r.s&&!have.has(key(t.id,r.n))) rows.push({id:t.id,n:r.n,s:r.s}); }));
  const srvLocked=new Set((d.locked||[]).map(String));
  const lock=TEAMS.filter(t=>t.lk&&!srvLocked.has(t.id)).map(t=>t.id);
  if(!rows.length&&!lock.length) return;
  try{ const r=await apiPost({action:"seed",rows,lock});
    if(r.ok){ rows.forEach(x=>{ if(!SV[key(x.id,x.n)]) SV[key(x.id,x.n)]={s:x.s,t:r.t}; }); if(!DRAW) render(); } }catch(e){ console.warn("seed",e); }
}
async function saveRow(id,n,s){
  if(LOCAL){ SV[key(id,n)]={s,t:new Date().toISOString()}; lsSet("nilai_local",SV); return; }
  const r=await apiPost({action:"save",id,n,s});
  if(!r.ok){ if(r.err==="locked") LOCKED.add(id); throw new Error(r.err||"gagal"); }
  SV[key(id,n)]={s:r.row.s,t:r.row.t}; lastSync=new Date(); setConn("ok");
}

/* ---------- toast ---------- */
let tt; function toast(m,err){ const e=$("#toast"); e.textContent=m; e.className="on"+(err?" err":""); clearTimeout(tt); tt=setTimeout(()=>e.className="",err?4500:2400); }

/* ---------- router ---------- */
let F={filter:"todo",q:""}, SUM={st:"all",q:""};
function route(){ const h=location.hash.replace(/^#\/?/,""); const p=h.split("/");
  if(p[0]==="p"&&POOL.concat(otherNames()).find(n=>slug(n)===p[1])) return {v:"me",name:POOL.concat(otherNames()).find(n=>slug(n)===p[1])};
  if(p[0]==="ringkasan") return {v:"sum"};
  return {v:"home"}; }
const otherNames=()=>[...new Set(TEAMS.flatMap(t=>t.r.map(r=>r.n)))].filter(n=>!POOL.includes(n)).sort();
function render(){
  const R=route();
  $("#nHome").removeAttribute("aria-current"); $("#nSum").removeAttribute("aria-current");
  if(R.v==="sum") $("#nSum").setAttribute("aria-current","page"); else $("#nHome").setAttribute("aria-current","page");
  let h=banners();
  h+= R.v==="me"?viewMe(R.name): R.v==="sum"?viewSum(): viewHome();
  $("#app").innerHTML=h; bind(R);
}
function banners(){
  let h="";
  if(LOCAL) h+=`<div class="banner warn" role="alert"><div><b>Mode uji.</b> Penyimpanan bersama belum disambungkan, nilai yang Anda simpan hanya tersimpan di browser ini dan tidak terlihat penilai lain.</div></div>`;
  if(CONN==="err") h+=`<div class="banner err" role="alert"><div><b>Gagal terhubung ke penyimpanan.</b> Data yang tampil bisa belum terbaru dan nilai belum bisa disimpan.</div><button type="button" data-act="retry">Coba lagi</button></div>`;
  return h;
}
window.addEventListener("hashchange",()=>{ closeSheet(true); render(); window.scrollTo(0,0); });

/* ---------- beranda ---------- */
function viewHome(){
  const S={todo:0,draft:0,done:0,lock:0}; let slots=0,fill=0;
  TEAMS.forEach(t=>{ S[teamState(t).k]++; if(!isLocked(t)) t.r.forEach(r=>{slots++; if(nFill(eff(t,r))===6) fill++;}); });
  const open=slots-fill;
  const card=n=>{ const mine=TEAMS.filter(t=>t.r.some(r=>r.n===n)); const open=mine.filter(t=>!isLocked(t));
    const w=workload(n), done=w.done, lock=w.lock;
    const pct=w.all?Math.round(done/w.all*100):100;
    return `<button class="person" data-go="${slug(n)}"><div class="top"><div class="av">${esc(ini(n))}</div><div><b>${esc(n)}</b><small>${mine.length} tim ditugaskan</small></div></div>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="meta"><span>${done} dari ${w.all} sudah dinilai</span><span>${w.all-done} sisa</span></div></button>`; };
  const oth=otherNames();
  return `<div class="kpis">
    <div class="card kpi"><b>${TEAMS.length}</b><span>Total tim</span></div>
    <div class="card kpi"><b>${S.done+S.lock}</b><span>Penilaian lengkap</span></div>
    <div class="card kpi"><b>${S.draft}</b><span>Dalam proses</span></div>
    <div class="card kpi"><b>${S.todo}</b><span>Belum dinilai</span></div>
    <div class="card kpi"><b>${open}</b><span>Penilaian individu tersisa</span></div></div>
  <div class="sec-h"><h2>Siapa Anda?</h2><span class="muted">Pilih nama untuk melihat tim yang perlu Anda nilai</span></div>
  <div class="people">${POOL.map(card).join("")}</div>
  ${oth.length?`<div class="sec-h"><h2>Penilai lainnya</h2><span class="muted">Penilai yang tercatat di Kertas Kerja tahap awal</span></div><div class="people">${oth.map(card).join("")}</div>`:""}`;
}

/* ---------- daftar tim milik penilai ---------- */
function viewMe(name){
  const mine=TEAMS.filter(t=>t.r.some(r=>r.n===name));
  const cnt={todo:0,done:0,lock:0,all:mine.length};
  mine.forEach(t=>{ const k=myState(t,name).k; if(k==="done")cnt.done++; else if(k==="lock")cnt.lock++; else cnt.todo++; });
  let list=mine.filter(t=>{ const k=myState(t,name).k;
    if(F.filter==="todo"&&!(k==="todo"||k==="draft")) return false;
    if(F.filter==="done"&&k!=="done") return false;
    if(F.filter==="lock"&&k!=="lock") return false;
    if(F.q){ const q=F.q.toLowerCase(); if(!(t.tim+" "+t.inov+" "+t.id).toLowerCase().includes(q)) return false; }
    return true; });
  const W_=workload(name), pct=W_.all?Math.round(W_.done/W_.all*100):100;
  const ch=(k,l,n)=>`<button class="chip" data-f="${k}" aria-pressed="${F.filter===k}">${l}<small>${n}</small></button>`;
  return `<div class="card me-head"><div class="av">${esc(ini(name))}</div><div class="grow"><h2>${esc(name)}</h2>
    <div class="muted">${W_.done} dari ${W_.all} tim sudah dinilai${W_.lock?` (${W_.lock} di tim terkunci)`:""} · ${W_.all-W_.done} sisa</div>
    <div class="bar" style="max-width:360px"><i style="width:${pct}%"></i></div></div>
    <a class="linkbtn" href="#/">Bukan Anda? Ganti nama</a></div>
  <div class="tools"><div class="chips" role="group" aria-label="Filter">${ch("todo","Perlu dinilai",cnt.todo)}${ch("done","Selesai",cnt.done)}${cnt.lock?ch("lock","Terkunci",cnt.lock):""}${ch("all","Semua",cnt.all)}</div>
    <input class="search" id="q" type="search" placeholder="Cari nama tim, judul, atau ID" value="${esc(F.q)}" aria-label="Cari tim"></div>
  <div class="list">${list.length?list.map(t=>teamRow(t,name)).join(""):`<div class="card empty">${F.filter==="todo"&&!F.q?"Semua tim Anda sudah dinilai. Terima kasih!":"Tidak ada tim yang cocok."}</div>`}</div>`;
}
function teamRow(t,name){
  const m=myState(t,name), lock=m.k==="lock";
  const st=lock?`<span class="st s-lock">&#128274; Terkunci${t.dec?" · "+decLabel(t):""}</span>`
    :m.k==="done"?`<span class="st s-done">&#10003; Selesai · ${fmt(sc10(m.s))}</span>`
    :m.k==="draft"?`<span class="st s-draft">Draft ${m.f}/6</span>`:`<span class="st s-todo">Belum dinilai</span>`;
  const btn=lock?"Lihat":m.k==="done"?"Ubah":m.k==="draft"?"Lanjutkan":"Nilai";
  return `<button class="team" data-open="${t.id}" data-n="${esc(name)}"><div><div class="t1"><span class="num">#${t.id}</span><span>${esc(t.kat.replace("Efisiensi Risiko pada ",""))}</span>${t.rv?`<span class="st s-rev">Hasil revisi</span>`:""}</div>
    <h3>${esc(t.tim)}</h3><div class="j">${esc(t.inov)}</div></div>
    <div class="act">${st}<span class="btn ${m.k==="todo"||m.k==="draft"?"btn-p":"btn-o"}">${btn}</span></div></button>`;
}

/* ---------- ringkasan ---------- */
function viewSum(){
  const rows=TEAMS.map(t=>({t,s:teamState(t)}));
  const tot={all:rows.length}; rows.forEach(r=>tot[r.s.k]=(tot[r.s.k]||0)+1);
  const list=rows.filter(r=>(SUM.st==="all"||r.s.k===SUM.st)&&(!SUM.q||(r.t.tim+" "+r.t.inov+" "+r.t.id).toLowerCase().includes(SUM.q.toLowerCase())));
  const opt=(k,l)=>`<option value="${k}"${SUM.st===k?" selected":""}>${l} (${tot[k]||0})</option>`;
  const PN=[...POOL,...otherNames()], LD=PN.map(n=>workload(n));
  const sum=k=>LD.reduce((a,x)=>a+x[k],0);
  const load=LD.map((x,i)=>`<tr><td>${esc(PN[i])}</td><td class="num">${x.all}</td><td class="num">${x.done}${x.lock?` <span class="muted" style="font-size:12px">(${x.lock} terkunci)</span>`:""}</td><td class="num">${x.prog}</td><td class="num">${x.none}</td></tr>`).join("")
    +`<tr style="font-weight:700"><td>Total</td><td class="num">${sum("all")}</td><td class="num">${sum("done")}</td><td class="num">${sum("prog")}</td><td class="num">${sum("none")}</td></tr>`;
  return `<div class="tools"><select class="search" id="sst" aria-label="Filter status">${opt("all","Semua tim")}${opt("todo","Belum dinilai")}${opt("draft","Dalam proses")}${opt("done","Selesai")}${opt("lock","Terkunci")}</select>
    <input class="search" id="sq" type="search" placeholder="Cari nama tim, judul, atau ID" value="${esc(SUM.q)}" aria-label="Cari tim"></div>
  <div class="card tablewrap"><table class="rtab"><thead><tr><th>ID</th><th>Tim</th><th>Status</th><th>Penilai</th><th>Skor akhir</th></tr></thead><tbody>
  ${list.map(({t,s})=>`<tr><td class="num idc">${t.id}</td><td><b>#${t.id} ${esc(t.tim)}</b>${t.rv?` <span class="st s-rev">Hasil revisi</span>`:""}<div class="muted" style="font-size:13px;max-width:46ch">${esc(t.inov)}</div></td>
   <td data-l="Status"><span class="st ${s.cls}">${s.k==="lock"?"&#128274; ":""}${s.label}</span>${t.lk&&t.dec?`<div class="muted" style="font-size:12.5px;margin-top:4px">${decLabel(t)} · flag ${esc(t.fd)}</div>`:""}</td>
   <td data-l="Penilai">${s.i.rs.map(r=>`<span class="rv ${r.f===6?"d":r.f>0?"p":""}" title="${r.f}/6 kriteria terisi">${r.f===6?"&#10003;":r.f>0?"&#9684;":"&#9675;"} ${esc(r.n)}</span>`).join("")||'<span class="muted">-</span>'}</td>
   <td class="num" data-l="Skor akhir">${s.i.complete||t.lk?fmt(s.i.total):'<span class="muted">-</span>'}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">Tidak ada tim yang cocok.</td></tr>`}
  </tbody></table></div>
  <div class="sec-h"><h2>Beban per penilai</h2><span class="muted">Ditugaskan = Sudah dinilai + Dalam proses + Belum dinilai</span></div>
  <div class="card tablewrap"><table><thead><tr><th>Penilai</th><th>Ditugaskan</th><th>Sudah dinilai</th><th>Dalam proses</th><th>Belum dinilai</th></tr></thead><tbody>${load}</tbody></table></div>
  <p class="muted" style="font-size:13px;margin:12px 4px">"Sudah dinilai" mencakup nilai dari Kertas Kerja dan nilai yang diisi lewat form ini; "terkunci" = tim sudah diflag di sistem. Tim revisi dinilai ulang oleh penilai baru. Skor akhir tampil setelah semua penilai tim mengisi lengkap. Nilai per penilai tidak ditampilkan agar penilaian tetap independen.</p>`;
}

function workload(n){   // satu penilai: tim terkunci memakai nilai dari Kertas Kerja dan dihitung sebagai sudah dinilai
  const mine=TEAMS.filter(t=>t.r.some(r=>r.n===n)); let done=0,lock=0,prog=0;
  mine.forEach(t=>{ const m=myState(t,n); if(m.f===6){ done++; if(isLocked(t)) lock++; } else if(!isLocked(t)&&m.f>0) prog++; });
  return {all:mine.length,done,lock,prog,none:mine.length-done-prog};
}
function bind(R){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ F={filter:"todo",q:""}; lsSet("nilai_me",b.dataset.go); location.hash="#/p/"+b.dataset.go; });
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ F.filter=b.dataset.f; render(); });
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openSheet(b.dataset.open,b.dataset.n));
  document.querySelectorAll("[data-act=retry]").forEach(b=>b.onclick=()=>load());
  const q=$("#q"); if(q) q.oninput=e=>{ F.q=e.target.value; const p=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(p,p); };
  const sq=$("#sq"); if(sq) sq.oninput=e=>{ SUM.q=e.target.value; const p=e.target.selectionStart; render(); const n=$("#sq"); n.focus(); n.setSelectionRange(p,p); };
  const ss=$("#sst"); if(ss) ss.onchange=e=>{ SUM.st=e.target.value; render(); };
}
$("#sync").onclick=()=>{ if(!LOCAL) load(); };

/* ---------- panel penilaian ---------- */
function nextTodo(from,name){ const mine=TEAMS.filter(t=>t.r.some(r=>r.n===name)&&!isLocked(t)&&myState(t,name).k!=="done");
  const i=mine.findIndex(t=>t.id===from); return mine.find((t,j)=>t.id!==from&&j>i)||mine.find(t=>t.id!==from)||null; }
function openSheet(id,name){
  const t=TB[id], r=t.r.find(x=>x.n===name), lock=isLocked(t);
  DRAW={id,n:name,s:eff(t,r).slice(),orig:eff(t,r).slice(),dirty:false,lock,busy:false};
  drawSheet(); $("#sheet").classList.add("on"); $("#scrim").classList.add("on"); document.body.style.overflow="hidden";
  $("#sheet .x").focus();
}
function closeSheet(force){
  if(!DRAW) return true;
  if(!force&&DRAW.dirty&&!confirm("Ada perubahan yang belum disimpan. Tutup tanpa menyimpan?")) return false;
  DRAW=null; $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); document.body.style.overflow=""; return true;
}
$("#scrim").onclick=()=>{ if(closeSheet()) render(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&DRAW){ if(closeSheet()) render(); } });
window.addEventListener("beforeunload",e=>{ if(DRAW&&DRAW.dirty){ e.preventDefault(); e.returnValue=""; } });

function drawSheet(){
  const D=DRAW, t=TB[D.id], i=info(t), lock=D.lock;
  const filled=nFill(D.s), full=filled===6, my=full?sc10(D.s):null;
  const row=SV[key(D.id,D.n)];
  const fileInfo=t.f?`<div class="line"><span class="muted">Berkas proposal:</span><span class="file">${esc(t.f.replace(/^revisi\//,""))}</span></div>`:"";
  const nxt=nextTodo(D.id,D.n);
  $("#sheet").innerHTML=`
  <div class="sh-head"><div class="row"><div><div class="eyebrow">#${esc(t.id)} · ${esc(t.kat)}</div><h2 id="shT">${esc(t.tim)}</h2><p>${esc(t.inov)}</p></div>
    <button class="x" type="button" aria-label="Tutup" data-x>&times;</button></div></div>
  <div class="sh-body"><div class="split"><div class="pane" id="paneA">
    ${lock?`<div class="banner lock"><div>&#128274; <b>Penilaian dikunci.</b> Tim ini sudah diflag di sistem${t.fd?` (${esc(t.fd)})`:""}${t.dec?` dengan keputusan <b>${decLabel(t)}</b>`:""}, sehingga nilai tidak dapat diubah.</div></div>`:""}
    ${t.fw?`<div class="banner err"><div><b>Perhatian:</b> ${esc(t.fw)}</div></div>`:""}
    <div class="card info">
      ${t.rv?`<div class="line"><span class="st s-rev">Hasil revisi</span><span class="muted">${esc(t.rv)}</span></div>`:""}
      ${fileInfo}
      <div class="line" style="margin-top:6px">${(t.rv?(CFG.spRev||CFG.sp):CFG.sp)?`<a class="btn btn-o" href="${esc(t.rv?(CFG.spRev||CFG.sp):CFG.sp)}" target="_blank" rel="noopener">${t.rv?"Buka folder proposal revisi (SharePoint)":"Buka folder proposal (SharePoint)"}</a>`:""}</div>
      <div class="line" style="margin-top:8px"><span class="muted">Penilai tim ini:</span>${i.rs.map(r=>`<span class="rv ${r.f===6?"d":r.f>0?"p":""}${r.n===D.n?" me":""}">${r.f===6?"&#10003;":r.f>0?"&#9684;":"&#9675;"} ${esc(r.n)}${r.n===D.n?" (Anda)":""}</span>`).join("")}</div>
    </div>
    ${submHtml(t)}
    </div><div class="pane" id="paneB">
    ${CRIT.map((c,k)=>critHtml(c,k,D.s[k],lock)).join("")}
  </div></div></div>
  <div class="sh-foot"><div class="score"><b class="num">${my!=null?fmt(my):"-"}</b><small>${full?"Skor Anda (skala 10)":`Terisi ${filled} dari 6 kriteria`}</small>
      <div class="dots">${D.s.map(v=>`<i class="${v!=null?"on":""}"></i>`).join("")}</div>
      ${row&&row.t?`<small>Tersimpan ${new Date(row.t).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</small>`:""}</div>
    <div class="btns">${lock?`<button class="btn btn-o" data-x type="button">Tutup</button>`:
      `<button class="btn btn-o" data-save="close" type="button" ${D.dirty&&!D.busy?"":"disabled"}>Simpan</button>
       ${nxt?`<button class="btn btn-p" data-save="next" type="button" ${D.dirty&&!D.busy?"":"disabled"}>Simpan &amp; berikutnya</button>`:`<button class="btn btn-p" data-save="close" type="button" ${D.dirty&&!D.busy?"":"disabled"}>${D.busy?"Menyimpan...":"Simpan"}</button>`}`}</div></div>`;
  // ikat event
  const sh=$("#sheet");
  sh.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ if(closeSheet()) render(); });
  sh.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ if(D.lock) return; const k=+b.dataset.k, v=+b.dataset.v;
    D.s[k]=v; D.dirty=D.s.some((x,j)=>x!==D.orig[j]); const tops=["#paneA","#paneB",".sh-body"].map(q=>{const e=sh.querySelector(q);return e?e.scrollTop:0}); drawSheet(); ["#paneA","#paneB",".sh-body"].forEach((q,i)=>{const e=sh.querySelector(q); if(e) e.scrollTop=tops[i];});
    const nb=sh.querySelector(`.seg[data-k="${k}"] button[data-v="${v}"]`); if(nb) nb.focus({preventScroll:true}); });
  sh.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>doSave(b.dataset.save));
}
const SUBL=["Latar Belakang","Tujuan","Deskripsi Solusi","Dampak"];
function submHtml(t){
  if(!t.sub||!t.sub.length) return `<div class="banner warn"><div>Data submisi tim ini tidak tersedia.</div></div>`;
  return `<details class="card subm" open><summary>Data Submisi Peserta</summary>
    <div class="sec"><h4>Judul inovasi</h4><p>${esc(t.inov)}</p></div>
    ${t.sub.map((x,j)=>`<div class="sec"><h4>${SUBL[j]}</h4><p>${esc(x)}</p></div>`).join("")}</details>`;
}
function critHtml(c,k,val,lock){
  return `<div class="card crit"><div class="crit-h"><div class="kn">${k+1}</div><div><b>${esc(c.n)}</b><small>Bobot ${Math.round(c.w*100)}%</small></div></div>
  <p class="ket">${esc(c.ket)}</p>
  <div class="seg" role="radiogroup" aria-label="${esc(c.n)}" data-k="${k}">${[1,2,3,4].map(v=>`<button type="button" role="radio" aria-checked="${val===v}" data-k="${k}" data-v="${v}" ${lock?"disabled":""}><b>${v}</b><span>${LVL[v-1]}</span></button>`).join("")}</div>
  <div class="ind ${val==null?"none":""}">${val==null?"Pilih nilai 1-4 untuk melihat indikatornya.":`<b>Nilai ${val}:</b> ${esc(c.ind[val-1])}`}</div>
  <details class="all"><summary>Lihat semua indikator</summary>${c.ind.map((x,j)=>`<div><b>${j+1}</b><span>${esc(x)}</span></div>`).join("")}</details></div>`;
}
async function doSave(mode){
  const D=DRAW; if(!D||D.busy||!D.dirty) return;
  D.busy=true; drawSheet();
  const id=D.id,n=D.n,s=D.s.slice(); const nxt=nextTodo(id,n);
  try{
    await saveRow(id,n,s);
    toast(nFill(s)===6?"Nilai tersimpan":"Draft tersimpan ("+nFill(s)+"/6 kriteria)");
    D.orig=s.slice(); D.dirty=false; D.busy=false;
    if(mode==="next"&&nxt){ DRAW=null; openSheet(nxt.id,n); render(); }
    else { closeSheet(true); render(); }
  }catch(e){
    D.busy=false; drawSheet();
    toast(String(e.message)==="locked"?"Tim ini sudah terkunci, nilai tidak dapat diubah.":"Gagal menyimpan. Periksa koneksi lalu coba lagi.",true);
  }
}

/* ---------- mulai ---------- */
(function init(){
  if(!location.hash){ const me=lsGet("nilai_me"); if(me&&POOL.concat(otherNames()).some(n=>slug(n)===me)) location.replace("#/p/"+me); }
  render(); load();
  setInterval(()=>{ if(!document.hidden&&!DRAW) load(true); },60000);
})();
</script>
</body>
</html>
