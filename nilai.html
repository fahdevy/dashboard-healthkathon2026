<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Form Penilaian Proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --ink:#142320; --muted:#586a64; --line:#D7E0DB; --soft:#E6EDE9;
  --band:#0B3B36; --band-ink:#E8F5F1; --band-muted:#9CC4BA; --mint:#3FD1B5;
  --accent:#0E6B5E; --accent-ink:#FFFFFF; --accent-soft:#D3ECE6;
  --pass:#23804C; --pass-soft:#DAF1E2; --fail:#B5372F; --fail-soft:#F8E0DD;
  --prog:#A36A0E; --prog-soft:#F7EAD0; --none:#6B7A74; --none-soft:#E3E9E6;
  --shadow:0 1px 2px rgba(11,59,54,.06),0 8px 24px -12px rgba(11,59,54,.18);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1513; --surface:#162019; --ink:#E3ECE8; --muted:#95A59E; --line:#26332E; --soft:#1C2724;
  --band:#0A2926; --band-ink:#E3F2EE; --band-muted:#86B1A6; --mint:#4FDCC0;
  --accent:#4DBBA8; --accent-ink:#06231E; --accent-soft:#16352F;
  --pass:#5CC285; --pass-soft:#153122; --fail:#EF8078; --fail-soft:#3A1B19;
  --prog:#E2B060; --prog-soft:#3A2B12; --none:#8A968F; --none-soft:#222C29;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
.band{background:var(--band);color:var(--band-ink);padding:22px 16px 70px;position:relative;overflow:hidden}
.band::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.035) 79px 80px),
  repeating-linear-gradient(0deg,transparent 0 79px,rgba(255,255,255,.035) 79px 80px);pointer-events:none}
.wrap{max-width:1100px;margin:0 auto;position:relative}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--mint)}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;background:rgba(255,255,255,.1);color:var(--band-ink);border:0}
.pill i{width:8px;height:8px;border-radius:50%;background:#9aa;display:inline-block}
.pill.ok i{background:var(--mint)} .pill.warn i{background:#E2B060} .pill.err i{background:#EF8078}
.pill.btn{cursor:pointer}
.band h1{font-size:clamp(26px,5vw,42px);font-weight:800;line-height:1.05;margin:14px 0 8px}
.band p{color:var(--band-muted);margin:0;max-width:62ch}
.nav{display:flex;gap:6px;margin-top:20px;flex-wrap:wrap}
.nav a{padding:8px 16px;border-radius:999px;color:var(--band-ink);text-decoration:none;font-weight:600;font-size:14px;background:rgba(255,255,255,.08)}
.nav a[aria-current=page]{background:var(--mint);color:#08302b}
main{max-width:1100px;margin:-48px auto 60px;padding:0 16px;position:relative}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.banner{border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--prog-soft);color:var(--prog)} .banner.err{background:var(--fail-soft);color:var(--fail)}
.banner.lock{background:var(--none-soft);color:var(--ink)}
.banner button{margin-left:auto;border:1px solid currentColor;background:transparent;border-radius:999px;padding:3px 12px;font-weight:600;white-space:nowrap}

/* ---------- beranda ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:30px;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:20px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.person{padding:16px;text-align:left;width:100%;display:block;border:1px solid var(--line);background:var(--surface);border-radius:16px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.person:hover{transform:translateY(-2px);border-color:var(--accent)}
.person .top{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;flex:none}
.person b{display:block;font-size:16px;line-height:1.25}
.person small{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:14px 0 6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.person .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

/* ---------- daftar tim ---------- */
.me-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px;margin-bottom:14px}
.me-head .grow{flex:1;min-width:200px}
.me-head h2{font-size:22px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;text-decoration:underline}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;min-height:38px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip small{opacity:.75;font-weight:500;margin-left:4px}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;min-height:40px}
.list{display:grid;gap:10px}
.team{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:14px 16px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;width:100%;text-align:left}
button.team:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.team .t1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.team h3{font-size:16px;line-height:1.3;margin:2px 0}
.team .j{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.team .act{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:9px 18px;font-weight:600;border:1px solid transparent;min-height:40px}
.btn-p{background:var(--accent);color:var(--accent-ink)} .btn-p:hover{filter:brightness(1.08)}
.btn-p[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn-o{background:var(--surface);border-color:var(--line)} .btn-o:hover{border-color:var(--accent)}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.s-todo{background:var(--none-soft);color:var(--none)} .s-draft{background:var(--prog-soft);color:var(--prog)}
.s-done{background:var(--pass-soft);color:var(--pass)} .s-lock{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.s-fail{background:var(--fail-soft);color:var(--fail)} .s-rev{background:#E9DDF7;color:#5B2E91}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .s-rev{background:#2E2142;color:#C9A8F0}}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
@media (max-width:700px){
  .rtab thead{display:none}
  .rtab,.rtab tbody{display:block}
  .rtab tr{display:block;padding:12px 14px;border-bottom:1px solid var(--line)}
  .rtab td{display:block;border:0;padding:3px 0}
  .rtab td[data-l]::before{content:attr(data-l);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
  .rtab td.idc{display:none}
}
@media (max-width:640px){.team{grid-template-columns:1fr}.team .act{flex-direction:row;align-items:center;justify-content:space-between}}

/* ---------- ringkasan ---------- */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--soft);vertical-align:top}
tr:last-child td{border-bottom:0}
.rv{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:2px 9px;border-radius:99px;margin:2px 4px 2px 0;background:var(--none-soft);color:var(--none)}
.rv.me{outline:2px solid var(--accent)}
.rv.d{background:var(--pass-soft);color:var(--pass)} .rv.p{background:var(--prog-soft);color:var(--prog)}

/* ---------- panel penilaian ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,20,17,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.25)}
.sheet.on{transform:none}
.sh-head{background:var(--band);color:var(--band-ink);padding:14px 16px 16px}
.sh-head .row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.sh-head h2{font-size:21px;line-height:1.2;margin:6px 0 4px}
.sh-head p{margin:0;color:var(--band-muted);font-size:13.5px}
.x{background:rgba(255,255,255,.12);color:var(--band-ink);border:0;width:38px;height:38px;border-radius:50%;font-size:20px;flex:none}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
.info{padding:12px 14px;margin-bottom:12px;font-size:14px}
.subm{margin-bottom:12px;overflow:hidden}
.subm>summary,.subm>h3{padding:12px 14px;font-weight:700;cursor:pointer;font-family:var(--display);font-size:16px;list-style:none}
.subm>summary::-webkit-details-marker{display:none}
.subm>summary::after{content:"\25BE";float:right;color:var(--muted)}
.subm[open]>summary::after{content:"\25B4"}
.subm .sec{padding:12px 14px;border-top:1px solid var(--line)}
.subm .sec h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-family:var(--body)}
.subm .sec p{margin:0;white-space:pre-line;font-size:14.5px;line-height:1.6}
.pane{min-width:0}
@media (min-width:1100px){
  .sheet{width:min(1280px,100%)}
  .sh-body{overflow:hidden;padding-bottom:0}
  .split{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;height:100%}
  .pane{overflow-y:auto;height:100%;padding-bottom:24px;padding-right:4px}
}
.info .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.file{font-family:var(--mono);font-size:12.5px;background:var(--soft);padding:2px 8px;border-radius:6px;word-break:break-all}
.crit{padding:14px;margin-bottom:12px}
.crit-h{display:flex;gap:12px;align-items:flex-start}
.kn{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--mono)}
.crit-h b{display:block;font-size:16px;line-height:1.3}
.crit-h small{color:var(--muted)}
.crit .ket{margin:8px 0 12px;color:var(--muted);font-size:13.5px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .1s}
.seg button b{font-family:var(--display);font-size:24px;line-height:1}
.seg button span{font-size:11.5px;color:var(--muted);margin-top:3px}
.seg button:hover:not([disabled]){border-color:var(--accent)}
.seg button[aria-checked=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-checked=true] span{color:inherit;opacity:.85}
.seg button[disabled]{cursor:default}
.ind{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13.5px;min-height:42px}
.ind.none{background:var(--soft);color:var(--muted)}
details.all{margin-top:8px;font-size:13px;color:var(--muted)}
details.all summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.all div{margin:6px 0;display:flex;gap:8px} details.all div b{color:var(--ink);flex:none}
.sh-foot{border-top:1px solid var(--line);background:var(--surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sh-foot .score{flex:1;min-width:150px}
.sh-foot .score b{font-family:var(--display);font-size:26px;line-height:1}
.sh-foot .score small{display:block;color:var(--muted);font-size:12.5px}
.dots{display:flex;gap:4px;margin-top:4px}
.dots i{width:18px;height:6px;border-radius:99px;background:var(--line)} .dots i.on{background:var(--accent)}
.sh-foot .btns{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:520px){.sh-foot .btns{width:100%}.sh-foot .btns .btn{flex:1}}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:500;z-index:60;opacity:0;pointer-events:none;transition:all .2s;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast.err{background:var(--fail);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="topbar">
      <span class="eyebrow">Healthkathon 2026 &middot; Seleksi Proposal</span>
      <button class="pill btn" id="sync" type="button" aria-live="polite"><i></i><span id="syncT">Memuat...</span></button>
    </div>
    <h1>Form Penilaian Proposal</h1>
    <p>Pilih nama Anda, nilai proposal yang ditugaskan dengan skala 1-4 untuk 6 kriteria, lalu simpan. Tanpa login.</p>
    <nav class="nav" aria-label="Menu"><a href="#/" id="nHome">Penilai</a><a href="#/ringkasan" id="nSum">Ringkasan semua tim</a></nav>
  </div>
</header>
<main id="app"></main>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"></aside>
<div id="toast" role="status"></div>

<script>
/*DATA_START*/
const CFG={"api": "https://script.google.com/macros/s/AKfycbzUCSNR0ndfYf06OSptU6OaTK92mczCieVWuQHtT6CTw4731VDluukiVX8YAdMhTa9VBA/exec", "sp": "https://bpjskesehatano365-my.sharepoint.com/:f:/g/personal/reza_fahdevy_bpjs-kesehatan_go_id/IgANs0qjyaf8SqgFsG0hYDXqAYxWDK59eDr85C_s3AiC_IY?e=47TJun", "spRev": "https://bpjskesehatano365-my.sharepoint.com/:f:/g/personal/reza_fahdevy_bpjs-kesehatan_go_id/IgClC4kGUaK4QpLO0KZG3EgTAZacCpeVx1nDpFme6-s6mEM?e=tbcXJC", "nilai": "09/10/2026", "submisi": "09/10/2026"};
const POOL=["I Made Karistiawan", "Djaka Santosa", "Wahyu Satriyo Wibowo", "Aries Kurniwan", "Ulfah Nur Mukharomah", "Ardhy Widhiantoro", "Septian Firmansyah", "Mohamad Komarudin", "Raga Al Haqqi", "Yanuar Milad", "Susi Lusiani", "Juliana"];
const CRIT=[{"n": "Relevansi Permasalahan", "w": 0.2, "ket": "Menilai seberapa penting dan nyata permasalahan, kejelasan problem statement, dan kesesuaian solusi dengan kebutuhan BPJS Kesehatan dalam program JKN.", "ind": ["Permasalahan tidak jelas, tidak penting, atau tidak relevan dengan program JKN/BPJS Kesehatan. Solusi tidak menjawab permasalahan yang diidentifikasi.", "Permasalahan cukup relevan, tetapi belum didukung pemahaman yang memadai terhadap kebutuhan atau proses bisnis. Solusi hanya menjawab sebagian permasalahan.", "Permasalahan jelas dan relevan dengan kebutuhan JKN/BPJS Kesehatan. Solusi menjawab sebagian besar permasalahan dan sesuai dengan proses bisnis serta ketentuan yang berlaku.", "Permasalahan sangat jelas, nyata, strategis, dan berdampak signifikan terhadap JKN/BPJS Kesehatan. Solusi secara tepat dan menyeluruh menjawab akar permasalahan serta sesuai dengan proses bisnis dan ketentuan yang berlaku."]}, {"n": "Kreativitas, Inovasi, dan Keunikan", "w": 0.15, "ket": "Menilai kebaruan, kreativitas solusi, serta nilai tambah penggunaan AI dibandingkan metode atau solusi yang sudah tersedia.", "ind": ["Solusi bersifat konvensional dan hampir tidak memiliki unsur inovasi. Penggunaan AI tidak memberikan nilai tambah yang jelas.", "Solusi memiliki unsur inovasi, tetapi masih menyerupai solusi yang sudah tersedia. Pemanfaatan AI memberikan nilai tambah yang terbatas.", "Solusi memiliki pendekatan yang kreatif dan inovatif. AI dimanfaatkan secara tepat untuk menghasilkan nilai tambah yang jelas dibandingkan pendekatan konvensional.", "Solusi memiliki pendekatan yang sangat inovatif dan berbeda secara signifikan dari solusi yang tersedia. Pemanfaatan AI memberikan nilai tambah yang kuat dan berpotensi menjadi pendekatan baru yang dapat diterapkan pada JKN."]}, {"n": "Kualitas Teknologi/ Teknis", "w": 0.2, "ket": "Menilai ketepatan pemilihan teknologi AI, kualitas rancangan dan model, kualitas data, integrasi sistem, serta kemampuan tim menjelaskan dan membuktikan pendekatan teknis.", "ind": ["Teknologi/model tidak sesuai dengan permasalahan. Rancangan teknis lemah, kualitas data tidak memadai, dan tim tidak mampu menjelaskan pendekatan teknis yang digunakan.", "Teknologi/model cukup sesuai, tetapi masih terdapat kelemahan pada data, model, arsitektur, integrasi, atau proses pengujian atau ada beberapa masalah teknis yang kurang teratasi. Penjelasan teknis masih terbatas.", "Teknologi/model sesuai dengan permasalahan. Data, arsitektur, model, dan proses pengujian dirancang dengan baik. Tim mampu menjelaskan pendekatan teknis dan hasil pengujian dengan jelas.", "Teknologi/model sangat tepat dan dirancang secara matang. Kualitas data, arsitektur, model, integrasi, pengujian, performa, dan reliability diperhatikan dengan baik. Tim mampu menjelaskan, membuktikan, dan mempertanggungjawabkan keputusan teknis secara mendalam."]}, {"n": "Efektivitas dan Dampak", "w": 0.2, "ket": "Menilai kemampuan solusi menghasilkan perbaikan yang nyata dan terukur terhadap proses, layanan, kualitas, efisiensi, atau manfaat program JKN.", "ind": ["Solusi tidak menunjukkan manfaat yang jelas dan tidak memberikan perbaikan berarti terhadap permasalahan. Dampak sulit dibuktikan.", "Solusi memberikan manfaat, tetapi dampaknya masih terbatas atau belum didukung ukuran keberhasilan yang jelas.", "Solusi memberikan perbaikan yang signifikan dan dapat diukur, misalnya peningkatan efisiensi, kecepatan, akurasi, kualitas layanan, atau pengurangan beban kerja.", "Solusi memberikan dampak yang sangat signifikan, terukur, dan relevan terhadap BPJS Kesehatan maupun peserta JKN. Manfaat didukung hasil pengujian, benchmark, atau proof of concept yang meyakinkan."]}, {"n": "Kesiapan Implementasi Produk dan Skalabilitas", "w": 0.15, "ket": "Menilai apakah solusi dapat dikembangkan dari prototype menjadi produk yang dapat digunakan secara nyata, dioperasikan, dipelihara, dan dikembangkan pada skala yang lebih luas.", "ind": ["Masih berupa konsep/ide. Prototype belum berfungsi atau belum menunjukkan kemampuan untuk diimplementasikan. Kebutuhan implementasi belum jelas.", "Prototype sudah dapat menunjukkan fungsi utama, tetapi masih membutuhkan banyak pengembangan sebelum dapat digunakan. Aspek integrasi, operasional, pemeliharaan, atau kebutuhan sumber daya belum jelas.", "Produk/prototype sudah berfungsi dengan baik dan memiliki rancangan implementasi yang jelas, termasuk integrasi, infrastruktur, operasional, pemeliharaan, dan kebutuhan sumber daya. Solusi berpotensi dikembangkan ke skala yang lebih luas.", "Produk sangat siap untuk diimplementasikan atau dipilotkan. Arsitektur, integrasi, infrastruktur, operasional, pemeliharaan, deployment, dan monitoring telah dipersiapkan dengan baik. Solusi dapat diskalakan ke unit, proses, atau jumlah pengguna yang lebih besar."]}, {"n": "Keamanan, Privasi, dan Tata Kelola", "w": 0.1, "ket": "Menilai kemampuan solusi mengelola risiko keamanan dan AI, melindungi data pribadi, serta memenuhi prinsip dan ketentuan yang berlaku.", "ind": ["Tidak memperhatikan keamanan, privasi, atau risiko penggunaan AI. Data dapat digunakan tanpa kontrol yang memadai dan terdapat risiko tinggi terhadap kebocoran atau penyalahgunaan data.", "Sudah memperhatikan keamanan dan privasi secara dasar, tetapi masih terdapat kelemahan pada pengamanan data, akses, penggunaan model, atau pengelolaan risiko AI.", "Keamanan, privasi, dan risiko AI telah diperhitungkan dalam rancangan. Terdapat pengendalian terhadap akses, penggunaan data, keamanan sistem, dan risiko model serta memperhatikan ketentuan yang berlaku.", "Keamanan, privasi, dan tata kelola telah menjadi bagian integral dari desain produk (privacy/security by design). Terdapat pengelolaan risiko AI, kontrol akses, perlindungan data, audit trail, pengelolaan model, monitoring, serta mekanisme penanganan insiden dan kepatuhan yang jelas."]}];
const TEAMS=[{"id":"1987","tim":"ASTINA","inov":"ASTINA : PENGEMBANGAN ANALISIS SISTEM TRANSAKSI IDENTIFIKASI NILAI ANOMALI KLAIM ASURANSI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"1987_PROPOSAL_ASTINA.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["Kebocoran dana kesehatan akibat kecurangan (fraud) seperti Phantom Billing dan Repeat Billing adalah tantangan sistemik jaminan sosial. Verifikasi manual tradisional yang bersifat reaktif dan bekerja secara silo terbukti tidak lagi memadai karena lambat, rentan bias, serta memiliki tingkat positif palsu yang tinggi. Dibutuhkan terobosan teknologi proaktif yang mengintegrasikan analisis data besar, aturan bisnis, dan kecerdasan buatan relasional.","Pembangunan ASTINA bertujuan mereformasi sistem verifikasi klaim secara menyeluruh. Pertama, untuk mencegah kebocoran anggaran dengan mendeteksi kecurangan secara dini sebelum pembayaran disetujui. Kedua, mentransformasikan pengawasan dari reaktif menjadi proaktif melalui platform self-assessment bagi fasilitas pelayanan kesehatan sebelum klaim diajukan. Ketiga, meningkatkan akurasi deteksi guna menekan positif palsu menggunakan model analitik statistik serta Graph Neural Network (GNN).","ASTINA adalah aplikasi Streamlit stateless yang memadukan AI probabilistik dan mesin aturan bisnis deterministik. Alur kerjanya mencakup ingesti file dataset besar dengan Dual Processing Engine Polars dan PyArrow untuk optimasi RAM. Preprocessing otomatis menangani data hilang, validasi rentang, encoding, dan menjaga keunikan baris lewat astina_row_id. Deteksi kecurangan dijalankan oleh Combined Anomaly Detector yang mengintegrasikan model ensemble: supervised XGBoost (bobot 40%), Isolation Forest (30%), Deep Autoencoder PyTorch (20%), dan GNN berbasis GATConv (10%) untuk analisis relasi spasial. Analisis ini diperkuat dengan evaluasi sembilan kelompok aturan bisnis secara global. Aspek transparansi dijamin oleh Explainable AI (SHAP/LIME) dan modul audit trail. Infrastruktur sistem dikemas aman menggunakan Docker non-root dan sinkronisasi otomatis ke Google Cloud Storage.","Implementasi ASTINA membawa dampak transformasional bagi jaminan kesehatan nasional. Pertama, menyelamatkan anggaran keuangan negara miliaran rupiah dengan mencegah klaim fiktif real-time sebelum pembayaran disetujui. Kedua, meningkatkan efisiensi operasional audit hingga lebih dari 70% melalui daftar prioritas otomatis. Ketiga, menjamin transparansi keputusan, keabsahan hukum, serta privasi data medis pasien secara akuntabel."],"r":[{"n":"Paul Donald P","s":[4,3,2,3,3,3]},{"n":"Tria Sofa Purnama","s":[4,4,3,3,3,3]},{"n":"Ikhlasul Amalia","s":[4,4,4,3,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[4,4,4,3,3,3]}]},{"id":"1994","tim":"ArcXora","inov":"JKN Verify: Verifikasi Peristiwa Layanan untuk Deteksi Phantom Billing","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"1994_JKN_Verify_Healthkathon_2026_v3.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["Verifikasi klaim JKN menilai berkas, bukan peristiwa layanan. Pada kasus phantom billing di tiga RS swasta, 3.269 dari 4.341 klaim fisioterapi (75,3 persen) tanpa rekam medis, senilai Rp501,27 juta (Itjen Kemenkes, 2024). Berkas dipalsukan lengkap hingga lolos verifikasi dokumen; pembongkarnya verifikasi manual ke pasien, mustahil untuk 1,99 juta layanan per hari. Model deteksi terbaik BPJS hanya F1 19,53/100. Peserta, satu-satunya pihak yang tahu kepastiannya, belum bisa membantah terstruktur.","Membangun lapisan verifikasi peristiwa layanan yang bekerja pada skala penuh transaksi JKN, melengkapi verifikasi dokumen yang sudah berjalan. Sistem mengurutkan klaim berdasarkan tingkat kejanggalan struktural, dengan konfirmasi peserta sebagai penguat bertarget dan terbatas, sehingga verifikator BPJS Kesehatan dapat memprioritaskan pemeriksaan pada klaim dengan indikasi phantom billing tertinggi tanpa bergantung pada laporan manual maupun kehadiran seluruh peserta.","JKN Verify adalah aplikasi web bagi verifikator klaim di Kantor Cabang BPJS Kesehatan, bekerja dua jalur. Jalur pertama selalu aktif tanpa peserta: data klaim tersamarkan diproses lewat enam aturan baku (dokter tidak aktif, klaim tanpa rujukan atau antrean, tagihan ganda), dikelompokkan jadi klaster per fasilitas dan jenis kasus, dinilai dengan Isolation Forest menghasilkan peringkat kejanggalan relatif terhadap fasilitas sekelas satu regional. Jalur kedua bertarget: hanya klaster berskor tinggi memicu konfirmasi ke sebagian peserta lewat Mobile JKN, kontribusi jawaban dibatasi maksimal 10 dari 100 poin agar sistem tetap berfungsi tanpa respons peserta. Skor disertai penjelasan faktor berbahasa non-teknis dan berkas bukti terstruktur. Keluaran berupa sinyal perlu verifikasi, bukan penetapan kecurangan; keputusan tetap pada verifikator. Prototipe memakai data sintetis terkalibrasi distribusi DJSN, tanpa data peserta JKN sebenarnya.","BPJS Kesehatan: memprioritaskan kapasitas audit terbatas pada klaim berindikasi phantom billing tertinggi, mempercepat identifikasi pola seperti kasus tiga RS senilai Rp501,27 juta. Peserta: keterlibatan opsional, tidak memengaruhi hak layanan; skor tetap terbentuk tanpa jawaban peserta. Fasilitas kesehatan: tersedia mekanisme keberatan sesuai Pasal 10 UU PDP. Dampak finansial memerlukan validasi lewat data resmi dan uji coba berizin."],"r":[{"n":"Tria Sofa Purnama","s":[4,3,3,4,4,4]},{"n":"Ikhlasul Amalia","s":[4,3,3,4,3,3]},{"n":"Husnun Nashir","s":[4,3,2,2,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[4,4,3,4,3,4]}]},{"id":"2021","tim":"Kapan ke kampus nya","inov":"Jejak JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2021_Jejak JKN.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["Program JKN memproses klaim dalam skala besar dengan hubungan data yang kompleks. Risiko seperti Phantom Billing, Repeat Billing, dan Cloning dapat sulit dikenali jika klaim dianalisis secara terpisah. JEJAK-JKN menggabungkan Process Mining, Graph Analytics, Rule Engine, dan Explainable ML untuk menghubungkan pola klaim, memberi risk score yang dapat dijelaskan, serta membantu auditor memprioritaskan pemeriksaan tanpa menggantikan keputusan manusia.","Tujuan JEJAK-JKN adalah membantu auditor memprioritaskan klaim yang berisiko melalui analisis proses layanan, hubungan antar-klaim, pola pengulangan, dan anomali. Sistem menghasilkan risk score beserta alasan yang dapat dijelaskan untuk mendukung pemeriksaan Phantom Billing, Repeat Billing, dan Cloning, tanpa menggantikan keputusan akhir auditor.","JEJAK-JKN adalah platform fraud intelligence untuk membantu identifikasi dan prioritisasi risiko Phantom Billing, Repeat Billing, dan Cloning. Sistem menggabungkan Process Mining, Graph Analytics, Rule Engine, serta Explainable Machine Learning untuk menganalisis alur layanan, hubungan antar-klaim, kemiripan pola, dan anomali. Hasil berupa risk score, reason code, timeline, dan graph digunakan auditor sebagai dasar pemeriksaan lebih lanjut.","JEJAK-JKN diharapkan membantu meningkatkan efisiensi proses audit dengan memprioritaskan klaim berisiko tinggi, mengurangi beban pemeriksaan manual, dan mempercepat identifikasi pola Phantom Billing, Repeat Billing, serta Cloning. Dampak utamanya adalah audit yang lebih terarah, transparan, dan dapat dijelaskan, sehingga mendukung integritas serta keberlanjutan Program JKN."],"r":[{"n":"Ikhlasul Amalia","s":[4,3,3,3,2,3]},{"n":"Husnun Nashir","s":[4,4,4,3,3,3]},{"n":"Arman Annas Putra","s":[4,4,4,3,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,2,3]}]},{"id":"2022","tim":"hai kamu iya kamu","inov":"JAGA-Klaim","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2022_JAGA-Klaim_Proposal_Healthkathon_2026.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["Rasio klaim BPJS Kesehatan sudah di atas 100% sejak 2023, mencapai 108% per April 2026, dengan proyeksi defisit JKN 2026 sebesar Rp20-30 triliun. BPJS Kesehatan memverifikasi ±650.000 berkas klaim/hari, ±5% terindikasi fraud. Kasus nyata terus muncul, seperti fraud >Rp35 miliar di 3 RS swasta (KPK) via phantom billing. Namun sistem deteksi fraud yang ada dirancang untuk skala nasional atau RS besar tipe A/B, sehingga FKTP dan RS kecil tipe C/D tetap menyusun klaim tanpa alat bantu deteksi","Mengembangkan JAGA-Klaim, sistem deteksi risiko klaim berbasis rule engine dan machine learning yang dirancang khusus untuk FKTP dan RS kecil, agar mampu menandai potensi anomali klaim (phantom billing, upcoding, cloning, repeat billing, readmisi tidak wajar) sebelum klaim dikirim ke BPJS Kesehatan. Solusi ini juga menghadirkan kanal pelaporan whistleblower terlindungi, dengan prinsip human-in-the-loop agar keputusan akhir tetap di tangan verifikator manusia, bukan yang otomatis oleh sistem.","JAGA-Klaim terdiri atas empat modul. Modul 1: rule engine yang mengecek pola dasar kecurangan seperti duplikasi SEP, DPJP nonaktif, dan mismatch diagnosis-tindakan. Modul 2: layanan machine learning (FastAPI) yang menghitung skor anomali klaim memakai XGBoost/Random Forest, serta model kemiripan semantik diagnosis berbasis fine-tuned IndoBERT untuk mendeteksi pola readmisi. Modul 3: kanal pelaporan whistleblower yang terintegrasi dengan temuan anomali, identitas pelapor disamarkan. Modul 4 (opsional): cross-check harga obat/alkes terhadap e-katalog LKPP. Seluruh hasil deteksi tampil di dashboard verifikator (React) berbasis human-in-the-loop yang dimana AI hanya menandai, keputusan tetap di tangan manusia. Backend NestJS, data di PostgreSQL, job scoring diproses asinkron lewat Redis.","Bagi peserta JKN: layanan lebih terjaga karena dana program dikelola lebih efisien. Bagi FKTP/RS kecil: tersedia alat self-audit yang sebelumnya tak terjangkau, menekan risiko sanksi akibat klaim bermasalah. Bagi BPJS Kesehatan: beban verifikasi klaim anomali berkurang di hulu. Dampak diukur lewat persentase klaim tertandai sebelum submit dan waktu audit manual yang terpangkas yang dimana bukan klaim pengurangan fraud mutlak, karena masih perlu diuji di lapangan."],"r":[{"n":"Husnun Nashir","s":[4,3,3,3,3,3]},{"n":"Arman Annas Putra","s":[4,4,4,3,3,3]},{"n":"Djaka Santosa","s":[3,3,4,3,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,2,3]}]},{"id":"2052","tim":"Idea Space","inov":"SAFETING JKN : Sistem Deteksi Dini & Skoring Risiko Underwriting JKN","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"Berkas revisi belum tersedia di folder proposals. Jangan menilai memakai proposal lama.","lk":0,"dec":"","fd":"","rv":"Hasil revisi, menggantikan proposal sebelumnya (Tidak lulus, flag 28/09/2026)","sub":["Penyakit kronis dan katastropik (kardiovaskular, gagal ginjal terminal, stroke, kanker) menggeser JKN dari penanganan kuratif reaktif ke underwriting prediktif.","Kepesertaan JKN bersifat wajib (UU 40/2004 tentang SJSN). Karena itu skor SAFETING JKN dipakai untuk menentukan intervensi dan pengendalian mutu-biaya, bukan untuk menolak peserta. Istilah “declined risk” pada underwriting konvensional diterjemahkan menjadi manajemen kasus.","SAFETING JKN menandai risiko peserta sejak hulu (pendaftaran, iuran, utilisasi layanan) lalu menerjemahkannya menjadi skor 0–100 yang dapat ditindaklanjuti. Edisi ini memperdalam model underwriting (regresi logistik sigmoid terkalibrasi + interaksi GBDT), merinci matriks Hijau–Kuning–Merah, dan mengemasnya sebagai aplikasi Android untuk verifikator dan case manager BPJS Kesehatan. Prinsip win-win: edukasi dan kepatuhan sukarela didahulukan sebelum sanksi.","Sebelum implementasi sistem ini menggunakan deteksi reaktif pasca-klaim; risiko katastropik terlihat setelah biaya terjadi; celah kepesertaan dan iuran jarang terdeteksi; penindakan lemah, namun dengan diterapkannya sistem berbasis android menjadikan penentuan skoring 0–100 dilakukan secara real-time sejak dini; intervensi bertingkat (PROLANIS, PRB, HRCM); simulasi what-if menunjukkan biaya yang dapat dicegah; serta win-win mendorong kepatuhan sebelum sanksi."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Susi Lusiani","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2058","tim":"Kicau Mania","inov":"PERISAI Platform Evaluasi Resiko Integrasi Sistem AI untuk JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2058_PERISAI-Proposal.pdf","fw":"","lk":1,"dec":"T","fd":"30/09/2026","rv":"","sub":["Program jaminan kesehatan nasional (JKN) yang dikelola oleh BPJS merupakan program jaminan yang memiliki 270 Juta Peserta. Salah satu ancaman terbesar finansial JKN adalah klaim fasilitas kesehatan yang harganya digelembungkan (inflated bills) untuk obat, alat kesehatan, maupun tindakan medis.\n\nMaka dari itu, PERISAI dikembangkan sebagai sistem berbasis AI sebagai solusi mencegah terjadinya Fraud secara otomatis untuk membandingkan klaim dengan harga referensi secara langsung saat data masuk.","1. Validasi kewajaran harga klaim obat secara Real-time terhadap e-katalog LKPP\n2. Memberi Skor dan rating berdasarkan klaim yang mencurigakan\n3. Menyediakan Dashboard Visual yang dapat dibaca oleh semua level pengguna untuk transparasi","PERISAI memvalidasi harga claim obat, alat kesehatan, dan tindakan medis secara real-time terhadap referensi resmi - bukan menunggu audit periodik seperti sistem yang ada sekarang","1. PERISAI dapat menyelesaikan masalah Fraud yang pernah terjadi pada kasus 3 Fasilitas Kesehatan di tahun 2024 yang dimana negara mengalami kerugian sebesar Rp 25 - 43 Miliar dari Phantom billing\n2. PERISA berhasil menghitung persentase klaim sebelum di bayarkan, dan dapat dideteksi dalam waktu singkat"],"r":[{"n":"Djaka Santosa","s":[3,2,2,2,2,1]},{"n":"I Made Karistiawan","s":[3,2,2,2,2,1]},{"n":"Agung Waluyo","s":[3,3,2,2,2,3]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,3,3]}]},{"id":"2079","tim":"Ical Health UwU","inov":"CBG-SENTINEL, Asisten Verifikasi Kode Klaim INA-CBG Sebelum Klaim Dikirim","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2079_Proposal-CBG-Sentinel-Healthkathon-2026.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["BPJS Kesehatan menganalisis ±650.000 berkas klaim per hari dan sekitar 5% terindikasi kecurangan, setara ±32.500 klaim per hari, dengan total klaim 2025 Rp201 triliun. Sebagian besar bukan kecurangan disengaja, melainkan ketidaksesuaian kode ICD-10/ICD-9-CM dengan bukti di rekam medis. Deteksi kini terjadi setelah klaim dikirim, akibatnya klaim pending, dispute, dan arus kas faskes tertunda. Titik pencegahan justru di hulu: saat koder memilih kode, sebelum berkas dikirim.","Mencegah klaim bermasalah pernah dikirim, bukan menemukannya setelah masuk. CBG-Sentinel memeriksa kesesuaian kode ICD-10/ICD-9-CM terhadap bukti di resume medis sebelum klaim diajukan, menahan klaim berisiko, dan menyebutkan spesifik bukti apa yang hilang beserta kode alternatif yang didukung dokumen. Sasarannya menurunkan angka klaim pending dan mempercepat pembayaran bagi fasilitas kesehatan, sekaligus mengurangi beban antrean verifikasi di sisi BPJS Kesehatan.","CBG-Sentinel adalah asisten klaim pra-pengiriman di sisi fasilitas kesehatan, fokus pada upcoding dan unbundling. Sistem membaca resume medis dan daftar prosedur, membandingkan kode yang dipilih dengan bukti yang benar-benar ada, lalu menahan klaim berisiko sambil menjelaskan bukti yang kurang. Contoh: kode J18.9 (pneumonia) tanpa dukungan radiologi atau kultur ditahan, dengan saran J06.9 yang sesuai bukti. Empat lapisan proses: ekstraksi entitas klinis, rule engine INA-CBG deklaratif berbasis YAML, model klasifikasi hanya untuk celah aturan, dan lapisan penjelasan sebagai pembeda inti. Empat layar: worklist klaim, workbench koder, dashboard dampak, dan jejak audit. Sistem tidak pernah mengubah kode otomatis; koder tetap pemegang keputusan dan setiap penolakan saran wajib beralasan serta tercatat. Data tahap ini 100% sintetis dan publik, tanpa data peserta JKN nyata. Posisinya melengkapi Defrada yang bekerja pasca-klaim, bukan menggantikannya.","Empat metrik yang diukur pada MVP: persentase klaim bermasalah yang tertahan sebelum dikirim, precision dan recall pada data publik berlabel, waktu pemeriksaan per klaim, dan estimasi penurunan antrean verifikasi sebagai fungsi recall. Bagi faskes, dampaknya klaim pending dan dispute menurun serta pembayaran lebih cepat. Bagi BPJS Kesehatan, beban verifikasi berkurang karena berkas yang masuk lebih bersih. Kami tidak mengklaim angka penghematan rupiah nasional sebagai dampak solusi ini."],"r":[{"n":"I Made Karistiawan","s":[4,3,4,3,3,3]},{"n":"Agung Waluyo","s":[4,3,3,3,2,4]},{"n":"Paul Donald P","s":[4,3,3,3,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[4,4,4,4,3,3]}]},{"id":"2089","tim":"Clayton","inov":"NADI-JKN: Sistem analitik risiko untuk mendukung prioritas pemeriksaan fasilitas kesehatan.","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2089_FINAL-NADI-JKN-Healthkathon-2026 (1).pdf","fw":"","lk":1,"dec":"L","fd":"07/10/2026","rv":"","sub":["Pada 2024, KPK mengungkap dugaan klaim fiktif senilai Rp35 miliar di tiga rumah sakit. Dana JKN yang seharusnya membiayai pengobatan peserta malah dibayarkan untuk layanan yang diduga tidak pernah diberikan. Untuk mencegah kerugian serupa, BPJS Kesehatan perlu menelusuri pola klaim dan mencocokkannya dengan bukti pelayanan. NADI-JKN dikembangkan untuk membantu petugas membaca pola itu dan menentukan faskes yang perlu diperiksa lebih dulu, sehingga pengawasan lebih terarah pada risiko kecurangan","NADI-JKN bertujuan membantu BPJS Kesehatan melindungi dana JKN dengan memusatkan pemeriksaan pada faskes dan klaim yang berisiko. Petugas mendapat alasan bahwa suatu kasus perlu ditelaah serta bukti yang harus diperiksa, sehingga waktu dan tenaga verifikasi digunakan untuk kasus yang relevan. Pemeriksaan berlanjut melalui permintaan dokumen dan telaah bersama faskes hingga petugas menetapkan hasil. Tujuannya agar BPJS dapat mengenali pola kecurangan lebih awal dan menindaklanjutinya berdasarkan","NADI-JKN adalah prototipe aplikasi web yang menghubungkan analisis risiko dengan tindak lanjut pemeriksaan klaim. Dengan 16 jenis pemeriksaan dan AI, petugas dapat melihat pola klaim, membandingkan faskes sejenis, serta menelusuri bukti pendukung. Hasilnya berupa daftar prioritas beserta alasan dan sampel klaim untuk diperiksa. Jika bukti belum lengkap, petugas dapat meminta dokumen kepada faskes untuk klaim yang sama. Riwayat, penanggung jawab, dan tenggat tetap tercatat sampai pemeriksaan selesai.","NADI-JKN diharapkan dapat membantu BPJS Kesehatan mengurangi risiko pembayaran klaim yang tidak semestinya agar dana JKN dapat digunakan untuk pelayanan peserta. Petugas dapat memusatkan perhatian pada kasus yang perlu ditelaah, sementara faskes menerima permintaan perbaikan yang jelas. Manajemen dapat memantau penyelesaian temuan dan menelusuri dasar pengambilan keputusan. Karena petugas tetap menentukan hasil akhirnya, BPJS dapat memperkuat pengawasan sekaligus menjaga hak faskes dan peserta s"],"r":[{"n":"Agung Waluyo","s":[4,3,4,3,4,3]},{"n":"Paul Donald P","s":[4,2,3,3,3,2]},{"n":"Tria Sofa Purnama","s":[4,4,3,3,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[4,3,3,4,3,3]}]},{"id":"2090","tim":"Null Pointer","inov":"Automated Engine untuk Deteksi Over-Limit dan Penggelembungan Klaim Obat JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2090_Proposal Healthkathon 2026 - BPJS Kesehatan.pdf.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["Klaim obat rawan penggelembungan kuantitas, over-prescription, dan ketidaksesuaian dosis terhadap DPHO/Fornas, sementara verifikasi manual lambat dan tidak konsisten. PharmaQuantity Audit hadir sebagai Pre-Payment Audit DSS yang memvalidasi klaim sebelum pembayaran difinalisasi. Sistem mengekstraksi data resep (termasuk PDF) lalu memeriksanya dengan rule-based validation terhadap DPHO/Fornas, menghasilkan status sesuai, melebihi batas, atau perlu pemeriksaan lanjut secara otomatis dan konsisten.","PharmaQuantity Audit bertujuan mengotomatisasi deteksi penggelembungan kuantitas obat, over-prescription, dan pelanggaran DPHO/Fornas pada tahap pra-pembayaran klaim. Sistem mempercepat verifikasi dari belasan menit menjadi hitungan milidetik, menekan kebocoran anggaran JKN, mengurangi human error verifikator, serta menyajikan sinyal risiko dan estimasi penghematan dana secara terstruktur sebagai Decision Support System bagi auditor sebelum klaim difinalisasi.","PharmaQuantity Audit adalah Pre-Payment Audit Decision Support System (DSS) untuk validasi kuantitas klaim obat JKN. Sistem mengintegrasikan Server-Side PDF Prescription Parser dan TypeScript Deterministic Dosage Engine dalam satu aplikasi standalone berbasis Next.js App Router, tanpa ketergantungan microservice Python/AI eksternal. Dokumen resep (termasuk PDF) diekstraksi menjadi data terstruktur—nama obat, dosis, frekuensi, durasi terapi, dan kuantitas—lalu dievaluasi terhadap Master DPHO/Fornas menggunakan formula matematis deterministik untuk menghitung batas kuantitas wajar. Hasilnya ditampilkan pada dashboard Ant Design Pro-Table dengan indikator risiko berwarna (hijau/kuning/merah) beserta alasan terstruktur, serta estimasi penghematan dana secara real-time. Pemrosesan berjalan in-memory dengan anonymized hashing sesuai UU PDP, sehingga bukan menggantikan auditor, melainkan mempercepat dan mengonsistenkan proses screening sebelum klaim dibayarkan.","PharmaQuantity Audit diharapkan mencegah kebocoran Dana Jaminan Sosial JKN secara otomatis sebelum pembayaran (pre-payment protection). Bagi verifikator, beban verifikasi manual berkurang hingga 80% sehingga dapat fokus pada kasus kecurangan kompleks. Faskes memperoleh umpan balik kepatuhan peresepan terhadap DPHO/Fornas, sementara peserta JKN terlindungi dari risiko over-medication dan mendapat jaminan obat kronis tepat sasaran."],"r":[{"n":"Paul Donald P","s":[3,3,3,3,3,3]},{"n":"Tria Sofa Purnama","s":[4,4,3,3,3,3]},{"n":"Ikhlasul Amalia","s":[4,4,3,3,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,4,4,3]}]},{"id":"2091","tim":"WNI Seumur Hidup","inov":"PANDU JKN — Sistem Multi-Agent AI untuk Kejelasan Kepesertaan, Status, dan Kesehatan Peserta JKN","kat":"Efisiensi Risiko pada Peserta JKN","f":"2091_Proposal Healthkathon BPJS - Tim WNI Seumur Hidup.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["Masalah kepesertaan JKN baru diketahui saat peserta sudah butuh layanan. Calon peserta tak paham jalur yang sesuai — celah ini membuka ruang pemalsuan dan penyalahgunaan identitas. Peserta baru tahu statusnya nonaktif di faskes; pekerja formal yang iurannya tak tercatat penuh tak punya cara memverifikasi. Keluhan ringan pun langsung ke faskes lanjutan, RRNS sejumlah FKTP di atas target =2%. Skor integritas BPJS turun 82,06 (2024) ke 80,49 (2025). Solusi saat ini baru bekerja setelah klaim masuk.","Mencegah risiko kepesertaan dari hulu, sebelum biaya atau klaim terjadi: (1) calon peserta paham jalur kepesertaan yang sesuai sehingga tak menempuh jalur tidak resmi atau memakai identitas orang lain; (2) peserta tahu penyebab status nonaktif dan langkah pemulihannya, bukan sekadar notifikasi; (3) pekerja formal dapat memverifikasi iurannya lewat kanal resmi; (4) keluhan ringan diarahkan ke level layanan tepat sehingga rujukan tidak perlu berkurang; (5) patuh UU PDP, keputusan akhir di manusia.","PANDU JKN adalah layanan percakapan berbasis AI dengan empat subagent di bawah satu Supervisor Agent. Pengguna bicara lewat satu pintu; Supervisor Agent memahami kebutuhan, mendelegasikan ke agent yang relevan, lalu menggabungkan hasilnya jadi satu respons. Empat agent: Eligibility & Onboarding (kelayakan, jalur kepesertaan, hambatan, dokumen, kanal resmi); Status & Root-Cause (status aktif/nonaktif sekaligus penyebabnya — tunggakan, iuran belum tercatat, segmen tak sesuai, data kependudukan — dan langkah pemulihannya); Diagnostic (triase keluhan, saran P3K, rekomendasi level layanan, ringkasan klinis ke faskes); Nutrition (analisis gizi dari foto makanan). Prinsip: AI tepat guna — keputusan yang butuh kepastian (eligibility, penyebab status, red-flag darurat) ditangani rule engine deterministik; LLM memahami bahasa alami, bertanya balik saat data kurang, dan menjelaskan hasil. Regulasi & pedoman klinis lewat RAG sumber resmi. Akses data dipisah per agent; data prototype sintetis.","Calon peserta dapat penjelasan sesuai kondisinya sehingga tak terdorong ke jalur tidak resmi; peserta tahu status, penyebab, dan langkah pemulihan sebelum tiba di faskes; pekerja formal bisa memverifikasi iurannya lewat kanal resmi; keluhan ringan tertangani mandiri atau di FKTP, bila dirujuk dokumentasinya sudah lengkap. FKTP berkurang beban administratifnya, dokter dapat ringkasan klinis siap pakai, BPJS dapat sinyal awal anomali kepatuhan pemberi kerja. Dampak masih proyeksi, perlu pilot."],"r":[{"n":"Tria Sofa Purnama","s":[4,4,3,3,2,3]},{"n":"Ikhlasul Amalia","s":[4,4,3,3,2,3]},{"n":"Husnun Nashir","s":[3,3,2,2,2,3]},{"n":"Wahyu Satriyo Wibowo","s":[4,4,3,3,3,3]}]},{"id":"2105","tim":"Labda Sari","inov":"JKN CAPITA- GUARD AI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2105_JKN CAPITA-GUARD AI.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["JKN CAPITA-GUARD AI merupakan solusi digital berbasis Artificial Intelligence (AI), data analytics, anomaly detection, risk scoring, dan early warning system yang dirancang untuk membantu mengidentifikasi potensi risiko penyalahgunaan dana kapitasi dan nonkapitasi pada fasilitas kesehatan yang melaksanakan pelayanan JKN.","JKN CAPITA-GUARD AI menawarkan pendekatan baru dalam pengelolaan risiko dana kapitasi dan nonkapitasi dengan menggabungkan AI, anomaly detection, predictive analytics, risk scoring, early warning, dan human-in-the-loop governance.\nInovasi ini bertujuan untuk memperkuat kapasitas pengawas dalam mengetahui “di mana risiko berada, seberapa tinggi risikonya, mengapa risiko tersebut muncul, dan tindakan apa yang perlu diprioritaskan.”","CAPITA-GUARD AI tidak diposisikan sebagai sistem pengganti auditor atau pengawas, tetapi sebagai intelligent decision-support system yang membantu mengubah data transaksi dan pelayanan menjadi informasi risiko yang dapat ditindaklanjuti.\nCAPITA-GUARD AI menggeser pendekatan pengawasan dari:\nMonitoring ? Deteksi ? Pemeriksaan\nmenjadi:\nPredict ? Detect ? Prioritize ? Verify ? Mitigate ? Monitor\nCAPITA-GUARD AI mengintegrasikan data yang relevan kemudian menggunakan analitik dan AI untuk mengidentifikasi pola yang tidak lazim.\nMekanisme utama\nData ? Analytics ? AI Detection ? Risk Score ? Early Warning ? Human Verification ? Mitigation\nSistem menghasilkan:\n•\tRisk Score 0–100\n•\tRisk level: Low / Medium / High\n•\tIndikator penyebab risiko\n•\tAlert\n•\tPrioritas tindak lanjut\n•\tRekomendasi tindakan\n•\tStatus investigasi\n•\tMonitoring tindak lanjut","Implementasi CAPITA-GUARD AI diharapkan menghasilkan:\n1. Fasilitas Kesehatan\n? penggunaan dana lebih akuntabel\n? risiko lebih cepat teridentifikasi\n? proses klarifikasi lebih terarah\n2. Pengawas\n? screening lebih cepat\n? prioritas pemeriksaan lebih objektif\n? informasi risiko lebih komprehensif\n3. Pengelola Program JKN\n? efisiensi pengawasan\n? penguatan integritas\n? peningkatan akuntabilitas"],"r":[{"n":"Ikhlasul Amalia","s":[3,3,3,4,3,2]},{"n":"Husnun Nashir","s":[2,2,1,1,1,2]},{"n":"Arman Annas Putra","s":[4,3,3,3,3,2]},{"n":"Wahyu Satriyo Wibowo","s":[4,4,3,4,4,3]}]},{"id":"2110","tim":"BastionGate","inov":"BastionGate: Health Claim Integrity Gateway","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2110_Proposal-BastionGate-for-JKN-Healthkathon-2026_submit.pdf","fw":"","lk":1,"dec":"T","fd":"28/09/2026","rv":"","sub":["JKN melayani 282 juta peserta dengan jutaan klaim setiap bulan. Skala tersebut menghadirkan tantangan berupa keterbatasan verifikasi, potensi fraud, dan risiko integritas data yang meningkat seiring digitalisasi layanan kesehatan. Ketika pemeriksaan dilakukan setelah klaim masuk ke sistem nasional, klaim berisiko dan potensi dispute menjadi lebih sulit ditangani secara cepat. Karena itu, diperlukan mekanisme pemeriksaan integritas sejak tahap awal proses klaim sebelum masuk ke sistem nasional.","Tujuan BastionGate adalah menyediakan mekanisme pemeriksaan integritas klaim sebelum proses verifikasi utama (sistem nasional) melalui pendekatan Claim Integrity Gateway. Solusi ini membantu mengidentifikasi risiko lebih dini, memprioritaskan klaim yang memerlukan perhatian, meningkatkan efisiensi proses verifikasi, memperkuat transparansi melalui audit trail, serta mendukung keberlanjutan pengelolaan dana JKN.","BastionGate dirancang untuk menutup celah antara proses pengajuan klaim dan proses verifikasi nasional melalui mekanisme early integrity screening. Dengan menempatkan pemeriksaan integritas pada tahap paling awal, BastionGate membantu BPJS Kesehatan memfokuskan sumber daya verifikasi pada klaim yang benar-benar membutuhkan perhatian, sekaligus memperkuat transparansi, auditabilitas, dan efisiensi pengelolaan dana JKN.\nBastionGate for JKN menawarkan solusi konkret, aplikatif, dan siap terpasang yang mentransformasi verifikasi klaim dari yang semula reaktif di hilir menjadi proteksi proaktif di hulu.\nMelalui pendekatan Claim Integrity Gateway, BastionGate menggeser paradigma pengendalian klaim dari sekadar verifikasi setelah klaim diterima menjadi pencegahan risiko sejak awal proses. Dengan demikian, BastionGate tidak hanya membantu meningkatkan efisiensi verifikasi, tetapi juga memperkuat integritas, transparansi, dan keberlanjutan ekosistem JKN secara keseluruhan.","BastionGate bertujuan mengurangi risiko fraud, dispute, dan keterlambatan klaim melalui pemeriksaan integritas sejak tahap awal pengajuan klaim. Dengan pendekatan risk prioritization dan human-in-the-loop, solusi ini membantu BPJS Kesehatan meningkatkan efisiensi verifikasi, kualitas pengelolaan klaim, serta transparansi ekosistem JKN secara berkelanjutan."],"r":[{"n":"Husnun Nashir","s":[3,2,2,2,2,3]},{"n":"Arman Annas Putra","s":[4,2,2,3,3,3]},{"n":"Djaka Santosa","s":[4,2,1,2,2,2]},{"n":"Wahyu Satriyo Wibowo","s":[4,4,4,3,3,4]}]},{"id":"2114","tim":"Arsa AI","inov":"ARSA: JKN Risk Intelligence Platform","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2114_Arsa_AI_Submission.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["Audit klaim JKN saat ini mengandalkan sampling manual sebesar 5-10% klaim pascabayar, sehingga lebih dari 90% klaim lolos tanpa verifikasi mendalam. Praktik upcoding, phantom billing, cloning klaim, dan length of stay tidak wajar sulit terdeteksi lintas rumah sakit karena keterbatasan investigator dan minimnya alat pencocokan naratif klinis. Proses investigasi manual berlangsung 4-6 minggu per kasus, memperlambat pemulihan dana dan membuka celah kebocoran dana JKN setiap tahun.","Membangun platform yang mengaudit 100% klaim JKN secara otomatis, bukan hanya sampel, dengan detektor deterministik dan pencocokan semantik untuk mengenali upcoding, phantom billing, cloning, dan LOS abnormal. Setiap klaim yang ditandai disertai dosir bukti yang dapat diverifikasi investigator, mempercepat siklus investigasi dari hitungan minggu menjadi menit, sambil menjaga keputusan akhir tetap di tangan manusia dan mematuhi UU PDP.","ARSA adalah platform Risk Intelligence untuk BPJS Kesehatan yang menggabungkan mesin deteksi anomali deterministik, pencocokan semantik berbasis pgvector, dan AI generatif yang selalu berbasis bukti. Setiap klaim diperiksa terhadap kaidah klinis (severity vs diagnosis, tarif standar vs tagihan), lalu narasi CPPT/ringkasan pulang dibandingkan lintas klaim untuk mendeteksi cloning dan sindikat. Temuan disajikan sebagai dosir investigasi yang mengutip dokumen sumber (ringkasan pulang, rincian tagihan, log kamar operasi) sehingga auditor dapat memverifikasi, bukan sekadar mempercayai skor AI. Platform menyediakan peta risiko geospasial 34 provinsi, graf relasi dokter-fasilitas-klaim untuk mengungkap pola sindikat, mesin onboarding data yang otomatis memetakan skema SIMRS rumah sakit ke skema kanonik JKN, serta ruang kerja investigasi dengan aksi Konfirmasi Risiko, Minta Bukti, atau Tandai False Positive. Data pribadi peserta dianonimkan sejak input sesuai UU PDP No. 27/2022.","Dengan audit 100% klaim, platform berpotensi mengidentifikasi indikasi fraud senilai ratusan miliar rupiah per tahun yang selama ini lolos verifikasi. Siklus investigasi terpangkas dari 4-6 minggu menjadi hitungan menit, membebaskan waktu investigator untuk kasus bernilai tinggi. Deteksi sindikat lintas rumah sakit menutup celah yang luput dari audit manual per klaim, memperkuat keberlanjutan dana JKN dan kepercayaan peserta serta fasilitas kesehatan yang jujur."],"r":[{"n":"Arman Annas Putra","s":[4,3,3,3,3,4]},{"n":"Djaka Santosa","s":[4,4,4,3,3,3]},{"n":"I Made Karistiawan","s":[3,4,4,3,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,3,3]}]},{"id":"2127","tim":"SISOslo","inov":"SIMPUL (Sistem Identifikasi Modus Penyalahgunaan Utilisasi Layanan)","kat":"Efisiensi Risiko pada Peserta JKN","f":"2127_healthkathon-2026-si-tela-proposal-deck.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["BPJS Kesehatan memverifikasi ±650.000 klaim/hari; ±5% terindikasi kecurangan, ditaksir merugikan ±Rp 6 T/tahun. Sistem eksisting memeriksa satu klaim pada satu waktu, sehingga tiap klaim lolos sebagai wajar, padahal sebagian risiko baru tampak saat klaim dianalisis terhubung satu peserta ke banyak faskes, bermuara ke satu dokter peresep. SIMPUL mengubah unit analisis dari klaim tunggal menjadi pola relasi antar klaim dan menghadirkan sinyal risiko terprioritas bagi verifikator","Membantu BPJS Kesehatan mendeteksi kejanggalan klaim yang per klaimnya wajar tetapi tidak masuk akal bila dilihat bersama. SIMPUL merangkai data klaim menjadi jaringan relasi peserta, faskes, dokter, dan obat, menghasilkan sinyal risiko terprioritas beserta bukti pola bagi verifikator. Tujuannya adalah mempercepat dan memfokuskan telaah, menutup celah deteksi lintas klaim, serta menekan kerugian program dengan keputusan akhir tetap di tangan verifikator manusia.","SIMPUL (Sistem Identifikasi Modus Penyalahgunaan Utilisasi Layanan) membaca klaim JKN sebagai jaringan relasi, bukan klaim tunggal. Dari data klaim yang tersedia dianonimkan sesuai kewenangan akses SIMPUL merangkai hubungan peserta, faskes, dokter, obat, dan waktu menjadi graf. Analisis pola mengenali konsentrasi, pengulangan, dan keterhubungan yang menyimpang dari pola normal, lalu menghasilkan sinyal risiko terprioritas beserta bukti pola untuk verifikator. Setiap sinyal disertai alasan dan kemungkinan penjelasan yang sah, sehingga keputusan akhir tetap di tangan manusia. SIMPUL tidak menggantikan biometrik maupun verifikasi klaim ia menutup celah yang tidak terjangkau keduanya, kejanggalan yang tiap klaimnya wajar, tetapi akumulasinya tidak masuk akal. Prototipe telah berjalan dengan data sintetis: generator data, detektor pola, penyusun berkas telaah, dan dashboard.","Telaah verifikator yang kini menyasar seluruh klaim menjadi terfokus pada sinyal berprioritas tinggi dan waktu telaah lebih efisien. Kejanggalan lintas klaim yang tak tampak menjadi terdeteksi, sehingga potensi kerugian program tertekan lebih dini. Faskes dan dokter jujur terlindungi seperti pola wajar tidak ikut ditandai, telaah menyajikan bukti dan penjelasan yang sah, bukan tuduhan. Dampak diukur dari tingkat deteksi pola, waktu deteksi, dan efisiensi telaah pada uji coba data sintetis."],"r":[{"n":"Djaka Santosa","s":[4,4,3,3,3,2]},{"n":"I Made Karistiawan","s":[4,3,3,3,3,3]},{"n":"Agung Waluyo","s":[3,4,4,3,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,3,3]}]},{"id":"2133","tim":"Team","inov":"CAKRA Sistem AI Rekonsiliasi Resume Medis untuk Mencegah Anomali Klaim Faskes JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2133_CAKRA Sistem AI Rekonsiliasi Resume Medis untuk Mencegah Anomali Klaim Faskes JKN.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Digitalisasi layanan kesehatan melalui implementasi SIMRS dan Rekam Medis Elektronik (RME) saat ini masih bersifat administratif (passive data entry). Tanpa adanya audit klinis cerdas, sistem menganut prinsip garbage in, garbage out sehingga gagal memvalidasi keselarasan antara tindakan, resep obat, dan diagnosis medis sebelum klaim dikirimkan ke BPJS Kesehatan. Kondisi ini memicu kebocoran dana jaminan sosial JKN secara masif akibat manipulasi penggelembungan diagnosis (upcoding) dan pemecahan","Tujuan utama dari pengembangan proposal ini adalah menghadirkan sistem middleware intelligent pre-verification berbasis kecerdasan buatan yang menjembatani sistem rumah sakit (SIMRS/E-Klaim) dengan portal V-Claim BPJS Kesehatan secara real-time sebelum berkas ditagihkan.Secara spesifik, sistem ini bertujuan untuk memitigasi risiko kebocoran dana jaminan sosial JKN akibat praktik upcoding, services unbundling, phantom billing, dan cloning melalui mekanisme smart auto-triage.","CAKRA (Sistem AI Rekonsiliasi Resume Medis untuk Mencegah Anomali Klaim Faskes JKN) adalah aplikasi web dashboard terintegrasi berbasis Laravel 12 dan Blade yang terhubung langsung dengan mesin audit microservice AI Python. Mengusung tagline “Bridging Unstructured Medical Records with Structured INA-CBGS”, CAKRA memosisikan diri sebagai middleware intelligent pre-verification yang menerapkan konsep Dual-Protection Ecosystem. Sistem ini bekerja dua arah: memberikan instrumen pra-audit mandiri bagi fasilitas kesehatan untuk mencegah dispute, sekaligus menyediakan instrumen verifikasi otomatis bagi BPJS Kesehatan guna mencegah kecurangan klaim. Arsitektur CAKRA mengombinasikan Multi-Layer AI, yaitu algoritma CatBoost untuk menganalisis keselarasan medis tabular dan Graph Anomaly Detection untuk memetakan jaringan relasi dokter-faskes. Untuk menjaga transparansi analisis, setiap anomali yang ditemukan dilengkapi dengan Reasoning Card berbasis Explainable AI.","Bagi BPJS Kesehatan, CAKRA mencegah kebocoran dana jaminan sosial akibat upcoding, unbundling, dan phantom billing, serta mempercepat audit dan menekan false negative via smart auto-triage. Bagi faskes, simulator pra-audit mencegah sengketa klaim (dispute) guna menjaga kelancaran arus kas rumah sakit. Bagi peserta, terjaganya integritas dana JKN memastikan keberlanjutan mutu pelayanan kesehatan tanpa hambatan administratif."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Agung Waluyo","s":[4,3,3,2,3,3]},{"n":"Paul Donald P","s":[3,2,2,2,3,2]},{"n":"Wahyu Satriyo Wibowo","s":[4,4,4,4,4,3]}]},{"id":"2156","tim":"Rapat RT Bahas Iuran BPJS Nunggak 3 Bulan","inov":"Riskora - Gatekeeper AI Pra-Purifikasi Dokumen Klaim JKN Berbasis Multi-Layer Neural Network","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2156_Healthkathon 2026_Proposal_Riskora.pdf","fw":"","lk":1,"dec":"L","fd":"07/10/2026","rv":"","sub":["Layanan JKN mencapai 673,9 juta pemanfaatan/tahun dengan rata-rata 1,8 juta/hari, memicu backlog verifikasi. Masalah utama timbul dari pending claim (86,39% akibat ketidaksesuaian medis & coding) serta temuan fraud seperti phantom billing dan upcoding bernilai puluhan miliar rupiah. Koreksi retrospektif sangat mahal, sehingga dibutuhkan penapisan otomatis di gerbang awal sebelum berkas masuk antrean verifikator.","Mengembangkan Riskora sebagai Gatekeeper AI pra-purifikasi real-time yang secara otomatis mengekstraksi, menalar, dan memvalidasi keabsahan dokumen klaim JKN. Sistem bertujuan mengeliminasi berkas kotor, mendeteksi potensi fraud (upcoding, unbundling, phantom billing) sejak dini, mengurangi pending claim, serta mempercepat proses verifikasi dan siklus pencairan dana bagi Faskes.","Riskora adalah penapis otomatis berbasis AI yang menjembatani SIMRS/E-Klaim Faskes dan BPJS Kesehatan. Menggabungkan OCR presisi tinggi untuk membaca berkas scanned, LLM Reasoning Agent untuk memvalidasi kesesuaian klinis vs diagnosis, serta Graph Neural Network (GNN) untuk membongkar pola sindikat fraud. Berkas anomali langsung menerima respon Return to Provider instan sebelum masuk antrean verifikator.","Riskora diproyeksikan menekan risiko kebocoran dana akibat fraud hingga 45% melalui deteksi dini anomali klaim. Sistem ini menargetkan efisiensi beban verifikasi manual BPJS sebesar 30% dengan memfilter berkas kotor di gerbang awal. Dampaknya, siklus pencairan klaim sah Faskes dipercepat hingga 15%, serta mendukung pemerataan dana JKN (10%) karena anggaran terlindungi dari klaim fiktif dan tepat sasaran bagi masyarakat."],"r":[{"n":"Agung Waluyo","s":[3,3,2,2,1,3]},{"n":"Paul Donald P","s":[4,4,2,2,2,2]},{"n":"Tria Sofa Purnama","s":[3,3,3,3,3,2]},{"n":"Wahyu Satriyo Wibowo","s":[4,3,4,3,3,3]}]},{"id":"2160","tim":"AnoaByte","inov":"CLAIMGUARD AI: Sistem Deteksi Dini Phantom Billing Berbasis Analitik Data Multidimensi dan Risk Scor","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2160_CLAIMGUARDAI - Sistem Deteksi Dini Phantom Billing Berbasis Analitik Data Multidimensi dan Risk Scoring untuk Penguatan Verifikasi Klaim JKN.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["Program JKN menjamin akses kesehatan masyarakat, namun volume klaim yang masif memicu risiko fraud seperti phantom billing (klaim fiktif atas layanan yang tidak pernah diberikan). Temuan riil menunjukkan modus ini sangat merugikan dana jaminan. Sistem verifikasi BPJS saat ini menghadapi keterbatasan kapasitas pemeriksaan manual yang membutuhkan waktu dan sumber daya besar, sehingga memerlukan penguatan sistem deteksi dini berbasis risiko sebelum pembayaran klaim faskes disetujui.","Mengembangkan ClaimGuard AI sebagai sistem pendukung keputusan (Decision Support System) untuk membantu BPJS Kesehatan mendeteksi indikasi phantom billing secara dini, mengidentifikasi pola klaim tidak wajar, memberikan penilaian skor risiko (0-100) pada setiap klaim, serta memprioritaskan proses verifikasi manual berkas klaim secara efisien, akurat, preventif, dan berbasis data sebelum dana dicairkan.","ClaimGuard AI adalah inovasi Early Warning & Risk Scoring Layer yang mengintegrasikan data multidimensi (peserta, kunjungan, rekam medis, diagnosis, tindakan, billing, dan histori klaim) untuk mendeteksi phantom billing secara preventif. Dengan pendekatan hybrid (Rule-Based Engine dan Machine Learning Anomaly Detection), sistem melakukan validasi silang (cross-validation) otomatis untuk menghasilkan Fraud Risk Score berskala 0–100. Skor ini dibagi menjadi empat kategori: Low, Moderate, High, dan Critical Risk. Klaim berisiko tinggi secara otomatis menyalakan alarm (alert) dan diprioritaskan untuk pemeriksaan mendalam oleh petugas. Sistem menerapkan konsep Human-in-the-Loop, di mana AI memberikan rekomendasi skor risiko klinis secara transparan, sementara keputusan verifikasi akhir tetap sepenuhnya di tangan manusia (verifikator BPJS). Pengamanan data didesain dengan asas Privacy-by-Design menggunakan enkripsi dan penyamaran data (masking) peserta JKN.","ClaimGuard AI mengubah proses verifikasi dari reaktif (audit pasca-bayar) menjadi preventif (skrining pra-bayar). Dampaknya meliputi optimalisasi sumber daya verifikasi dengan memfokuskan energi petugas pada klaim berisiko tinggi (skor > 60), mendeteksi anomali fraud multidimensi yang sulit dikenali manual, mencegah kebocoran dana amanat JKN sejak dini, serta mendorong faskes menyusun dokumentasi pelayanan dan rekam medis yang bersih, konsisten, dan akuntabel."],"r":[{"n":"Paul Donald P","s":[3,2,2,2,2,3]},{"n":"Tria Sofa Purnama","s":[4,3,3,2,3,3]},{"n":"Ikhlasul Amalia","s":[4,3,3,2,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[4,3,3,3,4,3]}]},{"id":"2163","tim":"Tokenemia","inov":"SatuPantau: Platform Integritas Layanan JKN Berbasis Smart Ticketing dan Agentic Multimodal AI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2163_Proposal_Healthkathon2026_EfisiensiRisiko_SatuPantau.pdf","fw":"","lk":1,"dec":"T","fd":"28/09/2026","rv":"","sub":["Beban klaim JKN 2025 menembus Rp191,33 triliun dengan rasio klaim 108,27 persen. Audit pasca-bayar manual membuka celah kebocoran dana karena tidak mampu membuktikan kehadiran fisik. Investigasi KPK bersama BPJS Kesehatan pada Juli 2024 membongkar manipulasi klaim Rp34 miliar di 3 rumah sakit, termasuk 75 persen klaim fisioterapi fiktif. BPJS Kesehatan membutuhkan saksi digital langsung di titik layanan faskes untuk menghentikan klaim fiktif sebelum dana jaminan sosial cair.","SatuPantau membangun rantai verifikasi layanan tertutup di faskes. Sistem membuktikan kehadiran fisik pasien dan dokter di ruang periksa, memvalidasi rekaman video operasi, serta memastikan penyerahan obat kronis secara utuh. Validasi langsung di titik layanan ini mencegah kebocoran dana jaminan sosial, memangkas durasi sengketa klaim dari 30 hari ke hitungan menit, dan menghentikan pemborosan kertas formulir SEP.","SatuPantau mengintegrasikan 4 modul titik layanan:\n1. SatuTiket: Kiosk mandiri menerbitkan Smart-SEP (token QR berbatas waktu berkunci kriptografi Ed25519 dan hash NIK) via WhatsApp atau tiket ramah lingkungan, dilengkapi triase audio awal.\n2. SatuSaksi: Tablet meja dokter berkamera ganda membuktikan tatap muka dokter dan pasien secara real-time. Deteksi wajah memakai Pixel Intensity Comparison Cascade (Pigo Go) di CPU lokal faskes tanpa transmisi cloud, patuh UU No. 27/2022 PDP.\n3. SatuBukti: Audit rekaman bedah memakai penalaran video multimodal Gemini 3.7 Flash. Agen AI membaca audio operasi untuk melompat ke detik krusial dan mengekstrak frame implan alkes menjadi bukti sah bagi verifikator BPJS.\n4. SatuResep: Pemindaian barcode GS1 mencocokkan fisik obat dengan e-resep, lalu menghanguskan tiket di Redis agar tidak bisa diklaim ulang.\nArsitektur Go mandiri menghasilkan biaya operasional riil hanya Rp80 per kunjungan.","SatuPantau menekan potensi klaim fiktif menuju nol dan menghemat potensi kebocoran dana klaim miliaran rupiah. Rumah sakit memperoleh kepastian pencairan klaim lebih cepat tanpa sengketa pending berbulan-bulan dan menghemat biaya cetak kertas formulir SEP. Peserta JKN menerima jatah obat kronis program rujuk balik secara utuh. Arsitektur interoperabel berbasis REST API dan FHIR HL7 memastikan integrasi mulus tanpa merombak sistem SIMRS faskes eksisting."],"r":[{"n":"Tria Sofa Purnama","s":[2,3,2,2,2,1]},{"n":"Ikhlasul Amalia","s":[2,1,2,2,2,1]},{"n":"Husnun Nashir","s":[2,3,4,1,2,1]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,3,3]}]},{"id":"2180","tim":"TERSERAH","inov":"SIGAP, Smarter Protection for Sustainable JKN (Sistem Identifikasi & Analitik Risiko Anti-Penyalahgu","kat":"Efisiensi Risiko pada Peserta JKN","f":"2180_SIGAP-Smarter-Protection-for-Sustainable-JKN - terserah.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["Penyalahgunaan identitas JKN merugikan Rp 2–3 triliun per tahun. Audit manual sangat lambat, reaktif, dan hanya menyentuh <1% dari total >500 juta klaim.","Mengembangkan SIGAP sebagai platform Silent Post-Audit Screening nir-gangguan faskes berbasis AI dan human-in-the-loop guna mendeteksi anomali serta menyelamatkan dana JKN Rp 1,5–2 triliun/tahun.","SIGAP (Sistem Identifikasi & Analitik Risiko Anti-Penyalahgunaan Peserta JKN) adalah platform analitik pasca-kunjungan berbasis hybrid intelligence untuk mendeteksi anomali dan kecurangan program JKN secara proaktif. Mengusung konsep Silent Post-Audit Screening, SIGAP beroperasi di backend secara nightly batch tanpa mengganggu alur pelayanan medis di fasilitas kesehatan (zero disruption).\n\nSistem ini memanfaatkan tiga lapisan algoritma cerdas: Rule-Based Engine untuk regulasi, Spatiotemporal Anomaly (formula Haversine) untuk mendeteksi impossible travel, dan Graph Network Analysis untuk mengidentifikasi jaringan sindikat. Melalui 5 tahap alur kerja (Ingestion, Anonymization, Risk Engine, Klasifikasi, Human Execution), data dianonimisasi menggunakan hashing demi kepatuhan UU PDP. SIGAP menerapkan prinsip Human-in-the-Loop dan Explainable AI (XAI), di mana AI menyediakan skor risiko 0-100 beserta evidence trail, sementara keputusan akhir (Setuju, Tahan, Tolak) mutlak di tangan verifikato","Potensi penyelamatan dana JKN mencapai Rp 1,5–2 triliun per tahun secara nasional. Waktu penyaringan awal 80% lebih cepat, membuat verifikator fokus pada 5–10% klaim berisiko tinggi. Menghadirkan zero delay tanpa gangguan pada alur pelayanan faskes. Menjaga kepercayaan peserta melalui transparansi Explainable AI tanpa keputusan black-box."],"r":[{"n":"Ikhlasul Amalia","s":[3,3,2,3,2,3]},{"n":"Husnun Nashir","s":[3,2,2,3,2,2]},{"n":"Arman Annas Putra","s":[4,4,4,3,3,4]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,3,3]}]},{"id":"2211","tim":"Helta","inov":"ClaimGuard AI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2211_Proposal_ClaimGuardAI_Healthkathon2026.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["Risiko klaim JKN lahir di titik pengajuan, bukan setelah dana cair. Di satu RSUD tipe B mitra BPJS, sekitar 20-26% klaim pending tiap bulan, nilai tertahan berkisar Rp 4 M dan tertunda di atas 30 hari (rentang agregat, anonim). Penyebabnya berulang: berkas tidak lengkap, penunjang belum terbaca, ketidaksesuaian DPJP, readmisi. Dari sisi BPJS, kesalahan yang sama adalah pintu masuk unbundling, repeat billing, dan readmisi bermasalah. Kontrol hulu sudah dikenal, tetapi manual dan statis.","Menanamkan gerbang AI pada alur klaim yang sudah berjalan di rumah sakit agar risiko koding dan readmisi terdeteksi sebelum klaim diajukan. Sasaran: (1) memastikan berkas dan penunjang lengkap sebelum status klaim naik; (2) menandai klaim berisiko unbundling, repeat billing, prolonged stay, dan readmisi beserta alasannya; (3) menurunkan rasio klaim pending dan nilai klaim tertahan; (4) meringankan beban verifikasi BPJS. Keputusan akhir tetap pada koder dan tim casemix.","ClaimGuard AI adalah gerbang kepatuhan pra-pengajuan yang ditanam pada alur verifikasi bertingkat yang sudah berjalan: Draft - Lengkap - Verifikasi Koder - Verifikasi Casemix - e-Klaim. Lima gerbang: (1) pemeriksa kelengkapan berkas; (2) gerbang kesiapan penunjang, terhubung monitor bacaan radiologi yang beroperasi harian; (3) skor risiko klaim dari pola historis diagnosis-tindakan-DPJP-episode; (4) validator koding dan DPJP dua arah; (5) deteksi readmisi dan lama rawat di luar kewajaran. Data episode SIMRS dianonimkan oleh PHI scrubber di sisi RS; gradient boosting untuk fitur terstruktur, NLP/LLM untuk membaca resume, aturan deterministik untuk kelengkapan. Identitas pasien hanya dipulihkan di sistem RS. Dua mode: (A) tertanam di RS, skor real-time; (B) RS mengirim ekspor anonim lewat web/offline dan menerima skor, tanpa proyek integrasi di tiap faskes. AI menyarankan, manusia memutuskan, sistem mencatat jejak audit. Status: prototype menuju MVP, diuji internal bersama tim casemix.","Faskes: rasio klaim pending ditargetkan turun ke 10% atau kurang dalam 6 bulan uji terap, arus kas tidak lagi tertunda, pemberkasan ulang berkurang. BPJS: klaim yang masuk lebih bersih sehingga beban verifikasi turun, dan sinyal dini anomali koding maupun readmisi datang dari sisi faskes. Peserta JKN: arus kas RS yang sehat menjaga kesinambungan layanan. Angka target di atas adalah estimasi dari distribusi penyebab pending, belum diuji terap, dan akan divalidasi pasca-kompetisi."],"r":[{"n":"Husnun Nashir","s":[4,4,4,4,4,3]},{"n":"Arman Annas Putra","s":[4,3,4,3,3,4]},{"n":"Djaka Santosa","s":[4,3,4,3,3,4]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,2,3]}]},{"id":"2217","tim":"MedAI Nexus","inov":"JELAS_Jejak Evaluasi Layanan dan Analisis Sinyal","kat":"Efisiensi Risiko pada Peserta JKN","f":"2217_JELAS_Pitch_Deck_Healthkathon_BPJS_2026_Efisiensi_Risiko_Peserta.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["Program JKN menghadapi risiko penyalahgunaan obat/alkes, seperti perolehan yang tidak sesuai indikasi, berlebihan, atau berulang sebelum persediaan habis. Data diagnosis, resep, refill, distribusi, dan pemakaian masih tersebar sehingga telaah manual lambat dan tidak konsisten. JELAS menerapkan deteksi berbasis risiko dan explainable AI untuk memprioritaskan anomali secara transparan. Keputusan akhir tetap dilakukan petugas melalui prinsip human-in-the-loop.","JELAS bertujuan membantu BPJS Kesehatan mendeteksi dan memprioritaskan pola perolehan obat/alkes yang tidak sesuai indikasi atau kebutuhan klinis. Sistem mengintegrasikan data diagnosis, resep, refill, distribusi, dan pemakaian, lalu menghasilkan sinyal risiko yang transparan. Keputusan akhir tetap dilakukan apoteker atau verifikator melalui prinsip human-in-the-loop agar efisiensi JKN meningkat tanpa menghambat hak peserta memperoleh terapi.","JELAS (Jejak Evaluasi Layanan dan Analisis Sinyal) adalah sistem pendukung keputusan untuk mendeteksi risiko penyalahgunaan obat/alkes oleh peserta JKN. Sistem mengintegrasikan diagnosis, indikasi, resep, dosis, riwayat refill, rujukan, distribusi, estimasi sisa, dan bukti pemakaian. Aturan pasti dan deteksi anomali digunakan untuk mengenali pengambilan terlalu dini, jumlah berlebih, duplikasi, ketidaksesuaian indikasi, atau pola lintas fasilitas. Setiap sinyal disertai kode alasan agar transparan dan dapat diaudit. Fokus awal mencakup Program Rujuk Balik dan CAPD. JELAS tidak menetapkan fraud atau menolak layanan otomatis. Keputusan akhir tetap dilakukan apoteker atau verifikator melalui prinsip *human-in-the-loop*. Prototype telah disimulasikan menggunakan 6.960 kasus sintetis tanpa memakai data peserta JKN riil.","JELAS diharapkan mempercepat deteksi penyalahgunaan obat/alkes, mengurangi beban telaah manual, dan membantu verifikator memprioritaskan kasus berisiko. Sistem meningkatkan konsistensi, transparansi, dan keterlacakan keputusan sekaligus menekan potensi pemborosan dana JKN. Bagi peserta, JELAS menjaga akses terapi yang sesuai indikasi karena tidak melakukan penolakan otomatis dan tetap menyediakan mekanisme klarifikasi."],"r":[{"n":"Arman Annas Putra","s":[4,3,3,3,3,3]},{"n":"Djaka Santosa","s":[3,3,3,2,2,3]},{"n":"I Made Karistiawan","s":[3,3,3,3,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,3,3]}]},{"id":"2247","tim":"AKAR","inov":"JKN ObatGuard PRB","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2247_Proposal_Healthkathon_2026_ObatGuard_PRB.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["Peserta PRB membutuhkan obat rutin, tetapi masih terdapat risiko obat kosong, obat diserahkan kurang dari resep, atau klaim ditagihkan penuh tanpa pemberian sesuai ketentuan. Kondisi ini menyulitkan deteksi dini dan dapat merugikan peserta maupun BPJS Kesehatan.","ObatGuard PRB bertujuan mendeteksi indikasi pengurangan jumlah obat melalui perbandingan data resep, penyerahan obat, dan klaim. Sistem membantu BPJS Kesehatan memprioritaskan kasus berisiko untuk diverifikasi secara cepat, objektif, dan berbasis data.","ObatGuard PRB adalah dashboard analitik untuk memantau risiko ketidaksesuaian layanan obat Program Rujuk Balik. Sistem mengintegrasikan data resep, penyerahan obat, klaim, stok, dan aduan peserta untuk menganalisis selisih jumlah obat serta pola kejadian berulang. Hasil analisis disajikan dalam bentuk skor risiko, daftar prioritas pemeriksaan, pencarian kasus, filter berdasarkan diagnosis atau fasilitas kesehatan, dan audit trail. Prototype menggunakan data sintetis serta mendukung simulasi kalkulasi risiko secara real-time. Pada tahap pengembangan berikutnya, sistem dapat diuji menggunakan data resmi dengan tata kelola, keamanan, dan persetujuan yang sesuai.","ObatGuard PRB diharapkan mempercepat deteksi obat yang diserahkan kurang dari jumlah yang ditagihkan, meningkatkan ketepatan pemeriksaan, dan mengurangi potensi kerugian akibat klaim tidak sesuai. Solusi ini juga mendukung pemenuhan hak peserta JKN serta memperkuat pengawasan layanan obat secara transparan dan proaktif."],"r":[{"n":"Djaka Santosa","s":[3,2,2,3,2,2]},{"n":"I Made Karistiawan","s":[3,2,2,3,3,3]},{"n":"Agung Waluyo","s":[4,3,3,3,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[4,4,4,4,3,3]}]},{"id":"2257","tim":"Link Productive","inov":"BPJS Compliance Guard (BCG) — Smarter Protection for a Stronger JKN","kat":"Efi
