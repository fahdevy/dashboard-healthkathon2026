siensi Risiko pada Pemberi Kerja","f":"2257_Proposal_BPJS_Compliance_Guard_Healthkathon2026 (1).pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kepatuhan pemberi kerja terhadap JKN masih banyak bergantung pada audit periodik dan pelaporan manual yang berpotensi tidak selaras dengan data e-Dabu/SIPP. Akibatnya, risiko seperti PDUK, under-reporting upah, penundaan setoran, misklasifikasi status kerja, dan manipulasi mutasi dapat terlambat terdeteksi. Kondisi ini berisiko mengurangi perlindungan pekerja, potensi penerimaan iuran, dan menciptakan persaingan yang tidak setara.","Membangun sistem continuous compliance yang mampu mendeteksi lima pola risiko pemberi kerja secara dini dan mengarahkan tindak lanjut melalui proses resmi e-Dabu. BCG bertujuan meningkatkan akurasi data kepesertaan, upah, dan iuran; mempercepat remediasi; serta menyediakan data kepatuhan yang transparan dan dapat diaudit untuk mendukung pengawasan dan proyeksi penerimaan.","BPJS Compliance Guard (BCG) adalah sistem deteksi dan remediasi kepatuhan berbasis data yang mencocokkan HRIS, payroll, e-Dabu/SIPP, dan data setoran iuran secara read-only menggunakan rule engine yang configurable dan explainable.\nBCG menyediakan Pusat Deteksi, Alert, Manajemen Kasus, Closed-Loop Remediation, Self-Audit, Analitik Kepatuhan, serta Skor dan Sertifikasi Bulanan. Temuan menghasilkan flag tindak lanjut, sementara perubahan data resmi tetap dilakukan oleh admin HR melalui akun e-Dabu. Status kasus hanya dinyatakan selesai setelah data resmi diperbarui.\nBCG menerapkan prinsip human-in-the-loop sehingga hasil sistem merupakan indikasi yang wajib diverifikasi, bukan keputusan hukum otomatis. Pengembangan berikutnya dapat menambahkan AI untuk merangkum temuan dan membantu menentukan prioritas verifikasi auditor.","BCG diharapkan mempercepat deteksi dan penyelesaian kasus kepatuhan, meningkatkan realisasi iuran dari kasus yang terverifikasi, serta memperkuat akurasi data peserta JKN. Perusahaan memperoleh mekanisme kepatuhan yang lebih transparan, sedangkan BPJS Kesehatan memperoleh data kepatuhan, tren risiko, dan skor pemberi kerja yang terukur serta dapat diaudit. Dengan demikian, pengawasan dapat bergeser dari pendekatan reaktif berbasis audit menuju early detection dan continuous compliance."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Agung Waluyo","s":[3,3,4,3,4,4]},{"n":"Paul Donald P","s":[3,2,2,2,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,3,3]}]},{"id":"2259","tim":"Individual - Johannes HP Sipahutar SH,.CLA","inov":"JEJAK_Kepatuhan_Proposal_REVISI_v2","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"Berkas revisi belum tersedia di folder proposals. Jangan menilai memakai proposal lama.","lk":0,"dec":"","fd":"","rv":"Hasil revisi, menggantikan proposal sebelumnya (Tidak lulus, flag 30/09/2026)","sub":["Kepatuhan pemberi kerja menopang keberlangsungan JKN, tetapi rentan terhadap misklasifikasi status kerja dan under-reporting upah yang kerap terjadi bersamaan. Data BPJS Ketenagakerjaan (April 2026) mencatat 523.000 dari 878.000 pemberi kerja aktif terindikasi belum patuh. BPJS Kesehatan memberi bobot 70% pada ketepatan data kepesertaan, sehingga persoalan intinya adalah akurasi data dalam dokumen, sementara pengawasan masih banyak bersifat reaktif.","Membangun sistem audit berbasis AI untuk BPJS Kesehatan yang menyilangkan kontrak kerja dan slip gaji dengan data yang dilaporkan, guna mendeteksi indikasi misklasifikasi status kerja dan under-reporting upah sejak tahap pelaporan. Setiap temuan disertai rujukan pasal dan skor keyakinan sebagai bahan prioritas bagi auditor manusia, sehingga pengawasan bergeser dari reaktif menjadi dini.","JEJAK Kepatuhan adalah asisten audit untuk pengawas BPJS Kesehatan, bukan software kepatuhan bagi perusahaan. Versi revisi ini sudah berupa prototipe yang berjalan: dataset.py (12 kasus simulasi tak terstruktur), engine.py (ekstraksi dan validasi terhadap Pasal 59 UU Cipta Kerja, Pasal 8 PP 35/2021, dan Pasal 15 UU BPJS, dengan ambang berbeda untuk UMKM), serta dashboard auditor yang dirender dari hasil nyata. Pada 12 kasus simulasi: 3 prioritas tinggi, 3 sedang, 5 bersih. Batasnya: ekstraksi masih memakai regex, bukan model bahasa; untuk dokumen dunia nyata akan diganti model bahasa pada tahap berikutnya, dan lapisan ekstraksi dirancang dapat diganti. Seluruh data fiktif sesuai UU PDP. Skor dibatasi 96% dan auditor manusia yang memutuskan. Kode terbuka: github.com/Parulian-290/jejak-kepatuhan-prototype","Pengawasan bergeser dari reaktif (kunjungan setelah tunggakan) menjadi dini (deteksi sejak pelaporan data). Pada 12 kasus simulasi, sistem menandai 6 kasus berprioritas tinggi atau sedang dengan estimasi selisih upah Rp11,9 juta per bulan. Angka ini hanya bukti logika bekerja pada data fiktif; precision dan dampak nyata belum terukur dan akan diuji dengan dataset lebih besar dan penilai manusia. Penerima manfaat: pekerja, BPJS Kesehatan, dan pendanaan JKN."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Yanuar Milad","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2262","tim":"Hu Tao Supremacy","inov":"Nexus JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2262_NEXUS-JKN.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["NEXUS-JKN dilatarbelakangi oleh maraknya modus rujukan semu (self-referral) penyakit ringan antar-faskes yang lolos dari audit dokumen konvensional karena 'kebutaan relasi', sehingga kami menghadirkan platform Radar Graph AI & XAI untuk mengungkap kolusi jejaring rujukan secara presisi demi mencegah kebocoran dana JKN","NEXUS-JKN bertujuan mengubah metode audit rujukan BPJS dari verifikasi dokumen klaim per lembar menjadi analisis peta relasi antar-faskes, memberikan prioritisasi audit berbasis risiko agar investigasi lapangan lebih cepat dan tepat sasaran, serta menyediakan bukti numerik transparan pada setiap anomali yang terdeteksi.","NEXUS-JKN adalah platform analitik Graph AI & Radar Real-Time untuk memetakan jejaring rujukan JKN dan mendeteksi sindikat rujukan semu (self-referral) serta kolusi antar-faskes secara otomatis dan transparan berbasis Explainable AI (XAI).","Inovasi ini berdampak pada pencegahan kebocoran dana JKN akibat klaim rujukan semu, memangkas waktu analisis triase auditor hingga 75% lebih cepat, serta mencegah penumpukan pasien penyakit ringan di Rumah Sakit agar pelayanan di FKTP berfungsi secara optimal."],"r":[{"n":"Paul Donald P","s":[4,3,3,4,3,3]},{"n":"Tria Sofa Purnama","s":[4,3,4,4,4,3]},{"n":"Ikhlasul Amalia","s":[4,3,3,4,4,3]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,4,3,3]}]},{"id":"2263","tim":"Infera","inov":"INFERA (Intelligent Fraud & Risk Analysis Agent) untuk Efisiensi Risiko Peserta BPJS Kesehatan","kat":"Efisiensi Risiko pada Peserta JKN","f":"2263_INFERA (INTELLIGENT FRAUD & RISK ANALYSIST AGENT) HEALTHKATHON 2026.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["Keberlanjutan Dana Jaminan Sosial (DJS) terancam oleh 3 risiko peserta: penyalahgunaan identitas (pinjam kartu), pemalsuan data (diskordansi biologis), dan pelayanan tidak perlu (doctor shopping). Audit pasca-klaim konvensional bersifat reaktif sehingga kebocoran terlanjur terjadi. Sesuai Permenkes 16/2019, INFERA hadir sebagai solusi deteksi dini berbasis algoritma dan AI forensik guna memitigasi risiko peserta secara preventif dan real-time pada saat penerbitan SEP.","Mengembangkan INFERA sebagai platform deteksi dini kecurangan peserta secara real-time melalui 3 klaster algoritma deterministik (Impossible Travel, Diskordansi Biologis, dan Doctor Shopping Index) yang terintegrasi dengan asisten AI forensik FERA berprinsip Human-in-the-Loop, guna mencegah kebocoran Dana Jaminan Sosial (DJS), menekan pelayanan tidak perlu, serta memperkuat integritas data kepesertaan BPJS Kesehatan.","INFERA adalah sistem intelijen anti-fraud peserta yang mentransformasi pengawasan dari audit reaktif menjadi mitigasi preventif real-time pada 3 sub-kategori:\n1. Mesin Deteksi Anomali: Algoritma Haversine untuk Impossible Travel (deteksi penyalahgunaan identitas & pinjam kartu antar-faskes), validasi silang Diskordansi Biologis (deteksi pemalsuan data/identitas vs ICD-10), dan Doctor Shopping Index (DSI untuk deteksi pelayanan tidak perlu pada kunjungan poli berulang <7 hari).\n2. Autonomous Forensic Agent (FERA): Asisten AI multimodal dengan 9 forensic tools (profiling peserta, scoring risiko 0-100, audit SEP, estimasi kerugian DJS, dan RAG 38 regulasi JKN seperti Permenkes 16/2019 & Perpres 82/2018).\n3. Human-in-the-Loop Governance: AI menyusun rekomendasi terukur, sementara keputusan administratif (audit lapangan/suspensi hak) wajib disetujui auditor berjenjang.\nDibangun scalable, INFERA siap diintegrasikan langsung dengan ekosistem VEDIKA & DEFRADA BPJS Kesehatan.","1. Finansial: Mencegah kebocoran Dana Jaminan Sosial (DJS) akibat klaim duplikatif dan identity sharing dengan proyeksi efisiensi hingga miliaran rupiah.\n2. Operasional: Mempercepat telaah dan verifikasi kasus fraud peserta hingga 70% berkat otomatisasi deteksi anomali dan asisten FERA.\n3. Tata Kelola: Memperkuat integritas ekosistem JKN, menjamin perlindungan hak peserta yang sah, dan menegakkan kepatuhan regulasi UU 24/2011 serta Permenkes 16/2019."],"r":[{"n":"Tria Sofa Purnama","s":[4,4,4,3,4,3]},{"n":"Ikhlasul Amalia","s":[4,4,3,3,4,3]},{"n":"Husnun Nashir","s":[4,4,4,3,4,4]},{"n":"Wahyu Satriyo Wibowo","s":[4,4,3,3,3,3]}]},{"id":"2269","tim":"CipHer","inov":"CLAIMGUARD: Smarter Duplicate Claim Detection for JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2269_Proposal_Healthkathon_2026_CLAIMGUARD_Emmanuel_Vito_Adventius_H.pdf","fw":"","lk":1,"dec":"T","fd":"30/09/2026","rv":"","sub":["Program JKN memiliki volume pelayanan dan klaim yang sangat besar sehingga membutuhkan mekanisme pengawasan yang efisien. Salah satu risiko yang menjadi fokus adalah Phantom & Repeat Billing, yaitu klaim atas layanan yang tidak diberikan atau klaim yang diajukan berulang. Perbedaan atribut data juga dapat membuat pola klaim berulang sulit ditemukan. CLAIMGUARD dikembangkan untuk mendeteksi duplicate dan near-duplicate claims serta memprioritaskan klaim yang perlu diperiksa.","Mengembangkan sistem claim screening untuk membantu mengidentifikasi duplicate dan near-duplicate claims, menghitung similarity score dan risk score, serta memprioritaskan klaim yang memiliki indikasi risiko lebih tinggi untuk pemeriksaan investigator. CLAIMGUARD dirancang sebagai decision-support system sehingga keputusan akhir tetap dilakukan melalui verifikasi dan penilaian manusia.","CLAIMGUARD merupakan sistem claim screening untuk mendukung pengawasan klaim JKN pada risiko Phantom & Repeat Billing. Sistem menerima data klaim, melakukan validasi, mendeteksi duplicate dan near-duplicate claims, menghitung similarity dan risk score, lalu menyajikan hasil dalam dashboard investigasi. Investigator dapat membandingkan klaim yang terindikasi sebelum menentukan tindak lanjut. Sistem tidak menetapkan fraud secara otomatis.","CLAIMGUARD diharapkan dapat mempercepat proses screening klaim, membantu investigator memprioritaskan klaim dengan indikasi risiko lebih tinggi, serta meningkatkan kemampuan menemukan duplicate dan near-duplicate claims. Sistem juga mendukung proses investigasi yang lebih terarah melalui perbandingan klaim dan penyajian risk score, dengan keputusan akhir tetap berada pada investigator."],"r":[{"n":"Ikhlasul Amalia","s":[3,2,2,2,2,2]},{"n":"Husnun Nashir","s":[3,2,1,2,2,2]},{"n":"Arman Annas Putra","s":[3,3,3,2,2,2]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,2,3]}]},{"id":"2293","tim":"unmer","inov":"MIRA (Medical Insight & Reasoning Agent)","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2293_MIRA_Healthkathon_2026.pdf","fw":"","lk":1,"dec":"T","fd":"30/09/2026","rv":"","sub":["Dalam penyusunan klaim, diagnosis dan tindakan perlu diperiksa sebagai satu kombinasi. Ketidaksesuaian atau catatan klinis yang belum mendukung tindakan dapat baru ditemukan saat verifikasi, sehingga memicu perbaikan berkas dan pemeriksaan ulang. MIRA membantu memeriksa klaim sejak awal dengan memetakan teks rekam medis, menghitung risiko menggunakan XGBoost, serta menampilkan status Hijau, Kuning, atau Merah untuk ditinjau manusia.","Membantu fasilitas kesehatan melakukan pemeriksaan awal terhadap kombinasi diagnosis, tindakan, dan catatan rekam medis sebelum klaim diajukan. MIRA memetakan informasi klinis, menghitung potensi risiko menggunakan XGBoost, serta menampilkan status Hijau, Kuning, atau Merah beserta rekomendasi agar dokter, petugas casemix, dan verifikator dapat melakukan peninjauan lebih cepat dan terdokumentasi.","Aplikasi ini merupakan pendamping pemeriksaan klaim fasilitas kesehatan yang bekerja sebelum klaim diajukan. Pengguna memasukkan ringkasan rekam medis, rencana tindakan, serta informasi LSPs are disabled diagnosis dan tindakan. Sistem membantu memetakan teks klinis ke kode ICD, menampilkan referensi pendukung, lalu menilai kombinasi diagnosis–tindakan menggunakan model machine learning XGBoost. Hasil pemeriksaan ditampilkan dalam tiga status: Hijau untuk kombinasi yang diprediksi wajar, Kuning untuk kondisi yang memerlukan peninjauan atau kelengkapan berkas, dan Merah untuk potensi ketidaksesuaian yang membutuhkan alasan medis. MIRA juga menyediakan rekomendasi, estimasi tarif, riwayat pemeriksaan, antrean faskes, dashboard verifikator, analisis What-If, dan ekspor laporan CSV. Sistem hanya memberikan penanda dan bahan pertimbangan; keputusan akhir tetap berada pada dokter, petugas casemix, dan verifikator. Prototype ini menggunakan data publik sintetis.","MIRA membantu fasilitas kesehatan mendeteksi potensi ketidaksesuaian antara diagnosis dan tindakan sebelum klaim diajukan. Penanda Hijau, Kuning, dan Merah membantu petugas koding memprioritaskan pemeriksaan dan melengkapi alasan medis. Bagi verifikator, dasbor, antrean risiko, analisis skenario, dan ekspor laporan membuat proses pemeriksaan lebih terstruktur. Dampak terhadap penurunan klaim tertunda dan efisiensi biaya masih berupa potensi yang perlu divalidasi melalui uji coba."],"r":[{"n":"Husnun Nashir","s":[3,2,3,2,2,3]},{"n":"Arman Annas Putra","s":[3,3,3,2,2,2]},{"n":"Djaka Santosa","s":[4,3,2,3,2,2]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,3,3]}]},{"id":"2356","tim":"Craving for Money","inov":"KlaimGuard AI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2356_KlaimGuard AI â€” Proposal Healthkathon.pdf","fw":"","lk":1,"dec":"L","fd":"28/09/2026","rv":"","sub":["Audit klaim JKN saat ini masih banyak mengandalkan sampling manual, padahal skala klaim terus tumbuh. KPK mencatat 175.774 klaim FKRTL berpotensi fraud senilai ±Rp440 miliar pada 2015, meningkat jadi lebih dari 1 juta klaim bermasalah pada pertengahan 2016. Pola dominan yang teridentifikasi adalah upcoding (528.285 kasus) dan unbundling (259.649 kasus). Dengan total biaya pelayanan JKN mencapai Rp158 triliun pada 2023, bahkan kebocoran 1% saja bernilai triliunan rupiah, audit berbasis sampling","Membangun sistem deteksi anomali klaim berbasis AI yang mengubah proses audit BPJS Kesehatan dari sampling acak menjadi risk-based auditing. Tujuannya memprioritaskan pemeriksaan pada klaim dengan skor risiko fraud tertinggi, khususnya pola phantom & repeat billing, upcoding & unbundling, serta inflated bills & cloning, sehingga waktu dan sumber daya auditor lebih efisien, sambil tetap menjaga keputusan akhir di tangan auditor manusia (human-in-the-loop).","KlaimGuard AI adalah sistem deteksi anomali billing klaim FKRTL yang menggabungkan model unsupervised (Isolation Forest/Autoencoder) untuk menangkap pola klaim menyimpang tanpa memerlukan data fraud berlabel riil, dengan model supervised (XGBoost) yang menilai risiko berdasarkan fitur seperti rasio biaya terhadap median faskes sejenis, kesesuaian kode diagnosis-tindakan, kemiripan antar klaim, dan frekuensi klaim berulang. Setiap skor risiko dilengkapi penjelasan SHAP agar auditor tahu alasan spesifik di balik setiap flag, bukan sekadar angka. Outputnya berupa dashboard antrean prioritas audit per klaim dan per faskes. Sistem dikembangkan dan diuji memakai data publik sejenis serta data sintetis yang meniru struktur klaim INA-CBG, karena data JKN riil tidak digunakan tanpa izin resmi sesuai ketentuan kompetisi.","Proses audit bergeser dari reaktif/sampling acak menjadi proaktif berbasis risiko, dengan cakupan deteksi lebih luas karena seluruh klaim dinilai, bukan hanya subset acak. Manfaat dirasakan BPJS Kesehatan (integritas dana klaim terjaga), peserta JKN (dana amanat lebih terlindungi), dan faskes jujur (terhindar dari kecurigaan tak berdasar lewat verifikasi transparan). Angka dampak masih bersifat estimasi, perlu divalidasi dengan data riil."],"r":[{"n":"Arman Annas Putra","s":[4,3,3,3,3,2]},{"n":"Djaka Santosa","s":[3,3,3,3,3,3]},{"n":"I Made Karistiawan","s":[3,2,3,3,3,2]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,2,3]}]},{"id":"2381","tim":"Solid","inov":"Plafon: Deteksi Klaim yang Melebihi Kapasitas Fisik Fasilitas Kesehatan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2381_Plafon â€” Healthkathon 2026.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["Pada modus klaim fiktif, setiap berkas terlihat wajar. Diagnosis cocok, tindakan sesuai, tarif benar, dokumen lengkap. Pemeriksaan yang menilai klaim satu per satu akan meloloskannya.\n\nKPK mengungkap dugaan klaim fiktif di tiga rumah sakit dengan potensi kerugian negara Rp 34 miliar dari 4.341 kasus yang ditagihkan. Yang tidak pernah diperiksa adalah jumlah totalnya: apakah volume layanan sebanyak itu masih mungkin dikerjakan oleh alat, tempat tidur, dan tenaga yang dimiliki faskes tersebut.","Menjadikan data kapasitas faskes yang sudah dimiliki dan diverifikasi BPJS Kesehatan melalui HFIS dan kunjungan kredensialing sebagai batas atas yang diuji terhadap volume klaim pada setiap siklus.\n\nTujuannya membantu tim audit mengurutkan prioritas pemeriksaan berdasarkan temuan yang terhitung, bukan dugaan. Sekaligus mengeluarkan faskes yang volumenya wajar dari antrean periksa, agar waktu auditor yang terbatas terpakai di tempat yang tepat.","Plafon menghitung batas atas produksi layanan setiap faskes dari kapasitas fisiknya, lalu membandingkannya dengan volume yang ditagihkan pada periode sama. Selisih di atas batas bukan skor kecurigaan, melainkan jumlah yang secara fisik tidak mungkin dihasilkan.\n\nEmpat batas yang dihitung: throughput alat (unit x jam buka : lama tindakan), tempat tidur per kelas, total hari rawat, dan kapasitas tenaga.\n\nProsesnya tiga langkah. Pertama, batas dihitung dari kapasitas terlapor memakai rumus, tanpa AI, agar bisa diperiksa ulang. Kedua, bila data kapasitas kosong atau usang, model memperkirakannya dari faskes sejenis berupa rentang, bukan angka tunggal. Ketiga, kondisi wajar dikecualikan: alat sewa, lonjakan rujukan, bencana.\n\nKeluarannya daftar prioritas audit berisi nama faskes, besaran kelebihan, dan nilai rupiahnya. Seluruh perhitungan memakai data agregat tingkat faskes, sehingga tidak membutuhkan identitas peserta, diagnosis, maupun rekam medis. Pengembangan memakai data sintetis.","Kelebihan tagihan di atas batas fisik langsung terbaca dalam rupiah, per faskes per periode, tanpa perlu estimasi. Beban audit menyempit karena faskes yang volumenya wajar keluar dari daftar periksa sejak awal.\n\nPelampauan yang ternyata berasal dari data kapasitas yang belum diperbarui akan memicu pembaruan HFIS, sehingga sistem ini turut membersihkan data yang ia andalkan.\n\nAngka pada tahap ini berasal dari data sintetis dan masih perlu divalidasi dengan data nyata."],"r":[{"n":"Djaka Santosa","s":[4,4,3,4,2,3]},{"n":"I Made Karistiawan","s":[4,4,3,4,3,3]},{"n":"Agung Waluyo","s":[4,4,3,3,2,4]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,3,3]}]},{"id":"2386","tim":"ProfHabibieBanggaSamaKita","inov":"PreClaim Guard - Detect Before Submit, Explain Before Reject","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2386_preclaim-guard-healthkathon-2026.pdf","fw":"","lk":1,"dec":"L","fd":"07/10/2026","rv":"","sub":["Klaim BPJS tertunda Rp5,92T atas 3,69jt kasus (2024). KPK bawa dugaan fraud Rp34M via phantom billing di 3 RS ke penindakan (Jul 2024); Kejari Jember naikkan upcoding+phantom billing ke penyidikan (Mei 2026). RSUD Pasar Minggu: pending 5,45% berkas tapi 17,13% nilai; ranap 1,02% berkas menahan 15,48% nilai. Pola berulang: coding tak konsisten dan evidence kurang. Verifikasi hari ini represif pasca-submit. JKN 284jt peserta butuh gate preventif di meja koder.","Mencegah pending dan risiko fraud yang masih bisa diperbaiki sebelum submit: cek kelengkapan evidence, konsistensi diagnosis-tindakan-obat, dan kewajaran episode/bundling. Tiap temuan wajib beralasan dengan aturan berversi yang bisa diaudit. Keputusan akhir selalu di koder lewat alur perbaiki, setujui beralasan, atau cek ulang. Local-first sesuai UU PDP 27/2022. Prototype murni data synthetic, tanpa data JKN riil.","PreClaim Guard adalah quality gate di meja koder sebelum submit ke BPJS. Tiga lapis pemeriksaan: 1) evidence check kelengkapan dokumen pendukung, 2) konsistensi klinis dan coding antara diagnosis, tindakan, dan obat, 3) kewajaran episode dan bundling untuk pola unbundling, cloning, dan repeat billing. Rule engine berversi mencatat ID aturan, tanggal berlaku, sumber kebijakan, dan severity; dilengkapi model anomali lokal untuk pola biaya, LOS, dan kemiripan teks antar berkas. Output berupa skor risiko dan kesiapan internal, daftar temuan beralasan, serta rekomendasi review prioritas. Alur kerja satu layar: antrean terprioritas, detail temuan, aksi perbaiki atau setujui beralasan, lalu cek ulang plus jejak audit otomatis. Dibangun local-first dengan Next.js, FastAPI, PostgreSQL, dan Docker di RS sesuai UU PDP 27/2022. Validasi memakai agregat publik; prototype memakai synthetic plus anomali disuntik; pilot data RS hanya pasca-izin.","Lebih banyak issue selesai sebelum submit sehingga antrean review terprioritas pada risiko tertinggi dan jejak klaim-evidence-aturan terdokumentasi. Model ukur: resolved = total klaim x baseline pending x porsi addressable x deteksi x adopsi. RS: kas tak tertahan pending cegahable. BPJS: tak mengulang kesalahan hulu yang sama. Sistem: integritas JKN 284jt peserta terjaga. Nilai rupiah tak diekstrapolasi nasional dari satu RS."],"r":[{"n":"I Made Karistiawan","s":[4,3,4,3,3,4]},{"n":"Agung Waluyo","s":[3,2,2,1,1,3]},{"n":"Paul Donald P","s":[4,3,4,3,3,4]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,2,3]}]},{"id":"2387","tim":"Zidan Solo Hackathon","inov":"NALAR AI: Pemeringkat Klaim JKN Berbasis Selisih Rupiah untuk Efisiensi Risiko Fasilitas Kesehatan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2387_NALAR-Proposal-Healthkathon-2026.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["Verifikator klaim BPJS Kesehatan punya satu menit untuk tiap klaim rujukan tingkat lanjut, hasil bagi 149,7 juta klaim setahun terhadap 1.291 verifikator. Perpres 82/2018 menetapkan berkas dianggap lengkap bila berita acaranya tidak terbit dalam sepuluh hari, jadi berkas yang tidak sempat dibuka adalah berkas yang kehabisan waktu. Kecurangan terbesar yang pernah diungkap KPK justru terdiri atas 22.550 tagihan dengan rata-rata Rp1,3 juta, terlalu kecil untuk mencolok di antara tagihan lain.","Menjawab satu pertanyaan sempit: dari puluhan ribu klaim satu periode, seratus mana yang dibuka lebih dahulu. NALAR menaksir tarif INA-CBG dan biaya bahan habis pakai yang wajar untuk bukti klinis tiap berkas, lalu mengurutkan berkas menurut selisih rupiah yang belum terjelaskan terhadap ongkos memeriksanya. Sasarannya menaikkan hasil temuan pada anggaran audit yang tetap, tanpa menambah lapis verifikasi baru, tanpa mengubah kewenangan verifikator, dan tanpa menyentuh data peserta JKN nyata.","Data klaim JKN tidak punya label kecurangan, jadi NALAR melatih dua model regresi HistGradientBoosting, bukan pengklasifikasi. Satu menaksir tarif INA-CBG wajar, satu lagi biaya bahan habis pakai. Masukannya 120 penciri dari bukti klinis pada berkas itu sendiri, tanpa identitas peserta, dengan tabel tarif 76.970 baris dari Permenkes 3/2023. Selisihnya rupiah yang belum terjelaskan, dan rupiah bisa dibandingkan langsung dengan ongkos memeriksanya. Kemudian, ambangnya dikalibrasi split conformal per kelompok sebaya. Pada alfa 0,02 laju penandaan berkas bersih 0,00908, di bawah batas lulus 0,03. Bila pembanding sebayanya kurang dari tiga, model menahan diri. Lapisan Agentic AI menyusun berkas perkara yang bisa dibaca verifikator. Model bahasa menulis nama isian, sistem yang mengisi angkanya dari jawaban alat, sehingga nol angka tak bersumber dari 500 berkas perkara. Tiap panggilan alat masuk rantai sidik SHA-256. NALAR tidak punya jalan untuk menolak klaim atau menahan pembayaran.","Pada satu periode peragaan dengan anggaran periksa seratus berkas, urutan menurut selisih menemukan Rp573,0 juta atas ongkos Rp75,0 juta, rasio 7,64 kali. Penskor acak pada anggaran yang sama menemukan Rp2,95 juta. Biaya menjalankannya Rp49,77 per berkas perkara. Faskes yang jujur ikut untung sebab pending yang tidak perlu berkurang. Lima belas target mutu ditulis sebelum percobaan: sembilan tercapai, empat gagal, dan keempatnya dilaporkan apa adanya."],"r":[{"n":"Agung Waluyo","s":[4,4,4,4,3,4]},{"n":"Paul Donald P","s":[4,4,4,4,3,4]},{"n":"Tria Sofa Purnama","s":[4,4,4,4,4,3]},{"n":"Wahyu Satriyo Wibowo","s":[4,4,4,4,4,3]}]},{"id":"2392","tim":"Nusantara Sehat","inov":"GAPURA JKN — Graph Analytics Pemberi Kerja untuk Risiko & Audit","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2392_Proposal_Healthkathon2026_GAPURA_JKN.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["BPK (IHPS II 2025) menyatakan pendapatan iuran PPU senilai Rp31,61 triliun tidak dapat diyakini kebenarannya. Rasio klaim JKN 111,86% (s.d. Feb 2026), defisit ±Rp2 triliun/bulan.\n\nIuran PPU 5% dari upah, tetapi dasarnya data yang dilaporkan sendiri pemberi kerja: upah dilaporkan lebih rendah atau pekerja tak didaftarkan langsung jadi selisih iuran berulang.\n\nDatanya ada, hanya tersebar dan tidak dipadankan rutin — pertukaran data antar-BPJS 4x setahun, pengawasan bersama baru 2.429 badan usaha.","1. Memadankan data pemberi kerja lintas sumber (EDABU, SIPP, OSS/NIB, WLKP, upah BPS) secara rutin dan menyeluruh, sesuai rekomendasi BPK.\n\n2. Membangun graf entitas agar satu pemberi kerja yang tercatat berbeda-beda di banyak sistem dianalisis sebagai satu kesatuan.\n\n3. Menandai ketidaksesuaian yang berpotensi jadi selisih iuran, dengan faktor pendorong yang dapat ditelusuri ke field sumbernya.\n\n4. Menghasilkan berkas pemeriksaan siap tindak: bukti, estimasi selisih iuran, dan dasar hukum.","GAPURA JKN adalah lapisan analitik kepatuhan pemberi kerja di atas data administratif milik BPJS Kesehatan dan mitranya, tanpa menyentuh rekam medis.\n\nModul 1 (inti) membangun graf entitas: identitas badan usaha dipadankan probabilistik lewat NIB, NPWP, nama, alamat, dan pengurus, lalu ditautkan berdasarkan kesamaan pengurus dan perpindahan pekerja. Tanpa graf yang benar, detektor di atasnya menghitung populasi yang salah.\n\nModul 2 menjalankan detektor. Under-Reporting Wage mencari penumpukan upah tepat di UMK/UMP pada perusahaan berstruktur jabatan beragam, dan selisih upah yang dilaporkan ke BPJS Kesehatan dibanding BPJS Ketenagakerjaan. PDUK membandingkan jumlah pekerja terdaftar lintas sumber terhadap estimasi berbasis sektor dan skala usaha. Tiap skor disertai faktor pendorong SHAP.\n\nModul 3 menyusun berkas pemeriksaan otomatis: bukti beserta field sumbernya, estimasi selisih iuran, dan dasar hukum.\n\nSistem menghasilkan prioritas, bukan vonis, dan memakai data sintetis.","Cakupan penyaringan naik dari ribuan badan usaha per periode menjadi seluruh badan usaha terdaftar, diskor ulang tiap siklus data.\n\nAkurasi penargetan meningkat, diuji A/B terhadap metode berjalan. Waktu penyiapan berkas turun dari hitungan hari menjadi menit. Keterverifikasian data iuran membaik, diukur dari naiknya proporsi pemberi kerja yang data upah dan jumlah pekerjanya padan lintas sumber — menjawab inti temuan BPK."],"r":[{"n":"Paul Donald P","s":[4,4,3,3,3,3]},{"n":"Tria Sofa Purnama","s":[4,4,3,3,3,3]},{"n":"Ikhlasul Amalia","s":[4,4,3,3,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[4,4,4,4,3,4]}]},{"id":"2417","tim":"Trent","inov":"JKN Sentinel AI: One Claim, Three AI Lenses, One Human Decision","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2417_JKN_Sentinel_AI_Healthkathon_2026_Final.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["Program JKN mengelola layanan dan klaim kesehatan dalam skala besar, sehingga diperlukan mekanisme deteksi risiko yang lebih cepat, konsisten, dan mudah dijelaskan. JKN Sentinel AI diusulkan untuk membantu mengidentifikasi indikasi upcoding, cloning klaim, dan phantom billing melalui analisis pola klaim berbasis AI, tanpa menggantikan keputusan manusia dan tetap memperhatikan perlindungan data serta prinsip human-in-the-loop.","Mengembangkan sistem pendukung investigasi klaim yang mampu memprioritaskan klaim berisiko melalui tiga lapisan analisis: Clinical Consistency untuk indikasi upcoding, Claim DNA Matching untuk cloning, dan Service Reality Check untuk phantom billing. Sistem menghasilkan risk score yang dapat dijelaskan agar investigator lebih cepat menentukan klaim yang perlu ditinjau lebih lanjut.","JKN Sentinel AI adalah platform intelligent claim-risk detection dengan konsep “One Claim, Three AI Lenses, One Human Decision”. Setiap klaim diubah menjadi Claim DNA berdasarkan diagnosis, prosedur, obat/alkes, biaya, lama rawat, waktu layanan, dan pola provider. Claim DNA dianalisis melalui tiga mesin: XGBoost/LightGBM untuk Clinical Consistency dan indikasi upcoding, embedding + cosine similarity untuk mendeteksi kemiripan/cloning klaim, serta Isolation Forest + rule engine untuk mendeteksi anomali phantom billing. Hasil ketiganya digabungkan menjadi Explainable Risk Score beserta alasan utama mengapa klaim ditandai. Sistem tidak memutuskan fraud secara otomatis, tetapi memprioritaskan klaim untuk human review. Prototype menggunakan data sintetis/anonim dan menampilkan alur screening, investigation detail, Claim DNA, relationship view, serta evidence trail yang sederhana bagi pengguna non-teknis.","JKN Sentinel AI diharapkan meningkatkan efisiensi proses review dengan memprioritaskan klaim berisiko tinggi, mempercepat identifikasi pola anomali, dan mengurangi beban pemeriksaan manual yang tidak terarah. Dampak akan diukur melalui precision, recall, F1-score, false positive rate, waktu review per klaim, serta proporsi klaim prioritas yang berhasil diidentifikasi, dengan seluruh hasil prototype dinyatakan sebagai target yang perlu divalidasi."],"r":[{"n":"Tria Sofa Purnama","s":[4,4,3,3,3,3]},{"n":"Ikhlasul Amalia","s":[4,4,3,3,3,4]},{"n":"Husnun Nashir","s":[4,3,3,2,2,3]},{"n":"Wahyu Satriyo Wibowo","s":[4,4,4,4,3,4]}]},{"id":"2451","tim":"coba namanya ini aja","inov":"SiKePo: Sistem Investigasi Kelayakan Klaim dan Pola Overbilling berbasis AI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2451_Proposal_SiKePo_Healthkathon2026.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["BPJS Kesehatan memproses jutaan klaim rawat inap setiap tahun, dan klaim fraudulent menjadi salah satu sumber kebocoran dana terbesar. Pada 2023, BPJS Kesehatan menemukan kerugian klaim fraudulent sebesar Rp 2,6 triliun, sementara BPJS Watch mengestimasi potensi kebocoran mencapai Rp 12,63 triliun per tahun. Verifikasi manual tidak mampu mengikuti: satu verifikator menangani ratusan berkas per hari sehingga pemeriksaan menyeluruh mustahil dilakukan.","1. Menyaring 100% klaim rawat inap secara otomatis sebelum dana cair menggunakan skor risiko 0-100 beserta bukti yang dapat dibaca.\n2. Memangkas waktu penilaian per klaim menjadi kurang dari 2 detik melalui pipeline tiga tahap: aturan deterministik, machine learning IsolationForest, dan adjudikasi LLM medis.\n3. Memberikan rekomendasi yang konsisten (setujui, tahan, tolak) lengkap dengan alasan berbahasa Indonesia untuk mendukung keputusan verifikator.","SiKePo (Sistem Investigasi Kelayakan Klaim dan Pola Overbilling) adalah aplikasi audit klaim pra-pembayaran BPJS Kesehatan. Setiap klaim yang masuk dari SIMRS faskes dinilai otomatis oleh pipeline tiga agen: A1 Triage memeriksa rasio tarif terhadap plafon INA-CBG, lama rawat, dan obat restriksi e-Fornas; A2 Investigator mengukur anomali menggunakan machine learning IsolationForest; A3 Adjudicator menyusun rekomendasi setujui, tahan, atau tolak beserta alasannya menggunakan LLM medis Ling 3.0 Flash Sante. Hasilnya berupa skor risiko 0-100 disertai bukti yang dapat dibaca, ditampilkan pada cockpit verifikator dalam bentuk antrean, inspector, dan tombol keputusan satu klik. Setiap verdict tercatat sebagai jejak audit dan menjadi data latih agar sistem terus belajar. Faskes dapat mengirim klaim melalui portal berkunci API, dan seluruh data pada demo ini merupakan data dummy sintetis.","1. Cakupan pemeriksaan meningkat dari sampling manual menjadi 100% klaim dibaca mesin sebelum pembayaran.\n2. Waktu penilaian per klaim menjadi kurang dari 2 detik (terukur pada demonstrasi internal dengan 150 klaim).\n3. Pada data uji teridentifikasi potensi overbilling sebesar Rp 273 juta yang tersaring sebelum dana cair."],"r":[{"n":"Ikhlasul Amalia","s":[4,3,3,4,3,3]},{"n":"Husnun Nashir","s":[3,2,3,3,3,3]},{"n":"Arman Annas Putra","s":[4,4,4,4,3,3]},{"n":"Wahyu Satriyo Wibowo","s":[3,3,3,3,3,3]}]},{"id":"2487","tim":"LUNA","inov":"SERA (Service Evidence & Risk asessment)","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"Berkas revisi belum tersedia di folder proposals. Jangan menilai memakai proposal lama.","lk":0,"dec":"","fd":"","rv":"Hasil revisi, menggantikan proposal sebelumnya (Tidak lulus, flag 30/09/2026)","sub":["Ketidaksesuaian antara layanan kesehatan, bukti pendukung, dan klaim JKN dapat menyulitkan proses verifikasi serta meningkatkan risiko inefisiensi pembiayaan. Diperlukan pendekatan yang mampu menelusuri keterkaitan data dan mendeteksi indikasi ketidaksesuaian sejak dini agar proses pemeriksaan lebih terarah.","Mengembangkan SERA sebagai alat bantu identifikasi risiko klaim JKN melalui penelusuran bukti pelayanan, pemeriksaan konsistensi data, penjelasan alasan risiko, dan penentuan prioritas verifikasi oleh petugas.","SERA (Service Evidence & Risk Assessment) menggunakan alur TRACE–CHECK–EXPLAIN–PRIORITIZE untuk menghubungkan klaim, billing, layanan, bukti pendukung, dan encounter. Sistem menerapkan aturan pemeriksaan serta skor risiko yang transparan untuk menghasilkan sinyal ketidaksesuaian dan alasan yang dapat ditelusuri. Prototipe awal menggunakan data sintetis dan belum terintegrasi dengan sistem produksi.","SERA diharapkan membantu petugas memprioritaskan verifikasi klaim, mempercepat penelusuran bukti, meningkatkan keterlacakan alasan pemeriksaan, dan mendukung efisiensi pembiayaan JKN. Dampaknya akan dievaluasi melalui pengujian prototipe dan validasi lebih lanjut; sinyal risiko bukan bukti fraud dan tetap memerlukan verifikasi manusia."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2178","tim":"KLIKSIMPUS","inov":"JKN RiskGuard - AI-Assisted Early Risk Detection & Decision Support for JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2178_Proposal Healthkathon 2026 Tim Klikmedis-1.pdf","fw":"","lk":1,"dec":"T","fd":"30/09/2026","rv":"","sub":["Besarnya skala Program JKN menghasilkan volume pelayanan dan klaim yang sangat tinggi. Di antara transaksi pelayanan yang valid, pola risiko seperti cloning dokumentasi dan repeat billing dapat sulit ditemukan apabila setiap episode diperiksa secara individual.\n\nJKN RiskGuard hadir sebagai AI-assisted early risk detection & decision support yang menggabungkan rule-based detection, clinical similarity, dan explainable risk scoring untuk membantu memprioritaskan episode berisiko, tanpa menggantika","Mengembangkan JKN RiskGuard sebagai sistem pendukung keputusan berbasis AI yang mampu melakukan deteksi dini dan prioritisasi risiko pada data pelayanan/klaim JKN, khususnya pola Cloning dan Repeat Billing.\n\nSistem bertujuan membantu petugas melakukan pemeriksaan secara lebih terarah, cepat, konsisten, dan transparan melalui Risk Score serta penjelasan indikator risiko (Explainable Alert), tanpa menggantikan proses verifikasi dan keputusan manusia.","JKN RiskGuard – AI-Assisted Early Risk Detection & Decision Support for JKN merupakan sistem yang melakukan screening terhadap data episode pelayanan untuk menemukan pola yang memerlukan perhatian lebih lanjut.\n\nJKN RiskGuard menggunakan pendekatan Hybrid Risk Intelligence dengan menggabungkan:\n\nRule-Based Detection untuk mendeteksi pola transaksi seperti pelayanan berulang pada pasien, diagnosis, tindakan, dan rentang waktu yang berdekatan.\nClinical Similarity Analysis untuk mengukur kemiripan dokumentasi klinis/SOAP antar-episode.\nRisk Scoring untuk mengubah berbagai indikator menjadi skor risiko 0–100 dan menentukan prioritas pemeriksaan.\nExplainable Alert untuk menjelaskan faktor yang menyebabkan suatu episode ditandai.\nHuman Review untuk memastikan keputusan akhir tetap berada pada petugas yang berwenang.","Implementasi JKN RiskGuard diharapkan memberikan dampak pada tiga sisi utama. Secara operasional, sistem membantu reviewer memprioritaskan kasus berisiko sehingga pemeriksaan tidak harus memperlakukan seluruh episode dengan tingkat perhatian yang sama. Secara tata kelola, Risk Score, Explainable Alert, Human Review, dan Audit Trail membuat proses identifikasi risiko lebih transparan serta dapat ditelusuri. Secara strategis, deteksi risiko yang lebih dini dapat mendukung upaya menjaga efisiensi d"],"r":[{"n":"Arman Annas Putra","s":[4,3,2,2,2,3]},{"n":"Djaka Santosa","s":[3,3,2,2,2,3]},{"n":"I Made Karistiawan","s":[3,3,2,2,2,3]},{"n":"Wahyu Satriyo Wibowo","s":[4,3,3,4,4,3]}]},{"id":"2241","tim":"Oziktrace","inov":"OzikTrace - Inovasi Anti-Fraud Pra-Klaim Berbasis AI Vision & Kriptografi Hibrida","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"revisi/[revisi]2241_Healthkathon2026_Faskes_OzikTrace_Proposal.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"Hasil revisi, menggantikan proposal sebelumnya (Tidak lulus, flag 28/09/2026)","sub":["Program JKN BPJS Kesehatan mengalami potensi kebocoran klaim akibat praktik fraud seperti phantom billing dan upcoding. Metode verifikasi konvensional bersifat pasca-klaim (reaktif) dan membutuhkan audit manual yang rumit. Hal ini menyebabkan kerugian finansial yang sulit ditarik kembali serta memperlambat SLA pencairan klaim fasilitas kesehatan hingga 15–30 hari. \nDiperlukan mekanisme pencegahan pra-klaim yang otomatis, presisi, dan aman secara data.","1. Mencegah kebocoran dana JKN akibat fraud upcoding obat dan pelayanan fiktif sebelum klaim dicairkan.   \n2. Mempercepat SLA pencairan klaim faskes jujur dari 30 hari menjadi hitungan jam via Auto-Settlement.   \n3. Menerapkan pengamanan data hibrida (Hashing SHA-256 + Salt untuk PIN/NIK dan Enkripsi AES-256 untuk rekam medis) guna mendukung validasi silang klinis yang patuh UU PDP","OzikTrace adalah Gatekeeper Pra-Klaim dengan pendekatan Zero-Trust Automated Settlement. Sistem ini mengintegrasikan Dual-Engine Architecture:   \n\n1. AI Vision (OCR): Mengonfirmasi ketersediaan obat secara fisik dari foto etiket dan strip obat di apotek, lalu memvalidasinya terhadap E-Resep SIMRS guna menghentikan manipulasi upcoding.   2. Patient PIN Authorization: Membekukan dana di Virtual Escrow hingga pasien memasukkan PIN 6-digit di Mobile JKN saat serah terima obat.   \n\nSistem menggunakan keamanan hibrida: SHA-256 + Salt (irreversible) untuk kredensial PIN/NIK, serta Enkripsi AES-256 (reversible) untuk data rekam medis agar verifikator BPJS dapat melakukan validasi silang. Jika confidence AI < 85% atau foto blur, sistem mengalihkan status ke Tinjau Manual (Human-in-the-Loop). Prototipe web responsif sudah live dan siap diuji coba di oziktrace.vercel.app.","1. Target True Positive Rate (TPR) > 95% dalam mendeteksi perbedaan fisik obat dan fraud upcoding.   \n2. Estimasi proyeksi penghematan potensi kebocoran klaim hingga Rp 200 Juta per bulan pada RS tipe besar.   \n3. Mengubah SLA pencairan klaim terverifikasi dari 15–30 hari menjadi hitungan jam secara otomatis.   \n4. Mengoptimalkan arus kas faskes yang beroperasi secara jujur serta menjaga integritas finansial program JKN."],"r":[{"n":"Susi Lusiani","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2382","tim":"FLdev","inov":"SENTRA JKN - Asisten Rekonsiliasi Kepesertaan Pekerja","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"Berkas revisi belum tersedia di folder proposals. Jangan menilai memakai proposal lama.","lk":0,"dec":"","fd":"","rv":"Hasil revisi, menggantikan proposal sebelumnya (Tidak lulus, flag 07/10/2026)","sub":["Ketidaksesuaian antara roster pekerja dan data kepesertaan dapat menimbulkan indikasi Pendaftaran Pekerja Sebagian (PDUK) atau masalah pelaporan mutasi. Namun, perpindahan kerja, resign, koreksi dan keterlambatan data perlu diperiksa agar perubahan sah tidak salah ditandai. SENTRA JKN diusulkan untuk membantu petugas menelusuri pekerja, periode, tanggal efektif dan sumber bukti sebelum klarifikasi serta tindak lanjut.","Merancang asisten rekonsiliasi untuk menemukan ketidaksesuaian kepesertaan dan pelaporan mutasi pekerja. Menyajikan paket bukti serta prioritas review yang dapat dijelaskan, dengan keputusan tetap pada petugas. Manfaat akan diuji melalui kualitas antrean, kesalahan penandaan pada perubahan sah, keterlacakan bukti, waktu review dan koreksi terverifikasi.","SENTRA JKN membandingkan roster dan kepesertaan menurut identitas, pemberi kerja, periode serta tanggal efektif. Rules menghasilkan status cocok, perlu data atau perlu klarifikasi, disertai sumber dan alasan pemeriksaan. Petugas mencatat bukti serta hasil review; model anomali temporal akan diuji terhadap baseline rules. Solusi masih tahap desain konsep. Prototype direncanakan memakai data sintetis, sedangkan pilot memerlukan izin resmi.","SENTRA JKN diharapkan membantu petugas menelusuri ketidaksesuaian kepesertaan, memprioritaskan review dan memperjelas klarifikasi kepada pemberi kerja. Manfaat akan diukur melalui waktu review, kualitas antrean, keterlacakan bukti, kesalahan penandaan pada perubahan sah dan koreksi pekerja yang terverifikasi. Estimasi potensi iuran dihitung setelah verifikasi serta dipisahkan dari pembayaran riil. Dampak belum diuji."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2129","tim":"Serenade Data","inov":"JKN ClaimGuard-Three-Way Verification","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2129_SerenadeData_ClaimGuard.pdf","fw":"","lk":1,"dec":"T","fd":"30/09/2026","rv":"","sub":["Dengan 282,7 juta peserta dan 725,3 juta kunjungan pada 2025, JKN memproses klaim dalam skala besar. Ketidaksesuaian layanan berisiko menimbulkan pembayaran tidak tepat dan fraud. Pada use case fisioterapi, 3.269 dari 4.341 klaim tidak memiliki dokumentasi yang sesuai, dengan nilai Rp501,27 juta. Kondisi ini menunjukkan perlunya double verification dengan melibatkan pasien sebagai sumber konfirmasi langsung.","JKN Claim Guard bertujuan mengurangi risiko fraud dan ketidaksesuaian klaim melalui double verification dari provider dan pasien. Pada pilot, efektivitas akan diukur dengan membandingkan tingkat ketidaksesuaian sebelum dan sesudah patient verification, menggunakan kasus awal sebagai baseline. WhatsApp ditujukan untuk mempercepat dan mempermudah konfirmasi pasien, sementara blockchain mendukung jejak verifikasi yang transparan dan sulit diubah.","JKN Claim Guard mengirimkan konfirmasi harian melalui WhatsApp kepada pasien atau keluarga pasien setelah layanan diterima. Mereka cukup memilih \"SESUAI, ADA YANG TIDAK SESUAI, atau TIDAK PERNAH MENERIMA\". Konfirmasi dilakukan dekat dengan waktu layanan agar lebih mudah diingat dan mengurangi risiko lupa. Data kemudian dicocokkan dengan klaim fasilitas kesehatan sebagai additional evidence dan risk signal. AI membantu menyederhanakan bahasa dan memprioritaskan klaim yang perlu direview. Blockchain dapat mencatat jejak verifikasi secara transparan tanpa menyimpan data medis. AI memprioritaskan, manusia tetap memutuskan.","- Mengurangi risiko fraud dan ketidaksesuaian klaim melalui double verification dari provider dan pasien.\n- Lebih cepat dan praktis karena konfirmasi dikirim harian melalui WhatsApp, saat layanan masih mudah diingat.\n- Lebih transparan dengan jejak verifikasi yang tercatat dan dapat diaudit.\n- Memperkuat evidence klaim dengan melibatkan pasien atau keluarga pasien.\n- Membantu reviewer memprioritaskan klaim berisiko melalui risk signal berbasis AI."],"r":[{"n":"Agung Waluyo","s":[4,4,2,2,2,3]},{"n":"Paul Donald P","s":[4,3,2,2,2,3]},{"n":"Tria Sofa Purnama","s":[4,3,2,3,2,3]}]},{"id":"2140","tim":"The healers","inov":"JAGA-CLAIM : AI Pre-Claim Quality & Risk Assurance untuk JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2140_Proposal_JAGA-CLAIM_Healthkathon2026.pdf","fw":"","lk":1,"dec":"L","fd":"07/10/2026","rv":"","sub":["Proses klaim JKN masih menghadapi ketidaksesuaian coding, billing, duplikasi, dan anomali episode yang sering baru terlihat setelah pengajuan. Pada sampel 1.172 RS Jan–Jun 2025, dari Rp42,4 triliun klaim yang diajukan, Rp5,6 triliun berstatus pending dan Rp37,9 miliar dispute. Kondisi ini memicu rework, memperpanjang siklus pembayaran, dan menambah beban coder/verifikator. Diperlukan quality assurance sebelum submit agar risiko dapat dikoreksi lebih awal.","Membangun JAGA-CLAIM sebagai AI-assisted pre-claim quality gate yang membantu coder, case-mix, dan verifikator memprioritaskan klaim berisiko sebelum dikirim ke BPJS Kesehatan. Solusi ditujukan untuk mempercepat review, mengurangi rework dan pending yang dapat dicegah, meningkatkan kualitas klaim, serta menjaga keputusan akhir tetap pada manusia melalui risk score, reason code, evidence, dan rekomendasi tindakan.","JAGA-CLAIM adalah lapisan decision support pra-pengajuan yang bekerja di atas workflow klaim yang sudah ada, bukan pengganti SIMRS atau E-Klaim. Sistem membaca data coding, diagnosis, prosedur, billing, LOS, episode layanan, dan histori klaim untuk melakukan rule checking, risk ranking berbasis ML, deteksi repeat/duplicate, dan anomaly detection. Klaim prioritas ditampilkan kepada reviewer bersama risk score, reason code, evidence, peer comparison, dan rekomendasi tindakan. Reviewer tetap memilih confirm, dismiss, request correction, atau submit; keputusan akhir tetap pada manusia dan tidak ada automatic denial. Integrasi dirancang melalui sidecar/API, batch-capable, dan opsi on-prem. Scope awal: claim consistency/upcoding-unbundling, repeat billing, serta prolonged stay/readmission. Saat ini JAGA-CLAIM berada pada tahap mockup UI/UX; tahap berikutnya adalah prototype risk engine dan validasi menggunakan data berizin.","JAGA-CLAIM menargetkan perubahan dari review merata dan reaktif menjadi review top-K berbasis risiko dan koreksi sebelum submit. Dampak diukur melalui Precision@K/Recall@K, waktu review per klaim, claims reviewed per hour, time-to-correction, serta perubahan rework/pending rate pada pilot. Bagi fasilitas kesehatan, nilainya adalah review lebih fokus dan cycle time lebih baik; bagi BPJS/JKN, workload verifikasi dan risk leakage berpotensi turun tanpa menggantikan keputusan manusia."],"r":[{"n":"Paul Donald P","s":[4,3,3,2,2,3]},{"n":"Tria Sofa Purnama","s":[4,4,3,3,3,3]},{"n":"Ikhlasul Amalia","s":[4,4,3,3,2,3]}]},{"id":"2154","tim":"Pathfinder","inov":"SINAPS: Deteksi Ring Kolusi Klaim JKN lewat Riwayat Peserta dan Jaringan Entitas","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2154_Proposal-Healthkathon-PathFinder.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["Rasio klaim JKN menembus 108,72 persen dan defisit Dana Jaminan Sosial diproyeksikan Rp58,7 triliun pada 2026. Di tengah tekanan itu BPJS Kesehatan menemukan kecurangan Rp6,8 triliun sepanjang Januari sampai Oktober 2025, dengan klaim fiktif sebagai modus terbesar. Kasus tiga rumah sakit yang ditangani KPK menunjukkan polanya: kartu BPJS warga dikumpulkan lewat bakti sosial, lalu dipakai menagih perawatan yang tidak pernah terjadi. Identitasnya asli, sehingga berkas klaimnya lolos verifikasi.","Menemukan klaim fiktif beserta jaringan pelakunya sebelum dana dicairkan, dengan memindahkan unit pemeriksaan dari berkas klaim ke riwayat peserta dan hubungan antar entitas. Sasarannya: mempersempit beban 1.199 verifikator yang menghadapi sekitar 2 juta transaksi layanan per hari menjadi daftar prioritas, memperpendek waktu deteksi dari bertahun-tahun lewat investigasi manual menjadi hitungan bulan, dan menyerahkan berkas bukti siap periksa kepada verifikator, bukan skor tanpa penjelasan.","SIMPUL memeriksa dua hal yang belum diperiksa sistem yang ada: riwayat peserta yang identitasnya dipakai, dan jaringan pihak di balik sekumpulan klaim.\n\nLapis 1 menguji tiap klaim terhadap riwayat pemilik kartunya lewat empat sinyal: mustahil secara biologis, mustahil secara fisik, tindakan berat tanpa pemeriksaan penegak dan tanpa kelanjutan apa pun, dan verifikasi kehadiran yang hilang.\n\nLapis 2 membangun jaringan fasilitas, peserta, tenaga medis, dan wilayah, lalu mencari kelompok yang jauh lebih rapat dari kelompok sebanding. Titik sambungnya: skor kejanggalan Lapis 1 menjadi bobot hubungan pada Lapis 2, sehingga yang dianalisis hanya jaringan yang dirajut klaim bermasalah.\n\nSeluruh data sudah dimiliki BPJS Kesehatan. Tidak ada perangkat baru dan tanpa beban tambahan bagi fasilitas. Model dilatih tanpa data berlabel karena yang dipelajari bukan bentuk kecurangan, melainkan bentuk riwayat wajar seseorang. Sistem berjalan on-premise dan keputusan tetap di tangan verifikator.","Pemeriksaan yang selama ini tidak tertarget berubah menjadi terarah, memakai data yang sudah ada. Yang diukur: ketepatan daftar prioritas, penyempitan beban pemeriksaan, waktu deteksi, dan beban salah tanda yang selalu dilaporkan berpasangan dengan ketepatan.\n\nKami tidak mengklaim menghapus kecurangan sistemik maupun penghematan sejumlah rupiah tertentu. Sistem ini mempersempit ruang gerak pelaku sehingga skalanya turun, dan memperpendek waktu penemuannya."],"r":[{"n":"Tria Sofa Purnama","s":[4,4,3,3,3,3]},{"n":"Ikhlasul Amalia","s":[4,4,3,3,3,2]},{"n":"Husnun Nashir","s":[4,3,3,2,2,2]}]},{"id":"2179","tim":"Masuk Final Asyraff Jadian","inov":"VERI-GUARD AI: Multi-Agentic System untuk Verifikasi Biometrik Real-Time dan Deteksi Dini Fraud Pese","kat":"Efisiensi Risiko pada Peserta JKN","f":"2179_PPT Lomba.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["Verifikasi fisik di loket faskes saat ini masih berbasis cek manual, sehingga rawan peminjaman kartu dan pemalsuan identitas. Di sisi lain, celah doctor shopping resep obat kronis dan pelayanan berlebih (unnecessary services) terus membebani pembiayaan jaminan sosial. Mengandalkan audit pasca-klaim terbukti terlambat karena dana terlanjur cair. Diperlukan mekanisme penyaring otomatis di titik registrasi awal (hulu) yang terintegrasi dengan sistem antrean dan klaim BPJS Kesehatan.","1. Menghentikan peminjaman kartu dan manipulasi identitas di loket faskes lewat verifikasi wajah pasif (<1,5 detik).\n2. Mendeteksi indikasi doctor shopping dan tindakan medis tidak perlu sebelum resep atau tindakan dieksekusi faskes.\n3. Mengintegrasikan proteksi hulu ke API PCare dan vClaim tanpa mengganggu alur pelayanan reguler.\n4. Mengamankan dana amanah JKN melalui scoring risiko objektif berbasis prinsip Human-in-the-Loop dan fail-safe darurat medis (IGD).","VERI-GUARD AI adalah platform mitigasi risiko hulu berbasis multi-agent yang bekerja paralel. Di front-end loket faskes, Gatekeeper Agent memvalidasi kehadiran fisik peserta menggunakan InsightFace (vektor 512-d) dan deteksi denyut mikrosirkulasi pasif (rPPG Liveness) dalam <1,5 detik untuk memblokir peminjaman kartu, foto cetak, dan deepfake. Di back-end, Rx-Audit Agent memetakan anomali jarak-waktu kunjungan faskes, diagnosis ICD-10, serta riwayat obat Fornas via Machine Learning Spatiotemporal untuk mencegah praktik doctor shopping dan klaim fiktif.\n\nSistem menjamin privasi sesuai UU PDP: foto wajah tidak disimpan, melainkan dikonversi menjadi one-way hash AES-256. Dilengkapi Emergency Bypass agar penanganan darurat di IGD tidak terhambat administrasi. Pada pengujian 500 simulasi biometrik dan 10.000 log klaim sintetis, sistem mencatat akurasi biometrik 98,4% serta presisi deteksi anomali 94,2% dengan latensi audit rata-rata 0,82 detik per transaksi.","1. Finansial: Potensi penghematan kebocoran dana klaim obat kronis dan penunjang diagnostik sebesar 12%–18% (setara miliaran rupiah per klaster faskes per tahun).\n2. Operasional: Menurunkan kasus peminjaman kartu BPJS sebesar 85%–90% dengan proses verifikasi cepat (<1,5 detik per pasien).\n3. Mutu Layanan: Menghilangkan antrean fiktif, menjamin ketersediaan kuota obat esensial bagi pasien yang berhak, serta meminimalkan sengketa audit pasca-klaim antara faskes dan BPJS Kesehatan."],"r":[{"n":"Ikhlasul Amalia","s":[4,4,3,4,3,4]},{"n":"Husnun Nashir","s":[4,3,3,3,3,3]},{"n":"Arman Annas Putra","s":[4,3,3,3,3,3]}]},{"id":"2286","tim":"2FA","inov":"JKN SENTRY: SYNDICATE & NETWORK TRAJECTORY RISK YIELD ENGINE","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2286_JKN Sentry Healtkathon 2026.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["Proses verifikasi klaim JKN saat ini masih banyak membaca klaim secara individual dan berbasis aturan statis, sehingga pola terstruktur seperti upcoding, unbundling, cloning, rujukan fiktif, self-referral, atau kolusi antar-faskes dapat lolos karena relasi antarklaim tidak terlihat. Risiko yang tidak terdeteksi kemudian dapat menjadi kebocoran finansial. JKN SENTRY hadir untuk mengubah data klaim dan relasi antar-faskes menjadi sinyal risiko prabayar yang lebih dini, terukur, dan berbasis bukti.","Membangun JKN SENTRY sebagai sistem pendukung keputusan untuk membantu Vedika dan Tim PK-JKN mendeteksi, menjelaskan, dan memprioritaskan klaim berisiko sebelum pembayaran. Sistem mengubah data klaim menjadi intelijen risiko melalui perbandingan kelompok sejawat, analisis jejaring rujukan, kemiripan klaim, serta estimasi kebocoran finansial. Setiap sinyal dilengkapi bukti yang dapat ditelusuri, sedangkan keputusan akhir tetap sepenuhnya berada pada verifikator manusia.","JKN SENTRY adalah platform risk intelligence yang menganalisis klaim secara relasional, bukan terisolasi, dan bekerja dalam tiga tahap. Tier 1, Normative Profiling, membandingkan faskes dengan kelompok sejawat untuk mendeteksi deviasi statistik pada keparahan, lama rawat, tarif, dan pola layanan. Tier 2, Relational Graph Engine, memetakan hubungan entitas dan alur rujukan untuk menemukan konsentrasi rujukan, kemiripan klaim, serta subgraf mencurigakan yang tersembunyi pada transaksi tunggal. Tier 3, Exposure Simulator & Triage, menggabungkan skor risiko dengan estimasi potensi kelebihan pembayaran untuk menghitung paparan finansial dan menyusun prioritas verifikasi. Setiap sinyal dilengkapi bukti, konteks jaringan, perbandingan sejawat, dan estimasi paparan. Sistem tidak menetapkan kecurangan secara otomatis; keputusan tetap pada verifikator. MVP telah dibangun menggunakan skema data publik BPJS Kesehatan dan data sintetis, serta siap dikembangkan menuju uji coba terkontrol.","JKN SENTRY meningkatkan ketepatan prioritas verifikasi, mempercepat deteksi anomali, dan mengarahkan verifikator pada kasus dengan kombinasi risiko dan paparan finansial tertinggi. Dampak uji coba diukur melalui ketepatan temuan audit, tingkat positif palsu, waktu verifikasi per kasus, tingkat penerimaan verifikator, nilai paparan yang diperiksa, serta potensi kelebihan pembayaran yang dapat dicegah. Verifikasi menjadi lebih efisien, terarah, dapat ditelusuri, dan mendukung perlindungan dana JKN"],"r":[{"n":"Husnun Nashir","s":[4,4,4,4,4,4]},{"n":"Arman Annas Putra","s":[4,3,3,3,3,3]},{"n":"Djaka Santosa","s":[4,3,3,3,3,3]}]},{"id":"2306","tim":"AIGO","inov":"Sistem Identifikasi Manipulasi Transaksi dan Outlier Medis (SIMTOM)","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"Berkas revisi belum tersedia di folder proposals. Jangan menilai memakai proposal lama.","lk":0,"dec":"","fd":"","rv":"Hasil revisi, menggantikan proposal sebelumnya (Tidak lulus, flag 30/09/2026)","sub":["Skala dan keragaman klaim JKN membuat proses pemeriksaan semakin kompleks. Pemeriksaan manual atau indikator tunggal dapat melewatkan pola risiko tersembunyi pada hubungan faskes–diagnosis, tarif/LOS, pola kunjungan, dan narasi medis. Karena itu dibutuhkan risk screening yang mampu mendeteksi anomali lebih dini, menjelaskan alasan suatu klaim diprioritaskan, dan membantu reviewer memusatkan perhatian pada kasus berisiko tinggi.","SIMTOM bertujuan membantu BPJS Kesehatan mendeteksi, menjelaskan, dan memprioritaskan klaim berisiko melalui AI-assisted risk intelligence. Solusi ini diarahkan untuk memperluas cakupan screening, meningkatkan ketepatan prioritas review, mempercepat pemeriksaan, serta menyediakan risk score dan penjelasan yang dapat ditindaklanjuti reviewer, dengan keputusan akhir tetap berada pada manusia.","SIMTOM adalah working prototype AI-assisted risk intelligence untuk mendeteksi, menjelaskan, dan memprioritaskan risiko klaim JKN melalui analisis multi-layer. Sistem menggabungkan graph analytics untuk mendeteksi penyimpangan pola faskes–diagnosis, unsupervised machine learning untuk menemukan outlier tarif, LOS, dan pola klaim tanpa bergantung pada label fraud, serta text analysis untuk mengidentifikasi kemiripan resume medis, cloning, dan inkonsistensi narasi. Ketika data berlabel tersedia, supervised machine learning digunakan sebagai benchmark untuk membandingkan performa model dan mengevaluasi hasil anomaly detection. Seluruh sinyal digabungkan menjadi risk score, explanation, dan prioritas review melalui dashboard. SIMTOM tidak menetapkan fraud secara otomatis; hasil analitik berfungsi sebagai early warning yang wajib divalidasi reviewer. Prototype saat ini menggunakan data dummy/anonim, sedangkan penggunaan data JKN memerlukan dataset terotorisasi, kontrol akses, dan lingkungan","SIMTOM berpotensi memperluas cakupan risk screening, meningkatkan ketepatan prioritas klaim/faskes, dan mempercepat proses review. Reviewer dapat lebih fokus pada kasus berisiko tinggi dengan alasan yang dapat dijelaskan, sementara keputusan akhir tetap berada pada manusia. Dampak akan divalidasi melalui pilot menggunakan indikator coverage, precision, recall, review time, identifikasi faskes berisiko, dan estimasi efisiensi."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2329","tim":"Strolone","inov":"PROPOSAL DEZA ANNISA","kat":"Efisiensi Risiko pada Peserta JKN","f":"2329_PPT HEALTHKATON DEZA ANNISA (1).pdf","fw":"","lk":1,"dec":"T","fd":"07/10/2026","rv":"","sub":["Dengan adanya mobile jkn sangat membantu peserta untuk mengakses dan memperoleh informasi,administrasi dan penanganan pengaduan tanpa harus ke kantor bpjs.Namun tak luput dari itu banyak juga peserta yang datang mengeluhkan terkait kepesertaan yang nonaktif,iuran menunggak dan lain-lain.\n    banyak pengguna mobile jkn yang tidak mengecek rutin mobile jkn nya karna beberapa faktor,seperti jarang berobat, gagap teknologi atau mulai acuh terhadap kewajibannya membayar iuran.\n\nSolusinya NOTIFIKASI!","Notifikasi ini dapat muncul tanpa harus membuka aplikasi mobile jkn, dan informasi juga bisa didapat melalui whattsapp bagi yang tidak menggunakan aplikasi mobile JKN akan tetap mendapatkan notifikasi dan informasi terbaru dari jadi semua peserta BPJS dapat mengantisipasi terjadinya tunggakan iuran, penonaktifan kepesertaan atau pengambilan nomor antrian rumah sakit sesuai jadwal kontrol.\n   Ini juga berguna sebagai alat bantu untuk mengingatkan atau mengantisipasi pengguna akan penggunaan BPJS","Notifikasi ini dapat muncul tanpa harus membuka aplikasi mobile jkn, dan informasi juga bisa didapat melalui whattsapp bagi yang tidak menggunakan aplikasi mobile JKN akan tetap mendapatkan notifikasi dan informasi terbaru dari jadi semua peserta BPJS dapat mengantisipasi terjadinya tunggakan iuran, penonaktifan kepesertaan atau pengambilan nomor antrian rumah sakit sesuai jadwal kontrol.\n   Ini juga berguna sebagai alat bantu untuk mengingatkan atau mengantisipasi pengguna akan penggunaan BPJS nya.untuk terus meng-update informasi dan administrasi secara berkala. Hal ini berdampak besar terhadap keberlangsungan Program JKN.","Perubahan yang dihasilkan dengan adanya notifikasi mobile jkn adalah dapat mengurangi peserta yang datang ke kantor untuk mencari informasi dan mengecek kepesertaan. karna dengan adanya notifikasi mobile jkn (sebagai pengingat)  permasalahan setidaknya  sudah ditanggulangi karena resiko kelalaian pada pengguna.\nManfaat yang didapatkan  oleh pengguna mobile jkn dengan adanya notifikasi pada mobile jkn adalah  memperlancar segala aktivitas pada saat pengobatan tanpa adanya kendala nonaktif"],"r":[{"n":"Djaka Santosa","s":[2,1,1,1,1,1]},{"n":"I Made Karistiawan","s":[2,1,1,1,1,1]},{"n":"Agung Waluyo","s":[2,1,1,1,1,1]}]},{"id":"2414","tim":"Viralin","inov":"SAKTI JKN, Sistem AI untuk Verifikasi Silang dan Deteksi Ketidaksesuaian Klaim Pelayanan Kesehatan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2414_Proposal Healthkathon 2026 - SAKTI JKN.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["Dengan lebih dari 282 juta peserta, 725 juta pemanfaatan layanan per tahun, dan nilai klaim sekitar Rp191,3 triliun pada 2025, JKN menghadapi kompleksitas verifikasi dalam skala sangat besar. Proses manual berisiko lambat, tidak konsisten, membuka kemungkinan kealpaan, ketidaksesuaian, atau indikasi pelanggaran yang dapat memengaruhi pembayaran cash flow faskes, dan keberlanjutan dana JKN. SAKTI JKN hadir untuk meningkatkan kecepatan, akurasi, dan keterlacakan verifikasi klaim berbasis AI.","Menargetkan proses verifikasi klaim menjadi hingga 90% lebih cepat, dengan =95% klaim berisiko tinggi teridentifikasi untuk diprioritaskan ke human reviewer serta =99% temuan dapat ditelusuri ke bukti pendukung. Sistem juga ditujukan meningkatkan efisiensi operasional verifikasi, membangun profil risiko faskes untuk early warning dan prioritas audit, serta mempercepat penyelesaian klaim valid agar cash flow dan layanan faskes tetap terjaga.","SAKTI JKN adalah sistem analisis klaim terintegrasi berbasis AI yang memverifikasi konsistensi antara data klaim dan dokumen pelayanan medis, tindakan, serta obat. Dokumen seperti resume medis, catatan tindakan, resep, catatan dispensing, hasil pemeriksaan, billing, dan discharge summary dibaca melalui document intelligence yang dapat dijalankan secara lokal. Informasi penting diekstrak menjadi data terstruktur, lalu diverifikasi silang menggunakan rule-based checking, semantic similarity, duplicate detection, dan analisis konsistensi antar dokumen. Sistem dapat mengidentifikasi indikasi phantom billing, tindakan atau obat fiktif, pengurangan jumlah obat, repeat billing, dan cloning. Setiap klaim menghasilkan temuan, alasan pendukung, serta risk scoring untuk membantu verifier menentukan prioritas pemeriksaan. Prototype menggunakan data sintetis/anonim dan tetap menempatkan keputusan akhir pada human reviewer.","SAKTI JKN membantu BPJS Kesehatan mengubah proses verifikasi dari pemeriksaan manual yang luas menjadi risk-based review yang lebih terarah. Dampak yang ditargetkan meliputi percepatan identifikasi klaim bermasalah, pengurangan beban verifikasi manual, peningkatan keterlacakan bukti, serta pencegahan pembayaran klaim yang tidak sesuai. Bagi peserta dan ekosistem JKN, solusi ini mendukung integritas layanan, efisiensi pengelolaan, dan keberlanjutan dana JKN."],"r":[{"n":"I Made Karistiawan","s":[4,3,3,2,3,3]},{"n":"Agung Waluyo","s":[4,3,3,3,3,4]},{"n":"Paul Donald P","s":[4,3,4,3,3,3]}]},{"id":"2454","tim":"Sehat Bermanfaat","inov":"SUAR - Sistem Uji Anomali Risiko","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2454_SUAR-Healthkathon2026-Sehat-Bermanfaat.pdf","fw":"","lk":1,"dec":"L","fd":"07/10/2026","rv":"","sub":["Pemeriksaan kepatuhan pemberi kerja saat ini memilih sasaran hampir tanpa petunjuk data. Studi di satu kota menunjukkan 70,4% pemeriksaan berakhir tanpa kesimpulan, karena prosesnya bertumpu pada kehadiran dan percakapan. Padahal bukti ketidaksesuaian sudah tersimpan di sistem BPJS sendiri: data kepesertaan e-Dabu, riwayat pembayaran, dan riwayat segmen peserta. Yang belum ada adalah jembatan di antaranya. Akibatnya kapasitas pemeriksa yang terbatas habis pada sasaran yang keliru.","Menyusun lapisan prioritisasi yang menjawab satu pertanyaan sebelum pemeriksaan dimulai: badan usaha mana yang paling layak diperiksa lebih dulu, dan atas dasar apa. Sasarannya: (1) menaikkan ketepatan penunjukan sasaran; (2) memberi pemeriksa berkas bukti awal yang sudah terlampir, bukan sekadar nama; (3) memberi sinyal pada seluruh badan usaha tanpa memerlukan kunjungan; (4) menjaga keputusan akhir tetap di tangan pemeriksa manusia.","SUAR membaca data yang sudah dimiliki BPJS, menghitung 24 aturan deteksi yang dapat dijelaskan sebab-akibatnya, lalu menyusun skor risiko 0-100 per badan usaha beserta aturan yang menyalakannya. Aturan dikelompokkan mengikuti sub-kategori resmi BPJS. Di atas lapisan aturan, Isolation Forest yang ditulis dari nol dengan numpy mencari pola yang belum dikenal aturan. Prototipe berjalan end-to-end dan diuji pada 500 badan usaha sintetis: pada 20% teratas, 99 dari 100 sasaran benar bermasalah, dibanding 64 bila ditunjuk acak. Pemetaan langsung portal e-Dabu menemukan dua hal: kolom isian upah berbunyi \"Gaji Pokok + Tunjangan\" sementara surat pernyataan di portal yang sama menuntut \"Gaji Pokok dan Tunjangan Tetap\" (Perpres 82/2018 Pasal 33 ayat 3); dan lantai UMK berjangkar pada Sub PKS, bukan wilayah kerja pekerja. Seluruh pengujian memakai data sintetis; tidak ada data peserta JKN yang digunakan.","Dengan ketepatan 99% pada 20% teratas, sekitar sepertiga kapasitas pemeriksaan dapat dialihkan dari sasaran yang tidak menghasilkan ke sasaran yang berbukti. 17 dari 24 aturan hanya membutuhkan data yang sudah ada di BPJS Kesehatan, sehingga fase pertama tidak menunggu kesepakatan pihak lain. Pekerja memperoleh hak sesuai upah sebenarnya; pemberi kerja yang patuh terlindungi dari persaingan tidak sehat; dana JKN menerima iuran sesuai ketentuan. Angka dampak masih estimasi dari data sintetis."],"r":[{"n":"Agung Waluyo","s":[4,4,4,4,4,4]},{"n":"Paul Donald P","s":[4,3,4,3,3,3]},{"n":"Tria Sofa Purnama","s":[4,4,3,3,3,3]}]},{"id":"2459","tim":"AKN 6 Mantap Sekali","inov":"JKN Shield AI — Mesin Deteksi Fraud Klaim JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2459_JKN Shield AI - Proposal Healthkathon 2026_Nurul Fauzi _Rakyan Dewangga.pdf","fw":"","lk":1,"dec":"L","fd":"07/10/2026","rv":"","sub":["Program JKN yang dikelola BPJS Kesehatan melayani ratusan juta peserta dengan volume klaim jutaan transaksi per bulan. Riset internasional (du Preez dkk., 2025) menunjukkan prevalensi fraud klaim kesehatan berkisar 3-10% dari nilai klaim. Verifikasi manual berbasis sampel acak tidak mampu mengejar skala ini, tanpa alasan tertulis mengapa klaim dicurigai. Dari perspektif pengendalian internal BPK RI, dibutuhkan sistem deteksi dini terukur dan akuntabel — inilah latar belakang JKN Shield AI.","JKN Shield AI bertujuan membangun sistem pendukung keputusan berbasis AI yang membantu BPJS Kesehatan memprioritaskan klaim untuk diverifikasi, bukan sampel acak. Tujuan khususnya: (1) mendeteksi anomali tanpa label fraud sebelumnya, (2) memberi alasan tertulis tiap keputusan, (3) mencegah bias sistemik terkunci pada faskes tertentu, (4) membangun alur kerja penuh — assign, verifikasi, eskalasi — bukan sekadar dashboard, dan (5) teruji nyata pada skala besar sebelum diklaim layak produksi.","JKN Shield AI memproses data klaim 100 kolom format INA-CBG melalui 4 lapisan skor independen. Layer 1 (CAS) memakai Isolation Forest tanpa label untuk mendeteksi anomali klaim. Layer 2 (AR) memakai shrinkage Bayesian agar dokter/RS bersampel kecil tidak dihukum tidak adil. Layer 3 (NET) menangkap kombinasi dokter-RS yang anomali secara bersama. Layer 4 (H) mengonversi riwayat verifikasi jadi pengali terbatas ±15%, mencegah bias terkunci ke faskes tertentu. Random Forest mengkalibrasi keempatnya jadi fraud_risk_score final, dengan threshold yang dikalibrasi ulang otomatis via ROC/Youden. Jenis fraud (Duplicate, Upcoding, dst.) dihitung genuine dari data klaim, bukan diacak — tiap klaim dapat alasan tertulis konkret. Di atas mesin skor ini berjalan aplikasi web dengan 4 peran (verifikator/supervisor/direktur/komisaris), SLA otomatis, eskalasi, dan halaman Manajemen dengan ekspor laporan. Seluruhnya diverifikasi lewat 84 test otomatis dan diuji pada skala 900.000 klaim.","Pada pengujian 900.000 klaim, sistem memprioritaskan 83.529 klaim (9,3%) sebagai berisiko tinggi — bukan sampel acak. Peserta JKN diuntungkan dari dana program yang lebih terjaga; faskes jujur tidak tenggelam pemeriksaan acak; BPJS Kesehatan dapat kendali internal lebih efisien. Perlu jujur dicatat: angka potensi kerugian Rp956 M berasal dari data sintetis untuk uji skala, bukan estimasi kerugian JKN riil. Dampak sah baru bisa diklaim setelah kalibrasi dengan data verifikasi klaim BPJS sungguhan"],"r":[{"n":"Paul Donald P","s":[4,4,4,3,4,3]},{"n":"Tria Sofa Purnama","s":[4,4,4,3,3,3]},{"n":"Ikhlasul Amalia","s":[4,4,4,3,4,3]}]},{"id":"2525","tim":"MICO","inov":"TERANG","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2525_TERANG-Healthkathon2026-Proposal.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["Fraud pada layanan JKN bukan risiko teoretis: dari alokasi Rp150 triliun/tahun, KPK memperkirakan kerugian akibat manipulasi klaim ~Rp20 triliun (Sep 2024), di tengah 278 juta peserta aktif yang sulit diaudit manual. Perangkat deteksi umum dibangun untuk klaim tatap muka, sementara telemedicine dan rawat inap punya celah berbeda: klaim phantom/cloned, upcoding lewat durasi, dan naik kelas tanpa indikasi medis. ~87% belanja JKN mengalir ke FKRTL — level yang paling perlu dijaga integritasnya.","TERANG bertujuan mendeteksi tiga pola kecurangan klaim yang lolos dari audit berbasis dokumen, dengan membaca metadata sesi lintas kanal telemedicine dan rawat inap — lalu menyalurkan hasilnya ke proses evaluasi kerja sama faskes yang sudah berjalan di BPJS Kesehatan, bukan sekadar dashboard berdiri sendiri. Solusi dibangun lintas kanal sejak awal, mengandalkan sinyal metadata objektif (overlap jadwal dokter, durasi sesi) yang sulit direkayasa, dan tersambung langsung ke keputusan nyata.","TERANG bekerja lewat satu mesin dengan tiga modul deteksi paralel. Modul 1 mendeteksi overlap jadwal dokter (impossible concurrency): membandingkan jendela waktu sesi klaim atas nama dokter yang sama lintas faskes/kanal — tumpang tindih waktu menandai sinyal phantom billing atau cloning. Modul 2 mendeteksi mismatch durasi sesi telekonsultasi vs tier tagihan yang diklaim, menangkap sinyal upcoding lewat durasi, bukan pola coding konvensional. Modul 3 mendeteksi naik kelas rawat inap tanpa justifikasi medis, membandingkan histori naik kelas dengan sinyal medis objektif. Ketiga modul diagregasi menjadi skor integritas per faskes dengan jejak audit, menjadi input evaluasi kerja sama faskes berjenjang — bukan keputusan otomatis. Alur: data sintetis (log sesi, rekam rawat inap, jadwal dokter) ? 3 modul deteksi paralel ? skor terbobot ? dashboard review, setiap flag berstatus rekomendasi untuk ditinjau manusia. Tidak ada data peserta JKN asli digunakan pada tahap mana pun.","Dampak diukur bertanggung jawab, tidak overclaim: dibandingkan baseline satu-sinyal pada data sintetis berlabel, precision/recall pada data uji terukur, dan proyeksi penghematan ditandai eksplisit sebagai estimasi. Manfaatnya: peserta JKN dapat proses klaim lebih adil, faskes patuh dapat evaluasi kerja sama lebih cepat, BPJS dapat sinyal dini untuk audit lebih terarah, dan setiap kebocoran dicegah memperpanjang daya tahan dana JKN bagi seluruh peserta."],"r":[{"n":"Tria Sofa Purnama","s":[4,4,3,3,3,3]},{"n":"Ikhlasul Amalia","s":[4,4,3,4,3,4]},{"n":"Husnun Nashir","s":[4,3,2,3,2,3]}]},{"id":"2548","tim":"SUKMA","inov":"WASKLAIM – AI-Assisted Claim Risk Detection & Prioritization","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2548_Deck_WASKLAIM_BPJSHealthkathon_2026_Compress.pdf","fw":"","lk":1,"dec":"L","fd":"30/09/2026","rv":"","sub":["Program JKN memiliki skala dan kompleksitas klaim yang besar, sehingga identifikasi risiko pada klaim fasilitas kesehatan menjadi tantangan. Pola seperti repeat billing, upcoding, dan cloning dapat sulit disaring secara konsisten melalui pemeriksaan manual. Dibutuhkan alat bantu yang mampu mendeteksi sinyal risiko lebih awal dan membantu menentukan klaim yang perlu diprioritaskan untuk verifikasi.","Mengembangkan WASKLAIM sebagai alat bantu digital untuk mendeteksi sinyal risiko pada klaim fasilitas kesehatan, khususnya repeat billing, upcoding, dan cloning. WASKLAIM memberikan risk score dan faktor pemicu yang dapat dijelaskan, sehingga membantu petugas memprioritaskan klaim untuk verifikasi secara lebih terarah. Keputusan akhir tetap dilakukan oleh petugas.","WASKLAIM adalah platform AI-assisted Claim Risk Detection & Prioritization yang mengubah data klaim menjadi sinyal risiko yang dapat ditindaklanjuti. Sistem menganalisis karakteristik dan pola klaim untuk mendeteksi indikasi repeat billing, upcoding, dan cloning. Setiap klaim menghasilkan Risk Score 0–100 beserta explainable risk signals yang menunjukkan faktor pemicu risiko. Klaim kemudian diprioritaskan berdasarkan tingkat risikonya untuk membantu proses review dan verifikasi. Prototype menggunakan synthetic/dummy claims data dan menerapkan human-in-the-loop. WASKLAIM tidak memvonis fraud dan tidak menggantikan petugas; hasil sistem menjadi alat bantu untuk menentukan klaim yang perlu diperiksa terlebih dahulu. Pengembangan selanjutnya diarahkan pada validasi dengan data terotorisasi, kalibrasi model, pilot terbatas, dan integrasi ke workflow verifikasi.","WASKLAIM diharapkan membantu mempercepat screening dan membuat proses verifikasi lebih terarah dengan memprioritaskan klaim berdasarkan sinyal risiko. Dampak akan diukur melalui waktu identifikasi klaim prioritas, precision of prioritization, dan cakupan klaim yang dapat disaring. Dalam jangka panjang, solusi ini diharapkan mendukung penguatan risk management dan ketepatan pengelolaan Program JKN."],"r":[{"n":"Ikhlasul Amalia","s":[3,3,3,3,2,2]},{"n":"Husnun Nashir","s":[4,3,3,3,3,3]},{"n":"Arman Annas Putra","s":[4,3,3,3,3,3]}]},{"id":"2556","tim":"Tim Gelombang Utara","inov":"BILL GATES - Gerbang Pintar Deteksi Klaim Ganda JKN Sebelum Terbayar","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2556_BILLGATES_Proposal Healthkathon 2026_Tim Gelombang Utara.pdf","fw":"","lk":1,"dec":"T","fd":"30/09/2026","rv":"","sub":["Program JKN menghadapi risiko klaim bermasalah yang menekan efisiensi dan keberlanjutan pembiayaan. KPK mencatat 175.774 klaim FKRTL terindikasi fraud senilai Rp440 miliar (Juni 2015), dan rasio klaim terhadap iuran JKN mencapai 106,6% pada April 2025. BPJS Kesehatan sudah memiliki sistem verifikasi digital dan skoring berbasis AI, dan verifikator tetap memutuskan. BILL GATES hadir sebagai lapisan pelengkap yang berfokus pada phantom/repeat billing: klaim baru direkonsiliasi dengan riwayat klaim","Membantu verifikator BPJS menyaring klaim ganda secara lebih cepat, terarah, dan dapat dijelaskan. Sistem membandingkan klaim baru dengan riwayat klaim, menghasilkan skor kemiripan 0–100 beserta alasan per atribut, lalu hanya meneruskan klaim berisiko tinggi untuk ditinjau manusia. Sistem juga belajar dari keputusan Setujui/Tolak verifikator agar klaim sah yang kebetulan mirip (mis. dialisis, rehabilitasi) makin jarang ditandai. Tidak ada klaim yang ditolak otomatis.","BILL GATES (BILLing Ganda & Anomali TerEliminasi Sistem) adalah prototype Command Center untuk penapisan klaim JKN sebelum pembayaran. Lapis 1 memakai skor kemiripan berbasis aturan yang explainable (ID pasien termasuk salah ketik 1 karakter, ICD-10, tindakan, faskes, selisih waktu, nilai klaim), dengan pengelompokan agar efisien pada data besar. Lapis 2 adalah model regresi logistik kecil dengan 8 bobot terbaca yang belajar dari keputusan verifikator dan hanya menyaring kandidat dari Lapis 1. Prototype memiliki 12 halaman kerja, termasuk Pusat Verifikasi, Investigasi, Radar Risiko, Log Audit, dan Manajemen Pengguna dengan tiga peran akses terbatas. Demo berjalan pada 3.917 baris klaim, subset kecil dari Data Sampel BPJS Kesehatan (ID pasien sudah dipseudonimkan BPJS). Firestore hanya untuk demo. Arsitektur produksi menempatkan data dan mesin deteksi di infrastruktur BPJS, dan integrasi API menjadi tahap pengembangan berikutnya","Pada 5.026 klaim sintetis berlabel (100 duplikat), algoritma awal tim menandai 56,1% klaim untuk ditinjau dengan precision 3,5%. Setelah diperbaiki, hanya 3,5% klaim yang ditandai dengan precision 56,2%, recall 100% pada data uji, dan F1 71,9%. Pada simulasi, F1 naik menjadi 88,6% setelah model belajar dari 400 keputusan verifikator. Pemrosesan 100.000 klaim memakan 2,4 detik (satu batch, 1 core)."],"r":[{"n":"Husnun Nashir","s":[3,3,2,2,3,3]},{"n":"Arman Annas Putra","s":[3,3,3,3,3,3]},{"n":"Djaka Santosa","s":[3,2,2,2,2,2]}]},{"id":"2571","tim":"TUKANG ONLINE","inov":"Bantuan kesehatan pada kerja tukang harian lepas","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2571_Proposal_Final_TUKANG_ONLINE ( Tulen).pdf","fw":"","lk":1,"dec":"T","fd":"07/10/2026","rv":"","sub":["jasa kontraktor berbasis digital","mendapatakan bantuan dana CSR","membuat yayasan pertukangan berbasis vokasi","semua anggota mitra tukang akan mendapatkan jaminan kesehatan yang terdaftar di BPJS kesehatan dan ketenagakerjaan"],"r":[{"n":"Arman Annas Putra","s":[4,1,1,2,1,1]},{"n":"Djaka Santosa","s":[1,1,1,1,1,1]},{"n":"I Made Karistiawan","s":[1,1,1,1,1,1]}]},{"id":"2584","tim":"JKN Trace","inov":"JKN Trace","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2584_BPJS.pdf","fw":"","lk":1,"dec":"T","fd":"30/09/2026","rv":"","sub":["Verifikasi klaim JKN umumnya memeriksa klaim satu per satu, padahal pola fraud seperti readmisi berulang, klaim fiktif (phantom billing), dan upcoding baru terlihat ketika klaim, dokter, rujukan, dan rumah sakit dibaca bersama. Dengan volume klaim yang besar, auditor membutuhkan cara untuk menghubungkan sinyal risiko dan menentukan kasus yang paling layak ditelusuri. JKN TRACE merekonstruksi klaim menjadi Episode of Care, membentuk Risk Chain yang dapat ditelusuri, dan menjelaskan alasan penanda","Mengembangkan JKN TRACE untuk membantu auditor menelusuri dan memprioritaskan risiko klaim JKN (readmisi berulang, klaim fiktif, dan upcoding) melalui Episode of Care, Risk Chain, dan Explainable AI, dengan keputusan akhir tetap pada auditor.","JKN TRACE adalah sistem risk intelligence yang merekonstruksi klaim JKN menjadi Episode of Care, merangkai sinyal risiko menjadi Risk Chain yang dapat ditelusuri, dan menjelaskan alasan penandaan dengan Explainable AI. Sistem ini membantu auditor memprioritaskan kasus readmisi berulang, klaim fiktif, dan upcoding, tanpa menggantikan keputusan auditor.","JKN TRACE membantu auditor menemukan dan memprioritaskan klaim berisiko yang sulit terlihat pada pemeriksaan satu per satu. Dampa
