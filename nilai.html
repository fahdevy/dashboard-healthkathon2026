adi risk score\n- Menjelaskan alasan suatu klaim terindikasi berisiko\n- Membantu auditor menentukan prioritas verifikasi dan investigasi\n- Memetakan distribusi risiko berdasarkan wilayah dan jaringan faskes","Verifymed AI merupakan platform AI yang digunakan untuk mendeteksi dan memetakan risiko fraud klaim JKN secara cepat, terukur, dan dapat dijelaskan.","Dengan adanya inovasi ini diharapkan mampu mendeteksi adanya risiko fraud yang dapat terjadi di fasilitas kesehatan"],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2434","tim":"Semoga Sehat Selalu","inov":"KLAIRA: Deteksi Anomali Klaim JKN melalui Analisis Hubungan Antar-Klaim","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Panduan Healthkathon 2026 menyoroti risiko repeat billing, pemecahan episode, dan cloning klaim. Indikasi tersebut dapat muncul ketika riwayat pelayanan, atribut klaim, dan dokumentasi dibandingkan bersama. KLAIRA mengusulkan analisis hubungan antar-klaim untuk membantu verifikator menemukan indikasi yang perlu diperiksa, dengan mempertimbangkan pengajuan ulang sah, readmisi, dan penggunaan template medis.","Mengembangkan prototype KLAIRA untuk mengidentifikasi indikasi Repeat Billing, Episode Fragmentation, dan Cloning Klaim pada data sintetis. Sistem dirancang untuk memprioritaskan review, menyajikan hubungan klaim serta bukti pendukung, dan mencatat keputusan verifikator. Kualitas deteksi dan efisiensi review akan diuji secara terukur. Keputusan akhir tetap pada manusia.","KLAIRA (Klaim Intelligence & Risk Analytics) adalah konsep platform web untuk analisis anomali klaim JKN. Sistem menggabungkan matching atribut dan riwayat administrasi untuk repeat billing, analisis temporal serta graph dengan aturan paket simulasi untuk fragmentation, dan TF-IDF serta cosine similarity untuk cloning dokumentasi. Temuan disatukan dalam kasus investigasi yang memuat klaim terkait, timeline, potongan teks serupa, dan alasan prioritas review. Skor prioritas bukan probabilitas fraud. Prototype direncanakan memakai data sintetis berlabel, termasuk kasus normal yang menyerupai anomali. Label dipisahkan dari input detektor. Kontrol akses, audit trail, dan review manusia menjadi bagian rancangan. Tim Semoga Sehat Selalu terdiri atas Bimo Rio Prastiawan dan Fikri Fri Yanto, masing-masing memiliki lebih dari 5 tahun pengalaman pengembangan web.","KLAIRA diharapkan memudahkan penelusuran bukti dan membantu prioritas pemeriksaan klaim. Target awal pada simulasi: precision minimal 85%, recall minimal 80% per detektor, false-positive rate maksimal 5%, dan penurunan median waktu review minimal 20% tanpa menurunkan ketepatan. Semua angka merupakan target, belum hasil. Dampak nyata dan penghematan dana memerlukan validasi pada data berizin dan pengujian bersama pengguna."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2437","tim":"Vitalisfor","inov":"BSAFE-BPJS System for Anti-Fraud Enforcement","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program Jaminan Kesehatan Nasional (JKN) bergantung pada kepatuhan perusahaan dalam mendaftarkan pekerja dan membayar iuran. Namun, masih terdapat potensi kecurangan berupa pendaftaran pekerja sebagian, pelaporan upah lebih rendah, misklasifikasi status kerja, dan manipulasi data mutasi karyawan. B-SAFE dikembangkan untuk mendeteksi anomali dan meningkatkan efektivitas pengawasan kepatuhan perusahaan.","Mengembangkan B-SAFE sebagai platform analitik terintegrasi untuk mendeteksi indikasi fraud kepesertaan BPJS Kesehatan, mengidentifikasi ketidaksesuaian data pekerja dan perusahaan, meningkatkan efisiensi pengawasan, membantu menentukan prioritas audit berbasis risiko, serta mendukung kepatuhan perusahaan dan pemerataan perlindungan kesehatan pekerja.","B-SAFE (BPJS System for Anti-Fraud Enforcement) merupakan platform analitik yang mengintegrasikan data BPJS Kesehatan, Kemnaker, DJP, Dukcapil, dan OSS melalui mekanisme pertukaran data sesuai kewenangan. Sistem menghubungkan informasi menggunakan NIK, NPWP, dan NIB untuk melakukan verifikasi silang serta mendeteksi indikasi pendaftaran pekerja sebagian, pelaporan upah lebih rendah, misklasifikasi status hubungan kerja, dan manipulasi data mutasi karyawan. Hasil analisis ditampilkan melalui dashboard pemantauan dan risk scoring untuk membantu petugas menentukan prioritas verifikasi dan audit. B-SAFE juga dirancang dengan pengamanan berupa enkripsi, audit log, Role-Based Access Control (RBAC), dan data masking untuk mendukung keamanan serta pelindungan data pribadi.","B-SAFE diharapkan meningkatkan efisiensi pengawasan BPJS Kesehatan melalui deteksi anomali otomatis dan prioritas audit berbasis risiko. Sistem ini membantu mengidentifikasi potensi kekurangan iuran, meningkatkan kepatuhan perusahaan, dan mengurangi ketidaksesuaian data kepesertaan. Bagi pekerja, B-SAFE mendukung pemerataan perlindungan kesehatan dan kepastian kepesertaan JKN, sekaligus mendorong transparansi, akuntabilitas, dan keberlanjutan program JKN."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2446","tim":"Sambak","inov":"JagaJKN: Dari Upah hingga Setoran, Kepatuhan Iuran JKN yang Transparan  dan Dapat Diverifikasi","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Cakupan JKN yang luas menuntut pengawasan iuran yang akurat dan transparan. Namun, ketidaksesuaian status kerja, pelaporan upah yang lebih rendah, serta potongan iuran pekerja yang tidak disetorkan dapat mengurangi penerimaan JKN. Pada 2025, JKN mencakup 282,7 juta peserta dengan 725,3 juta pemanfaatan layanan kesehatan. Keterbatasan verifikasi data perusahaan menyulitkan deteksi dini, sehingga diperlukan sistem yang mampu mencocokkan data sumber dan memprioritaskan pemeriksaan.","Tujuan proposal JagaJKN adalah mengembangkan platform berbasis web untuk meningkatkan transparansi dan verifikasi kepatuhan iuran JKN melalui pencocokan data kontrak, presensi, upah, potongan gaji, dan setoran iuran. Sistem ini diharapkan mampu mendeteksi indikasi ketidaksesuaian sejak dini, menghasilkan skor risiko untuk memprioritaskan audit BPJS Kesehatan, serta memberikan notifikasi kepada pekerja mengenai potongan dan status setoran iuran. Dengan demikian, pengawasan menjadi lebih efisien,","JagaJKN karya Tim Sambak (Healthkathon 2026, BPJS Kesehatan) adalah platform web yang memverifikasi kepatuhan iuran JKN langsung dari data sumber perusahaan. Solusi ini menjawab tiga risiko pada pemberi kerja: misklasifikasi status kerja, pelaporan upah lebih rendah, dan penggelapan setoran iuran. Sistem mengintegrasikan kontrak, presensi, upah, dan potongan gaji, lalu mencocokkan upah dengan presensi serta potongan 1% dengan setoran BPJS. Hasilnya berupa skor risiko per perusahaan yang dihitung secara hibrida, yaitu tujuh indikator berbasis aturan dan robust z-score untuk mendeteksi anomali, dengan target precision audit di atas 70%. Pekerja menerima notifikasi tiap potongan dan dapat melapor anonim, sedangkan auditor BPJS mendapat daftar prioritas audit. Skor hanya menjadi dasar prioritas, bukan bukti pelanggaran, dan keputusan tetap dilakukan manusia sesuai UU PDP.","JagaJKN diharapkan mengubah verifikasi iuran dari berbasis laporan perusahaan menjadi berbasis data sumber. Bagi BPJS, deteksi dugaan pelanggaran meningkat dari sekitar 4 kali per tahun menjadi kontinu atau mingguan, dengan prioritas audit lebih tepat sasaran (target precision >70%) dan nilai iuran terverifikasi bertambah. Pekerja mendapat transparansi potongan 1% dan ruang untuk melapor (target >50% aktif). Perusahaan patuh bersaing lebih adil, dan penerimaan iuran JKN lebih terjaga. Seluruh ta"],"r":[{"n":"Djaka Santosa","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2452","tim":"Starsinter","inov":"CLAIM READY: Pre-Submission Claim Readiness System untuk Meningkatkan Kesiapan dan Mengurangi Risiko","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Proses pengajuan klaim JKN masih menghadapi permasalahan ketidaklengkapan dokumen, inkonsistensi data, dan potensi penagihan berulang. Laporan Kinerja Pusbikes Tahun 2025 mencatat klaim pending sebesar Rp5,6 triliun dari total Rp42,4 triliun klaim yang diajukan pada sampel Januari–Juni 2025. Kondisi ini menunjukkan perlunya pemeriksaan preventif sebelum pengajuan. CLAIM READY diusulkan sebagai solusi untuk membantu petugas mengidentifikasi potensi masalah sejak awal.","Mengembangkan CLAIM READY sebagai sistem pemeriksaan kesiapan klaim JKN sebelum pengajuan untuk membantu petugas klaim dan casemix mendeteksi potensi phantom/repeat billing, memeriksa kelengkapan dokumen, serta mengidentifikasi inkonsistensi data. Sistem ini bertujuan meningkatkan kesiapan administrasi klaim, mendukung koreksi lebih awal, dan mengurangi kebutuhan perbaikan setelah pengajuan melalui pemeriksaan yang transparan dengan tetap melibatkan manusia dalam pengambilan keputusan.","CLAIM READY (Pre-Submission Claim Readiness System) merupakan prototipe aplikasi web untuk memeriksa kesiapan klaim JKN sebelum pengajuan. Sistem menggunakan pendekatan rule-based validation dengan tiga pemeriksaan utama: indikasi phantom/repeat billing, kelengkapan dokumen pendukung, dan konsistensi data. Indikasi phantom billing diperiksa melalui kesesuaian informasi layanan dengan bukti pendukung, sedangkan repeat billing diidentifikasi berdasarkan kemiripan identitas peserta, episode pelayanan, dan riwayat klaim. Hasil pemeriksaan dikelompokkan menjadi tiga status: Siap, Perlu Dilengkapi, dan Perlu Ditinjau. Setiap temuan disertai alasan untuk membantu petugas melakukan verifikasi dan koreksi. Prototipe menggunakan 8–10 data klaim sintetis tanpa integrasi dengan sistem BPJS Kesehatan atau sistem informasi rumah sakit. CLAIM READY tidak menetapkan fraud atau menyetujui klaim secara otomatis. Keputusan akhir tetap berada pada petugas berwenang.","CLAIM READY diharapkan membantu fasilitas kesehatan mengidentifikasi indikasi phantom/repeat billing, menemukan kekurangan dokumen, dan mendeteksi inkonsistensi data sebelum klaim diajukan. Sistem berpotensi mengurangi koreksi berulang, meningkatkan ketertiban administrasi, dan mengefisienkan pemeriksaan klaim. Dampak dievaluasi melalui ketepatan aturan, false positive, waktu pemeriksaan, dan tindak lanjut temuan. Penurunan klaim pending perlu dibuktikan melalui uji coba lapangan."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2461","tim":"Catalyst","inov":"VerifiTrust: Sistem Deteksi Dini Pemalsuan Data dan Identitas Peserta JKN","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN mencakup 282,7 juta jiwa (lebih dari 98% penduduk) per Desember 2025, sehingga validitas data kepesertaan menjadi fondasi penarikan iuran dan pembayaran klaim. Temuan BPK yang dilaporkan media menunjukkan masalah berulang: 9,85 juta peserta aktif ber-NIK tidak valid (audit data 2019) dan 270.587 peserta meninggal masih dibayarkan iurannya senilai Rp40,99 miliar (2024). Verifikasi saat ini bersifat sesaat, sehingga masalah baru terungkap lewat audit setelah kerugian terjadi.","Merancang dan membuktikan konsep VerifiTrust, sistem deteksi dini pemalsuan data dan penyalahgunaan identitas peserta JKN berbasis riwayat data kepesertaan. Secara khusus: (1) membangun purwarupa deteksi anomali dan analisis graf relasi pada data sintetis; (2) mengukur kinerjanya, termasuk alarm palsu pada peserta mobilitas tinggi yang sah; (3) merancang human-in-the-loop, penjelasan fitur, dan jejak audit agar keputusan akuntabel.","VerifiTrust memeriksa data kepesertaan sebagai riwayat yang berjalan, bukan satu momen verifikasi. Sistem memadukan tiga mesin: aturan validasi untuk ketidaksesuaian pasti (NIK tidak padan, ganda, status meninggal), deteksi anomali perilaku dengan Isolation Forest terhadap baseline peserta dan segmen, serta analisis graf relasi dengan algoritma Louvain untuk menemukan jaringan identitas yang berbagi nomor telepon atau alamat. Keluarannya berupa antrean kandidat tinjauan berprioritas dengan reason code dan jejak audit. Keputusan akhir ada pada verifikator manusia dan layanan peserta tidak dihentikan otomatis. Purwarupa telah berjalan pada data sintetis 3.000 peserta; aturan validasi dan penjelasan SHAP masih tahap rancangan. Data pribadi dijaga lewat pseudonimisasi, minimisasi data, dan akses berbasis peran.","Deteksi bergeser dari audit periodik yang reaktif menjadi proaktif sepanjang siklus layanan, verifikator berfokus pada kasus berperingkat risiko, dan setiap keputusan memiliki jejak audit. Manfaat dirasakan peserta sah, fasilitas kesehatan, BPJS Kesehatan, dan sistem JKN. Dampak bersifat estimasi dan akan diukur pada pilot: lift terhadap pemilihan acak, alarm palsu pada kelompok sah, dan waktu dari anomali ke keputusan. Proyeksi penghematan belum disertakan."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2468","tim":"ADA Healthkathon","inov":"Vedika Autentik : Fitur AI untuk memastikan keaslian berkas klaim JKN bagi verifikator BPJS","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["KPK menemukan fisioterapi yang dilakukan 2 kali tetapi ditagih 10 kali, padahal rekam dan resume medisnya tampak lengkap. Itjen Kemenkes mencatat 3.269 dari 4.341 tagihan (75,3%) di tiga RS sampel diduga fiktif. Verifikasi klaim sudah berlapis, tetapi yang diperiksa kelengkapan dan aturan, bukan keaslian berkas. Di tengah 6,41 juta kunjungan RS Kemenkes yang diverifikasi lewat VEDIKA pada 2024, verifikator belum punya cara mengenali berkas yang dipakai ulang atau disunting sebelum klaim dibayar.","Vedika Autentik bertujuan menangkap berkas klaim yang tidak autentik sebelum pembayaran, tanpa menambah beban kerja verifikator. Tiga sasarannya: (1) memeriksa keaslian berkas fisioterapi dari JKN Drive dalam kurang dari 10 detik per berkas, (2) mengurutkan antrean menurut risiko agar verifikator mulai dari berkas yang paling perlu dicek, dan (3) menyajikan bukti yang bisa diperiksa langsung pada berkas, sehingga keputusan tetap di tangan manusia dan RS yang jujur tidak salah dituduh.","Vedika Autentik adalah fitur AI di dalam VEDIKA yang memeriksa keaslian berkas klaim sebelum keputusan bayar, tanpa aplikasi baru bagi rumah sakit. Masukannya berkas klaim dari JKN Drive, data klaim, dan arsip berkas terdahulu sebagai pembanding. Berkas dibaca dengan OCR dan model vision-language, lalu melewati enam pemeriksaan: kecocokan isi dengan data klaim, dokumen dipakai ulang lintas pasien, penyalinan dan penyuntingan tanda tangan atau angka, integritas metadata dan template, pola kunjungan, dan kewajaran biaya. Verifikator menerima label Lolos, Perlu scan ulang, Perlu klarifikasi, atau Prioritas, disertai area yang disorot, alasan temuan, dan berkas pembanding. Bila jumlah sesi tidak cocok, peserta dikonfirmasi lewat WhatsApp PANDAWA tanpa tautan, cukup membalas 1, 2, atau 3. Analitik data klaim hanya membaca kode dan biaya; Vedika Autentik membaca isi dan gambar berkasnya. Sistem tidak menolak klaim otomatis: keputusan tetap pada verifikator dan tercatat dalam jejak audit.","Pada uji buta 17 berkas sintetis, prototipe menangkap 3 dari 3 berkas kembar dan 3 dari 3 angka suntingan, tanpa satu pun berkas asli atau scan buram salah masuk Prioritas. Targetnya: Dana JKN menahan selisih tagihan sebelum dibayar; Mempermudah verifikator untuk mengecek dokumen yang sudah dimanipulasi; RS yang scan-nya buram diminta scan ulang, bukan dituduh curang; peserta bisa memastikan layanan atas namanya benar diterima. Berikutnya: pilot =500 berkas nyata di satu kantor cabang."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2488","tim":"BlueLion","inov":"TAPAL (Tariff Anomaly Probe Across Lines)","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pada 2025, 59% kasus kecurangan klaim JKN berupa manipulasi prosedur ventilator: ventilator ICU ditagihkan, padahal pasien hanya memakai nasal kanul atau masker oksigen. Klaim seperti ini sulit dikenali karena kodenya sah dan berkasnya lengkap. Insentifnya besar: satu kode ventilasi menaikkan tarif INA-CBG 3,6 sampai 6,4 kali, dan melewati 96 jam menambah Rp7,5 juta sampai Rp29,3 juta per kasus di RS kelas C. Kelengkapan berkas saja belum menjawab apakah pasien memang diventilasi.","Membantu verifikator BPJS Kesehatan menemukan rumah sakit yang tagihan ventilatornya jauh melebihi bukti di klaimnya sendiri, tanpa memerlukan label kecurangan. Keluarannya tiga: (1) daftar RS yang perlu diperiksa, dengan salah tuduh yang dikendalikan; (2) perkiraan rupiah berlebih per RS beserta rentangnya; (3) klaim yang perlu dibuka lebih dulu, beserta alasannya. TAPAL memberi sinyal untuk diaudit; keputusan tetap pada manusia.","TAPAL (Tariff Anomaly Probe Across Lines) bekerja di garis tarif INA-CBG, yaitu titik ketika satu kode atau satu jam membuat tarif melonjak. Mesin AI 1 (gradient boosting) menebak dari bukti lain di klaim (profil pasien, kode intubasi, lama ICU, biaya per hari) seberapa wajar sebuah klaim berkode ventilator; tiap RS dinilai oleh model yang dilatih dari RS lain. Jumlah yang diakui lalu dibandingkan dengan yang wajar per RS, diuji secara statistik dengan garis plasebo, dan dikalikan selisih tarif menjadi rupiah. Kematangan: prototype pada data sintetis dengan tarif asli Permenkes 3/2023. Pada uji buta, 7 dari 8 target yang ditulis sebelum uji tercapai: tidak ada RS jujur biasa yang salah tuduh (0 dari 100), dan pilihan AI 9,6 kali lebih tepat daripada aturan sederhana. Satu target tidak tercapai: RS pelaku ventilasi diperpanjang yang tertangkap hanya 3 dari 9. Dua mesin AI berikutnya masih rancangan: pembaca bukti rekam medis dan pemilih sampel audit.","Verifikator memulai dari segelintir RS dan klaim teratas, bukan dari puluhan ribu klaim. Pada uji buta dengan data sintetis (120 RS, sekitar 91 ribu klaim ICU, 18 RS pelaku): TAPAL menandai 6 RS pelaku, aturan sederhana 2; tidak ada RS jujur biasa yang salah tuduh; 42 dari 50 klaim ventilasi fiktif teratas memang palsu; RS yang ditandai memegang Rp10,4 miliar dari Rp26,3 miliar yang ditanam (39%). Besarnya di JKN baru diketahui dari pilot: presisi hasil audit dan rupiah terkonfirmasi."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Djaka Santosa","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2491","tim":"Binarylabs ID","inov":"CFGE: Cross-Sector Fraud Graph Engine","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Beban klaim JKN 2023 mencapai Rp158,8 Triliun. Merujuk standar NHCAA (3%), potensi kebocoran akibat fraud mencapai Rp4,7 Triliun/tahun. Kasus 3.269 klaim fiktif pada Juli 2024 membuktikan bahwa fraud dilakukan secara komplotan. Sistem deteksi konvensional berbasis tabel kaku gagal melihat relasi antar entitas (pasien, dokter, faskes), sehingga verifikator kesulitan melacak pola sindikat. Diperlukan pendekatan analitik berbasis relasi untuk mencegah kebocoran DJS di fasilitas kesehatan.","Mengembangkan Cross-Sector Fraud Graph Engine (CFGE), sebuah sistem mockup deteksi fraud yang mengubah paradigma \"analisis baris\" menjadi \"pemetaan relasi\". Tujuannya adalah memetakan jaringan anomali klaim, menyajikan \"Paket Bukti\" visual kepada verifikator medis, dan mengamankan dana dengan potensi cost avoidance Rp4,7 Triliun/tahun. CFGE berpegang pada prinsip Human-in-the-loop: AI hanya menyajikan indikasi relasional, namun keputusan mutlak tetap berada di tangan ahli medis.","CFGE adalah solusi Mockup Konseptual yang memadukan Rule Engine (Drools) untuk kepatuhan regulasi dan Graph AI (Neo4j) untuk pemetaan relasi matematika. MVP ini menargetkan 4 kuadran anomali: Phantom Billing, Repeat Billing & Cloning, serta Upcoding & Manipulasi Diagnosis. Alur kerjanya berurutan: Data klaim masuk, Rule Engine mendeteksi anomali hukum, Graph AI menghubungkan entitas terindikasi komplotan, lalu merangkumnya menjadi \"Paket Bukti\".\n\nDilengkapi \"Sabuk Pengaman Klinis\", sistem murni menyajikan anomali relasi administratif tanpa memvonis fraud secara medis. Validasi akhir dilakukan verifikator manusia. Arsitektur dibangun tangguh dengan Spring Boot dan Apache Kafka untuk menahan antrean data besar. Patuh pada UU PDP (Zero Data Leakage), CFGE didesain untuk deployment 100% On-Premise. Saat ini, sistem menggunakan data sintetis untuk mendemonstrasikan kapabilitas tanpa menyentuh data JKN aktual, menjadikannya inovasi yang cerdas, aman, dan etis secara hukum.","Dampak utama CFGE adalah pengamanan Dana Jaminan Sosial (DJS) dengan potensi cost avoidance mencapai Rp4,7 Triliun/tahun. Operasional verifikator menjadi lebih cepat melalui visualisasi \"Paket Bukti\" komplotan, menekan beban telaah manual dan false positive. Dengan tata kelola on-premise yang aman (Zero Data Leakage) dan keputusan akhir tetap di tangan ahli medis, CFGE menciptakan ekosistem pengawasan JKN yang tangguh, efisien, serta etis secara hukum."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Susi Lusiani","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2494","tim":"Suruhan Dosen","inov":"SMARTQUEUE BPJS: SISTEM OPTIMASI ANTREAN DAN TRIAGE RUJUKAN BERBASIS AI TERINTEGRASI MOBILE JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Rata-rata waktu tunggu pasien BPJS di poliklinik mencapai 86 menit, melampaui Standar Pelayanan Minimal (<60 menit). Penumpukan akibat antrean konvensional serta ketidaktepatan pemilihan poliklinik (self-referral) memicu inefisiensi operasional faskes. Keterlambatan penanganan medis ini berisiko memperburuk kondisi kesehatan pasien, hingga berujung pada rawat inap yang tidak perlu (prolonged stay) serta kunjungan berulang (readmisi) yang membebani operasional dan dana JKN.","Mengembangkan sistem antrean prediktif dan triase rujukan berbasis AI guna menyelaraskan alur pelayanan rawat jalan. Sistem ini bertujuan memetakan urgensi medis dan rekomendasi poli secara akurat (Rujukan & Self-referral), meratakan waktu kedatangan pasien untuk mereduksi waktu tunggu fisik hingga 40%, serta mencegah perburukan kondisi kesehatan peserta JKN yang berpotensi memicu timbulnya prolonged stay dan readmisi di fasilitas kesehatan.","SmartQueue BPJS merupakan sistem antrean dinamis dan triase rujukan cerdas berbasis Artificial Intelligence yang terintegrasi dengan ekosistem Mobile JKN. Inovasi ini mengombinasikan dua mesin utama: Engine Prediksi Waktu Tunggu menggunakan algoritma XGBoost/Random Forest untuk mengestimasi jam panggil secara presisi berbasis kondisi faskes, serta Engine Triase Mandiri berbasis Natural Language Processing (NLP) untuk menganalisis keluhan tekstual awal pasien guna merekomendasikan tingkat kegawatan dan poliklinik rujukan yang tepat (Rujukan & Self-referral).\n\nSistem menghadirkan sinergi dua antarmuka: aplikasi Mobile JKN bagi pasien untuk memantau antrean real-time dan rekomendasi jam hadir, serta Web Dashboard faskes sebagai alat bantu keputusan (Clinical Decision Support) petugas medis. Berprinsip Human-in-the-Loop, hasil triase AI wajib diverifikasi oleh tenaga kesehatan. Seluruh arsitektur terjamin aman dan patuh UU PDP melalui enkripsi serta anonimisasi data rekam medis.","Bagi pasien, sistem menghilangkan ketidakpastian, mereduksi waktu tunggu pasif hingga >50%, dan menjamin ketepatan poli rujukan sejak dari rumah. Bagi faskes, inovasi meratakan beban kerja dokter, mengurai bottleneck rawat jalan, serta mencegah prolonged stay akibat keterlambatan layanan. Bagi BPJS Kesehatan, ini meningkatkan kepuasan peserta dan mengoptimalkan efisiensi dana JKN dengan memitigasi klaim berulang (readmisi) serta rujukan yang tidak sesuai indikasi."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Yanuar Milad","s":null},{"n":"Juliana","s":null}]},{"id":"2495","tim":"Laskar Deadline","inov":"JALA: Deteksi Sindikat Fraud Klaim JKN Berbasis Graph Analytics dan Explainable ML","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Fraud di sektor kesehatan mengancam ketahanan fiskal dan akuntabilitas dana jaminan sosial. Kerugian negara akibat fraud kesehatan naik sepanjang 2021-2023 (Sam Tito & Siregar, 2024), dengan potensi kerugian 3% hingga 10% dari total dana atau hingga Rp7,9 triliun per tahun (Riswanti et al., 2026). Total indikasi fraud di tiga RS di Jawa Tengah dan Sumatera Utara mencapai Rp35,1 miliar. Pemeriksaan klaim diasumsikan per klaim secara terisolasi, sehingga kolusi antar-aktor sulit terdeteksi.","Mengembangkan JALA, sistem analitik berbasis graph analytics dan machine learning yang membantu auditor memprioritaskan pemeriksaan indikasi phantom billing, repeat billing, dan self-referral melalui hubungan antara faskes, dokter, peserta, diagnosis, dan rujukan. GNN/HAN adalah arsitektur target pengembangan berikutnya. Tujuannya menyediakan daftar prioritas pemeriksaan yang dapat dijelaskan, sehingga verifikator memeriksa kasus paling berisiko lebih dulu, tanpa menggantikan keputusan auditor.","JALA adalah sistem analitik tambahan yang membaca jaringan hubungan antar-aktor, bukan klaim satu per satu. Graph Modeler mengubah klaim dan entitas menjadi node dan edge, Analytics Engine menemukan klaster tidak biasa dengan Louvain, Risk Classifier (fitur graf dan gradient boosting) menghitung skor risiko, lalu Verifier Dashboard menampilkan prioritas, graf jaringan, dan alasan skor. JALA menandai klaim berulang untuk repeat billing, klaster klaim mencurigakan untuk phantom billing, dan rujukan terkonsentrasi untuk self-referral. Keputusan tetap di tangan auditor. GNN/HAN adalah arsitektur target. Prototipe lima layar diuji pada data sintetis (17.431 klaim, 60 faskes) dengan pola fraud yang ditanam. Hasilnya AUC 0,996 (aturan konvensional 0,551) dan 65% fraud tertangkap bila 500 klaim diperiksa (konvensional 12,5%). Hasil ini belum mewakili data JKN nyata dan perlu divalidasi lewat kalibrasi dan pilot. Pseudonimisasi identitas direncanakan pada tahap produksi.","JALA mengubah pemeriksaan per klaim menjadi pembacaan jaringan lintas aktor, sehingga verifikator dapat memeriksa klaster paling berisiko lebih dulu. Pendekatan ini diharapkan membantu mengurangi potensi kerugian fraud, menjaga dana jaminan sosial, dan memberi verifikasi lebih terarah bagi faskes yang patuh. Target pilot adalah precision >85% dan recall >80% dalam mode bayangan tanpa mengubah pembayaran. Saat ini JALA berada di Level 1 Indeks Pemdi dan disiapkan melalui empat tahap."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Septian Firmansyah","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2496","tim":"dari pangkal pinang ke toboali","inov":"JKN SENTRY - Multi Method Clinical Regulatory Claim Intelligence System","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Urgensi permasalahan tersebut tercermin dari temuan Kementerian Kesehatan pada tahun 2024 mengenai dugaan kecurangan klaim fisioterapi. Dari 4.341 klaim yang diperiksa, sebanyak 3.269 kasus diduga merupakan pelayanan fiktif, dengan nilai dugaan phantom billing mencapai Rp501,27 juta. Temuan tersebut menunjukkan pentingnya penguatan mekanisme identifikasi risiko berbasis bukti pelayanan.","JKN SENTRY diarahkan untuk membantu optimalisasi pekerjaan verifikator, meningkatkan kualitas identifikasi risiko, serta mendukung pengendalian pembiayaan JKN secara transparan dan akuntabel. Seluruh keputusan akhir tetap berada pada petugas berwenang melalui mekanisme human-in-the-loop.","JKN SENTRY — Multi-Method Clinical-Regulatory Claim Intelligence System merupakan inovasi aplikasi berbasis web yang dirancang untuk membantu identifikasi dan prioritisasi potensi risiko kecurangan klaim dalam penyelenggaraan Program Jaminan Kesehatan Nasional (JKN). Solusi ini berfokus pada kategori Efisiensi Risiko pada Fasilitas Kesehatan, khususnya modus upcoding, cloning, phantom billing, inflated bills, repeat billing, services unbundling/fragmentation, dan ketidaksesuaian episode pelayanan.\n\nKeunggulan utama JKN SENTRY terletak pada penerapan Method-to-Modus Router, yaitu mekanisme pemilihan metode analitik berdasarkan karakteristik risiko yang diperiksa. Berbeda dengan pendekatan yang hanya mengandalkan satu algoritma, sistem ini mengintegrasikan berbagai metode untuk menghasilkan analisis yang lebih kontekstual dan dapat dijelaskan.","Pengembangan JKN SENTRY diharapkan memberikan dampak terhadap peningkatan efisiensi, ketepatan, dan transparansi proses identifikasi risiko klaim dalam penyelenggaraan Program Jaminan Kesehatan Nasional (JKN). Melalui integrasi berbagai metode analitik, sistem berpotensi meningkatkan kemampuan menemukan ketidaksesuaian klaim yang tidak selalu dapat dikenali melalui pemeriksaan administratif maupun analisis statistik secara terpisah."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Susi Lusiani","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2497","tim":"hado90","inov":"SATUKLAIM: SISTEM VERIFIKASI BUKTI PELAYANAN BERBASIS AI UNTUK DETEKSI PHANTOM BILLING PADA KLAIM JK","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Phantom billing terjadi ketika layanan yang tidak diberikan tetap ditagihkan kepada JKN. Dokumen yang lengkap belum tentu membuktikan pelayanan berlangsung, sementara bukti yang tersebar atau terlambat dicatat menyulitkan pemeriksaan. SATUKLAIM diusulkan untuk menautkan klaim dengan bukti pelayanan lintas sumber, sehingga verifikator dapat membedakan kekurangan dokumentasi, kesalahan administrasi, dan indikasi yang memerlukan klarifikasi.","SATUKLAIM bertujuan mendukung deteksi indikasi phantom billing, mempercepat penelusuran bukti, dan meningkatkan keterlacakan keputusan verifikasi. Fokus awalnya adalah layanan fisioterapi. Sistem membantu petugas menilai kesesuaian klaim dan pelayanan serta mengidentifikasi penggunaan ulang bukti. Pengembangan dilakukan bertahap dengan tetap menjaga privasi peserta, kesempatan klarifikasi faskes, dan kelancaran klaim yang sah.","SATUKLAIM merupakan rancangan API dan dashboard yang menghubungkan klaim, episode pelayanan, catatan tindakan, asal dokumen, dan konfirmasi peserta sebagai bukti pendukung. Aturan terstruktur memeriksa konsistensi data, sedangkan AI semantik mencari kemiripan narasi. Hasilnya berupa antrean pemeriksaan dengan alasan dan sumber bukti. Keputusan tetap pada verifikator. Purwarupa direncanakan menggunakan sekitar 5.000 pengajuan sintetis; fokus utamanya phantom billing.","SATUKLAIM diharapkan meningkatkan ketepatan pemeriksaan dan efisiensi penelusuran bukti. BPJS Kesehatan memperoleh prioritas pemeriksaan yang lebih terarah, faskes mendapat jalur klarifikasi yang jelas, dan peserta terlindungi dari ketidakakuratan catatan layanan. Target awal adalah penurunan median waktu penelusuran sekurang-kurangnya 30% pada tugas setara. Target ini belum teruji; penghematan hanya dihitung dari pembayaran berlebih yang benar-benar dicegah atau dipulihkan."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2498","tim":"VAMIOS","inov":"SYNTHESIS-CLAIM: Deteksi Dini Phantom Billing dan Upcoding Berbasis AI dan Rekam Medis SATUSEHAT","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Audit bersama KPK, BPKP, dan Kemenkes (2024) menemukan kerugian Rp34–35 miliar dari tiga RS swasta, termasuk 4.341 tindakan fisioterapi ditagihkan padahal hanya 1.000 yang diberikan. KPK juga menemukan 48% dari 1,8 juta berkas anomali klaim terindikasi upcoding. Verifikasi saat ini hanya memeriksa kelengkapan administratif dan dilakukan pasca-bayar, sehingga dana sulit dipulihkan. Padahal RME SATUSEHAT berbasis HL7 FHIR kini menyediakan bukti klinis independen.","Membangun middleware AI yang mencegat klaim INA-CBGs sebelum dibayar dan mencocokkannya dengan rekam medis SATUSEHAT, untuk mendeteksi phantom billing dan upcoding secara real-time. Klaim bersih diproses otomatis, klaim anomali diteruskan ke verifikator medis dengan alasan yang dapat dijelaskan, sehingga kebocoran dana DJS dapat dicegah sebelum pencairan.","Sekarang klaim rumah sakit dinilai dari berkasnya, bukan dari bukti bahwa layanannya benar terjadi. Klaim fiktif atau diagnosis yang dinaikkan biasanya baru ketahuan berbulan-bulan setelah dana cair, dan uangnya sulit ditarik lagi. Di sisi lain, verifikator harus memeriksa berkas dalam jumlah sangat besar secara manual, jadi klaim yang jujur pun ikut antre.\n\nSYNTHESIS-CLAIM mengecek klaim dengan catatan medis di SATUSEHAT sebelum dibayar: pasiennya benar datang atau tidak, tindakannya benar dilakukan atau tidak, dan tingkat keparahannya didukung hasil pemeriksaan atau tidak. Klaim yang cocok jalan terus. Yang janggal diperiksa verifikator, yang tetap memegang keputusan akhir.","Verifikasi awal turun dari 10–14 hari kerja menjadi kurang dari 2 detik, dan verifikator fokus pada 5–8% berkas berisiko tinggi. Potensi penghematan DJS diperkirakan 15–25% dari kebocoran klaim FKRTL per tahun. Faskes jujur menerima pencairan lebih cepat, peserta JKN terlindungi dari riwayat penyakit fiktif, dan data morbiditas aktuaria menjadi lebih akurat."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2499","tim":"Cicik Mujianti; Rizkan Qadar","inov":"JAGA IBU – Pendamping Ibu Hamil dan Alat Bantu Pra-Screening Administratif Klaim Persalinan JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["JAGA IBU diusulkan pada kategori Efisiensi Risiko pada Fasilitas Kesehatan dengan fokus Phantom Billing dan Repeat Billing. Pengelolaan klaim persalinan JKN membutuhkan informasi yang lengkap, konsisten, dan dapat ditelusuri. Dari 1.036 klaim persalinan sesar, 12,07% berstatus pending, termasuk karena ketiadaan dokumen rujukan, ANC, dan duplikasi SEP (Zahra & Diansyah, 2026). Kondisi ini menunjukkan perlunya pra-screening administratif yang lebih terstruktur.","Merancang JAGA IBU sebagai pendamping bagi ibu hamil sekaligus alat bantu pra-screening administratif klaim persalinan JKN. Solusi ini membantu ibu memperoleh edukasi, pengingat, ringkasan layanan, dan ruang konfirmasi pengalaman; serta membantu petugas memprioritaskan kasus yang perlu ditinjau melalui pencocokan dokumen fasilitas dan konfirmasi ibu tanpa mengambil alih keputusan petugas.","JAGA IBU adalah konsep aplikasi dengan dua fungsi yang saling melengkapi. Bagi ibu hamil, aplikasi menyediakan edukasi sesuai usia kehamilan, pengingat jadwal, ringkasan kunjungan, serta konfirmasi layanan. Bagi petugas, JAGA IBU menggabungkan dokumen resmi dari fasilitas dan konfirmasi ibu dalam satu record kasus klaim persalinan. Sistem melakukan pencocokan berbasis aturan terhadap kelengkapan dokumen, konsistensi informasi, serta kemungkinan pencatatan ulang. Jika ditemukan kondisi yang perlu ditinjau, sistem menampilkan flag beserta alasan dan sumber informasinya untuk diprioritaskan kepada petugas BPJS Kesehatan sesuai dengan mekanisme yang berlaku.","JAGA IBU diharapkan dapat membuat peninjauan klaim persalinan lebih terarah, transparan, dan efisien. Dampak awal diukur melalui waktu pemeriksaan per kasus, ketepatan identifikasi kelengkapan dokumen, proporsi flag yang relevan, tingkat tanda keliru, kesesuaian antarpenelaah, serta pemahaman materi oleh ibu. Manfaat ini ditujukan bagi peserta JKN, fasilitas kesehatan, BPJS Kesehatan, serta Program JKN."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Yanuar Milad","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2502","tim":"SIGAP Santri","inov":"SIGAP SANTRI","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kehidupan berasrama membuat santri rentan tertular TBC, sementara gejala awal kerap diabaikan. Keterlambatan pemeriksaan dapat memperburuk kesehatan dan meningkatkan beban pembiayaan JKN.","Mendorong deteksi dini gejala TBC melalui skrining mingguan berbasis QR Code dan dashboard agar santri segera mendapat pemeriksaan tenaga kesehatan.","SIGAP SANTRI membantu pesantren memilah risiko TBC, memantau gejala per asrama, dan mempercepat rujukan ke fasilitas kesehatan melalui kolaborasi pengurus dan FKTP.","Santri berpeluang memperoleh penanganan lebih cepat, penularan dapat ditekan, dan pesantren lebih tanggap menjaga kesehatan bersama sekaligus mendukung efisiensi pembiayaan JKN."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Juliana","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2506","tim":"3 horas","inov":"PROPOSAL BIOGUARD HEALTHKATHON 2026 KELOMPOK 3","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Penyelenggaraan Program JKN dihadapkan pada tantangan kecurangan (fraud) kepesertaan, seperti peminjaman atau pemalsuan identitas di fasilitas kesehatan. Hal ini dapat memicu klaim fiktif dan kerugian keuangan negara. Oleh karena itu, diperlukan intervensi teknologi di titik awal pendaftaran.","Pengembangan BioGuard JKN bertujuan melindungi identitas peserta dari pemakaian tanpa izin, membantu petugas kesehatan mendeteksi ketidaksesuaian data lebih cepat, serta mencegah risiko pembayaran klaim yang tidak sah demi menjaga keberlanjutan program JKN.","BioGuard JKN (Smarter Biometric Fraud Detection for Identity Protection in JKN) adalah ekosistem AI biometrik wajah yang memadukan teknologi Face Recognition dan Passive Liveness Detection.\n\nSolusi ini diintegrasikan pada Kios Anjungan Pendaftaran Mandiri (APM) di FKRTL/rumah sakit. Sistem bekerja nir-sentuh dengan memindai wajah peserta saat registrasi, lalu membandingkannya secara otomatis dengan data referensi serta menilai tingkat risiko manipulasi (foto/video). Hasil pemeriksaan berfungsi sebagai alat bantu keputusan bagi petugas pendaftaran.","Penerapan solusi tersebut mempercepat waktu registrasi APM dari 3–5 menit menjadi kurang dari 30 detik. Pencegahan fraud terjadi secara otomatis di hulu sebelum pelayanan, sehingga hak peserta dan dana JKN terlindungi serta mewujudkan layanan kesehatan yang transparan dan akuntabel."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2512","tim":"harusnya sih agak janggal","inov":"Rekognis: Deteksi Preventif Kesesuaian Klinis Mitigasi Risiko Upcoding Faskes","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Upcoding merupakan risiko ketika diagnosis dan/atau tindakan medis dikodekan lebih kompleks daripada kondisi aktual sehingga meningkatkan nilai klaim JKN. Ketidaksesuaian ini dapat membebani proses verifikasi, mengurangi efisiensi dana, dan memengaruhi kualitas data klaim. Karena itu, diperlukan sistem yang mampu mendeteksi indikasi upcoding secara preventif sebelum klaim dibayarkan.","Mengembangkan Rekognis sebagai alat bantu verifikasi preventif yang mencocokkan kode diagnosis dan paket layanan dengan obat, pemeriksaan, serta tindakan medis. Sistem ini bertujuan menghasilkan risk flag yang explainable, membantu memprioritaskan pemeriksaan, mempercepat verifikasi, dan tetap menempatkan manusia sebagai pengambil keputusan akhir.","Rekognis adalah solusi verifikasi preventif untuk mendeteksi indikasi upcoding pada klaim JKN. Upcoding terjadi ketika diagnosis dan/atau tindakan medis dikodekan lebih kompleks daripada kondisi pasien yang sebenarnya sehingga meningkatkan nilai klaim. Sistem ini mencocokkan kode diagnosis dan paket layanan dengan obat, pemeriksaan, serta tindakan medis yang tercatat. Apabila ditemukan ketidaksesuaian, sistem menghasilkan risk flag beserta alasan dan tingkat risikonya untuk membantu verifikator memprioritaskan pemeriksaan sebelum klaim dibayarkan. Solusi ini tidak menetapkan fraud secara otomatis, melainkan mendukung keputusan manusia melalui mekanisme human-in-the-loop. Pengembangan awal menggunakan data sintetis atau anonim dengan memperhatikan prinsip perlindungan data pribadi, pencegahan bias, dan kepatuhan terhadap UU No. 27 Tahun 2022 tentang Pelindungan Data Pribadi. Faskes Risk Radar diharapkan meningkatkan efisiensi, akurasi, dan transparansi proses verifikasi klaim JKN.","Rekognis diharapkan mempercepat proses screening klaim, meningkatkan ketepatan identifikasi indikasi upcoding, dan membantu verifikator memprioritaskan pemeriksaan sebelum pembayaran. Solusi ini juga mendukung efisiensi dana JKN, meningkatkan kualitas data klaim, serta memperkuat transparansi dan akuntabilitas tanpa menggantikan keputusan manusia."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2519","tim":"Para Pencari Credit LLM Gratis","inov":"TITEN: Analisis Lintas Klaim untuk Prioritas Pemeriksaan Klaim JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim JKN yang terlihat wajar secara individual dapat menunjukkan pola risiko ketika dibandingkan dengan klaim lain. Contohnya, tagihan berulang, kemiripan atribut antarklaim, atau rawat inap kembali yang berpotensi masih terkait episode perawatan yang sama. Banyaknya peserta dan fasilitas kesehatan membuat pemeriksaan hubungan ini semakin kompleks. Verifikator perlu mencari klaim terkait dan mengumpulkan konteks dari data yang terpisah. Titen mengatasi kesulitan tersebut dengan menyusun hubunga","Titen bertujuan membantu verifikator menemukan dan memprioritaskan klaim yang perlu diperiksa lebih lanjut. Sistem menghubungkan klaim terkait, membandingkan atributnya, serta menjelaskan alasan suatu kasus masuk antrean pemeriksaan. Tujuannya adalah mengurangi waktu pencarian dan memberi konteks yang cukup untuk menilai pola risiko. Titen melengkapi proses verifikasi dan audit yang sudah berjalan. Keputusan akhir tetap berada pada verifikator.","Titen adalah sistem analisis lintas klaim dengan lima komponen: ringkasan atribut inti klaim atau fingerprint, grafik hubungan antarklaim, analisis pola risiko, paket bukti, dan antrean pemeriksaan berdasarkan prioritas. Sistem memvalidasi data, mencari pasangan klaim berdasarkan waktu dan atribut, lalu menilai kemiripan serta menyusun alasan pemeriksaan. Fokusnya mencakup potensi tagihan berulang, kemiripan atribut terstruktur, dan rawat inap kembali dalam episode yang sama. Prototipe telah menjalankan alur analisis menggunakan 50.000 klaim sintetis tanpa identitas atau rekam medis nyata. Tahap berikutnya mencakup pemetaan data dan alur kerja, kalibrasi ambang penilaian, serta pengujian bersama pengguna. Integrasi dengan sistem BPJS dan validasi pada data produksi belum dilakukan.","Titen diharapkan mempercepat pencarian klaim terkait, mengurangi waktu penelaahan bukti, dan membantu verifikator memusatkan pemeriksaan pada kasus yang paling relevan. Setiap rekomendasi disertai alasan agar verifikator dapat menilai dan menolak temuan yang tidak sesuai. Dampaknya akan diukur melalui waktu pencarian, waktu pemeriksaan, ketepatan prioritas, serta pengurangan antrean dengan tetap menjaga cakupan temuan. Hasil prototipe masih terbatas pada data sintetis. Manfaat operasional perlu"],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2521","tim":"InotekMauSehat","inov":"ORCHESTRA-JKN: Multi-Agent AI untuk Mitigasi Risiko Fraud Klaim Faskes","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Lonjakan volume klaim JKN menciptakan celah fraud tersembunyi pada fasilitas kesehatan, khususnya Phantom Billing dan Self-Referral berjejaring. Audit manual terbatas kapasitas dan audit rule-based konvensional memicu tingginya false positive yang membebani verifikator serta hubungan kemitraan faskes. Diperlukan solusi cerdas yang mampu memetakan anomali transaksi dan jejaring kolusif secara otomatis tanpa melanggar privasi data pasien JKN.","1. Mengembangkan framework Multi-Agent AI terorkestrasi untuk mendeteksi klaim fiktif dan pola rujukan semu secara simultan.\n2. Menekan angka false alarm audit melalui mekanisme Adversarial Critique berbasis aturan klinis terverifikasi (RAG).\n3. Menyediakan antarmuka Explainable AI (XAI) dalam bahasa Indonesia guna mempercepat pengambilan keputusan audit oleh verifikator BPJS dalam skema Human-in-the-Loop.","ORCHESTRA-JKN adalah sistem deteksi risiko klaim terorkestrasi berbasis Multi-Agent AI yang membagi tugas audit ke dalam 3 agen terspesialisasi:\n\n1. Agent 1 (Pattern Detector): Menggunakan Isolation Forest untuk mengisolasi anomali volume tindakan dan obat non-standar terhadap peer-group faskes.\n\n2. Agent 2 (Network Detector): Memanfaatkan pemodelan graf (NetworkX/GNN) untuk menganalisis sentralitas rujukan abnormal antara dokter dan faskes rujukan.\n\n3. Agent 3 (Judge & Explainer): Mengintegrasikan LLM dan RAG pedoman medis/INA-CBGs untuk melakukan adversarial critique (menguji pembenaran klinis sebelum vonis), menghitung Risk Score gabungan, serta menyusun narasi Explainable AI transparan bagi verifikator BPJS. Sistem dirancang 100% mematuhi UU PDP dengan pelatihan berbasis data sintetis beranotasi klinis, bekerja secara paralel dan asinkron untuk menjamin skalabilitas integrasi dengan sistem V-Claim/P-Care BPJS Kesehatan.","Efisiensi Operasional: Memangkas waktu tinjauan berkas klaim risiko tinggi hingga 70% melalui ringkasan bukti XAI dan antrean prioritas.\nReduksi False Alarm: Menurunkan salah tuduh audit hingga 40% berkat validasi hipotesis klinis tandingan.\nProteksi Dana JKN: Mencegah kebocoran anggaran sistemik (silent drain) akibat akumulasi klaim fiktif dan rujukan kolusif.\nKepatuhan Hukum: Menjamin nol risiko kebocoran privasi peserta melalui pendekatan data sintetis dan prinsip Human-in-the-Loop."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2523","tim":"Satu","inov":"Proposal Healthkathon NADI - Alif Rahman","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Setiap tahun diperkirakan terdapat ±141 juta klaim rumah sakit yang masuk ke BPJS Kesehatan, sehingga verifikator tidak mungkin memeriksanya satu per satu. Di sisi lain, belum tersedia petunjuk klaim mana yang paling perlu diperiksa lebih dulu. Padahal, median tarif rawat inap naik 50-60% setiap naik satu severity level, sehingga upcoding berisiko membebani dana JKN. Data klaim juga tidak memuat label fraud, sehingga diperlukan pendekatan yang dapat belajar dari pola klaim yang wajar.","Proposal ini bertujuan menyediakan sistem pendukung keputusan bagi verifikator BPJS Kesehatan. Secara khusus, tujuannya adalah (1) mengurutkan klaim berdasarkan prioritas pemeriksaan, sehingga klaim yang tidak wajar diperiksa lebih dulu; (2) memberikan alasan yang mudah dipahami untuk setiap klaim; dan (3) mengenali upcoding, pemecahan episode, dan repeat billing tanpa memerlukan label fraud. Keputusan akhir tetap berada di tangan verifikator.","SmartGuard JKN adalah aplikasi web yang ditenagai NADI, language model yang di-training dari nol khusus pada klaim JKN. Riwayat klaim peserta diperlakukan seperti kalimat: setiap klaim diubah menjadi 12 token, lalu model menebak isi klaim berikutnya. Jika tagihan rumah sakit jauh dari tebakan tersebut, klaim itu menjadi prioritas pemeriksaan dan disertai penjelasan dalam kalimat biasa. Pola yang sudah pasti, seperti pemecahan episode dan repeat billing, ditangani rule-based check. NADI memiliki 4 juta parameter dan telah dijalankan pada 1,7 juta klaim Data Sampel BPJS Kesehatan 2025. Pada test set berisi 171.510 klaim dari peserta yang tidak ikut training, NADI menebak severity dengan benar pada 96,2% klaim (baseline 84,1%) dan menangkap 96% upcoding simulasi di 5% klaim pertama yang diperiksa. Sistem berjalan di server sendiri tanpa API eksternal, memerlukan sekitar 25 ms per klaim, dan siap terhubung ke SATUSEHAT melalui FHIR R4.","Dengan urutan prioritas, waktu verifikator terpakai untuk klaim yang paling perlu diperiksa: pada simulasi, 96% upcoding sudah tertangkap di 5% klaim pertama. Estimasi kasar menunjukkan selisih severity yang layak ditinjau setara ±Rp1,0 triliun per tahun; angka ini bukan temuan audit dan perlu diuji melalui pilot. Faskes memperoleh umpan balik coding yang dapat dijelaskan, dana JKN lebih terjaga bagi peserta, dan setiap keputusan verifikator tercatat dalam audit log."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2526","tim":"JNN","inov":"VERA: Penelusuran Integritas Bukti Pemeriksaan untuk Verifikasi JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Manipulasi hasil pemeriksaan untuk memenuhi persyaratan penagihan merupakan risiko bagi integritas JKN. Ketika sumber pemeriksaan, hasil resmi, riwayat koreksi, dan dokumen pendukung terpisah, penelusuran perbedaan dapat menyulitkan verifikator. VERA diusulkan untuk melengkapi kontrol yang sudah ada melalui pencocokan bukti dan klarifikasi terstruktur, dengan tetap membedakan koreksi sah dari perubahan yang perlu ditinjau.","Mengembangkan aplikasi web pendamping verifikator untuk menautkan bukti pemeriksaan, menemukan inkonsistensi pada observasi yang sama, dan membedakan koreksi sah dari perubahan yang memerlukan klarifikasi. VERA juga menyatakan ketika bukti belum cukup serta mencatat tindak lanjut. Evaluasi direncanakan memakai data sintetis dan pembanding manual; keputusan klinis, kelayakan klaim, dan penetapan fraud tetap pada pihak berwenang.","VERA (Verification & Examination Risk Agent) dirancang sebagai aplikasi web pendamping verifikator JKN untuk menautkan sumber pemeriksaan, hasil resmi beserta koreksinya, dan dokumen pendukung. Mesin aturan dirancang mencocokkan episode, order, spesimen, parameter, metode, satuan, nilai, dan versi sebelum membandingkan observasi yang sama. Keluaran berupa inkonsistensi, bukti belum cukup, atau konsisten pada pemeriksaan yang dilakukan, disertai referensi sumber dan jejak tindak lanjut. AI bersifat opsional untuk menyusun ringkasan yang harus sesuai bukti. Pengembangan awal difokuskan pada data sintetis melalui impor CSV/JSON. Integrasi SIMRS/LIS dan sistem klaim merupakan rencana lanjutan yang memerlukan akses resmi; penggunaan data riil juga bergantung pada izin dan telaah etik yang berlaku. VERA tidak memblokir layanan atau menetapkan fraud secara otomatis.","VERA diharapkan mempercepat penelusuran bukti, memperjelas riwayat koreksi, dan membuat klarifikasi serta keputusan verifikator lebih terlacak. Dampak akan diukur melalui waktu tinjauan, ketepatan temuan, tingkat flag salah pada kasus sah, dan waktu klarifikasi. Manfaat finansial hanya dihitung dari perubahan pembayaran yang sah dan terkonfirmasi setelah dikurangi biaya. Efisiensi tidak boleh dicapai dengan menghambat layanan pasien."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2527","tim":"sukasukiyaki","inov":"GUARDCLAIM: Solusi AI-Powered Fraud Flagging untuk Mendeteksi Anomali Klaim BPJS Kesehatan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Risiko kecurangan klaim dapat muncul dalam berbagai bentuk, mulai dari phantom billing, yaitu klaim atas pelayanan yang sebenarnya tidak terjadi, hingga inflated bills dan cloning. GuardClaim hadir merupakan solusi AI-powered fraud flagging yang mengubah data klaim menjadi sinyal risiko yang dapat ditindaklanjuti. Dengan mengombinasikan pemeriksaan berbasis aturan dan machine learning, GuardClaim dirancang untuk membantu mengidentifikasi indikasi anomali claim untuk membantu keputusan audit.","Mendeteksi klaim dengan anomali biaya.\nMengidentifikasi pola klaim atau provider yang menyimpang dari kelompok pembanding yang relevan.\nMemberikan skor risiko dan flagging agar auditor tahu klaim mana yang perlu diprioritaskan.","ClaimGuard AI adalah dashboard pendukung audit klaim asuransi kesehatan yang menggunakan analisis data dan machine learning untuk mengidentifikasi klaim dengan pola biaya atau karakteristik pelayanan yang tidak wajar, kemudian memprioritaskannya untuk diperiksa oleh auditor.","SEBELUM: Proses pemeriksaan konvensional\n• Klaim dengan pola biaya tidak wajar dapat terlewat jika pemeriksaan hanya mengandalkan aturan tertentu.\n•SESUDAH: Dengan GuardClaim\n• Klaim memperoleh skor anomali untuk membantu menentukan prioritas pemeriksaan.\n• Sistem menampilkan indikator biaya tidak wajar dan kemiripan klaim yang dapat ditelusuri auditor.\n•Auditor dapat memusatkan perhatian pada klaim yang lebih relevan untuk diperiksa."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2528","tim":"cobaDulu","inov":"SAMAR: Samarkan Identitas, Perluas Deteksi","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["BPJS Kesehatan memverifikasi sekitar 650.000 klaim per hari, dan sekitar 5% terindikasi fraud (±32.500 klaim). Modus seperti self-referral dan cloning hanya terlihat bila klaim dicocokkan lintas rumah sakit, padahal pencocokan itu membuat NIK dan nama pasien mengalir ke banyak komponen analitik. Kebocoran sekitar 279 juta data peserta pada 2021 menunjukkan risikonya. Integrasi RME-SATUSEHAT memperbesar kebutuhan data lintas faskes, sementara UU No. 27/2022 menuntut pelindungan data pribadi.","Memungkinkan deteksi fraud klaim JKN lintas fasilitas kesehatan tanpa membuka identitas pasien ke sistem analitik. Secara khusus: (1) mencocokkan klaim antar-RS memakai token, bukan NIK dan nama; (2) menjaga hasil deteksi tetap sama dengan sistem tanpa pelindung; (3) membatasi pembukaan identitas hanya oleh verifikator dengan alasan, kuota, dan audit; (4) dirancang selaras dengan prinsip UU PDP.","SAMAR adalah lapisan pseudonimisasi dinamis di antara sumber klaim dan layanan analitik. Data pribadi masuk sekali ke Privacy Service, lalu pseudonim dihitung dengan HMAC(kunci epoch, layanan | tujuan | subjek). Faskes tidak ikut dalam rumus, sehingga pasien yang sama menghasilkan token yang sama di rumah sakit mana pun, tetapi berbeda untuk tiap layanan dan tujuan, berotasi tiap 30 hari, dan dapat dicabut. Layanan Claim, Fraud, dan Notification hanya menerima token. Mesin deteksi memakai 7 detektor aturan yang dapat dijelaskan (self-referral, cloning, phantom billing, upcoding, unbundling, repeat billing, prolonged LOS) ditambah Isolation Forest tanpa label. Skor risiko 45 ke atas membuat kasus; verifikator yang memutuskan. Identitas hanya dapat dibuka verifikator dengan alasan minimal 20 karakter, kuota per jam, dan audit tanpa NIK. Prototype berjalan dengan 6 layanan dan 39 tes otomatis pada data sintetis.","Pada 387 klaim sintetis, hasil deteksi identik dengan dan tanpa SAMAR (387/387), paparan data pribadi ke layanan hilir turun dari 100% ke 0%, dan 22 dari 22 percobaan akses tidak sah ditolak. Biaya tambahan sekitar 3,8 ms per klaim (p95). Manfaat: privasi peserta terlindungi, jangkauan deteksi lintas faskes bertambah, dan jejak audit transparan. Dampak finansial belum diukur dan akan diukur pada pilot sandbox."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2529","tim":"BACA ATURAN PAKAI JIKA SAKIT BERLANJUT HUBUNGI DOKTER","inov":"SATPAM - Sistem Analitik Tarif dan Pemeriksaan Akurasi Medis","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim JKN 2025 mencapai ± Rp201 triliun, dan rasio klaim menembus\n  107,31% (Q3-2025) — di atas 100% sejak 2023. Defisit ini diperparah\n  kebocoran di sisi fasilitas kesehatan yang terdokumentasi: phantom\n  billing ± Rp34–35 miliar pada 3 RS (2024), potensi fraud 175.774 klaim\n  FKRTL ± Rp440 miliar (KPK, 2015), dan ± Rp866 miliar potensi fraud yang\n  berhasil dicegah (BPJS, 2023). Akar masalahnya bukan angka yang salah,\n  melainkan jarak antara yang ditulis dokter dan yang diklaim kodenya.\n  P","1. Mengotomatisasi pemeriksaan koherensi narasi klinis ? kode/tarif\n  klaim, per klaim dan sebelum pembayaran.\n  2. Menghasilkan dossier bukti berkutipan (span bukti + rujukan regulasi)\n   untuk memprioritaskan waktu verifikator.\n  3. Mengurangi beban verifikasi manual tanpa menggantikan keputusan\n  manusia (human-in-the-loop).\n  4. Mewujudkan efisiensi risiko dan integritas JKN — berbasis bukti,\n  bukan tuduhan.","SATPAM adalah lapisan decision-support di atas sistem yang sudah ada,\n  dibangun atas empat pilar: (1) ekstraksi entitas klinis dari resume\n  medis; (2) pemeriksaan koherensi dokumentasi & kepatuhan aturan koding\n  (deterministik); (3) rekonsiliasi kode ? grup ? tarif INA-CBG; (4)\n  dossier bukti yang dapat dijelaskan. Alur: masuk (catatan klinis,\n  ICD-10/ICD-9-CM, grup INA-CBG, tagihan) ? proses (ekstraksi LLM\n  skema-terbatas + rule engine deterministik + rekonsiliasi tarif) ?\n  keluar (dossier bukti) ? verifikator memutuskan. Kategori: Efisiensi\n  Risiko Fasilitas Kesehatan. Modus fokus: upcoding, unbundling, klaim\n  tanpa dokumentasi pendukung. Status: Prototype berfungsi (4 pilar,\n  termasuk pembeda) — dapat didemonstrasikan. Jangkar data: PMK 3/2023\n  (tarif JKN), SATUSEHAT ICD-10/ICD-9-CM; validasi metode pada\n  MIMIC-IV-Note; target produksi BPJS Data Sampel; demo memakai data\n  sintetis. Prinsip: sistem intent-agnostic — keluarannya indikator\n  faktual, bukan tuduhan; invar","- Peserta JKN — layanan tetap terjaga karena dana bocor tertahan.\n  - Faskes jujur — klaim yang didukung bukti tidak tertunda; tersedia\n  jalur hak jawab.\n  - BPJS Kesehatan — sinyal pra-bayar yang dapat dilacak untuk\n  memprioritaskan verifikator (VPK mencakup ±85% klaim secara manual).\n  - Sistem JKN — efisiensi risiko & integritas, selaras tema \"Detect\n  Smarter, Protect JKN\".\n  - Ukuran (jujur): target presisi = 0,85 pada temuan (diprioritaskan atas\n   recall); akurasi lapisan tarif berja"],"r":[{"n":"Juliana","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2533","tim":"Sentul Lab","inov":"KlaimSense: Deteksi Klaim Fiktif, Berulang, dan Tidak Wajar Berbasis Kapasitas Rumah Sakit","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pembayaran klaim JKN bertumpu pada pemeriksaan berkas, sehingga layanan yang tidak pernah diberikan bisa lolos selama berkasnya lengkap. Pemeriksaan tim gabungan KPK, Kemenkes, BPJS, dan BPKP menemukan 3 dari 6 rumah sakit diduga membuat klaim fiktif; 3.269 dari 4.341 tagihan fisioterapi (75,3%) tidak memiliki catatan medis. Kasus periode 2017-2018 itu baru terungkap pada 2024 lewat pemeriksaan manual, padahal rumah sakit mitra JKN berjumlah ribuan.","Menyediakan alat bantu bagi BPJS Kesehatan untuk mendeteksi klaim fiktif, klaim berulang, dan tagihan tidak wajar secara otomatis dan dapat dijelaskan. Setiap tagihan diuji dengan dua pertanyaan: mungkinkah layanan itu terjadi dengan kapasitas nyata rumah sakit (tenaga, mesin, tempat tidur), dan wajarkah tagihannya menurut aturan. Hasilnya berupa daftar prioritas pemeriksaan yang disertai bukti, sementara keputusan akhir tetap di tangan petugas.","KlaimSense bekerja dalam empat langkah. (1) Hitung: semua tagihan diperiksa otomatis terhadap kapasitas rumah sakit, pengulangan, harga acuan, masa penggantian alat, dan perbandingan dengan rumah sakit sejenis, memakai aturan tetap yang dapat dijelaskan (XAI). (2) Cek sensor: untuk layanan bermesin seperti cuci darah, sensor IoT dengan Edge AI mengenali apakah mesin dipakai terapi, siaga, atau mati; setiap pesan ditandatangani digital dan dirantai hash. (3) Rangkum: empat agen AI menyusun berkas bukti dan hanya mengutip pasal Permenkes resmi; setiap kutipan dicocokkan kata per kata (multi-agent dan RAG; pencarian aturan sudah berjalan, uji dengan model AI menyusul). (4) Putuskan: petugas BPJS memutuskan, dan setiap keputusan tercatat dalam rantai audit. Prototipe sudah berjalan pada data tiruan dan hasilnya dapat direproduksi: github.com/Sentul-Labs-ID/KlaimSense-Prototype","Pada data uji tersembunyi (data tiruan), prototipe mendeteksi 83 dari 86 kejadian kecurangan (96,5%) dan memasukkan 23 dari 28 periode rumah sakit bermasalah ke daftar periksa (82%), tanpa tuduhan keliru dari 26 periode yang diprioritaskan. Akurasi Edge AI 97,8%. Pemeriksaan bergeser dari sampel ke seluruh tagihan, dan kejanggalan terlihat saat periode klaim berjalan. Penerima manfaat: BPJS Kesehatan, rumah sakit jujur, dan pasien. Angka masih perlu diuji pada data asli."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2534","tim":"SEHATTO","inov":"JAGA-KLAIM Co-pilot verifikasi pra-klaim berbasis bukti untuk menjaga konsistensi klaim JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim JKN terus menjadi tekanan besar bagi pembiayaan: beban jaminan kesehatan mencapai Rp174,9 triliun pada 2024, dengan phantom billing dan manipulasi diagnosis sebagai modus terbesar. Kontrol paling matang (verifikasi BPJS dan audit) bekerja setelah klaim meninggalkan faskes, sehingga pemeriksaan sistematis kode terhadap bukti klinis pada titik coding masih menjadi celah. Akibatnya banyak berkas dikembalikan (pending), misalnya 35,44% berkas rawat inap di satu RS daerah pada 2021.","Mengembangkan JAGA-KLAIM, co-pilot verifikasi pra-klaim yang membantu koder dan verifikator internal faskes mendeteksi ketidaksesuaian antara kode INA-CBG dan bukti klinis/operasional digital sebelum klaim diajukan. Fokus awal pada vektor phantom billing, upcoding, dan unbundling, dengan bukti yang dapat ditelusuri, serta keputusan akhir tetap di tangan manusia.","JAGA-KLAIM aktif saat coding.submitted, yaitu setelah coding dan grouping INA-CBG selesai dan sebelum verifikator internal mengunci klaim. Agen AI menelusuri bukti (resume medis, log prosedur, pemberian obat, hasil lab) dan membandingkan expected dengan observed evidence. Respons berjenjang: T0 abstain, T1 informasi, T2 rekomendasi pemeriksaan tambahan, T3 flag untuk keputusan manusia. Sistem tidak menetapkan fraud, tidak menolak klaim, dan tidak mengubah kode tanpa persetujuan. Setiap temuan tercatat dalam audit trail dan diproses di dalam batas faskes.","Bagi koder dan verifikator: pemeriksaan lebih terarah dan keputusan lebih cepat. Bagi faskes: koreksi sebelum pengajuan, berpotensi mengurangi siklus pengembalian berkas dan beban kerja. Bagi sistem JKN: tata kelola klaim lebih terpercaya dan potensi kebocoran pembiayaan menurun. Seluruh manfaat merupakan hipotesis yang diuji lewat validasi dan pilot terbatas, dengan metrik seperti Precision of Flag dan Time to Verifier Decision."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Yanuar Milad","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2537","tim":"Mau makan coto","inov":"FKTP SIGHT: Sistem Inteligensi dan Geospasial untuk Healthcare Tracking","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Tekanan finansial dan potensi defisit JKN kian meningkat, dengan indikasi kecurangan (fraud) di FKTP mencapai miliaran rupiah. Di sisi lain, investigator BPJS Kesehatan kewalahan menghadapi volume data masif karena evaluasi masih mengandalkan sampel acak (random sampling). Mereka kekurangan waktu, bukan data. Oleh karena itu, diperlukan automasi cerdas untuk mendeteksi anomali klaim dan rujukan secara cepat, efisien, dan akurat agar pengawasan lebih terarah dengan memperhatikan kemananan data.","Inovasi FKTP SIGHT bertujuan menciptakan AI-Assistant pendukung keputusan bagi investigator guna mendeteksi kecurangan utilisasi layanan. Sistem ini mengubah metode audit acak menjadi berbasis prioritas (skor anomali), mengoptimalkan rute kunjungan lapangan, dan memberikan penjelasan anomali komprehensif. Tujuan akhirnya adalah memperkuat ketahanan Dana Jaminan Sosial (DJS) secara efisien tanpa mengorbankan privasi data peserta JKN.","FKTP Sight (Sistem Inteligensi dan Geospasial untuk Healthcare Tracking) adalah AI-assistant bagi investigator klaim FKTP yang mengubah data klaim dan rujukan menjadi daftar prioritas audit. Sistem terdiri atas empat modul: (1) AI Assistant, antarmuka bahasa alami berbasis LLM lokal untuk memanggil tabel, dashboard, dan peta tanpa mengarang angka; (2) Analytics Dashboard, yang menyajikan indikator utilisasi per 1.000 peserta, distribusi dan tren anomaly score; (3) Peta & Rujukan, yang memvisualisasikan sebaran FKTP, skor anomali, dan jaringan rujukan; serta (4) Anomaly Investigation, yang menjelaskan faktor penyumbang skor dan membandingkannya dengan FKTP sejenis. Lapisan analitik memadukan Isolation Forest, LOF/DBSCAN, expected utilization, fitur pengodean ICD-10, dan referral graph. Seluruh proses berjalan di server lokal dengan data terpseudonimisasi sesuai UU PDP, dan anomali hanya menjadi rekomendasi untuk diverifikasi manusia.","FKTP SIGHT mempercepat waktu analisis investigator, sehingga cakupan pengawasan FKTP berisiko meningkat tajam. Bagi BPJS, inovasi ini menekan kebocoran dana secara proaktif. Bagi FKTP, evaluasi menjadi objektif karena berbasis data banding. Pada akhirnya, integritas layanan JKN terjaga dan manfaat tersalurkan tepat sasaran bagi peserta."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2538","tim":"disuruh ikut","inov":"BPJS Check (Sistem Cek-Silang Klaim Berulang)","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Repeat billing adalah pengajuan ulang klaim untuk tindakan atau obat yang sudah dibayar BPJS, baik tidak sengaja (input ganda, kirim ulang) maupun sengaja. Data antar-RS tidak terhubung, pemeriksaan masih manual dan baru dilakukan setelah klaim dibayar, sehingga dana JKN bocor dan sulit ditarik kembali (pay and chase). Verifikator juga terbebani pemeriksaan manual yang sulit diskalakan.","Menghadirkan lapisan pengaman digital yang mendeteksi dan mencegah klaim ganda sebelum dana dibayarkan, sehingga pemeriksaan bergeser dari “sesudah bayar” menjadi “sebelum bayar”. Sistem mencocokkan klaim lintas-RS, memfokuskan verifikator hanya pada klaim bertanda, menjaga keputusan akhir di tangan petugas, dan melindungi data pasien lewat hashing dan minimisasi data.","BPJS-Check adalah fitur pendeteksi duplikasi klaim yang disisipkan lewat API/middleware di gerbang masuk data klaim, tanpa merombak aplikasi BPJS. Saat RS menginput klaim, sistem mencocokkannya dengan riwayat ber-ID ter-hash memakai lima aturan (R1-R5) dan skor risiko. Klaim mirip diberi label “Potensi Klaim Ganda” beserta alasannya di dashboard, lalu petugas menolak, meminta konfirmasi, atau meloloskan.","Mencegah kebocoran dana JKN sebelum ditransfer ke RS, menghemat waktu verifikator yang fokus pada klaim bermasalah, dan memberi efek jera lewat pemeriksaan lintas-RS yang konsisten. RS juga mendapat umpan balik dini. Keberhasilan diukur lewat rupiah klaim ganda tercegah, presisi, recall, dan waktu verifikasi. Masih tahap konsep, sehingga angka dampak baru ada setelah purwarupa dan pilot."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Djaka Santosa","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2541","tim":"So Far So Groot","inov":"Klaim-Shield: Verifier Decision Cockpit untuk Deteksi Fraud Klaim Faskes Berbasis Data RME","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Verifikator BPJS Kesehatan menghadapi ratusan ribu berkas klaim per hari dengan tenggat pembayaran maksimal 25 hari, sementara sekitar 5% klaim terindikasi fraud. Kasus klaim fiktif di tiga RS swasta senilai sekitar Rp35 miliar menunjukkan pola yang sulit terlihat per berkas. Pada 2026 klaim bergeser dari PDF scan ke data RME terstruktur, sehingga kewajaran klinis klaim kini dapat diperiksa mesin tanpa OCR. Verifikator membutuhkan prioritas, bukti, dan penjelasan yang cepat.","Membantu verifikator memutuskan Layak, Pending, atau Dispute dengan lebih cepat dan dapat dipertanggungjawabkan. Sistem memeriksa kewajaran klinis klaim dari data RME, memberi skor risiko, kategori fraud, dan potensi selisih rupiah, lalu menyusun antrean prioritas. Klaim tanpa sinyal janggal dapat disetujui massal dengan audit sampel acak, sehingga perhatian verifikator tertuju pada klaim yang paling layak diperiksa. Keputusan akhir tetap di tangan verifikator.","Klaim-Shield adalah sistem pendukung keputusan, bukan pengganti verifikator. Data RME (FHIR) dan klaim elektronik diproses ke tiga jalur: hijau (prioritas rendah), kuning (masalah data, Pending untuk perbaikan), dan merah (dugaan fraud beserta kategori, tingkat keyakinan, potensi selisih rupiah, dan bukti). Empat saksi independen memeriksa tiap klaim: klinis (Severity Gap: keparahan kode vs intensitas perawatan), episode (unbundling, repeat, readmisi), perilaku faskes (benchmark sebaya), dan integritas RME (klaim vs jejak layanan, kemiripan teks, graf). Model ringan (aturan, XGBoost, Isolation Forest) berjalan untuk semua klaim; komponen berat hanya untuk kandidat teratas. Antrean memakai probabilitas terkalibrasi x potensi rupiah x urgensi tenggat, dengan penjelasan SHAP dan tarif pembanding. Keputusan verifikator kembali sebagai umpan balik pelatihan. Prototipe memakai data sintetis. Rancangan lanjutan: model semantik kecil untuk penilaian sempit; kasus kompleks dieskalasikan.","Dampak diukur pada waktu periksa per berkas, ketepatan (precision@K, recall@K), nilai finansial (selisih tarif ditagih dan tarif pembanding pada flag terkonfirmasi), kapasitas verifikator, keadilan antar faskes, dan tata kelola. Hasil tahap prototipe adalah simulasi pada data sintetis; dampak nyata diukur lewat pilot shadow dengan data teranonimisasi. Sebagai skala, KPK memperkirakan kerugian fraud layanan kesehatan sekitar Rp20 triliun (estimasi, bukan kerugian terbukti)."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Djaka Santosa","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2542","tim":"Wak Abu Family","inov":"EFISIENSI RISIKO FASILITAS KESEHATAN MENGGUNAKAN CLAIMGUARD AI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["BPJS Kesehatan memproses jutaan klaim JKN tiap tahun, yang rentan anomali seperti phantom, repeat billing, dan cloning. Pemeriksaan manual saat ini lambat dan berisiko merugikan finansial program.\n\nUntuk itu, dikembangkan ClaimGuard AI sebagai asisten cerdas auditor, bukan pengganti. AI ini mendeteksi pola berisiko, memprioritaskan klaim mencurigakan, dan menyajikan ringkasan bukti yang transparan. ClaimGuard AI membuat investigasi lebih cepat, akurat, dan mengamankan dana JKN.","Tujuan utama ClaimGuard AI adalah menjadi asisten auditor BPJS Kesehatan dalam mengelola risiko klaim secara cepat, terarah, dan transparan. Fokus utamanya mencakup: memprioritaskan klaim berisiko, mendeteksi pola anomali tersembunyi, memberi penjelasan analitik yang jelas, serta mempercepat investigasi.\n\nKeputusan mutlak dipastikan tetap di tangan manusia (human-in-the-loop). Selain itu, sistem ini menjamin keamanan privasi data dan dirancang fleksibel untuk pengembangan di masa depan.","ClaimGuard AI adalah asisten cerdas bagi petugas BPJS Kesehatan untuk memprioritaskan klaim anomali seperti phantom, repeat billing, dan cloning. Sistem bekerja lewat tiga tahap: penentuan skor risiko, analisis pola hubungan data, dan penyusunan ringkasan investigasi otomatis.\n\nDilengkapi 4 dashboard interaktif (Command Center, Audit Queue, Pattern Graph, Copilot), sistem ini menjamin keamanan privasi data anonim dan memastikan keputusan mutlak tetap di tangan manusia.","Penerapan ClaimGuard AI memberikan dampak positif menyeluruh bagi tata kelola JKN. Sistem ini meningkatkan efisiensi audit, ketepatan prioritas, dan mempercepat investigasi tanpa menuduh fasilitas kesehatan secara otomatis.\n\nSelain mencegah kerugian finansial dan menjaga keberlanjutan dana kesehatan, ClaimGuard AI meningkatkan transparansi serta kepercayaan publik. Melalui evaluasi berkelanjutan dari petugas, AI belajar menjadi lebih akurat, membuktikan teknologi hadir membantu manusia."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Juliana","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2546","tim":"NPD-ers","inov":"JEJAKLAIM","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Latar belakang\nPhantom billing adalah penagihan atas layanan kesehatan yang tidak pernah diberikan. Verifikasi menjadi sulit ketika data klaim, kunjungan, sesi tindakan, pembatalan, dan dokumentasi layanan tersebar atau belum lengkap. Tagihan saja tidak cukup membuktikan pelaksanaan layanan, sedangkan catatan yang hilang atau terlambat belum tentu menunjukkan fraud. Karena itu, diperlukan penelusuran bukti yang membantu verifikator menilai konsistensi klaim secara terstruktur.","Tujuan\nJEJAKLAIM bertujuan membantu verifikator klaim dan tim pemeriksa internal mencocokkan layanan yang ditagihkan dengan bukti pelaksanaannya. Solusi ini dirancang untuk membedakan bukti konsisten, data belum cukup, dan kasus yang perlu ditelaah; menyajikan alasan prioritas pemeriksaan; serta mencatat klarifikasi dan keputusan. Ketepatan penandaan dan waktu telaah akan diuji, dengan keputusan akhir tetap pada pemeriksa manusia.","Deskripsi\nJEJAKLAIM merupakan rancangan aplikasi web pendukung verifikasi Phantom Billing. Sistem menghubungkan data klaim dengan kunjungan, sesi layanan, waktu pelaksanaan, status pembatalan, serta bukti dan versi catatan melalui identitas kunjungan atau sesi. Alurnya meliputi impor data, pemeriksaan kelengkapan dan keterkinian, pencocokan identitas, pemeriksaan konsistensi berbasis aturan, penentuan status dan prioritas, telaah serta klarifikasi, hingga pencatatan keputusan dan riwayat. Hasilnya berupa tiga status: Bukti konsisten, Data belum cukup, dan Perlu telaah, disertai alasan serta bukti terkait. Catatan yang hilang atau terlambat tidak otomatis dianggap fraud; bukti konsisten juga bukan jaminan layanan benar-benar terjadi. Prototipe awal menggunakan data sintetis dengan contoh satu sesi hemodialisis, tanpa mengasumsikan integrasi langsung dengan BPJS atau rumah sakit. Keputusan akhir berada pada pemeriksa manusia.","Dampak\nJEJAKLAIM diharapkan membantu verifikator menelusuri bukti dan alasan pemeriksaan, serta membantu fasilitas kesehatan menyampaikan klarifikasi secara terstruktur. Pemisahan data belum cukup dari bukti yang bertentangan ditujukan untuk mengurangi risiko klaim sah keliru ditandai. Pencatatan keputusan dan riwayat diharapkan meningkatkan transparansi pemeriksaan klaim. Manfaat operasional masih perlu diuji; penandaan klaim tidak otomatis berarti fraud atau penghematan biaya."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Susi Lusiani","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2549","tim":"Solid Kesehatan","inov":"Sistem Pendukung Keputusan Berbasis Dynamic Skyline Query untuk Prioritisasi Risiko Pendaftaran Peke","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pendaftaran pekerja yang belum lengkap dalam Program JKN berpotensi menimbulkan kesenjangan perlindungan dan menyulitkan pengawasan kepatuhan pemberi kerja. BPJS Kesehatan memerlukan prioritas verifikasi berdasarkan berbagai indikator risiko. SkyRisk-JKN mengusulkan sistem pendukung keputusan berbasis Dynamic Skyline Query untuk memilih kandidat prioritas secara adaptif dan transparan, disertai alasan yang dapat ditelusuri. Verifikasi dan keputusan akhir tetap dilakukan oleh petugas.","Tujuan proposal ini adalah mengembangkan SkyRisk-JKN berbasis Dynamic Skyline Query untuk membantu BPJS Kesehatan memprioritaskan verifikasi pemberi kerja yang berpotensi belum mendaftarkan seluruh pekerjanya. Sistem membentuk profil risiko multikriteria, menyesuaikan kandidat dengan fokus pemeriksaan, dan menyediakan alasan pemilihan yang dapat ditelusuri. Prototipe diuji secara bertahap untuk menilai fungsi, keterjelasan hasil, dan kemudahan penggunaan, dengan keputusan akhir tetap pada petuga","SkyRisk-JKN adalah rancangan sistem pendukung keputusan berbasis Dynamic Skyline Query untuk memprioritaskan verifikasi pemberi kerja yang berpotensi belum mendaftarkan seluruh pekerjanya dalam Program JKN. Sistem mengolah data badan usaha, kepesertaan, mutasi pekerja, dan iuran menjadi profil risiko multikriteria, meliputi proksi kesenjangan kepesertaan, ketidaksesuaian pertumbuhan, anomali mutasi, inkonsistensi iuran, dan potensi dampak. Algoritma memilih kandidat yang tidak didominasi kandidat lain sesuai preferensi pemeriksaan. Dashboard menyajikan kandidat, profil risiko, dan kode alasan yang dapat ditelusuri. Pengembangan dilakukan dari mockup menuju prototipe menggunakan data sintetis atau teranonimisasi, disertai pengujian fungsi, kualitas seleksi, dan kemudahan penggunaan. Data riil digunakan setelah mendapat otorisasi. Verifikasi dan keputusan akhir tetap dilakukan petugas BPJS Kesehatan.","SkyRisk-JKN diharapkan membantu BPJS Kesehatan memprioritaskan verifikasi pemberi kerja secara lebih terarah, transparan, dan efisien. Profil risiko dan alasan pemilihan mendukung petugas menentukan tindak lanjut. Jika terbukti melalui pengujian dan pilot, sistem berpotensi mendukung kelengkapan kepesertaan pekerja, kepatuhan pemberi kerja, serta keberlanjutan penerimaan iuran JKN."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2558","tim":"diTim-Pux Tujuh Kali","inov":"diTim-Pux Tujuh Kali","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN membutuhkan verifikasi klaim akurat dan transparan. Salah satu risikonya adalah upcoding, yaitu penggunaan kode diagnosis atau tindakan yang tidak sesuai kondisi sebenarnya. JagaKlaim dirancang sebagai sistem pendukung berbasis AI dan XAI untuk mengidentifikasi klaim berisiko menampilkan skor risiko, serta membantu menentukan prioritas pemeriksaan. Hasil analisis menjadi informasi pendukung, sedangkan keputusan tetap berada pada verifikator dan tetap memperhatikan keamanan data.","Tujuan JagaKlaim adalah merancang sistem pendukung verifikasi klaim JKN berbasis AI dan XAI untuk mengidentifikasi potensi upcoding. Sistem menyajikan skor risiko, faktor penyebab, dan prioritas pemeriksaan agar verifikator meninjau klaim secara terarah. Proposal ini memetakan delapan indikator kematangan Pemerintah Digital, mengidentifikasi bukti dukung dan kesenjangan, serta menyusun arah pengembangan dengan memperhatikan keamanan data, transparansi, dan keputusan akhir manusia yang akuntabel.","JagaKlaim (JKN Claim Intelligence) merupakan rancangan sistem pendukung verifikasi klaim JKN berbasis Artificial Intelligence dan Explainable AI untuk mengidentifikasi potensi risiko manipulasi klaim dan upcoding. Dashboard menampilkan daftar klaim berisiko, skor risiko, faktor yang memengaruhi skor, serta prioritas pemeriksaan. XAI membantu verifikator memahami alasan klaim ditandai berisiko. Dengan pendekatan human-in-the-loop, AI memberi rekomenda
