u petugas menemukan pendaftaran pekerja sebagian dan pelaporan upah lebih rendah dari jejak layanan kesehatan, mengurutkan sasaran menurut taksiran iuran yang hilang, dan menyertakan batas salah periksa tertulis pada setiap daftar berjamin. Keputusan pemeriksaan dan sanksi tetap pada petugas.","SEPADAN adalah mesin seleksi pemeriksaan untuk kategori Efisiensi Risiko pada Pemberi Kerja. Mesin membaca data milik BPJS Kesehatan (kepesertaan, e-Dabu, PCare, VClaim) tanpa kode diagnosis, lalu menandai dua pola utama: orang yang faskes pertamanya klinik perusahaan atau pernah bekerja di sana tetapi tidak terdaftar sebagai pekerjanya, dan perusahaan yang porsi upah tepat di UMK jauh di atas perusahaan sejenis. Sinyal itu digabung oleh trained score (gradient boosting), lalu conformal p-value dan Benjamini-Hochberg menentukan daftar per kelompok ukuran perusahaan dengan batas salah periksa tertulis. Bila data pembanding belum cukup, mesin menolak memberi jaminan dan menyatakannya. Hasilnya disajikan lewat API: daftar sasaran, alasan per perusahaan, dan taksiran iuran. Tingkat kematangan: prototype. Mesin dan API berjalan pada data sintetis, diuji di tujuh skenario dan dua simulator","Dalam simulasi data sintetis, hasil per pemeriksaan SEPADAN 4,1 kali pemilihan acak dan 1,8 kali memilih perusahaan terbesar, dibandingkan per kelompok ukuran. Model dampak memperkirakan tambahan iuran dengan median sekitar Rp27 miliar per tahun, bergantung pada ketepatan penargetan saat ini. Pekerja didaftarkan dengan upah yang benar, perusahaan patuh terlindung oleh batas salah periksa, dan APBN tidak menanggung PBI untuk pekerja formal. Semua angka estimasi."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2552","tim":"HEALTHNOVA","inov":"JKN EmployGuard","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2552_JKN_EMPLOYGUARD_AI_Compliance_for BPJS_revision final.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Keberlanjutan Program JKN membutuhkan kepatuhan badan usaha dalam mendaftarkan pekerja dan memenuhi kewajiban kepesertaan secara tepat. Namun, identifikasi potensi ketidakpatuhan masih menghadapi tantangan akibat besarnya dan beragamnya data badan usaha. JKN EmployGuard yang berbasis AI ini diusulkan sebagai solusi berbasis kecerdasan artifisial untuk mendeteksi risiko ketidakpatuhan secara dini, sehingga mendukung BPJS dalam pengawasan yang lebih proaktif, tepat sasaran, dan berbasis data.","Proposal ini bertujuan mengembangkan JKN EmployGuard sebagai sistem berbasis kecerdasan artifisial untuk membantu BPJS Kesehatan mengidentifikasi dan memprediksi risiko ketidakpatuhan badan usaha terhadap kewajiban kepesertaan JKN. Sistem diharapkan mampu menghasilkan pemetaan risiko secara lebih cepat dan akurat, mendukung pengawasan yang proaktif dan tepat sasaran, serta membantu meningkatkan kepatuhan badan usaha demi keberlanjutan Program JKN.","JKN EmployGuard merupakan solusi berbasis kecerdasan artifisial yang dirancang untuk membantu BPJS Kesehatan meningkatkan efektivitas pengawasan kepatuhan badan usaha dalam Program JKN. Sistem mengintegrasikan dan menganalisis data kepesertaan serta indikator terkait badan usaha untuk mengidentifikasi pola ketidakpatuhan dan menghasilkan skor risiko secara otomatis. Melalui pendekatan predictive analytics dan machine learning, badan usaha dapat dikelompokkan berdasarkan tingkat risiko sehingga BPJS Kesehatan dapat menentukan prioritas pengawasan dan tindak lanjut secara lebih cepat, objektif, dan tepat sasaran. Hasil analisis disajikan melalui dashboard yang informatif untuk mendukung pengambilan keputusan. Solusi ini diharapkan mampu mengubah pola pengawasan dari reaktif menjadi proaktif, meningkatkan efisiensi pemanfaatan sumber daya, mendorong kepatuhan badan usaha, serta mendukung perluasan perlindungan pekerja dan keberlanjutan Program JKN.","JKN EmployGuard diharapkan meningkatkan efektivitas pengawasan kepatuhan badan usaha melalui deteksi dini dan pemetaan risiko berbasis data. Solusi ini membantu BPJS Kesehatan memprioritaskan tindak lanjut secara lebih cepat dan tepat sasaran, mengoptimalkan sumber daya pengawasan, serta mendorong peningkatan kepatuhan badan usaha. Dampak akhirnya adalah perluasan perlindungan pekerja, peningkatan kepesertaan aktif, dan penguatan keberlanjutan Program JKN."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Djaka Santosa","s":null},{"n":"Juliana","s":null}]},{"id":"2568","tim":"SI-DANDANG","inov":"JAGA-KODE : Sistem Analitik dan Guardrail AI untuk Konsistensi Kode Diagnosis dan Tindakan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2568_TIM SI DANDANG JAGA KODE.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Verifikator BPJS Kesehatan harus meneliti ribuan klaim JKN setiap hari. Di tengah tingginya volume ini, risiko upcoding manipulasi diagnosis atau tindakan medis agar nilai klaim meningkat menjadi tantangan serius. Klaim upcoding sering tampak lengkap secara administratif, tetapi menyimpan ketidaksesuaian klinis pada kode, tindakan, dan lama rawat. Verifikasi manual tentu terbatas dan rentan melewatkan pola anomali. JAGA-KODE hadir sebagai AI Human-in-the-Loop untuk menyaring klaim berisiko.","Mengembangkan JAGA-KODE sebagai alat bantu verifikasi klaim JKN berbasis AI yang mengusung prinsip Human-in-the-Loop. Sistem ini bertujuan membantu verifikator mendeteksi dan memprioritaskan indikasi upcoding secara presisi, menyajikan alasan pemicu risiko yang transparan melalui Explainable AI, serta mendukung BPJS Kesehatan dalam meningkatkan efisiensi operasional dan memitigasi risiko kebocoran dana tanpa melakukan penolakan klaim atau penetapan kecurangan secara otomatis.","JAGA-KODE adalah sistem guardrail AI hibrida untuk menilai konsistensi kode diagnosis dan tindakan klaim JKN pada subkategori upcoding. Solusi ini mengintegrasikan 5 komponen utama: Consistency Guardrail (aturan klinis), Anomaly Engine (Isolation Forest), Risk Fusion (prioritas risiko), Explanation Card (Explainable AI), serta Verification Workspace (dashboard antrean). Beroperasi sesuai UU PDP No. 27/2022 dengan memanfaatkan data sintetis pada tahap pengembangan prototype.","Penerapan JAGA-KODE memberikan dampak nyata bagi ekosistem JKN: \n1. Verifikator BPJS mendapatkan antrean pemeriksaan berbasis risiko yang terarah beserta alasan Explainable AI\n2. BPJS Kesehatan meningkatkan efisiensi verifikasi dan mencegah potensi kebocoran dana akibat upcoding. \n3. Faskes dan Peserta memperoleh transparansi pengodean yang adil demi menjaga keberlanjutan pembiayaan. Keberhasilan diukur secara terukur melalui metrik Precision@K dan Review Yield."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Yanuar Milad","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2622","tim":"Kimi No Nawa","inov":"Bambang - GARDA JKN (Natural Two Ways Communication AI Voice Agent)","kat":"Efisiensi Risiko pada Peserta JKN","f":"2622_Bambang GARDA JKN.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Bayangkan menelepon call center yang begitu natural hingga kita tak bisa membedakan apakah yang menjawab manusia atau mesin. Teknologi ini sudah nyata, tetapi belum dirasakan 284 juta peserta JKN, lebih dari 62% di antaranya peserta PBI. Mobile JKN memang kaya fitur, namun harus diunduh, login, dan serba teks, sehingga baru digunakan sekitar 4% peserta. Akibatnya, banyak peserta bingung harus ke mana dan layanan kurang tepat sasaran. Padahal, 90,8% pengguna internet Indonesia aktif di WhatsApp.","Menghadirkan Bambang, voice agent kesehatan JKN di WhatsApp yang melengkapi Mobile JKN, untuk: (1) membuka akses lewat percakapan alami, inklusif bagi lansia dan tunanetra; (2) mengarahkan peserta ke layanan tepat, yaitu perawatan mandiri, FKTP, atau 119/IGD; (3) mendampingi hingga pulih lewat follow-up; (4) mencegah penyakit dengan peringatan berbasis data cuaca; dan (5) meringankan beban call center agar agen fokus pada kasus kompleks.","Bambang adalah asisten kesehatan preventif JKN berbasis voice agent, cukup satu kontak WhatsApp dengan tombol Telepon dan Chat. Peserta bercerita dengan bahasa sehari-hari; suara diolah STT, dinalar LLM dengan RAG pengetahuan medis dan guardrails, lalu dijawab TTS yang natural. Ringkasan panggilan otomatis masuk ke chat. Tanda bahaya dideteksi aturan deterministik dan langsung diarahkan ke 119/IGD. Keluhan ringan dipandu perawatan mandiri, lalu Bambang menyapa esok pagi dan menyiapkan ringkasan untuk dokter FKTP bila tak membaik. Data cuaca satelit, tren kasus, dan lingkungan memetakan risiko DBD per kelurahan; peringatan hanya dikirim ke peserta berisiko. Bambang tidak mendiagnosis, hanya menyimpan ringkasan atas persetujuan peserta, dan memakai engine Mobile JKN untuk mempercepat layanan. Bambang selalu memperkenalkan diri sebagai asisten AI. Demo: bambang-jkn.netlify.app · Video: youtu.be/FPhGqcCqyqg","Jangkauan: hadir di WhatsApp yang dipakai 112 juta orang, jauh melampaui ±16 juta pengguna Mobile JKN, termasuk lansia dan tunanetra. Tepat sasaran: tiap 1% rujukan RS yang diarahkan tepat setara ±Rp1,7 triliun per tahun; triase telepon mengalihkan 60% penelepon ke perawatan non-darurat. Efisiensi: Gartner memproyeksikan 1 dari 10 interaksi call center diotomasi AI pada 2026. Preventif: wabah dicegah sebelum meluas memakai satelit. Faskes: pasien datang membawa ringkasan setelah telpon bambang."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2631","tim":"Kres.id","inov":"Indonesia Sehat Terpusat (SinyalJKN)","kat":"Efisiensi Risiko pada Peserta JKN","f":"2631_SinyalJKN_Proposal_Healthkathon2026_v2.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Berawal dari kondisi gawat usus buntu pasangan saya, alur birokrasi rujukan medis dan pencarian faskes terbukti lambat. Kendala ini sejalan dengan beban BPJS Kesehatan yang melayani 98% penduduk Indonesia. Skala layanan masif ini rentan memicu inefisiensi faskes, khususnya kecurangan \"Rujukan & Self-referral\" ke rumah sakit tertentu tanpa alasan keterbatasan medis yang sah.","Membangun SinyalJKN sebagai platform terintegrasi untuk memantau ketersediaan faskes dan status pasien secara real-time. Tujuannya adalah memangkas hambatan administratif penanganan darurat sekaligus mendeteksi dan memitigasi risiko rujukan tidak sesuai dalam pelayanan JKN. Inovasi digital ini dirancang untuk mendukung transformasi dan efisiensi ekosistem layanan BPJS Kesehatan. melakukan integrasi mulai dari dokter, pasien, apotek, rumah sakit, ambulan/driver, dan command center menjadi satu.","SinyalJKN adalah ekosistem terpadu yang menghubungkan mulai dari dokter, pasien, apotek, rumah sakit, ambulan/driver, dan command center menjadi satu ekosistem. Mengusung tema \"Detect Smarter, Protect JKN\", solusi ini secara spesifik mendeteksi dan mencegah kecurangan rujukan semu (self-referral), sampai dengan tindakan pelanggaran lainnya. mengingat project ini dibangun dalam satu ekosistem yang sama, sehingga semua akan tercatat dan direcord secara langsung. ketika terjadi sesuatu pada user, semua sensor akan di trigger dan akan di catat secara langsung. dengan demikian tidak akan ada celah tidak pelanggaran. serta pemanfaatan biomaterics dan multi autentikasi pada level user sehingga meminimalisir pelanggaran. bahkan mulai dari konsumsi obat, beli obat di apotek mana saja, rekam kesehatan, sampai dengan penanganan akan terpusat dan dimonitor secara real time, sehingga ketika terjadi hal yang anomali akan mentriger alert pada comman center.","Secara langsung, sistem ini mempercepat penanganan gawat darurat sehingga peserta JKN menerima layanan krusial tanpa hambatan birokrasi. Bagi BPJS Kesehatan, SinyalJKN memberi penghematan terukur dengan mencegah kebocoran dana akibat manipulasi sistem rujukan. Implementasi solusi ini akan memperkuat penyelenggaraan Program JKN menjadi lebih efisien, transparan, dan andal."],"r":[{"n":"Juliana","s":null},{"n":"Yanuar Milad","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2648","tim":"Belum ada sih","inov":"ClaimGuard JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2648_ClaimGuard JKN.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN melayani lebih dari 280 juta peserta, dengan pengeluaran biaya layanan Rp191,33 triliun pada 2025. Dengan volume klaim sebesar itu, kapasitas verifikator terbatas, sehingga tantangannya bukan hanya menemukan pola risiko, tetapi menentukan klaim mana yang ditelaah lebih dulu. Klaim yang tampak janggal belum tentu bermasalah, skor tanpa alasan sulit ditelusuri, dan data yang hilang tidak boleh dianggap aman","Membangun ClaimGuard JKN, sistem pendukung keputusan yang membantu verifikator menentukan klaim fasilitas kesehatan mana yang ditelaah lebih dulu. Sistem memberi Skor Prioritas yang dapat dijelaskan lewat bukti pendukung dan bukti peredam, menandai data yang tidak memadai alih-alih menganggapnya aman, dan menyerahkan keputusan kepada manusia dengan alasan tertulis dan log audit. Sasarannya telaah yang lebih terarah dengan kapasitas yang sama, tanpa menuduh fasilitas kesehatan","ClaimGuard JKN adalah prototype berfungsi untuk kategori Efisiensi Risiko Fasilitas Kesehatan. Empat detektor berbasis aturan dan statistik (repeat billing, cloning, inflated bills, prolonged stay) memeriksa tiap klaim, dibandingkan dengan kelompok pembanding, lalu menghasilkan Skor Prioritas 0–100, Level, Keyakinan Bukti, dan Kualitas Data. Bukti peredam, misalnya layanan terjadwal atau harga dalam ±10% peer, menurunkan skor. Data yang kurang menjadi \"Bukti tidak memadai\", bukan skor rendah. Skor adalah indeks urutan telaah, bukan probabilitas kecurangan. Verifikator membaca antrean prioritas, detail klaim, dan bukti, lalu memutuskan dengan alasan tertulis yang tercatat di log audit, dengan akses berbasis peran. Sistem bersifat deterministik, tanpa LLM. Prototype diuji internal pada 10.000 klaim sintetis per seed; belum memakai data JKN nyata dan belum operasional di BPJS Kesehatan","Pada benchmark sintetis (5 seed, kapasitas telaah 200 klaim), antrean ClaimGuard menjangkau 73% anomali sisipan, dibanding 17% untuk aturan sederhana terbaik dan sekitar 2% untuk telaah acak; pada gaya sisipan tahan-uji 56%. Kasus sah di 200 teratas 9,6%, di bawah batas 10%. Ini bukan kinerja di data JKN nyata. Dampak pada waktu telaah, relevansi prioritas, dan penghematan dana belum diukur dan akan diuji dalam uji terbatas bersama verifikator"],"r":[{"n":"Juliana","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2654","tim":"Team Kzkf","inov":"SELARAS Triangulasi Integritas Iuran JKN Berbasis AI","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2654_SELARAS_Pitch_Deck_Healthkathon_2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Keberlanjutan DJS Kesehatan bergantung pada kepatuhan iuran PPU Badan Usaha. Namun terjadi asymmetric information masif: perusahaan memotong gaji pekerja berdasarkan upah riil (misal Rp6 juta), namun melaporkan ke BPJS sebesar UMK (Rp3,5 juta). Celah ini menyebabkan kebocoran Rp125.000/pekerja/bulan. Rasio petugas Wasrik hanya 1:3.000 BU dengan hit-rate audit kurang dari 35%. Pekerja menjadi korban berganda: dipotong penuh namun manfaat jaminannya dirugikan akibat pelaporan fiktif.","SELARAS bertujuan: \n(1) Mendeteksi kecurangan iuran BU secara presisi melalui triangulasi otomatis 3 titik data yaitu slip gaji riil pekerja (VLM), billing BPJS, dan UMK wilayah.\n(2) Menyediakan kanal pelaporan anonim bagi pekerja yang aman dari intimidasi dan patuh UU PDP. \n(3) Mengoptimalkan antrean pemeriksaan harian petugas Wasrik menggunakan algoritma Greedy Knapsack berbasis kapasitas jam kerja, sehingga meningkatkan hit-rate audit dari 35% menjadi 84%.","SELARAS adalah sistem triangulasi end-to-end yang terdiri dari 3 layer: Layer 1 - Worker Participation (Bot Telegram + VLM Extraction < 30s, Zero Image Retention); Layer 2 - Hybrid Intelligence Core (Triangulasi Slip vs Billing vs UMK, Rule Engine + Isolation Forest, Risk Score 0-100); Layer 3 - Capacity-Aware Field Execution (Greedy Knapsack, 20% anti-bias). Tech stack: FastAPI, PostgreSQL, Docker, Streamlit. Status: Production-ready MVP, 40/40 tests passed.","Simulasi pada 1 KC Kelas Utama (2.000 BU PPU): produktivitas petugas naik +33% (18 ke 24 kunjungan/bulan), hit-rate audit melonjak dari 32% ke 84% (+252%), pemulihan iuran per KC naik dari Rp180 juta ke Rp620 juta/bulan. Proyeksi nasional 120 KC: potensi tambahan pemulihan sekitar Rp633 miliar/tahun. Penerima manfaat: BPJS Kesehatan (ruang fiskal DJS kuat), pekerja (hak upah terlindungi), dan pemberi kerja patuh (kepastian hukum adil, persaingan bisnis sehat)."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2674","tim":"Mencoba Ambis namun Tipes","inov":"ClaimGuard JKN: Sistem Deteksi Dini Fragmentasi Klaim JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2674_KlaimGuard JKN Sistem Deteksi Dini Fragmentasi Klaim JKN.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Fragmentasi pelayanan menjadi salah satu penyebab klaim pending JKN di fasilitas kesehatan. Studi kasus mencatat 882 klaim pending akibat fragmentasi di RS Citra Husada Jember (Desember 2024) dan 31 dari 444 klaim pending rawat jalan di RSUD Budhi Asih (2023). Angka tersebut bukan data nasional. Permasalahan dipicu perbedaan pemahaman awal episode, minimnya peringatan dini pada SIMRS, serta ketidakjelasan penerapan aturan fragmentasi secara operasional.","Membangun sistem pra-verifikasi klaim (ClaimGuard JKN) yang mendeteksi potensi pemecahan episode pelayanan sebelum klaim dikirim ke BPJS Kesehatan. Sistem memberi peringatan dini berbasis rule-engine kepada petugas casemix/klaim RS, lengkap dengan penjelasan alasan alert dan audit trail, sehingga deteksi bergeser dari reaktif (setelah klaim) menjadi preventif (sebelum pengiriman). Keputusan akhir tetap pada petugas.","ClaimGuard JKN adalah modul web/SIMRS yang memproses data kunjungan pasien secara anonim, mendeteksi pola pemecahan episode (default jarak =7 hari, dapat diatur; faskes & diagnosis sama), dan memberi label status Hijau/Kuning/Merah. Petugas memilih aksi seperti gabungkan klaim, beri catatan medis, kirim ke audit, atau lanjutkan. Output terdiri dari 3 dashboard + audit trail. Prototipe dalam pengembangan dengan data sintetis; data JKN riil tidak diakses tanpa izin resmi.","ClaimGuard JKN diharapkan dapat mengurangi risiko klaim pending akibat fragmentasi pelayanan melalui deteksi dini sebelum pengiriman klaim ke BPJS Kesehatan. Sistem membantu meningkatkan ketepatan verifikasi, efisiensi kerja petugas casemix, serta konsistensi penerapan aturan melalui peringatan otomatis dan audit trail. Selain itu, ClaimGuard JKN mendukung transparansi proses verifikasi, meminimalkan kesalahan administratif, dan meningkatkan kualitas pengelolaan klaim JKN tanpa menggantikan kepu"],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Susi Lusiani","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2697","tim":"Lumora","inov":"JKN PayShield","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2697_JKN PayShield Team Lumora.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Asas self-assessment pada e-Dabu BPJS Kesehatan memicu moral hazard pemberi kerja berupa under-reporting upah, penggelapan iuran, dan pendaftaran pekerja sebagian. Audit manual Wasrik saat ini hanya menjangkau <5% Badan Usaha per tahun akibat asimetri informasi dan ketakutan pekerja melapor. Hal ini berdampak pada kebocoran kas Dana Jaminan Sosial (DJS) hingga triliunan rupiah per tahun serta merugikan hak jaminan kesehatan pekerja.","Mengembangkan platform closed-loop continuous audit berbasis verifikasi bottom-up slip gaji pekerja untuk mendeteksi kecurangan pelaporan Badan Usaha secara real-time. Solusi ini bertujuan memangkas waktu penindakan audit, melindungi privasi pelapor 100% dari risiko intimidasi, menyelamatkan potensi kebocoran penerimaan kas DJS BPJS Kesehatan, dan menjamin hak jaminan sosial pekerja sesuai upah riil.","JKN PayShield adalah platform continuous audit closed-loop yang mengintegrasikan Pekerja, Auditor Wasrik, dan HRD melalui tiga portal utama berbasis arsitektur Turborepo Monorepo. Portal Pekerja (web-worker) memungkinkan pekerja mengunggah slip gaji secara anonim dengan proteksi privasi otomatis Client-Side Canvas Blur. Dashboard Wasrik (web-wasrik) dibekali 5-Stage OCR Pipeline dan Math Engine deterministik untuk kalkulasi akurat 100% tanpa halusinasi AI, serta dilengkapi JEV AI (Explainable AI Copilot) untuk merangkum indikasi risiko dan menyusun draf SP-1 secara otomatis. Draf SP-1 tersebut kemudian dikirimkan ke Portal Sanggahan HRD (web-hrd) via Magic Link privat dengan SLA klarifikasi 3x24 jam. Dengan memisahkan kalkulasi pasti dari LLM dan menerapkan prinsip Human-in-the-Loop, sistem menjamin keandalan data sementara wewenang keputusan akhir tetap berada di tangan Auditor Wasrik.","JKN PayShield mengubah metode audit dari sampling manual berkala (6-12 bulan) menjadi continuous real-time stream saat slip diunggah. Memangkas penerbitan draf SP-1 dari 7-14 hari menjadi <5 detik. Menjamin privasi pelapor 100% anonim di sisi klien. Memberikan dampak nyata berupa penyelamatan kas DJS BPJS Kesehatan dari kebocoran, perlindungan hak jaminan sosial pekerja, serta alur sanggahan yang transparan bagi HRD."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Juliana","s":null}]},{"id":"2710","tim":"sacrificethequeen","inov":"JKN TRUSTMESH","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2710_JKN_TRUSTMESH.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN bergantung pada keakuratan data kepesertaan dan ketertiban iuran. Pada segmen PPU BU, risiko tidak selalu terlihat dari tunggakan karena dapat berupa pekerja belum terdaftar, under-reporting upah, penundaan setoran, misklasifikasi status kerja, atau manipulasi mutasi. JKN TrustMesh hadir untuk menghubungkan data tersebut dengan konfirmasi pekerja secara agregat guna mengidentifikasi risiko, menentukan prioritas, dan mendukung tindak lanjut petugas.","1. Merancang sistem untuk mengidentifikasi dan mengelompokkan risiko kepatuhan pemberi kerja.\n2. Mengintegrasikan data kepesertaan, iuran, upah, mutasi, dan konfirmasi pekerja.\n3. Menentukan prioritas tindak lanjut berdasarkan indikator risiko.\n4. Menghasilkan ringkasan kasus dan rekomendasi bagi petugas.\n5. Menjamin privasi pekerja serta menerapkan human-in-the-loop dalam pengambilan keputusan.","JKN TrustMesh adalah sistem pendukung analisis yang menghubungkan data kepesertaan, iuran, upah, mutasi pekerja, dan konfirmasi pekerja secara agregat untuk mendeteksi pola risiko kepatuhan pemberi kerja. Sistem mengelompokkan jenis risiko, menentukan prioritas tindak lanjut, dan menghasilkan ringkasan kasus bagi petugas BPJS. TrustMesh berfungsi sebagai decision-support system, sehingga hasil analisis tetap diverifikasi dan diputuskan oleh petugas. Pendekatan ini membantu membedakan keterlambatan administratif, pekerja belum terdaftar, ketidaksesuaian upah, penundaan setoran iuran, serta masalah status dan mutasi pekerja secara lebih tepat dan proporsional.","1. Efisiensi: mempercepat telaah dan prioritas kasus.\n2. Ketepatan: mendukung tindak lanjut sesuai jenis risiko.\n3. Perlindungan pekerja: menjaga kerahasiaan identitas.\n4. Integritas JKN: meningkatkan ketertiban data kepesertaan dan iuran"],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2736","tim":"SayNo_toTipuTipu","inov":"RxGuard","kat":"Efisiensi Risiko pada Peserta JKN","f":"2736_RxGuard.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Dugaan penyalahgunaan obat resep untuk dijual kembali sulit dideteksi jika hanya melihat satu transaksi klaim. Polanya baru terlihat saat riwayat penebusan obat diamati dari waktu ke waktu. Tanpa alat untuk memetakan pola historis ini, tim verifikator kesulitan memilih kasus mana yang perlu diperiksa lebih dulu di tengah tingginya volume klaim JKN.","Membantu verifikator JKN menemukan dan memprioritaskan indikasi penyalahgunaan obat secara lebih efisien. Sistem ini memberi petunjuk awal beserta alasan risikonya, sehingga proses verifikasi lapangan menjadi lebih terarah tanpa perlu memvonis atau menuduh peserta secara sepihak.","RxGuard adalah sistem pendukung keputusan yang menganalisis pola resep dan penebusan obat peserta JKN secara longitudinal (lintas waktu). Menggabungkan aturan analitis dan algoritma machine learning, RxGuard menyajikan antrean prioritas review beserta kode alasannya, sementara keputusan akhir tetap di tangan verifikator manusia.","Kerja tim verifikator menjadi jauh lebih efisien karena fokus pada kasus paling berindikasi. Langkah ini tak hanya mencegah potensi kerugian dana JKN dari penyalahgunaan obat, tetapi juga menjaga keselamatan pasien dari konsumsi obat tanpa pengawasan medis yang tepat."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Septian Firmansyah","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2738","tim":"Onco Team","inov":"ONCO-Dose AI: Pengembangan AI-Based  Clinical Decision Support System (CDSS)  untuk Verifikasi Dosis","kat":"Efisiensi Risiko pada Peserta JKN","f":"2738_ONCO-Dose AI - Healthkathon BPJS - Jihan Istiqomah - MFK UGM.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kanker (posisi 3) menyerap Rp10,3 triliun biaya JKN pada 2025 dari 7,1 juta kasus, dan Indonesia mencatat 408.661 kasus baru (GLOBOCAN 2022). Obat antikanker adalah high alert medication dengan indeks terapi sempit, sehingga kesalahan dosis dapat menyebabkan toksisitas atau under-exposure. Dosis keliru menjadi error tersering (22%) pada laporan onkologi Jerman (Weber 2023). Perhitungan manual, Excel, dan kalkulator tunggal belum terintegrasi dengan verifikasi, bukti guideline, dan audit trail.","Tujuan umum ONCO-Dose AI adalah mengembangkan Clinical Decision Support System (CDSS) berbasis AI untuk membantu apoteker memverifikasi dosis dan mencegah medication error pada terapi antikanker. Secara khusus, sistem mengintegrasikan kalkulasi, verifikasi, alert, bukti guideline, dan dokumentasi dalam satu platform, menstandardisasi verifikasi antar kasus dan fasilitas kesehatan, menjamin keterlacakan melalui audit trail, serta memastikan keputusan akhir tetap di tangan apoteker.","ONCO-Dose AI adalah CDSS farmasi onkologi yang dikembangkan peserta (saya sendiri sebagai mahasiswa Magister Farmasi Klinis UGM) dengan kombinasi AI dan RAG. Sistem ini bertumpu pada tiga pilar, yaitu: kalkulator deterministik (BMI, BSA, CrCl, eGFR, Calvert AUC, ANC), Curated RAG yang hanya menjelaskan bukti dari guideline terkurasi (eviQ, ASCO, IDSA, KDIGO), dan rule engine tervalidasi yang memicu alert berkode warna. Alurnya: input data pasien, validasi, kalkulasi, cek klinis, penandaan DRP, lalu review apoteker (approve, modify, reject). Tiga modul MVP mencakup Carboplatin (Calvert AUC), High-Dose Methotrexate, dan Myelosuppression/Febrile Neutropenia. Keluarannya berupa laporan PDF, label dispensing sitotoksik, audit trail, dan dashboard statistik. AI hanya menjelaskan, tidak menghitung dosis maupun memutuskan terapi. Saat ini sistem berupa prototype akademik dengan data sintetis dan memerlukan validasi klinis sebelum digunakan secara luas di lapangan.","Berdampak pada keselamatan pasien melalui deteksi dini kesalahan dosis sebelum terapi diberikan, sehingga risiko toksisitas atau under-exposure berkurang. Apoteker terbantu karena perhitungan dan pengecekan manual berkurang, dan verifikasi menjadi lebih konsisten serta terdokumentasi lewat audit trail. Bagi BPJS Kesehatan, bukti dosis per kasus memudahkan verifikasi tagihan obat, dan 1% efisiensi biaya kanker setara Rp103 miliar (ilustrasi, bukan proyeksi). Namun, manfaat terbesar untuk pasien."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2758","tim":"Habis ini Colonist","inov":"Proposal Healthkathon 2026_SPECTRA JKN_Habis ini Catan_Universitas Brawijaya","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2758_Proposal Healthkathon 2026_SPECTRA JKN_Habis ini Catan_Universitas  Brawijaya.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Praktik Inflated Bills dan Cloning pada klaim fasilitas kesehatan berpotensi menyebabkan kerugian dana JKN dan menurunkan efisiensi proses verifikasi. Verifikasi manual terhadap klaim dalam jumlah besar juga membuat ketidakwajaran lebih sulit diprioritaskan. Karena itu, diperlukan alat bantu screening yang dapat mengidentifikasi indikasi risiko dan membantu auditor menentukan klaim yang perlu ditinjau lebih lanjut.","Mengembangkan SPECTRA JKN sebagai dashboard screening yang membantu auditor atau verifikator mengidentifikasi indikasi Inflated Bills dan Cloning, memberikan risk score beserta alasan indikasi, serta menyusun prioritas klaim yang perlu diverifikasi. SPECTRA JKN dirancang sebagai alat bantu pengambilan keputusan sehingga keputusan akhir dan tindak lanjut tetap dilakukan oleh auditor atau verifikator.","SPECTRA JKN (System for Pattern-based Evaluation and Claim Threat Risk Analysis) merupakan dashboard deteksi dini yang dirancang sebagai lapis kedua dalam proses verifikasi klaim JKN. Sistem menerima data klaim, detail tagihan obat/alkes, dan informasi resume medis, kemudian melakukan data cleaning dan analisis menggunakan rule serta threshold. Untuk Cloning, sistem mencocokkan pola dan atribut antar-klaim seperti kemiripan, duplikasi, kedekatan waktu, dan kesamaan fasilitas kesehatan. Untuk Inflated Bills, sistem menganalisis deviasi harga, komponen, jumlah, dan fasilitas. Hasil analisis digabungkan menjadi risk score dan ditampilkan dalam dashboard berupa indikator risiko, alasan indikasi, serta daftar prioritas verifikasi. Auditor kemudian meninjau hasil tersebut dan menentukan tindak lanjut. SPECTRA JKN saat ini berada pada tahap mockup.","SPECTRA JKN diharapkan membantu auditor melakukan screening klaim secara lebih cepat dan terarah dengan memprioritaskan klaim berdasarkan risk score dan indikator risiko. Dampaknya adalah berkurangnya beban pemeriksaan manual, meningkatnya ketepatan proses verifikasi, serta pengendalian klaim yang lebih terarah. Dalam jangka lanjut, solusi ini diharapkan membantu menjaga dana JKN agar tetap digunakan secara tepat sasaran."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Djaka Santosa","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2759","tim":"Tim Supernova","inov":"KlaimKembar: Dashboard Prioritas Pemeriksaan Repeat Billing pada Klaim Fisioterapi Rawat Jalan JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2759_Proposal KlaimKembar_Healthkathon2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pengajuan ulang klaim dapat terlewat oleh pencocokan persis ketika tanggal, nominal, atau tindakan berubah. Pada fisioterapi rawat jalan JKN, sesi terapi berulang juga dapat sah, sehingga kemiripan saja tidak membuktikan duplikasi. Verifikator membutuhkan alat bantu untuk memprioritaskan pemeriksaan, membandingkan klaim, dan meninjau bukti tanpa otomatis menuduh kecurangan.","Membangun dashboard untuk memprioritaskan pemeriksaan kemungkinan repeat billing pada klaim fisioterapi rawat jalan JKN. Sistem menghubungkan klaim yang mirip, menjelaskan alasan pemasangan, dan mengecualikan pengulangan sah jika bukti tersedia. Keputusan akhir tetap pada petugas. Prototype diuji menggunakan data sintetis sebagai persiapan validasi bersama verifikator.","KlaimKembar adalah prototype dashboard web lokal yang membantu verifikator memeriksa kemungkinan repeat billing pada klaim fisioterapi rawat jalan JKN. Petugas mengunggah CSV, meninjau hasil validasi, lalu membuka antrean berdasarkan prioritas. Sistem mencari pasangan klaim pada peserta yang sama, fasilitas terkait, dan jendela tanggal tiga hari. Skor kemiripan berbasis aturan disertai alasan, perbandingan berdampingan, serta kronologi. Pengecualian untuk terapi berkala, klaim batal-koreksi, dan kunjungan berbeda memerlukan bukti pendukung. Petugas memilih Valid, Perlu dokumen tambahan, atau Perlu pemeriksaan lebih lanjut. Keputusan dan revisinya dicatat dalam jejak audit. Pengujian lima dataset, masing-masing 5.000 klaim sintetis, menghasilkan rata-rata precision 97,1% dan recall 86,5% dengan pengecualian. Hasil ini merupakan simulasi internal, bukan bukti performa pada data JKN riil. Pilot dan usability testing dengan verifikator belum dilakukan.","KlaimKembar diharapkan membantu verifikator memilah kasus dan memahami perbedaan klaim melalui antrean prioritas, alasan terbaca, dan perbandingan berdampingan. Pengecualian berbasis bukti diharapkan mengurangi salah tandai pada pengulangan yang sah. Jejak audit mendokumentasikan keputusan petugas. Potensi penghematan dana dan pengurangan waktu pemeriksaan belum diukur dan perlu diuji melalui pilot."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2774","tim":"timfilkom","inov":"smart care","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2774_Proposal_SmartCare Gate.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program Jaminan Kesehatan Nasional (JKN) melayani populasi dan volume \npemanfaatan yang sangat besar. Dalam Public Expose Pengelolaan Program dan \nKeuangan BPJS Kesehatan Tahun 2024, BPJS Kesehatan melaporkan 278,1 juta peserta \npada akhir 2024 dan sekitar 673,9 juta pemanfaatan layanan sepanjang tahun tersebut, \natau rata-rata sekitar 1,8 juta pemanfaatan per hari. Pada skala ini, pengulangan \npelayanan yang sebenarnya dapat dihindari, meskipun hanya terjadi pada sebagian kecil \nkasus","Tujuan SmartCare Gate adalah menyediakan konteks riwayat pelayanan yang \nrelevan pada saat keputusan klinis dibuat, mendeteksi potensi pengulangan sebelum \npelayanan dilakukan, mendorong penggunaan kembali hasil yang masih relevan, serta \nmembantu mengurangi pembiayaan pelayanan yang tidak memberikan nilai klinis \ntambahan. \nBagi peserta, inovasi ini berpotensi mengurangi pemeriksaan berulang, waktu, \ndan ketidaknyamanan. Bagi tenaga medis, sistem menyediakan konteks tambahan","SmartCare Gate adalah sistem pendukung keputusan preventif yang dirancang untuk membantu fasilitas kesehatan mencegah pemeriksaan, tindakan, atau pemberian obat yang berpotensi tidak diperlukan sebelum pelayanan diberikan kepada peserta JKN. Inovasi ini ditempatkan pada kategori Efisiensi Risiko pada Fasilitas Kesehatan, dengan subkategori Tindakan pengobatan tidak sesuai indikasi medis.\nPermasalahan utama yang ingin diselesaikan SmartCare Gate adalah terjadinya pelayanan yang berulang atau duplikatif karena informasi pelayanan sebelumnya belum dimanfaatkan secara optimal pada saat dokter mengambil keputusan. Dalam praktik pelayanan kesehatan, seorang pasien dapat berpindah dari satu fasilitas kesehatan ke fasilitas kesehatan lain. Dokter yang menangani pasien di fasilitas berikutnya belum tentu langsung mengetahui bahwa pasien baru saja melakukan pemeriksaan laboratorium, radiologi, atau menerima obat yang sama di fasilitas sebelumnya. Akibatnya, pemeriksaan atau pemberian obat yang s","SmartCare Gate membantu mengurangi pemeriksaan dan obat yang duplikatif sebelum biaya terjadi. Peserta terhindar dari pelayanan ulang yang tidak perlu, dokter mendapat informasi riwayat yang lebih lengkap, fasilitas kesehatan dapat menggunakan sumber daya secara lebih efisien, dan BPJS Kesehatan dapat menekan pembiayaan yang tidak memberikan nilai klinis tambahan. Inovasi ini juga mendukung pelayanan JKN yang lebih tepat, efisien, dan preventif."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Djaka Santosa","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2776","tim":"Ridi","inov":"WageLens Silang-cek upah BPJS dan basis PPh 21 untuk mendeteksi ketidaksesuaian iuran lebih dini","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2776_WageLens_Proposal_Healthkathon2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Efektivitas JKN terhambat oleh ketidakpatuhan pemberi kerja: upah dilaporkan lebih rendah dari riil, hanya sebagian pekerja didaftarkan (PDUK), serta iuran yang dipotong dari gaji tidak disetor atau terlambat. Diperkirakan 30%-40% badan usaha menengah-kecil mendaftarkan sebagian, dengan tunggakan iuran Rp26,47 triliun (2025-2026). Jumlah badan usaha sangat besar sedangkan pemeriksa terbatas, sehingga pemeriksaan acak kurang efektif tanpa prioritisasi berbasis data.","Membantu pemeriksa kepatuhan BPJS Kesehatan memprioritaskan pemeriksaan badan usaha lebih dini dan tepat sasaran, dengan mendeteksi ketidaksesuaian upah, kepesertaan, dan setoran iuran melalui silang-cek data PPh 21 dan skor risiko yang dapat dijelaskan, tanpa menuduh pemberi kerja. Keputusan akhir tetap di tangan manusia.","WageLens membandingkan jumlah pekerja dan upah yang dilaporkan ke BPJS Kesehatan dengan data agregat PPh 21 per pemberi kerja per bulan. Dengan aturan iuran (batas atas Rp12 juta, batas bawah UMK/UMP), rule engine dan model anomali Isolation Forest menghasilkan skor risiko 0-100 beserta alasan per faktor, lalu auditor meninjau kasus. Tersedia mode Regulator dan Swa-periksa. Saat ini berupa prototype dengan data sintetis.","Sasaran pemeriksaan beralih dari sampel manual ke daftar prioritas berbasis skor dengan alasan, deteksi menjadi bulanan dan otomatis, dan pemeriksa fokus pada kasus berskor tertinggi. Manfaatnya dirasakan BPJS Kesehatan, dana JKN, pekerja, dan pemberi kerja patuh. Diukur lewat precision@k, tingkat false positive, waktu tinjau, dan estimasi selisih iuran. Seluruh target masih hipotesis."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2781","tim":"Tim FraudGuard","inov":"FraudGuard JKN: Engine Deteksi Anomali Cerdas untuk Efisiensi Klaim Upcoding & Unbundling","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2781_Proposal Healthkathon 2026_FraudGuardJKN_Muhammad Rakha Andira-compressed.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Tingginya potensi leakage Dana Jaminan Sosial (DJS) akibat ketidaksesuaian pengajuan klaim pelayanan kesehatan di FKRTL, khususnya praktik upcoding (manipulasi kode diagnosis/tindakan) dan unbundling (pemecahan paket episode perawatan). Verifikasi manual saat ini membutuhkan waktu lama dan sulit mendeteksi anomali pada narasi rekam medis yang kompleks.","Mengembangkan FraudGuard JKN sebagai sistem pendukung keputusan (decision support system) berbasis Machine Learning, NLP, dan Explainable AI. Sistem ini bertujuan mempercepat proses verifikasi klaim digital hingga 60%, mendeteksi anomali upcoding dan unbundling secara real-time, serta mencegah potensi leakage anggaran DJS Kesehatan secara akurat.","FraudGuard JKN adalah inovasi AI Engine berbasis Machine Learning, Natural Language Processing (NLP), dan Explainable AI (XAI) yang dirancang sebagai decision support system bagi verifikator BPJS Kesehatan di FKRTL.\n\nSistem ini memverifikasi kesesuaian berkas klaim digital (Resume Medis & Billing) secara otomatis dan real-time melalui 3 fitur utama:\n1. ICD-Auto Cross Validation: Pencocokan teks narasi rekam medis dokter dengan kode ICD-10/ICD-9-CM menggunakan NLP.\n2. Unbundling Detector: Deteksi pola pemecahan paket episode perawatan medis.\n3. Risk Scoring Dashboard & XAI: Pembobotan risiko (Green/Yellow/Red) dilengkapi penjelasan logis penentu skor (SHAP) untuk transparansi analisis verifikator.\n\nDiuji pada 1.000 data klaim sintetis dengan akurasi 91,4%, FraudGuard JKN mampu memangkas waktu verifikasi hingga 60%, memitigasi risiko leakage anggaran DJS, serta menjamin kepatuhan UU PDP & enkripsi AES-256.","Dampak yang diharapkan dari FraudGuard JKN meliputi:\n1. Efisiensi Finansial: Mencegah potensi leakage anggaran klaim anomali sebesar 1,5%–3% dari total beban klaim FKRTL untuk menjaga ketahanan Dana Jaminan Sosial (DJS) Kesehatan.\n2. Peningkatan Produktivitas: Memangkas waktu analisis manual klaim berisiko tinggi hingga 60% melalui pembobotan skor otomatis.\n3. Tata Kelola Etis: Mendorong transparansi dan kepatuhan pengkodean klaim di Faskes."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2785","tim":"KlaimSiaga","inov":"KlaimSiaga: Prioritas Audit Klaim Faskes JKN untuk Deteksi Dini Upcoding dan Inflated Bills","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2785_KlaimSiaga-Proposal-Healthkathon2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim faskes JKN berjumlah sangat besar, sedangkan kapasitas verifikasi dan audit manual terbatas. Upcoding dan penggelembungan tagihan sulit terlihat pada satu klaim; polanya baru tampak saat dibandingkan dengan klaim serupa dan faskes sejenis. Akibatnya auditor sulit menentukan klaim dan faskes mana yang paling layak diperiksa lebih dulu, sehingga sumber daya audit belum tentu tertuju pada risiko terbesar.","Membantu verifikator dan tim pencegahan kecurangan memprioritaskan pemeriksaan klaim faskes secara lebih tepat. KlaimSiaga menyusun daftar kerja audit terurut skor risiko 0-100 beserta alasannya, dengan membandingkan nilai klaim terhadap perkiraan wajar dan faskes sejenis. Sistem bukan pengambil keputusan dan bukan pembuktian fraud; keputusan akhir tetap pada auditor manusia.","KlaimSiaga adalah alat prioritas audit dengan empat lapisan analisis: (A) model expected-cost yang memperkirakan rentang nilai klaim wajar berdasarkan diagnosis, tindakan, dan karakteristik pasien; (B) peer benchmarking yang membandingkan faskes sejenis dengan penyesuaian case-mix; (C) deteksi anomali tanpa label (isolation forest) pada profil faskes; (D) aturan pakar untuk pola yang sudah dikenal. Keluarannya skor risiko 0-100 dengan alasan yang dapat dijelaskan, ditampilkan pada dashboard tiga halaman: ringkasan, profil faskes terhadap peer, dan daftar kerja audit. Prototipe telah dikembangkan dan diuji hanya pada data publik Kaggle (Medicare AS); tidak memakai data peserta JKN riil. Hasil evaluasi dilaporkan apa adanya beserta keterbatasannya, dan tidak diklaim setara dengan kinerja pada data JKN.","Auditor dapat memeriksa klaim dan faskes berisiko lebih dulu sehingga waktu audit lebih terarah, dan pola penyimpangan lebih cepat terlihat. Alasan tiap skor memudahkan penelusuran dan menjaga akuntabilitas. Dampak yang terukur akan dinilai lewat temuan per jam audit dan recall pada k teratas; angka penghematan tidak dijanjikan sebelum diuji pada data JKN dengan izin resmi."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Juliana","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2786","tim":"BUMI Health Catalyst","inov":"JALUR: Jaringan Analitik Lintasan Rujukan untuk Audit Integritas Rujukan JKN di Era RBKP","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2786_JALUR_Healthkathon2026-3.pptx.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Rasio klaim DJS Kesehatan mencapai 111,86% (Feb 2026) dengan defisit struktural sekitar Rp2 triliun per bulan, sehingga efisiensi risiko menjadi syarat keberlanjutan JKN. Fraud rujukan seperti self-referral dan rujukan tidak sesuai bersifat relasional karena melibatkan banyak aktor, sehingga sulit terlihat bila klaim diperiksa per berkas. Transisi ke Rujukan Berbasis Kompetensi (RBKP), yang diuji di 4 daerah sejak September 2026, membuka permukaan risiko baru yang perlu diawasi sejak awal.","Mengembangkan sistem audit integritas rujukan yang: (1) mendeteksi pola rujukan FKTP–RS yang tidak dijelaskan oleh jarak, kompetensi, kapasitas, atau pilihan pasien; (2) membedakan bypass yang sah dari indikasi kolusi untuk menekan salah tuduh; (3) menyajikan antrean prioritas beserta alasan yang dapat diperiksa verifikator; dan (4) mendukung pengawasan RBKP tanpa sanksi otomatis serta sesuai UU PDP.","JALUR adalah lapisan audit di atas sistem rujukan JKN yang menggabungkan tiga lensa. Lensa Spasial memakai model Huff terkalibrasi untuk menghitung arus rujukan yang diharapkan berdasarkan jarak, kompetensi, dan kapasitas RS. Lensa Jaringan mengukur konsentrasi pasangan FKTP–RS yang tidak wajar dibanding faskes sejenis. Lensa Kepatuhan RBKP memantau override rekomendasi SatuSehat Rujukan tanpa alasan klinis. Flag hanya muncul bila minimal dua lensa konvergen, lalu masuk ke dashboard verifikator beserta alasannya. Keputusan (wajar, klarifikasi, atau eskalasi ke Tim PK-JKN) tetap di tangan manusia dan menjadi umpan balik model. Unit analisisnya faskes, bukan individu pasien. Prototipe analitik sudah berjalan pada data sintetis: dalam 50 simulasi, presisi JALUR 0,97 dibanding 0,41 pada pendekatan berbasis jarak.","Bagi BPJS Kesehatan: audit lebih terfokus pada daftar prioritas beralasan dan DJS lebih terlindungi. Bagi peserta: dirujuk ke RS yang tepat, bukan ke RS mitra. Bagi faskes jujur: lebih sedikit pemeriksaan yang tidak perlu. Target pilot shadow-mode: minimal 50% flag terkonfirmasi verifikator, kurang dari 10% salah flag pada RS rujukan sah, dan waktu deteksi dari kuartalan menjadi bulanan. Nilai klaim terkoreksi diukur saat pilot, bukan diestimasi di awal."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Juliana","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2795","tim":"tiba tiba heketon","inov":"KartuGuard: Radar Anomali Penyalahgunaan Identitas Peserta JKN","kat":"Efisiensi Risiko pada Peserta JKN","f":"2795_KartuGuard - Proposal Healthkathon 2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Meminjamkan atau memperjualbelikan kartu JKN termasuk kecurangan peserta (Permenkes 16/2019). Kasus terdokumentasi, seperti di Singaraja dan Tana Toraja (kerugian Rp14 juta), baru terungkap setelah pemilik kartu mengeluh atau kartunya berstatus meninggal. BPJS menyebut verifikasi administrasi di rumah sakit tidak selalu memastikan pasien adalah pemilik kartu. Deteksi masih reaktif dan manual, sementara jumlah kunjungan JKN sangat besar.","Membangun KartuGuard, sistem skor risiko per kunjungan yang menandai kartu JKN yang diduga dipakai bukan oleh pemiliknya, lalu menyusun antrean kecil kasus prioritas untuk diverifikasi petugas BPJS. Tujuan: (1) mendeteksi lebih awal tanpa menunggu komplain, (2) memfokuskan audit pada kunjungan paling mencurigakan, (3) melindungi peserta sah lewat alasan penandaan yang jelas dan keputusan akhir di tangan manusia.","KartuGuard menilai setiap kunjungan dengan empat sinyal: pemakaian setelah peserta tercatat meninggal, diagnosis tidak lazim untuk usia/jenis kelamin pemilik kartu, lokasi dan waktu kunjungan mustahil, serta pola frekuensi anomali (Isolation Forest). Skor akhir menghasilkan antrean 1% kunjungan teratas beserta alasan penandaan. Sistem hanya menandai, tidak menonaktifkan kartu. Prototype diuji pada data sintetis, tanpa data peserta JKN riil.","Target desain: deteksi di hari yang sama atau H+1 tanpa menunggu komplain, audit terfokus pada 1% kunjungan teratas, peserta sah terlindungi, dana JKN terjaga. Pada simulasi data sintetis, antrean 1% teratas mencapai presisi 40,3% dibanding 2% jika acak. Ini bukti konsep, bukan jaminan di dunia nyata; dampak nyata diukur pada pilot."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2797","tim":"Mind2Impact","inov":"LIFE JKN","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2797_Mind2Impact_LIFE_JKN_Proposal_Healthkathon_2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kepatuhan pemberi kerja tidak selalu bermasalah dalam satu kejadian besar. Sinyalnya dapat muncul kecil dan terpisah: pekerja belum terdaftar, upah berubah, iuran terlambat, status tidak konsisten, hingga mutasi terlambat dilaporkan. Jika dilihat satu per satu, semuanya tampak biasa. Namun ketika dihubungkan sepanjang lifecycle pekerja, pola risiko mulai terlihat. Inilah blind spot yang dijawab LIFE JKN.","LIFE JKN bertujuan membantu BPJS Kesehatan mendeteksi lebih dini potensi ketidaksesuaian kepatuhan pemberi kerja dengan menghubungkan sinyal sepanjang lifecycle pekerja. Sistem mengubah data yang tersebar menjadi informasi yang menjawab: pemberi kerja mana yang perlu diperhatikan, mengapa terdeteksi, seberapa kuat buktinya, apa dampaknya, dan tindakan apa yang sebaiknya dilakukan.","LIFE JKN (Lifecycle Intelligence for Employer Compliance) adalah sistem decision intelligence yang memonitor kepatuhan pemberi kerja melalui perjalanan data pekerjanya dari masuk, pendaftaran, status kerja, upah, pembayaran iuran, mutasi, hingga PHK. Sistem tidak berhenti pada pemberian skor. LIFE JKN menghubungkan sinyal berdasarkan pekerja, pemberi kerja, dan waktu. Kemudian, memisahkan Risk, Confidence, dan Impact agar risiko tidak otomatis dianggap sebagai pelanggaran. Setiap temuan dapat ditelusuri dari data awal, alasan terdeteksi, bukti pendukung, hingga Next Best Action. Prosesnya membentuk closed loop: DETECT ? CONNECT ? EXPLAIN ? ACT ? PROTECT ? LEARN. Dengan demikian, pertanyaan bergeser dari “ada anomali apa?” menjadi “apa yang sebenarnya terjadi sepanjang lifecycle pekerja, siapa yang perlu diprioritaskan, mengapa, dan apa yang harus dilakukan selanjutnya?”","LIFE JKN mengubah pengawasan dari reaktif menjadi lebih dini, terarah, dan dapat dijelaskan. Petugas tidak hanya menerima daftar anomali, tetapi memperoleh konteks, bukti, prioritas, dan rekomendasi tindakan. Pemberi kerja mendapat ruang klarifikasi dan verifikasi tetap dilakukan manusia. Dampak akhirnya bukan sekadar menemukan risiko, tetapi membantu mencegah ketidaksesuaian berulang dan memperkuat perlindungan peserta JKN."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2803","tim":"Scispace team","inov":"INOVASI DIGITAL KEFARMASIAN SIFAK-JKN Sistem Identifikasi Klaim Fiktif Obat dan Alat Kesehatan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2803_Proposal_SIFAK_JKN-Final.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim fiktif obat dan alat kesehatan dalam program JKN menjadi bentuk fraud yang merugikan negara hingga triliunan rupiah per tahun. Deteksi yang ada masih bersifat manual dan reaktif, sehingga tidak mampu menghadapi pola klaim yang semakin kompleks. Diperlukan sistem berbasis kecerdasan buatan yang dapat mendeteksi anomali klaim secara otomatis, real-time, dan sistematis untuk melindungi keberlanjutan JKN.","SIFAK-JKN bertujuan membangun sistem berbasis AI untuk mendeteksi klaim fiktif obat dan alkes dalam ekosistem JKN secara otomatis dan akurat. Tujuan spesifiknya: (1) mengidentifikasi anomali pola klaim menggunakan machine learning, (2) memberikan peringatan dini kepada verifikator BPJS, (3) menghasilkan laporan audit yang transparan, dan (4) memperkuat integritas sistem jaminan kesehatan nasional","SIFAK-JKN (Sistem Identifikasi Klaim Fiktif Obat dan Alat Kesehatan) adalah platform berbasis AI/ML untuk deteksi anomali klaim obat dan alkes dalam JKN. Sistem terdiri dari empat lapisan: (1) Data Integration Layer yang mengintegrasikan data klaim faskes tingkat pertama dan rujukan; (2) Analytics Engine berbasis Isolation Forest dan Random Forest untuk mendeteksi pola klaim mencurigakan; (3) Dashboard Monitoring real-time dengan risk score dan flagging otomatis; serta (4) Compliance & Audit Layer untuk pelaporan terstruktur kepada BPJS Kesehatan dan Kemenkes. SIFAK-JKN mendeteksi pola seperti klaim ganda, obat non-formularium, dan tagihan alkes tanpa indikasi klinis valid, memungkinkan intervensi cepat sebelum klaim diproses.","SIFAK-JKN diproyeksikan meminimalisasi kerugian negara akibat klaim fiktif, meningkatkan efisiensi verifikasi klaim BPJS Kesehatan, dan memperkuat kepercayaan publik terhadap JKN. Dalam jangka panjang, sistem ini mendorong ekosistem fasilitas kesehatan yang lebih transparan, akuntabel, dan berbasis data, serta mendukung tata kelola jaminan sosial kesehatan yang lebih kuat di Indonesia."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Yanuar Milad","s":null},{"n":"Aries Kurniwan","s":null}]},{"id":"2807","tim":"Apayak","inov":"Integrated Fraud Prevention System","kat":"Efisiensi Risiko pada Peserta JKN","f":"2807_Integrated Fraud Prevention System_Healthkathon_compressed.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pemalsuan atau manipulasi data peserta dapat menyebabkan penyalahgunaan layanan JKN. Verifikasi yang hanya mengandalkan data administratif berpotensi tidak mendeteksi pola penyalahgunaan, seperti identitas yang dipinjam atau data tidak sesuai. Akibatnya, indikasi kecurangan sering baru terungkap setelah layanan diberikan dan kerugian terjadi. Karena itu, diperlukan pendekatan yang memastikan kebenaran identitas dan membaca pola data secara menyeluruh.","Membangun mekanisme pencegahan kecurangan yang terintegrasi agar penyalahgunaan layanan JKN dapat dikenali lebih dini. Sistem memastikan pengguna sesuai dengan identitas peserta, mencocokkan data dari berbagai sumber, mendeteksi aktivitas tidak wajar, dan memberi skor risiko untuk membantu petugas menentukan tindakan. Dengan begitu, petugas fokus pada kasus berisiko, sementara peserta yang sah tetap dilayani tanpa hambatan.","Integrated Fraud Prevention System memproses data peserta melalui lima tahap: Identity Verification mencocokkan identitas dengan pengguna aktual, Data Cross-Validation membandingkan data antar sumber, Fraud Detection mengenali pola tidak wajar, Risk Scoring menghasilkan skor Low, Medium, atau High, dan Real-Time Alert memberi tahu petugas. Kasus berisiko tinggi diverifikasi manual, dan keputusan petugas menjadi umpan balik bagi model. Sistem ini berperan sebagai early warning system.","Sistem ini diharapkan mengurangi pemalsuan data peserta karena identitas dan data diperiksa sejak awal. Deteksi fraud menjadi lebih cepat lewat peringatan real-time, sehingga potensi kerugian BPJS dapat ditekan. Keamanan dan integritas data peserta juga meningkat, sementara keterlibatan petugas dalam keputusan penting menjaga agar peserta yang sah tidak dirugikan."],"r":[{"n":"Juliana","s":null},{"n":"Djaka Santosa","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2808","tim":"JKN ID-SENTINEL","inov":"JKN ID-SENTINEL: AI-Powered Identity Integrity & Early Warning for JKN","kat":"Efisiensi Risiko pada Peserta JKN","f":"2808_Proposal_JKN ID-SENTINEL.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pemalsuan atau penyalahgunaan data dan identitas peserta dapat menimbulkan risiko terhadap ketepatan pelayanan dan efisiensi Program JKN. Pemeriksaan identitas secara statis belum cukup untuk melihat pola penggunaan identitas yang tidak konsisten antarwaktu, fasilitas kesehatan, lokasi, dan layanan. Diperlukan sistem analitik yang mampu mendeteksi indikasi risiko sejak dini, menjelaskan faktor pemicunya, dan membantu petugas melakukan verifikasi secara tepat.","Mengembangkan JKN ID-SENTINEL sebagai sistem peringatan dini berbasis AI untuk membantu mengidentifikasi pola penggunaan identitas peserta yang tidak wajar. Sistem mengintegrasikan analisis konsistensi identitas, pola temporal, relasi fasilitas dan layanan, serta anomaly detection untuk menghasilkan indikator risiko yang dapat dijelaskan dan menjadi bahan verifikasi oleh petugas.","JKN ID-SENTINEL merupakan solusi AI untuk menjaga integritas identitas peserta JKN. Sistem membangun Identity Integrity Graph yang menghubungkan identitas pseudonim dengan event pelayanan, fasilitas, waktu, lokasi agregat, dan atribut terkait. Risk Engine menggabungkan rule-based detection, anomaly detection, dan graph features untuk menghasilkan risk score. Setiap alert dilengkapi alasan dan evidence trail, kemudian diteruskan kepada petugas untuk verifikasi. Prototype menggunakan data sintetis dan tidak mengambil keputusan fraud secara otomatis.","JKN ID-SENTINEL diharapkan membantu BPJS Kesehatan meningkatkan efisiensi proses identifikasi dan verifikasi indikasi pemalsuan atau penyalahgunaan identitas peserta. Sistem membantu memprioritaskan kasus yang perlu ditinjau berdasarkan pola risiko, menyediakan alasan yang dapat ditelusuri, serta mengurangi pemeriksaan yang tidak perlu terhadap kasus berisiko rendah. Dalam jangka panjang, solusi ini diharapkan mendukung integritas data peserta, meningkatkan kualitas pengawasan, dan memperkuat pe"],"r":[{"n":"Susi Lusiani","s":null},{"n":"Yanuar Milad","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2815","tim":"IT","inov":"Deteksi Penggelembungan Tagihan Obat dan Alkes  Berbasis Explainable AI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2815_Proposal_PriceGuard_JKN_Healthkathon2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Biaya obat/alkes pada klaim dapat ditagih lebih tinggi dari harga \nsebenarnya. Dengan volume klaim sangat besar, pemeriksaan manual \ntidak mungkin mencakup semuanya sehingga risiko lolos dari deteksi.","Dana terlindungi dan audit BPJS Kesehatan lebih tepat sasaran, Fasilitas Kesehatan terhindar dari kecurigaan karena penilaian berbasis harga acuan dan peer-group yang adil, serta keberlanjutan dana dan mutu layanan terjaga oleh Peserta JKN.","Aplikasi web yang menerima data klaim, memberi risk score 0-100 per klaim dan faskes, lalu menjelaskan alasannya untuk verifikator. Setiap item klaim dipetakan ke katalog resmi lalu dihitung rasio harga klaim terhadap harga referensi. Aturan harga, z-score antar klaim, dan perbandingan dengan faskes sejenis digabung menjadi satu skor. Kontribusi tiap faktor ditampilkan (gaya SHAP) beserta kalimat alasan yang mudah dibaca.","Dana terlindungi dan audit BPJS Kesehatan lebih tepat sasaran, Fasilitas Kesehatan terhindar dari kecurigaan karena penilaian berbasis harga acuan dan peer-group yang adil, serta keberlanjutan dana dan mutu layanan terjaga oleh Peserta JKN."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2816","tim":"Dewangga","inov":"SehatJKN Preventif","kat":"Efisiensi Risiko pada Peserta JKN","f":"2816_SehatJKN Preventif - Proposal Healthkathon BPJS 2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Tingginya beban klaim BPJS terjadi karena peserta sering membutuhkan layanan medis intensif yang sebenarnya tidak perlu (unnecessary services) jika saja risiko penyakit tersebut dicegah dan dideteksi sejak awal.","Menekan pemanfaatan layanan kesehatan yang tidak perlu dengan mengubah perilaku peserta dari reaktif menjadi proaktif dan mandiri dalam menjaga kesehatan.","Aplikasi SehatJKN menyediakan skrining riwayat kesehatan mandiri dan habit tracker harian. Fitur skrining ini bertindak sebagai penyaring awal sehingga rujukan ke fasilitas kesehatan hanya terjadi pada peserta yang profil risikonya memang membutuhkan penanganan medis, mencegah kunjungan yang tidak perlu.","Mengurangi drastis tindakan atau layanan medis yang tidak perlu (unnecessary services), menekan klaim rumah sakit, dan memastikan pemanfaatan hak JKN oleh peserta menjadi lebih efisien dan tepat sasaran."],"r":[{"n":"Juliana","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2818","tim":"Clover","inov":"KlaimLens","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2818_KlaimLens_Proposal_Healthkathon_2026.pdf-1_compressed.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kecurangan (fraud) klaim di fasilitas kesehatan menjadi ancaman nyata bagi keberlanjutan Program JKN. BPJS Kesehatan menemukan dugaan fraud di faskes terafiliasi sebesar Rp866 miliar (temuan Desember 2023), dan KPK (2024) memperkirakan kerugian sekitar Rp20 triliun per tahun, yang masih berupa estimasi. Dengan 286 juta peserta dan dana kelolaan sekitar Rp190 triliun, verifikator tidak mungkin memeriksa semua klaim, sehingga prioritisasi pemeriksaan sebelum pembayaran sangat dibutuhkan.","Tujuan KlaimLens adalah membantu verifikator BPJS Kesehatan menemukan klaim FKRTL yang paling perlu diperiksa sebelum dana dibayarkan, melalui antrean prioritas berbasis skor risiko. Sistem mendeteksi pola upcoding, unbundling, inflated bills, cloning, dan prolonged stay dengan membandingkan klaim lintas rumah sakit dalam peer group yang sama. Setiap skor disertai reason code yang dapat ditelusuri, sehingga keputusan akhir tetap di tangan verifikator dan privasi peserta terjaga.","KlaimLens adalah screening klaim FKRTL berbasis AI yang dapat dijelaskan. Setiap klaim yang masuk dinilai oleh tiga detektor: rule engine konsistensi koding, Isolation Forest pada peer group, dan clone detector untuk klaim kembar. Hasilnya berupa skor gabungan, reason code, dan profil risiko rumah sakit dalam antrean prioritas. Verifikator memeriksa bukti lalu memutuskan, dan keputusan itu menjadi umpan balik model. Prototype diuji pada data sintetis, belum pada data riil.","KlaimLens menargetkan agar verifikator fokus pada klaim paling berisiko, dengan deteksi bergeser dari pasca-bayar ke pra-bayar. Dampaknya meliputi dana iuran yang lebih terjaga, persaingan antar faskes yang lebih adil, dan bukti awal yang lebih kuat untuk audit. Sebagai ilustrasi skala, setiap tambahan 10% temuan yang terdeteksi lebih awal dari acuan Rp866 miliar setara sekitar Rp86,6 miliar. Angka ini adalah target yang perlu diuji, bukan hasil terbukti."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2823","tim":"govtrans6","inov":"Claim Integrity Radar","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2823_tim govtrans8.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim JKN melampaui iuran sekitar Rp2 triliun per bulan, sementara sekitar 650.000 berkas klaim diperiksa setiap hari dan sekitar 5% terindikasi fraud (menurut BPJS). Audit KPK atas data 2017-2018 menemukan dugaan kecurangan sekitar Rp35 miliar di tiga rumah sakit; pada fisioterapi hanya 1.072 dari 4.341 tagihan punya rekam medis. Tim audit terbatas, dan klaim tertunda rata-rata sekitar 14% (survei RS, 2024). Dibutuhkan cara menentukan klaim mana yang diperiksa lebih dulu.","Tujuan proposal ini: (1) membantu verifikator dan Tim Anti Kecurangan BPJS Kesehatan menentukan klaim dan fasilitas kesehatan yang paling layak diperiksa lebih dulu; (2) mendeteksi indikasi klaim fiktif, penjiplakan klaim, dan klaim berulang secara terukur dan dapat dijelaskan; (3) melindungi klaim fasilitas kesehatan yang jujur agar tidak ikut tertahan; (4) membuktikan kelayakan solusi lewat prototipe pada data sintetis, tanpa data peserta riil.","Claim Integrity Radar adalah dashboard untuk petugas BPJS. Empat pemeriksa menilai klaim: kewajaran kapasitas, kemiripan antarklaim (cloning), pola waktu dan pengulangan, serta kelengkapan bukti. Skor risiko disertai alasan terbaca, lalu klaim diarahkan ke jalur hijau, kuning (klarifikasi/koreksi mandiri), atau merah (audit) dan diurutkan menurut nilai klaim dibagi usaha audit. Keputusan akhir tetap di manusia. Diuji pada data sintetis melawan audit acak dan aturan sederhana.","Bagi BPJS: auditor memeriksa klaim paling bernilai dan berisiko lebih dulu, sehingga potensi kebocoran terdeteksi lebih cepat dan sumber daya audit terpakai efisien. Bagi fasilitas kesehatan jujur: lebih sedikit klaim tertahan, dengan kesempatan koreksi. Bagi sistem JKN: mendukung keberlanjutan pembiayaan. Dampak diukur lewat precision, recall, fraud per 100 berkas diperiksa, dan klaim sah yang tetap di jalur hijau. Angka berasal dari data sintetis dan perlu validasi data riil."],"r":[{"n":"Juliana","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2828","tim":"Kompetitor","inov":"Dual-Source Claim Verification: menghadirkan suara pasien dalam verifikasi klaim JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2828_Proposal Hackathon Dual Verification System.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pada 2024, tim gabungan KPK, Kemenkes, BPJS, dan BPKP menemukan tiga rumah sakit menagih 4.341 klaim, padahal catatan medisnya hanya sekitar 1.000 kasus. KTP warga dikumpulkan lewat bakti sosial, lalu dipakai untuk klaim fiktif. Dokumennya lengkap, sehingga lolos pemeriksaan dokumen. Kasus ini terbongkar setelah petugas mendatangi pasien. Cara itu efektif, tetapi tidak mungkin diterapkan pada sekitar 2 juta layanan JKN per hari.","Menjadikan konfirmasi ke pasien sebagai langkah rutin dalam verifikasi klaim, tanpa petugas harus datang satu per satu. Pasien menjawab paling banyak lima pertanyaan sederhana di Mobile JKN, jawabannya dicocokkan dengan isi klaim, dan klaim yang tidak cocok diteruskan ke verifikator. Fokusnya klaim fiktif, lama rawat yang diperpanjang, dan tindakan atau obat yang ditagih tetapi tidak diberikan.","Klaim dipilih secara acak dan berdasarkan risiko. AI mengubah isi klaim menjadi hal yang bisa diingat pasien: transfusi trombosit menjadi \"cairan dari kantong darah\", USG perut menjadi \"perut diolesi gel dingin\". Dari daftar kandidat, sistem memilih pertanyaan yang paling banyak memberi kepastian, maksimal lima. Jawaban berupa pilihan ganda yang tidak menggiring dan selalu ada opsi \"tidak ingat\". Sebelum menjawab, identitas pasien dicek lewat FRISTA. Hasilnya bukan satu skor, tetapi tanda per isi klaim: cocok, tidak cocok, atau belum jelas. Jika ada yang tidak cocok pada hal penting, misalnya lama rawat, verifikator yang memeriksa. Tidak ada penolakan klaim otomatis. Kalimat pertanyaan ditinjau klinisi dan diuji ke pasien, tidak ditulis AI saat itu juga. Data diproses di lingkungan BPJS sesuai UU PDP. Saat ini solusi berada di tahap prototipe, diuji internal dengan data buatan.","Target pilot: sinyal sampai ke verifikator paling lama 30 hari setelah pasien pulang. Pada kasus KPK, klaim 2022–2023 baru terungkap Juli 2024. Estimasi kami, 10 jawaban pasien cukup untuk membedakan rumah sakit seperti kasus tersebut dari rumah sakit normal. Target lain: temuan per 100 klaim yang diperiksa dua kali lipat dibanding pemilihan acak. Peserta terlindungi dari pencatutan identitas, dan rumah sakit yang jujur lebih jarang diperiksa sia-sia."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2831","tim":"Abcd","inov":"KlaimNexus","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2831_KlaimNexus.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Volume klaim jaminan kesehatan sangat besar, sementara verifikasi bergantung pada pemeriksaan manusia yang terbatas. Repeat Billing dan Claim Cloning sulit dideteksi karena jarang berupa salinan 100%: tanggal, nominal, obat, atau teks klinis bisa diubah sedikit agar lolos exact match. Di sisi lain, kemiripan tidak selalu mencurigakan karena kondisi klinis serupa dan rawat ulang yang sah bisa tampak mirip, sehingga rawan false positive dan pemeriksaan berulang.","Mengembangkan KlaimNexus, platform investigasi klaim berbantuan AI yang membantu verifier: (1) Detect, menemukan pasangan klaim yang layak diprioritaskan, termasuk yang sudah dimodifikasi; (2) Explain, menjelaskan atribut penyebab kemiripan beserta pola dan sinyal pendukung; (3) Investigate, menelusuri apakah pasangan tersebut bagian dari kelompok klaim yang lebih besar. Keputusan akhir tetap di tangan manusia (human-in-the-loop).","KlaimNexus adalah platform investigasi klaim berbantuan AI untuk mendeteksi Repeat Billing dan Claim Cloning. Sistem membandingkan pasangan klaim (claim pair) karena pola ini bersifat relasional. Similarity Engine menghitung kemiripan per atribut (diagnosis, prosedur, obat, teks klinis, nominal, tanggal) agar evidence mudah dibaca. Model ML memberi Priority Score dan Risk Tier (P1/P2/P3/Low) untuk mengurutkan review, bukan probabilitas fraud. Clinical Similarity Guard menekan false positive pada klaim yang mirip secara klinis namun sah. Verifier bekerja lewat Review Queue dan Claim Investigation dengan AI Explanation dan catatan, sementara Claim Family dan Claim Lineage menggabungkan pasangan terkait dalam graph agar investigasi tidak berulang. Tersedia mode manual dan Batch Upload CSV/XLSX. Teknologi: Python, Flask, SQLite, scikit-learn, Vanilla JS; data sintetis.","Verifier bekerja lebih efisien: ratusan kandidat menjadi antrean prioritas dengan evidence transparan, dan Claim Family mengurangi pemeriksaan berulang. Pola klaim yang lolos exact match lebih mudah ditemukan, sementara Clinical Guard mencegah faskes yang wajar diprioritaskan berlebihan. Pemisahan similarity, priority, dan verdict menekan risiko automation bias. Evaluasi awal (data sintetis): PR-AUC 0.7766."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2839","tim":"Nawasena","inov":"VeriKlaim AI","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2839_VeriKlaim_AI_Healthkathon_2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Audit klaim JKN pada FKRTL saat ini masih didominasi sistem berbasis aturan (rule-based) pada data tabular dan pemeriksaan berkas manual. Kelemahan mendasar pendekatan ini adalah kebutaan terhadap narasi klinis Rekam Medis Elektronik (RME). Sistem meloloskan klaim selama kode ICD valid, meski di catatan dokter tidak ditemukan bukti pemeriksaan objektif atau terapi yang memadai. Akibatnya, kecurangan bernilai tinggi seperti upcoding (menaikkan keparahan komorbiditas tanpa dasar klinis) dan klaim","Mengembangkan VeriKlaim AI, sistem Copilot berbasis Clinical NLP lokal untuk merekonsiliasi teks narasi RME terhadap klaim tagihan INA-CBGs\nMendeteksi anomali klaim upcoding, klaim fiktif, dan manipulasi pemeriksaan penunjang secara otomatis dan transparan\nMempercepat audit verifikator melalui Claim Risk Score dan penyorotan kalimat bukti rekam medis, guna menjaga integritas dan keberlangsungan dana amanat JKN.","VeriKlaim AI adalah platform copilot audit klaim cerdas berbasis Clinical NLP dan Medical LLM yang beroperasi secara on-premise di jaringan tertutup BPJS (patuh UU PDP). Sistem bekerja melalui 4 tahapan alur kerja:   \n1. Preprocessing & Normalisasi: Melakukan masking otomatis data pribadi pasien (PII) dan menerjemahkan singkatan medis lokal Indonesia ke terminologi baku.\n2. Clinical Entity Extraction (NER): Mengekstrak fakta medis objektif (gejala, tanda vital, nilai lab kuantitatif, laporan bedah, terapi obat) langsung dari catatan dokter.\n3. Semantic Cross-Validation: Mencocokkan fakta klinis terhadap kode klaim INA-CBGs (ICD-10/ICD-9-CM) serta Panduan Praktik Klinis Kemenkes untuk mengungkap upcoding dan tindakan fiktif.\n4. Explainable Dashboard: Menyajikan antrean klaim terurut berdasarkan Claim Risk Score (0-100) dan menyorot teks bukti di berkas RME secara transparan. Keputusan final klaim tetap berada di tangan verifikator (human-in-the-loop)","1. Efisiensi Waktu: Memangkas durasi audit rekam medis dari 15–20 menit menjadi <3 menit per berkas (menghemat waktu kerja hingga 80%).\n2. Cakupan 100%: Meningkatkan pengawasan dari sampling 5–10% menjadi 100% berkas rawat inap tertinjau otomatis sebelum disetujui.\n3. Mitigasi Kebocoran: Menekan potensi kelolosan klaim upcoding dan fiktif hingga 35–50% pada kasus berisiko tinggi.\n4. Akuntabilitas: Menyediakan audit trail berbasis bukti klinis untuk mempercepat pencairan klaim sah faskes."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Yanuar Milad","s":null},{"n":"Juliana","s":null}]},{"id":"2845","tim":"kelompok 9","inov":"JKN Workforce Monitor","kat":"Efisiensi Risiko pada Pemberi Kerja","f":"2845_Kelompok 9_Aqmal Abdillah Makmur_JKN Workforce Monitor_Proposal Healthkathon 2026.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN memiliki skala kepesertaan yang besar sehingga akurasi data menjadi penting. Salah satu risiko pada pemberi kerja adalah Pendaftaran Pekerja Sebagian (PDUK), yaitu kondisi ketika tidak seluruh pekerja terdaftar sebagai peserta JKN. JKN Workforce Monitor diusulkan sebagai sistem informasi yang mencocokkan data tenaga kerja dengan data kepesertaan JKN untuk mengidentifikasi potensi ketidaksesuaian dan mendukung proses verifikasi secara lebih terarah.","Mengembangkan konsep sistem informasi yang dapat membantu memantau kesesuaian data tenaga kerja dan kepesertaan JKN melalui proses data matching. Sistem ini bertujuan mengidentifikasi potensi pekerja yang belum terdaftar atau memiliki ketidaksesuaian data, sehingga mendukung proses verifikasi yang lebih cepat, terarah, dan berbasis data.","JKN Workforce Monitor merupakan konsep sistem informasi untuk memantau kesesuaian data tenaga kerja perusahaan dengan data kepesertaan JKN. Sistem melakukan validasi dan data matching untuk mengidentifikasi potensi pekerja yang belum terdaftar atau memiliki ketidaksesuaian data. Hasilnya dikategorikan menjadi Terdaftar, Tidak Ditemukan, dan Perlu Verifikasi, lalu ditampilkan melalui dashboard monitoring untuk mendukung proses verifikasi secara terarah. Menggunakan pendekatan rule-based matching yang transparan dan dapat diaudit, sistem berfungsi sebagai indikator awal, bukan penentu pelanggaran otomatis. Prototype menggunakan data sintetis atau anonim dan implementasi data JKN riil memerlukan akses resmi.","JKN Workforce Monitor diharapkan meningkatkan visibilitas data tenaga kerja dan kepesertaan JKN, mempercepat identifikasi potensi ketidaksesuaian, serta membuat proses verifikasi lebih terarah. Bagi pemberi kerja, solusi ini mendukung monitoring kepatuhan. Bagi BPJS Kesehatan, sistem membantu memprioritaskan proses verifikasi dan mendukung peningkatan integritas data kepesertaan JKN."],"r":[{"n":"Juliana","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2850","tim":"Tim Pantang Menyerah","inov":"Proposal Inovasi CekKlaim Sistem Pemeriksaan Awal Potensi Penagihan Ulang Klaim JKN Berbasis Pencoco","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2850_Proposal Inovasi CekKlaim Sistem Pemeriksaan Awal Potensi Penagihan Ulang Klaim JKN Berbasis Pencocokan Data.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Administrasi klaim menghubungkan pencatatan pelayanan dengan pengajuan pembayaran. Dalam lingkup CekKlaim, perhatian diarahkan pada apakah pengajuan baru berpotensi kembali menagih episode pelayanan yang sudah terdapat dalam riwayat dibayar. Pemeriksaan tersebut membutuhkan hubungan antara identitas pengajuan, episode, fasilitas, dan status pembayaran. Persamaan nominal atau peserta saja belum menjawab hubungan tersebut.\nPermenkes Nomor 16 Tahun 2019 menyediakan dasar pembahasan penagihan berula","Tujuan umum proposal ini adalah merancang dan menguji alat bantu pemeriksaan awal potensi penagihan ulang pada fasilitas kesehatan. Tujuan khusus mencakup penyusunan input terstruktur, pencocokan yang dapat dijelaskan, dokumentasi keputusan, serta pengukuran manfaat terhadap pekerjaan petugas. Produk diposisikan sebagai dukungan administrasi internal sebelum tindak lanjut melalui prosedur yang berlaku.\nInformasi publik akun penyelenggara menyebut Healthkathon 2026 dan kategori Efisiensi Risiko","CekKlaim merupakan inovasi berupa website internal yang dirancang sebagai alat bantu pemeriksaan awal potensi penagihan ulang klaim Jaminan Kesehatan Nasional (JKN) pada fasilitas kesehatan. Inovasi ini berangkat dari kebutuhan untuk membuat proses pemeriksaan administrasi klaim menjadi lebih terarah, transparan, dan terdokumentasi. Dalam proses pengelolaan klaim, adanya kemiripan antara pengajuan baru dan riwayat klaim yang telah dibayar belum dapat langsung diartikan sebagai kecurangan. Suatu pasangan data dapat muncul karena berbagai kondisi, seperti koreksi, pengajuan ulang sesuai prosedur, kunjungan yang sah, atau perubahan informasi administratif. Karena itu, petugas tetap membutuhkan proses penelusuran dan pemeriksaan sebelum mengambil keputusan. CekKlaim dirancang untuk membantu proses tersebut dengan memusatkan pencarian kandidat yang relevan, memberikan alasan penandaan berdasarkan data, serta menyediakan jejak keputusan yang dapat ditelusuri.\n\nPermasalahan utama yang ingin d","Dampak utama CekKlaim adalah perubahan pada proses pekerjaan administrasi, yaitu membantu petugas memperoleh kandidat pengajuan yang lebih terarah dan membantu pemeriksa memiliki catatan keputusan yang dapat ditelusuri. Manfaat CekKlaim tidak secara langsung diukur melalui perubahan kondisi kesehatan peserta, melainkan melalui peningkatan kualitas tata kelola administrasi. Proposal ini tidak mengklaim adanya penurunan penyakit, peningkatan hasil pengobatan, maupun penghematan dana JKN yang telah"],"r":[{"n":"Yanuar Milad","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Juliana","s":null}]},{"id":"2852","tim":"TranspemGo","inov":"JEJAK JKN: Sistem Penelusuran Bukti Layanan untuk Deteksi Dini Klaim Fiktif pada Program JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2852_JEJAK_JKN_Healthkathon2026 (1).pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Phantom billing terjadi ketika layanan yang tidak diberikan ditagihkan. Laporan Itjen Kemenkes (26 Juli 2024) atas fisioterapi Juli 2017–Juni 2018 di tiga RS menyebut 3.269 dari 4.341 tagihan diduga fiktif, senilai Rp501,27 juta. Verifikator perlu menelusuri bukti setiap sesi. Namun, catatan yang belum ditemukan dapat disebabkan data terlambat atau identitas salah. JEJAK JKN membantu mencocokkan bukti dan memisahkan kekurangan data dari ketidaksesuaian yang perlu diklarifikasi.","Mengembangkan alat bantu verifikator BPJS Kesehatan untuk mencocokkan sesi tagihan aktif dengan catatan layanan, memeriksa kelengkapan sumber, dan menandai isi personal identik antar-episode. Sistem menyertakan alasan aturan dan rujukan bukti untuk klarifikasi faskes. Target pilot adalah penurunan median waktu pemeriksaan sedikitnya 30% dibanding proses mitra pada tugas setara. Target ini akan diuji; keputusan fraud dan pembayaran tetap mengikuti kewenangan manusia.","JEJAK JKN adalah prototipe berbasis aturan untuk menelusuri bukti layanan fisioterapi. Sistem menghubungkan episode, peserta bertoken, fasilitas, sesi tagihan aktif, dan catatan layanan. R0 memeriksa kelengkapan sumber dan kecocokan identitas; R1 mencocokkan sesi aktif dengan catatan berstatus selesai serta memperhitungkan pembatalan dan versi terbaru; R2 mencari isi personal identik antar-episode dengan mengecualikan formulir standar. Hasil berupa \"Bukti konsisten\", \"Perlu klarifikasi\", atau \"Lengkapi data\", disertai alasan aturan dan rujukan bukti. Demo HTML, CSS, dan JavaScript berjalan di browser pada 40 episode sintetis, dilengkapi matriks sesi, tindak lanjut verifikator, serta ekspor CSV/JSON. Sebanyak 16 uji fungsi deterministik telah lulus. Pilot delapan minggu direncanakan di satu fasilitas setelah izin akses dan kontrak data tersedia. Sistem membantu pemeriksaan manusia; integrasi produksi dan penghematan aktual belum tervalidasi.","JEJAK JKN diharapkan mempercepat pemeriksaan bukti, membantu penentuan prioritas kasus, dan memudahkan klarifikasi faskes per sesi. Pilot mengukur waktu pemeriksaan, temuan material terkonfirmasi, beban klarifikasi, dan realisasi koreksi pembayaran. Simulasi 10.000 episode/bulan menghasilkan Rp22 juta bersih setelah biaya Rp8 juta, dengan asumsi prioritas 3%, konfirmasi 50%, koreksi Rp250.000/kasus, dan realisasi 80%. Nilai tersebut ilustratif; dampak aktual belum diukur."],"r":[{"n":"Susi Lusiani","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2853","tim":"Info KRS","inov":"SeeKlaim: Deteksi dini klaim berisiko untuk melindungi dana JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":"2853_SeeKlaim Deteksi dini klaim berisiko untuk melindungi dana JKN.pdf","fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program Jaminan Kesehatan Nasional (JKN) mengelola dana iuran dalam skala besar untuk menjamin akses layanan kesehatan masyarakat. Namun, risiko kecurangan dalam proses klaim, khususnya *phantom billing* (klaim palsu) dan *repeat billing* (klaim berulang), dapat mengurangi efisiensi pengelolaan dana dan berpotensi membebani proses verifikasi.\n\nVolume klaim yang besar membuat pemeriksaan manual terhadap seluruh klaim menjadi tidak efisien. Pada beberapa kasus, ketidakses
