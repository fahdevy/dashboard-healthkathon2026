l masih menggunakan data simulasi; keputusan atas klaim tetap memerlukan verifikasi auditor dan tenaga medis.","Solusi ini berpotensi mempercepat penapisan klaim, mengurangi beban pemeriksaan manual, dan memperkuat jejak audit atas indikasi pemecahan episode pelayanan. BPJS Kesehatan dapat memusatkan investigasi pada kasus berisiko, sementara fasilitas kesehatan memperoleh dasar klarifikasi yang transparan. Rekonstruksi episode diharapkan mendukung pencegahan pembayaran tidak tepat dan perlindungan dana JKN. Besaran penghematan belum terverifikasi dan perlu diuji menggunakan data klaim nyata."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2909","tim":"TwinNode","inov":"JKN CLAIM INTEGRITY INTELLIGENCE (JCII)","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["BPJS Kesehatan memverifikasi 1 miliar+ klaim dengan batas 15 hari kerja sesuai Perpres 82/2018. Keterbatasan verifikasi manual memicu celah upcoding keparahan tarif INA-CBG (+150% hingga +300%) dan kloning berkas fiktif. Di sisi lain, AI black-box dilarang karena rentan halusinasi dan tidak sah di depan audit BPK. JKN membutuhkan instrumen analitik hibrida yang deterministik, transparan, dan auditabel tanpa menggeser keputusan mutlak verifikator manusia (Human-in-the-Loop).","BPJS Kesehatan memverifikasi 1 miliar+ klaim dengan tenggat 15 hari kerja sesuai Perpres 82/2018. Keterbatasan verifikasi manual memicu celah upcoding tarif INA-CBG hingga +300% dan kloning berkas klaim. Di sisi lain, AI black-box dilarang karena rentan halusinasi dan tidak sah di hadapan audit BPK. JKN membutuhkan instrumen analitik hibrida yang deterministik, transparan, dan auditabel tanpa menggeser keputusan mutlak verifikator manusia (Human-in-the-Loop).","JKN Claim Integrity Intelligence (JCII) adalah platform analitik hibrida dan asisten verifikasi klaim berbasis bukti untuk mendeteksi anomali Upcoding dan Kloning berkas di FKRTL secara pra-pembayaran. Mengatasi beban 1 miliar+ klaim dan batas verifikasi 15 hari kerja, JCII memisahkan tugas secara tegas: Mesin Deterministik Matematis menghitung skor risiko tanpa risiko halusinasi berbasis 5 sinyal deviasi dan 8 dimensi kemiripan Jaccard, sementara JKN Audit Copilot (Human-in-the-Loop) membantu telaah narasi rekam medis dan draf dinas otomatis tanpa menggantikan wewenang verifikator manusia. Berstatus Working MVP (167/167 lulus uji regresi otomatis, latensi <0,25s), JCII menghubungkan portal BPJS dan faskes secara transparan, menghargai batas klinis PPK Kemenkes, mematuhi UU PDP No. 27/2022 via data sintetis ber-hash, serta menyediakan jejak audit permanen yang siap memenuhi standar audit BPK","JCII memangkas waktu telaah berkas kompleks dari 45 menit menjadi <5 menit (+88% efisiensi) dan mendeteksi kloning berkas secara instan (<1 ms). Solusi ini memproyeksikan reduksi kebocoran klaim 3%-7% pada kelompok risiko tinggi (high-risk pool) untuk menjaga ketahanan DJS BPJS Kesehatan. Selain itu, JCII menekan potensi sengketa klaim dengan faskes melalui pembuktian deviasi yang transparan dan objektif, sekaligus melindungi integritas mutu layanan bagi peserta JKN."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2911","tim":"Rujak Rujuk","inov":"MediRoute: Sistem Rekomendasi Rujukan Personal Berbasis Hybrid Adaptive Recommender untuk JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Perbedaan kemampuan layanan antar fasilitas dan kebutuhan pasien membuat pemilihan RS tujuan rujukan perlu mempertimbangkan lebih dari jenjang fasilitas. Informasi layanan, akses perjalanan, jadwal, dan preferensi pasien perlu dipertimbangkan bersama, sementara alasan keputusan perlu mudah ditelusuri. MediRoute dikembangkan untuk membantu pemilihan RS yang sesuai kebutuhan pasien dan mendukung evaluasi rujukan dalam ekosistem JKN.","Membantu tenaga kesehatan dan peserta JKN memilih RS tujuan rujukan yang memenuhi kebutuhan layanan serta mempertimbangkan akses dan preferensi pasien. MediRoute menyediakan rekomendasi dengan skor dan alasan yang dapat ditinjau, memperbarui model melalui feedback kunjungan, serta menyimpan riwayat pertimbangan untuk mendukung evaluasi oleh auditor. Keputusan rujukan tetap berada pada tenaga kesehatan.","MediRoute adalah prototipe aplikasi web rekomendasi rujukan personal berbasis Hybrid Adaptive Recommender untuk JKN. Sistem mengolah data pasien, fasilitas kesehatan, dan kebutuhan layanan untuk menyaring kandidat RS yang memenuhi persyaratan. Kandidat kemudian diperingkat berdasarkan perjalanan, waktu, aksesibilitas, kesinambungan RS, kecocokan fitur, dan estimasi pengalaman layanan. Bobot mengikuti tiga lingkup: regional, FKTP, dan pasien. Saat bobot terlatih belum tersedia, sistem menggunakan bobot lingkup di atasnya, dengan acuan pengetahuan sebagai titik awal regional. Hasil rekomendasi dilengkapi skor dan alasan untuk membantu keputusan tenaga kesehatan bersama pasien. Feedback kunjungan memperbarui model secara terbatas, sementara riwayat keputusan dan versi model tersimpan untuk peninjauan. Prototipe menyediakan portal pasien, FKTP, dan auditor dengan data simulasi rawat jalan di Manado. Integrasi resmi SATUSEHAT dan validasi klinis belum dilakukan.","MediRoute diharapkan membantu pasien memperoleh pilihan RS yang sesuai kebutuhan layanan dan aksesnya, mempercepat pertimbangan petugas, serta mengurangi potensi rujukan berulang akibat ketidaksesuaian tujuan. Riwayat skor, alternatif, dan alasan keputusan mendukung peninjauan yang lebih terarah bagi pengelola JKN. Pada tahap prototipe, dampak masih berupa target yang akan diuji melalui waktu pemilihan RS, kesesuaian rekomendasi, pengalaman pasien, dan kelengkapan alasan keputusan."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Juliana","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2912","tim":"Tagihan Hantu","inov":"CERMIN: Pekerja Melihat, AI Mendeteksi, Petugas Memutuskan","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kepatuhan pemberi kerja masih menjadi tantangan JKN: peserta aktif PPU Badan Usaha 2025 masih 7,98 juta di bawah target (DJSN). Modusnya antara lain mendaftarkan sebagian pekerja, melaporkan upah lebih rendah, dan memotong iuran tanpa menyetorkannya. Pekerja baru tahu kartunya nonaktif saat berobat. Pemeriksaan masih padat karya, dan pencocokan data hanya melihat yang dilaporkan, sehingga perusahaan yang menyembunyikan pekerja dari semua lembaga tetap tak terlihat.","Membangun CERMIN, solusi yang memperlihatkan kepada pekerja data kepesertaan yang dilaporkan perusahaannya melalui Mobile JKN, lalu mengolah verifikasi mereka bersama pencocokan data dan graf afiliasi menjadi skor risiko yang dapat dijelaskan. Tujuannya: (1) membuat pemeriksaan kepatuhan pemberi kerja lebih tepat sasaran, (2) memberi tahu pekerja lebih awal bila iuran tidak disetor, dan (3) mendorong perusahaan memperbaiki data secara mandiri sebelum diperiksa.","CERMIN bekerja dalam satu siklus. Pekerja melihat upah, status kerja, tanggal pendaftaran, dan setoran iuran yang dilaporkan perusahaan di Mobile JKN, menerima notifikasi bila iuran belum disetor, dan dapat menyanggah secara anonim. Mesin deteksi menggabungkan empat sinyal: pencocokan data (BPJS TK/WLKP, PPh 21, PBI), graf afiliasi antarperusahaan, agregasi sanggahan pekerja (minimal 3 penyanggah dan melampaui tingkat sanggahan keliru), serta isolation forest. Hasilnya berupa antrean prioritas pemeriksaan dengan alasan di setiap skor. Perusahaan diberi 14 hari untuk memperbaiki data, petugas yang memutuskan tindak lanjut, dan keputusan petugas memperbarui model. Prototype sudah berfungsi dan diuji pada data sintetis (600 badan usaha, 22.934 pekerja): 60 dari 60 pemeriksaan tepat sasaran dibanding sekitar 11 secara acak. Data peserta JKN riil tidak digunakan.","Bagi pekerja: tahu lebih awal bila iuran tidak disetor, bukan saat berobat. Bagi BPJS Kesehatan: kapasitas pemeriksaan yang terbatas diarahkan ke perusahaan berisiko tinggi; pada simulasi, pemeriksaan 5 kali lebih tepat sasaran dan 85% potensi iuran yang hilang tertangkap. Bagi pemberi kerja patuh: persaingan yang setara. Bagi APBN: pekerja aktif tidak lagi ditanggung PBI. Target pilot (estimasi): ketepatan pemeriksaan minimal 2 kali baseline cabang."],"r":[{"n":"Juliana","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2913","tim":"Anka","inov":"JagaPasien AI: AI untuk Menjaga Kesinambungan Pelayanan Pasien JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Dalam pelayanan JKN, kunjungan pasien yang berdekatan tidak selalu menandakan masalah. Kontrol terjadwal, penanganan gawat darurat, dan pemantauan penyakit kronis dapat membutuhkan kunjungan berulang. Namun, sebagian pola tetap layak ditelaah untuk mendukung pengelolaan risiko fasilitas kesehatan. Penilaian berdasarkan frekuensi saja berpotensi mengabaikan konteks pelayanan. Dibutuhkan alat bantu yang mampu memilah pola tidak biasa sekaligus mempertahankan informasi klinis yang relevan.","Mengembangkan JagaPasien AI sebagai alat bantu telaah awal pola kunjungan pasien JKN. Prototipe ini bertujuan mengidentifikasi pasangan kunjungan pada pasien dan fasilitas yang sama dalam tujuh hari, memprioritaskan pola tidak biasa dengan mempertimbangkan indikator konteks klinis, serta menyajikan kronologi dan alasan prioritas melalui dashboard. Hasilnya menjadi bahan review petugas, bukan keputusan otomatis mengenai fraud.","JagaPasien AI merupakan prototipe analisis pola kunjungan berbasis machine learning dan dashboard interaktif. Data kunjungan dipasangkan berdasarkan pasien dan fasilitas yang sama dengan jarak maksimal tujuh hari. Model Isolation Forest (unsupervised) menilai pola relatif tidak biasa menggunakan fitur waktu, kesamaan diagnosis/dokter/poli, status kunjungan, serta indikator konteks seperti IGD, kontrol terjadwal, dan pemantauan penyakit kronis. Hasil analisis dikelompokkan menjadi prioritas review tinggi, sedang, dan rendah, lalu disajikan melalui dashboard Streamlit untuk penelusuran kandidat dan detail kronologi. Pada simulasi data sintetis 10.000 pasien dan 35.009 kunjungan, sistem menganalisis 13.149 pasangan dan menghasilkan 6.114 kandidat review. Kandidat bukan bukti fraud. Prototipe belum menggunakan data klaim JKN nyata dan belum menjalani validasi klinis.","JagaPasien AI berpotensi membantu petugas memusatkan telaah pada pasangan kunjungan yang perlu ditinjau, memahami alasan prioritas melalui kronologi, dan mengurangi ketergantungan pada penilaian berdasarkan frekuensi semata. Pendekatan yang mempertimbangkan konteks klinis diharapkan mendukung efisiensi penelaahan risiko tanpa mengabaikan kesinambungan pelayanan. Dampak operasionalnya masih perlu diuji bersama ahli dan menggunakan data berizin."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2914","tim":"Klaim Sehat Analytics","inov":"Identifikasi Klaim Rawat Inap Tidak Wajar pada Program JKN Melalui Validasi Rekam Jejak Klinis Sekue","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["RITL adalah titik kebocoran dana JKN terbesar, dengan modus upcoding diagnosis dan perpanjangan hari rawat yang disengaja. Pada 2021, P034 (Caesarean Delivery) mencatat 421.215 admisi dengan biaya satuan Rp 4,5 juta (Kelas 3) hingga Rp 6,5 juta (Kelas 1). Audit konvensional hanya memeriksa klaim hari ini tanpa riwayat klinis pasien, sehingga fraud yang sempurna secara administratif lolos.","Membangun sistem deteksi klaim rawat inap tidak wajar yang: (1) merekonstruksi lintasan klinis pasien (RJTP?RJTL?RITL), (2) memvalidasi diagnosis berat lewat pre-condition, (3) mendeteksi anomali Length of Stay dengan Z-score per diagnosis, dan (4) menghasilkan laporan anomali beserta estimasi kerugian per kasus.","Path-Sentinel JKN adalah aplikasi web MVP fungsional yang menganalisis riwayat klinis pasien secara sekuensial. Sistem membangun timeline lintasan kunjungan per pasien (RJTP ? RJTL ? RITL) dan menjalankan empat lapis analitik secara bersamaan: Sequential Pre-Condition Validator (memverifikasi apakah diagnosis RITL memiliki rekam jejak gejala logis di hulu), LOS Z-Score Engine (mendeteksi perpanjangan hari rawat yang melampaui 2 standar deviasi dari distribusi nasional per kode ICD-10), Severity Mismatch Detector (mengidentifikasi ketidaksesuaian antara diagnosis dan tindakan yang diklaim), dan Readmission Tracker (menandai pola readmisi tidak wajar). Dataset baseline bersumber dari Tabel 5.19, 5.25, 5.26, dan 6.27 Statistik JKN 2016–2021. Antarmuka web responsif menampilkan timeline sekuensial per pasien dengan penanda anomali berwarna, tabel hasil terfilter, dan laporan PDF otomatis yang dapat langsung dibawa ke rapat investigasi.","Path-Sentinel JKN memverifikasi kewajaran klinis klaim berat dari rekam jejak historis pasien, sesuatu yang tidak mungkin dilakukan manual. Dengan cakupan 100% klaim RITL, sistem berpotensi mengungkap kebocoran dana puluhan hingga ratusan miliar rupiah per tahun, dan mempercepat investigasi dari 3-7 hari menjadi kurang dari 1 hari. Auditor mendapat laporan berbasis bukti, dan faskes yang jujur terlindungi dari persaingan tidak sehat."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2917","tim":"Los pollos hermanos","inov":"SaringJKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kebocoran dana JKN akibat fraud terdokumentasi: KPK (2024) menemukan Rp34-35 miliar klaim fiktif di 3 RS; 75,3% klaim fisioterapi di 3 RS diduga fiktif (2024); temuan KPK 2017 mencatat 1 juta klaim fiktif senilai Rp2 triliun. Rasio klaim 2025 mencapai 109% (beban Rp192,7 T vs iuran Rp176,7 T). Verifikasi manual per dokumen sulit mendeteksi pola lintas klaim dan lintas faskes, sehingga fraud lolos dan menekan dana JKN.","Membangun SaringJKN: sistem skoring risiko 0-100 untuk setiap klaim faskes berbasis kelengkapan dokumen, kewajaran tarif, lama rawat, dan duplikasi rekam medis, ditambah konteks pola tingkat faskes. Tujuannya agar tim verifikasi mengaudit klaim paling berisiko lebih dulu (bukan acak), dengan setiap skor explainable dan keputusan akhir tetap di tangan verifikator manusia.","SaringJKN memberi skor risiko 0-100 pada setiap klaim faskes lewat empat mesin skor: (1) kelengkapan dokumen berbobot pola faskes, (2) kewajaran tarif via z-score per kode diagnosis (upcoding), (3) kewajaran lama rawat vs standar, (4) duplikasi rekam medis antar pasien (cloning). Setiap skor disertai alasan yang bisa dibaca auditor. Output berupa daftar prioritas audit, bukan vonis otomatis; verifikator manusia memutuskan tindak lanjut. Prototype Python pada 2.000 klaim sintetis (data JKN riil dilarang tanpa izin): top-100 (5% beban audit) mencapai precision 83%, recall 58%, lift 11,5x vs audit acak. Sinyal pola faskes menaikkan precision 63% ke 83% (fraud sintetis sengaja dipusatkan di satu faskes). Keterbatasan: cloning terdeteksi sekitar separuh, upcoding ringan sebagian lolos; ini bukti konsep, angka akan berbeda pada data nyata. Rencana: kalibrasi 19-30 Okt, demo interaktif, lalu pilot data anonim BPJS (perlu izin) dan integrasi e-claim/SATUSEHAT.","Periksa 100 klaim teratas (5% beban kerja): 58% fraud tertangkap, 11,5x lipat dibanding audit acak yang hanya sekitar 7 klaim. Pada 200 teratas (10% beban): 89% tertangkap. Ilustrasi skala: jika kebocoran fraud 0,25-1% dari beban jaminan Rp192,7 T dan sistem menutup separuhnya, potensi sekitar Rp240-960 miliar/tahun (asumsi, bukan janji; angka pasti hanya terukur pada pilot). Manfaat: dana JKN lebih aman, faskes jujur terlindungi lewat klarifikasi berbasis bukti, audit tepat sasaran."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2919","tim":"The Three Musketeers","inov":"TelisikKlaim JKN — Asisten Review Risiko Upcoding Berbasis Bukti Klinis","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pada klaim JKN, kesesuaian kode diagnosis dan tindakan perlu diperiksa terhadap catatan klinis, waktu pelayanan, dan aturan pengodean. Verifikator juga harus membedakan dokumen yang belum tersedia dari tindakan yang memang tidak dilakukan. Celah bukti seperti ini berkaitan dengan risiko upcoding (modus 4) dan, pada kondisi tertentu, modus 14 atau 6. Tanpa penelusuran yang rapi, klarifikasi menjadi berulang dan penilaian berisiko keliru.","Merancang asisten pemeriksaan klaim JKN yang menelusuri dasar klinis setiap kode dan membantu verifikator meminta bukti yang tepat. Pengembangan dipusatkan pada risiko upcoding (modus 4). Pemeriksaan bukti pelaksanaan tindakan (modus 14) menjadi pendukung, sedangkan indikasi phantom billing (modus 6) hanya ditelaah bila tersedia bukti episode dari sumber independen. Hasil review tetap diputuskan petugas yang berwenang.","TelisikKlaim menerima kode klaim dan dokumen dari satu episode pelayanan. AI dirancang membaca narasi klinis, termasuk negasi dan kronologi, lalu menautkan temuan pada kutipan, waktu, sumber, dan versi dokumen. Validator memeriksa kesesuaian metadata serta aturan pengodean; bukti yang belum cukup akan diarahkan menjadi permintaan klarifikasi, bukan kesimpulan bahwa terjadi fraud. Fokus MVP adalah upcoding (modus 4): apakah kode yang diajukan didukung catatan klinis? Untuk modus 14, sistem membantu mencari bukti pelaksanaan tindakan yang belum ditemukan. Modus 6 merupakan perluasan terbatas yang memerlukan pembanding independen untuk memeriksa keberadaan episode. Saat bukti tambahan diterima, penilaian dapat diperbarui dan alasannya dicatat untuk diperiksa kembali oleh verifikator. Saat ini telah ada 12 uji unit yang lulus pada validator berbasis aturan dengan data sintetis internal. Ekstraksi AI end-to-end dan hasil klinis belum tervalidasi.","Targetnya adalah mempercepat penelusuran bukti, mengurangi permintaan klarifikasi yang tidak perlu, dan membuat alasan review lebih mudah diaudit. Faskes dapat mengetahui catatan mana yang perlu dilengkapi, sementara verifikator tetap memegang keputusan. Dampak akan diuji melalui ketepatan kutipan, jumlah langkah klarifikasi, eskalasi keliru, serta waktu pemeriksaan oleh reviewer. Belum ada dasar untuk mengklaim fraud yang ditemukan atau penghematan pembayaran JKN."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2922","tim":"Kata Awa YaaUyy","inov":"SEHATI: Verifikasi Klaim JKN Berbantuan AI melalui Integrasi Konfirmasi Peserta dan Bukti Faskes","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pengalaman peserta, catatan layanan faskes, dan data klaim JKN masih terpisah, sehingga petugas sulit memeriksa satu episode secara utuh. Ketidaksesuaian layanan dan klaim berulang dapat terlambat ditelaah; kekurangan dokumen juga berisiko memicu kesimpulan keliru. Dibutuhkan verifikasi yang menghubungkan ketiga sumber, memperjelas bukti, dan menjaga hak jawab faskes agar sinyal Phantom & Repeat Billing dapat ditindaklanjuti secara adil.","Membangun verifikasi berbasis episode yang menghubungkan pengalaman peserta, bukti layanan faskes, dan klaim untuk memprioritaskan sinyal Phantom & Repeat Billing. SEHATI bertujuan mempercepat telaah, meningkatkan keterlacakan bukti, serta menjaga hak jawab faskes melalui human-in-the-loop. Pilot akan menguji waktu telaah, mutu hasil verifikasi, dan kesalahan deteksi. AI menyarankan, manusia memutuskan.","SEHATI adalah prototype verifikasi episode layanan JKN yang menghubungkan aplikasi peserta, portal faskes, dan konsol petugas. Peserta mengonfirmasi pengalaman layanan; faskes melengkapi bukti serta klarifikasi; petugas menelaah hubungan layanan, dokumen, dan klaim dalam satu episode. Sistem menampilkan klaim berulang dan ketidaksesuaian bukti sebagai sinyal yang belum dibuktikan dalam antrean telaah. Simulasi Asisten AI merangkum konteks dan menyarankan tindak lanjut; petugas memutuskan. Hak jawab faskes, mekanisme koreksi, dan riwayat audit mendukung penelusuran proses. Prototype memakai data sintetis dan integrasi simulator. Sebelum pilot, minimisasi data, pseudonimisasi, akses berbasis peran, dan audit trail berantai hash perlu divalidasi sesuai UU PDP dan kerahasiaan data kesehatan. Data peserta JKN riil hanya dapat digunakan dengan izin resmi. Tidak ada pembayaran, koreksi klaim, atau sanksi otomatis.","SEHATI diharapkan membantu peserta mengonfirmasi layanan, memberi faskes jalur klarifikasi yang terlacak, dan mempercepat telaah petugas tanpa mengurangi mutu keputusan. Usulan pilot 12 minggu pada 2–3 faskes menargetkan penurunan median waktu telaah minimal 20% dibanding baseline yang sebanding. Evaluasi mencakup kelengkapan bukti, pemenuhan hak jawab, false positive, dan false negative. Target ini belum merupakan hasil aktual; penghematan rupiah belum diestimasi."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Susi Lusiani","s":null},{"n":"Juliana","s":null}]},{"id":"2923","tim":"Riadi Marta Dinata","inov":"Pemblokiran Rekayasa Diagnosis Sekunder dan Penggelembungan Tarif INA-CBGs pada Klaim JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Sistem INA-CBGs menetapkan tarif berdasarkan kombinasi diagnosis primer dan sekunder yang menentukan Severity Level. Menyisipkan diagnosis sekunder fiktif—umumnya I10 (Hipertensi)—dapat menaikkan Level 1 ke Level 3 dan mendongkrak tarif dari Rp 4,5 juta ke Rp 8,5 juta (+89%). Data DJSN 2021: I10 tercatat pada 1,25 juta kasus RJTL—dominan, dan sulit dikonfutasi satu per satu oleh auditor.","Membangun matriks probabilitas historis P(Dx_Sekunder|Dx_Primer) dari data JKN nasional; menghitung deviasi frekuensi observasi per faskes terhadap probabilitas historis tersebut; mendeteksi pola sistematis upcoding yang melampaui threshold deviasi; mengkuantifikasi gap tarif Rupiah dari setiap anomali Severity Level; dan menyediakan AI Chatbot Gemini agar auditor non-teknis dapat menganalisis data dalam bahasa Indonesia natural.","Comorbid-Sentinel JKN menghitung P_historis(Dx_Sek|Dx_Pri) dari Tabel 8.1–8.24 DJSN, kemudian membandingkannya dengan frekuensi observasi aktual per faskes menggunakan formula Deviasi = (Frek_Obs - P_historis) / P_historis × 100%. Risk Score dihitung dari Deviasi × log(Frekuensi + 1) untuk memperkuat pola sistematis. Threshold berlapis: >300% deviasi dengan frekuensi >50% = UPCODING KRITIS. Severity Level Mapping mengkuantifikasi gap tarif INA-CBGs aktual per anomali. Visualisasi utama: heatmap korelasi ICD-10 interaktif (D3.js) dengan gradasi hijau?kuning?merah. AI Chatbot Gemini dimuat dengan konteks data aktif—dapat menjawab pertanyaan seperti \"Mengapa RS X mencurigakan?\" atau \"Apakah I10 wajar untuk D24?\" dalam bahasa Indonesia, tanpa keahlian teknis dari auditor.","Satu-satunya sistem yang bekerja di dalam mekanisme INA-CBGs—bukan di sekelilingnya. Estimasi kerugian JKN dari 1% upcoding severity: Rp 200 miliar/tahun. Coverage meningkat dari sampling parsial ke 100% klaim RITL. Integrasi AI Chatbot Gemini menghilangkan barrier teknis sehingga tim audit non-teknis pun langsung dapat menggunakan sistem."],"r":[{"n":"Juliana","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2924","tim":"JKN Mboten Sare","inov":"Cognitive Clinical Auditing & Claim Integrity Defense Engine for BPJS Kesehatan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Skala layanan JKN sangat besar, sementara jumlah klaim terus bertambah dan kapasitas verifikator terbatas. Klaim yang kompleks juga memerlukan konteks klinis dan bukti pendukung agar dapat dinilai dengan tepat. Tantangannya bukan sekadar menemukan risiko, tetapi membantu memastikan kapasitas review diarahkan ke kasus yang paling material dan paling layak diperiksa lebih dahulu.","Membangun sistem pendukung keputusan bagi verifikator BPJS Kesehatan untuk memprioritaskan klaim FKRTL yang paling layak diperiksa berdasarkan kesesuaian klaim dengan bukti klinis, konteks episode, kekuatan bukti, dan materialitas. Sistem tidak menetapkan fraud atau menolak klaim otomatis; keputusan akhir tetap berada pada verifikator manusia.","Cognitive Clinical Auditing & Claim Integrity Defense Engine adalah prototipe riset fungsional berbasis data sintetis untuk membantu verifikator menentukan klaim mana yang perlu diperiksa lebih dahulu dan mengapa. Sistem menggabungkan aturan yang dapat diaudit, Gradient Boosting untuk ranking, bukti klinis/layanan, konteks episode, kekuatan bukti, dan materialitas menjadi Skor Prioritas Review. Tiga fokus utama adalah Upcoding, Phantom Billing, dan Unwarranted Readmission. Output diarahkan ke VERIFIKASI, KLARIFIKASI, RUJUK SPESIALIS, atau TANPA SINYAL PRIORITAS. Bukti yang belum tersedia atau tidak mutakhir tidak dianggap sebagai bukti layanan tidak dilakukan, tetapi diarahkan ke klarifikasi. Prototype menyediakan Daftar Prioritas, Klaim vs Bukti, Detail Bukti, dan Tindakan Verifikator. Seluruh data kompetisi bersifat sintetis dan keputusan akhir tetap pada manusia.","Solusi ini ditujukan untuk membuat kapasitas verifikasi lebih bernilai: kasus yang lebih material dan lebih kuat buktinya muncul lebih dahulu, sementara bukti yang belum lengkap diarahkan ke klarifikasi. Pada benchmark sintetis terkunci dengan kapasitas review 10%, hybrid evidence-aware ranking meningkatkan recall +7,88 poin persentase, synthetic value capture +5,02 poin, dan menurunkan false escalation 6,80 poin dibanding pembanding rule-evidence terkuat."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Juliana","s":null}]},{"id":"2925","tim":"TP SENTINEL","inov":"Penghentian Inflated Bills","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Faskes membeli alkes dari distributor yang dimiliki pemilik RS yang sama, lalu menagih BPJS dengan harga jauh di atas pasar. Dokumen terlihat sah: faktur ada, NPWP ada, izin PBF ada. Variansi ekstrem pada Tabel 6.13–6.36 DJSN membuktikan disparitas biaya satuan klaim antar Faskes yang tidak bisa dijelaskan perbedaan regional semata — ini adalah sidik jari digital Transfer Pricing dalam data JKN.","Menerapkan Arm's Length Principle (ALP) sebagai standar pengujian kewajaran harga klaim alkes Non-Kapitasi; mendeteksi pola persistensi ceiling price per Faskes; memetakan jaringan hubungan istimewa antara Faskes dan distributornya; dan menghasilkan laporan forensik berbasis standar OECD Transfer Pricing Guidelines yang diakui pengadilan pajak.","Transfer-Pricing Sentinel membawa instrumen yang ditakuti korporasi multinasional langsung ke audit klaim JKN. Tiga lapis deteksi bekerja bersamaan: ALP Benchmarking — setiap klaim dibandingkan Q3 nasional dari Tabel 6.13–6.36, deviasi > 40% = Red Flag; Network Investigation — peta kepemilikan entitas mendeteksi Related Party antara Faskes dan distributornya; Persistency Pattern — pola berulang ceiling price per Faskes per jenis alkes = indikasi sistemik. Dua sinyal bersamaan (ALP flag + Related Party) menghasilkan bukti investigatif yang tidak terbantahkan secara hukum pajak. AI Chatbot Gemini aktif dengan terminologi ALP dan Transfer Pricing forensik.","Pertama dalam JKN — membawa standar OECD dan PMK 213/2016 ke audit klaim Non-Kapitasi. Dari satu RS: Rp 660 juta/tahun diselamatkan (100 katarak/bulan × Rp 550K selisih). Jika 10 RS serupa: Rp 6,6 miliar/tahun, ROI positif tahun pertama. Tidak butuh alat fisik di Faskes — berbasis data klaim yang sudah ada."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2926","tim":"Ayi the kid","inov":"PROJECT MATILClaim","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program Jaminan Kesehatan Nasional (JKN) mengelola pengajuan klaim layanan kesehatan dalam jumlah besar dengan karakteristik data yang kompleks. Kondisi ini menimbulkan tantangan dalam mengidentifikasi ketidakwajaran klaim, khususnya pengajuan berulang (repeat billing), penagihan layanan yang tidak diberikan (phantom billing), dan ketidaksesuaian diagnosis, tindakan, serta tarif.","Mengembangkan MATILClaim, platform intelijen risiko klaim JKN yang mengintegrasikan deteksi anomali, pemeringkatan risiko, dan penjelasan berbasis bukti untuk membantu auditor memprioritaskan investigasi. Solusi ini bertujuan mengidentifikasi indikasi repeat billing dan phantom billing, membedakan pengajuan mencurigakan dari koreksi yang sah, mengurangi false positive, serta mendukung proses pemeriksaan yang lebih efisien, transparan, dan akuntabel.","MATILClaim (Medical Anomaly Tracking & Investigation Layer) adalah prototipe platform pendukung investigasi klaim JKN. Sistem mengolah data klaim terstruktur, menghubungkan riwayat pengajuan dan episode pelayanan, lalu menggabungkan pemeriksaan berbasis aturan dengan model machine learning untuk menghasilkan skor dan kategori risiko. Fitur False Positive Guard mempertimbangkan konteks koreksi administratif, pengajuan ulang yang sah, dan terapi berulang agar alert tidak otomatis dianggap fraud. Auditor dapat menelusuri indikator risiko, klaim terkait, dan alasan pemeringkatan melalui dashboard investigasi, analitik, serta visualisasi spasial fasilitas kesehatan. Prototipe diuji menggunakan 3.440 klaim sintetis dari 50 fasilitas dalam lingkungan simulasi; hasilnya belum membuktikan kinerja pada data operasional BPJS. Keputusan akhir tetap berada pada auditor setelah verifikasi bukti layanan.","MATILClaim diharapkan meningkatkan efisiensi pengawasan klaim JKN dengan mengarahkan perhatian auditor pada pengajuan yang memiliki indikator risiko paling relevan. Prioritisasi berbasis skor dan penjelasan membantu mempercepat penelaahan awal, sedangkan False Positive Guard berpotensi mengurangi pemeriksaan yang tidak perlu terhadap koreksi sah dan layanan berulang."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2927","tim":"Ngalap Berkah","inov":"TERANG_Proposal_Healthkathon2026_NgalapBerkah","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Iuran peserta PPU JKN sebesar 5% dari upah (4% pemberi kerja, 1% pekerja) bergantung pada kejujuran data pemberi kerja. Audit BPKP atas DJS Kesehatan 2018 mencatat 2.348 badan usaha tidak melaporkan gaji dengan benar dan 50.475 belum tertib bekerja sama. Pemeriksaan kepatuhan masih manual per kantor cabang, sementara peserta PPU mencapai 67,2 juta jiwa. Dibutuhkan penapis berbasis data agar pemeriksa tahu pemberi kerja mana yang perlu diperiksa lebih dulu.","Menyusun antrean pemeriksaan kepatuhan pemberi kerja yang berprioritas dari data kepesertaan BPJS, untuk mendeteksi pendaftaran pekerja sebagian, upah dilaporkan rendah, misklasifikasi status kerja, dan mutasi yang diulur. Setiap tanda disertai bukti angka agar dapat dijelaskan, keputusan tetap di pemeriksa tanpa sanksi otomatis, salah-tanda pada pemberi kerja patuh ditekan, dan data pribadi dilindungi sesuai UU PDP.","TERANG menautkan roster peserta PPU, pendaftaran PBPU, dan data FKTP untuk menyalakan empat sinyal: (1) pekerja dinonaktifkan dari PPU lalu mendaftar PBPU di FKTP yang sama dalam 14 hari (misklasifikasi); (2) upah menumpuk di UMK dan jauh di bawah sektor sepadan (upah rendah); (3) pencatatan pekerja lebih dari 30 hari setelah mulai kerja atau status aktif ganda (mutasi diulur); (4) selisih jumlah pekerja dengan data lintas lembaga (pekerja sebagian, fase 2). Skor dihitung dengan uji statistik dan ambang kebijakan, tanpa data medis, lalu disusun menjadi antrean risiko dengan kartu evidensi dan estimasi iuran yang bocor. Pemeriksa yang memutuskan. Prototipe pada data sintetis 2.500 pemberi kerja: presisi 99,8% di 5% antrean teratas dan 78% kebocoran tertangkap dengan 10% jam audit. Hasil ini dari data sintetis; tahap berikutnya pilot di 2–3 kantor cabang dengan data teranonimisasi berizin.","BPJS Kesehatan dapat memulihkan iuran secara lebih terarah; skenario dasar ilustratif sekitar Rp7,56 miliar per tahun, divalidasi saat pilot. Pemeriksa memakai jam audit pada pemberi kerja berisiko tertinggi, bukan sampling. Pemberi kerja patuh tidak ikut diperiksa tanpa alasan. Pekerja terdaftar sesuai statusnya sebagai PPU dan terlindungi tanpa putus. Keberhasilan diukur dari presisi antrean, iuran terkonfirmasi per jam, dan laju salah-tanda."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2929","tim":"JKN Sentinel","inov":"JKN Sentinel: Radar Risiko Klaim Faskes yang Dapat Dijelaskan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["JKN melayani >285 juta peserta (1 Juni 2026) dengan biaya pelayanan Rp158 triliun (2023), sehingga klaim faskes tak mungkin ditelaah manual semuanya. Sumber sekunder melaporkan potensi fraud/inefisiensi ±Rp866 miliar (2023), dan Tim PK-JKN pernah menemukan klaim fiktif fisioterapi serta manipulasi diagnosis operasi katarak di tiga RS swasta. Data JKN riil tidak boleh dipakai tanpa izin, jadi deteksi diuji dengan data sintetis. Kami membingkainya sebagai efisiensi dan integritas.","Membangun JKN Sentinel, radar risiko klaim yang dapat dijelaskan untuk membantu verifikator dan Tim PK-JKN memprioritaskan telaah. Tujuan khusus: (1) mendeteksi phantom/repeat billing, upcoding/unbundling, inflated bills/cloning, dan prolonged stay/readmisi dengan skor 0-100 dan reason code; (2) menyediakan Fraud Lab, klaim sintetis berlabel untuk menguji detektor tanpa data peserta; (3) keputusan akhir tetap di manusia; (4) menyiapkan pilot terkontrol bersama BPJS.","JKN Sentinel terdiri dari tiga komponen. (1) Sentinel Engine: 7 detektor dalam 3 klaster (duplikasi dan pemecahan episode, bukti layanan, deviasi terhadap kelompok sejawat) digabung dengan skor noisy-OR berbobot tingkat bukti, menghasilkan skor 0-100 dan reason code. (2) Fraud Lab: simulator klaim sintetis dengan injeksi 7 pola kecurangan pada dua tingkat kesulitan. (3) Verifier Cockpit: daftar prioritas, kartu kasus, dan umpan balik valid/bukan. Status: prototype berjalan pada 20.760 klaim sintetis dengan PR-AUC 0,70 (standard) dan 0,55 (hard), dibanding 0,10 dan 0,07 untuk Isolation Forest generik. Kuat pada modus struktural (cloning, repeat, pemecahan episode), sedang pada phantom billing, lemah pada upcoding, lama rawat, dan inflated bills. Hasil ini berasal dari data sintetis buatan sendiri dan belum menjadi bukti performa pada data riil. Berjalan di 1 core CPU tanpa GPU dengan biaya tunai Rp0.","Verifikator dan Tim PK-JKN menelaah klaim berisiko tertinggi lebih dulu, lengkap dengan alasan tertulis. Faskes jujur dapat mode pra-penagihan dengan false-positive terkendali (pembandingan sejawat). Diukur dengan Precision@K dan Recall@K per modus, waktu telaah per klaim, dan beban false-positive per faskes; target pilot ditetapkan bersama BPJS. Ilustrasi (bukan proyeksi): efisiensi 0,1% dari Rp158 triliun = Rp158 miliar. Masih estimasi; perlu diuji pada data riil lewat pilot berizin."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Susi Lusiani","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2930","tim":"Sprinters","inov":"TEPAT, Triase dan Peringatan Dini Peserta Tertunggak","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Per 30 September 2025, sebanyak 13,93 juta dari 14,12 juta peserta JKN yang nonaktif karena menunggak merupakan peserta PBPU Mandiri. Data tunggakan tidak memuat alasan menunggak, sehingga peserta yang mengalami penurunan kemampuan ekonomi, peserta yang lalai, dan peserta yang melunasi tunggakan hanya menjelang rawat inap tercatat dengan status yang sama. Selain itu, batas denda 45 hari setelah kepesertaan aktif kembali berpotensi dihindari dengan menunda rawat inap terjadwal.","TEPAT bertujuan membantu petugas BPJS Kesehatan menetapkan prioritas penanganan peserta dan intervensi yang sesuai. Tujuan khususnya adalah (1) memperkirakan peserta aktif yang berisiko menunggak dalam tiga bulan sebelum jatuh tempo tanggal 10, (2) mengarahkan peserta yang telah menunggak ke intervensi yang sesuai dengan alasannya, dan (3) menguji penumpukan rawat inap terjadwal setelah hari ke-45. Sistem hanya memberikan prioritas dan alasan; keputusan tetap berada pada petugas.","TEPAT memanfaatkan data milik BPJS Kesehatan, yaitu riwayat pembayaran, status kepesertaan, ringkasan klaim, kelas, autodebet, dan flag DTSEN. Komponen pertama adalah regresi logistik pada panel peserta-bulan yang dibandingkan dengan metode sederhana, yaitu pengurutan berdasarkan jumlah bulan menunggak. Metode sederhana memadai bagi peserta yang pernah menunggak, sehingga model hanya digunakan bagi yang belum pernah menunggak. Komponen kedua adalah triase berbasis aturan ke empat rute: cek kelayakan PBI, pengingat/autodebet/REHAB, verifikasi pola reaktivasi, dan verifikasi kemampuan bayar. Peserta DTSEN desil 1–5 tidak pernah dimasukkan ke rute verifikasi. Komponen ketiga adalah uji bunching pada hari ke-45 dengan rawat inap IGD sebagai plasebo. Pengujian pada data sintetis 20.000 peserta menghasilkan AUC 0,854 dan presisi rute verifikasi 98%; lonjakan yang ditanam terdeteksi, sedangkan plasebo tidak menunjukkan sinyal. Hasil ini menguji metode, bukan kinerja pada data BPJS.","Dengan daftar prioritas 2% peserta aktif per bulan dan tiga skenario asumsi, 7–56 ribu peserta per bulan diperkirakan tidak kehilangan penjaminan dan iuran Rp3,5–84,5 miliar per tahun tetap diterima. Nilai tersebut paling tinggi setara 0,4% tunggakan PBPU Mandiri. Manfaat utamanya adalah kontak yang lebih tepat sasaran, rujukan PBI yang lebih cepat bagi peserta tidak mampu, dan bukti agregat untuk mengevaluasi aturan denda 45 hari. Efek kontak akan diukur melalui uji coba terkontrol."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Susi Lusiani","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2931","tim":"SAKSI","inov":"SAKSI - Sistem Asisten Konfirmasi Suara Interaktif","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Verifikasi klaim JKN saat ini bersandar pada dokumen dari faskes. Klaim yang tidak sesuai bisa tetap tampak rapi secara administrasi, seperti kasus klaim fiktif Rp 34 miliar di tiga rumah sakit (KPK, 2024) yang memakai data warga tanpa layanan nyata. AI BPJS sudah menandai ±5% klaim berisiko, tetapi tetap membaca dokumen yang sama. Dengan 725,3 juta layanan per tahun, yang belum dimiliki BPJS adalah sumber data kedua yang independen: konfirmasi langsung dari peserta.","SAKSI bertujuan menambahkan suara peserta sebagai bukti kedua dalam verifikasi klaim. Klaim berisiko dikonfirmasi langsung ke peserta lewat AI Call, lalu jawabannya dicocokkan dengan data klaim. Dengan begitu, verifikator mendapat bukti independen sebelum klaim dibayar, kecurangan faskes lebih mudah terdeteksi, dan peserta ikut menjaga dana JKN tanpa perlu smartphone atau aplikasi.","SAKSI (Sistem Asisten Konfirmasi Suara Interaktif) bekerja dalam tiga langkah. Pertama, pilih: klaim berisiko dipilih dengan aturan sederhana, ditambah sampel acak agar tidak bisa ditebak faskes. Kedua, tanya: AI Call menelepon peserta (telepon biasa atau WhatsApp) dengan alur terkunci, yaitu sapa dan minta izin, cek identitas, maksimal tiga pertanyaan terbuka, lalu tutup atau eskalasi ke petugas. AI tidak menyebut diagnosis, tidak meminta OTP atau pembayaran, dan nomor diambil dari data kepesertaan BPJS, bukan dari faskes. Ketiga, putuskan: jawaban peserta diubah menjadi data terstruktur, dicocokkan per field dengan klaim (layanan, waktu, lama rawat, obat), dan tampil berdampingan di dosier verifikator. Keputusan akhir tetap di tangan manusia. SAKSI mencakup 13 dari 20 modus kecurangan faskes, antara lain phantom billing, repeat billing, prolonged stay, upcoding, dan manipulasi obat. Prototype sudah berjalan dengan data sintetis.","Untuk pilot 10.000 peserta, dengan asumsi 60% tersambung dan 5% jawaban tidak cocok, sekitar 300 kasus masuk antrean verifikator dengan bukti dari peserta. Biayanya ±Rp 750 per peserta (±Rp 7,5 juta total), atau ±0,3% dari rata-rata biaya satu layanan JKN. Faskes jujur lebih jarang diperiksa, verifikator mendapat bukti kedua tanpa kerja manual, peserta terlindungi dari penyalahgunaan identitas, dan setiap klaim berpeluang ditanyakan sehingga menimbulkan efek jera."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2932","tim":"TIF WANI","inov":"WASRIKAGENT AI","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Cakupan jaminan sosial ketenagakerjaan baru mencapai 36% dari angkatan kerja. Dari 878.000 pemberi kerja aktif, sebanyak 523.000 perusahaan (59,5%) terindikasi belum patuh, mencakup 490.000 Perusahaan Daftar Sebagian (PDS) dan 95.000 penunggak iuran.Inspeksi terpadu menemukan 3.645 perusahaan melanggar dan memulihkan hak 56.119 pekerja. WasrikAgent AI hadir mengotomatisasi pengawasan untuk menghentikan kebocoran iuran JKN secara presisi.","Mengembangkan platform kecerdasan audit otonom WasrikAgent AI (Autonomous Multi-Agent Web Intelligence Platform) berbasis Human-in-the-Loop guna mengidentifikasi, mendeteksi, dan memitigasi risiko kebocoran penerimaan iuran (revenue leakage) pada segmen Pemberi Kerja secara presisi, akuntabel, dan real-time","WasrikAgent AI adalah platform kecerdasan audit berbasis Autonomous Multi-Agent AI dan Human-in-the-Loop (HITL) untuk mengatasi kebocoran iuran JKN (revenue leakage) segmen Pemberi Kerja (PPU) pada Healthkathon 2026 [7, 9]. Dari 878 ribu pemberi kerja, 523 ribu (59,5%) terindikasi belum patuh, mencakup 490 ribu Perusahaan Daftar Sebagian (PDS/PDUK, under-reporting wage) dan 95 ribu penunggak iuran.\nPlatform ini mengolaborasikan 4 agen AI spesialis (Payroll, Workforce, Collusion, Orchestrator) merekonsiliasi slip gaji, mutasi pekerja, dan klaim faskes secara otonom (<12 detik/berkas, akurasi Vision-OCR 96,4%). Melalui Dual-Pane Workbench, sistem menyajikan bukti side-by-side, skor risiko (0–100), dan draf sanksi TMP2T (PP 86/2013)., dengan otoritas hukum 100% di tangan Auditor Wasrik. Dibangun oleh tim multidisiplin (Dosen IT, Sekdin Disnakerin, AI Engineer), sistem ini 100% patuh UU PDP dengan data sintetis.","WasrikAgent AI memberikan dampak nyata bagi ekosistem JKN:\nBPJS: Memangkas waktu audit dari 45 menit ke <12 detik/berkas serta menutup revenue leakage dari 523 ribu badan usaha belum patuh.\nPekerja: Memulihkan hak jaminan sosial riil dari manipulasi under-reporting wage dan pendaftaran sebagian (PDUK).\nTata Kelola: Mempercepat otomatisasi sanksi TMP2T berbasis Human-in-the-Loop sesuai Rencana Aksi KPK"],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Yanuar Milad","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2934","tim":"1","inov":"SAKURA AI: Scalable Audit Kernel for Uncovering Risk Anomalies","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN mengelola anggaran ~Rp190 T/tahun, namun berisiko mengalami kebocoran Dana Jaminan Sosial akibat kecurangan seperti manipulasi diagnosis (upcoding) dan pemecahan episode/unbundling di FKRTL. Kasus KPK 2024 membuktikan fraud sistemik hingga Rp35 M. Verifikasi manual/rule-based kaku sering memicu false positive dan alert fatigue bagi verifikator. Diperlukan sistem analitika cerdas berbasis AI yang fleksibel, presisi, & menjaga privasi data sesuai UU PDP tanpa menggantikan peran manusia","1. Mengembangkan Sakura AI sebagai decision support system berbasis Human-in-the-Loop untuk mendeteksi upcoding dan unbundling secara real-time.\n2. Menyediakan fitur Sakura Text-to-SQL Studio dengan privacy-first data masking untuk mempermudah auditor membuat kueri fleksibel.\n3. Mengoptimalkan waktu verifikasi dari 15 menit menjadi <2 menit per kasus.\n4. Mencegah kebocoran anggaran DJS BPJS Kesehatan sekaligus melindungi peserta JKN dari tindakan medis berulang yang tidak perlu.","Sakura AI (Scalable Audit Kernel for Uncovering Risk Anomalies) ialah platform AI Decision Support System berbasis 3-Layer Analytics untuk verifikator BPJS Kesehatan. Sistem mengintegrasikan: (1) Clinical Semantic Reasoner berbasis LLM untuk memahami konteks rekam medis; (2) Temporal Patient Journey Graph Analytics untuk melacak garis waktu tindakan; & (3) Peer-Group Dynamic Outlier ML untuk mendeteksi anomali statistik faskes. Fitur utama meliputi Sakura Text-to-SQL Studio yang memungkinkan auditor membuat kueri audit dengan bahasa natural, dilengkapi Privacy-First Data Masking (UU PDP compliant) pada sampel data. Hasil analisis disajikan dalam Triage Dashboard (Jalur Merah/Kuning/Hijau) dan Audit Brief Card interaktif yang memuat bukti klinis, rujukan PMK 3/2023, serta rekomendasi tindakan. Sistem dilengkapi Cron Scheduler untuk penjadwalan audit otomatis & Portal Sanggah Faskes. Bertindak murni sebagai decision support (Human-in-the-Loop), keputusan final tetap di tangan verifikator","1. BPJS Kesehatan: Efisiensi waktu audit hingga 80% (<2 menit/klaim), mengurangi false positive, dan potensi cost avoidance DJS sebesar 3–5% dari total klaim FKRTL.\n2. Peserta JKN: Perlindungan dari pemecahan tindakan berulang yang tidak perlu, menghemat biaya transportasi, waktu antrean, dan risiko kesehatan.\n3. Fasilitas Kesehatan: Transparansi proses verifikasi klaim berbasis regulasi resmi, edukasi koding INA-CBGs, dan meminimalkan sengketa klaim (dispute) menggantung."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2935","tim":"Code Gas","inov":"APP AI - Anjungan Pendaftaran Pintar berbasis AI","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Peserta JKN mengajukan 132.319 aduan ke BPJS Kesehatan sepanjang 2025, dan alasan terbanyak warga berobat jalan tanpa jaminan kesehatan adalah pelayanan yang lama (Susenas 2025). Di meja pendaftaran RS, verifikasi biometrik sering gagal pada lansia: sidik jari halus, wajah tidak terbaca. Saat itu terjadi, RS memakai approval manual atau sidik jari diwakilkan keluarga. BPK pernah menemukan kartu BPJS dipakai pasien yang tidak berhak tanpa sidik jari.","Mempersempit penyalahgunaan dan pemalsuan identitas peserta di pendaftaran rumah sakit tanpa membuat lansia tertahan. Kami ingin menaikkan keberhasilan verifikasi wajah FRISTA pada lansia lewat panduan suara, kamera yang membingkai wajah otomatis, dan lampu. Setiap kegagalan verifikasi dan setiap approval harus tercatat beserta alasannya, supaya BPJS bisa meninjau pola per NIK. Pasien yang gagal verifikasi tetap dilayani petugas.","APP AI adalah kios pendaftaran rumah sakit yang dipandu avatar bernama Sapa. Pasien cukup bicara ke mikrofon, dan Sapa menjawab dengan suara serta subtitle besar. Setelah pasien memberi izin, kios memindai kartu JKN atau KTP, lalu FRISTA mencocokkan wajah 1:1 dengan pemilik kartu. Kamera OBSBOT dengan pelacakan wajah dan lampu membantu wajah lansia terbaca. Pasien menjawab kontrol atau rujukan baru, lalu memindai suratnya. OCR membandingkan nama, NIK, tanggal lahir, dan masa berlaku rujukan dengan data peserta; beda data ditandai untuk petugas. Jawaban lisan dipetakan ke opsi tertutup oleh Jev dari TypeSafe. Bila Jev ragu, Claude Haiku 5.5 dimintai pendapat kedua. Nama, NIK, dan poli hanya tampil di layar dan tidak diucapkan. AI tidak menulis ke SIMRS atau BPJS: petugas memeriksa draf lalu menyetujuinya. Log kegagalan dan approval dipakai BPJS untuk menemukan pola, misalnya NIK yang berulang kali gagal FRISTA lalu lolos lewat approval.","Approval manual per 1.000 kunjungan diharapkan turun seiring naiknya keberhasilan FRISTA pada lansia; sasarannya ditetapkan dari baseline saat pilot. Setiap kegagalan verifikasi tercatat dengan alasan, sehingga verifikator BPJS punya daftar tinjauan per NIK. Beda data ketahuan sebelum pasien sampai di loket. Lansia bisa mendaftar cukup dengan bicara, dan pasien yang gagal verifikasi tetap dilayani petugas.\nKami tidak mengklaim penghematan rupiah sebelum ada data pilot."],"r":[{"n":"Juliana","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2936","tim":"UNLOGIC","inov":"REALITY-JKN_Healthkathon_2026_UNLOGIC","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Verifikasi klaim JKN memerlukan penelusuran catatan pelayanan, waktu tindakan, dan hubungan antarklaim. Pemeriksaan manual dapat memakan waktu saat petugas membandingkan catatan dan menemukan ketidakkonsistenan, indikasi phantom billing, atau repeat billing. REALITY-JKN dirancang untuk membantu menyajikan bukti yang dapat ditelusuri mengenai ketidakkonsistenan waktu dan rangkaian pelayanan, dengan pengembangan awal menggunakan data sintetis.","Membantu verifikator merekonstruksi lini masa pelayanan, mengidentifikasi ketidakkonsistenan waktu dan indikasi duplikasi episode berdasarkan aturan, serta menampilkan hubungan antarcatatan dan bukti konflik melalui dashboard. Sistem juga membantu memprioritaskan klaim untuk ditinjau. Kelayakannya dievaluasi dengan data sintetis berdasarkan precision, recall, F1-score, false positive, dan waktu peninjauan.","REALITY-JKN (Service Reality Engine for JKN Claim Integrity) adalah sistem pendukung verifikasi klaim berbasis Temporal & Episode Consistency Engine. Sistem mengolah data administratif, seperti ID klaim, identitas pasien dan tenaga medis yang dipseudonimkan, waktu pelayanan, jenis tindakan, dan fasilitas kesehatan menjadi rangkaian service events. Aturan pemeriksaan digunakan untuk menemukan konflik waktu antar-pelayanan (provider overlap) dan indikasi duplikasi episode. Dashboard menyajikan daftar klaim berstatus “Perlu Verifikasi”, lini masa pelayanan, hubungan antarcatatan, lokasi konflik, dan bukti pendukung. Pengembangan awal menggunakan data sintetis. Sistem tidak menetapkan fraud atau menolak klaim secara otomatis; keputusan akhir tetap berada pada verifikator berwenang.","REALITY-JKN diharapkan membantu menyajikan informasi verifikasi secara terstruktur, mendukung identifikasi ketidakkonsistenan klaim, membantu fasilitas kesehatan meninjau ketidaksesuaian pencatatan, dan memperkuat integritas verifikasi JKN. Dampak dievaluasi melalui simulasi data sintetis dengan mengukur precision, recall, F1-score, false positive, dan waktu peninjauan. Sistem merupakan alat bantu, bukan pengganti keputusan verifikator."],"r":[{"n":"I Made Karistiawan","s":null},{"n":"Djaka Santosa","s":null},{"n":"Ardhy Widhiantoro","s":null}]},{"id":"2940","tim":"Saya dapat laporan","inov":"SENTINEL-JKN: Smart Electronic Network for Real-Time Fraud Detection & Risk Mitigation in JKN Claims","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Tingginya rasio klaim dan potensi defisit Dana Jaminan Sosial (DJS) BPJS Kesehatan dipicu oleh kebocoran akibat fraud medis di faskes. Modus kecurangan kini kian terorganisir, seperti copy-paste rekam medis massal, upcoding, dan phantom billing. Sementara itu, verifikasi manual terbatas oleh personil di tengah jutaan klaim. Integrasi RME SATUSEHAT membuka peluang beralih dari audit post-payment ke pencegahan pre-payment berbasis AI.","Mengembangkan platform AI SENTINEL-JKN yang terintegrasi dengan gateway RME dan sistem klaim BPJS Kesehatan untuk pencegahan kecurangan pra-pembayaran (pre-payment prevention). Inovasi ini bertujuan membongkar anomali klaim secara real-time, meningkatkan akurasi verifikasi, memangkas waktu verifikasi hingga 85%, serta mempercepat pencairan klaim bersih (clean claims) bagi faskes patuh di bawah 24 jam.","SENTINEL-JKN adalah middleware intelligence layer antara Gateway RME (SATUSEHAT) dan Core Application Claim BPJS Kesehatan yang mengintegrasikan tiga modul AI:   NLP Clinical Similarity Engine (BioBERT): mengekstraksi teks naratif RME untuk mendeteksi fabrikasi dan copy-paste catatan medis antarpasien.   Graph Neural Network (GNN) Anomaly Detector: memetakan relasi heterogen Pasien-Dokter-Faskes guna membongkar kluster phantom billing.   Medical Logic Rule Engine: memvalidasi kesesuaian tindakan dan obat terhadap ICD-10/INA-CBGs guna mencegah upcoding dan unbundling.   Ketiga modul menghasilkan Fraud Risk Score (FRS, 0–100%) sebelum klaim dibayar:   FRS <30% (Low Risk): disetujui otomatis (fast-track payout).   30% = FRS = 70% (Medium Risk): verifikasi dokumen pendukung tambahan.   FRS >70% (High Risk): ditangguhkan otomatis (auto-hold) untuk audit verifikator secara mendalam.","Penyelamatan Keuangan: Mencegah potensi kebocoran anggaran Dana Jaminan Sosial (DJS) dengan menyelamatkan 60%–70% kebocoran dana akibat fraud klaim harian.   Efisiensi Verifikasi Operasional: Mengurangi beban verifikasi manual hingga 80%–85%, memungkinkan verifikator berfokus pada audit kasus berisiko tinggi.   Percepatan Klaim Faskes Patuh: Memberikan kepastian pencairan klaim kurang dari 24 jam bagi fasilitas kesehatan yang memiliki rekam jejak bersih (clean claims)."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Juliana","s":null}]},{"id":"2941","tim":"Tree Musketir","inov":"Omni-Sense_JKN___Forensik_Energi_IoT_untuk_Blokir_Phantom_Billing_20261009002043","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Proses audit klaim JKN saat ini masih mengandalkan pencocokan dokumen administratif (kuitansi dan rekam medis) yang rentan terhadap pemalsuan. Prosedur Rawat Jalan Tingkat Lanjut (RJTL) berbasis mesin (seperti Hemodialisis/cuci darah, Diatermi, dan Terapi Fisik) memiliki volume kunjungan yang tinggi sehingga sangat rawan disisipi klaim fiktif (phantom billing) tanpa ada bukti penggunaan alat yang valid. Dibutuhkan sistem verifikasi objektif yang tidak dapat disuap atau direkayasa ulang,","• Sensor PZEM 004T di stopkontak mesin HD: mencatat watt, ampere, kWh setiap detik\n• Log energi adalah saksi bisu tidak bisa disuap, tidak bisa direkayasa retroaktif\n• Rekonsiliasi harian: Siklus IoT vs Klaim BPJS ? selisih > 2 % = phantom billing terkonfirmasi\n• 1 sensor Rp 80.000 bisa menghemat BPJS ratusan juta dari 1 mesin HD pertahun\n—","Latar Belakang Masalah: Audit konvensional rentan kecurangan karena hanya membandingkan dokumen administratif dan rekam medis yang mudah dipalsukan, sementara prosedur berbasis mesin memiliki potensi kerugian JKN hingga triliunan rupiah.","Pencegahan Kebocoran Keuangan JKN. Efisiensi Anggaran Berbasis ROI Tinggi, Bukti Audit yang Tidak Terbantahkan, dan Keadilan bagi Faskes dan Pasien."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2942","tim":"Cakra Data","inov":"Cakra Data","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim fraud di Program JKN masih terjadi. Audit tim gabungan KPK, Kemenkes, BPJS Kesehatan, dan BPKP terhadap 6 rumah sakit di 3 provinsi menemukan 3 rumah sakit terindikasi klaim fiktif, dengan indikasi kerugian negara sekitar Rp35 miliar. Pada Mei 2026, Kejari Jember menaikkan dugaan fraud klaim JKN ke tahap penyidikan.\n\nMasalah juga muncul dari kode diagnosis yang tidak tepat. Sebuah penelitian di rumah sakit rujukan di Priangan Timur memeriksa 87 rekam medis kasus tifoid. Hasilnya, 31,03% ko","1. Membantu verifikator mengecek kesesuaian diagnosis, terapi, dan tarif pada klaim JKN.\n2. Menandai klaim yang janggal beserta alasannya, lalu mengurutkannya menurut skor risiko, sehingga verifikator tahu mana yang diperiksa lebih dulu.\n3. Menyediakan referensi obat (lewat foto, nama penyakit, atau nama obat) untuk mengecek apakah obat di klaim cocok dengan diagnosisnya.\n4. Menjaga keputusan akhir tetap di manusia, dengan sistem hanya menandai dan memberi referensi.","Cakra Data adalah sistem berbasis web untuk verifikator klaim JKN. Fokusnya sub-tema manipulasi diagnosis dan/atau tindakan (upcoding), dengan dukungan pengecekan tindakan pengobatan yang tidak sesuai indikasi medis.\n\nSistem punya dua fitur:\n\nCek kesesuaian klaim. Klaim dicek memakai aturan (dari Berita Acara BPJS dan ICD-10) dan model machine learning untuk skor risiko. Contohnya, diagnosis tifoid A01.0 tanpa tes serologi akan ditandai, dan sistem menyarankan Z03.8 (suspek tifoid).\nReferensi obat. Pengguna bisa memotret kemasan obat, mencari lewat nama penyakit atau kode ICD-10, atau mencari lewat nama obat. Hasilnya nama obat, kemasan, fungsi, dan penyakit terkait, dari data BPOM, Fornas, dan PNPK.\n\nSistem hanya menandai dan memberi referensi. Sistem tidak mendiagnosis dan tidak meresepkan, dan keputusan tetap pada verifikator. Saat ini solusi masih berupa mockup dengan data sintetis.","Bagi verifikator: kerja lebih terarah karena klaim diurutkan menurut skor risiko, bukan hanya sampel acak. Aturan terpusat dan sama untuk semua klaim, sehingga tidak bergantung pada pesan di WhatsApp. Referensi obat cukup satu pencarian.\n\nBagi rumah sakit: kode diagnosis dan tarif lebih tepat, sehingga lebih kecil kemungkinan klaim ditolak atau dikoreksi.\n\nBagi BPJS Kesehatan dan peserta JKN: risiko klaim janggal turun, sehingga dana program lebih terjaga.\n\nCara mengukurnya: recall (berapa banya"],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2943","tim":"Tim Pasti Menang","inov":"Cek Layananku","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Tingginya kecurangan seperti klaim fiktif sering lolos karena verifikasi BPJS hanya mengandalkan dokumen rumah sakit yang mudah direkayasa. Padahal, pasien adalah saksi mata terbaik di lapangan. Sayangnya, mereka tidak bisa ikut mengawasi karena rincian tagihan medis menggunakan kode-kode rumit yang tidak dipahami orang awam.","Tujuan kami adalah memberdayakan pasien rawat inap sebagai saksi independen untuk mencegah kecurangan klaim. Kami ingin menerjemahkan tagihan rumah sakit yang penuh kode medis ke bahasa sehari-hari. Dengan begitu, pasien bisa dengan mudah mengonfirmasi apakah layanan yang ditagihkan benar-benar mereka terima, sehingga BPJS punya bukti nyata langsung dari lapangan untuk menindak faskes curang.","Cek Layananku\" adalah fitur di Mobile JKN (dan WhatsApp) yang mengajak pasien rawat inap mengecek kewajaran tagihan mereka. Cara kerjanya simpel:\n- Pertama, kecerdasan buatan (AI) akan menerjemahkan kode medis rumah sakit menjadi bahasa yang mudah dimengerti awam, divalidasi dengan kamus resmi Kemenkes agar sangat akurat.\n- Kedua, agar pasien tidak terganggu (spam), sistem pintar kami (Active Learning) hanya akan mengirim notifikasi untuk tagihan-tagihan yang paling mencurigakan atau berisiko tinggi.\n- Ketiga, pasien cukup menjawab pertanyaan gampang di HP mereka, misalnya: \"Benarkah Bapak dirawat 5 hari di Kelas 1?\".\n- Terakhir, jika pasien menjawab \"Tidak\", sistem langsung memberi tanda bahaya (red flag) di layar petugas BPJS untuk diinvestigasi lebih lanjut. Identitas pasien dijamin rahasia. Intinya: AI yang menyaring, pasien yang bersaksi, dan BPJS yang memutuskan. Solusi ini juga dilengkapi fitur suara untuk lansia.","1. Bagi BPJS Kesehatan: Menghemat dana JKN dari klaim fiktif dan mempermudah penentuan prioritas audit rumah sakit berkat laporan langsung dari pasien.\n2. Bagi Fasilitas Kesehatan: Menciptakan efek jera bagi oknum curang karena merasa diawasi pasien, sekaligus melindungi rumah sakit yang jujur dari persaingan tidak sehat.\n3. Bagi Pasien: Melindungi keaslian rekam medis dari diagnosis palsu dan memberi ruang bagi pasien untuk ikut menjaga dana JKN hanya lewat ketukan di HP."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Yanuar Milad","s":null},{"n":"Juliana","s":null}]},{"id":"2945","tim":"JAMINOVA","inov":"Identifikasi Anomali Peresepan Obat Tidak Relevan JKN Melalui Unsupervised Association Rule Discover","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kebocoran farmasi JKN tersebar dalam jutaan transaksi peresepan individual yang masing-masing tampak wajar jika dilihat terpisah. Tidak ada sistem yang secara otomatis memvalidasi kewajaran kombinasi obat terhadap diagnosis. Data DJSN Tabel 8.9 mencatat 9,5 juta kunjungan ISPA — ladang paling subur untuk penyisipan antibiotik premium tidak standar yang nilainya kecil per kunjungan namun masif secara agregat.","Menerapkan Association Rule Mining unsupervised pada data resep untuk menemukan sendiri pola asosiasi normal antara diagnosis dan obat; mendeteksi penyimpangan dengan metrik Lift tinggi dan Confidence rendah sebagai anomali peresepan paksa; mengkuantifikasi akumulasi Rupiah mark-up per faskes; dan menyediakan AI Chatbot Gemini agar auditor farmasi dapat bertanya langsung dalam bahasa Indonesia natural tanpa keahlian statistik.","Pharma-Trace JKN menerapkan teknik yang sama digunakan Amazon untuk menemukan \"popok dan bir\" — tanpa perlu diberi tahu apa yang harus dicari. Setiap resep ditokenisasi sebagai keranjang {Diagnosis, Obat_1, ..., Obat_n}. FP-Growth menemukan frequent itemset dan association rules. Rule normal: Confidence tinggi (J069?Paracetamol: 98%, Lift 1,02×). Rule anomali: Confidence rendah + Lift tinggi (J069?Antibiotik Premium: 4%, Lift 4,21×) = pola peresepan paksa yang sistematis, bukan kebutuhan klinis. Basket Cards visual menampilkan item merah langsung terlihat. Ticker real-time bergulir semua item aktif. Polifarmasi terdeteksi via threshold item per diagnosis. Sistem sepenuhnya unsupervised — tidak butuh label fraud historis. AI Chatbot Gemini kontekstual aktif.","Satu-satunya sistem ARM unsupervised di Healthkathon — menemukan anomali jenis baru yang belum terdokumentasi. Potensi micro-leakage dari 5 diagnosis teratas: Rp 39 miliar/tahun (asumsi 1% terpengaruh). Coverage 100% resep Non-Kapitasi. Sistem self-discovering: semakin banyak data, semakin akurat — tanpa pembaruan aturan manual"],"r":[{"n":"Yanuar Milad","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2951","tim":"Healthkathon IoT 2026","inov":"Penutupan Celah Pengurangan Sediaan Obat Kronis JKN Melalui Penguncian Klaim Berbasis Sensor Berat","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Apotek Faskes JKN menagih 30 tablet ke BPJS namun menyerahkan 15 tablet ke pasien. Selisih dikembalikan ke stok atau dijual ke pasien umum. Tidak ada mekanisme yang memverifikasi berapa tablet yang benar-benar berpindah tangan. Tabel 8.9 DJSN mencatat 9,38 juta kunjungan Hipertensi — obat kronis bulanan yang paling rawan pengurangan sediaan, potensi kerugian Rp 703 miliar/tahun.","Membangun kabinet obat cerdas berbasis sensor berat (load cell) yang mengukur ?Berat miligram saat apoteker mengambil obat; merekonsiliasi secara real-time antara kuantitas fisik yang keluar dengan nilai klaim yang diajukan; menolak klaim secara otomatis di sumbernya jika tagihan melebihi fisik tablet yang tercatat; dan menyediakan AI Chatbot untuk query rekonsiliasi farmasi.","Pharmaco-Lock JKN memasang sensor load cell pada setiap laci kabinet obat. Saat apoteker mengambil obat, berat sebelum dan sesudah pengambilan dicatat: ?Berat ÷ Bobot_per_tablet = Tablet_Fisik. Jika tagihan ke BPJS lebih besar dari tablet fisik yang keluar, klaim ditolak otomatis di titik penyerahan; yaitu sebelum dana cair. Solenoid lock memastikan laci hanya terbuka via scan resep resmi. Log sensor append-only tidak dapat dimodifikasi retroaktif, menjadikannya bukti forensik langsung. Biaya komponen Rp 360K/kabinet vs kerugian Hipertensi Rp 703 miliar/tahun menghasilkan ROI 195× dalam setahun.","Menutup blind spot terbesar audit farmasi JKN: selisih antara obat yang ditagihkan dengan yang diterima pasien. Potensi penghematan > Rp 800 miliar/tahun dari lima diagnosis teratas. ROI 195× dari investasi sensor nasional Rp 3,6 miliar. Timbangan tidak bisa berbohong — ini pembuktian berbasis fisika, bukan dokumen."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Juliana","s":null}]},{"id":"2952","tim":"Array Club","inov":"Identifikasi Rekayasa Klaim Rawat Inap JKN Melalui Deteksi Anomali Struktural Representasi Matriks","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Manipulasi klaim RITL yang paling canggih tersembunyi bukan dalam satu nilai anomali, melainkan dalam pola relasi antar-variabel: diagnosis sekunder disisipkan bertahap untuk melegitimasi perpanjangan LOS. Gap hari rawat Kelas 1 (1.317/10k) vs Kelas 3 (508/10k) terus melebar — bukan karena perbedaan medis, melainkan karena eksploitasi sistematis yang tidak terdeteksi audit konvensional.","Mentransformasikan profil klaim multivariabel (diagnosis, tindakan, LOS, biaya harian) menjadi representasi matriks 2D; mendeteksi deformasi struktural yang mengindikasikan Prolonged LOS artifisial atau penyisipan diagnosis sekunder; menghasilkan heatmap interaktif yang memungkinkan auditor mengenali klaster anomali secara visual tanpa membaca ribuan baris data; dan menyediakan AI Chatbot Gemini untuk interpretasi kluster.","Matrix-Sentinel JKN menerapkan teknik Tabular-to-Matrix Transformation — pendekatan yang digunakan riset fraud detection global — pada data klaim RITL. Setiap klaim ditransformasikan menjadi matriks 2D (fitur × hari rawat), lalu dianalisis strukturnya. Klaim normal menghasilkan pola \"rapi\" sesuai kurva kesembuhan medis; klaim yang dimanipulasi menghasilkan deformasi diagonal (LOS diperpanjang) atau penumpukan kolom (diagnosis disisipkan bertahap). Deteksi berbasis Mahalanobis Distance dari centroid distribusi normal. Heatmap interaktif D3.js menyajikan ratusan profil sekaligus — anomali menyala langsung tanpa perlu membaca satu baris pun. AI Chatbot Gemini menginterpretasi kluster dalam bahasa Indonesia natural.","Menangkap fraud bertahap yang lolos model statistik biasa karena tidak ada spike tunggal. Potensi penghematan Rp 200 miliar+/tahun dari Prolonged LOS dan upcoding RITL yang selama ini tidak terdeteksi. Coverage 100% klaim, kecepatan < 1 detik per klaim, dan teknik state-of-the-art global yang pertama kali diterapkan untuk audit JKN Indonesia."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Yanuar Milad","s":null},{"n":"Juliana","s":null}]},{"id":"2953","tim":"Tim-Tam","inov":"KlaimLens: Antrean Audit Klaim Rumah Sakit Berbasis Teks Klinis dan Graf Identitas","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Rasio klaim JKN sudah di atas 100% sejak 2023 (105,9% pada 2024, data DJSN). Pada Juli 2024, tim gabungan Kemenkes, KPK, BPKP, dan BPJS mengumumkan temuan klaim fisioterapi: dari 4.341 klaim, 3.269 (75,3%) tidak punya rekam medis. Pada operasi katarak, hanya 14 dari 39 sampel pasien yang diagnosisnya sesuai. Data klaim itu berasal dari 2017–2018 dan baru diumumkan 2024. Saya ingin verifikator bisa menemukan klaim seperti ini lebih cepat, sebelum bertahun-tahun lewat.","Membangun prototype KlaimLens untuk membantu verifikator BPJS Kesehatan dan tim PK-JKN memprioritaskan klaim rumah sakit yang perlu diaudit. KlaimLens memeriksa tiga hal: kesesuaian resume medis dengan kode INA-CBG, kemiripan resume antarklaim, dan pola identitas peserta lintas faskes. Hasilnya antrean audit berperingkat dengan alasan per klaim. Keputusan tetap di verifikator. Prototype diuji pada data sintetis, tanpa data peserta JKN riil.","KlaimLens membaca setiap klaim rumah sakit dengan tiga cara. Pertama, resume medis dicocokkan dengan diagnosis, tindakan, dan tingkat keparahan pada kode INA-CBG yang ditagihkan. Kedua, resume diukur kemiripannya dengan resume pasien lain untuk menemukan salinan. Ketiga, hubungan pasien, rumah sakit, dan waktu dibuat menjadi graf, untuk melihat identitas yang dipakai berulang atau lonjakan klaim seragam dari satu wilayah dalam waktu singkat. Ketiga sinyal digabung menjadi skor, lalu klaim diurutkan sebagai antrean audit. Tiap klaim membawa tiga alasan teratas dan buktinya, misalnya potongan resume atau pasangan klaim yang mirip. Pemrosesan dan data sensitif tetap di sisi lokal. Model bahasa di cloud hanya merangkum temuan yang sudah dianonimkan dan tidak ikut memutuskan. Saat ini KlaimLens masih berupa ide. Saya menyiapkan prototype dengan data sintetis dan 7 skenario kecurangan, lalu mengujinya terhadap pembanding sederhana. Tidak ada data peserta JKN riil yang dipakai.","Harapan saya: verifikator memeriksa klaim yang paling mungkin bermasalah lebih dulu, bukan menyisir acak. Rumah sakit yang jujur tidak ikut terperiksa tanpa alasan, dan dana JKN lebih terjaga. Dampak ini belum terbukti. Saya akan mengukurnya di data sintetis: precision dan recall pada kapasitas audit kecil, perbandingan dengan aturan sederhana, dan selisih salah tandai antar kelas rumah sakit. Nilai rupiah belum saya klaim karena butuh uji data riil dengan izin BPJS."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Yanuar Milad","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2954","tim":"Alkaf","inov":"Penghentian Klaim Fiktif dan Tagihan Obat Tidak Wajar JKN Melalui Validasi Anomali Biaya Satuan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Penggelembungan tagihan obat/alat kesehatan dan klaim fiktif adalah bentuk kerugian JKN yang paling langsung terukur dalam Rupiah—namun tidak ada sistem yang memvalidasinya secara otomatis. Data DJSN (Tabel 6.27): biaya RITL Kelas 1 Rp 6,54 juta, Kelas 3 Rp 4,52 juta. Tagihan yang menyimpang ekstrem dari baseline nasional ini adalah sinyal fraud yang selama ini diabaikan oleh sistem konvensional.","Membandingkan total tagihan per klaim terhadap baseline nasional DJSN untuk layanan dan kelas yang sama; menghitung deviasi persentase secara instan; mengestimasi Rupiah mark-up yang tidak wajar per klaim; mengidentifikasi faskes dengan pola deviasi persisten melalui Financial Pattern Recognition; dan menyediakan AI Chatbot Gemini agar auditor dapat mengajukan pertanyaan investigasi dalam bahasa Indonesia natural.","Rx-Trace JKN menjalankan dua lapis deteksi paralel. \nLapis pertama: Deviasi Engine membandingkan tagihan aktual terhadap 6 baseline \ndari Tabel 6.15 & 6.27 DJSN (2 layanan × 3 kelas). \nFormula: Deviasi = (Tagihan - Baseline) / Baseline × 100%; Flag jika >200%. \nEstimasi mark-up: Rp mark-up = max(0, Tagihan - Baseline × 2). \nLapis kedua: Financial Pattern Recognition mengakumulasi deviasi per faskes menjadi \nPattern Score—faskes dengan lonjakan berulang pada diagnosis ringan teridentifikasi \nsebagai anomali sistematis, bukan kebetulan. \nMembedakan kenaikan biaya sah (komplikasi medis nyata menghasilkan pola konsisten) dari mark-up buatan (lonjakan terisolasi di faskes tertentu). Scatter plot D3.js interaktif: sumbu X = baseline, sumbu Y = tagihan aktual; garis merah 3× = threshold kritis. Ukuran titik = estimasi Rp mark-up. AI Chatbot Gemini kontekstual aktif.","Satu-satunya sistem yang mengaudit JKN dalam bahasa yang paling jujur: Rupiah. Potensi kerugian JKN dari inflated bills: Rp 200–600 miliar/tahun. Coverage meningkat dari sampling <1% ke 100% klaim. Waktu audit turun dari minggu ke <1 detik per klaim. Setiap Rupiah yang terdeteksi anomali langsung dikuantifikasi dan siap dilaporkan."],"r":[{"n":"Juliana","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2955","tim":"NEXUS","inov":"JKN GUARD: AI Multi-Signal Healthcare Risk Intelligence","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pengelolaan risiko JKN menghadapi tantangan berupa ketersebaran data peserta, riwayat pelayanan, dan klaim. JKN GUARD dikembangkan sebagai sistem pendukung keputusan berbasis AI yang menghubungkan berbagai sinyal risiko untuk mendeteksi anomali, menyajikan bukti, dan menentukan prioritas verifikasi. Dengan pendekatan human-in-the-loop, sistem membantu pemeriksaan lebih terarah tanpa menetapkan kecurangan secara otomatis, sehingga mendukung efisiensi dan integritas program JKN.","Tujuan JKN GUARD adalah mengintegrasikan berbagai data peserta dan pelayanan kesehatan untuk mendeteksi anomali, menghubungkan sinyal risiko, menyajikan bukti yang dapat dijelaskan, serta menentukan prioritas verifikasi. Sistem ini diharapkan meningkatkan efisiensi pemeriksaan, mengurangi beban verifikasi manual, dan mendukung pengambilan keputusan yang transparan demi menjaga integritas program JKN.","JKN GUARD (AI Multi-Signal Healthcare Risk Intelligence) adalah sistem pendukung keputusan berbasis untuk meningkatkan efisiensi pengelolaan risiko Program Jaminan Kesehatan Nasional (JKN). Sistem ini menghubungkan sinyal identitas peserta, riwayat pelayanan, klaim, konsistensi klinis, obat dan alat kesehatan, hubungan penyedia layanan, serta pola waktu. Analisis multi-sinyal membantu mendeteksi anomali, menentukan prioritas risiko, dan menyajikan alasan serta bukti pendukung. Participant 360° merangkum riwayat pelayanan, sedangkan Claim Screening Engine menyaring karakteristik klaim yang tidak wajar. Hasil analisis menjadi rekomendasi verifikasi, bukan keputusan otomatis tentang kecurangan. Dengan pendekatan human-in-the-loop, keputusan akhir tetap pada petugas berwenang melalui verifikasi dan investigasi. JKN GUARD diharapkan membantu memprioritaskan pemeriksaan, mengurangi beban verifikasi manual, dan mendukung integritas JKN dengan menjaga privasi, keamanan data, serta hak peserta.","JKN GUARD meningkatkan efisiensi pemeriksaan risiko JKN dengan menghubungkan data peserta, riwayat pelayanan, dan klaim. Sistem membantu petugas mengenali anomali, menentukan prioritas verifikasi, serta meninjau alasan dan bukti. Pendekatan ini berpotensi mengurangi pemeriksaan yang kurang terarah, memperkuat transparansi dan jejak audit, serta mendukung integritas dana JKN. AI pun memberi rekomendasi; keputusan akhir tetap dilakukan manusia dengan menjaga privasi, keamanan data dan hak peserta."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2956","tim":"Zhavin","inov":"PanduSehat: Pemandu Suara ke Puskesmas dan Bukti Kunjungan untuk Cegah Klaim Fiktif JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim fiktif (phantom billing) menggerus Dana Jaminan Sosial. Tim gabungan KPK, Kemenkes, BPJS Kesehatan, dan BPKP menemukan dugaan kerugian sekitar Rp35 miliar di 3 dari 6 RS sampel, dengan modus merekayasa dokumen klaim. Di sisi lain, peserta JKN tunanetra dari keluarga kurang mampu sulit mencapai faskes sendiri dan bergantung pada orang lain, sehingga kehadiran mereka sulit dibuktikan secara independen. Hubungan keduanya adalah hipotesis kami yang akan diuji di pilot.","Membuat peserta JKN tunanetra dapat berjalan ke puskesmas terdekat secara mandiri hanya dengan headset dan ponsel Android. 2) Menyediakan sinyal kehadiran opt-in yang independen dari dokumen klaim. 3) Membantu verifikator BPJS memprioritaskan klaim janggal (phantom dan repeat billing) dengan alasan yang jelas, dengan keputusan akhir tetap di tangan manusia.","PanduSehat adalah aplikasi Android berbasis perintah suara bahasa Indonesia. Pengguna berkata “Antar ke puskesmas terdekat”, lalu rute jalan kaki Google Maps dibacakan lewat headset. Saat tiba, aplikasi mengumumkan “Anda sudah tiba di Puskesmas X” dan meminta persetujuan suara untuk menyimpan bukti kunjungan (hanya lokasi, waktu, dan ID faskes; ID peserta dipseudonimkan; tanpa pelacakan terus-menerus). Mesin pencocokan membandingkan kunjungan dengan klaim per faskes dan periode memakai aturan transparan dan Isolation Forest, lalu menampilkan daftar prioritas beserta alasan di dashboard verifikator BPJS. Tidak ada sanksi otomatis. Prototype memakai data sintetis dan data publik, sesuai UU PDP; tidak ada data peserta JKN riil tanpa izin resmi. Tahap saat ini: antara ide dan mockup.","Target pilot (hipotesis, belum terbukti): mayoritas rute selesai tanpa bantuan orang lain (target awal 80%); ada sinyal kunjungan independen untuk pengguna yang setuju; verifikator mendapat peringkat prioritas klaim janggal sehingga pemeriksaan lebih terfokus. Manfaat: peserta lebih mandiri, faskes jujur terlindungi dari klaim palsu atas nama mereka, dan Dana JKN lebih terjaga. Estimasi penghematan rupiah menunggu data pilot."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2959","tim":"Aegis","inov":"AegisGraph-JKN (Multi-Agent Temporal Graph Neural Network & Privacy-Preserving Audit Engine)","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pengelolaan data skala besar JKN oleh BPJS Kesehatan dihadapkan pada tingginya volume transaksi klaim yang rentan terhadap praktik fraud seperti phantom billing dan cloning. Sistem verifikasi konvensional saat ini masih bersifat terisolasi dan linier, sehingga gagal mendeteksi sindikat kolusi lintas faskes. Transformasi digital mutlak diperlukan untuk mengalihkan audit menuju analitik relasional secara real-time.","Membangun sistem audit klaim berbasis Knowledge Graph dan Temporal Graph Neural Network (T-GCN) yang terintegrasi dengan standar SatuSehat. Bertujuan mendeteksi pola kecurangan secara preventif sebelum klaim dibayarkan (pre-payment audit), menekan angka false positive, serta menjaga kerahasiaan data sesuai UU PDP.","AegisGraph-JKN mentransformasi log rekam medis elektronik dan transaksi klaim ke dalam bentuk jaringan relasional dinamis (Knowledge Graph). Dengan mengombinasikan algoritma Temporal Graph Neural Network (T-GCN) dan Autonomous AI Agent (fokus utama pada Phantom & Cloning Detection Agent), sistem ini menganalisis anomali spasio-temporal lintas fasilitas kesehatan secara presisi.\nDilengkapi antarmuka Human-in-the-Loop (HITL) dan visualisasi transparan Explainable AI (Graph SHAP), verifikator dapat menelusuri akar anomali dengan cepat. Keamanan data dijamin melalui arsitektur privasi terdistribusi dan penggunaan 100% data simulasi sintetis (untuk skala MVP) sesuai ketentuan perlindungan data pribadi.","Efisiensi pencegahan risiko kebocoran dana JKN sebesar 1,5% hingga 3,0% dari total potensi klaim anomali di fasilitas kesehatan rujukan tingkat lanjutan (FKTL). Memangkas waktu tinjauan audit klaim hingga 60% dengan bantuan visualisasi transparan (Graph SHAP), menekan angka false positive hingga 45%, serta memastikan proses pencairan bagi fasilitas kesehatan yang jujur menjadi lebih cepat."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Djaka Santosa","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2961","tim":"Combination","inov":"Medsure","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Medisure berangkat dari kenyataan mengenai klaim rumah sakit swasta yang tertunda hingga miliaran rupiah dan berdampak pada biaya operasional. Meski informasi tersebut belum terverifikasi secara independen, keluhan ini menjadi dasar untuk mengeksplorasi solusi teknologi. Medisure berfokus pada pemeriksaan kelengkapan dokumen, konsistensi informasi, dan indikasi duplikasi klaim guna mengurangi pengerjaan ulang serta mempermudah proses klar
