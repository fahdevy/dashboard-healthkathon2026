si, sedangkan keputusan akhir tetap pada verifikator. Proposal ini memetakan delapan indikator kematangan Pemerintah Digital, termasuk tata kelola, layanan, kompetensi SDM, kolaborasi, kualitas data, dan pelindungan data pribadi. Keamanan dirancang melalui minimisasi data, de-identifikasi, pembatasan akses berbasis peran, dan audit trail. Saat ini, JagaKlaim masih berupa mockup UI/UX dan belum diuji dengan data klaim aktual. Pengembangan selanjutnya memerlukan validasi pengguna, pengujian model, evaluasi kinerja, dan penilaian keamanan.","JagaKlaim berpotensi membantu verifikator memprioritaskan klaim yang perlu diperiksa melalui skor dan faktor risiko. Sistem diharapkan mendukung verifikasi yang lebih terarah, transparan, dan akuntabel serta mendorong ketepatan dokumentasi dan pengodean klaim. Pemetaan indikator kematangan Pemerintah Digital membantu mengidentifikasi kebutuhan tata kelola, kualitas data, keamanan, dan kompetensi SDM. Dampak ini masih berupa potensi karena mockup belum diuji dengan data klaim aktual secara nyata."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2574","tim":"SMARTDOSE","inov":"SPHira Analytics: AI-Assisted Clinical Claim Risk Intelligence for JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Keberlanjutan finansial program JKN terancam oleh manipulasi klaim di Fasilitas Kesehatan, seperti phantom billing dan ketidakwajaran kuantitas obat/alkes. Dengan jutaan klaim per bulan, proses verifikasi manual secara acak (random sampling) menjadi sangat lambat, tidak efisien, dan rawan kebobolan. BPJS Kesehatan membutuhkan alat cerdas yang tidak hanya mendeteksi pencilan, tetapi mampu memprioritaskan klaim berisiko tinggi secara presisi berdasarkan aturan klinis farmasi.","Proposal ini bertujuan mengimplementasikan SPHira Analytics, sebuah sistem AI-Assisted Clinical Claim Risk Intelligence. Tujuan utamanya adalah mengubah paradigma pengawasan dari random sampling menjadi Prioritas Audit Berbasis AI. SPHira bertujuan membantu verifikator dengan menyajikan antrean klaim berisiko tertinggi (Priority Queue), guna mencegah kebocoran dana akibat manipulasi obat dan alkes tanpa mengganggu alur pelayanan pasien yang sah.","SPHira Analytics adalah Enterprise MVP yang memadukan keahlian analitik data dengan Kecerdasan Buatan untuk mencegah kebocoran JKN. SPHira menggunakan 6 Mesin Hibrida: (1) Statistical Engine untuk mendeteksi anomali tagihan global, (2) Peer Engine untuk komparasi kewajaran antar spesialis/faskes sejenis, (3) Evidence Consistency untuk mengecek rasio selisih antara tagihan klinis (obat/alkes) dengan kuantitas pada bukti rekam medis, (4) Temporal Engine untuk melacak lonjakan klaim sesaat (burst), (5) Network Intelligence untuk pemetaan relasi kolusi, dan (6) Machine Learning (Isolation Forest). SPHira mengadopsi prinsip Human-in-the-Loop. AI tidak memblokir klaim secara otomatis, melainkan menghasilkan skor prioritas risiko (0-100) dan Insight investigasi menggunakan Generative AI. Keputusan akhir tetap berada di tangan manusia melalui fitur Audit Trail yang akuntabel.","Implementasi SPHira Analytics memberikan dampak signifikan bagi ekosistem JKN: (1) Efisiensi Finansial: Mencegah kebocoran dana dengan deteksi dini manipulasi obat/alkes dan phantom billing sebelum pembayaran. (2) Efisiensi Operasional: Memangkas waktu audit secara drastis dengan mengarahkan investigator fokus pada 5% antrean klaim CRITICAL/HIGH, bukan lagi mencari jarum di tumpukan jerami. (3) Efek Jera (Deterrence): Mendorong Fasilitas Kesehatan untuk lebih patuh terhadap aturan klinis berkat"],"r":[{"n":"Yanuar Milad","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2579","tim":"Espresso","inov":"JKN-MedGraph","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN melayani ±278 juta peserta dengan biaya manfaat >Rp150 triliun per tahun. Fraud klaim terorganisasi menjadi ancaman serius; pada 2024, KPK dan Tim PPK JKN mengungkap phantom billing di 3 rumah sakit dengan kerugian Rp35 miliar. Verifikasi rule-based yang memeriksa klaim satu per satu belum mampu menangkap kolusi lintas-entitas. Karena itu, dibutuhkan pendekatan berbasis jaringan untuk melihat hubungan abnormal antar peserta, dokter, faskes, diagnosis, dan klaim.","Membangun JKN-MedGraph, sistem deteksi fraud klaim JKN berbasis Graph Neural Network (GraphCare-Net) yang memodelkan klaim sebagai jaringan relasi. Sistem ditujukan untuk mendeteksi klaster phantom billing, upcoding, tindakan tidak sesuai indikasi, repeat billing, dan cloning; menghasilkan subgraf bukti yang dapat diaudit; serta menjaga privasi data melalui prinsip UU PDP dan human-in-the-loop.","JKNMedGraph mengubah data klaim menjadi graf heterogen yang menghubungkan peserta, faskes, dokter, diagnosis, tindakan, dan klaim beserta atribut waktu dan biaya. Sistem memiliki tiga mesin deteksi: Syndicate Cluster Detector menggunakan community detection dan GraphSAGE untuk menemukan klaster phantom billing; Upcoding Pattern Engine menganalisis pergeseran distribusi kode INA-CBG untuk mendeteksi upcoding dan tindakan tidak sesuai indikasi; serta Repeat Billing & Cloning Scanner menggunakan analisis temporal dan similaritas embedding untuk menemukan klaim berulang atau penjiplakan. Hasil ketiganya digabungkan melalui Hybrid Risk Scoring menjadi level Normal, Waspada, Tinggi, dan Kritis. Setiap kasus dilengkapi subgraf bukti yang dapat ditelusuri untuk membantu verifikator dan Tim PPK. Sistem dirancang privacy-by-design dengan data terde-identifikasi, enkripsi, kontrol akses, dan human-in-the-loop: AI memprioritaskan serta menyajikan bukti, sedangkan keputusan akhir tetap pada manusia","Deteksi lebih dini: menemukan phantom billing, upcoding, repeat billing, dan cloning.  \n\nVerifikasi lebih efisien: memprioritaskan klaim berisiko tinggi.  \n\nInvestigasi lebih kuat: menyediakan skor risiko dan subgraf bukti.\n  \nMelindungi faskes patuh: mengurangi pemeriksaan yang tidak tepat sasaran.\n  \nMenjaga dana JKN: menekan potensi kerugian dan mendukung keberlanjutan program."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Susi Lusiani","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2582","tim":"Otak rental","inov":"Estra: AI Pre-Audit Klaim Rawat Jalan JKN untuk Deteksi Dini Kecurangan di Fasilitas Kesehatan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Hingga Oktober 2024 tercatat 1.972.046 kasus klaim pending senilai Rp4,82 triliun (BPK). Penyebab terbesarnya ada di sisi faskes: kelengkapan berkas (±34–39%), ketepatan koding (±27–33%), dan pemeriksaan penunjang (23%). PMK 16/2019 mewajibkan faskes mitra BPJS membangun sistem pencegahan kecurangan berbasis data klaim, tetapi Kemenkes (SE HK.02.01/MENKES/1567/2024) menilai pelaksanaannya belum optimal. Pemeriksaan manual tim casemix masih berupa sampel dan tidak konsisten.","Membantu faskes memeriksa seluruh klaim rawat jalan JKN sebelum dikirim ke BPJS Kesehatan agar: (1) potensi phantom billing, repeat billing, upcoding, dan rujukan tidak sesuai terdeteksi sejak dini; (2) kesalahan administratif diperbaiki sebelum klaim menjadi pending; (3) setiap temuan dan keputusan staf terdokumentasi sebagai bukti kewajiban deteksi dini PMK 16/2019; dan (4) keputusan akhir tetap di tangan staf faskes.","Estra adalah AI pre-audit klaim rawat jalan JKN yang dipakai faskes sendiri dengan alur Siapkan, Periksa, Perbaiki, Kirim. Agent AI (LangGraph) memeriksa setiap klaim memakai data milik faskes: rekam medis, jadwal praktik dan registrasi tenaga, rujukan FKTP, hasil penunjang, serta riwayat kunjungan. Pemeriksaan dibagi ke empat spesialis: Medix (klinis), Opsy (operasional), Billie (tagihan), dan Anomaly (pola). Sembilan aturan berbobot, misalnya rekam medis tidak ada, tenaga tidak terdaftar, klaim ganda, dan kode diagnosis tidak sesuai, dihitung oleh kode, bukan oleh teks LLM. Setiap saran disertai jejak pemeriksaan dan data mentahnya. Agent hanya bisa membaca dan mengusulkan; status klaim hanya diubah staf yang login dengan alasan wajib. Prototipe sudah berjalan untuk 3 faskes dengan 120 klaim sintetis, dan dalam uji 50 klaim menangkap 20 dari 20 klaim bermasalah tanpa menandai klaim bersih.","Bagi faskes: semua klaim dalam batch diperiksa (bukan sampel), klaim pending akibat berkas dan koding ditekan sebelum dikirim sehingga arus kas lebih lancar, dan kewajiban deteksi dini PMK 16/2019 terpenuhi dengan laporan siap cetak. Bagi BPJS Kesehatan: berkas yang masuk lebih lengkap dan beban verifikasi turun. Bagi Dana JKN: potensi kecurangan tertahan di sumbernya. Di uji prototipe, median waktu periksa 37 detik per klaim; dampak finansial diukur sebagai baseline saat pilot."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Djaka Santosa","s":null},{"n":"Juliana","s":null}]},{"id":"2586","tim":"TriMind","inov":"KlaimGuard - Claim Risk Intelligence","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Fraud klaim fasilitas kesehatan seperti phantom billing, upcoding, dan cloning memicu kerugian hingga miliaran rupiah. Saat ini, verifikasi klaim masih bergantung pada audit manual dan sampling acak pasca-bayar yang lambat. Klaim yang dimanipulasi seringkali terlihat wajar bila diperiksa satu per satu, sehingga sistem saat ini kesulitan mendeteksi jaringan anomali yang tersembunyi, sementara dana JKN terus terkuras","Tujuan proposal ini adalah menghadirkan KlaimGuard, solusi untuk menemukan pola klaim mencurigakan dengan menganalisisnya sebagai jaringan, bukan secara individual. Solusi ini menargetkan efisiensi risiko fasilitas kesehatan untuk menangani inflated bills dan cloning. KlaimGuard bertujuan membantu auditor bekerja lebih efisien dengan mengubah prioritas audit manual menjadi sistem otomatis berbasis risiko.","KlaimGuard adalah ruang investigasi berbasis graph (faskes-dokter-pasien) yang dilengkapi dengan AI Copilot. Sistem ini memproses data dan menggunakan modul statistik untuk mendeteksi phantom billing, upcoding, cloning, dan repeat billing. Hasil analisis ditampilkan dalam relationship graph yang mengungkap koneksi tersembunyi yang tidak terlihat pada audit per klaim. Setiap skor risiko memiliki fitur evidence drill-down sehingga dapat ditelusuri hingga ke klaim spesifik. Selanjutnya, AI Copilot akan merangkum sinyal terstruktur dari sistem menjadi narasi untuk mempermudah auditor. Sistem ini memprioritaskan risiko secara otomatis, namun keputusan akhir penindakan tetap berada di tangan manusia (auditor).","KlaimGuard akan mempercepat proses investigasi melalui prioritas audit berbasis risiko dengan bukti klaim yang terhubung secara spesifik. Penerima manfaat utama adalah BPJS Kesehatan karena adanya efisiensi dana dan waktu audit. Selain itu, faskes yang patuh akan menikmati iklim persaingan yang lebih adil, dan keberlanjutan dana jaminan kesehatan bagi peserta JKN dapat lebih terjaga."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Susi Lusiani","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2587","tim":"Let Fix","inov":"AI-Assisted Clinical Risk Screening Solusi Dual-Engine untuk Deteksi Risiko Ketidaksesuaian Indikasi","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pemeriksaan Tim Gabungan (KPK, Kemenkes, BPKP, BPJS Kesehatan) Juli 2024 terhadap 39 pasien operasi katarak di 3 RS swasta menemukan 25 pasien (64%) tidak sesuai standar PNPK. Ini bukan otomatis fraud, tetapi menandakan potensi inefisiensi dana JKN. Memeriksa jutaan klaim secara manual membutuhkan waktu dan sumber daya besar, sementara reviewer medis perlu alasan spesifik untuk memprioritaskan kasus.","Membangun sistem penyaring cerdas dual-engine (aturan klinis Kepmenkes 67/2026 + analisis pola AI) untuk membantu reviewer klinis memprioritaskan kasus operasi katarak yang berisiko tidak sesuai indikasi. Sistem menghasilkan Risk Level dengan penjelasan (XAI), mengubah pemeriksaan dari random sampling menjadi targeted review, menjaga privasi data, dan memastikan keputusan akhir tetap di tangan reviewer medis.","AI-Assisted Clinical Risk Screening adalah penyaring cerdas yang membandingkan data klinis, diagnosis, pemeriksaan, dan pola klaim operasi katarak dengan clinical reference (Kepmenkes 67/2026). Arsitektur Dual-Engine: (1) Clinical Rules, deterministik, mendeteksi penyimpangan dari pedoman, mis. indikasi operasi tanpa data visus; (2) AI Pattern Analysis, probabilistik, mendeteksi anomali pola, mis. lonjakan frekuensi operasi fasilitas dan kombinasi diagnosis-tindakan langka. Alur: data sintetis/anonim, preprocessing, screening engine, Risk Output (Low Risk, Review Needed, Higher Priority, Unknown/OOD) dengan alasan XAI (Shapley), lalu dashboard antrean prioritas dan umpan balik reviewer. Access control dan audit log menjamin keamanan. Pengujian memakai F1-Score berfokus Recall, stress test 4 skenario, dan validasi dokter spesialis mata. Sistem bukan hakim, eksekutor, atau pengganti dokter; keputusan akhir ada pada reviewer medis (human-in-the-loop).","Pada simulasi purwarupa, dari 1.250 klaim hanya 25 (2%) berkategori Higher Priority dan 145 (11,6%) Review Needed, sehingga reviewer dapat fokus pada kasus berisiko. Dampaknya: waktu screening lebih singkat, presisi temuan meningkat, beban kognitif reviewer menurun, serta mutu keselamatan pasien dan efisiensi pembiayaan JKN lebih terjaga. Penghematan dana belum diklaim sebelum ada pengujian empiris."],"r":[{"n":"Yanuar Milad","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2599","tim":"IQ + Ketenangan","inov":"SAKTI - Platform Validasi Dokumen Medis Berbasis Kriptografi QR & OCR","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Surat sakit fiktif menghancurkan karir dan kepercayaan yang telah dibangun. Permasalahan pemalsuan surat sakit menjadi hal yang urgent dalam analisis kami. Bentuk surat sakit di era sekarang sudah sangat mendekati surat asli, hal ini menunjukkan bahwa masalah ini harus di selesaikan. Dengan masalah yang ada, munculah sakti dengan konsepnya, SAKTI akan mengatasi surat sakit fiktif.","Menghilangkan percobaan pemalsuan surat sakit dan menciptakan standardisasi pada rumah sakit atau fasilitas kesehatan untuk menerbitkan surat sakit yang valid di SAKTI.","SAKTI adalah website validator untuk menyelesaikan permasalahan penerbitan surat sakit fiktif. Produk ini menguntungkan perusahaan karena oknum akan sulit untuk menerbitkan surat sakit fiktif. Produk ini menggunakan teknologi Kriptografi QR dan OCR sebagai pendekatan dalam mendeteksi dan mengenali pola surat.","Jika SAKTI dikembangkan dan mencapai tahap akhir, kami yakin bahwa produk kami akan membantu rumah sakit untuk menerbitkan surat sakit di SAKTI guna menghindari pemalsuan, selain itu perusahaan sebagai target utama juga tidak akan mengalami kerugian secara ketenagakerjaan karena pada akhirnya sakti juga akan mencegah oknum untuk melakukan pemalsuan surat sakit."],"r":[{"n":"Juliana","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2623","tim":"Fomo","inov":"Employer Compliance Radar: Sistem Analitik untuk Memprioritaskan Verifikasi Kepatuhan Pemberi Kerja","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kepatuhan pemberi kerja terhadap iuran JKN masih bermasalah: upah dilaporkan setara UMP/UMK padahal upah riil lebih tinggi, iuran yang dipotong dari gaji tidak disetorkan penuh, dan pekerja kontrak/harian lepas tidak didaftarkan. Pengawasan saat ini reaktif dengan sampling acak sehingga tingkat deteksi hanya setara proporsi kasus di populasi. Dibutuhkan sistem yang memprioritaskan verifikasi lapangan pada entitas berisiko tertinggi secara transparan dan terukur.","Membangun Employer Compliance Radar: sistem analitik yang menghitung Employer Integrity Score (1-100) untuk memprioritaskan investigasi kepatuhan pemberi kerja. Tujuannya: (1) menggantikan sampling acak dengan prioritisasi terarah berbasis indikator risiko yang transparan; (2) mendeteksi dini pola under-reporting upah, penggelapan iuran, dan pendaftaran pekerja sebagian; (3) meningkatkan efisiensi sumber daya pemeriksaan BPJS Kesehatan.","Employer Compliance Radar adalah sistem analitik yang memprioritaskan verifikasi kepatuhan pemberi kerja melalui Employer Integrity Score (1-100). Input: data pelaporan bulanan (sintetis untuk pengembangan) dan benchmark UMP 2026 asli dari 38 provinsi. Rekayasa fitur: (1) Penggelapan Iuran - rule-based atas gap iuran yang dilaporkan vs dibayar; (2) Under-reporting Upah - deviasi statistik terhadap median peer sektor untuk mencegah false positive pada UKM yang wajar membayar dekat UMP; (3) PDUK - proksi kasar jumlah pekerja terdaftar vs median sektor. Scoring engine menghitung ulang setiap request dan disajikan via REST API (FastAPI) serta dashboard interaktif (React). Analisis dilakukan di level perusahaan tanpa menyentuh data individu pekerja; AI hanya alat bantu prioritisasi, keputusan akhir tetap di tangan pemeriksa manusia. Status saat ini: prototype yang sudah berfungsi (generator data simulasi, scoring engine, API, dashboard monitoring).","Bagi pekerja: kepastian hak layanan kesehatan sesuai kontribusi riil yang seharusnya. Bagi BPJS Kesehatan: efisiensi sumber daya pemeriksaan - investigasi terarah pada entitas berisiko tertinggi menggantikan sampling acak - serta perlindungan keberlanjutan pendanaan JKN. Bagi perusahaan patuh: iklim usaha yang adil tanpa keunggulan biaya tidak sehat dari entitas yang mangkir. Dampak kuantitatif masih bersifat estimasi dan perlu validasi pada data riil sebelum operasional."],"r":[{"n":"Septian Firmansyah","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2629","tim":"wmaulanaaishq","inov":"GARDA JKN : Generative Agent for Risk Detection and Adjudication","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kebocoran dana JKN akibat fraud di FKRTL mencapai Rp10–20 Triliun/tahun (estimasi KPK & Kemenkes 2024), didominasi phantom billing, upcoding, dan prolonged stay. Dengan volume 8–12 juta klaim/bulan, 1.500–2.000 verifikator BPJS menanggung beban kognitif ekstrem (3.500+ berkas/bulan di bawah batas SLA 15 hari). Audit manual pasca-bayar berbasis sampling mustahil meneliti 100% rekam medis, memicu defisit kas, dan menimbulkan sengketa klaim faskes. Diperlukan otomasi pra-pembayaran presisi.","1. Mentransformasi audit dari sampling pasca bayar menjadi 100% FullPopulation Pre Payment Audit dalam <10 detik per klaim.\n2. Mencegah resistensi faskes melalui Explainable AI berbasis rujukan resmi Pedoman Nasional Pelayanan Kedokteran (PNPK Kemenkes RI).\n3. Melindungi likuiditas faskes via Auto Approval klaim bersih (<100ms) tanpa sengketa.\n4. Memberdayakan peran dokter verifikator dengan sistem pendukung keputusan (Human-in-the-Loop) yang memiliki hak veto hukum mutlak.","GARDA-JKN adalah platform adjudikasi klaim pra pembayaran berbasis Tri Layer AI yang terintegrasi nir-friksi ke Web Service V-Claim BPJS Kesehatan (<10 detik/klaim):\n1. Lapis 1 (XGBoost + SHAP): Skrining finansial kilat berbasis Stratified Isolation Forest (14 strata faskes) agar nir-bias terhadap RS kelas C/D/3T. SHAP menerjemahkan anomali menjadi Auditor Reason Codes yang transparan.\n2. Lapis 2 (Qdrant RAG + PyMuPDF4LLM): Pencarian bukti kepatuhan medis dengan mengekstrak tabel dosis dan bagan alur PNPK Kemenkes RI ke Markdown murni tanpa merusak relasi klinis.\n3. Lapis 3 (Clinical Arbiter LangGraph): Agen LLM menyintesis gap biaya Lapis 1 dan bukti pasal PNPK Lapis 2 berbasis Fraud Control Matrix untuk menerbitkan draf rekomendasi Berita Acara resmi.\nAlur dikelola StateGraph deterministik (5 simpul) dengan sensor PII (UU PDP 27/2022). Klaim ambigu dialihkan ke panel V-Claim eksisting agar dokter verifikator memegang hak veto hukum akhir (Human-in-the-Loop).","1. Finansial: Menutup potensi kebocoran dana Rp10–15 Triliun/tahun secara pre-payment; reduksi 1% fraud menghemat Rp100–150 Miliar/tahun (ROI >500x).\n2. Operasional: Memangkas waktu verifikasi berkas dari 15–25 menit menjadi <10 detik; 70%–80% klaim bersih lolos instan (Auto Approve).\n3. Rumah Sakit: Likuiditas arus kas terjaga pasti (<15 hari SLA), sengketa piutang turun dari 15% ke <2%.\n4. Peserta: Menjamin perlindungan pasien dari tindakan invasif berlebih demi keselamatan pasien"],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2647","tim":"DicobaSaja","inov":"Reksa.AI : AI ASSISTANT FOR WORKER RIGHTS PROTECTION AND EMPLOYER COMPLIANCE RISK DETECTION","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Meningkatnya kasus PHK dan sulitnya pekerja membuktikan pelanggaran hak menciptakan kesenjangan antara perlindungan yang dijamin regulasi dan akses nyata di lapangan. Dokumen yang tidak lengkap juga menjadi hambatan klaim JKP, sementara indikasi pekerja tidak terdaftar atau upah dilaporkan lebih rendah dapat meningkatkan risiko ketidakpatuhan pemberi kerja terhadap kewajiban jaminan sosial.","Menghadirkan pendampingan hak ketenagakerjaan yang mudah diakses, preventif, dan berbasis regulasi melalui AI. Reksa.AI membantu pekerja memahami risiko kontrak, menyiapkan bukti dan laporan secara terstruktur, sekaligus menghasilkan sinyal kepatuhan yang dapat mendukung BPJS dan otoritas terkait dalam mengidentifikasi potensi masalah pendaftaran pekerja, pelaporan upah, dan status kerja.","Reksa.AI adalah asisten AI melalui WhatsApp yang menerima teks, foto dokumen, dan voice note. Fitur Reksa Kontrak menganalisis klausul kerja serta menandai potensi risiko berdasarkan regulasi. Reksa Lapor mengolah kronologi dan dokumen menjadi laporan terstruktur, analisis hak yang dapat dituntut, serta daftar bukti yang masih kurang untuk membantu proses pengaduan ke Disnaker atau pihak berwenang.","Reksa.AI berpotensi mempercepat penyiapan bukti, meningkatkan kelengkapan laporan, dan membantu pekerja mengenali risiko sebelum menandatangani kontrak maupun saat menghadapi PHK. Bagi BPJS Kesehatan dan Ketenagakerjaan, data kasus yang terstruktur dapat menjadi sinyal awal untuk memverifikasi indikasi ketidakpatuhan pemberi kerja, mendukung koreksi kepesertaan, dan memperkuat efisiensi serta perlindungan dalam ekosistem JKN."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Yanuar Milad","s":null}]},{"id":"2652","tim":"SkyBoys","inov":"OjoNunggu","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kapasitas tempat tidur RS menjadi tantangan. Pada 2023, rasio tempat tidur nasional 1,38 per 1.000 penduduk dengan kesenjangan antarwilayah (Kemenkes, 2023). Kasus Yurizal Tri Chaerawan menunjukkan risikonya: pasien JKN di RSCM menunggu sekitar 8 jam untuk HCU yang terbatas, sebelum akhirnya meninggal pada 31 Juli 2026 (ANTARA, 2026). Kondisi ini menegaskan perlunya pemetaan risiko tekanan kapasitas dan sistem rekomendasi RS untuk menghindari ketidaksesuaian rujukan dan Prolonged length of stay.","Mengembangkan OjoNunggu, aplikasi berbasis web yang aman sebagai penyedia informasi risiko tekanan kapasitas secara spasial. Aplikasi ini membantu peserta JKN dan masyarakat menemukan rumah sakit alternatif terdekat dengan risiko antrean lebih rendah berdasarkan jenis kamar, sekaligus mengurangi ketidaksesuaian rujukan dan Prolonged length of stay. Dashboard dan rekomendasi berbasis data aplikasi ini diharapkan membantu pengambil kebijakan merencanakan penyediaan kapasitas kamar rumah sakit.","OjoNunggu merupakan aplikasi berbasis web yang mengubah data kapasitas kamar rumah sakit menjadi informasi risiko tekanan kapasitas secara spasial. Sistem memanfaatkan data Aplicare BPJS Kesehatan dan SIRS Kemenkes, serta lokasi real time pengguna dalam ekosistem keamanan data. Data diolah menggunakan R dan rule based system untuk menentukan skor risiko tekanan kapasitas pada setiap RS dan jenis kamar. Hasilnya ditampilkan melalui dashboard dan peta spasial untuk merekomendasikan RS terdekat dengan risiko antrean lebih rendah sesuai kebutuhan jenis kamar. OjoNunggu membantu pengguna memilih fasilitas secara tepat, mengurangi risiko ketidaksesuaian rujukan dan Prolonged length of stay. Bagi pengambil kebijakan, sistem menyediakan pemetaan tekanan kapasitas dan rekomendasi penyediaan kamar. Prototipe berbasis Google Apps Script, JavaScript, dan CSS telah dikembangkan, lalu diuji dan diarahkan menjadi MVP terintegrasi dengan sistem JKN.","OjoNunggu diharapkan membantu peserta JKN memilih RS berdasarkan risiko tekanan kapasitas, sehingga mengurangi waktu tunggu, ketidaksesuaian rujukan, dan risiko Prolonged length of stay. Dampak diukur melalui: (1) persentase pengguna yang memperoleh rekomendasi RS; (2) pemetaan fasilitas Kesehatan paling direkomendasikan; (3) rata-rata waktu memperoleh kamar sebelum dan sesudah penggunaan; (4) perubahan proporsi rujukan yang sesuai; dan (5) perkembangan pengguna, investasi, dan integrasi JKN jan"],"r":[{"n":"Djaka Santosa","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Juliana","s":null}]},{"id":"2655","tim":"Aurevia","inov":"JKN ClaimGuard: Deteksi Dini Cloning Klaim Fasilitas Kesehatan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Volume dan kompleksitas data klaim membuat pemeriksaan kemiripan antar-klaim menjadi tantangan. Klaim yang menyalin elemen klaim atau rekam medis lain dapat terlihat sah saat diperiksa satu per satu. Dibutuhkan alat bantu yang menandai pola kemiripan tidak wajar beserta alasan dan klaim pembanding untuk diverifikasi petugas. Prototype awal menggunakan data sintetis; kemiripan hanya sinyal pemeriksaan, bukan bukti kecurangan.","Membangun prototype yang mendeteksi pola cloning atau kemiripan tidak wajar pada data klaim sintetis, menampilkan indikator dan klaim pembanding, serta menyusun antrean pemeriksaan berdasarkan skor risiko yang transparan. Mengukur precision, recall, false-positive rate, dan waktu pemrosesan pada dataset uji berlabel. Sistem tidak membuat keputusan atau penolakan klaim otomatis.","JKN ClaimGuard adalah alat bantu untuk menandai klaim dengan kemiripan tidak wajar sebagai kandidat review. Data klaim sintetis masuk melalui CSV/API, divalidasi, dan diproses tanpa nama atau nomor identitas langsung. Detection Engine menggabungkan rule engine dan similarity matching untuk membandingkan atribut seperti kode diagnosis/tindakan, tanggal layanan, dan struktur klaim. Setiap temuan menghasilkan skor prioritas, aturan pemicu, serta record pembanding untuk ditinjau petugas. Backend dirancang dengan Go/Laravel dan PostgreSQL, disertai dashboard antrean, detail indikator, status pemeriksaan, dan audit log. Prototype tidak terhubung ke sistem BPJS atau data peserta riil. Evaluasi awal memakai data sintetis berlabel; penggunaan data nyata hanya setelah izin resmi dan validasi ahli klaim. Skor merupakan sinyal review, bukan kesimpulan fraud.","Dampak yang diharapkan: membantu petugas menemukan pola klaim yang perlu diperiksa, menjelaskan alasan penandaan, dan memprioritaskan review. Evaluasi memakai data sintetis berlabel dengan metrik precision, recall, false-positive rate, dan waktu pemrosesan. Target uji awal: recall =85% dan false-positive rate =15% pada skenario sintetis; ini sasaran, bukan hasil aktual. Dampak operasional baru dinilai melalui pilot resmi dengan pengawasan petugas."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Septian Firmansyah","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2667","tim":"Srepet Sruput Slebew","inov":"Virtual Wellness Assurance and Risk Detection","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Pelayanan kesehatan menghadapi tantangan dalam menjaga kesinambungan perawatan pasien dan memastikan bukti layanan tercatat dengan baik. Rencana dokter, pemantauan pasien, kunjungan, dan tindakan sering tersebar dalam berbagai catatan sehingga menyulitkan peninjauan. Selain itu, rawat inap berkepanjangan, readmisi, serta indikasi layanan tercatat berulang memerlukan dokumentasi dan evaluasi yang terstruktur tanpa mengabaikan kebutuhan klinis pasien.","VWARD bertujuan mendukung perawatan lanjutan di rumah bagi pasien terpilih melalui pemantauan terawasi, pencatatan layanan yang transparan, dan deteksi dini indikasi anomali. Sistem ini dirancang untuk membantu tenaga kesehatan memantau kondisi pasien, memastikan tindak lanjut sesuai rencana dokter, serta menyediakan rekam jejak layanan yang dapat ditinjau guna mendukung efisiensi pelayanan dan integritas klaim JKN.","VWARD (Virtual Wellness Assurance and Risk Detection) merupakan konsep sistem digital untuk mendukung perawatan lanjutan di rumah bagi pasien terpilih dengan pengawasan tenaga kesehatan. Sistem memiliki tiga pilar utama, yaitu Assurance untuk mencatat rencana dokter, kunjungan, tindakan, dan perubahan layanan; Wellness untuk memantau keluhan serta pengukuran pasien sesuai rencana; dan Risk Detection untuk menandai indikasi anomali, seperti benturan waktu kunjungan, tindakan tanpa rencana, atau catatan duplikat. Sistem membantu memberikan pengingat, merangkum informasi, dan menyusun bukti layanan untuk ditinjau oleh tenaga kesehatan atau verifikator. Keputusan klinis tetap berada pada dokter, sedangkan indikasi anomali tidak dianggap sebagai bukti kecurangan. Pada tahap awal, konsep diuji menggunakan data sintetis dan prototipe masih perlu dikembangkan serta divalidasi bersama mitra terkait.","VWARD diharapkan membantu pasien memperoleh perawatan lanjutan yang lebih terpantau dan berkesinambungan. Bagi fasilitas kesehatan, sistem mendukung pencatatan layanan yang lebih tertata, pemantauan pasien, serta peninjauan rawat berkepanjangan dan readmisi berdasarkan alasan klinis. Bagi BPJS Kesehatan, rekam jejak dan penandaan indikasi anomali dapat mempermudah verifikasi layanan serta mendukung integritas klaim JKN tanpa menghambat perawatan yang dibutuhkan pasien."],"r":[{"n":"Juliana","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2677","tim":"Nasi Ayam CL","inov":"Navigasi Analitik Deteksi Integritas","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program Jaminan Kesehatan Nasional atau JKN merupakan program perlindungan kesehatan yang diselenggarakan oleh BPJS Kesehatan. Melalui program ini, peserta JKN dapat memperoleh pelayanan kesehatan di fasilitas kesehatan tingkat pertama, seperti puskesmas dan klinik, maupun di fasilitas kesehatan rujukan tingkat lanjut, seperti rumah sakit. Dalam pelayanan rumah sakit, peserta dapat menerima pemeriksaan dokter, tindakan medis, obat, alat kesehatan, pemeriksaan penunjang, dan perawatan rawat inap.","Tujuan umum pengembangan NADI adalah membuat rancangan prototype sistem pendukung verifikasi klaim JKN yang membantu BPJS Kesehatan dan fasilitas kesehatan mendeteksi lebih awal ketidaksesuaian antara data klaim dan layanan yang tercatat diberikan kepada pasien. NADI tidak menggantikan tugas verifikator BPJS. Sistem hanya membantu petugas memprioritaskan klaim yang perlu diperiksa berdasarkan data dan alasan yang lebih jelas. Keputusan akhir mengenai klaim tetap dilakukan oleh verifikator BPJS K","NADI atau Navigasi Analitik Deteksi Integritas adalah rancangan sistem digital yang membantu BPJS Kesehatan dan fasilitas kesehatan menelusuri jejak layanan untuk mendukung verifikasi klaim JKN. NADI menggunakan tagline “Menelusuri Jejak Layanan untuk Klaim JKN yang Lebih Transparan.” Sistem ini tidak hanya melihat dokumen klaim sebagai satu-satunya sumber informasi. NADI membandingkan data klaim dengan data dari proses pelayanan, yaitu order dokter, stok farmasi, catatan pemberian obat atau alat kesehatan, pelaksanaan tindakan, serta tanggapan peserta jika tersedia.\n\nNADI memiliki empat komponen utama. Komponen pertama adalah Jejak Pemberian Layanan di sisi rumah sakit. Komponen ini merupakan rancangan modul yang dapat ditempatkan pada SIMRS, rekam medis elektronik, atau aplikasi petugas rumah sakit. Fungsinya adalah mencatat proses pelayanan pasien dari awal sampai akhir. Dokter membuat order obat, alat kesehatan, atau tindakan. Farmasi menyiapkan barang dan mencatat jumlah stok yang","NADI diharapkan memberikan dampak bagi BPJS Kesehatan, fasilitas kesehatan, peserta JKN, dan Program JKN secara umum. Dampak yang ditawarkan bukan janji bahwa sistem dapat menghilangkan seluruh fraud. NADI dirancang untuk membuat ketidaksesuaian lebih cepat ditemukan, memberikan alasan pemeriksaan yang lebih jelas, dan membantu petugas memprioritaskan klaim. Karena NADI masih berupa prototype, angka seperti penghematan dana, akurasi AI, atau penurunan fraud belum dapat diklaim sebelum dilakukan"],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2683","tim":"Tech23","inov":"TrustVerify-platfrom","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Verifikasi klaim JKN perlu memastikan diagnosis, tindakan, kode, dan bukti pelayanan saling sesuai. Upcoding adalah manipulasi diagnosis dan/atau tindakan dengan kode lebih tinggi untuk meningkatkan nilai klaim. Kemenkes RI (2024) mencatat 4.341 klaim fisioterapi, tetapi hanya 1.071 memiliki catatan rekam medis; dari 39 pasien operasi katarak yang diperiksa, 14 sesuai diagnosis. Temuan ini menunjukkan perlunya pemeriksaan terarah, bukan berarti semua kasus merupakan upcoding.","Mengembangkan TrustVerify sebagai alat bantu verifikasi klaim berbantuan AI dan analisis data untuk menemukan indikasi ketidaksesuaian diagnosis, tindakan, kode ICD-10/ICD-9-CM, serta bukti pendukung. Sistem bertujuan membantu verifikator memprioritaskan klaim yang perlu ditinjau lebih lanjut, dengan keputusan akhir tetap berada pada manusia.","TrustVerify memeriksa data klaim melalui tiga tahap. Rule Check mencocokkan data dengan aturan yang ditetapkan. Cross Check membandingkan diagnosis, tindakan, kode, dan bukti pelayanan dalam satu klaim. Pattern Analysis mencari pola yang berbeda pada kumpulan klaim. Hasilnya berupa tingkat risiko, alasan penandaan, dan bukti pendukung untuk membantu verifikator menentukan tindak lanjut. Pada tahap awal, prototype dirancang menggunakan data sintetis atau data yang telah dianonimkan. Sistem tidak memutuskan fraud secara otomatis dan tidak menggantikan verifikator.","TrustVerify diharapkan membantu verifikator menemukan indikasi lebih awal, memusatkan pemeriksaan pada klaim yang perlu ditinjau, dan memahami alasan sebuah klaim ditandai. Dampaknya akan dievaluasi melalui waktu penemuan indikasi, ketepatan penandaan dibandingkan hasil pemeriksaan, kejelasan alasan yang ditampilkan, dan jumlah klaim yang memerlukan review lebih lanjut. Hasil belum diklaim sebelum prototype diuji."],"r":[{"n":"Juliana","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2684","tim":"yukcobadulu","inov":"INAiLens: Clarity Before Claim by Yukkitacoba","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Kerugian fraud kesehatan pada 2024 mencapai Rp20 triliun akibat keterbatasan audit manual dan sistem validasi kaku berbasis rule-based. Verifikasi internal rumah sakit yang dilakukan secara sampling menjelang deadline membuat praktik upcoding halus dan anomali dokumen sering lolos. Hal ini memicu pending serta dispute claim yang merugikan cash flow faskes dan efisiensi dana JKN.","INAiLens bertujuan menjadi Pre-Submission Gatekeeper otomatis yang menguji $100\\%$ berkas klaim di gerbang pengajuan BPJS. Sistem ini memastikan kode klaim selaras dengan narasi rekam medis elektronik (RME) dan Panduan Praktik Klinis Kemenkes secara real-time. Dengan begitu, INAiLens menekan risiko kecurangan sekaligus menghentikan perdebatan klaim sejak awal.","INAiLens mengusung arsitektur Cascade Hybrid AI yang membagi kerja antara Jev AI (System 1) untuk fast screening data terstruktur dan Agentic RAG (System 2) untuk deep investigation narasi medis. Sistem memvalidasi 4 layer verifikasi (klinis, durasi, harga, dan demografi) terhadap bukti RME serta regulasi resmi. Klaim berisiko tinggi dikunci secara otomatis lalu diterbitkan laporan diagnostik berbasis Explainable AI (XAI) bagi tim Casemix.","Bagi BPJS Kesehatan, INAiLens menekan kebocoran anggaran dan mengefisiensikan alokasi audit verifikator. Bagi rumah sakit, solusi ini mengeliminasi pending claim dan menjaga kelancaran cash flow tanpa merusak sistem eksisting. Secara menyeluruh, sistem ini menjaga akurasi rekam medis peserta dan meningkatkan integritas ekosistem JKN."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2693","tim":"e-SIGRA","inov":"e-SIGRA: Dari Deteksi Risiko ke Tindakan Nyata","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Di Indonesia, 4.000+ kematian ibu/tahun sebagian besar dapat dicegah bila tanda bahaya dikenali dan ditindaklanjuti tepat waktu. Namun cakupan K1 96,9% turun drastis ke K6 17,6% (SKI 2023). Masalahnya bukan kesadaran, melainkan follow-through: risiko yang terdeteksi sering hilang sebelum menjadi tindakan. Di FKTP, kapitasi tetap; di FKRTL, kasus obstetri gawat seperti PPH/eklampsia masuk INA-CBG kelas berat. e-SIGRA menutup celah deteksi-ke-tindakan untuk mencegah prolonged stay dan readmisi.","e-SIGRA bertujuan menutup celah antara deteksi dini dan tindak lanjut nyata pada risiko maternal, dari komunitas hingga FKTP. Fokusnya bukan menambah skrining, melainkan memastikan setiap sinyal risiko ditinjau, divalidasi nakes, dan ditindaklanjuti tepat waktu. Pilot 6 bulan menguji Risk-to-Action Completion Rate =85%, Time to Review/Follow-up turun 40%, serta pola rujukan. Luaran: prototipe teruji, SOP eskalasi, dan bukti awal potensi efisiensi hari rawat/readmisi JKN secara etis dan aman.","e-SIGRA adalah risk-control layer komunitas-ke-FKTP, bukan sekadar aplikasi skrining. Alur closed-loop: Deteksi (skrining digital tanda bahaya oleh peserta/kader), Understand (skor risiko dan critical-indicator override), Alert (prioritas sinyal ke nakes), Validate (nakes memegang otoritas klinis final), Act (tindak lanjut/rujukan terdokumentasi), Monitor (nifas dan neonatal sampai risiko tertutup). Mesin saat ini rules- & scoring-based, transparan, bukan black box. Fondasi data terstruktur, kamus data baku, audit trail, RBAC, perbaikan IDOR, dan revokasi QR disiapkan; 43 automated tests zero error. Berakar dari praktik lapangan Puskesmas Panarung 2022 dan uji kuasi-eksperimen Maret 2025 (n=15). Pilot direncanakan 6 fase, 500+ peserta, 30+ nakes/kader, dengan mitra interoperabilitas SATUSEHAT. AI prediktif hanya dikembangkan setelah data longitudinal tervalidasi cukup. Masalah bukan awareness, melainkan follow-through: sinyal risiko harus punya jejak audit dari deteksi sampai tindak la","e-SIGRA berpotensi menurunkan prolonged stay dan readmisi yang dapat dicegah melalui tindak lanjut lebih cepat dan lengkap. Risk-to-Action Completion Rate =85%, Time to Review/Follow-up turun 40%, serta triase dan rujukan lebih terstruktur. Bagi peserta/komunitas: risiko maternal terpantau hingga nifas-neonatal. Bagi FKTP: alur validasi dan audit trail jelas. Bagi JKN: kerangka ukur potensi penghindaran klaim INA-CBG berat. Pilot tidak mengklaim penghematan, tetapi membangun bukti efisiensi risi"],"r":[{"n":"Susi Lusiani","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2695","tim":"anttech24sync","inov":"SIGAP","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["FRISTA Desktop sangat berat (±1 GB), membuat RS memakai script auto-click yang sering error memicu NIK terinput ganda dan verifikasi wajah gagal saat antrean padat. Tanpa validasi lokasi, timbul celah pasien palsu dan phantom billing. APK kerap diunduh dari link YouTube, sementara integrasi SIMRS masih di area abu-abu. Pasien IGD Jiwa RSMM juga butuh perekaman mobile cepat tanpa merusak PC loket.","Mempermudah faskes merekam wajah & memangkas antrean (< 2 detik) tanpa eror double NIK. Menutup celah phantom billing dengan mengunci zonasi faskes sesuai ketentuan resmi BPJS sebagai regulator. Menerapkan hard-lockdown anti-mock GPS, serta menyediakan distribusi aman Google Play Store dan Open API legal untuk bridging SIMRS.","PROJECT SIGAP adalah inovasi hulu yang memadukan aplikasi mobile native ringan (FRISTA Plus APK ±40 MB) dengan Official Open API Gateway untuk bridging SIMRS dan Kiosk APM. \n\nSistem memvalidasi kehadiran fisik pasien secara dinamis sesuai radius ketentuan BPJS sebagai regulator (formula Haversine) dan menerapkan proteksi tri-vector hard-lockdown yang otomatis menutup paksa aplikasi jika Fake GPS aktif. Menggantikan desktop bengkak ±1 GB dengan mobile ±40 MB yang atomik (< 2 detik), SIGAP mengeliminasi insiden race condition dan salah input double NIK di loket. Rumah sakit memperoleh kepastian hukum integrasi SIMRS melalui portal registrasi API resmi terikat PKS faskes. \n\nSaat ini SIGAP berstatus PROTOTYPE fungsional yang teruji sukses pada akun faskes toni.rsmmbogor dan penerbitan SEP pasien riil. Dengan tambahan tenaga pengembang, tim meyakini solusi ini dapat diselesaikan tuntas dalam waktu kurang dari 6 bulan.","Efisiensi klaim BPJS meningkat miliaran rupiah karena data pasien palsu (fiktif/tidak hadir) dihilangkan tuntas sejak pendaftaran. RS memangkas waktu tunggu loket (< 2 detik) dan terbebas dari eror script PC. BPJS memegang kendali regulasi zonasi terpusat dan software resmi Play Store. Hak NIK peserta JKN terlindungi dari klaim fiktif."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Juliana","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2706","tim":"FANTASTIC","inov":"AURA-JKN: Autonomous Relational Anti-Fraud","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN rentan eksploitasi sindikat terorganisasi melalui phantom dan repeat billing. Sistem saat ini sering terjebak \"clean claim trap\", klaim fiktif lolos karena dokumennya rapi. Paradigma pengawasan reaktif pasca-pembayaran (pay-and-chase) juga menyulitkan pemulihan dana. Ketiadaan analitik relasional pra-pembayaran memicu kebocoran Dana Jaminan Sosial.","Mengubah paradigma deteksi fraud JKN dari pengawasan reaktif menjadi mitigasi proaktif berbasis intelijen data. Inovasi ini merancang model Relational Graph Convolutional Network (R-GCN) pada graf heterogen untuk menghasilkan Fraud Risk Index (FRI). Tujuannya memprioritaskan peninjauan klaim yang terindikasi kolusi multi-pihak sebelum proses pembayaran.","AURA-JKN adalah sistem pendukung keputusan investigatif AI pra-pembayaran. Data klaim diekstraksi menjadi Heterogeneous Graph, lalu dianalisis menggunakan R-GCN dan logika spatiotemporal untuk mendeteksi klaster kolusif. Hasilnya ditampilkan via dashboard Explainable AI (XAI) yang memvisualisasikan jaringan anomali secara transparan bagi verifikator (human-in-the-loop).","AURA-JKN memutus rantai kebocoran Dana Jaminan Sosial akibat kolusi terorganisasi secara preventif sebelum dana dicairkan. Solusi ini menjamin likuiditas faskes berintegritas dan melindungi rekam medis peserta (SATUSEHAT) dari diagnosis fiktif. Secara makro, inovasi ini mendorong tata kelola JKN yang lebih presisi, efisien, dan berkelanjutan"],"r":[{"n":"Yanuar Milad","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2707","tim":"Switch Oled","inov":"One TapQR: Sistem Keamanan Penebusan ObatJKNBerbasis Single-UseQR Token","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Penebusan obat yang ditanggung JKN berpotensi mengalami penyalahgunaan akses apabila hak pelayanan dan penebusan obat tidak terkontrol dengan baik. Oleh karena itu, diperlukan sistem yang dapat memverifikasi identitas peserta, memvalidasi resep, serta mengontrol hak penebusan obat agar setiap transaksi tercatat dan tidak digunakan berulang kali di luar ketentuan.","Mengembangkan sistem One Tap QR berbasis Single-Use QR Token untuk meningkatkan keamanan penebusan obat JKN melalui verifikasi identitas peserta, validasi resep, pengendalian hak klaim, dan pencatatan transaksi secara terstruktur.","One Tap QR merupakan sistem keamanan penebusan obat JKN berbasis QR token. Peserta mengambil QR melalui resepsionis untuk menebus obat di apotek mana saja yang bekerja sama dengan sistem dalam batas waktu tertentu. QR dapat digunakan beberapa kali sesuai izin dokter. Setiap QR terhubung dengan identitas peserta, resep, dan hak klaim yang divalidasi server. Setiap transaksi memperbarui sisa hak klaim untuk mencegah duplikasi dan penyalahgunaan.","**Dampak Inovasi**\n\nOne Tap QR diharapkan dapat mengurangi penyalahgunaan hak penebusan obat JKN melalui verifikasi identitas, validasi resep, dan kontrol hak klaim. Sistem ini membantu mencegah duplikasi QR, meningkatkan keterlacakan transaksi, serta mengurangi penumpukan klaim melalui batas waktu penebusan dan pengingat kepada peserta."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2721","tim":"JEJAK","inov":"Jendela Evaluasi Jaminan & Kepatuhan (JEJAK) Pemberi Kerja","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Lebih dari 17 juta badan usaha tercatat di ekosistem OSS, sementara petugas pemeriksa BPJS Kesehatan terbatas. Ketidakpatuhan hadir dalam bentuk tunggakan iuran Rp26,47 triliun, penggelapan setoran sekitar Rp792 miliar, pelaporan upah lebih rendah, hingga manipulasi data mutasi pekerja pada 2.348 perusahaan. Data billing, e-Dabu, dan V-Claim masih terpisah, sehingga pengawasan bersifat reaktif dan tidak semua badan usaha dapat diperiksa mendalam.","Membangun Sistem JEJAK (Jendela Evaluasi Jaminan & Kepatuhan Pemberi Kerja), sistem pendukung keputusan berbasis Explainable AI yang menyatukan data billing, e-Dabu, dan V-Claim menjadi satu antrean prioritas pemeriksaan. Tujuannya membantu Petugas Wasrik memeriksa badan usaha paling berisiko lebih dulu, mendeteksi dini ketidakpatuhan sebelum terjadi, serta menjaga transparansi dan akuntabilitas melalui alasan yang jelas, berbasis hukum positif, dan keputusan akhir tetap di tangan manusia.","JEJAK menggabungkan tiga pilar skoring: (1) LightGBM memprediksi risiko gagal bayar iuran (bobot 50%); (2) Isolation Forest mendeteksi pola mutasi pekerja e-Dabu yang janggal (30%); (3) Rule Engine deterministik berbasis Perpres 82/2018 Pasal 22 dan Perpres 64/2020 Pasal 30 dengan 8 sinyal kepatuhan upah (20%). Skor gabungan 0-1 menghasilkan antrean Tinggi, Sedang, dan Rendah.\nTransparansi dijaga lewat SHAP Top-3 (tiga faktor pendorong risiko) dan Case-Based Reasoning (tiga kasus serupa) sebagai bahan klarifikasi. Dashboard React menyediakan sandbox bobot, matriks kuadran hari telat vs kurang bayar, serta Nota Telaah Administratif A4 ber-checksum SHA-256 untuk audit. Sistem hanya mengurutkan dan menjelaskan; verifikasi dan klarifikasi dengan HRD dilakukan petugas. Model berjalan lokal di CPU demi privasi.","JEJAK menggeser pengawasan dari reaktif menjadi preventif. Pada data sintetis, 8-9 dari 10 badan usaha teratas terbukti bermasalah, dibanding 4-5 dari 10 dengan urutan hari telat. Skenario ilustrasi: setiap 1% yang tercegah berpotensi menyelamatkan Rp264,7 miliar dari tunggakan atau Rp7,9 miliar dari setoran digelapkan. Manfaatnya: iuran masuk lancar, fasilitas kesehatan memadai, dan risiko kesehatan peserta terjaga."],"r":[{"n":"Susi Lusiani","s":null},{"n":"Mohamad Komarudin","s":null},{"n":"Djaka Santosa","s":null}]},{"id":"2722","tim":"VERITAS","inov":"VERITAS: Algoritma Transformer Berbasis SIMRS untuk Deteksi Fraud pada Klaim Fasilitas Kesehatan","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Fraud oleh fasilitas layanan kesehatan merupakan sumber kerugian terbesar BPJS Kesehatan, sekitar 10% pengeluaran kesehatan atau setara Rp20 triliun pada 2024 (KPK, 2024). Modus seperti upcoding, cloning klaim, dan tindakan tidak sesuai indikasi medis kian bervariasi dan sulit dideteksi. Akibatnya terjadi yang klaim tidak valid, pembayaran berlebih, dan tekanan fiskal pada program JKN dari tahun ke tahun, sehingga dibutuhkan sistem pengawasan yang dapat mempermudah pemeriksaan klaim.","Tujuan VERITAS adalah mengembangkan algoritma transformer yang terintegrasi dengan SIMRS untuk mencocokkan kode klaim dengan bukti klinis pada rekam medis dan panduan praktik klinis (PPK). Secara khusus, VERITAS mendeteksi upcoding, cloning, dan tindakan tidak sesuai indikasi pada tindakan sectio caesarea, menyajikan penjelasan temuan berbasis SHAP, serta memprioritaskan tinjauan auditor, sehingga pemeriksaan klaim lebih cepat, akurat, dan dapat ditelusuri sebelum klaim diajukan.","VERITAS adalah algoritma transformer berbasis sistem informasi manajemen rumah sakit (SIMRS) untuk mendeteksi fraud pada klaim layanan kesehatan. Sistem mengambil catatan SOAP, hasil radiologi dan laboratorium, data klaim, riwayat kunjungan, serta panduan praktik klinis (PPK). Teks diolah dengan IndoBERT, data tabular dengan MLP, lalu digabungkan melalui transformer fusi dengan cross-attention terhadap kriteria PPK. Tiga penilai anomali menghasilkan skor untuk tindakan tanpa indikasi, upcoding, dan cloning, dijelaskan dengan SHAP. Keluarannya berupa permintaan kelengkapan dokumen bagi tenaga kesehatan dan skor risiko beserta penyebab kenaikannya bagi auditor. Pilotting memakai rekam medis sectio caesarea di RSPTN Unhas melalui uji retrospektif, uji bayangan, dan uji klinis terbatas. VERITAS bersifat pendukung keputusan: reviewer tetap memverifikasi, data dianonimisasi, dan akses dibatasi berdasarkan peran.","VERITAS diharapkan menekan kerugian akibat fraud, meningkatkan akurasi klaim, dan memperkuat akuntabilitas fasilitas kesehatan. Pada pilot di RSPTN Unhas, target yang diukur meliputi sensitivitas =75%, spesifisitas =80%, pengurangan waktu review =30%, serta skor SUS =68. Dengan human-in-the-loop dan perlindungan data pasien, sistem ini mendukung efisiensi pembayaran JKN, menjaga mutu layanan, mengurangi beban review manual, dan meningkatkan kepercayaan publik."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Susi Lusiani","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2725","tim":"Sabun Cair","inov":"SAPA (Sistem Asistensi Pra-Asesmen Klinis): Menjaga Jejak Keputusan Klinis JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Sebanyak 440.749 klaim FKRTL senilai Rp873,1 miliar diperselisihkan. Ini bukan bukti kecurangan, melainkan sinyal bahwa coding dan verifikasi belum dapat ditelusuri. Di hulu klaim, perubahan diagnosis, tindakan, dan kode tidak mencatat alasan, pelaku, waktu, dan buktinya, padahal data klinis kini menjadi dasar verifikasi BPJS. Akarnya ada di dokumentasi: dokter menyusun SOAP manual 1,5–2 jam/hari, dan hanya ±15% dokumentasi lengkap dan terstandar.","Membangun mekanisme clinical-to-claim traceability yang mencatat apa yang berubah, mengapa, siapa, kapan, dan buktinya; menandai diagnosis, tindakan, dan kode yang belum didukung bukti sebelum klaim diajukan; mengurangi beban dokumentasi dokter serta penelusuran koder dan peninjau; dan menjaga keputusan tetap di tangan manusia dengan privasi data pasien terlindungi.","SAPA (Sistem Asistensi Pra-Asesmen Klinis) adalah layer di sisi fasilitas kesehatan yang menjaga jejak keputusan klinis dari pra-asesmen hingga klaim, tanpa menggantikan sistem BPJS. Terdiri dari tiga lapisan: (1) Clinical intelligence: keluhan pasien (suara/teks) menjadi draf SOAP ICD-10/ICD-9-CM dan hipotesa top-3 beserta bukti; (2) Decision traceability: Snapshot A (bukti awal dan hipotesa) dan Snapshot B (SOAP terkunci) dibekukan dengan log append-only; (3) Claim integrity sentinel: tiap diagnosis, tindakan, dan kode dicek buktinya dan ditandai Supported, Clinical Override, atau Needs Verification. Prinsipnya AI memberi sinyal, manusia memutuskan: dokter mengunci SOAP, peninjau memutuskan tindak lanjut. SAPA bukan SIMRS baru, chatbot pasien, diagnosis otomatis, atau detektor fraud. Saat ini level Mockup; lapisan pertama sudah berjalan sebagai prototipe Soapee (Juara 3 HealthTech AI Challenge 2025).","Ketidaksesuaian ditandai sebelum klaim diajukan, bukan saat verifikasi atau dispute. Alasan, bukti, dan riwayat A?B tersedia di satu layar bagi koder dan peninjau; dokter mendapat draf SOAP dari keluhan yang dicatat sekali (acuan: dokumentasi 7–12 menit menjadi 1–3 menit, Kurnia, 2025). BPJS menerima klaim dengan jejak bukti. Penghematan rupiah belum diklaim; diukur lewat validasi (false positive, kode tanpa bukti) dan pilot dengan data berizin."],"r":[{"n":"Ardhy Widhiantoro","s":null},{"n":"Raga Al Haqqi","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2728","tim":"Identity Guard","inov":"ProtectAI","kat":"Efisiensi Risiko pada Peserta JKN","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Aplikasi Mobile JKN menghadapi risiko efisiensi biaya akibat kecurangan (fraud) pada kelompok peserta. Isu utama mencakup pemalsuan data identitas KTP dan peminjaman akun untuk klaim layanan gratis, manipulasi konfirmasi iuran M-Banking fiktif, serta klaim obat non-indikasi medis (unnecessary services) melalui penginputan dosis mandiri berlebih. Praktik ini memicu kebocoran jaminan sosial, kerugian finansial BPJS Kesehatan, dan risiko medis akibat bahaya overdosis obat.","ProtectAI bertujuan untuk membangun sistem pencegahan kecurangan berbasis AI yang terintegrasi di aplikasi Mobile JKN. Sistem ini memverifikasi keaslian identitas peserta secara biometrik (KTP & selfie live-check) dengan basis data pemerintah, mengamankan transaksi iuran M-Banking & In-App Payment, menerapkan penguncian bertahap (penalty lock-time) untuk mencegah klaim ilegal, serta melakukan validasi dosis obat mandiri otomatis sesuai standar medis BPJS Kesehatan.","ProtectAI adalah solusi verifikasi dan kendali cerdas berpendekatan preventif. Fitur utamanya meliputi:  \n\nRegistrasi & Verifikasi Biometrik: Pemindaian KTP dan selfie dengan deteksi foto buram otomatis yang dikonfirmasi langsung ke basis data pemerintah.  \n\nOtentikasi Akses Layanan (On-The-Spot): Pencocokan wajah live via webcam perangkat peserta saat mengajukan layanan faskes, dilengkapi sistem penguncian progresif setelah 5 kegagalan berturut-turut untuk mencegah peminjaman akun.  \n\nVerifikasi Iuran Anti-Fasifikasi: AI memvalidasi klaim M-Banking dengan mengecek transaksi masuk dan batas 5 kali pencarian nomor referensi, serta pencocokan Payment ID pada pembayaran langsung di aplikasi.  \n\nModul Kendali Obat: Membandingkan penginputan dosis obat mandiri peserta secara otomatis dengan batas rekomendasi BPJS Kesehatan, menolak pengajuan yang melebihi dosis aman demi mencegah unnecessary services.","Bagi Peserta: Menjamin keamanan akun pribadi agar kuota dan hak layanan kesehatan tidak disalahgunakan pihak lain.  \n\nBagi BPJS Kesehatan: Mencegah kebocoran dana akibat iuran fiktif dan klaim kesehatan tidak sah, serta mengontrol efisiensi anggaran klaim obat.  \n\nBagi Sistem JKN: Meningkatkan integritas data kepesertaan nasional dan mewujudkan ekosistem jaminan kesehatan yang andal, transparan, serta berkelanjutan."],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Djaka Santosa","s":null},{"n":"Ulfah Nur Mukharomah","s":null}]},{"id":"2731","tim":"ARRAY","inov":"Menekan Risiko Program JKN dengan Aplikasi Web Pemeriksaan Klaim Tepat Sasaran Berbasis Skor Risiko","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Klaim faskes adalah komponen biaya terbesar JKN, tetapi pemeriksaan manual hanya menjangkau sebagian klaim. Pola janggal seperti klaim berulang, rekam medis kembar, dan tarif di atas acuan sulit terlihat bila klaim dinilai satu per satu. Akibatnya dana peserta berisiko bocor, dan auditor tidak punya urutan prioritas yang jelas tentang klaim mana yang harus dilihat lebih dulu. Dibutuhkan alat yang menyorot klaim janggal sekaligus menjelaskan alasannya.","Membantu auditor memeriksa klaim yang paling janggal lebih dulu. Aplikasi memberi skor risiko 0–100 untuk setiap klaim beserta alasan yang mudah dibaca, sehingga pemeriksaan lebih tepat sasaran, lebih cepat, dan dapat dipertanggungjawabkan. Aplikasi juga dirancang agar dataset mudah diganti dan siap diuji pada data sampel resmi. Tujuan akhirnya menjaga dana JKN tetap untuk peserta yang membutuhkan.","JKN Shield adalah aplikasi web responsif yang berjalan di peramban, sehingga data tidak keluar dari perangkat pengguna. Pengguna mengunggah CSV klaim, faskes, wilayah, dan tarif INA-CBG, mencocokkan kolom, lalu aplikasi menghitung delapan sinyal: kemiripan rekam medis, klaim ganda, jarak peserta ke faskes, tarif terhadap acuan, beban dokter, rujukan, lama rawat, dan rawat ulang cepat. Hasilnya berupa antrean audit berskor, peta jarak, bukti per klaim, asisten tanya-jawab berbahasa Indonesia, dan laporan otomatis. Aplikasi sudah berjalan utuh sebagai prototipe. Pengujian memakai data sintetis bertemplat JKN demi menjaga privasi peserta. Mengganti dataset cukup dengan unggah ulang berkas CSV, lalu skor dihitung ulang otomatis.","Auditor dapat memusatkan waktu pada klaim berisiko tertinggi. Pada data uji sintetis, meninjau sekitar 22% klaim teratas sudah menjangkau semua skenario anomali yang ditanam. Peserta terlindungi karena dana terjaga, faskes yang jujur tidak terseret pemeriksaan acak, dan BPJS Kesehatan memperoleh pemeriksaan yang lebih efisien. Skor hanya indikasi untuk prioritas, sehingga keputusan akhir tetap di tangan auditor."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Yanuar Milad","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2744","tim":"RSU PINDAD TUREN","inov":"Integrasi Pelayanan Obat Antar Mitra BPJS","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Saat obat kosong di farmasi RS, pasien BPJS biasanya diminta mencari sendiri ke apotek lain, sering dengan biaya pribadi. Stok antar-fasilitas belum terintegrasi, pencarian dilakukan manual, dan proses antar-fasilitas tidak tercatat. Akibatnya obat pasien tertunda atau tidak diperoleh, dan tidak ada jejak yang dapat diaudit sehingga membuka celah klaim obat yang ditagihkan tetapi tidak diberikan (klaim fiktif).","Menghubungkan farmasi rumah sakit dengan apotek mitra BPJS Kesehatan agar pasien memperoleh obat saat stok RS kosong tanpa mengabaikan ketentuan penjaminan BPJS. Setiap permintaan, konfirmasi stok, verifikasi resep dan identitas, serta penyerahan obat tercatat dalam satu alur yang dapat diaudit, sehingga risiko klaim fiktif obat dapat ditekan.","Platform web terintegrasi untuk petugas farmasi RS dan apotek mitra BPJS di satu wilayah. \nAlur: \n1. obat kosong di RS\n2. pencarian lintas apotek mitra berdasarkan kecocokan obat, stok, jarak, dan kebaruan data\n3. petugas memesan ke apotek rekomendasi\n4. apotek mengonfirmasi stok aktual\n5. resep dan identitas diverifikasi\n6. pasien mengambil obat dan penyerahan dicatat. Fitur utama: pencarian stok lintas fasilitas, integrasi data stok, rekomendasi berbasis aturan (rule-based ranking), konfirmasi stok, permintaan pemenuhan, pelacakan status, verifikasi pelayanan, dan audit log.\n\nSistem hanya menyaring dan mengurutkan apotek tidak menentukan penggantian obat, kelayakan klaim BPJS, atau penyerahan otomatis. Keputusan tetap pada manusia.","Pasien mendapat obat lebih cepat dengan hak pelayanan tetap terjaga. RS lebih cepat mencari dan mengoordinasikan pemenuhan. BPJS memperoleh transaksi tercatat dan dapat diaudit, termasuk pencegahan klaim ganda. \nTarget: apotek bersetok ditemukan <10 menit, >90% permintaan terpenuhi, 100% transaksi berdokumen dan berstatus lengkap."],"r":[{"n":"Aries Kurniwan","s":null},{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Mohamad Komarudin","s":null}]},{"id":"2748","tim":"PT. MooApps Agriculture Technology","inov":"TEREO AI: AI-Powered Healthcare Claim Evidence Integrity System","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN memproses klaim kesehatan dalam skala besar, sehingga verifikasi bukti medis menjadi tantangan penting. Dokumen klaim dapat terlihat lengkap, tetapi mengandung manipulasi, duplikasi, ketidaksesuaian data, atau bukti yang hilang. Investigasi Kementerian Kesehatan RI pada 2024 menemukan 3.269 dari 4.341 klaim fisioterapi yang disampel tidak memiliki dokumentasi rekam medis yang sesuai. Diperlukan sistem verifikasi bukti yang lebih cerdas, konsisten, dan transparan.","Mengembangkan TEREO AI sebagai platform kecerdasan buatan untuk membantu meningkatkan integritas verifikasi klaim kesehatan JKN melalui deteksi manipulasi dokumen, pencocokan bukti medis lintas dokumen, identifikasi duplikasi, dan penilaian risiko. Sistem ini bertujuan mempercepat proses pemeriksaan, meningkatkan transparansi pengambilan keputusan, serta membantu petugas memprioritaskan klaim yang membutuhkan peninjauan lebih lanjut oleh manusia.","TEREO AI adalah platform AI untuk menjaga integritas bukti dalam proses verifikasi klaim kesehatan. Sistem mengintegrasikan dokumen klaim, rekam medis, kuitansi, resep, hasil laboratorium, gambar, dan data terstruktur untuk melakukan ekstraksi informasi menggunakan OCR, analisis isi dokumen, deteksi indikasi manipulasi gambar, pencocokan dokumen serupa, serta pemeriksaan konsistensi antarberkas. TEREO AI menghasilkan skor risiko, menandai anomali, menampilkan bukti dan alasan di balik setiap temuan, serta membantu memprioritaskan kasus untuk ditinjau petugas. Pendekatan multimodal dan explainable AI memungkinkan proses pemeriksaan yang lebih terarah, transparan, dan dapat diaudit. TEREO AI dirancang sebagai sistem pendukung keputusan, bukan pengganti verifikator manusia. Dengan demikian, klaim berisiko dapat diperiksa lebih mendalam berdasarkan bukti yang relevan sebelum keputusan akhir dibuat.","TEREO AI berpotensi meningkatkan efisiensi verifikasi klaim, mengurangi beban pemeriksaan manual, dan membantu mengidentifikasi indikasi fraud serta ketidaksesuaian bukti lebih dini. Skor risiko dan penjelasan temuan membantu petugas memprioritaskan kasus secara objektif, memperkuat akuntabilitas, dan mendukung penggunaan dana JKN yang lebih tepat sasaran. Dalam jangka panjang, solusi ini diharapkan mendukung tata kelola layanan kesehatan yang lebih transparan, terpercaya, dan berkelanjutan."],"r":[{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Juliana","s":null},{"n":"Raga Al Haqqi","s":null}]},{"id":"2750","tim":"Telisik","inov":"Telisik JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Ancaman utama JKN bukan tingginya angka kesakitan, tapi fraud oknum Faskes. Juli 2024, KPK temukan 75,3% klaim fisioterapi di 3 RS fiktif (Phantom Billing), dan indikasi fraud nasional sentuh Rp6,8 Triliun. Sistem V-Claim sangat baik memvalidasi administrasi, namun memiliki 'Kebutaan Pola' klinis. Mengandalkan ±1.000 Verifikator untuk meneliti ±2 juta klaim/hari memicu fatigue parah, membuat dokumen fiktif yang rapi mudah lolos. Dibutuhkan deteksi otomatis AI sebelum dana JKN dicairkan.","Membangun \"Telisik JKN\", sebuah Pre-Payment Anomaly Detection Engine berbasis AI (Kecerdasan Buatan) yang menjadi perisai intelijen penyaring klaim terintegrasi V-Claim. Tujuannya: mengotomasi triase jutaan klaim per hari secara real-time untuk memblokir indikasi fraud seperti Phantom Billing, Upcoding, & Pengurangan Obat di hulu. Sistem ini didesain mengamankan cashflow RS jujur via auto-approval, sekaligus mengurangi 83% beban Verifikator tanpa melanggar regulasi Human-in-the-Loop.","Telisik JKN memproses payload JSON klaim via arsitektur Dual-Core AI (FastAPI+Docker) dgn kapabilitas <200ms. Seluruh data pasien wajib melewati Pseudonymization (Zero PII) mematuhi UU PDP 27/2022. Layer 1 menggunakan Graph Neural Network (PyTorch) guna memetakan relasi jaringan Dokter-Pasien-RS untuk memburu sindikat Phantom Billing (misal: tabrakan jadwal operasi). Layer 2 memakai Isolation Forest (Unsupervised Learning) untuk melacak outlier statistik pada Upcoding & Pengurangan Obat tanpa hard-coding aturan. Skor Risiko gabungan (0-100) otomatis membagi klaim ke Triase: Jalur Hijau (Auto-Approval), Kuning (Flag untuk Audit), & Merah (Pre-Payment Hold). Untuk mencegah AI menjadi hakim sepihak, Telisik menerapkan Explainable AI (SHAP) yang menerjemahkan skor menjadi narasi klinis visual. Wewenang penolakan akhir 100% di tangan Verifikator BPJS (Permenkes 16/2019). Sistem juga dilengkapi Continuous Feedback Loop: koreksi Verifikator otomatis melatih ulang model AI.","Dampak Finansial: Piloting konservatif di 3 Kantor Cabang (fraud 2%) diproyeksi menyelamatkan ±Rp14 Miliar/tahun, menjaga uang JKN tetap mengalir ke pasien kritis. Dampak Operasional: Verifikator kini fokus pada 17% klaim anomali tertinggi. Explainable AI menurunkan waktu investigasi dari 15+ menit menjadi <2 menit per klaim, menaikkan kapasitas efektif 7,5x lipat tanpa ekstra SDM. Dampak Sosial: Melindungi nyawa pasien dari komplikasi akibat pemotongan obat sepihak oleh oknum faskes."],"r":[{"n":"Juliana","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2752","tim":"Firdaus","inov":"Jejak JKN: Rantai Bukti Digital Pencegah Fraud Klaim","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Sistem JKN rentan fraud (phantom, repeat billing, cloning) karena klaim cair hanya dengan dokumen tanpa verifikasi kehadiran pasien. Pada 2024, fraud mencapai Rp35,1M di 3 RS. Akar masalahnya: bukti terpusat di faskes sehingga mudah dimanipulasi, verifikasi hanya mengecek kelengkapan bukan keaslian, dan pasien tak pernah dilibatkan untuk memvalidasi rincian tagihannya.","Tujuan proposal ini mengimplementasikan \"Jejak JKN\" untuk mencegah fraud klaim melalui pembentukan rantai bukti digital terverifikasi. Sistem ini mengubah pengamanan dari reaktif menjadi verifikasi preventif sebelum bayar. Tujuannya melibatkan pasien sebagai verifikator independen layanan aktual, serta mengoptimalkan verifikasi lewat integrasi mulus dengan Mobile JKN dan sistem purifikasi BPJS untuk efisiensi dana JKN.","Jejak JKN adalah sistem verifikasi klaim berbasis rantai bukti digital yang melibatkan pasien sebagai verifikator akhir. Alurnya dimulai saat pasien memindai QR Dinamis di Mobile JKN untuk membuat identitas kunjungan sah. Segala tindakan medis dan obat dari farmasi lalu direkam menjadi satu data pelayanan lengkap. Sistem mengubah data ini menjadi teks ringkas via teknologi NLP agar mudah dipahami pasien. Sebelum pulang, pasien wajib memvalidasinya; jika salah, data direvisi, dan jika benar, pasien memindai QR keluar. Data tervalidasi inilah yang menjadi acuan mutlak. Saat faskes mengajukan klaim, sistem otomatis mencocokkannya dengan jejak layanan pasien untuk mendeteksi anomali. AI murni difungsikan sebagai alat bantu analisis (Sistem Pendukung Keputusan), sementara keputusan final mutlak di tangan verifikator manusia di BPJS.","Jejak JKN menekan klaim fiktif, mempercepat deteksi anomali, dan menjaga keberlanjutan dana JKN yang bebannya mencapai Rp175T pada 2024. Sistem ini memberi tiga manfaat utama: efisiensi waktu verifikasi dan cegah rugi bagi BPJS, keamanan identitas medis dan transparansi bagi pasien, serta pencairan klaim lebih cepat, objektif, dan minim investigasi manual bagi fasilitas kesehatan yang patuh."],"r":[{"n":"Ulfah Nur Mukharomah","s":null},{"n":"Wahyu Satriyo Wibowo","s":null},{"n":"I Made Karistiawan","s":null}]},{"id":"2756","tim":"CilukBa","inov":"AI Casemix Copilot","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Besarnya volume transaksi klaim layanan pada BPJS kesehatan ini membawa tantangan besar yakni mampu meningkatkan anomali klaim. Sebuah inovasi agen kecerdasan buatan berbasis Local Large Language Model (LLM) yang ditanamkan langsung pada peladen internal rumah sakit ini dapat menjadi solusi untuk membantu tim casemix untuk meminimalisir anomali klaim.","Mencegah Kesalahan / Anomali klaim sejak awal","Sistem ini memposisikan Kecerdasan Buatan (AI) sebagai asisten pintar dan petugas Casemix sebagai verifikator melalui pendekatan Human-in-the-Loop, dengan alur dan keunggulan sebagai berikut: Menggunakan model bahasa besar (Large Language Model) yang beroperasi secara lokal, sistem secara otomatis membaca narasi teks Catatan Perkembangan Pasien Terintegrasi (CPPT) dan mengekstrak entitas medis klinis. Pemetaan Kode Objektif yakni berdasarkan bukti klinis pada teks, AI menyajikan rekomendasi draf kode ICD-10 (diagnosis) dan ICD-9-CM (tindakan) secara objektif. Ini memastikan tindakan pengobatan yang ditagihkan benar-benar sesuai dengan indikasi medis yang tercatat, menutup celah manipulasi. Melalui dashboard interaktif, petugas koder hanya perlu meninjau, mengedit, atau menyetujui draf klaim buatan AI sebelum diteruskan ke sistem bridging e-Klaim BPJS. AI dijalankan sepenuhnya di dalam peladen (server) lokal rumah sakit tanpa mengirimkan data rekam medis pasien ke internet publik.","Dengan adanya sistem ini diharapkan mampu meringankan beban tim casemix dan mampu meminimalisir anomali klaim"],"r":[{"n":"Raga Al Haqqi","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2757","tim":"TELULANG","inov":"JKN-CryptoSentinel - Proposal Healthkathon 2026","kat":"Efisiensi Risiko pada Pemberi Kerja","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Iuran PPU dihitung dari upah dan jumlah pekerja yang dilaporkan sendiri oleh pemberi kerja, tetapi pemeriksa BPJS Kesehatan harus mencocokkan daftar gaji, e-DABU, dan data pembayaran yang terpisah, padahal selisih belum tentu pelanggaran. JKN-CryptoSentinel menjawabnya sebagai asisten pemeriksaan kecukupan bukti. HRD mengirim ketiga data itu ke satu tempat; sistem membentuk kasus serta memberi prioritas risiko. AI lokal mencocokkan lampiran dengan setiap klaim lalu mengusulkan status: didukung,","Membantu pemeriksa menilai kecukupan bukti pelaporan upah dan pekerja, lalu menuntaskan koreksi kepatuhan JKN secara terlacak. Secara khusus: (1) menilai bukti per klaim, bukan hanya selisih nominal; (2) memudahkan HRD pemberi kerja mengirim data dan menjawab klarifikasi di satu tempat; (3) menjaga keputusan tetap pada manusia lewat pemisahan tugas pemeriksa dan penyetuju; (4) memastikan koreksi diverifikasi sebelum kasus ditutup.","JKN-CryptoSentinel adalah asisten pemeriksaan kecukupan bukti untuk pelaporan upah dan pekerja JKN. HRD pemberi kerja mengirim tiga sumber data: daftar gaji, laporan e-DABU, dan data pembayaran. Sistem membentuk kasus dan memberi prioritas risiko. AI lokal memverifikasi isi lampiran terhadap setiap klaim, lalu mengusulkan status: didukung, deklarasi saja, bertentangan, atau belum ada bukti. Pemeriksa BPJS Kesehatan meninjau usulan itu dan menetapkan hasil. Penyetuju yang berbeda orang menjadi mata kedua (empat mata, dikunci di server). HRD mengoreksi, pemeriksa memverifikasi dan menutup kasus. Lampiran diberi sidik SHA-256; pekerja dapat melihat datanya sendiri dan menulis klarifikasi. AI hanya mengusulkan dan tidak pernah memutuskan, sedangkan data diproses lokal tanpa keluar perangkat. Prototipe berjalan dengan data sintetis; hasil pada data nyata belum diklaim dan kami siap menguji lewat pilot terbatas.","Bagi pemeriksa, waktu telaah ditargetkan turun 30%, setara kapasitas naik 43% tanpa tambah petugas; klarifikasi maksimal 2 putaran dan keselarasan putusan minimal 80%. Bagi DJS, tiap koreksi upah Rp1 juta/bulan menambah iuran Rp600 ribu/tahun per pekerja; biaya pilot 3 tahun (±Rp21 juta) impas bila sekitar 15 pekerja terkoreksi. Bagi pekerja, tiap pekerja yang didaftarkan melindungi hingga 5 jiwa. Empat mata, SHA-256, dan jejak keputusan sudah lulus 114 uji; angka lain dibuktikan saat pilot."],"r":[{"n":"Mohamad Komarudin","s":null},{"n":"Aries Kurniwan","s":null},{"n":"Susi Lusiani","s":null}]},{"id":"2766","tim":"FTRC Ngacir","inov":"ClaimGuard JKN","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["JKN saat ini mengalami tekanan finansial, tercatat Rasio klaim JKN pada Juni 2026 adalah 108,7% dan potensi fraud Rp. 6,8 triliun pada periode bulan Jan-Okt 2025. Sedangkan verifikasi manual memiliki keterbatasan di sisi akurasi dan ketepatan dalam menghadapi jutaan klaim setiap harinya. oleh karena itu kami membuat sistem berbasis Hybrid Explainable AI dan Clinical Rule Engine, yang dapat membantu pengambilan keputusan oleh verifikator klaim menjadi lebih efektif.","Didasari oleh tingginya tingkat klaim 108,7% dan potensi fraud sebesar Rp6,8T menurut Kompas.com, proposal ini ditujukan untuk mengembangkan ClaimGuard JKN yaitu sebuah sistem yang membantu verifikator menyaring banyaknya berkas klaim dengan efisien dan memperkuat pencegahan dini terhadap 6 pola risiko utama: upcoding, cloning, unbundling, repeat billing, tagihan berlebih (inflated), dan perpanjangan lama rawat (LOS). Tetapi sistem berfungsi sebagai alat pembantu,bukan pengambil keputusan akhir","ClaimGuard adalah alat skrining atau pendeteksi klaim berbasis Hybrid Explainable AI dan Clinical Rule Engine yang membantu verifikator dalam menemukan anomali atau ketidakwajaran klaim secara cepat, transparan dan dapat di jelaskan :\n\nSistem ClaimGuard memiliki tiga lapis sistem :\n\n1. Clinical Rule Engine : Menangani unbundling, repeate billing, dan klaim cloning dengan cara memvalidasi regulasi dan analisa kemiripan profil dari klaim.\n2. Fair-Value Regression (Huber): Mengestimasi batas wajar tarif, obat, dan lama rawat inap(LOS) yang akan menangani anomali upcoding, inflated bills, dan Prolonge LOS.\n3. Ensemble Risk Combiner: Mengkalibrasi sinyal anomali menjadi skor risiko (0-100) dan menyusun antrian prioritas verifikasi otomatis.\n\nClaimGuard beroperasi in memory dengan kecepatan yang tinggi (35ms/ 100 klaim) dengan prinsip human in the loop (AI sebagai tools  pembantu dalam decision making, keputusan akhir 100% tetap berada di tangan verifikator), serta patuh UU PDP No. 27.","Dampak yang diharapkan dari proposal ini adalah untuk menghasilkan sistem pembantu verifikasi yang tepat dan cepat, agar meringankan dan mempermudah tugas dari verifikator klaim agar menjadi lebih efektif. Solusi ini juga diharapkan bisa meningkatkan arus kas faskes yang diperlambat oleh klaim wajar tetapi terhambat karena terkena false flagging, meningkatkan mutu layanan jaminan kesehatan dan juga mengamankan Dana Jaminan Sosial agar bisa meningkatkan lingkup atau jangkauan perlindungan JKN."],"r":[{"n":"Djaka Santosa","s":null},{"n":"Ardhy Widhiantoro","s":null},{"n":"Septian Firmansyah","s":null}]},{"id":"2769","tim":"Hami Patolu","inov":"JKN-GUARD XAI_Hami Patolu","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Proses review klaim JKN perlu menilai kesesuaian kondisi pasien, diagnosis, obat, dan tindakan pengobatan. WHO memperkirakan kesalahan pengobatan menimbulkan beban global US$42 miliar per tahun. Di Indonesia, penelitian juga menemukan 927 kesalahan pemberian obat dan 338 laporan kesalahan pengobatan di rumah sakit. Kondisi ini berisiko membahayakan pasien, meningkatkan biaya, dan membebani sistem JKN. Oleh karena itu, JKN-Guard AI menggunakan Explainable AI untuk mendeteksi pola risiko klinis.","JKN-Guard AI dikembangkan untuk meningkatkan efektivitas review klaim JKN dengan mengidentifikasi ketidaksesuaian kondisi pasien, diagnosis, obat, dan tindakan. Melalui Explainable AI, sistem menampilkan faktor risiko dan penjelasannya agar verifikator dapat memprioritaskan klaim yang perlu ditinjau, mendukung keselamatan pasien, efisiensi biaya, dan ketepatan verifikasi tanpa menggantikan keputusan tenaga kesehatan maupun verifikator.","JKN-Guard AI merupakan sistem pendukung layanan kesehatan berbasis Artificial Intelligence (AI) yang mengintegrasikan Clinical Decision Support dan Explainable AI (XAI) untuk mendukung ketepatan pengobatan dan verifikasi klaim JKN. Pada tahap pelayanan, sistem membantu tenaga kesehatan menganalisis kondisi klinis pasien, memeriksa kesesuaian diagnosis dan pengobatan, serta memberikan rekomendasi berbasis bukti yang dilengkapi penjelasan faktor pendukung dan risiko. Setelah pelayanan terdokumentasi dan klaim terbentuk, AI menganalisis potensi ketidaksesuaian antara kondisi pasien, diagnosis, obat, tindakan, dan data klaim. Sistem menampilkan skor risiko, faktor pemicu, serta alasan yang transparan agar verifikator dapat memprioritaskan klaim yang memerlukan pemeriksaan lebih lanjut. JKN-Guard AI bertujuan mendukung keselamatan pasien, penggunaan obat yang rasional, efisiensi biaya, dan ketepatan verifikasi klaim tanpa menggantikan keputusan tenaga kesehatan maupun verifikator.","JKN-Guard AI diharapkan meningkatkan ketepatan pengobatan melalui rekomendasi berbasis bukti serta membantu mendeteksi potensi ketidaksesuaian klaim sejak dini. Penjelasan AI yang transparan memudahkan tenaga kesehatan memahami rekomendasi dan membantu verifikator memprioritaskan klaim berisiko. Dengan demikian, sistem berpotensi mendukung keselamatan pasien, penggunaan obat rasional, efisiensi biaya, dan proses verifikasi klaim JKN yang lebih tepat."],"r":[{"n":"Djaka Santosa","s":null},{"n":"I Made Karistiawan","s":null},{"n":"Wahyu Satriyo Wibowo","s":null}]},{"id":"2779","tim":"Xris","inov":"JKN ClaimWise Verifikasi Klaim Berbasis Bukti untuk Deteksi Upcoding & Unbundling Pra-Pembayaran","kat":"Efisiensi Risiko pada Fasilitas Kesehatan","f":null,"fw":"","lk":0,"dec":"","fd":"","rv":"","sub":["Program JKN melayani ratusan juta peserta dengan volume klaim raksasa, sehingga verifikasi jadi beban berat. Sumber inefisiensi: upcoding (kode/severity naik tanpa bukti klinis) dan unbundling (paket layanan dipecah jadi klaim terpisah). Tim Ahli Pengodean Klinis (2021–2023) mencatat 440.749 kasus dispute senilai Rp873,1 miliar, direduksi 80,43% lewat intervensi. Karena verifikasi berjalan pasca-bayar, dibutuhkan solusi pra-bayar yang membantu verifikator memeriksa klaim berbasis bukti klinis.","Membantu verifikator BPJS memprioritaskan klaim berisiko melalui risk score berbasis bukti. 2) Mendeteksi indikasi upcoding & unbundling dengan membandingkan narasi klinis vs kode yang diklaim. 3) Menyediakan simulasi koreksi (what-if) agar keputusan koreksi transparan. 4) Mencatat setiap keputusan dalam jejak audit yang dapat ditelusuri.","JKN ClaimWise adalah workbench validasi klaim pra-pembayaran. Sistem menerima dua input: narasi klinis (resume medis/CPPT berbahasa Indonesia) dan kode klaim (ICD-10, ICD-9-CM, severity). LLM mengekstrak fakta klinis beserta kutipan kalimat bukti, lalu aturan deterministik memeriksa indikasi upcoding, unbundling, dan dx-mismatch — menghasilkan risk score 0–100 untuk prioritisasi, bukan vonis. Fitur what-if mensimulasikan skenario koreksi yang sah beserta selisih tarifnya. Verifikator meninjau tampilan side-by-side, lalu memilih Setujui/Investigasi/Tolak; keputusan tercatat di jejak audit. Prinsip: AI menyaring, manusia memutuskan. Prototype diuji pada 200+ kasus sintetis berlabel.","Dampak yang diharapkan: (1) verifi
