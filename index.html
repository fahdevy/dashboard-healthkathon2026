<title>Healthkathon 2026 | Masuk</title>
<style>
:root{--bg:#EEF3F0;--surface:#fff;--ink:#142320;--muted:#586a64;--line:#D7E0DB;--band:#0B3B36;--mint:#3FD1B5;--accent:#0E6B5E;--fail:#B5372F}
@media (prefers-color-scheme:dark){:root{--bg:#0E1513;--surface:#162019;--ink:#E3ECE8;--muted:#95A59E;--line:#26332E;--band:#0A2926;--accent:#4DBBA8;--fail:#EF8078}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 28px -12px rgba(11,59,54,.28)}
.top{background:var(--band);color:#E8F5F1;padding:20px 22px}
.top small{display:block;color:var(--mint);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.top h1{margin:6px 0 0;font-size:21px;line-height:1.2}
form{padding:20px 22px 22px}
label{display:block;font-weight:600;margin:12px 0 5px}
input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 13px;min-height:44px;font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
button{width:100%;margin-top:18px;min-height:44px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button[disabled]{opacity:.55;cursor:wait}
#e{color:var(--fail);min-height:1.5em;margin:12px 0 0}
p.n{color:var(--muted);font-size:13px;margin:8px 0 0}
</style>
</head>

</div>

function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function unlock(u,p){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey("raw",enc.encode(u.trim().toLowerCase()+"\n"+p),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  var stream=new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}
function show(html){document.open();document.write(html);document.close();}
var f=document.getElementById("f"),e=document.getElementById("e"),b=document.getElementById("b");
if(!(window.crypto&&crypto.subtle&&window.DecompressionStream)){

}
async function go(u,p,silent){
  try{ var html=await unlock(u,p); try{sessionStorage.setItem(SK,JSON.stringify({u:u,p:p}))}catch(x){} show(html); return true; }
  catch(x){ if(!silent) e.textContent="Nama pengguna atau password tidak sesuai."; return false; }
}
(async function(){
  var s=null; try{s=JSON.parse(sessionStorage.getItem(SK))}catch(x){}
  if(s&&s.u&&s.p){ if(await go(s.u,s.p,true)) return; try{sessionStorage.removeItem(SK)}catch(x){} }

    var ok=await go(document.getElementById("u").value,document.getElementById("p").value,false);

  };
})();
})();
