<style>

te);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.metric{padding:17px 18px;min-height:128px;position:relative;overflow:hidden}.metric:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--green)}.metric.gold:before{background:var(--gold)}.metric.red:before{background:var(--red)}.metric.blue:before{background:#2a69a5}.metric span{display:block;color:var(--muted);font-size:13px;font-weight:700}.metric strong{display:block;margin-top:10px;color:var(--green);font-size:clamp(27px,3vw,38px);line-height:1.05;font-variant-numeric:tabular-nums}.metric.gold strong{color:#ad7417}.metric.red strong{color:#ad4840}.metric small{display:block;margin-top:7px;color:var(--muted);font-size:12px}.twocol{grid-template-columns:1fr 1fr}.panel{padding:24px;min-width:0}.panel h3{margin:0;font-size:19px}.panel-intro{margin:4px 0 18px;color:var(--muted);font-size:13px}.progress-list{display:grid;gap:16px}.progress-label{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px;font-size:13px;font-weight:700}.progress-label span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}.track{height:11px;border-radius:99px;background:#e6eeea;overflow:hidden}.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#087d6a,#43d2b3);transition:width .35s}.fill.gold{background:linear-gradient(90deg,#c78a20,#f0c76f)}.submetrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:17px}.submetric{padding:11px;border-radius:13px;background:var(--soft);text-align:center}.submetric strong{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}.submetric span{font-size:10px;color:var(--muted);font-weight:800}.decision-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.decision{padding:15px;border-radius:14px;background:var(--soft);display:flex;justify-content:space-between;align-items:center;gap:10px}.decision span{font-size:12px;color:var(--muted);font-weight:700}.decisi podium-team{font-weight:850;font-size:15px;line-height:1.25;overflow-wrap:anywhere}.podium-meta{margin-top:5px;color:var(--muted);font-size:11px}.podium-score{margin-top:14px;color:#08755f;font-size:25px;font-weight:900;letter-spacing:-.03em}.podium-score small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:0}.chart-list{display:grid;gap:10px}.chart-row{display:grid;grid-template-columns:minmax(100px,1.1fr) minmax(100px,2fr) 54px;gap:10px;align-items:center}.chart-team{font-size:12px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chart-track{height:13px;border-radius:99px;background:#e9efeb;overflow:hidden}.chart-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#087d6a,#43d2b3)}.chart-fill.fail{background:linear-gradient(90deg,#bd564c,#ed8a7e)}.chart-score{text-align:right;font-size:12px;font-weight:850;font-variant-numeric:tabular-nums}.formula{padding:15px;background:#e9f2ee;border-radius:13px;color:#294c44;font-size:13px;margin:12px 0}.formula b{color:#086b59}.chart-note{font-size:12px;color:var(--muted);margin:12px 0 0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:13px}.toolbar input,.toolbar select{min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink)}.toolbar input{flex:1;min-width:210px}.result-count{margin-left:auto;color:var(--muted);font-size:13px;font-weight:700}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:white;max-height:680px}.result-table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}.result-table th,.result-table td{padding:12px 14px;border-bottom:1px solid #e8eeeb;text-align:left}.result-table th{position:sticky;top:0;background:#f0f5f2;color:#52665f;font-size:12px;text-transform:uppercase;letter-spacing:.04em;z-index:1}.result-table td{font-size:13px}.result-table tr:last-child td{border-bottom:0}.result-table tr:hover td{background:#f8fbf9}.rank-cell{width:86px;font-weight:850;color:#567168}.team-cell{font-weight:800;min-width:210px}.score-cell{font-weight:900;color:#08755f;font-variant-numeric:tabular-nums}.status-badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:#e2f4eb;color:#26734b;font-size:11px;font-weight:850;white-space:nowrap}.status-badge.fail{background:#fce9e6;color:#a64740}.status-badge.pending{background:#fff3d8;color:#9a6a16}.status-badge.closed{background:#edf0ef;color:#65736f}.empty-state{padding:24px;text-align:center;color:var(--muted)}.live-error{display:none;margin-top:14px;padding:11px 14px;background:#fff1ef;border:1px solid #f2cfca;color:#9d433c;border-radius:12px;font-size:13px}.live-error.show{display:block}.footnote{margin-top:22px;padding:13px 16px;border-radius:13px;background:#f8faf9;border:1px solid var(--line);color:var(--muted);font-size:12px}.loading{opacity:.65}

/* ---------- tambahan dashboard penilaian project final ---------- */
.nav a{cursor:pointer}
.login-card{max-width:460px;margin:26px auto}
.login-card h2{margin:0 0 4px;font-size:22px}.login-card p{margin:0 0 16px;color:var(--muted);font-size:14px}
.login-card label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.login-card input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
.login-card button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:999px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}
.login-card button[disabled]{opacity:.6;cursor:wait}
.login-err{margin-top:12px;padding:10px 13px;background:#fff1ef;border:1px solid #f2cfca;color:#9d433c;border-radius:12px;font-size:13px;display:none}.login-err.show{display:block}
.bar-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn-lock{border:0;border-radius:999px;background:#7a4e07;color:#fff;font-size:13px;font-weight:800;padding:10px 16px;cursor:pointer}
.btn-lock.open{background:#123e6e}
.lockbanner{margin:14px 0 0;padding:11px 15px;border-radius:13px;background:#fff3d8;border:1px solid #ecd49a;color:#7a4e07;font-size:13.5px;font-weight:700}
.warnbanner{margin:14px 0 0;padding:11px 15px;border-radius:13px;background:#fff1ef;border:1px solid #f2cfca;color:#9d433c;font-size:13.5px;font-weight:700}
.donut{--done-end:0%;--active-end:0%}
.podium.p3{grid-template-columns:repeat(3,minmax(0,1fr))}
.podium.p3 .podium-card:nth-child(n+4){display:flex}
.podium-card{cursor:pointer;text-align:left;font:inherit;color:inherit}
.podium-card:hover{border-color:var(--green)}
.podium-card:nth-child(1){background:linear-gradient(145deg,#fff8e6,#f4e6bd)}
.podium-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat-title{display:flex;align-items:center;gap:10px;margin:18px 0 10px;font-size:16px;font-weight:850}
.cat-title:before{content:"";width:10px;height:10px;border-radius:3px;background:#1c65a5}
.cat-title.c2:before{background:#11804f}.cat-title.c3:before{background:#6d4baa}
.stack{height:13px;border-radius:99px;background:#e9efeb;overflow:hidden;display:flex}
.stack i{display:block;height:100%}.stack .s1{background:linear-gradient(90deg,#087d6a,#43d2b3)}.stack .s2{background:#edc26e}
.rev-row{display:grid;grid-template-columns:minmax(110px,1.1fr) minmax(100px,2fr) 70px;gap:10px;align-items:center;font-size:12.5px}
.rev-row .nm{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rev-row .ct{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.rng{position:relative;height:13px;border-radius:99px;background:#e9efeb}
.rng i{position:absolute;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#c78a20,#f0c76f)}
.rng b{position:absolute;top:-2px;width:3px;height:17px;border-radius:2px;background:#6b4a0a;opacity:.85}
.cal-row{display:grid;grid-template-columns:minmax(130px,1.2fr) minmax(120px,2fr) 80px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #e8eeeb;font-size:13px;cursor:pointer}
.cal-row:last-child{border-bottom:0}.cal-row:hover .cal-n{color:var(--green)}
.cal-n{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cal-n small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.cal-v{text-align:right;font-weight:850;color:#9a6a16;font-variant-numeric:tabular-nums}
.scorebar{display:flex;align-items:center;gap:9px;min-width:150px}
.scorebar .t{flex:1;height:9px;border-radius:99px;background:#e9efeb;overflow:hidden;min-width:60px}.scorebar .t i{display:block;height:100%;background:linear-gradient(90deg,#087d6a,#43d2b3);border-radius:99px}
.scorebar b{font-weight:900;color:#08755f;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.rkn{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:50%;background:var(--soft);font-weight:850;font-size:12.5px;color:#567168}
.rkn.top{background:#fff3d8;color:#8a6b23;border:2px solid #d5b35b}
.cv{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;text-align:center}
.tname{font-weight:800;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:var(--ink);font-size:13.5px}.tname:hover{color:var(--green);text-decoration:underline}
.tsub{font-size:11.5px;color:var(--muted);max-width:46ch;line-height:1.35}
.cal-tag{display:inline-flex;padding:4px 8px;border-radius:999px;background:#fff3d8;color:#9a6a16;font-size:11px;font-weight:850;white-space:nowrap}
.cat-block{margin-top:6px}.cat-block h3{margin:18px 0 10px;font-size:17px}
.mini-note{color:var(--muted);font-size:12.5px;margin:8px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.crit-tbl{width:100%;border-collapse:collapse;font-size:13px}.crit-tbl th,.crit-tbl td{padding:9px 10px;border-bottom:1px solid #e8eeeb;text-align:left;vertical-align:top}.crit-tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#52665f}
.scrim{position:fixed;inset:0;background:#06201c66;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--paper);box-shadow:-18px 0 50px #06201c40;transform:translateX(105%);transition:transform .25s;z-index:41;overflow:auto;padding:22px}
.drawer.on{transform:none}
.drawer .x{float:right;border:0;background:#fff;border:1px solid var(--line);border-radius:999px;width:36px;height:36px;font-size:20px;cursor:pointer}
.drawer h2{margin:6px 0 4px;font-size:24px;letter-spacing:-.02em}.drawer .ey{font-size:12px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.drawer .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.dkpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.dkpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}.dkpi b{display:block;font-size:24px;color:var(--green);font-variant-numeric:tabular-nums}.dkpi span{font-size:12px;color:var(--muted);font-weight:700}
.dlinks{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:12px 0;font-size:13.5px;display:grid;gap:6px}.dlinks a{color:#123e6e;font-weight:700;word-break:break-all}
.mtx{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}.mtx th,.mtx td{padding:8px 10px;border-bottom:1px solid #e8eeeb;text-align:center}.mtx th:first-child,.mtx td:first-child{text-align:left}.mtx th{background:#f0f5f2;font-size:11.5px;color:#52665f}
.note{white-space:pre-line;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 10px}
.dsec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:10px 0}.dsec h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#52665f}.dsec p{margin:0;font-size:13.5px;line-height:1.55;white-space:pre-line}
.aud-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.aud{border-collapse:collapse;width:100%;min-width:1180px;font-size:12.5px}.aud th,.aud td{padding:10px 11px;border-bottom:1px solid #e8eeeb;text-align:center;vertical-align:middle}.aud th{background:#f0f5f2;color:#52665f;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}
.aud td:first-child,.aud th:first-child{text-align:left;font-weight:800}.aud td.na{color:#a3b0ab}
.aud td.warn{background:#fff6e3;color:#8a5d10;font-weight:800}.aud td.ok{color:#26734b;font-weight:700}
.aud-st{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:850;white-space:nowrap}.aud-st.ok{background:#e2f4eb;color:#26734b}.aud-st.watch{background:#fff3d8;color:#9a6a16}.aud-st.review{background:#fbe3e0;color:#a2392f}.aud-st.na{background:#edf0ef;color:#65736f}
.aud-fl{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:5px}.aud-fl span{background:#fff3d8;color:#8a5d10;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:800}

<body>
<div class="wrap">
<header class="appbar"><div><div class="appbrand">Dashboard Capaian Peserta | Healthkathon 2026</div><div class="appsub">JKN Future Shield · Detect Smarter, Protect JKN</div></div><div class="sync-pill" id="conn" role="status" aria-live="polite"><i class="sync-dot"></i><span id="connT">Belum masuk</span></div></header>
<nav class="nav" aria-label="Navigasi dashboard"><a href="index.html" target="_top">Dashboard Utama</a><a href="penilaian.html" target="_top">Penilaian Proposal</a><a href="nilai.html" target="_top">Form Penilaian (Tim Penilai)</a><a class="active" href="penilaian_final.html" target="_top" aria-current="page">Dashboard Penilaian Final</a><a href="nilai_final.html" target="_top">Form Penilaian Final</a></nav>

</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detail proyek"></aside>
<div id="toast" role="status"></div>
<script>
/*DATA_START*/
const CFG={"mode": "live", "api": "https://script.google.com/macros/s/AKfycbw3CH_03d_LrMKod-9q3wv3W_x7rcTMKCWzmc2XLop7LKGSeVoGzL0sj29bVuIK30E/exec", "spFinal": "", "skalaMax": 100, "perProyek": 3, "finalis": 20, "tahap": {"id": "t1", "nama": "Tahap 1: Seleksi 20 Besar"}, "panduanRentang": [{"min": 0, "max": 39, "label": "Kurang"}, {"min": 40, "max": 59, "label": "Cukup"}, {"min": 60, "max": 79, "label": "Baik"}, {"min": 80, "max": 100, "label": "Sangat baik"}], "selisih": 12, "kriteria": [{"n": "Kesiapan Produk (Fungsionalitas, Kualitas, dan Usability)", "w": 0.3, "ket": "Seberapa siap produk digunakan dan diimplementasikan di lingkungan BPJS Kesehatan? Dinilai dari demo yang disampaikan: (1) fungsionalitas inti berjalan end to end sesuai klaim; (2) kualitas dan keandalan (akurasi atau kinerja model, minim galat); (3) usability, yaitu alur jelas dan mudah dipakai pengguna sasaran; (4) efisiensi waktu proses dan sumber daya; (5) kemajuan produk yang terlihat dibandingkan penilaian 20 besar. Produk yang hanya berupa mockup atau slide tanpa fungsi nyata dinilai rendah."}, {"n": "Dampak dan Efisiensi Risiko", "w": 0.25, "ket": "Seberapa besar dan terukur dampak solusi terhadap efisiensi risiko program JKN (kecurangan, pemborosan, ketidakpatuhan) atau peningkatan kualitas layanan? Dampak harus measurable: ada baseline, target, indikator keberhasilan, dan estimasi penghematan atau RoI dengan asumsi yang jelas. Dinilai pula kesesuaian dengan kategori lomba dan kebutuhan nyata pengguna di BPJS Kesehatan."}, {"n": "Kreativitas, Inovasi, dan Pemanfaatan Teknologi", "w": 0.15, "ket": "Sejauh mana solusi merupakan pendekatan yang baru dan berbeda dari cara konvensional di layanan kesehatan? Seberapa tepat menggunakan GenAI, Machine Learning, atau teknologi lain: teknologi harus memberi nilai tambah nyata dan efektif, bukan sekadar dipakai."}, {"n": "Bisnis Model dan Keberlanjutan", "w": 0.15, "ket": "Apakah solusi dapat diimplementasikan dengan mudah, beroperasi berkelanjutan, dan diperluas ke seluruh wilayah Indonesia? Solusi cost-oriented (efisiensi operasional) atau profit-oriented (peluang penghasilan baru) harus menunjukkan analisis biaya yang jelas dalam konteks dana publik BPJS Kesehatan, termasuk rencana pemeliharaan dan integrasi dengan sistem yang ada."}, {"n": "Presentasi, Demo, dan Komunikasi", "w": 0.15, "ket": "Seberapa baik penyampaian ide, alur, fungsionalitas, dan manfaat solusi dalam presentasi: jelas, terstruktur, dan relevan dengan kebutuhan audiens. Dinilai pula kualitas demo atau simulasi yang disampaikan, yaitu apakah menunjukkan fungsi dan manfaat solusi dengan jelas, serta kerapian materi dan ketepatan durasi. Penilaian hanya berdasarkan presentasi dan demo yang disampaikan tim."}], "audit": {"min_durasi_detik": 300, "burst_proyek": 8, "burst_menit": 15, "seragam_persen": 30, "seragam_rentang": 2, "sd_min": 3, "bias_poin": 8, "mad_poin": 12, "korelasi_min": 0.2, "min_data": 8, "video_tak_dibuka_persen": 60, "proyek_cepat_persen": 25, "proyek_cepat_kuat_persen": 50, "durasi_video_rata_menit": 10, "jeda_sesi_menit": 90}, "users": [], "teams": [], "page": "dash"};
/*DATA_END*/
</script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const C=CFG.kriteria, K=C.length, SMAX=CFG.skalaMax, SSK="hk_final_session_dash", REFRESH=30000;
const fmt=(n,d)=>n==null||isNaN(n)?"-":n.toFixed(d==null?1:d).replace(".",",");
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const IDX_DAMPAK=C.findIndex(c=>/^dampak/i.test(c.n)), IDX_SIAP=C.findIndex(c=>/kesiapan/i.test(c.n));
const katShort=k=>String(k||"-").replace("Efisiensi Risiko pada ","");
const initial={f:"all",kat:"all",q:""}; let V=Object.assign({},initial);

/* ---------- state ---------- */
let TOKEN="", ME=null, TEAMS=[], REVIEWERS=[], STORE={}, AUDIT={akt:[],log:[],warn:[]}, LOCKED=false, LOADING=false, CONN={ok:true,msg:"",at:null};
try{ const s=JSON.parse(sessionStorage.getItem(SSK)); if(s&&s.tok){ TOKEN=s.tok; LOADING=true; } }catch(e){}
const rowKey=(id,u)=>id+"|"+u, getRow=(id,u)=>STORE[rowKey(id,u)]||null;
const raw=s=>s.reduce((a,v,k)=>a+(v!=null?C[k].w*v:0),0), pct=s=>raw(s)/SMAX*100, nFill=s=>s.filter(v=>v!=null).length, EMPTY=()=>Array(K).fill(null);
let INFO={}, RANK=[], CATRANK={}, CATLIST={}, TB={}, UN={};
function teamInfo(t){
  const rs=t.rv.map(u=>{ const r=getRow(t.id,u), s=r?r.s:EMPTY(), f=nFill(s); return {u,s,f,c:r?r.c:"",score:f===K?pct(s):null}; });
  const done=rs.filter(r=>r.score!=null), N=rs.length, complete=N>0&&done.length===N, sc=done.map(r=>r.score);
  return {rs,N,done:done.length,started:rs.filter(r=>r.f>0).length,complete,crit:C.map((_,k)=>avg(done.map(r=>r.s[k]))),
    total:complete?avg(sc):null,interim:sc.length?avg(sc):null,spread:sc.length>1?Math.max(...sc)-Math.min(...sc):null,min:sc.length?Math.min(...sc):null,max:sc.length?Math.max(...sc):null};
}
function recompute(){
  TB=Object.fromEntries(TEAMS.map(t=>[t.id,t])); UN=Object.fromEntries(REVIEWERS.map(r=>[r.u,r.name]));
  INFO={}; TEAMS.forEach(t=>INFO[t.id]=teamInfo(t));
  const cmp=(a,b)=>{ const A=INFO[a.id],B=INFO[b.id]; if(B.total!==A.total) return B.total-A.total;
    const d=(B.crit[IDX_DAMPAK]||0)-(A.crit[IDX_DAMPAK]||0); if(d) return d; const s=(B.crit[IDX_SIAP]||0)-(A.crit[IDX_SIAP]||0); if(s) return s; return a.id<b.id?-1:1; };
  RANK=TEAMS.filter(t=>INFO[t.id].complete).sort(cmp);
  CATRANK={}; CATLIST={}; RANK.forEach(t=>{ (CATLIST[t.kat]=CATLIST[t.kat]||[]).push(t); CATRANK[t.id]=CATLIST[t.kat].length; });
}
const statusOf=t=>{ const i=INFO[t.id]; return i.complete?"lengkap":i.started?"sebagian":"belum"; };
const cats=()=>[...new Set(TEAMS.map(t=>t.kat))].sort((x,y)=>TEAMS.filter(t=>t.kat===y).length-TEAMS.filter(t=>t.kat===x).length||(x<y?-1:1));
const sortCat=list=>list.slice().sort((a,b)=>{ const ra=CATRANK[a.id],rb=CATRANK[b.id]; if(ra&&rb) return ra-rb; if(ra) return -1; if(rb) return 1; return (INFO[b.id].interim||0)-(INFO[a.id].interim||0)||(a.id<b.id?-1:1); });

/* ---------- API ---------- */
async function apiPost(b,ms){
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),ms||30000);
  try{ const r=await fetch(CFG.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b),cache:"no-store",credentials:"omit",signal:ctl.signal});
    if(!r.ok) throw new Error("http "+r.status); return await r.json(); } finally{ clearTimeout(to); }
}
async function liveLoad(scoresOnly){
  const d=await apiPost({action:"final_read",token:TOKEN,scores_only:!!scoresOnly,audit:true});
  if(!d.ok){ const e=new Error(d.err||"gagal"); e.code=d.err; throw e; }
  if(d.role!=="admin"){ const e=new Error("role"); e.code="role"; throw e; }
  if(!scoresOnly||!TEAMS.length){ TEAMS=d.teams; REVIEWERS=d.reviewers; }
  AUDIT=Array.isArray(d.audit)?{akt:d.audit,log:[],warn:[]}:Object.assign({akt:[],log:[],warn:[]},d.audit||{});
  STORE={}; d.rows.forEach(r=>{ STORE[rowKey(r.id,r.u)]={s:r.s,c:r.c||"",t:Date.parse(r.t)||0}; });
  ME={u:d.me.u,name:d.me.name}; LOCKED=!!d.locked; CONN={ok:true,msg:"",at:new Date()}; recompute();
}
function errText(e){
  const c=e.code||e.message;
  return c==="invalid_credentials"||c==="bad"?"Nama pengguna atau password tidak sesuai."
   :c==="role"?"Akun ini bukan akun panitia (admin). Gunakan akun admin."
   :c==="final_not_initialized"?"Penilaian final belum diaktifkan di server (setupFinal belum dijalankan)."
   :c==="auth_not_initialized"?"Server belum siap."
   :c==="action_not_allowed"?"Server belum diperbarui: versi Apps Script yang memuat penilaian final belum di-deploy (Deploy > Manage deployments > Edit > New version)."
   :e.name==="AbortError"?"Server tidak merespons. Coba lagi."
   :(e instanceof TypeError||/^http /.test(e.message))?"Tidak dapat terhubung ke server. Periksa koneksi lalu coba lagi."
   :"Kesalahan server (kode: "+esc(c)+"). Hubungi panitia.";
}
async function doLogin(ev){
  ev.preventDefault(); const err=$("#lerr"), btn=$("#lbtn"); err.className="login-err"; btn.disabled=true; btn.textContent="Memeriksa...";
  try{
    const d=await apiPost({action:"login",username:$("#lu").value.trim(),password:$("#lp").value},60000);
    if(!d.ok){ const e=new Error(d.err||"bad"); e.code=d.err||"bad"; throw e; }
    TOKEN=d.token;
    try{ await liveLoad(false); }catch(e){ apiPost({action:"logout",token:TOKEN}).catch(()=>{}); TOKEN=""; throw e; }
    try{ sessionStorage.setItem(SSK,JSON.stringify({tok:TOKEN})); }catch(e){}
    render();
  }catch(e){ err.textContent=errText(e); err.className="login-err show"; btn.disabled=false; btn.textContent="Masuk"; }
}
function logout(){ if(TOKEN) apiPost({action:"logout",token:TOKEN}).catch(()=>{}); TOKEN=""; ME=null; TEAMS=[]; REVIEWERS=[]; STORE={}; try{sessionStorage.removeItem(SSK)}catch(e){} closeDrawer(); render(); }
async function refreshNow(manual){
  if(!ME||LOADING) return;
  if(!manual){ const ae=document.activeElement; if(document.hidden||$("#drawer").classList.contains("on")||(ae&&/^(INPUT|SELECT)$/.test(ae.tagName))) return; }
  try{ await liveLoad(true); renderData(); if(manual) toast("Data diperbarui"); }
  catch(e){ if(e.code==="session_expired"){ toast("Sesi berakhir. Silakan masuk kembali.",true); logout(); return; } CONN={ok:false,msg:"Koneksi bermasalah, menampilkan data terakhir.",at:CONN.at}; setConn(); }
}
async function toggleLock(){
  const to=!LOCKED;
  if(!confirm(to?"Kunci seluruh penilaian project final? Penilai tidak dapat lagi menyimpan atau mengubah nilai sampai kunci dibuka.":"Buka kunci penilaian? Penilai dapat kembali menyimpan dan mengubah nilai.")) return;
  try{ const d=await apiPost({action:"final_lock",token:TOKEN,locked:to}); if(!d.ok) throw new Error(d.err||"gagal"); LOCKED=!!d.locked; toast(LOCKED?"Penilaian dikunci":"Kunci dibuka"); renderData(); }
  catch(e){ toast("Gagal mengubah kunci. Coba lagi.",true); }
}
let tt; function toast(m,err){ const e=$("#toast"); e.textContent=m; e.className="on"+(err?" err":""); clearTimeout(tt); tt=setTimeout(()=>e.className="",err?4500:2400); }
function setConn(){
  const p=$("#conn"), t=$("#connT"); if(!p) return;
  if(!ME){ p.className="sync-pill"; t.textContent="Belum masuk"; return; }
  p.className="sync-pill "+(CONN.ok?"online":"error"); t.textContent=CONN.ok?"Tersambung ke Google Sheets · "+ME.name:CONN.msg;
}

/* ---------- tampilan ---------- */
const hero=(sub,right,meta)=>`<section class="hero" aria-labelledby="page-title"><div class="hero-copy"><div class="eyebrow">Healthkathon 2026 · ${esc(CFG.tahap.nama)}</div><h1 id="page-title">Dashboard Hasil Penilaian Project Final</h1><p>${sub}</p><div class="hero-meta">${meta}</div></div><div class="hero-right">${right}</div></section>`;
function loginView(){
  $("#app").innerHTML=hero("Peringkat per kategori lomba, progres penilai, dan rekap skor yang dibaca langsung dari Google Sheets. Masuk dengan akun panitia (admin).","",`<span class="meta-chip">Data live dari Google Sheets</span><span class="meta-chip">Hanya untuk panitia</span>`)
  +`<section class="section"><div class="panel login-card"><h2>Masuk panitia</h2><p>Gunakan akun admin. Data tim dan skor baru dimuat setelah login.</p>
  <form id="lf" autocomplete="on"><label for="lu">Nama pengguna</label><input id="lu" autocomplete="username" required maxlength="80"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required maxlength="256">
  <button id="lbtn" type="submit">Masuk</button><div class="login-err" id="lerr" role="alert"></div></form></div></section>`;
  $("#lf").onsubmit=doLogin; setConn();
}
function stats(){
  const total=TEAMS.length, S={lengkap:0,sebagian:0,belum:0}; TEAMS.forEach(t=>S[statusOf(t)]++);
  let slots=0,full=0,part=0; TEAMS.forEach(t=>INFO[t.id].rs.forEach(r=>{ slots++; if(r.f===K) full++; else if(r.f>0) part++; }));
  const totals=RANK.map(t=>INFO[t.id].total), cal=TEAMS.filter(t=>{ const sp=INFO[t.id].spread; return sp!=null&&sp>CFG.selisih; });
  return {total,S,slots,full,part,none:slots-full-part,mean:avg(totals),cal};
}
function metric(cls,label,val,small){ return `<article class="metric ${cls}"><span>${label}</span><strong>${val}</strong><small>${small}</small></article>`; }
function pctOf(a,b){ return b?Math.round(a/b*100):0; }
function barRow(label,right,pc,gold){ return `<div><div class="progress-label"><span>${label}</span><span>${right}</span></div><div class="track"><div class="fill ${gold?"gold":""}" style="width:${pc}%"></div></div></div>`; }
function histogram(){
  const v=RANK.map(t=>INFO[t.id].total); if(!v.length) return `<p class="mini-note">Belum ada proyek yang selesai dinilai oleh semua penilainya. Sebaran muncul setelah ada data lengkap.</p>`;
  const lo=Math.floor(Math.min(...v)/5)*5, hi=Math.max(lo+15,Math.ceil((Math.max(...v)+0.001)/5)*5), n=(hi-lo)/5, b=Array.from({length:n},(_,i)=>({a:lo+i*5,n:0}));
  v.forEach(x=>{ b[Math.min(n-1,Math.floor((x-lo)/5))].n++; }); const mx=Math.max(1,...b.map(x=>x.n));
  return `<div class="chart-list">${b.map(x=>`<div class="chart-row" style="grid-template-columns:70px minmax(100px,2fr) 40px"><span class="chart-team">${x.a}-${x.a+5}</span><div class="chart-track"><div class="chart-fill" style="width:${x.n/mx*100}%"></div></div><span class="chart-score">${x.n}</span></div>`).join("")}</div><p class="chart-note">${v.length} proyek dengan skor akhir lengkap. Rata-rata ${fmt(avg(v))}, tertinggi ${fmt(Math.max(...v))}, terendah ${fmt(Math.min(...v))}.</p>`;
}
function categoryCards(){
  return cats().map((k,ix)=>{ const ts=TEAMS.filter(t=>t.kat===k), n=ts.length, S={lengkap:0,sebagian:0,belum:0}; ts.forEach(t=>S[statusOf(t)]++);
    const sc=ts.filter(t=>INFO[t.id].complete).map(t=>INFO[t.id].total);
    return `<article class="category-card"><h3>${esc(katShort(k))}</h3><div class="cat-total">${n} <small>proyek</small></div>
    <div class="cat-stats"><span class="tag">Lengkap ${S.lengkap}</span><span class="tag pending">Proses ${S.sebagian}</span><span class="tag closed">Belum ${S.belum}</span></div>
    <div class="cat-bar"><div class="cat-done" style="width:${pctOf(S.lengkap,n)}%"></div><div class="cat-pending" style="width:${pctOf(S.sebagian,n)}%"></div><div class="cat-locked" style="width:${pctOf(S.belum,n)}%"></div></div>
    <div class="cat-foot"><span>Rata-rata skor ${fmt(avg(sc))}</span><span>${pctOf(S.lengkap,n)}% lengkap</span></div>
    <div class="cat-foot"><span>Skor tertinggi ${sc.length?fmt(Math.max(...sc)):"-"}</span><span>${n} total</span></div></article>`; }).join("");
}
function podiums(){
  return cats().map((k,ix)=>{ const top=(CATLIST[k]||[]).slice(0,3);
    return `<div class="cat-title c${ix+1}">${esc(katShort(k))}</div>`+(top.length?`<div class="podium p3">${top.map((t,i)=>`<button type="button" class="podium-card" data-team="${esc(t.id)}"><div class="podium-top"><div class="medal">${i+1}</div><div><div class="podium-team">${esc(t.tim)}</div><div class="podium-sub">${esc(t.inov)}</div></div></div><div class="podium-score">${fmt(INFO[t.id].total)} <small>/ ${SMAX}</small></div></button>`).join("")}</div>`:`<p class="mini-note">Belum ada proyek yang lengkap dinilai pada kategori ini.</p>`); }).join("");
}
function criteriaBars(){
  return `<div class="chart-list">${C.map((c,k)=>{ const v=avg(RANK.map(t=>INFO[t.id].crit[k]).filter(x=>x!=null));
    return `<div class="chart-row" style="grid-template-columns:minmax(110px,1.3fr) minmax(90px,2fr) 50px"><span class="chart-team" title="${esc(c.n)}">${esc(c.n.split(/[(,]/)[0].trim())} <span style="color:var(--muted)">${Math.round(c.w*100)}%</span></span><div class="chart-track"><div class="chart-fill" style="width:${v!=null?v/SMAX*100:0}%"></div></div><span class="chart-score">${fmt(v)}</span></div>`; }).join("")}</div><p class="chart-note">Rata-rata skor 0-${SMAX} dari proyek yang lengkap dinilai.</p>`;
}
function reviewerBars(){
  const rows=REVIEWERS.map(r=>{ const mine=TEAMS.filter(t=>t.rv.includes(r.u)); let d=0,p=0; mine.forEach(t=>{ const x=getRow(t.id,r.u), f=x?nFill(x.s):0; if(f===K) d++; else if(f>0) p++; }); return {r,all:mine.length,d,p}; });
  return `<div class="progress-list" style="gap:11px">${rows.map(x=>`<div class="rev-row"><span class="nm" title="${esc(x.r.name)}">${esc(x.r.name)}</span><div class="stack"><i class="s1" style="width:${pctOf(x.d,x.all)}%"></i><i class="s2" style="width:${pctOf(x.p,x.all)}%"></i></div><span class="ct">${x.d}/${x.all}</span></div>`).join("")}</div>
  <p class="chart-note"><span class="swatch" style="display:inline-block"></span> selesai &nbsp; <span class="swatch gold" style="display:inline-block"></span> draft/sebagian &nbsp; sisanya belum dinilai.</p>`;
}
function calibration(){
  const L=TEAMS.filter(t=>{ const s=INFO[t.id].spread; return s!=null&&s>CFG.selisih; }).sort((a,b)=>INFO[b.id].spread-INFO[a.id].spread).slice(0,8);
  if(!L.length) return `<p class="mini-note">Belum ada proyek dengan selisih skor antar penilai lebih dari ${CFG.selisih} poin.</p>`;
  return L.map(t=>{ const i=INFO[t.id], sc=i.rs.filter(r=>r.score!=null).map(r=>r.score), a=Math.min(...sc), b=Math.max(...sc);
    return `<div class="cal-row" data-team="${esc(t.id)}"><div class="cal-n">${esc(t.tim)}<small>${esc(katShort(t.kat))}</small></div><div class="rng" title="Skor penilai ${sc.map(x=>fmt(x)).join(", ")}"><i style="left:${a}%;width:${Math.max(1,b-a)}%"></i>${sc.map(x=>`<b style="left:calc(${x}% - 1px)"></b>`).join("")}</div><div class="cal-v">${fmt(i.spread,1)} poin</div></div>`; }).join("")
   +`<p class="chart-note">Garis menunjukkan rentang skor antar penilai (0-${SMAX}). Klik proyek untuk melihat skor per penilai.</p>`;
}
const median=a=>{ if(!a.length) return null; const b=a.slice().sort((x,y)=>x-y), m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; };
const sdev=a=>{ if(a.length<2) return null; const m=avg(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1)); };
function pearson(x,y){ const n=x.length; if(n<3) return null; const mx=avg(x), my=avg(y); let sxy=0,sx=0,sy=0; for(let i=0;i<n;i++){ sxy+=(x[i]-mx)*(y[i]-my); sx+=(x[i]-mx)**2; sy+=(y[i]-my)**2; } return sx&&sy?sxy/Math.sqrt(sx*sy):null; }
const fmtDur=sec=>sec==null?"-":sec>=60?Math.floor(sec/60)+" mnt "+(sec%60)+" dtk":sec+" dtk";
const fmtWhen=ms=>ms?new Date(ms).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"-";
/* Per penilai: susun riwayat simpan -> sesi -> waktu per proyek. Penilaian ulang (edit setelah lengkap) dihitung: waktunya DIJUMLAHKAN ke proyek yang sama,
   sehingga indikasi "terlalu singkat" yang lama gugur otomatis bila total waktu kini mencapai ambang. */
function reviewerSessions(rv,A){
  const sess=(A.jeda_sesi_menit||90)*60000, minSec=A.min_durasi_detik||300;
  const akt=AUDIT.akt.filter(x=>x[2]===rv.u&&x[3]>0);
  let saves=AUDIT.log.filter(x=>x[2]===rv.u).map(x=>({id:x[1],t:Date.parse(x[0]),b:x[3],a:x[4]})).filter(x=>x.t).sort((p,q)=>p.t-q.t);
  const hasLog=saves.length>0;
  if(!hasLog){ /* server lama tanpa riwayat: pakai waktu simpan terakhir tiap proyek */
    saves=[]; TEAMS.forEach(t=>{ if(!t.rv.includes(rv.u)) return; const r=getRow(t.id,rv.u); if(r&&r.t) saves.push({id:t.id,t:r.t,b:"",a:r.s.join(",")}); }); saves.sort((p,q)=>p.t-q.t);
  }
  const filled=str=>String(str||"").split(",").filter(x=>x!=="").length;
  saves.forEach((sv,i)=>{ const m=akt.find(x=>x[1]===sv.id&&Math.abs(Date.parse(x[0])-sv.t)<=3000);
    if(m){ sv.sec=m[3]; sv.src="meter"; sv.away=m[4]; sv.vid=m[5]; }
    else if(i>0&&sv.t-saves[i-1].t<=sess){ sv.sec=Math.round((sv.t-saves[i-1].t)/1000); sv.src="jeda"; }
    sv.full=filled(sv.a)===K; sv.changed=sv.a!==sv.b; });
  const byId={}; saves.forEach(sv=>(byId[sv.id]=byId[sv.id]||[]).push(sv));
  const items=[], revisions=[];
  Object.keys(byId).forEach(id=>{
    const L=byId[id], fi=L.findIndex(x=>x.full); if(fi<0) return;           /* belum pernah lengkap: belum dinilai penuh */
    const init=L.slice(0,fi+1), rev=L.slice(fi+1).filter(x=>x.full&&x.changed);
    const sum=arr=>{ const v=arr.map(x=>x.sec).filter(x=>x!=null); return v.length?v.reduce((p,q)=>p+q,0):null; };
    const tInit=sum(init), tRev=sum(rev), tAll=sum(init.concat(rev)), src=init.concat(rev).some(x=>x.src==="jeda")?"jeda":"meter";
    items.push({id,sec:tAll,src,first:init[init.length-1].t});
    if(rev.length) revisions.push({id,n:rev.length,at:rev[rev.length-1].t,tInit,tRev,tAll,gugur:tInit!=null&&tInit<minSec&&tAll!=null&&tAll>=minSec,masihCepat:tAll!=null&&tAll<minSec,firstRev:rev[0].t});
  });
  return {items,revisions,saves,hasLog};
}
function auditStats(){
  const A=CFG.audit||{}, minSec=A.min_durasi_detik||300;
  const allScores=TEAMS.flatMap(t=>INFO[t.id].rs.filter(r=>r.score!=null).map(r=>r.score)), grand=avg(allScores);
  return REVIEWERS.map(rv=>{
    const done=[]; TEAMS.forEach(t=>{ if(!t.rv.includes(rv.u)) return; const row=getRow(t.id,rv.u); if(row&&nFill(row.s)===K){ const others=INFO[t.id].rs.filter(r=>r.u!==rv.u&&r.score!=null).map(r=>r.score); done.push({t,row,score:pct(row.s),oth:others.length?avg(others):null}); } });
    const n=done.length, sc=done.map(d=>d.score), mean=avg(sc), sd=sdev(sc);
    const uni=done.filter(d=>Math.max(...d.row.s)-Math.min(...d.row.s)<=(A.seragam_rentang||2)).length, uniPct=n?uni/n*100:null;
    const pairs=done.filter(d=>d.oth!=null), mad=pairs.length?avg(pairs.map(d=>Math.abs(d.score-d.oth))):null, corr=pairs.length>=(A.min_data||8)?pearson(pairs.map(d=>d.score),pairs.map(d=>d.oth)):null;
    const notes=done.map(d=>(d.row.c||"").trim().toLowerCase().replace(/\s+/g," ")).filter(Boolean), dupNotes=notes.length-new Set(notes).size, notePct=n?notes.length/n*100:null;
    const S=reviewerSessions(rv,A), doneIds=new Set(done.map(d=>d.t.id));
    const items=S.items.filter(x=>doneIds.has(x.id)&&x.sec!=null), durs=items.map(x=>x.sec), med=median(durs), nJeda=items.filter(x=>x.src==="jeda").length;
    const quick=items.filter(x=>x.sec<minSec).sort((a,b)=>a.sec-b.sec), quickPct=durs.length?quick.length/durs.length*100:null;
    const win=(A.burst_menit||15)*60000, ts=S.items.map(x=>x.first).sort((a,b)=>a-b); let burst=0; for(let i=0,j=0;i<ts.length;i++){ while(ts[i]-ts[j]>win) j++; burst=Math.max(burst,i-j+1); }
    const lg=AUDIT.akt.filter(x=>x[2]===rv.u&&x[3]>0), noVid=lg.length?lg.filter(x=>!x[5]).length/lg.length*100:null, away0=lg.length?lg.filter(x=>!x[4]).length/lg.length*100:null;
    const warns=AUDIT.warn.filter(w=>w[1]===rv.u).map(w=>({t:Date.parse(w[0]),note:w[2]})).sort((a,b)=>a.t-b.t), warnAt=warns.length?warns[warns.length-1].t:null;
    const rv_=S.revisions, nRev=rv_.length, nGugur=rv_.filter(x=>x.gugur).length, nMasih=rv_.filter(x=>x.masihCepat).length;
    const revAfter=warnAt?rv_.filter(x=>x.at>warnAt):[], gugurAfter=revAfter.filter(x=>x.gugur).length;
    const enough=n>=(A.min_data||8), F=[], mnt=Math.round(minSec/60); let strong=false;
    if(durs.length>=5&&((med!=null&&med<minSec)||quickPct>=(A.proyek_cepat_persen||25))){ F.push("Waktu per proyek di bawah "+mnt+" menit ("+quick.length+" dari "+durs.length+" proyek)"); if(quickPct>=(A.proyek_cepat_kuat_persen||50)) strong=true; }
    if(burst>=(A.burst_proyek||8)) F.push("Banyak simpan beruntun ("+burst+" dalam "+(A.burst_menit||15)+" menit)");
    if(enough&&((uniPct>=(A.seragam_persen||30))||(sd!=null&&sd<(A.sd_min||3)))) F.push("Skor seragam");
    if(enough&&grand!=null&&Math.abs(mean-grand)>(A.bias_poin||8)) F.push(mean>grand?"Cenderung lebih longgar":"Cenderung lebih ketat");
    if(pairs.length>=(A.min_data||8)&&((mad!=null&&mad>(A.mad_poin||12))||(corr!=null&&pairs.length>=15&&corr<(A.korelasi_min||0.2)))) F.push("Menyimpang dari penilai lain");
    if(dupNotes>=2) F.push("Catatan identik berulang");
    if(lg.length>=5&&noVid>(A.video_tak_dibuka_persen||60)&&away0>=80) F.push("Tidak membuka video dan tidak meninggalkan tab");
    return {rv,n,mean,sd,uniPct,mad,corr,notePct,dupNotes,med,burst,noVid,logN:durs.length,F,enough,grand,quick,quickPct,strong,minSec,nJeda,revisions:rv_,nRev,nGugur,nMasih,warnAt,warns,revAfter,gugurAfter};
  });
}
function auditPanel(){
  const R=auditStats(), A=CFG.audit||{};

    const md=x.med==null?null:(x.nJeda>x.logN/2?"≈ ":"")+(x.med>=120?Math.round(x.med/60*10)/10+" mnt":Math.round(x.med)+" dtk");
    const qTxt=x.quickPct==null?null:x.quick.length+"/"+x.logN+" ("+Math.round(x.quickPct)+"%)", qBad=x.logN>=5&&x.quickPct>=(A.proyek_cepat_persen||25);
    const revTxt=x.nRev?x.nRev+" proyek"+(x.nGugur?` · <span style="color:#26734b">${x.nGugur} gugur</span>`:"")+(x.nMasih?` · <span style="color:#9a6a16">${x.nMasih} masih singkat</span>`:""):"-";
    const sec=(title,list)=>list.length?`<div style="margin:6px 0"><b>${title}</b> ${list.join("")}</div>`:"";
    const link=(id,txt)=>`<a href="#" data-team="${esc(id)}" style="color:#123e6e;font-weight:700;margin-right:12px">#${esc(id)} (${txt})</a>`;
    const detail=(x.quick.length||x.nRev||x.warns.length)?`<tr class="aud-det" hidden><td colspan="12" style="text-align:left;background:#f8faf9;line-height:1.7">
      ${x.warns.length?`<div style="margin:2px 0"><b>Diingatkan:</b> ${x.warns.map(w=>fmtWhen(w.t)+(w.note?" ("+esc(w.note)+")":"")).join("; ")}${x.warnAt?` · revisi sesudah peringatan terakhir: <b>${x.revAfter.length} proyek</b>${x.revAfter.length?` (${x.gugurAfter} indikasi gugur)`:""}`:""}</div>`:""}
      ${sec(`Masih di bawah ${Math.round(x.minSec/60)} menit (${x.quick.length}):`,x.quick.slice(0,40).map(q=>link(q.id,(q.src==="jeda"?"≈ ":"")+fmtDur(q.sec))))}
      ${sec(`Ditinjau ulang (${x.nRev}):`,x.revisions.sort((a,b)=>b.at-a.at).slice(0,40).map(r=>link(r.id,`${r.n}x, ${fmtWhen(r.at)}; awal ${fmtDur(r.tInit)} → total ${fmtDur(r.tAll)}${r.tRev==null?" · waktu peninjauan tidak terukur":r.gugur?" · INDIKASI GUGUR":r.masihCepat?" · masih singkat":""}`)))}</td></tr>`:"";
    return `<tr class="aud-main" ${detail?'style="cursor:pointer" title="Klik untuk rincian"':""}><td>${esc(x.rv.name)}${x.warnAt?`<div style="font-weight:600;font-size:11px;color:var(--muted)">Diingatkan ${fmtWhen(x.warnAt)}</div>`:""}<div class="aud-fl">${x.F.map(f=>`<span>${esc(f)}</span>`).join("")}${x.nGugur?`<span class="okc">${x.nGugur} indikasi gugur setelah ditinjau ulang</span>`:""}</div><button type="button" class="aud-warn" data-warn="${esc(x.rv.u)}">Tandai sudah diingatkan</button></td><td>${x.n}</td>
    ${cell(x.med,md,x.med!=null&&x.logN>=5&&x.med<x.minSec)}${cell(x.quickPct,qTxt,qBad)}<td class="${x.nMasih?"warn":x.nRev?"ok":""}">${revTxt}</td>${cell(x.mean,fmt(x.mean)+(x.grand!=null?` <small style="color:var(--muted)">(${x.mean>=x.grand?"+":""}${fmt(x.mean-x.grand)})</small>`:""),x.enough&&x.grand!=null&&Math.abs(x.mean-x.grand)>(A.bias_poin||8))}
    ${cell(x.sd,fmt(x.sd),x.enough&&x.sd!=null&&x.sd<(A.sd_min||3))}${cell(x.uniPct,Math.round(x.uniPct)+"%",x.enough&&x.uniPct>=(A.seragam_persen||30))}${cell(x.mad,fmt(x.mad),x.mad!=null&&x.enough&&x.mad>(A.mad_poin||12))}${cell(x.corr,x.corr==null?"-":x.corr.toFixed(2).replace(".",","),x.corr!=null&&x.n>=15&&x.corr<(A.korelasi_min||0.2))}
    ${cell(x.notePct,Math.round(x.notePct)+"%"+(x.dupNotes?` (${x.dupNotes} ganda)`:""),x.dupNotes>=2)}<td><span class="aud-st ${st[0]}">${st[1]}</span></td></tr>${detail}`; }).join("");

  <div class="grid metrics">${metric("","Total proyek",total,"Mengirim project final")}${metric("","Lengkap dinilai",st.S.lengkap,"Semua penilai sudah mengisi")}${metric("gold","Dalam proses",st.S.sebagian,"Sebagian penilai sudah mengisi")}${metric("blue","Belum dinilai",st.S.belum,"Belum ada skor masuk")}${metric("","Rata-rata skor",fmt(st.mean),"Skor akhir proyek lengkap")}${metric("red","Perlu kalibrasi",st.cal.length,"Selisih penilai > "+CFG.selisih+" poin")}</div></section>
  <section class="section grid twocol"><article class="panel"><h3>Progres penilaian</h3><p class="panel-intro">Proyek yang lengkap dinilai dan penilaian yang sudah masuk dari seluruh penilai.</p><div class="progress-list">${barRow("Proyek lengkap dinilai",st.S.lengkap+" / "+total,pctOf(st.S.lengkap,total))}${barRow("Penilaian lengkap (penilai x proyek)",st.full+" / "+st.slots,pctOf(st.full,st.slots))}${barRow("Draft / sebagian",st.part+" / "+st.slots,pctOf(st.part,st.slots),true)}</div>
  <div class="submetrics"><div class="submetric"><strong>${pctOf(st.S.lengkap,total)}%</strong><span>PROGRES PROYEK</span></div><div class="submetric"><strong>${pctOf(st.full,st.slots)}%</strong><span>PROGRES PENILAIAN</span></div><div class="submetric"><strong>${REVIEWERS.length}</strong><span>PENILAI</span></div><div class="submetric"><strong>${CFG.perProyek}</strong><span>PENILAI / PROYEK</span></div></div></article>
  <article class="panel"><h3>Sebaran skor akhir</h3><p class="panel-intro">Jumlah proyek pada tiap rentang skor (hanya proyek yang lengkap dinilai).</p>${histogram()}</article></section>
  <section class="section"><div class="section-head"><div><h2>Rekap per Kategori Lomba</h2><p>Jumlah proyek, status penilaian, dan rata-rata skor tiap kategori.</p></div></div><div class="grid categories">${categoryCards()}</div></section>
  <section class="section panel"><div class="section-head"><div><h2>Tiga skor tertinggi per kategori</h2><p>Berdasarkan skor akhir. Klik kartu untuk melihat skor per penilai.</p></div></div>${podiums()}</section>
  <section class="section grid twocol"><article class="panel"><h3>Rata-rata skor per kriteria</h3><p class="panel-intro">Perbandingan kekuatan proyek pada tiap kriteria.</p>${criteriaBars()}</article><article class="panel"><h3>Progres per penilai</h3><p class="panel-intro">Jumlah proyek yang sudah selesai dinilai tiap penilai.</p>${reviewerBars()}</article></section>
  <section class="section panel"><div class="section-head"><div><h2>Indikator kualitas penilaian per penilai</h2><p>Pola waktu, keseragaman, kecenderungan, dan kesesuaian skor tiap penilai terhadap penilai lain.</p></div></div>${auditPanel()}</section>
  <section class="section grid twocol"><article class="panel"><h3>Perlu kalibrasi</h3><p class="panel-intro">Proyek dengan selisih skor antar penilai terbesar (lebih dari ${CFG.selisih} poin).</p>${calibration()}</article>${rulesPanel()}</section>
  <section class="section panel"><div class="section-head"><div><h2>Peringkat per kategori</h2><p>Tiga daftar peringkat terpisah, urut dari skor tertinggi, tanpa batas lulus.</p></div></div>
  <div class="toolbar"><input id="rq" type="search" placeholder="Cari nama tim, judul, atau ID" aria-label="Cari" value="${esc(V.q)}"><select id="rk" aria-label="Kategori"><option value="all">Semua kategori</option>${cats().map(c=>`<option value="${esc(c)}"${V.kat===c?" selected":""}>${esc(katShort(c))}</option>`).join("")}</select>
  <select id="rs" aria-label="Status">${[["all","Semua status"],["lengkap","Lengkap"],["sebagian","Sebagian"],["belum","Belum dinilai"]].map(([k,l])=>`<option value="${k}"${V.f===k?" selected":""}>${l}</option>`).join("")}</select><span class="result-count" id="rcount"></span></div>
  <div id="tables"></div><p class="mini-note">Tanda * pada skor menunjukkan rata-rata sementara (belum semua penilai selesai); proyek tersebut belum diberi nomor peringkat.</p></section>`;
  document.querySelectorAll("[data-warn]").forEach(b=>b.onclick=async e=>{ e.stopPropagation(); const key=b.dataset.warn, nm=(UN[key]||key);
    const note=prompt("Catatan peringatan untuk "+nm+" (opsional, mis. alasan atau tanggal pemberitahuan):",""); if(note===null) return;
    try{ const d=await apiPost({action:"final_lock",token:TOKEN,warn:key,note:note}); if(!d.ok) throw new Error(d.err||"gagal"); toast("Peringatan untuk "+nm+" tercatat"); refreshNow(true); }
    catch(err){ toast(err&&/not_assigned|role_not_allowed/.test(err.message)?"Peringatan ditolak server.":"Gagal mencatat peringatan. Pastikan Final.gs terbaru sudah di-deploy.",true); } });
  document.querySelectorAll(".aud-main").forEach(r=>r.onclick=e=>{ if(e.target.closest("a")||e.target.closest("button")) return; const n=r.nextElementSibling; if(n&&n.classList.contains("aud-det")) n.hidden=!n.hidden; });
  $("#rf").onclick=()=>refreshNow(true); $("#lk").onclick=toggleLock; $("#dl").onclick=csvDownload;
  $("#rq").oninput=e=>{ V.q=e.target.value; renderTables(); }; $("#rk").onchange=e=>{ V.kat=e.target.value; renderTables(); }; $("#rs").onchange=e=>{ V.f=e.target.value; renderTables(); };
  renderTables(); bindTeams(); setConn();
}
function render(){
  if(LOADING){ $("#app").innerHTML=hero("Memuat data dari Google Sheets...","",""); setConn(); return; }
  if(!ME){ loginView(); return; }
  renderData();
}
function bindTeams(){ document.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>openTeam(b.dataset.team)); }

/* ---------- detail proyek ---------- */
const SUBL=["Latar belakang","Tujuan","Deskripsi solusi","Dampak"];
function openTeam(id){
  const t=TB[id]; if(!t) return; const i=INFO[id], rk=CATRANK[id];
  const L=(l,u)=>u?`<div><span style="color:var(--muted)">${l}:</span> ${/^https?:\/\//i.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`:esc(u)}</div>`:"";
  $("#drawer").innerHTML=`<button class="x" type="button" aria-label="Tutup" id="dx">&times;</button><div class="ey">#${esc(t.id)} · ${esc(katShort(t.kat))}${rk?` · Peringkat ${rk} di kategorinya`:""}</div><h2>${esc(t.tim)}</h2><p class="sub">${esc(t.inov)}</p>
  <div class="dkpis"><div class="dkpi"><b>${i.complete?fmt(i.total):"-"}</b><span>Skor akhir</span></div><div class="dkpi"><b>${i.done}/${i.N}</b><span>Penilai selesai</span></div><div class="dkpi"><b>${i.spread!=null?fmt(i.spread,0):"-"}</b><span>Selisih antar penilai</span></div></div>
  <div class="dlinks">${L("Video presentasi dan demo",t.vid)}${L("Berkas peserta",t.mat)}${CFG.spFinal?`<div><span style="color:var(--muted)">Folder berkas:</span> <a href="${esc(CFG.spFinal)}" target="_blank" rel="noopener noreferrer">Buka di SharePoint</a></div>`:""}</div>
  <table class="mtx"><thead><tr><th>Penilai</th>${C.map(c=>`<th title="${esc(c.n)}">${esc(c.n.split(/[ ,&(]/)[0])}</th>`).join("")}<th>Skor</th></tr></thead><tbody>
  ${i.rs.map(r=>`<tr><td>${esc(UN[r.u]||r.u)}</td>${r.s.map(v=>`<td>${v!=null?v:"-"}</td>`).join("")}<td><b>${r.score!=null?fmt(r.score):"-"}</b></td></tr>`).join("")}
  <tr style="font-weight:800"><td>Rata-rata</td>${i.crit.map(v=>`<td>${v!=null?fmt(v,1):"-"}</td>`).join("")}<td>${i.interim!=null?fmt(i.interim):"-"}</td></tr></tbody></table>
  ${i.rs.filter(r=>r.c).map(r=>`<div style="margin-top:12px"><b style="font-size:13px">Catatan ${esc(UN[r.u]||r.u)}</b><div class="note">${esc(r.c)}</div></div>`).join("")}
  <h3 style="margin:18px 0 6px;font-size:15px">Data submisi peserta</h3>${(t.sub||[]).map((x,j)=>`<div class="dsec"><h4>${SUBL[j]}</h4><p>${esc(x)}</p></div>`).join("")}`;
  $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); $("#dx").onclick=closeDrawer; $("#drawer").scrollTop=0;
}
function closeDrawer(){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#scrim").onclick=closeDrawer; document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });

/* ---------- unduh CSV ---------- */
function csvDownload(){
  const rows=[["Kategori","Peringkat kategori","ID","Tim","Judul","Status","Skor akhir","Skor sementara",...C.map(c=>c.n+" (rata-rata)"),"Selisih penilai"]];
  cats().forEach(k=>sortCat(TEAMS.filter(t=>t.kat===k)).forEach(t=>{ const i=INFO[t.id]; rows.push([katShort(k),CATRANK[t.id]||"",t.id,t.tim,t.inov,statusOf(t),i.total!=null?i.total.toFixed(2):"",i.interim!=null?i.interim.toFixed(2):"",...i.crit.map(v=>v!=null?v.toFixed(2):""),i.spread!=null?i.spread.toFixed(1):""]); }));
  const csv="﻿"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download="Peringkat Penilaian Project Final per Kategori.csv"; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- mulai ---------- */
if(TOKEN){ liveLoad(false).then(()=>{ LOADING=false; render(); }).catch(()=>{ LOADING=false; TOKEN=""; ME=null; try{sessionStorage.removeItem(SSK)}catch(_){} render(); }); }
render();
setInterval(()=>refreshNow(false),REFRESH);
</script>
</body>
</html>
